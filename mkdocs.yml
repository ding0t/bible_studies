site_name: The Way
site_url: 'https://ding0t.github.io/bible_studies/'
repo_url: 'https://github.com/ding0t/bible_studies'
docs_dir: docs/content
# Rendered in the site footer. ESV/NIV/NKJV/CSB/NASB each require a copyright notice wherever their
# text is quoted, so the footer links to the page carrying them -- see docs/content/about/copyright.md.
# This value is raw HTML and is NOT run through mkdocs' markdown link resolution, so it needs a
# site-absolute built URL ('/bible_studies/about/copyright/'), not a relative '.md' path -- a '.md'
# path here ships to the browser verbatim and 404s. Keep the prefix in sync with site_url above.
copyright: 'Scripture quotations are used by permission — see <a href="/bible_studies/about/copyright/">Copyright &amp; Scripture Permissions</a>'

theme:
  name: material
  favicon: assets/img/favicon.svg
  palette:
    # Defaults to the visitor's OS-level preference, then remembers their explicit choice.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - toc.follow
    - navigation.tracking
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.indexes

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  # enable code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # allow inclusion of files outside docs
  - pymdownx.snippets
  - pymdownx.details
  # use pretty task lists
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # emojis - search here https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg