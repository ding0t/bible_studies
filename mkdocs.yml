site_name: The Way
# Served from the custom domain at its root -- GitHub Pages carries cname the-way.lewy.au, and
# github.io/bible_studies 301s there. This was still the github.io sub-path URL until 2026-08-23,
# which made every site-absolute '/bible_studies/...' link on the site a 404 on the live domain.
site_url: 'https://the-way.lewy.au/'
repo_url: 'https://github.com/ding0t/bible_studies'
docs_dir: docs/content
# Rendered in the site footer. ESV/NIV/NKJV/CSB/NASB each require a copyright notice wherever their
# text is quoted, so the footer links to the page carrying them -- see docs/content/about/copyright.md.
# This value is raw HTML and is NOT run through mkdocs' markdown link resolution, so it needs a
# site-absolute built URL ('/about/copyright/'), not a relative '.md' path -- a '.md' path here
# ships to the browser verbatim and 404s. Site-absolute is from the domain root: no repo prefix.
copyright: 'Scripture quotations are used by permission — see <a href="/about/copyright/">Copyright &amp; Scripture Permissions</a>'

theme:
  name: material
  favicon: assets/img/favicon.svg
  palette:
    # Defaults to the visitor's OS-level preference, then remembers their explicit choice.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - toc.follow
    - navigation.tracking
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.indexes

plugins:
  - search
  - awesome-pages
  # Faceted tags -- see docs/content/about/our-taxonomy.md. Directory carries subject;
  # tags carry the other axes (method/, lang/, status/, audience/).
  # tags_hierarchy renders those prefixes as a real hierarchy rather than flat strings.
  # The index page is docs/content/tags.md, marked with the material/tags directive.
  - tags:
      tags_hierarchy: true
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  # Preserves the pre-2026-08 URLs from before the subject-taxonomy migration.
  # See docs/content/about/our-taxonomy.md and docs/dev/taxonomy-migration.md.
  - redirects:
      redirect_maps:
        'bible/commentaries/01-genesis/chapter-001.md': 'commentaries/01-genesis/chapter-001.md'
        'bible/commentaries/01-genesis/chapter-002.md': 'commentaries/01-genesis/chapter-002.md'
