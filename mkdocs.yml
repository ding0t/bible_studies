# There was no extra_css key at all before 2026-08, so hero-verses.css was never
# loaded despite docs/content/index.md using its .hero-verses class.
# assets/stylesheets/enumerate-headings.css is deliberately NOT loaded: its rules
# are unscoped (body counter-reset + h2:before), so it would auto-number every
# heading on every page site-wide, not just where numbering is wanted.
extra_css:
  - assets/stylesheets/hero-verses.css

# Link checking. mkdocs --strict already fails on a bad FILE path, but said nothing about a
# bad #anchor -- a link to a heading that has been renamed or never existed would build clean
# and silently drop the reader at the top of the page. anchors: warn closes that gap, and the
# site currently has zero of them, so --strict stays green.
#
# unrecognized_links and absolute_links are deliberately left at their defaults (info). Raising
# them to warn flags 66 links that all actually work: the directory-style links section_index.py
# generates into commentaries/index.md ('45-romans/' resolves to 45-romans/index.html), and the
# deliberate links out to the Astro-served tools at /timeline/ and /genealogy/, which sit outside
# docs_dir by design. Under --strict those would become errors and drown the anchor signal.
validation:
  anchors: warn

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  # enable code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # allow inclusion of files outside docs
  - pymdownx.snippets
  - pymdownx.details
  # use pretty task lists
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # emojis - search here https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg