# Copy to references/study-state/<slug>.yml when starting a new study.
# slug should match the eventual docs/content/... filename (without extension).

slug: ""
title: ""
status: scoping # scoping | exegesis | hermeneutics | cross-reference | drafting | review | published
target_path: "" # e.g. docs/content/studies/prophecy/<slug>.md

primary_passage: ""
supporting_passages: []
# Phase 1: what this site already says about these chapters (cross_study_claims.py "<Book> <N>").
# use: link | build-on | enrich | none. note records what was decided, including enrichment
# offered back to that study after drafting.
sibling_studies: [] # [{slug: "", role: primary|cited|prose, use: "", note: ""}]
genre: [] # one or more of: epistle, ot-narrative, acts, gospel, parable, law, prophets, psalm, wisdom, apocalyptic, topical

# Written before drafting (Phase 7). The thesis becomes the page's "In one sentence:" line; the
# outline is the mind map, and becomes the page's Study outline when the study needs one.
thesis: ""
outline: [] # [{section: "", says: ""}] -- one line per section, each serving the thesis
word_budget: 4000 # validator Check 23 reads this. Raise it only with a reason on the next line.
word_budget_reason: ""

stages:
  scoping:
    done: false
    notes: ""
  exegesis:
    historical_context:
      done: false
      notes: ""
    literary_context:
      done: false
      notes: ""
    content_word_studies:
      done: false
      notes: ""
      terms: [] # [{word: "", language: hebrew|aramaic|greek, transliteration: "", strongs_id: "", gloss: "", range_of_meanings: [], notes: ""}] # range_of_meanings/notes are for the fuller diachronic/synchronic method — see word-study-method.md; leave empty for routine terms
  hermeneutics:
    cultural_vs_transcultural:
      done: false
      notes: ""
    theological_principle:
      done: false
      notes: ""
    application_draft:
      done: false
      notes: ""
  cross_reference:
    done: false
    cross_refs: [] # [{ref: "", relation: ""}]
    translations_compared: [] # e.g. ["ESV", "NASB", "NIV"]
    divergences_noted: ""
  drafting:
    done: false
    file: ""
  review:
    done: false
    validated: false # npm run validate passed

open_questions: []
resources_consulted: [] # [{type: dictionary|lexicon|commentary|other, title: "", author: "", note: ""}]
last_updated: "" # ISO date, set by the agent/user at each update
