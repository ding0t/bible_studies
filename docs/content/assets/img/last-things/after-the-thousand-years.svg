<rect x="28.0" y="198.0" width="154.0" height="78" rx="5" fill="#fffdf7" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="36.0" y="216.4" font-size="13.5" fill="#3b2f1e" font-weight="bold">Bound in the</text>
<text x="36.0" y="233.4" font-size="13.5" fill="#3b2f1e">abyss, a</text>
<text x="36.0" y="250.4" font-size="13.5" fill="#3b2f1e">thousand years</text>
<text x="36.0" y="267.4" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:1-3</text>
<rect x="198.0" y="198.0" width="154.0" height="78" rx="5" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="206.0" y="216.4" font-size="13.5" fill="#3b2f1e" font-weight="bold">The first</text>
<text x="206.0" y="233.4" font-size="13.5" fill="#3b2f1e">resurrection:</text>
<text x="206.0" y="250.4" font-size="13.5" fill="#3b2f1e">“blessed and holy”</text>
<text x="206.0" y="267.4" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:4-6</text>
<rect x="368.0" y="198.0" width="154.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="376.0" y="216.4" font-size="13.5" fill="#3b2f1e" font-weight="bold">The earth stands;</text>
<text x="376.0" y="233.4" font-size="13.5" fill="#3b2f1e">the kingdom on it</text>
<text x="376.0" y="250.4" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:4</text>
<rect x="538.0" y="198.0" width="154.0" height="78" rx="5" fill="#fffdf7" stroke="#c4471c" stroke-width="1.4"/>
<text x="546.0" y="216.4" font-size="13.5" fill="#3b2f1e" font-weight="bold">“In flaming fire”</text>
<text x="546.0" y="233.4" font-size="13.5" fill="#3b2f1e">on the living</text>
<text x="546.0" y="250.4" font-size="13.5" fill="#3b2f1e">nations</text>
<text x="546.0" y="267.4" font-size="12.0" fill="#6b5a3e" font-style="italic">2 Thess 1:8; Lk 17:30</text>
<rect x="24" y="298" width="672" height="150" fill="#e8c46a" stroke="#a67c3d" stroke-width="2"/>
<text x="360.0" y="348.0" font-size="22" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE THOUSAND YEARS</text>
<text x="360.0" y="376.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">the seventh day · the Sabbath of the week of history</text>
<text x="360.0" y="400.0" font-size="14" fill="#3b2f1e" text-anchor="middle">Christ reigns; His saints reign with Him</text>
<text x="360.0" y="424.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Revelation 20:2-7 · Hebrews 4:9</text>
<path d="M24 470 H696" stroke="#3b2f1e" stroke-width="1.2"/>
<text x="360.0" y="492.0" font-size="14" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1.5" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">AFTER THE THOUSAND YEARS</text>
<rect x="28.0" y="506.0" width="154.0" height="95" rx="5" fill="#fffdf7" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="36.0" y="524.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Released for a</text>
<text x="36.0" y="541.5" font-size="13.5" fill="#3b2f1e">little while;</text>
<text x="36.0" y="558.5" font-size="13.5" fill="#3b2f1e">deceives the</text>
<text x="36.0" y="575.5" font-size="13.5" fill="#3b2f1e">nations</text>
<text x="36.0" y="592.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:3, 7-8</text>
<rect x="368.0" y="506.0" width="154.0" height="95" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="376.0" y="524.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Gog and Magog</text>
<text x="376.0" y="541.5" font-size="13.5" fill="#3b2f1e">surround “the</text>
<text x="376.0" y="558.5" font-size="13.5" fill="#3b2f1e">camp of the</text>
<text x="376.0" y="575.5" font-size="13.5" fill="#3b2f1e">saints”</text>
<text x="376.0" y="592.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:8-9</text>
<rect x="538.0" y="506.0" width="154.0" height="78" rx="5" fill="#fffdf7" stroke="#c4471c" stroke-width="1.4"/>
<text x="546.0" y="524.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">“Fire came down</text>
<text x="546.0" y="541.5" font-size="13.5" fill="#3b2f1e">from heaven and</text>
<text x="546.0" y="558.5" font-size="13.5" fill="#3b2f1e">consumed them”</text>
<text x="546.0" y="575.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:9</text>
<rect x="28.0" y="611.0" width="154.0" height="61" rx="5" fill="#fffdf7" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="36.0" y="629.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Thrown into the</text>
<text x="36.0" y="646.5" font-size="13.5" fill="#3b2f1e">lake of fire</text>
<text x="36.0" y="663.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:10</text>
<path d="M24 694 H696" stroke="#8b1e1e" stroke-width="1.2"/>
