<rect x="198.0" y="730.0" width="154.0" height="95" rx="5" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="206.0" y="748.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">The rest of the</text>
<text x="206.0" y="765.5" font-size="13.5" fill="#3b2f1e">dead raised,</text>
<text x="206.0" y="782.5" font-size="13.5" fill="#3b2f1e">judged by their</text>
<text x="206.0" y="799.5" font-size="13.5" fill="#3b2f1e">deeds</text>
<text x="206.0" y="816.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:5, 12-13</text>
<rect x="368.0" y="730.0" width="154.0" height="95" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="376.0" y="748.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">“Earth and sky</text>
<text x="376.0" y="765.5" font-size="13.5" fill="#3b2f1e">fled away, and no</text>
<text x="376.0" y="782.5" font-size="13.5" fill="#3b2f1e">place was found</text>
<text x="376.0" y="799.5" font-size="13.5" fill="#3b2f1e">for them”</text>
<text x="376.0" y="816.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:11</text>
<rect x="538.0" y="730.0" width="154.0" height="95" rx="5" fill="#fffdf7" stroke="#c4471c" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="546.0" y="748.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Heavens set on</text>
<text x="546.0" y="765.5" font-size="13.5" fill="#3b2f1e">fire and dissolved:</text>
<text x="546.0" y="782.5" font-size="13.5" fill="#3b2f1e">placed here on</text>
<text x="546.0" y="799.5" font-size="13.5" fill="#3b2f1e">this site's reading</text>
<text x="546.0" y="816.5" font-size="12.0" fill="#6b5a3e" font-style="italic">2 Peter 3:10-12</text>
<rect x="198.0" y="835.0" width="154.0" height="61" rx="5" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="206.0" y="853.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Death and Hades</text>
<text x="206.0" y="870.5" font-size="13.5" fill="#3b2f1e">into the lake</text>
<text x="206.0" y="887.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Revelation 20:14</text>
<rect x="24" y="922" width="672" height="120" rx="8" fill="#f6ecd0" stroke="#a67c3d" stroke-width="2.5"/>
<text x="360.0" y="958.0" font-size="22" fill="#a67c3d" text-anchor="middle" font-weight="bold" letter-spacing="2">THE EIGHTH DAY</text>
<text x="360.0" y="986.0" font-size="15" fill="#3b2f1e" text-anchor="middle">A new heaven and a new earth; the holy city comes down</text>
<text x="360.0" y="1010.0" font-size="14" fill="#3b2f1e" text-anchor="middle" font-style="italic">“death shall be no more” (Revelation 21:1-4, ESV)</text>
<rect x="150.0" y="1068.0" width="150.0" height="27" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="158.0" y="1086.5" font-size="13" fill="#3b2f1e" font-weight="bold">The text dates it</text>
<rect x="325.0" y="1068.0" width="210.0" height="27" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="333.0" y="1086.5" font-size="13" fill="#3b2f1e" font-weight="bold">Placed by its order</text>
<text x="696.0" y="1130.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
