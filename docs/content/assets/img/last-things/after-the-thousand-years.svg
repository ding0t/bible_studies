<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1152" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">After the thousand years</title>
<desc id="d">A chart in four lanes, Satan, the dead, earth and sky, and fire, read top to bottom from Christ's coming to the new creation. At His coming Satan is bound in the abyss (Revelation 20:1-3), the first resurrection raises those who reign with Christ (Revelation 20:4-6), the earth stands for the kingdom, and He comes in flaming fire on the living nations (2 Thessalonians 1:8; Luke 17:30). The thousand years follow, the seventh day. After them Satan is released for a little while and gathers Gog and Magog against the camp of the saints, and fire from heaven consumes them (Revelation 20:7-9); the devil is thrown into the lake of fire (Revelation 20:10). At the great white throne earth and sky flee away (Revelation 20:11), the rest of the dead are judged by their deeds (Revelation 20:12-13), Death and Hades are thrown into the lake (Revelation 20:14), and on this site's reading Peter's fire dissolves the heavens there (2 Peter 3:10-12), drawn dashed as an inference. The eighth day opens: a new heaven and a new earth, the holy city coming down, and death no more (Revelation 21:1-4).</desc>
<rect width="720" height="1152" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1136" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1124" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
