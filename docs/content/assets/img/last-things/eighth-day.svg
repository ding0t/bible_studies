<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 940" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The eighth day</title>
<desc id="d">Seven rows, each with seven small squares followed by a larger gold eighth. Five come from the Law: circumcision, the firstborn, the priests' ordination, the cleansed leper and the Feast of Booths, where seven days complete something and the eighth begins what the seven were for. Two are dashed as readings: the day Jesus rose, the first day after the Sabbath, which the Epistle of Barnabas calls the eighth day; and this site's week of history, seven thousand-year days followed by the new heaven and new earth. Below, eight figures stand for Noah's household, the eight persons brought through water, which Peter makes the pattern of baptism and the resurrection (1 Peter 3:20-21).</desc>
