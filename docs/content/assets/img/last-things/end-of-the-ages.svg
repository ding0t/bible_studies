<text x="492.0" y="492.0" font-size="13" fill="#a67c3d" font-weight="bold">He returns</text>
<text x="492.0" y="509.0" font-size="12" fill="#6b5a3e" font-style="italic">Matt 24:29-31</text>
<path d="M140 626 H370" stroke="#2f4f7f" stroke-width="3"/>
<path d="M370 626 H470" stroke="#2f4f7f" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M140 618 V634 M470 618 V634" stroke="#2f4f7f" stroke-width="2"/>
<text x="305.0" y="650.0" font-size="13.5" fill="#2f4f7f" text-anchor="middle" font-style="italic">“I am with you all the days, to the end of the age”</text>
<text x="305.0" y="668.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle">Matthew 28:20 (lit.) · then “always with the Lord” (1 Thess 4:17)</text>
<text x="133.0" y="704.0" font-size="13" fill="#a67c3d" text-anchor="middle" font-weight="bold" letter-spacing="1.5">AT THE CROSS</text>
<rect x="30.0" y="716.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="38.0" y="734.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">The end of the ages</text>
<text x="38.0" y="751.5" font-size="13.5" fill="#3b2f1e">has come</text>
<text x="38.0" y="768.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Heb 9:26 · 1 Cor 10:11</text>
<rect x="30.0" y="787.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="38.0" y="805.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">“In these last days”</text>
<text x="38.0" y="822.5" font-size="13.5" fill="#3b2f1e">God has spoken</text>
<text x="38.0" y="839.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Heb 1:2</text>
<rect x="30.0" y="858.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="38.0" y="876.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Rescued from the</text>
<text x="38.0" y="893.5" font-size="13.5" fill="#3b2f1e">present evil age</text>
<text x="38.0" y="910.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Gal 1:4</text>
<text x="360.0" y="704.0" font-size="13" fill="#a67c3d" text-anchor="middle" font-weight="bold" letter-spacing="1.5">ALL THE DAYS BETWEEN</text>
<rect x="257.0" y="716.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="265.0" y="734.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Jesus with His</text>
<text x="265.0" y="751.5" font-size="13.5" fill="#3b2f1e">disciples every day</text>
<text x="265.0" y="768.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Matt 28:20</text>
<rect x="257.0" y="787.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="265.0" y="805.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Weeds and wheat</text>
<text x="265.0" y="822.5" font-size="13.5" fill="#3b2f1e">grow together</text>
<text x="265.0" y="839.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Matt 13:30</text>
<rect x="257.0" y="858.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="265.0" y="876.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">The church caught up</text>
<text x="265.0" y="893.5" font-size="13.5" fill="#3b2f1e">before the week</text>
<text x="265.0" y="910.5" font-size="12.0" fill="#6b5a3e" font-style="italic">1 Thess 4:17 · Rev 3:10</text>
<text x="587.0" y="704.0" font-size="13" fill="#a67c3d" text-anchor="middle" font-weight="bold" letter-spacing="1.5">AT HIS RETURN</text>
<rect x="484.0" y="716.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="492.0" y="734.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Daniel’s end:</text>
<text x="492.0" y="751.5" font-size="13.5" fill="#3b2f1e">the week closes</text>
<text x="492.0" y="768.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Dan 9:27 · 12:4, 13</text>
<rect x="484.0" y="787.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="492.0" y="805.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">The harvest: angels</text>
<text x="492.0" y="822.5" font-size="13.5" fill="#3b2f1e">separate the wicked</text>
<text x="492.0" y="839.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Matt 13:39-43, 49</text>
<rect x="484.0" y="858.0" width="206.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="492.0" y="876.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">“Your coming and the</text>
<text x="492.0" y="893.5" font-size="13.5" fill="#3b2f1e">end of the age”</text>
<text x="492.0" y="910.5" font-size="12.0" fill="#6b5a3e" font-style="italic">Matt 24:3</text>
<rect x="40.0" y="964.0" width="150.0" height="27" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="48.0" y="982.5" font-size="13" fill="#3b2f1e" font-weight="bold">The text dates it</text>
<rect x="215.0" y="964.0" width="210.0" height="27" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="223.0" y="982.5" font-size="13" fill="#3b2f1e" font-weight="bold">Placed by its order</text>
<text x="360.0" y="1016.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">The end began when Jesus offered Himself, and it closes when He comes back.</text>
<text x="696.0" y="1038.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
