<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1060" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The end of the ages</title>
<desc id="d">Two timelines. The first is the Jewish two-age frame of 1 Enoch 16:1 and 2 Esdras 7:43: this age and the age to come, divided by one judgment. The second is the New Testament's: a red span marked 'the end of the ages' opens at the cross, where Hebrews 9:26 and 1 Corinthians 10:11 say it has already come, and closes at Christ's return after Daniel's seventieth week, the 'close of the age' of Matthew 13:39-43 and 24:3. Between them runs the church age, under Matthew 28:20's promise, 'I am with you all the days, to the end of the age.' A dashed arc rises from the end of the church age to the clouds, the rapture, placed by inference; a solid arc comes down at the end of the week, the return. Beyond the return is the age to come: the thousand years, dashed as its first stage by inference, and the new creation. Cards below sort the texts by where they fall: at the cross, in the days between, and at His return.</desc>
<rect width="720" height="1060" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1044" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1032" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE END OF THE AGES</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">Opened at the cross, closed at His return</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
