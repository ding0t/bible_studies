<text x="250.0" y="324.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THIS AGE</text>
<path d="M480.0 306 H680.0 L670.0 319.0 L680.0 332 H480.0 L490.0 319.0 Z" fill="#a67c3d"/>
<text x="580.0" y="323.5" font-size="12.5" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE AGE TO COME</text>
<path d="M140 372 H470" stroke="#8b1e1e" stroke-width="3"/>
<path d="M140 363 V381 M470 363 V381" stroke="#8b1e1e" stroke-width="2"/>
<text x="265.0" y="362.0" font-size="14" fill="#8b1e1e" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE END OF THE AGES</text>
<text x="144.0" y="396.0" font-size="13" fill="#8b1e1e" font-style="italic">“has come”</text>
<text x="466.0" y="396.0" font-size="13" fill="#8b1e1e" text-anchor="end" font-style="italic" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">“the close of the age”</text>
