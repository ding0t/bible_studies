<text x="48.0" y="522.5" font-size="12.5" fill="#6b5a3e" font-style="italic">Isaiah 2:11 · b. Sanhedrin 97a</text>
<rect x="375.0" y="470.0" width="305.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="383.0" y="488.4" font-size="14" fill="#3b2f1e" font-weight="bold">Abaye: two thousand years,</text>
