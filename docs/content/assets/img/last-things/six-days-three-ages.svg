<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Six days, three ages</title>
<desc id="d">The Talmud reads the six thousand years two ways on one page, b. Sanhedrin 97a. The top row is the week: six days of a thousand years and a seventh that is all Sabbath, from Psalm 92:1 and Psalm 90:4. The second row is the school of Elijah's three ages of two thousand years: chaos, Torah, and the days of Messiah. b. Avodah Zarah 9a starts the age of Torah when Abraham was 52, which on its own count is 2,000 years after creation, with Sinai at 2,448, and notes that years had already passed from the days of Messiah without His coming. Two rabbis on the same page give the world's ruin as a thousand years (Isaiah 2:11) or two thousand (Hosea 6:2). A dashed row below places Abram's call and the cross on this site's own chronology, where the cross falls a few years before the four-thousandth year.</desc>
