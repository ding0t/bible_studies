<g fill="#ffffff" stroke="#a67c3d" stroke-width="1.2"><circle cx="115.8" cy="720.2" r="25.8"/><circle cx="152.9" cy="713.7" r="32.3"/><circle cx="190.0" cy="720.2" r="25.8"/><circle cx="227.1" cy="713.7" r="32.3"/><circle cx="264.2" cy="720.2" r="25.8"/></g>
