<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Meeting the Lord in the air</title>
<desc id="d">A chart of the word apantesis, 'meeting', and the two readings of 1 Thessalonians 4:17. At the top, the word occurs three times in the New Testament (1 Thessalonians 4:17; Matthew 25:6; Acts 28:15), and four Septuagint meetings show its range of outcomes: a greeting (1 Samuel 13:10), a battle (1 Samuel 4:1), a rebuke (2 Samuel 6:20) and a massacre (Jeremiah 41:6-7). Next, the civic custom of Acts 28:15: believers go out from Rome to the Forum of Appius, meet Paul, and return with him. Below, two columns. The posttribulational reading: the church is caught up to meet the Lord and escorts Him down at once. The pretribulational reading, this site's: the church is caught up to meet Him, goes with Him to the Father's house (John 14:2-3) and the marriage feast (Matthew 25:10), and returns with Him at the end of the seventieth week among the armies of heaven (Revelation 19:14). Both directions are inferred; Paul states the company, 'always with the Lord'.</desc>
<rect width="720" height="1180" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1164" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1152" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">MEETING THE LORD IN THE AIR</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">ἀπάντησις (apantēsis, G529): the going out, and what follows</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
<text x="28.0" y="126.0" font-size="14" fill="#3b2f1e" font-weight="bold" letter-spacing="1.5">THE WORD</text>
<text x="28.0" y="146.0" font-size="13.5" fill="#3b2f1e">3 times in the New Testament: 1 Thess 4:17 · Matthew 25:6 · Acts 28:15</text>
<text x="28.0" y="166.0" font-size="13.5" fill="#3b2f1e">In the Septuagint, “to meet” ends in whatever the occasion brings:</text>
