<text x="408.0" y="605.5" font-size="13.5" fill="#3b2f1e">the marriage feast</text>
<text x="408.0" y="622.5" font-size="12.0" fill="#6b5a3e" font-style="italic">John 14:2-3 · Matthew 25:10</text>
<path d="M600.0 646 C695.0 730 685.0 880 625.0 932" fill="none" stroke="#a67c3d" stroke-width="3.5"/>
<path d="M622.0 936.0 L621.8 925.0 L630.5 929.0 Z" fill="#a67c3d"/>
<text x="516.0" y="826.0" font-size="13" fill="#3b2f1e">with Him at the end</text>
<text x="516.0" y="843.0" font-size="13" fill="#3b2f1e">of the week, among</text>
<text x="516.0" y="860.0" font-size="13" fill="#3b2f1e">the armies of heaven</text>
<text x="516.0" y="877.0" font-size="13" fill="#3b2f1e">Revelation 19:14</text>
<text x="460.0" y="850.0" font-size="13" fill="#3b2f1e" text-anchor="end">caught up</text>
<rect x="28" y="1050" width="664" height="65" rx="6" fill="#fffdf7" stroke="#3b2f1e"/>
<text x="40.0" y="1071.0" font-size="13" fill="#3b2f1e">Paul states the company: “and so we will always be with the Lord” (1 Thessalonians 4:17, ESV).</text>
<text x="40.0" y="1088.0" font-size="13" fill="#3b2f1e">Which way the company goes next is inferred on both readings. This site reads the verse with</text>
<text x="40.0" y="1105.0" font-size="13" fill="#3b2f1e">John 14:3, “that where I am you may be also,” and marks the point as contested.</text>
<text x="696.0" y="1158.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
