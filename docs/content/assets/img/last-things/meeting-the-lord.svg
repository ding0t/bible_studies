<text x="107.2" y="222.0" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">1 Samuel 13:10</text>
<rect x="196.5" y="182" width="158.5" height="50" rx="5" fill="#f1dcd4" stroke="#3b2f1e"/>
<text x="275.8" y="204.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">a battle</text>
<text x="275.8" y="222.0" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">1 Samuel 4:1</text>
<rect x="365.0" y="182" width="158.5" height="50" rx="5" fill="#efe4d0" stroke="#3b2f1e"/>
<text x="444.2" y="204.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">a rebuke</text>
<text x="444.2" y="222.0" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">2 Samuel 6:20</text>
<rect x="533.5" y="182" width="158.5" height="50" rx="5" fill="#e8d0cc" stroke="#3b2f1e"/>
<text x="612.8" y="204.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">a massacre</text>
<text x="612.8" y="222.0" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">Jeremiah 41:6-7</text>
<path d="M24 268 H696" stroke="#3b2f1e" stroke-width="0.6"/>
<text x="28.0" y="296.0" font-size="14" fill="#3b2f1e" font-weight="bold" letter-spacing="1.5">THE CIVIC CUSTOM</text>
<text x="28.0" y="314.0" font-size="13.5" fill="#3b2f1e">Acts 28:15: believers walk out of Rome to meet Paul, then return with him</text>
