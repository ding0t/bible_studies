<text x="360.0" y="498.0" font-size="14" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1.5">TWO READINGS OF 1 THESSALONIANS 4:17</text>
<path d="M360.0 514 V1030" stroke="#3b2f1e" stroke-width="0.6"/>
<text x="190.0" y="532.0" font-size="13.5" fill="#6b5a3e" text-anchor="middle" font-weight="bold" letter-spacing="1">POSTTRIBULATIONAL</text>
