<text x="382.0" y="960.0" font-size="12.5" fill="#6b5a3e" font-style="italic">the earth</text>
<g fill="#ffffff" stroke="#a67c3d" stroke-width="1.2"><circle cx="455.8" cy="720.2" r="25.8"/><circle cx="492.9" cy="713.7" r="32.3"/><circle cx="530.0" cy="720.2" r="25.8"/><circle cx="567.1" cy="713.7" r="32.3"/><circle cx="604.2" cy="720.2" r="25.8"/></g>
<rect x="445.5" y="722.8" width="169.0" height="23.2" fill="#ffffff"/>
<path d="M437.7 746 H622.3" stroke="#a67c3d" stroke-width="1.2"/>
<text x="530.0" y="734.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-style="italic">“in the air”</text>
<g stroke="#3b2f1e" stroke-width="1.7" fill="none" stroke-linecap="round"><circle cx="150.0" cy="917.9" r="4.2" fill="#3b2f1e"/><path d="M150.0 922.1 V932.4 M144.1 925.5 H155.9 M150.0 932.4 L145.8 940 M150.0 932.4 L154.2 940"/></g>
<path d="M150.0 904 V756" stroke="#a67c3d" stroke-width="2.5"/>
<path d="M150.0 752.0 L154.3 761.0 L145.7 761.0 Z" fill="#a67c3d"/>
<path d="M230.0 756 V932" stroke="#a67c3d" stroke-width="2.5"/>
<path d="M230.0 936.0 L225.7 927.0 L234.3 927.0 Z" fill="#a67c3d"/>
<text x="140.0" y="850.0" font-size="13" fill="#3b2f1e" text-anchor="end">caught</text>
<text x="140.0" y="867.0" font-size="13" fill="#3b2f1e" text-anchor="end">up</text>
<text x="240.0" y="850.0" font-size="13" fill="#3b2f1e">down with</text>
<text x="240.0" y="867.0" font-size="13" fill="#3b2f1e">Him at once</text>
<text x="190.0" y="580.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">The custom supplies the</text>
<text x="190.0" y="597.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">direction: the escort turns</text>
<text x="190.0" y="614.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">back with the King to the earth</text>
