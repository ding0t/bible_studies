<text x="634.0" y="420.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">1,000 YEARS</text>
<text x="406.0" y="452.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Daniel 9:27 · on the earth</text>
<path d="M24 431 H696" stroke="#3b2f1e" stroke-width="1.5"/>
<text x="28.0" y="464.0" font-size="12.5" fill="#6b5a3e" font-weight="bold" letter-spacing="1.5">ON THE EARTH</text>
<path d="M226 398 C226 320 246 280 272 252" fill="none" stroke="#a67c3d" stroke-width="3" stroke-dasharray="7 5"/>
