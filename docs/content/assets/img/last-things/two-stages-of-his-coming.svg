<text x="40.0" y="300.0" font-size="14" fill="#a67c3d" font-weight="bold">1 · FOR HIS SAINTS</text>
<text x="40.0" y="318.0" font-size="13" fill="#3b2f1e">caught up to meet Him</text>
<text x="40.0" y="335.0" font-size="13" fill="#3b2f1e">in the air</text>
<text x="40.0" y="352.0" font-size="13" fill="#3b2f1e">1 Thess 4:16-17 · John 14:3</text>
<path d="M552 252 C586 280 596 330 600 394" fill="none" stroke="#a67c3d" stroke-width="4"/>
<path d="M600.0 398.0 L593.5 385.6 L605.6 385.2 Z" fill="#a67c3d"/>
<text x="540.0" y="300.0" font-size="14" fill="#a67c3d" text-anchor="end" font-weight="bold">2 · WITH HIS SAINTS</text>
<text x="540.0" y="318.0" font-size="13" fill="#3b2f1e" text-anchor="end">to the earth, every eye</text>
<text x="540.0" y="335.0" font-size="13" fill="#3b2f1e" text-anchor="end">seeing Him</text>
<text x="540.0" y="352.0" font-size="13" fill="#3b2f1e" text-anchor="end">Rev 19:11-16 · Zech 14:4-5</text>
<rect x="30" y="478" width="660" height="32" fill="#f6ecd0"/>
<text x="40.0" y="500.0" font-size="13.5" fill="#3b2f1e" font-weight="bold"></text>
<text x="170.0" y="500.0" font-size="13.5" fill="#a67c3d" font-weight="bold">For His saints</text>
<text x="440.0" y="500.0" font-size="13.5" fill="#a67c3d" font-weight="bold">With His saints</text>
<text x="40.0" y="532.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Which way</text>
<text x="170.0" y="532.0" font-size="13.5" fill="#3b2f1e">up, to meet Him in the air</text>
<text x="440.0" y="532.0" font-size="13.5" fill="#3b2f1e">down, to the earth</text>
<rect x="30" y="542" width="660" height="32" fill="#efe4d0" opacity="0.5"/>
<text x="40.0" y="564.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Signs before</text>
<text x="170.0" y="564.0" font-size="13.5" fill="#3b2f1e">none: “in the twinkling of an eye”</text>
<text x="440.0" y="564.0" font-size="13.5" fill="#3b2f1e">“immediately after the tribulation”</text>
<text x="40.0" y="596.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Who sees</text>
<text x="170.0" y="596.0" font-size="13.5" fill="#3b2f1e">not stated</text>
<text x="440.0" y="596.0" font-size="13.5" fill="#3b2f1e">“every eye” (Rev 1:7)</text>
<rect x="30" y="606" width="660" height="32" fill="#efe4d0" opacity="0.5"/>
<text x="40.0" y="628.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Judgment</text>
<text x="170.0" y="628.0" font-size="13.5" fill="#3b2f1e">absent</text>
<text x="440.0" y="628.0" font-size="13.5" fill="#3b2f1e">flaming fire; the sword</text>
<text x="40.0" y="660.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Resurrection</text>
<text x="170.0" y="660.0" font-size="13.5" fill="#3b2f1e">central (1 Cor 15:52-53)</text>
<text x="440.0" y="660.0" font-size="13.5" fill="#3b2f1e">absent</text>
<rect x="30" y="670" width="660" height="32" fill="#efe4d0" opacity="0.5"/>
<text x="40.0" y="692.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Purpose</text>
<text x="170.0" y="692.0" font-size="13.5" fill="#3b2f1e">comfort (1 Thess 4:18)</text>
<text x="440.0" y="692.0" font-size="13.5" fill="#3b2f1e">“to judge and make war”</text>
<text x="40.0" y="724.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Timing</text>
<text x="170.0" y="724.0" font-size="13.5" fill="#3b2f1e">inferred</text>
<text x="440.0" y="724.0" font-size="13.5" fill="#3b2f1e">stated (Matthew 24:29)</text>
<rect x="30" y="478" width="660" height="256" fill="none" stroke="#3b2f1e"/>
<text x="360.0" y="778.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">The same people are at both, on opposite sides of the journey: the bride’s</text>
<text x="360.0" y="795.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">fine linen (Revelation 19:8) is what the armies wear (Revelation 19:14).</text>
<text x="696.0" y="828.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
