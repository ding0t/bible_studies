<text x="270.0" y="160.4" font-size="13" fill="#3b2f1e" font-weight="bold">Judgment seat</text>
<text x="270.0" y="177.4" font-size="13" fill="#3b2f1e">of Christ</text>
<text x="270.0" y="194.4" font-size="11.5" fill="#6b5a3e" font-style="italic">2 Cor 5:10</text>
<rect x="410.0" y="142.0" width="140.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="418.0" y="160.4" font-size="13" fill="#3b2f1e" font-weight="bold">Marriage of</text>
<text x="418.0" y="177.4" font-size="13" fill="#3b2f1e">the Lamb</text>
<text x="418.0" y="194.4" font-size="11.5" fill="#6b5a3e" font-style="italic">Rev 19:7-9</text>
<text x="412.0" y="266.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-style="italic">“so we will always be with the Lord”</text>
<text x="412.0" y="283.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-style="italic">1 Thessalonians 4:17</text>
<rect x="40" y="400" width="196" height="30" fill="#e8c46a" stroke="#a67c3d"/>
<text x="138.0" y="420.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1">THE CHURCH AGE</text>
