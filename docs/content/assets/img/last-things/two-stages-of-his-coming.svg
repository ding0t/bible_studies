<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Two stages of His coming</title>
<desc id="d">A chart of Christ's coming in two stages across Daniel's seventieth week. On the earth a line runs from the church age through the seven years to the thousand years. At the end of the church age a dashed arc rises to the clouds: He comes for His saints, who are caught up to meet Him in the air (1 Thessalonians 4:16-17; John 14:3); the arc is dashed because the rapture's timing is inferred. In heaven, above the seven years, are the judgment seat of Christ (2 Corinthians 5:10) and the marriage of the Lamb (Revelation 19:7-9). At the end of the seven years a solid arc descends: He comes with His saints to the earth (Revelation 19:11-16; Colossians 3:4; Zechariah 14:4-5), a timing the text states, 'immediately after the tribulation' (Matthew 24:29). A table below sets the two side by side: direction, signs, who sees, judgment, resurrection, and whether the timing is stated.</desc>
<rect width="720" height="850" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="834" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="822" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">TWO STAGES OF HIS COMING</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">For His saints, then with His saints</text>
