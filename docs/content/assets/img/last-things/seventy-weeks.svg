<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1196" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Daniel's seventy weeks</title>
<desc id="d">A chart of Daniel 9:24-27 on this site's reckoning, read top to bottom. Seventy weeks, 490 years, are decreed about Daniel's people and city. The first sixty-nine weeks run from the decree to restore Jerusalem, 1 Nisan 444 BC (Nehemiah 2:1-8), in two parts, seven weeks and sixty-two weeks, to 10 Nisan AD 33, when the King enters Jerusalem (Harold Hoehner's count, which this site follows). The Messiah is cut off after the sixty-ninth week (Daniel 9:26), and the city and sanctuary are destroyed in AD 70. A break marks the gap, the church age, which was not revealed to Daniel (Ephesians 3:5). The seventieth week, still future, is drawn larger: a covenant for one week, the abomination at its middle, and the decreed end, when the King returns to the Mount of Olives (Daniel 9:27; Zechariah 14:4). A note gives the arithmetic: 69 weeks of 360-day years is 173,880 days.</desc>
<rect width="720" height="1196" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1180" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1168" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">DANIEL'S SEVENTY WEEKS</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">“Seventy weeks are decreed about your people and your holy city” (Daniel 9:24)</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
<rect x="128" y="150" width="40" height="46" fill="#f6ecd0" stroke="#3b2f1e"/>
<rect x="128" y="196" width="40" height="364" fill="#e8c46a" stroke="#3b2f1e"/>
<text x="118.0" y="170.0" font-size="13" fill="#3b2f1e" text-anchor="end" font-weight="bold">7 weeks</text>
<text x="118.0" y="187.0" font-size="13" fill="#3b2f1e" text-anchor="end" font-weight="bold">49 years</text>
<text x="118.0" y="370.0" font-size="15" fill="#3b2f1e" text-anchor="end" font-weight="bold">62 weeks</text>
<text x="118.0" y="389.0" font-size="15" fill="#3b2f1e" text-anchor="end" font-weight="bold">434 years</text>
<text x="118.0" y="415.0" font-size="12.5" fill="#6b5a3e" text-anchor="end" font-style="italic">69 weeks</text>
<text x="118.0" y="432.0" font-size="12.5" fill="#6b5a3e" text-anchor="end" font-style="italic">483 years</text>
<path d="M148.0 584 V760" stroke="#6b5a3e" stroke-width="2.5" stroke-dasharray="3 6"/>
<path d="M122 598 l52 -12 M122 606 l52 -12" stroke="#6b5a3e" stroke-width="1.6"/>
<path d="M122 760 l52 -12 M122 768 l52 -12" stroke="#6b5a3e" stroke-width="1.6"/>
<text x="118.0" y="668.0" font-size="14" fill="#6b5a3e" text-anchor="end" font-weight="bold">THE</text>
<text x="118.0" y="685.0" font-size="14" fill="#6b5a3e" text-anchor="end" font-weight="bold">GAP</text>
<rect x="128" y="784" width="40" height="220" fill="#f1dcd4" stroke="#3b2f1e" stroke-dasharray="5 4"/>
<path d="M120 894 H176" stroke="#8b1e1e" stroke-width="3"/>
<text x="118.0" y="824.0" font-size="15" fill="#8b1e1e" text-anchor="end" font-weight="bold">70th</text>
<text x="118.0" y="843.0" font-size="15" fill="#8b1e1e" text-anchor="end" font-weight="bold">week</text>
<text x="118.0" y="868.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">7 years,</text>
<text x="118.0" y="885.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">drawn</text>
<text x="118.0" y="902.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">larger</text>
<rect x="222" y="262" width="468" height="232" rx="6" fill="#fffdf7" stroke="#3b2f1e"/>
<text x="236.0" y="290.0" font-size="13.5" fill="#3b2f1e" font-weight="bold" letter-spacing="1">WHAT THE SEVENTY WEEKS ARE FOR</text>
<text x="236.0" y="310.0" font-size="13" fill="#3b2f1e" font-style="italic">“decreed about your people and your holy city”</text>
<circle cx="244" cy="336" r="3" fill="#a67c3d"/>
<text x="256.0" y="341.0" font-size="14" fill="#3b2f1e">to finish the transgression</text>
<circle cx="244" cy="360" r="3" fill="#a67c3d"/>
<text x="256.0" y="365.0" font-size="14" fill="#3b2f1e">to put an end to sin</text>
<circle cx="244" cy="384" r="3" fill="#a67c3d"/>
<text x="256.0" y="389.0" font-size="14" fill="#3b2f1e">to atone for iniquity</text>
<circle cx="244" cy="408" r="3" fill="#a67c3d"/>
<text x="256.0" y="413.0" font-size="14" fill="#3b2f1e">to bring in everlasting righteousness</text>
<circle cx="244" cy="432" r="3" fill="#a67c3d"/>
<text x="256.0" y="437.0" font-size="14" fill="#3b2f1e">to seal both vision and prophet</text>
<circle cx="244" cy="456" r="3" fill="#a67c3d"/>
<text x="256.0" y="461.0" font-size="14" fill="#3b2f1e">to anoint a most holy place</text>
<text x="236.0" y="482.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 9:24 (ESV)</text>
<path d="M168 150 H214" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="168" cy="150" r="4.5" fill="#3b2f1e" stroke="#faf6ec"/>
<text x="222.0" y="155.0" font-size="15" fill="#3b2f1e" font-weight="bold">1 Nisan 444 BC: the decree</text>
<text x="222.0" y="173.0" font-size="14" fill="#3b2f1e">“to restore and build Jerusalem”</text>
<text x="222.0" y="191.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Nehemiah 2:1-8; Daniel 9:25</text>
<path d="M168 536 H214" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="168" cy="536" r="4.5" fill="#3b2f1e" stroke="#faf6ec"/>
<text x="222.0" y="541.0" font-size="15" fill="#3b2f1e" font-weight="bold">10 Nisan AD 33: the King enters Jerusalem</text>
<text x="222.0" y="559.0" font-size="14" fill="#3b2f1e">the sixty-nine weeks complete (Hoehner)</text>
<text x="222.0" y="577.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Luke 19:41-44; Daniel 9:25</text>
<path d="M168 600 H214" stroke="#8b1e1e" stroke-width="1.4"/>
<circle cx="168" cy="600" r="4.5" fill="#8b1e1e" stroke="#faf6ec"/>
<text x="222.0" y="605.0" font-size="15" fill="#8b1e1e" font-weight="bold">“An anointed one shall be cut off</text>
<text x="222.0" y="623.0" font-size="14" fill="#8b1e1e">and shall have nothing”: the cross, AD 33</text>
<text x="222.0" y="641.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 9:26</text>
<path d="M168 654 H214" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="168" cy="654" r="4.5" fill="#3b2f1e" stroke="#faf6ec"/>
<text x="222.0" y="659.0" font-size="15" fill="#3b2f1e" font-weight="bold">AD 70: the city and the sanctuary destroyed</text>
<text x="222.0" y="677.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 9:26; Luke 21:20-24</text>
<rect x="222" y="692" width="468" height="54" rx="5" fill="#e3e9f2" stroke="#2f4f7f"/>
<text x="234.0" y="714.0" font-size="14" fill="#2f4f7f" font-weight="bold">THE CHURCH AGE · outside Daniel's count</text>
<text x="234.0" y="734.0" font-size="12.5" fill="#2f4f7f" font-style="italic">“not made known to the sons of men in other generations” (Eph 3:5)</text>
<path d="M168 784 H214" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="168" cy="784" r="4.5" fill="#3b2f1e" stroke="#faf6ec"/>
<text x="222.0" y="789.0" font-size="15" fill="#3b2f1e" font-weight="bold">A strong covenant “for one week”</text>
<text x="222.0" y="807.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 9:27</text>
<path d="M168 894 H214" stroke="#8b1e1e" stroke-width="1.4"/>
<circle cx="168" cy="894" r="4.5" fill="#8b1e1e" stroke="#faf6ec"/>
<text x="222.0" y="899.0" font-size="15" fill="#8b1e1e" font-weight="bold">The middle: sacrifice stopped,</text>
<text x="222.0" y="917.0" font-size="14" fill="#8b1e1e">the abomination set up</text>
<text x="222.0" y="935.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 9:27; Matthew 24:15</text>
<path d="M168 1004 H214" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="168" cy="1004" r="4.5" fill="#3b2f1e" stroke="#faf6ec"/>
<text x="222.0" y="1009.0" font-size="15" fill="#3b2f1e" font-weight="bold">The decreed end; the King returns</text>
<text x="222.0" y="1027.0" font-size="14" fill="#3b2f1e">to the Mount of Olives</text>
<text x="222.0" y="1045.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 9:27; Zechariah 14:4</text>
<rect x="28" y="1070" width="664" height="82" rx="6" fill="#fffdf7" stroke="#3b2f1e"/>
<text x="40.0" y="1091.0" font-size="13" fill="#3b2f1e" font-weight="bold">69 weeks × 7 years × 360 days = 173,880 days</text>
<text x="40.0" y="1108.0" font-size="13" fill="#3b2f1e">1 Nisan 444 BC to 10 Nisan AD 33 is Harold Hoehner's count, which this site follows; Sir Robert</text>
<text x="40.0" y="1125.0" font-size="13" fill="#3b2f1e">Anderson counted 445 BC to AD 32. Counted directly, both intervals run 2-4 days long, and both</text>
<text x="40.0" y="1142.0" font-size="13" fill="#3b2f1e">land in Passion Week. The seventieth week is future: its length is stated, its start withheld.</text>
<text x="696.0" y="1174.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
