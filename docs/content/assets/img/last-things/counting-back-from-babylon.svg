<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Counting back from Babylon</title>
<desc id="d">A ladder read from the top, in the order Ussher worked, comparing his chain with this site's link by link. Both start from the same anchor, Evil-merodach's accession in 562 BC (2 Kings 25:27). The exile: 26 years back to Jerusalem's fall in 588 BC for Ussher, 24 years to 586 BC here; gap 2. Step 1, the kings of Judah: 424 years for Ussher (430 added up, less 6 for overlaps), 380 here after Thiele; the temple at 1012 BC against 966 BC, gap 46. Step 2, 1 Kings 6:1's 480th year: 479 years for Ussher, 480 here; the Exodus at 1491 BC against 1446 BC, gap 45. Step 3, Genesis 5 and 11: 2,513 years in both; creation at 4004 BC against 3959 BC, gap 45. The year 6000 falls in AD 1997 on Ussher's line and AD 2042 on this site's. The links are not drawn to scale.</desc>
