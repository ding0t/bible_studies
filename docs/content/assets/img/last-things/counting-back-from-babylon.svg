<text x="40.0" y="755.0" font-size="13" fill="#3b2f1e">At the temple: 1012 − 966 = 46 years = 2 at Jerusalem's fall + 44 in the kings.</text>
<text x="40.0" y="772.0" font-size="13" fill="#3b2f1e">Above it both chains count the same numbers, less the one year Ussher's reading of the</text>
<text x="40.0" y="789.0" font-size="13" fill="#3b2f1e">480th year takes back, so the Exodus and creation sit 45 years apart. Links not to scale.</text>
