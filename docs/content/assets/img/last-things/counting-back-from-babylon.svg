<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1483" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Counting back from Babylon</title>
<desc id="d">Two columns on one scale of years. Both start from the same anchor, Evil-merodach's accession in 562 BC (2 Kings 25:27), and count upward. Ussher's column: 26 years back to Jerusalem's fall in 588 BC; step 1, the kings of Judah, -424 years to the temple in 1012 BC; step 2, 1 Kings 6:1's 480th year, to the Exodus in 1491 BC; step 3, Genesis 5 and 11, 2,513 years to creation in 4004 BC. This site's column: 24 years to 586 BC, 380 years of kings to 966 BC, 480 years to 1446 BC, and the same 2,513 years to 3959 BC. Lines join each event across the columns. A gauge on the right plots the gap: 0 at the anchor, 2 at Jerusalem's fall, 46 at the temple, then 45 unchanged to creation. Below, the 46 years are taken apart: 2 at Jerusalem's fall and 44 in the kings, where Ussher allowed for some overlapping reigns and Thiele's reconstruction for more.</desc>
