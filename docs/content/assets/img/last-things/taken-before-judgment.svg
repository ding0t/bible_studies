<text x="40.0" y="945.0" font-size="13" fill="#3b2f1e" font-weight="bold">What they picture, on this site's reading</text>
<text x="40.0" y="962.0" font-size="13" fill="#3b2f1e">Enoch, Lot and Elijah: the church taken before the week (1 Thessalonians 4:17).</text>
<text x="40.0" y="979.0" font-size="13" fill="#3b2f1e">Noah: the remnant kept through it, alive on the earth when Jesus returns (Matthew 24:37-39).</text>
<text x="40.0" y="996.0" font-size="13" fill="#3b2f1e">A type illustrates what Scripture teaches plainly elsewhere (1 Thessalonians 1:10; 5:9);</text>
<text x="40.0" y="1013.0" font-size="13" fill="#3b2f1e">it does not establish it. Both sides read the same four lives and weigh them differently.</text>
<text x="696.0" y="1052.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
