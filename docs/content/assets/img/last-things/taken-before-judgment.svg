<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1074" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Taken before judgment</title>
<desc id="d">Four panels, one for each life, each a short line of events with the judgment drawn in. Enoch walked with God and was taken alive (Genesis 5:24; Hebrews 11:5), 669 years before the flood he had announced (Jude 14-15). Noah went into the ark, the LORD shut him in, and he was preserved through the flood (Genesis 7:16; 2 Peter 2:5). Lot was brought out of Sodom; the angel could do nothing until he reached Zoar, then fire fell the same day (Genesis 19:16-24; Luke 17:29). Elijah was taken up by a whirlwind in full view, with no judgment behind him (2 Kings 2:11). A closing panel sets out what they picture on this site's reading: the church taken before the week, as Enoch, Lot and Elijah were, and a remnant kept through it, as Noah was, with the note that a type illustrates and the plain teaching establishes (1 Thessalonians 1:10; 5:9).</desc>
