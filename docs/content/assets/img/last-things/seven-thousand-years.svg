<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1364" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The seven thousand years</title>
<desc id="d">A chart of history as a week of seven thousand-year days, on this site's chronology (creation 3959 BC, Masoretic numbers, Exodus 1446 BC). Each day is a band with its theme from Genesis 1 and its years. Day 1: creation, Adam dies AM 930, Enoch taken AM 987. Day 2: the Flood AM 1656, Babel. Day 3: Abram's call, Jacob into Egypt, the Exodus in 1446 BC. Day 4: the temple begun in 966 BC, the kingdom divided, Jerusalem's fall in 586 BC, Cyrus's decree, the Nativity, and the cross in AD 33. Day 5: the temple destroyed in AD 70 and the gospel to the nations. Day 6 runs to the year 6000, AD 2042 on this chronology, with today marked. Day 7 is the thousand years of Revelation 20. An eighth day, the new heaven and new earth, opens beyond it. A note says the shape is Scripture's and the matching of days to millennia is this site's reading, and that the year 6000 is no date for Christ's return.</desc>
