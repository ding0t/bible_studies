<text x="178.0" y="1181.0" font-size="12.5" fill="#faf6ec" font-weight="bold" letter-spacing="0.5">THE EIGHTH DAY · A NEW HEAVEN AND NEW EARTH · REV 21:1</text>
<text x="28.0" y="1181.0" font-size="15" fill="#a67c3d" font-weight="bold">Beyond</text>
<rect x="28" y="1210" width="664" height="82" rx="6" fill="#fffdf7" stroke="#3b2f1e"/>
<text x="40.0" y="1231.0" font-size="13" fill="#3b2f1e">The shape is Scripture's: six days and a seventh (Exodus 20:11; Hebrews 4:9), and a thousand</text>
<text x="40.0" y="1248.0" font-size="13" fill="#3b2f1e">years numbered in Revelation 20. Matching each day to a millennium is this site's reading</text>
<text x="40.0" y="1265.0" font-size="13" fill="#3b2f1e">(A Day Is a Thousand Years). Year 6000 follows from the chronology; it is no date for His</text>
<text x="40.0" y="1282.0" font-size="13" fill="#3b2f1e">return, which Jesus kept hidden (Mark 13:32). Dates: Masoretic Genesis 5 and 11, Exodus 1446 BC.</text>
<text x="696.0" y="1342.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
