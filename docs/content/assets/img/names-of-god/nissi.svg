<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">YHWH Nissi: the LORD is my banner</title>
<desc id="d">YHWH Nissi, יְהוָה נִסִּי: the LORD is my banner. And Moses built an altar and called the name of it, The LORD Is My Banner. (Exodus 17:15 (ESV)). In the scene: Moses on the hill with the staff of God (Exodus 17:9-10); seated on a stone, his hands held up by Aaron and Hur (17:12); Joshua's battle with Amalek below, with the sword (17:10, 13).</desc>
