<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">El Shaddai: God Almighty</title>
<desc id="d">El Shaddai, אֵל שַׁדַּי: God Almighty. I am God Almighty; walk before me, and be blameless, that I may make my covenant between me and you, and may multiply you greatly. (Genesis 17:1-2 (ESV)). In the scene: the LORD appeared, drawn as light (Genesis 17:1); Abram fell on his face (17:3); Abram renamed Abraham (17:5); his tent (12:8).</desc>
