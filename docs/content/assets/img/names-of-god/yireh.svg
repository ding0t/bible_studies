<text x="532.0" y="256.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">So Abraham called the name of that</text>
<text x="532.0" y="274.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">place, “The LORD will provide.”</text>
<text x="532.0" y="292.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Genesis 22:14 (ESV)</text>
<text x="30.0" y="318.0" font-size="12.5" fill="#6b5a3e">In the scene: the altar, and the wood laid in order (Genesis 22:9); a ram caught in a thicket by his</text>
<text x="30.0" y="335.0" font-size="12.5" fill="#6b5a3e">horns (22:13); on the mount of the LORD (22:14).</text>
