<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">YHWH Yireh: the LORD will see to it, will provide</title>
<desc id="d">YHWH Yireh, יְהוָה יִרְאֶה: the LORD will see to it, will provide. So Abraham called the name of that place, “The LORD will provide.” (Genesis 22:14 (ESV)). In the scene: the altar, and the wood laid in order (Genesis 22:9); a ram caught in a thicket by his horns (22:13); on the mount of the LORD (22:14).</desc>
