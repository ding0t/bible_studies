<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 411" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">YHWH Tsevaot: the LORD of hosts</title>
<desc id="d">YHWH Tsevaot, יְהוָה צְבָאוֹת: the LORD of hosts. O LORD of hosts, if you will indeed look on the affliction of your servant and remember me … (1 Samuel 1:11 (ESV)). In the scene: Eli on the seat beside the doorpost of the temple (1 Samuel 1:9); Hannah praying; only her lips moved (1:12-13). Not stated, drawn for the scene: Hannah kneeling.</desc>
