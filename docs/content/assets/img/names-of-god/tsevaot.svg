<text x="532.0" y="256.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">O LORD of hosts, if you will indeed look</text>
<text x="532.0" y="274.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">on the affliction of your servant and</text>
<text x="532.0" y="292.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">remember me …</text>
<text x="532.0" y="310.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">1 Samuel 1:11 (ESV)</text>
<text x="30.0" y="336.0" font-size="12.5" fill="#6b5a3e">In the scene: Eli on the seat beside the doorpost of the temple (1 Samuel 1:9); Hannah praying; only her</text>
<text x="30.0" y="353.0" font-size="12.5" fill="#6b5a3e">lips moved (1:12-13).</text>
<text x="30.0" y="370.0" font-size="12.5" fill="#2f4f7f" font-style="italic">Not stated, drawn for the scene: Hannah kneeling.</text>
