<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">El Gibbor: Mighty God</title>
<desc id="d">El Gibbor, אֵל גִּבּוֹר: Mighty God. his name shall be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace. (Isaiah 9:6 (ESV)). In the scene: the throne of David (Isaiah 9:7). Not stated, drawn for the scene: the crown on it.</desc>
