<text x="532.0" y="256.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">But the LORD said to him, “Peace be to</text>
<text x="532.0" y="274.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">you. Do not fear; you shall not die.”</text>
<text x="532.0" y="292.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Judges 6:23 (ESV)</text>
<text x="30.0" y="318.0" font-size="12.5" fill="#6b5a3e">In the scene: the terebinth at Ophrah (Judges 6:11); the winepress (6:11); fire springing up from the</text>
