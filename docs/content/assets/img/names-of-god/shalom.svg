<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">YHWH Shalom: the LORD is peace</title>
<desc id="d">YHWH Shalom, יְהוָה שָׁלוֹם: the LORD is peace. But the LORD said to him, “Peace be to you. Do not fear; you shall not die.” (Judges 6:23 (ESV)). In the scene: the terebinth at Ophrah (Judges 6:11); the winepress (6:11); fire springing up from the rock (6:21).</desc>
