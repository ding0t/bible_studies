<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 393" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">El Roi: the God who sees</title>
<desc id="d">El Roi, אֵל רֳאִי: the God who sees. So she called the name of the LORD who spoke to her, “You are a God of seeing.” (Genesis 16:13 (ESV)). In the scene: a spring of water in the wilderness, on the way to Shur (Genesis 16:7); the well called Beer-lahai-roi (16:14). Not stated, drawn for the scene: the ring of stones round the spring.</desc>
