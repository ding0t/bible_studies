<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Yeshua, Jesus: the LORD saves: the name of Jesus</title>
<desc id="d">Yeshua, Jesus, יֵשׁוּעַ: the LORD saves: the name of Jesus. you shall call his name Jesus, for he will save his people from their sins. (Matthew 1:21 (ESV)). In the scene: three crosses: two robbers were crucified with him (Matthew 27:38); the stone rolled back (28:2); “He is not here, for he has risen” (28:6); toward the dawn of the first day (28:1).</desc>
