<title id="t">YHWH, read Adonai: the LORD, God's own name</title>
<desc id="d">YHWH, read Adonai, יְהוָה: the LORD, God's own name. This is my name forever, and thus I am to be remembered throughout all generations. (Exodus 3:15 (ESV)). In the scene: a scroll column in square script with the name in the old letters, as the Great Psalms Scroll (11Q5) writes it 164 times of 165 (Three Scripts). Not stated, drawn for the scene: the column is schematic, not a facsimile.</desc>
