<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">YHWH Tsidkenu: the LORD is our righteousness</title>
<desc id="d">YHWH Tsidkenu, יְהוָה צִדְקֵנוּ: the LORD is our righteousness. And this is the name by which he will be called: ‘The LORD is our righteousness.’ (Jeremiah 23:6 (ESV)). In the scene: a righteous Branch raised up for David (Jeremiah 23:5); drawn as Isaiah's shoot from the stump of Jesse, bearing fruit (Isaiah 11:1).</desc>
