<title id="t">El Elyon: God Most High</title>
<desc id="d">El Elyon, אֵל עֶלְיוֹן: God Most High. Blessed be Abram by God Most High, Possessor of heaven and earth. (Genesis 14:19 (ESV)). In the scene: Melchizedek king of Salem meets Abram (Genesis 14:18); bread and wine (14:18).</desc>
