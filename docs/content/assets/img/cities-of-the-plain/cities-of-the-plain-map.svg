<text x="48.0" y="1238.3" font-size="14" fill="#3b2f1e" font-weight="bold">Gomorrah</text>
<text x="198.0" y="1238.3" font-size="14" fill="#8b1e1e">Numeira?</text>
<text x="348.0" y="1238.3" font-size="14" fill="#3b2f1e" font-style="italic">burned; never resettled</text>
<rect x="40" y="1250.2548986769434" width="640" height="26" fill="#fffdf7" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="48.0" y="1268.3" font-size="14" fill="#3b2f1e" font-weight="bold">Admah</text>
<text x="198.0" y="1268.3" font-size="14" fill="#8b1e1e">Feifa?</text>
<text x="348.0" y="1268.3" font-size="14" fill="#3b2f1e" font-style="italic">burned; never resettled</text>
<rect x="40" y="1280.2548986769434" width="640" height="26" fill="#fffdf7" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="48.0" y="1298.3" font-size="14" fill="#3b2f1e" font-weight="bold">Zeboiim</text>
<text x="198.0" y="1298.3" font-size="14" fill="#8b1e1e">Khanazir?</text>
<text x="348.0" y="1298.3" font-size="14" fill="#3b2f1e" font-style="italic">burned; never resettled</text>
<rect x="40" y="1310.2548986769434" width="640" height="26" fill="#f6ecd0" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="48.0" y="1328.3" font-size="14" fill="#3b2f1e" font-weight="bold">Zoar (Bela)</text>
<text x="198.0" y="1328.3" font-size="14" fill="#a67c3d">es-Safi</text>
<text x="348.0" y="1328.3" font-size="14" fill="#3b2f1e" font-style="italic">spared; Byzantine Zoara</text>
<rect x="40.0" y="1366.3" width="640.0" height="61" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="48.0" y="1384.7" font-size="13.5" fill="#3b2f1e" font-weight="bold">Settled: Zoar outlived the overthrow.</text>
<text x="48.0" y="1401.7" font-size="13.5" fill="#3b2f1e">Isaiah 15:5 and Jeremiah 48:34 name it as a Moabite town; Josephus (Antiquities 1.204)</text>
<text x="48.0" y="1418.7" font-size="13.5" fill="#3b2f1e">says it is “to this day called Zoar”; the Madaba Map (c. AD 560) draws it among palms.</text>
<rect x="40.0" y="1441.3" width="640.0" height="78" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="48.0" y="1459.7" font-size="13.5" fill="#3b2f1e" font-weight="bold">Contested: which ruins are Sodom and Gomorrah.</text>
<text x="48.0" y="1476.7" font-size="13.5" fill="#3b2f1e">This site's chronology places the overthrow in AM 2107, 1852 BC, Abraham's 99th year.</text>
<text x="48.0" y="1493.7" font-size="13.5" fill="#3b2f1e">The excavators date Bab edh-Dhra's end c. 2350 BC and Numeira's earlier; lowered</text>
<text x="48.0" y="1510.7" font-size="13.5" fill="#3b2f1e">datings bring them nearer. The northern site, Tall el-Hammam, ends c. 1650 BC.</text>
<text x="696.0" y="1582.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>