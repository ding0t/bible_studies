<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1604" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The cities of the plain: the southern case</title>
<desc id="d">Map of the Dead Sea and its shores, with the shallow southern basin and the Lisan peninsula. Settled places are solid dots: Jericho, Bethel, Hebron, En-gedi, Masada, Mount Sodom, Mount Nebo and Madaba, where the sixth-century mosaic map shows Zoar. es-Safi, Byzantine Zoara and on this study's reading biblical Zoar, is a gold ring at the south-east corner. Dashed red rings mark the four southern sites Joel Kramer proposes for the burned cities: Bab edh-Dhra (Sodom), Numeira (Gomorrah), Feifa (Admah) and Khanazir (Zeboiim), all Early Bronze Age towns that burned and were never lived in again. A dashed grey ring marks Tall el-Hammam, the northern proposal. A table pairs each city with its proposed site. A note gives the date of the overthrow on this site's chronology, AM 2107 or 1852 BC, against the earlier conventional dates of the excavated sites.</desc>
