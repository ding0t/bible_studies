<rect x="40" y="1190.2548986769434" width="640" height="26" fill="#fffdf7" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="48.0" y="1208.3" font-size="14" fill="#3b2f1e" font-weight="bold">Sodom</text>
<text x="198.0" y="1208.3" font-size="14" fill="#8b1e1e">Bab edh-Dhra?</text>
<text x="348.0" y="1208.3" font-size="14" fill="#3b2f1e" font-style="italic">burned; never resettled</text>
