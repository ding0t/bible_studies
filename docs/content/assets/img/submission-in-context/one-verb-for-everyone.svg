<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1250" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">One verb for everyone</title>
<desc id="d">Three panels. First, Ephesians 5:21-33. Over the whole household code stands 5:21: 'submitting to one another out of reverence for Christ'. In the Greek, 5:22 has no verb of its own (literally 'wives, to your own husbands, as to the Lord'); it borrows 'submitting' from 5:21, and 5:24 states it in full: 'wives should submit in everything to their husbands'. Beside the wives' instruction stands the husbands': love as Christ loved the church and gave himself up for her, nourish and cherish. Second, 1 Corinthians 7:4 as a mirror: the wife does not have authority over her own body, but the husband does; likewise the husband does not have authority over his own body, but the wife does. The same verb runs both ways, joined by 'likewise', and 7:5 limits even abstaining to 'agreement'. Third, the four New Testament uses of the verb exousiazō: 1 Corinthians 6:12, 7:4 twice, and Luke 22:25, where Jesus says the Gentile rulers exercise authority over people, 'but not so with you'.</desc>
<rect width="720" height="1250" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1234" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1222" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">ONE VERB FOR EVERYONE</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">Ephesians 5:21-33 and 1 Corinthians 7:4, as the Greek runs</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
<path d="M200.0 120 H520.0 L510.0 133.0 L520.0 146 H200.0 L210.0 133.0 Z" fill="#3b2f1e"/>
<text x="360.0" y="138.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">EPHESIANS 5:21-33</text>
<rect x="60" y="166" width="600" height="70" rx="8" fill="#f6ecd0" stroke="#a67c3d" stroke-width="2"/>
<text x="360.0" y="192.0" font-size="16" fill="#3b2f1e" text-anchor="middle" font-style="italic">“submitting to one another out of reverence for Christ”</text>
<text x="360.0" y="216.0" font-size="14" fill="#8b1e1e" text-anchor="middle">ὑποτασσόμενοι ἀλλήλοις · 5:21 · said to the whole church</text>
<rect x="48" y="286" width="296" height="167" rx="6" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.5"/>
<text x="58.0" y="307.3" font-size="14" fill="#3b2f1e" font-weight="bold">Wives · 5:22-24, 33</text>
<text x="58.0" y="324.3" font-size="14" fill="#8b1e1e">5:22 has no verb of its own</text>
<text x="58.0" y="341.3" font-size="13.5" fill="#3b2f1e" font-style="italic">Literally: “wives, to your own</text>
<text x="58.0" y="358.3" font-size="13.5" fill="#3b2f1e" font-style="italic">husbands, as to the Lord.” The verb is</text>
<text x="58.0" y="375.3" font-size="13.5" fill="#3b2f1e" font-style="italic">borrowed from 5:21. … As the church</text>
<text x="58.0" y="392.3" font-size="13.5" fill="#3b2f1e" font-style="italic">submits to Christ, so also wives</text>
<text x="58.0" y="409.3" font-size="13.5" fill="#3b2f1e" font-style="italic">should submit in everything to their</text>
<text x="58.0" y="426.3" font-size="13.5" fill="#3b2f1e" font-style="italic">husbands.</text>
<text x="334.0" y="443.3" font-size="12" fill="#6b5a3e" text-anchor="end">Ephesians 5:22 (NA28), 24 (ESV)</text>
<rect x="376" y="286" width="296" height="133" rx="6" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.5"/>
<text x="386.0" y="307.3" font-size="14" fill="#3b2f1e" font-weight="bold">Husbands · 5:25-29, 33</text>
<text x="386.0" y="324.3" font-size="14" fill="#8b1e1e">ἀγαπᾶτε · ἐκτρέφει καὶ θάλπει</text>
<text x="386.0" y="341.3" font-size="13.5" fill="#3b2f1e" font-style="italic">Love your wives, as Christ loved the</text>
<text x="386.0" y="358.3" font-size="13.5" fill="#3b2f1e" font-style="italic">church and gave himself up for her. …</text>
<text x="386.0" y="375.3" font-size="13.5" fill="#3b2f1e" font-style="italic">nourishes and cherishes it, just as</text>
<text x="386.0" y="392.3" font-size="13.5" fill="#3b2f1e" font-style="italic">Christ does the church.</text>
<text x="662.0" y="409.3" font-size="12" fill="#6b5a3e" text-anchor="end">Ephesians 5:25, 29</text>
<path d="M196.0 236.0 L196.0 282.0" stroke="#a67c3d" stroke-width="2" fill="none"/>
<path d="M196.0 284.0 L191.7 275.0 L200.3 275.0 Z" fill="#a67c3d"/>
<path d="M524.0 236.0 L524.0 282.0" stroke="#a67c3d" stroke-width="2" fill="none"/>
<path d="M524.0 284.0 L519.7 275.0 L528.3 275.0 Z" fill="#a67c3d"/>
<rect x="60" y="479" width="600" height="58" rx="8" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="360.0" y="503.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">The measure of both: Christ, who “loved us and gave himself up for us”</text>
<text x="360.0" y="524.0" font-size="13" fill="#6b5a3e" text-anchor="middle" font-style="italic">Ephesians 5:2 · the head defined by the cross (5:23, 25)</text>
<path d="M200.0 579 H520.0 L510.0 592.0 L520.0 605 H200.0 L210.0 592.0 Z" fill="#3b2f1e"/>
<text x="360.0" y="597.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">1 CORINTHIANS 7:4</text>
<rect x="56" y="631" width="260" height="128" rx="8" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.6"/>
<text x="186.0" y="659.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE WIFE</text>
<text x="186.0" y="683.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">does not have authority</text>
<text x="186.0" y="703.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">over her own body,</text>
<text x="186.0" y="723.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">but the husband does</text>
<text x="186.0" y="747.0" font-size="14" fill="#8b1e1e" text-anchor="middle">ἐξουσιάζει</text>
<rect x="404" y="631" width="260" height="128" rx="8" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.6"/>
<text x="534.0" y="659.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE HUSBAND</text>
<text x="534.0" y="683.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">does not have authority</text>
<text x="534.0" y="703.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">over his own body,</text>
<text x="534.0" y="723.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">but the wife does</text>
<text x="534.0" y="747.0" font-size="14" fill="#8b1e1e" text-anchor="middle">ἐξουσιάζει</text>
<path d="M324.0 683.0 L392.0 683.0" stroke="#8b1e1e" stroke-width="2" fill="none"/>
<path d="M396.0 683.0 L387.0 687.3 L387.0 678.7 Z" fill="#8b1e1e"/>
<path d="M396.0 707.0 L328.0 707.0" stroke="#8b1e1e" stroke-width="2" fill="none"/>
<path d="M324.0 707.0 L333.0 702.7 L333.0 711.3 Z" fill="#8b1e1e"/>
<text x="360.0" y="699.0" font-size="15" fill="#8b1e1e" text-anchor="middle" font-weight="bold">ὁμοίως</text>
<text x="360.0" y="735.0" font-size="13" fill="#6b5a3e" text-anchor="middle" font-style="italic">“likewise”</text>
<rect x="110" y="781" width="500" height="52" rx="8" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="360.0" y="803.0" font-size="14" fill="#3b2f1e" text-anchor="middle">Read with 7:5: “except perhaps by agreement” (ἐκ συμφώνου)</text>
<text x="360.0" y="823.0" font-size="13" fill="#6b5a3e" text-anchor="middle" font-style="italic">Each is given to the other; neither is licensed to take</text>
<path d="M140.0 881 H580.0 L570.0 894.0 L580.0 907 H140.0 L150.0 894.0 Z" fill="#3b2f1e"/>
<text x="360.0" y="899.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">ἐξουσιάζω IN THE NEW TESTAMENT: 4 USES</text>
<rect x="60" y="931" width="600" height="40" rx="6" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.3"/>
<text x="76.0" y="957.0" font-size="14" fill="#3b2f1e" font-weight="bold">1 Corinthians 6:12</text>
<text x="250.0" y="957.0" font-size="14" fill="#3b2f1e" font-style="italic">“I will not be dominated by anything.”</text>
<rect x="60" y="981" width="600" height="40" rx="6" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.3"/>
<text x="76.0" y="1007.0" font-size="14" fill="#3b2f1e" font-weight="bold">1 Corinthians 7:4</text>
<text x="250.0" y="1007.0" font-size="14" fill="#3b2f1e" font-style="italic">The husband has authority over the wife’s body.</text>
<rect x="60" y="1031" width="600" height="40" rx="6" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.3"/>
<text x="76.0" y="1057.0" font-size="14" fill="#3b2f1e" font-weight="bold">1 Corinthians 7:4</text>
<text x="250.0" y="1057.0" font-size="14" fill="#3b2f1e" font-style="italic">The wife has authority over the husband’s body.</text>
<rect x="60" y="1081" width="600" height="40" rx="6" fill="#f1dcd4" stroke="#8b1e1e" stroke-width="1.3"/>
<text x="76.0" y="1107.0" font-size="14" fill="#3b2f1e" font-weight="bold">Luke 22:25-26</text>
<text x="250.0" y="1107.0" font-size="14" fill="#3b2f1e" font-style="italic">“Those in authority over them … But not so with you.”</text>
<text x="360.0" y="1151.0" font-size="14" fill="#3b2f1e" text-anchor="middle">Jesus forbids His people the Gentile kind of authority, and Paul’s only</text>
<text x="360.0" y="1171.0" font-size="14" fill="#3b2f1e" text-anchor="middle">use of the verb inside marriage gives it equally to both.</text>
<text x="360.0" y="1211.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-style="italic">“I am among you as the one who serves.”</text>
<text x="360.0" y="1233.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle">Luke 22:27, ESV</text>
<text x="696.0" y="1228.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>