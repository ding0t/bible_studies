<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 974" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">What a stone does with light</title>
<desc id="d">A drawn plate of five panels, each showing a light ray from the sun meeting a stone. 1. Clearness (transparency · diaphaneity): Light passes through the stone. Scripture: “clear as crystal” (Revelation 21:11); “for clearness” (Exodus 24:10) Seen by: the prophets themselves. Stones: Rock crystal, beryl, amethyst, emerald. 2. Lustre (vitreous · adamantine): Light comes back off a polished face. Scripture: “like the gleaming of beryl”, keʿeyn, the stone’s “eye” (Ezekiel 1:16) Seen by: the prophets themselves. Stones: Every polished stone. 3. Dispersion (refraction · “fire”): White light spreads into its colours. Scripture: the bow in the cloud around the throne (Ezekiel 1:28; Revelation 4:3) Seen by: Pliny, the iris crystal (Natural History 37.136). Stones: Every clear stone; strongest in diamond, its “fire”. 4. Asterism (phenomenal gem · silk): Fine needles inside return light as a star that moves. Scripture: No verse names it. Pliny’s “pupil” echoes Ezekiel’s “eye”. Seen by: Pliny, the asteria (Natural History 37.131). Stones: Star sapphire; not diamond. 5. Double refraction (birefringence · pleochroism): The crystal splits light in two; colour shifts as it turns. Scripture: No verse names it. Seen by: no ancient writer; first described in 1669. Stones: Sapphire, emerald, beryl, amethyst; not diamond or garnet. The double refraction panel is drawn dashed because no ancient writer described it. The plate closes: in every case the light comes from outside the stone, with Revelation 21:11.</desc>
