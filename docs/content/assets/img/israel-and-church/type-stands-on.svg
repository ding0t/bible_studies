<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">What the picture stands on</title>
<desc id="d">A house labelled the church as Christ's betrothed bride, standing on two tiers. Its foundation, tier 1, is bedrock: Scripture states it, Ephesians 5:31-32 · 2 Corinthians 11:2 · John 3:29 · Revelation 19:7-9 · 21:2, 9 · Hosea 2:19-20 · Isaiah 54:5; 62:5. Above the bedrock, tier 2 is a course of dressed stones, documented custom: Betrothal binding (m. Kiddushin 1:1); Twelve months to prepare (m. Ketubot 5:2); The father’s house (Tobit 7:13); A seven-day feast (Genesis 29:27). Below, on the ground and outside the house, tier 3 is three loose stones in dashed red, with no ancient source and set aside: The father inspects the addition; “Only my father knows” as an idiom; John 14:2 as a bridal chamber. It closes on Acts 1:7, times or seasons that the Father has fixed by his own authority.</desc>
