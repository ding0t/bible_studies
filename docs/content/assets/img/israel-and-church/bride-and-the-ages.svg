<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 848" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">From the supper to the house</title>
<desc id="d">A time line from the church age through the seven-year week (Daniel 9:27) and the thousand years (Revelation 20:1-6, a span the text counts) to the new heaven and new earth. Components 1 to 5, purchased, betrothed, pledged, set apart and preparing, fall in the church age, marked you are here. Component 6, fetched, caught up to meet the Lord in the air (1 Thessalonians 4:17), is a dashed arrow, placed by inference, up from the end of the church age to a cloud labelled in heaven, where component 7, married and feasting, the marriage of the Lamb (Revelation 19:7-9), is placed by its order. A solid arrow brings Christ back in power at the end of the week (Revelation 19:11; Matthew 24:29). The great white throne (Revelation 20:11-15) stands between the thousand years and the new creation. A red bracket marks the age between components 7 and 8: the return, the reign and the judgment. Component 8, homed, God dwells with them (Revelation 21:3), is in the new heaven and new earth. Solid is dated by the text; dashed is placed by its order, or inferred. It closes on John 14:3, that where I am you may be also.</desc>
