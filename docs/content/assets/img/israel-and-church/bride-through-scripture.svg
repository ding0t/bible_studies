<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1078" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The bride through Scripture</title>
<desc id="d">A chart of the bride through Scripture in two lanes, the Husband on the left and the Bride on the right, joined in each era. The prophets: the LORD, your Maker, is your husband (Isaiah 54:5; Jeremiah 31:32), and Israel is betrothed to Him, I will betroth you to me forever (Hosea 2:19-20; Jeremiah 2:2; Ezekiel 16:8). A red arrow marks the title passing to Jesus. The Gospels: Jesus is the bridegroom, the one who has the bride (John 3:29; Matthew 9:15; 25:1), and He promises, I will come again and will take you to myself (John 14:2-3). The Epistles: Christ loved the church and gave himself up for her (Ephesians 5:25), and the church is betrothed to one husband (2 Corinthians 11:2; Ephesians 5:31-32). Revelation: the marriage of the Lamb has come, and his Bride has made herself ready, the Bride, the wife of the Lamb (Revelation 19:7-8; 21:2, 9). Israel's lane does not run into the church's. A dashed note gives this site's reading, one Husband with two covenanted peoples, since Hosea 2:19's betrothal is still future, and names the one-bride reading of Revelation 21:9-14. It closes on Revelation 22:17, The Spirit and the Bride say, Come.</desc>
