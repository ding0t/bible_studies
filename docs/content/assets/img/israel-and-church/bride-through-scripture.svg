<text x="50.0" y="779.7" font-size="13.5" fill="#3b2f1e" font-weight="bold">One Husband, two covenanted peoples (this site’s reading).</text>
<text x="50.0" y="798.7" font-size="13" fill="#3b2f1e">Israel’s betrothal is not cancelled: “I will betroth you to me forever” is</text>
<text x="50.0" y="817.7" font-size="13" fill="#3b2f1e">still future when Hosea writes it (Hosea 2:19). Israel remains the wife of</text>
<text x="50.0" y="836.7" font-size="13" fill="#3b2f1e">the LORD; the church is the bride of Christ, betrothed in this present age;</text>
<text x="50.0" y="855.7" font-size="13" fill="#3b2f1e">and the Son is the LORD who married Israel. Readers who hold one people</text>
<text x="50.0" y="874.7" font-size="13" fill="#3b2f1e">of God read Revelation 21:9-14 as a single bride instead.</text>
<rect x="40.0" y="912.0" width="200.0" height="27" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="48.0" y="930.5" font-size="13" fill="#3b2f1e" font-weight="bold">Scripture states it</text>
<rect x="256.0" y="912.0" width="150.0" height="27" rx="5" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.4" stroke-dasharray="5 4"/>
