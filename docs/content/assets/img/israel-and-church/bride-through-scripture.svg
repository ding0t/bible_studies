<text x="360.0" y="1026.0" font-size="13" fill="#6b5a3e" text-anchor="middle" font-style="italic">Revelation 22:17 (ESV)</text>
<text x="696.0" y="1056.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
