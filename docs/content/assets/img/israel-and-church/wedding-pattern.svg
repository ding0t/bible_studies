<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Four done, one now, three ahead</title>
<desc id="d">The wedding pattern's eight components down a central line, in three bands. Done, already true of you: components 1 to 4. Now, where you stand: component 5, marked you are here. Ahead, announced and not yet done: components 6 to 8. 1, Purchased: you were bought with a price (1 Corinthians 6:20), ἠγοράσθητε, aorist; the custom: betrothal “by money” · m. Kiddushin 1:1; 2, Betrothed: I betrothed you to one husband (2 Corinthians 11:2), ἡρμοσάμην, aorist; the custom: betrothal “by document” · m. Kiddushin 1:1; 3, Pledged: sealed with the promised Holy Spirit (Ephesians 1:13-14), ἐσφραγίσθητε, aorist; the custom: a deposit against the rest · ἀρραβών; 4, Set apart: you were washed, you were sanctified (1 Corinthians 6:11), ἡγιάσθητε, aorist; the custom: “the sanctification of the bride”; 5, Preparing: I go to prepare a place for you (John 14:2 · Revelation 19:7); the custom: twelve months, for both · m. Ketubot 5:2; 6, Fetched: to meet the Lord in the air (1 Thessalonians 4:17 · Matthew 25:6); the custom: the groom comes for her; 7, Married, and feasting: the marriage supper of the Lamb (Revelation 19:7-9); the custom: a seven-day feast · Genesis 29:27; 8, Homed: the dwelling place of God is with man (Revelation 21:3 · John 14:2); the custom: the groom’s father’s house. A note says each Greek verb in red is aorist, an act done and over. It closes on Philippians 1:6, he who began a good work in you will bring it to completion.</desc>
