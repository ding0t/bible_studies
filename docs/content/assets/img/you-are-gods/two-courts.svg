<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1489" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Two courts: Psalm 82 and John 10</title>
<desc id="d">A relationship diagram in two parts. Above, two columns: Psalm 82, God's court, on the left, and the court at the Feast of Dedication in John on the right, joined by six numbered rungs. 1, given God's word: 'I said, You are gods, sons of the Most High, all of you' (Psalm 82:6) beside 'he called them gods to whom the word of God came', written 'in your Law' (John 10:34-35). 2, judging unjustly: 'How long will you judge unjustly and show partiality to the wicked?' (Psalm 82:2) beside 'Do not judge by appearances, but judge with right judgment' (John 7:24). 3, the weak abandoned: 'Give justice to the weak and the fatherless' (Psalm 82:3) beside the man born blind, given his sight, cast out, and Jesus going to find him (John 9:34-35). 4, walking in darkness: 'They have neither knowledge nor understanding, they walk about in darkness' (Psalm 82:5) beside 'Are you the teacher of Israel and yet you do not understand these things?' (John 3:10). 5, the sentence: 'nevertheless, like men you shall die, and fall like any prince' (Psalm 82:7) beside 'now that you say, We see, your guilt remains' (John 9:41). 6, the Judge, drawn dashed as a link John does not make in this scene: 'Arise, O God, judge the earth' (Psalm 82:8) beside 'the Father judges no one, but has given all judgment to the Son' (John 5:22). Below, the test of works as a balance under the one 'whom the Father consecrated and sent into the world' (John 10:36). The left pan holds their works: they cast out the man who was healed (John 9:34), 'you seek to kill me' (John 8:40), and stones taken up (John 10:31); its verdict, 'now they have seen and hated both me and my Father' (John 15:24). The right pan holds His works: 'The works that I do in my Father's name bear witness about me' (John 10:25), 'many good works from the Father' (John 10:32), 'believe the works' (John 10:38); its verdict, 'that you may know and understand that the Father is in me and I am in the Father' (John 10:38).</desc>
