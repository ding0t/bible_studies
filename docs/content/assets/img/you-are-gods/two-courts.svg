<text x="40.0" y="370.4" font-size="13.5" fill="#3b2f1e" font-style="italic">“How long will you judge unjustly</text>
<text x="40.0" y="387.4" font-size="13.5" fill="#3b2f1e" font-style="italic">and show partiality to the wicked?”</text>
<text x="290.0" y="404.4" font-size="12" fill="#6b5a3e" text-anchor="end">Psalm 82:2</text>
<rect x="420" y="350.0" width="270" height="63" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="430.0" y="370.4" font-size="13.5" fill="#3b2f1e" font-style="italic">“Do not judge by appearances, but</text>
<text x="430.0" y="387.4" font-size="13.5" fill="#3b2f1e" font-style="italic">judge with right judgment”</text>
<text x="680.0" y="404.4" font-size="12" fill="#6b5a3e" text-anchor="end">John 7:24</text>
