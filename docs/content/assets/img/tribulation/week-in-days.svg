<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 876" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The week in days</title>
<desc id="d">A ruler of Daniel's seventieth week, 2,520 days, split at day 1,260. Under the second half run the spans Scripture counts: the woman nourished in the wilderness 1,260 days (Revelation 12:6); a time, times and half a time (Daniel 7:25; 12:7; Revelation 12:14); the beast's forty-two months (Revelation 13:5); the holy city trampled forty-two months (Revelation 11:2). The two witnesses' 1,260 days (Revelation 11:3) are drawn dashed over either half, since the text does not say which. Two of Daniel's counts run from the abomination past the end of the week: 1,290 days (Daniel 12:11), thirty days beyond it, and 1,335 days (Daniel 12:12), forty-five more, drawn on an enlarged scale after a break. A note gives the arithmetic: forty-two months of thirty days and three and a half years of 360 days are both 1,260 days.</desc>
<rect width="720" height="876" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="860" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="848" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE WEEK IN DAYS</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">One span, counted three ways, and Daniel's two extra counts</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
