<text x="40.0" y="232.0" font-size="13" fill="#8b1e1e" font-weight="bold">day 1</text>
<text x="315.0" y="232.0" font-size="13" fill="#8b1e1e" text-anchor="end" font-weight="bold">1,260</text>
<text x="600.0" y="232.0" font-size="13" fill="#8b1e1e" text-anchor="middle" font-weight="bold">2,520</text>
<path d="M320 166 V706" stroke="#8b1e1e" stroke-width="2.5"/>
<text x="326.0" y="256.0" font-size="13" fill="#8b1e1e" font-style="italic">The abomination · Daniel 9:27; Matthew 24:15</text>
<path d="M320.0 306 H600.0" stroke="#3b2f1e" stroke-width="5"/>
<path d="M320.0 298 V314 M600.0 298 V314" stroke="#3b2f1e" stroke-width="2"/>
<text x="324.0" y="294.0" font-size="14" fill="#3b2f1e" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1,260 days · the woman sheltered</text>
<text x="324.0" y="327.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Revelation 12:6</text>
<path d="M320.0 368 H600.0" stroke="#3b2f1e" stroke-width="5"/>
<path d="M320.0 360 V376 M600.0 360 V376" stroke="#3b2f1e" stroke-width="2"/>
