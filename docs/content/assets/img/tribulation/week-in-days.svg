<text x="324.0" y="451.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Revelation 13:5</text>
<path d="M320.0 492 H600.0" stroke="#3b2f1e" stroke-width="5"/>
<path d="M320.0 484 V500 M600.0 484 V500" stroke="#3b2f1e" stroke-width="2"/>
<text x="324.0" y="480.0" font-size="14" fill="#3b2f1e" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">42 months · the holy city trampled</text>
<text x="324.0" y="513.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Revelation 11:2</text>
<path d="M40.0 554 H304" stroke="#2f4f7f" stroke-width="5" stroke-dasharray="7 5"/>
<path d="M336 554 H600.0" stroke="#2f4f7f" stroke-width="5" stroke-dasharray="7 5"/>
<path d="M40.0 546 V562 M600.0 546 V562" stroke="#2f4f7f" stroke-width="2"/>
<text x="320.0" y="559.0" font-size="14" fill="#2f4f7f" text-anchor="middle" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">or</text>
<text x="40.0" y="542.0" font-size="14" fill="#2f4f7f" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1,260 days · the two witnesses: which half?</text>
<text x="40.0" y="575.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Revelation 11:3 · unstated; the cascade favours the first</text>
<path d="M320.0 616 H640.4" stroke="#8b1e1e" stroke-width="5"/>
<path d="M320.0 608 V624 M640.4 608 V624" stroke="#8b1e1e" stroke-width="2"/>
<text x="324.0" y="604.0" font-size="14" fill="#8b1e1e" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1,290 days from the abomination</text>
<text x="324.0" y="637.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 12:11 · thirty days past the end</text>
<path d="M320.0 678 H680.0" stroke="#8b1e1e" stroke-width="5"/>
<path d="M320.0 670 V686 M680.0 670 V686" stroke="#8b1e1e" stroke-width="2"/>
<text x="324.0" y="666.0" font-size="14" fill="#8b1e1e" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1,335 days · “Blessed is he who waits”</text>
<text x="324.0" y="699.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Daniel 12:12 · forty-five days more</text>
<rect x="40" y="728" width="640" height="96" rx="6" fill="#fffdf7" stroke="#3b2f1e"/>
<text x="360.0" y="756.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold">42 months × 30 days = 1,260 days = 3½ years × 360 days</text>
<text x="360.0" y="780.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">The three measures agree only on a 360-day prophetic year.</text>
<text x="360.0" y="802.0" font-size="13.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Daniel does not say what the extra 30 and 45 days hold.</text>
<text x="696.0" y="854.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
