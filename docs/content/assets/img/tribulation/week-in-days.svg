<text x="320.0" y="144.0" font-size="14" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1.5">ONE WEEK · SEVEN YEARS · DANIEL 9:27</text>
<rect x="40" y="178" width="280" height="34" fill="#f6ecd0" stroke="#3b2f1e"/>
<rect x="320" y="178" width="280" height="34" fill="#f1dcd4" stroke="#3b2f1e"/>
<text x="180.0" y="200.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold">First half</text>
<text x="460.0" y="200.0" font-size="15" fill="#8b1e1e" text-anchor="middle" font-weight="bold">“Great tribulation”</text>
