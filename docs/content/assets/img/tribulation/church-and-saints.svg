<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Church and saints in Revelation</title>
<desc id="d">A chapter-by-chapter count of four Greek words across Revelation's twenty-two chapters, one dot per occurrence, under the book's own division (Revelation 1:19): what John has seen (chapter 1), what is (chapters 2 and 3), and what must take place after this (chapters 4 to 22), opened at 4:1 by a door in heaven. The judgments of chapters 6 to 19 are shaded. ekklesia, church, occurs twenty times: nineteen in chapters 1 to 3 and once in 22:16, and not at all in between. hagioi, saints, occurs thirteen times, all in chapters 5 to 20. thlipsis, tribulation, occurs five times: four in chapters 1 and 2, where it is the churches' present suffering, and once in 7:14, 'the great tribulation'. metanoeo, repent, occurs eight times in the letters, as a call or a warning to the churches and once already refused, 'she refuses to repent' (2:21), and four times in chapters 9 and 16, where every one is 'they did not repent'.</desc>
