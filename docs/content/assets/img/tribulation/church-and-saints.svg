<circle cx="34" cy="712" r="4.4" fill="#a67c3d"/>
<text x="46.0" y="717.0" font-size="13" fill="#3b2f1e">Pretribulational reading: the church, named nineteen times to the end of</text>
<text x="46.0" y="734.0" font-size="13" fill="#3b2f1e">chapter 3, is in heaven while chapters 6–19 unfold on earth.</text>
<circle cx="34" cy="756" r="4.4" fill="#2f4f7f"/>
<text x="46.0" y="761.0" font-size="13" fill="#3b2f1e">Other readers: the “saints” of chapters 5–20 are the church on earth.</text>
<text x="46.0" y="778.0" font-size="13" fill="#6b5a3e" font-style="italic">A count shows where a word is; it cannot say who the saints are.</text>
<text x="696.0" y="798.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
