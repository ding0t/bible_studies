<text x="82.0" y="310.0" font-size="13" fill="#6b5a3e" text-anchor="end">50%</text>
<path d="M90 222.5 H680" stroke="#a67c3d" stroke-width="0.5" stroke-opacity="0.5"/>
<text x="82.0" y="227.5" font-size="13" fill="#6b5a3e" text-anchor="end">75%</text>
<path d="M90 140.0 H680" stroke="#a67c3d" stroke-width="0.5" stroke-opacity="0.5"/>
<text x="82.0" y="145.0" font-size="13" fill="#6b5a3e" text-anchor="end">100%</text>
<text x="90.0" y="490.0" font-size="13" fill="#6b5a3e" text-anchor="middle">0</text>
<text x="237.5" y="490.0" font-size="13" fill="#6b5a3e" text-anchor="middle">5,000</text>
