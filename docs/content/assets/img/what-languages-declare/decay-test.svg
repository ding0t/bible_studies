<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 795" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The decay test</title>
<desc id="d">Share of core vocabulary two languages keep in common, falling with time since they were one: between 86% and 80.5% retention per millennium for each. At Babel, c. 2103 BC, drift alone would leave 17 to 29 percent shared between any two languages; by 10,000 years it reaches the chance level of about 5 percent. Three models: one tongue drifting since c. 2100 BC is ruled out; one tongue 50,000 years ago matches by erasing the evidence; one tongue divided at a stroke, Genesis 11:7-9, matches.</desc>
<rect width="720" height="795" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="779" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="767" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE DECAY TEST</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">What drift alone would leave behind</text>
