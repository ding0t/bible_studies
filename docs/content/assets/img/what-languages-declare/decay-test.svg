<text x="532.5" y="490.0" font-size="13" fill="#6b5a3e" text-anchor="middle">15,000</text>
<text x="680.0" y="490.0" font-size="13" fill="#6b5a3e" text-anchor="middle">20,000</text>
<text x="385.0" y="512.0" font-size="14" fill="#3b2f1e" text-anchor="middle">Years since the languages were one</text>
<text x="30.0" y="305.0" font-size="14" fill="#3b2f1e" text-anchor="middle" transform="rotate(-90 30 305.0)">Core vocabulary still shared</text>
