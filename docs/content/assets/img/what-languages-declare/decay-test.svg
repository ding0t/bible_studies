<path d="M211.8 140 V470" stroke="#8b1e1e" stroke-width="2"/>
<path d="M228.0 180 V470" stroke="#8b1e1e" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="205.8" y="154.0" font-size="13" fill="#8b1e1e" text-anchor="end" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Babel c. 2103 BC</text>
<text x="234.0" y="194.0" font-size="12.5" fill="#8b1e1e" font-style="italic" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Septuagint: 2652 BC</text>
<circle cx="211.8" cy="415.1" r="4.5" fill="#8b1e1e"/>
<circle cx="211.8" cy="375.0" r="4.5" fill="#8b1e1e"/>
<path d="M217.8 375.0 H234.0" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="238.0" y="371.0" font-size="13" fill="#3b2f1e" font-weight="bold" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">17–29% if one tongue drifted</text>
<text x="238.0" y="388.0" font-size="13" fill="#3b2f1e" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">from 2103 BC: shared between</text>
<text x="238.0" y="405.0" font-size="13" fill="#3b2f1e" stroke="#faf6ec" stroke-width="5" stroke-linejoin="round" paint-order="stroke">any two languages on earth</text>
<text x="40.0" y="540.0" font-size="14" fill="#3b2f1e" font-weight="bold" letter-spacing="1.5">THREE WAYS TO GET TODAY'S LANGUAGES</text>
<rect x="40.0" y="552.0" width="206.7" height="129" rx="5" fill="#fffdf7" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="48.0" y="570.5" font-size="13" fill="#3b2f1e" font-weight="bold">One tongue, drift,</text>
<text x="48.0" y="587.5" font-size="13" fill="#3b2f1e">since c. 2100 BC</text>
<text x="48.0" y="604.5" font-size="13" fill="#3b2f1e">Predicts 17–29% shared</text>
<text x="48.0" y="621.5" font-size="13" fill="#3b2f1e">everywhere.</text>
<text x="48.0" y="638.5" font-size="13" fill="#3b2f1e">Observed: chance level</text>
<text x="48.0" y="655.5" font-size="13" fill="#3b2f1e">between families.</text>
<text x="48.0" y="672.5" font-size="11.5" fill="#6b5a3e" font-style="italic">Ruled out</text>
<rect x="256.7" y="552.0" width="206.7" height="129" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="264.7" y="570.5" font-size="13" fill="#3b2f1e" font-weight="bold">One tongue, drift,</text>
<text x="264.7" y="587.5" font-size="13" fill="#3b2f1e">50,000+ years ago</text>
<text x="264.7" y="604.5" font-size="13" fill="#3b2f1e">Predicts near 0%:</text>
<text x="264.7" y="621.5" font-size="13" fill="#3b2f1e">matches, by giving</text>
<text x="264.7" y="638.5" font-size="13" fill="#3b2f1e">the evidence time</text>
<text x="264.7" y="655.5" font-size="13" fill="#3b2f1e">to vanish.</text>
<text x="264.7" y="672.5" font-size="11.5" fill="#6b5a3e" font-style="italic">The mainstream view</text>
<rect x="473.3" y="552.0" width="206.7" height="112" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="481.3" y="570.5" font-size="13" fill="#3b2f1e" font-weight="bold">One tongue, divided</text>
<text x="481.3" y="587.5" font-size="13" fill="#3b2f1e">at a stroke, c. 2100 BC</text>
<text x="481.3" y="604.5" font-size="13" fill="#3b2f1e">Predicts unrelated</text>
<text x="481.3" y="621.5" font-size="13" fill="#3b2f1e">families from the</text>
<text x="481.3" y="638.5" font-size="13" fill="#3b2f1e">start: matches.</text>
<text x="481.3" y="655.5" font-size="11.5" fill="#6b5a3e" font-style="italic">Genesis 11:7-9</text>
<text x="40.0" y="707.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Band: 86% of core words kept per thousand years (Swadesh 1955, 100-word list) down to</text>
<text x="40.0" y="722.5" font-size="11.5" fill="#6b5a3e" font-style="italic">80.5% (Lees 1953, 200-word list), applied to both languages of a pair. Fixed rates are</text>
<text x="40.0" y="738.0" font-size="11.5" fill="#6b5a3e" font-style="italic">disputed (Bergsland &amp; Vogt 1962), so the band is an order of magnitude, never a date.</text>
<text x="696.0" y="773.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>