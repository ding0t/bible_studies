<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">How fast languages multiply</title>
<desc id="d">Doubling time of the number of languages: Romance every 255 years; Arabic every 257 years; Slavic every 324 years; Germanic every 372 years; Narrow Bantu every 547 years; Babel, Masoretic every 609 years; Babel, Septuagint every 690 years; One tongue, 50k years every 3,874 years; One tongue, 100k years every 7,748 years. Families with a recorded history doubled faster than Babel requires; one language long ago requires a rate ten to thirty times slower than any of them.</desc>
<rect width="720" height="700" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="684" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="672" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">HOW FAST TONGUES MULTIPLY</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">Measured rates beside the rates each history needs</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
<text x="40.0" y="140.0" font-size="14" fill="#3b2f1e" font-weight="bold">Years for the number of languages to double (net of languages lost)</text>
<text x="40.0" y="182.0" font-size="14" fill="#3b2f1e" font-weight="bold">Romance</text>
<text x="40.0" y="199.0" font-size="12" fill="#6b5a3e" font-style="italic">77 languages in 1,600 years</text>
<rect x="300" y="172" width="9.9" height="24" fill="#a67c3d" fill-opacity="0.35" stroke="#a67c3d" stroke-width="1.4"/>
<text x="317.9" y="189.0" font-size="14" fill="#3b2f1e" font-weight="bold">255</text>
<text x="40.0" y="228.0" font-size="14" fill="#3b2f1e" font-weight="bold">Arabic</text>
<text x="40.0" y="245.0" font-size="12" fill="#6b5a3e" font-style="italic">38 languages in 1,350 years</text>
<rect x="300" y="218" width="10.0" height="24" fill="#a67c3d" fill-opacity="0.35" stroke="#a67c3d" stroke-width="1.4"/>
<text x="318.0" y="235.0" font-size="14" fill="#3b2f1e" font-weight="bold">257</text>
<text x="40.0" y="274.0" font-size="14" fill="#3b2f1e" font-weight="bold">Slavic</text>
<text x="40.0" y="291.0" font-size="12" fill="#6b5a3e" font-style="italic">20 languages in 1,400 years</text>
<rect x="300" y="264" width="12.6" height="24" fill="#a67c3d" fill-opacity="0.35" stroke="#a67c3d" stroke-width="1.4"/>
<text x="320.6" y="281.0" font-size="14" fill="#3b2f1e" font-weight="bold">324</text>
<text x="40.0" y="320.0" font-size="14" fill="#3b2f1e" font-weight="bold">Germanic</text>
<text x="40.0" y="337.0" font-size="12" fill="#6b5a3e" font-style="italic">106 languages in 2,500 years</text>
<rect x="300" y="310" width="14.4" height="24" fill="#a67c3d" fill-opacity="0.35" stroke="#a67c3d" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="322.4" y="327.0" font-size="14" fill="#3b2f1e" font-weight="bold">372</text>
<text x="40.0" y="366.0" font-size="14" fill="#3b2f1e" font-weight="bold">Narrow Bantu</text>
<text x="40.0" y="383.0" font-size="12" fill="#6b5a3e" font-style="italic">563 languages in 5,000 years</text>
<rect x="300" y="356" width="21.2" height="24" fill="#a67c3d" fill-opacity="0.35" stroke="#a67c3d" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="329.2" y="373.0" font-size="14" fill="#3b2f1e" font-weight="bold">547</text>
<path d="M40 394 H680" stroke="#a67c3d" stroke-width="0.6"/>
<text x="40.0" y="420.0" font-size="14" fill="#3b2f1e" font-weight="bold">Babel, Masoretic</text>
<text x="40.0" y="437.0" font-size="12" fill="#6b5a3e" font-style="italic">70 to 7,674 since 2103 BC</text>
<rect x="300" y="410" width="23.6" height="24" fill="#8b1e1e" fill-opacity="0.35" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="331.6" y="427.0" font-size="14" fill="#3b2f1e" font-weight="bold">609</text>
<text x="40.0" y="466.0" font-size="14" fill="#3b2f1e" font-weight="bold">Babel, Septuagint</text>
<text x="40.0" y="483.0" font-size="12" fill="#6b5a3e" font-style="italic">70 to 7,674 since 2652 BC</text>
<rect x="300" y="456" width="26.8" height="24" fill="#8b1e1e" fill-opacity="0.35" stroke="#8b1e1e" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="334.8" y="473.0" font-size="14" fill="#3b2f1e" font-weight="bold">690</text>
<path d="M40 494 H680" stroke="#a67c3d" stroke-width="0.6"/>
<text x="40.0" y="520.0" font-size="14" fill="#3b2f1e" font-weight="bold">One tongue, 50k years</text>
<text x="40.0" y="537.0" font-size="12" fill="#6b5a3e" font-style="italic">1 to 7,674 since 50,000 years ago</text>
<rect x="300" y="510" width="150.1" height="24" fill="#2f4f7f" fill-opacity="0.35" stroke="#2f4f7f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="458.1" y="527.0" font-size="14" fill="#3b2f1e" font-weight="bold">3,874</text>
<text x="40.0" y="566.0" font-size="14" fill="#3b2f1e" font-weight="bold">One tongue, 100k years</text>
<text x="40.0" y="583.0" font-size="12" fill="#6b5a3e" font-style="italic">1 to 7,674 since 100,000 years ago</text>
<rect x="300" y="556" width="300.3" height="24" fill="#2f4f7f" fill-opacity="0.35" stroke="#2f4f7f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="608.3" y="573.0" font-size="14" fill="#3b2f1e" font-weight="bold">7,748</text>
<text x="40.0" y="612.0" font-size="12" fill="#6b5a3e" font-style="italic">Gold: families whose growth history records. Red: what Babel needs. Blue: what one</text>
<text x="40.0" y="628.0" font-size="12" fill="#6b5a3e" font-style="italic">language long ago needs. Dashed: the age is a model date, or the Septuagint's chronology.</text>
<text x="40.0" y="644.0" font-size="12" fill="#6b5a3e" font-style="italic">Counts: Glottolog, including recorded extinct varieties. Doubling time = years × ln 2 / ln(growth).</text>
<text x="696.0" y="678.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>