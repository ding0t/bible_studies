<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 803" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">When each family first wrote</title>
<desc id="d">Timeline from 3400 BC to the start of the era of the first written record of each language family: Egyptian c. 3250 BC; Sumerian c. 3200 BC; Akkadian c. 2400 BC; Elamite c. 2250 BC; Hittite and Luwian c. 1900 BC; Greek c. 1400 BC; Indo-Aryan c. 1380 BC; Chinese c. 1250 BC; Mayan c. 300 BC. Marked against the Flood (2303 BC Masoretic, 3183 BC Septuagint) and Peleg's lifetime (2202-1963 BC Masoretic, 2652-2313 BC Septuagint). Egyptian and Sumerian writing is dated before both Flood dates; every Indo-European record falls after Peleg.</desc>
<rect width="720" height="803" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="787" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
