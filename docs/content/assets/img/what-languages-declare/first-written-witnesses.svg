<text x="40.0" y="546.0" font-size="11.5" fill="#3b2f1e">Egyptian, c. 3250 BC: Abydos tomb U-j labels (reading as language disputed).</text>
<text x="40.0" y="561.5" font-size="11.5" fill="#3b2f1e">Sumerian, c. 3200 BC: Uruk IV proto-cuneiform (language identification disputed).</text>
<text x="40.0" y="577.0" font-size="11.5" fill="#3b2f1e">Akkadian, c. 2400 BC: Old Akkadian royal inscriptions.</text>
<text x="40.0" y="592.5" font-size="11.5" fill="#3b2f1e">Elamite, c. 2250 BC: Old Elamite treaty with Naram-Sin.</text>
<text x="40.0" y="608.0" font-size="11.5" fill="#3b2f1e">Hittite and Luwian, c. 1900 BC: personal names in the Kanesh merchant archives (Kloekhorst, Kanishite Hittite, 2019).</text>
<text x="40.0" y="623.5" font-size="11.5" fill="#3b2f1e">Greek, c. 1400 BC: Linear B tablets, Knossos.</text>
<text x="40.0" y="639.0" font-size="11.5" fill="#3b2f1e">Indo-Aryan, c. 1380 BC: Mitra and Varuna in the Mitanni treaty with the Hittites.</text>
<text x="40.0" y="654.5" font-size="11.5" fill="#3b2f1e">Chinese, c. 1250 BC: oracle-bone inscriptions, reign of Wu Ding.</text>
<text x="40.0" y="670.0" font-size="11.5" fill="#3b2f1e">Mayan, c. 300 BC: San Bartolo murals.</text>
<text x="40.0" y="699.5" font-size="11.5" fill="#6b5a3e" font-style="italic">Solid dot: an agreed first record. Open dot: the date or the language is disputed.</text>
<text x="40.0" y="715.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Red band: Peleg's lifetime, “in his days the earth was divided” (Genesis 10:25, ESV),</text>
<text x="40.0" y="730.5" font-size="11.5" fill="#6b5a3e" font-style="italic">on the Masoretic text this site follows; dashed: the same on the Septuagint. Dates are</text>
<text x="40.0" y="746.0" font-size="11.5" fill="#6b5a3e" font-style="italic">conventional archaeological ones; how they meet the Flood is weighed in The Flood and the King Lists.</text>
<text x="696.0" y="781.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>