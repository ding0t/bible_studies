<text x="40.0" y="878.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Red: arose within about 1,000 km of Jerusalem. Dashed: the link is disputed (Brahmi's descent</text>
<text x="40.0" y="893.5" font-size="11.5" fill="#6b5a3e" font-style="italic">from Aramaic; South Arabian's branching point) or the script was modelled on another, not descended.</text>
<text x="40.0" y="909.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Dates conventional (Daniels &amp; Bright 1996). Other independent or invented scripts, such as Korean</text>
<text x="40.0" y="924.5" font-size="11.5" fill="#6b5a3e" font-style="italic">Hangul (AD 1443) and Cherokee (1821), are later and few.</text>
<text x="696.0" y="960.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
