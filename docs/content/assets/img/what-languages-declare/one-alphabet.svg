<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 982" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">One alphabet, few inventions</title>
<desc id="d">Writing was invented independently a few times: Egyptian hieroglyphs c. 3250 BC and cuneiform at Uruk, the Erech of Genesis 10:10, c. 3200 BC, both within about 1,000 km of Jerusalem; Chinese characters c. 1250 BC; Maya glyphs c. 300 BC. The alphabet began as Proto-Sinaitic letters in Sinai and Egypt c. 1850 BC and passed through Phoenician to Paleo-Hebrew, Greek (then Latin, Cyrillic), Aramaic (then square Hebrew, Syriac, Arabic, Mongolian, Kharosthi and, disputed, Brahmi and the scripts of South and Southeast Asia); South Arabian (then Ge'ez) branched off before Phoenician, at a disputed point.</desc>
