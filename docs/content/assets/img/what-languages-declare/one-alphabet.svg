<text x="40.0" y="302.0" font-size="14" fill="#3b2f1e" font-weight="bold" letter-spacing="1.5">AND ONE ALPHABET BECAME MOST OF THE REST</text>
<text x="40.0" y="322.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Its letter shapes drawn from Egyptian hieroglyphs</text>
