<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1110" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Known before, seen after</title>
<desc id="d">A chart of the 118 Old Testament prophecies of Christ in this site's ledger, by whether anyone read each one of the Messiah before Jesus. By subject: Lineage: 6 of 8 known before, 0 in part, 1 read only later, 1 veiled; Birth: 1 of 3 known before, 1 in part, 0 read only later, 1 veiled; Childhood: 1 of 5 known before, 0 in part, 0 read only later, 4 veiled; Forerunner: 1 of 3 known before, 2 in part, 0 read only later, 0 veiled; Nature: 1 of 14 known before, 0 in part, 2 read only later, 11 veiled; Ministry: 2 of 13 known before, 0 in part, 3 read only later, 8 veiled; Prophet, priest, king: 2 of 10 known before, 0 in part, 1 read only later, 7 veiled; Passion: 0 of 26 known before, 2 in part, 2 read only later, 22 veiled; Resurrection: 1 of 13 known before, 0 in part, 1 read only later, 11 veiled; Redemption: 2 of 7 known before, 0 in part, 0 read only later, 5 veiled; Future: 3 of 16 known before, 1 in part, 2 read only later, 10 veiled. By who brought the fulfilment about: His opponents: 0 of 19 known before; Unwitting agents: 1 of 4 known before; His followers: 0 of 2 known before; Jesus, knowingly: 1 of 18 known before; God alone: 14 of 58 known before; Still to come: 4 of 17 known before. The prophecies of His line and throne were known; the prophecies of His suffering, and every prophecy His opponents fulfilled, were not. Luke 24:45: Then He opened their minds to understand the Scriptures.</desc>
