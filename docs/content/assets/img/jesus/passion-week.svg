<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Passion Week: the prophecies, day by day</title>
<desc id="d">The 42 prophecies of Christ in this site's ledger that were fulfilled in His last week, on the day and hour the site's chronology gives each event (AD 33, the Hebrew day running from evening to evening). 25 of them fall on one day, 14 Nisan, from the Last Supper on Thursday evening to the burial before sunset on Friday. 10 Nisan: The Triumphal Entry (Zechariah 9:9, Psalm 118:26); 11 Nisan: The temple cleared (Psalm 8:2); 12 Nisan: "Two days before the Passover": the plot, and Judas (Zechariah 11:12-13); 14 Nisan: The Last Supper (Psalm 41:9), Bread and cup: "my blood of the covenant" (Jeremiah 31:31-34), The kiss, and the arrest (Psalm 55:12-14, Zechariah 13:7), Before Caiaphas: "I am" (Psalm 35:11; 27:12), Before Pilate: "Are you the King of the Jews?" (Isaiah 53:7-8), Sent to Herod Antipas, and back (Psalm 2:1-2), Barabbas released; Jesus scourged and crowned with thorns (Isaiah 50:6), Crucified at the third hour (Psalm 22:18, Psalm 22:16, Isaiah 53:5, 9, 12, Numbers 21:8-9, Psalm 22:7-8, Isaiah 53:12b), Darkness over the land (Amos 8:9), "My God, my God, why have you forsaken me?" (Psalm 22:1), "It is finished"; "Father, into your hands"; He dies (Exodus 12:3-13, Genesis 22:1-14, Psalm 69:21, Psalm 31:5, Psalm 22:30-31, Leviticus 16:1-34), The temple curtain torn; the earthquake; the centurion (Psalm 38:11), Legs broken; His side pierced (Exodus 12:46; Psalm 34:20, Zechariah 12:10); 16 Nisan: "He is not here, for he has risen" (Psalm 16:10, Psalm 2:7, Psalm 132:11; 89:3-4, Jonah 1:17, Hosea 6:2, Isaiah 53:10-11, Isaiah 55:3, Psalm 118:17-18), Jesus appears to Mary Magdalene (Psalm 22:22)</desc>
