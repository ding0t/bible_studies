<text x="84.0" y="218.0" font-size="12" fill="#6b5a3e" font-style="italic">61:1</text>
<text x="128.0" y="218.0" font-size="14.5" fill="#3b2f1e">because the LORD has anointed Me</text>
<text x="642.0" y="218.0" font-size="11.5" fill="#a67c3d" text-anchor="end" font-style="italic">read</text>
<text x="84.0" y="256.0" font-size="12" fill="#6b5a3e" font-style="italic"></text>
<text x="128.0" y="256.0" font-size="14.5" fill="#3b2f1e">to preach good news to the poor.</text>
<text x="642.0" y="256.0" font-size="11.5" fill="#a67c3d" text-anchor="end" font-style="italic">read</text>
<text x="84.0" y="294.0" font-size="12" fill="#6b5a3e" font-style="italic">61:1</text>
<text x="128.0" y="294.0" font-size="14.5" fill="#9a8b72">He has sent Me to bind up the brokenhearted,</text>
<path d="M126 289 h286" stroke="#8b1e1e" stroke-width="1.3" stroke-dasharray="6 3"/>
<text x="642.0" y="288.0" font-size="11.5" fill="#8b1e1e" text-anchor="end" font-style="italic">not in Luke 4:18’s</text>
<text x="642.0" y="302.0" font-size="11.5" fill="#8b1e1e" text-anchor="end" font-style="italic">earliest manuscripts</text>
<text x="84.0" y="332.0" font-size="12" fill="#6b5a3e" font-style="italic">61:1</text>
<text x="128.0" y="332.0" font-size="14.5" fill="#3b2f1e">to proclaim liberty to the captives</text>
<text x="642.0" y="332.0" font-size="11.5" fill="#a67c3d" text-anchor="end" font-style="italic">read</text>
<text x="84.0" y="370.0" font-size="12" fill="#6b5a3e" font-style="italic">61:1</text>
<text x="128.0" y="370.0" font-size="14.5" fill="#3b2f1e">and freedom to the prisoners,</text>
<text x="642.0" y="364.0" font-size="11.5" fill="#a67c3d" text-anchor="end" font-style="italic">read as the Septuagint has it:</text>
<text x="642.0" y="378.0" font-size="11.5" fill="#a67c3d" text-anchor="end" font-style="italic">“and recovery of sight to the blind”</text>
