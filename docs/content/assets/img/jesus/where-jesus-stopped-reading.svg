<text x="360.0" y="480.0" font-size="13.5" fill="#8b1e1e" text-anchor="middle" font-weight="bold" letter-spacing="1">HE ROLLED UP THE SCROLL AND SAT DOWN  ·  Luke 4:20</text>
<text x="84.0" y="522.0" font-size="12" fill="#6b5a3e" font-style="italic">61:2</text>
<text x="128.0" y="522.0" font-size="14.5" fill="#9a8b72">and the day of our God’s vengeance,</text>
<text x="642.0" y="522.0" font-size="11.5" fill="#9a8b72" text-anchor="end" font-style="italic">not read</text>
<text x="84.0" y="560.0" font-size="12" fill="#6b5a3e" font-style="italic">61:2</text>
<text x="128.0" y="560.0" font-size="14.5" fill="#9a8b72">to comfort all who mourn,</text>
<text x="642.0" y="560.0" font-size="11.5" fill="#9a8b72" text-anchor="end" font-style="italic">not read</text>
<text x="84.0" y="598.0" font-size="12" fill="#6b5a3e" font-style="italic">61:3</text>
<text x="128.0" y="598.0" font-size="14.5" fill="#9a8b72">to console the mourners in Zion…</text>
<text x="642.0" y="598.0" font-size="11.5" fill="#9a8b72" text-anchor="end" font-style="italic">not read</text>
<text x="360.0" y="682.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">ONE SENTENCE, TWO COMINGS</text>
<path d="M40 752 H680" stroke="#3b2f1e" stroke-width="1.5"/>
<path d="M682.0 752.0 L672.1 756.8 L672.1 747.2 Z" fill="#3b2f1e"/>
