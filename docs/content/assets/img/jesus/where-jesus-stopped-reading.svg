<text x="128.0" y="408.0" font-size="14.5" fill="#2f4f7f" font-style="italic">“to release the oppressed”</text>
<text x="642.0" y="402.0" font-size="11.5" fill="#2f4f7f" text-anchor="end" font-style="italic">brought in from Isaiah 58:6</text>
<text x="642.0" y="416.0" font-size="11.5" fill="#2f4f7f" text-anchor="end" font-style="italic">(Septuagint), joined on ἄφεσις, “release”</text>
<text x="84.0" y="446.0" font-size="12" fill="#6b5a3e" font-style="italic">61:2</text>
<text x="128.0" y="446.0" font-size="14.5" fill="#3b2f1e">to proclaim the year of the LORD’s favor</text>
<text x="642.0" y="440.0" font-size="11.5" fill="#a67c3d" text-anchor="end" font-style="italic">read: “Today this Scripture</text>
<text x="642.0" y="454.0" font-size="11.5" fill="#a67c3d" text-anchor="end" font-style="italic">is fulfilled” (Luke 4:21)</text>
<rect x="70" y="460" width="580" height="30" fill="#f1dcd4"/>
