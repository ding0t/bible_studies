<text x="360.0" y="730.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">the year of the Lord’s favor: “now” (2 Corinthians 6:2)</text>
<text x="360.0" y="778.0" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">dashed: Scripture does not count its length</text>
<circle cx="120" cy="752" r="9" fill="#e8c46a" stroke="#3b2f1e" stroke-width="1.5"/>
<text x="120.0" y="806.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1">HIS FIRST COMING</text>
<text x="120.0" y="824.0" font-size="12.5" fill="#3b2f1e" text-anchor="middle">“Today this Scripture</text>
<text x="120.0" y="840.2" font-size="12.5" fill="#3b2f1e" text-anchor="middle">is fulfilled”</text>
<text x="120.0" y="856.5" font-size="12.5" fill="#3b2f1e" text-anchor="middle">Luke 4:21</text>
<circle cx="600" cy="752" r="9" fill="#e8c46a" stroke="#3b2f1e" stroke-width="1.5"/>
<text x="600.0" y="806.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="1">HIS REVEALING</text>
<text x="600.0" y="824.0" font-size="12.5" fill="#3b2f1e" text-anchor="middle">“inflicting vengeance”</text>
<text x="600.0" y="840.2" font-size="12.5" fill="#3b2f1e" text-anchor="middle">2 Thess 1:7-8</text>
<text x="600.0" y="856.5" font-size="12.5" fill="#3b2f1e" text-anchor="middle">comfort for Zion</text>
<text x="600.0" y="872.8" font-size="12.5" fill="#3b2f1e" text-anchor="middle">Isaiah 61:2-3</text>
<text x="360.0" y="902.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE SAME DIVISION ELSEWHERE</text>
<text x="360.0" y="922.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Old Testament prophecies the New Testament divides between His comings</text>
<rect x="36" y="928" width="648" height="376" fill="none" stroke="#3b2f1e"/>
<rect x="36" y="928" width="648" height="46" fill="#efe4d0" opacity="0.6"/>
<text x="48.0" y="950.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Micah 5:2</text>
<text x="672.0" y="950.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Matthew 2:6</text>
<text x="48.0" y="967.0" font-size="12.5" fill="#3b2f1e">“until she who is in labor has given birth” (Micah 5:3)</text>
<text x="48.0" y="996.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Isaiah 35:5-6</text>
<text x="672.0" y="996.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Matthew 11:5</text>
<text x="48.0" y="1013.0" font-size="12.5" fill="#3b2f1e">the healings, without “your God will come with vengeance”</text>
<rect x="36" y="1020" width="648" height="46" fill="#efe4d0" opacity="0.6"/>
<text x="48.0" y="1042.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Malachi 4:5-6</text>
<text x="672.0" y="1042.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Matthew 17:11-12</text>
<text x="48.0" y="1059.0" font-size="12.5" fill="#3b2f1e">Elijah “has already come” and “will restore”</text>
<text x="48.0" y="1088.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Psalm 110:1</text>
<text x="672.0" y="1088.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Hebrews 10:12-13</text>
<text x="48.0" y="1105.0" font-size="12.5" fill="#3b2f1e">seated now; “He waits for His enemies to be made a footstool” (Heb 10:13)</text>
<rect x="36" y="1112" width="648" height="46" fill="#efe4d0" opacity="0.6"/>
<text x="48.0" y="1134.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Psalm 118:26</text>
<text x="672.0" y="1134.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Matthew 23:39</text>
<text x="48.0" y="1151.0" font-size="12.5" fill="#3b2f1e">“you will not see Me again until you say…”</text>
<text x="48.0" y="1180.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Amos 9:11-12</text>
<text x="672.0" y="1180.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Acts 15:16-18</text>
<text x="48.0" y="1197.0" font-size="12.5" fill="#3b2f1e">the nations now; David’s tent and the land after</text>
<rect x="36" y="1204" width="648" height="46" fill="#efe4d0" opacity="0.6"/>
<text x="48.0" y="1226.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Hosea 3:4-5</text>
<text x="672.0" y="1226.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Acts 15:16</text>
<text x="48.0" y="1243.0" font-size="12.5" fill="#3b2f1e">“many days without king”, then “afterward”, David their king (Hosea 3:4-5)</text>
<text x="48.0" y="1272.0" font-size="13.5" fill="#3b2f1e" font-weight="bold">Psalm 8:4-6</text>
<text x="672.0" y="1272.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">divided at Hebrews 2:8-9</text>
<text x="48.0" y="1289.0" font-size="12.5" fill="#3b2f1e">crowned now; “at present we do not see everything subject to him”</text>
<text x="360.0" y="1366.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-style="italic">“Behold, now is the time of favor; now is the day of salvation!”</text>
<text x="360.0" y="1386.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle">2 Corinthians 6:2 (BSB)</text>
<text x="696.0" y="1428.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
