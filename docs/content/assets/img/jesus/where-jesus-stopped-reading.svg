<text x="360.0" y="126.0" font-size="12.5" fill="#a67c3d" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE SCROLL OF THE PROPHET ISAIAH  ·  Luke 4:17</text>
<text x="84.0" y="180.0" font-size="12" fill="#6b5a3e" font-style="italic">61:1</text>
<text x="128.0" y="180.0" font-size="14.5" fill="#3b2f1e">The Spirit of the Lord GOD is on Me,</text>
