<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1450" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Where Jesus stopped reading</title>
<desc id="d">Isaiah 61:1-3 set out clause by clause as Jesus read it in the synagogue at Nazareth (Luke 4:16-21). He read that the Spirit of the Lord GOD is on Me, that the LORD has anointed Me to preach good news to the poor, and to proclaim liberty to the captives. He left out 'to bind up the brokenhearted'. For 'freedom to the prisoners' He read, as the Septuagint has it, 'recovery of sight to the blind', and He brought in 'to release the oppressed' from Isaiah 58:6, joined on the Greek word aphesis, release; the line He left out is missing from the earliest manuscripts of Luke. He read 'to proclaim the year of the LORD's favor' and said 'Today this Scripture is fulfilled' (Luke 4:21). Then He rolled up the scroll (Luke 4:20), before 'and the day of our God's vengeance, to comfort all who mourn, to console the mourners in Zion'. Below, a line of time runs from His first coming, 'today', through the year of favor, 'now' (2 Corinthians 6:2), drawn dashed because Scripture does not count its length, to His revealing from heaven with vengeance (2 Thessalonians 1:7-8). A table lists eight other prophecies the New Testament divides between His two comings, each with the text that divides it: Micah 5:2, Isaiah 35:5-6, Malachi 4:5-6, Psalm 110:1, Psalm 118:26, Amos 9:11-12, Hosea 3:4-5 and Psalm 8:4-6.</desc>
<rect width="720" height="1450" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1434" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1422" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
