<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1150" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The LORD's words, said of Jesus</title>
<desc id="d">14 Old Testament texts that speak of the LORD (יהוה, YHWH), each set beside the New Testament text that says the same words of Jesus. “I am the first and I am the last” (Isaiah 44:6) is said of Jesus in Revelation 1:17: “I am the First and the Last”; “my eyes have seen the King, the LORD of Hosts” (Isaiah 6:5) is said of Jesus in John 12:41: “he saw Jesus’ glory and spoke about Him”; “The LORD of Hosts is the One you shall regard as holy” (Isaiah 8:13) is said of Jesus in 1 Peter 3:15: “in your hearts sanctify Christ as Lord”; the LORD of Hosts “a stone of stumbling and a rock of offense” (Isaiah 8:14) is said of Jesus in Romans 9:33: the stone; “the one who believes in Him”; “Prepare the way for the LORD” (Isaiah 40:3) is said of Jesus in Mark 1:3: “Prepare the way for the Lord”: John, before Jesus; the Lord GOD: “His reward is with Him” (Isaiah 40:10) is said of Jesus in Revelation 22:12: “My reward is with Me”; “Every knee will bow before Me” (Isaiah 45:23) is said of Jesus in Philippians 2:10: “at the name of Jesus every knee should bow”; “The LORD Our Righteousness” (Jeremiah 23:6) is said of Jesus in 1 Corinthians 1:30: “Christ Jesus, who has become for us… our righteousness”; “everyone who calls on the name of the LORD will be saved” (Joel 2:32) is said of Jesus in Romans 10:9, 13: “Jesus is Lord”… “the name of the Lord”; the LORD: “they will look on Me, the One they have pierced” (Zechariah 12:10) is said of Jesus in John 19:37: “They will look on the One they have pierced”; the LORD: “His feet will stand on the Mount of Olives” (Zechariah 14:4) is said of Jesus in Acts 1:11-12: “This same Jesus… will come back”, from Olivet; “prepare the way before Me” (Malachi 3:1) is said of Jesus in Matthew 11:10: “prepare Your way before You”; “The LORD of Hosts—He is the King of Glory” (Psalm 24:10) is said of Jesus in 1 Corinthians 2:8: “they… crucified the Lord of glory”; “You laid the foundations of the earth” (Psalm 102:25) is said of Jesus in Hebrews 1:10: said “about the Son” (1:8): “O Lord, You laid…”</desc>
