<text x="360.0" y="566.0" font-size="12.5" fill="#3b2f1e" text-anchor="middle">Each bar is one writer's share; the figures count uses, and the ledger's are a sample of the</text>
<text x="360.0" y="582.2" font-size="12.5" fill="#3b2f1e" text-anchor="middle">New Testament's quotations. Where the Greek misses the point, the apostles render the Hebrew</text>
<text x="360.0" y="598.5" font-size="12.5" fill="#3b2f1e" text-anchor="middle">afresh: “pierced” (John 19:37), “the potter” (Matthew 27:10), “heel” (John 13:18).</text>
<text x="696.0" y="668.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
