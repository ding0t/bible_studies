<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Which text the New Testament follows</title>
<desc id="d">For the 121 New Testament uses of the prophecies of Christ in this site's ledger that quote words, which text each writer's wording follows: the Hebrew rendered afresh, the Septuagint, both where they agree, or neither. Matthew: 6 the Hebrew, rendered afresh, 4 both, where they agree, 7 the Septuagint's wording, 7 neither; Mark: 2 the Hebrew, rendered afresh, 3 both, where they agree, 1 the Septuagint's wording, 2 neither; Luke and Acts: 2 the Hebrew, rendered afresh, 7 both, where they agree, 15 the Septuagint's wording, 4 neither; John: 2 the Hebrew, rendered afresh, 1 both, where they agree, 4 the Septuagint's wording, 3 neither; Paul: 1 the Hebrew, rendered afresh, 4 both, where they agree, 8 the Septuagint's wording, 5 neither; Hebrews: 0 the Hebrew, rendered afresh, 7 both, where they agree, 9 the Septuagint's wording, 2 neither; Peter: 0 the Hebrew, rendered afresh, 1 both, where they agree, 2 the Septuagint's wording, 1 neither; Revelation: 4 the Hebrew, rendered afresh, 2 both, where they agree, 5 the Septuagint's wording, 0 neither</desc>
