<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1391" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The LORD's courtroom</title>
<desc id="d">The LORD's courtroom in Isaiah 41-48. The parties: the LORD, 'Was it not I, the LORD?' (Isaiah 45:21), and the idols of Babylon, 'Bel crouches; Nebo cowers' (Isaiah 46:1); Israel His witnesses (Isaiah 43:10). The test: 'Tell us the things that are to come, so that we may know that you are gods' (Isaiah 41:23). The idols: 'No one announced it' (Isaiah 41:26). The LORD: 'I announced it before it came to pass' (Isaiah 48:5). The evidence near: Cyrus named (Isaiah 44:28; 45:1), his decree 538 BC (Ezra 1:1-2), 143 years after the traditional date, in his own day on the critics' date. The evidence far: the Servant (Isaiah 42:1, 9), fulfilled in Jesus (Matthew 12:17-18), 711 years ahead, 570 on the critics' date. The verdict: tsaddiq, 'He was right' (Isaiah 41:26), the LORD 'a righteous God and Savior' (Isaiah 45:21). The case taken up: Jesus' 'I am He' (John 13:19, from Isaiah 43:10 in the Septuagint); every knee bows (Isaiah 45:23; Philippians 2:10); the apostles as witnesses (Luke 24:48), an echo, dashed. Closing: Isaiah 45:22.</desc>
<rect width="720" height="1391" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1375" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1363" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE LORD'S COURTROOM</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 41-48: the trial of the gods, and its verdict</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
<text x="360.0" y="128.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE PARTIES</text>
<path d="M300.0 137 H420.0" stroke="#3b2f1e" stroke-width="0.6"/>
<rect x="40" y="150" width="290" height="82" rx="5" fill="#f6ecd0" stroke="#a67c3d" stroke-width="1.4"/>
<text x="185.0" y="170.9" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">The LORD</text>
<text x="185.0" y="188.5" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“Was it not I, the LORD?”</text>
<text x="185.0" y="206.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“the King of Jacob”</text>
<text x="185.0" y="223.6" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 45:21; 41:21</text>
<rect x="390" y="150" width="290" height="82" rx="5" fill="#efe4d0" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="535.0" y="170.9" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">The idols of Babylon</text>
<text x="535.0" y="188.5" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“Bel crouches; Nebo cowers.”</text>
<text x="535.0" y="206.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“you are nothing”</text>
<text x="535.0" y="223.6" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 46:1; 41:24</text>
<rect x="190.0" y="250.2" width="340" height="65" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="360.0" y="271.1" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">His witnesses: Israel</text>
<text x="360.0" y="288.7" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“You are My witnesses,” declares the LORD</text>
<text x="360.0" y="306.2" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 43:10</text>
<text x="360.0" y="360.9" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE TEST</text>
<path d="M300.0 369.85 H420.0" stroke="#3b2f1e" stroke-width="0.6"/>
<text x="360.0" y="392.9" font-size="15" fill="#3b2f1e" text-anchor="middle" font-style="italic">“Tell us the things that are to come,</text>
<text x="360.0" y="412.9" font-size="15" fill="#3b2f1e" text-anchor="middle" font-style="italic">so that we may know that you are gods.”</text>
<text x="360.0" y="431.9" font-size="12.5" fill="#6b5a3e" text-anchor="middle">Isaiah 41:23</text>
<rect x="40" y="448.85" width="290" height="65" rx="5" fill="#f6ecd0" stroke="#a67c3d" stroke-width="1.4"/>
<text x="185.0" y="469.8" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">The LORD answers</text>
<text x="185.0" y="487.3" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“I announced it before it came to pass”</text>
<text x="185.0" y="504.9" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 48:5</text>
<rect x="390" y="448.85" width="290" height="65" rx="5" fill="#efe4d0" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="535.0" y="469.8" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">The idols are silent</text>
<text x="535.0" y="487.3" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“No one announced it, no one foretold it”</text>
<text x="535.0" y="504.9" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 41:26</text>
<text x="360.0" y="561.5" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE EVIDENCE</text>
<path d="M300.0 570.5 H420.0" stroke="#3b2f1e" stroke-width="0.6"/>
<text x="185.0" y="591.5" font-size="12" fill="#6b5a3e" text-anchor="middle" font-weight="bold" letter-spacing="1.5">FORETOLD</text>
<text x="535.0" y="591.5" font-size="12" fill="#6b5a3e" text-anchor="middle" font-weight="bold" letter-spacing="1.5">CAME TO PASS</text>
<rect x="40" y="605.5" width="290" height="82" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="185.0" y="626.4" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">Near: Cyrus, by name</text>
<text x="185.0" y="644.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“who says of Cyrus, ‘My shepherd</text>
<text x="185.0" y="661.5" font-size="13.5" fill="#3b2f1e" text-anchor="middle">will fulfill all that I desire’”</text>
<text x="185.0" y="679.1" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 44:28; 45:1</text>
<rect x="390" y="605.5" width="290" height="82" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="535.0" y="626.4" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">Cyrus’s decree, 538 BC</text>
<text x="535.0" y="644.0" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“has appointed me to build a house</text>
<text x="535.0" y="661.5" font-size="13.5" fill="#3b2f1e" text-anchor="middle">for Him at Jerusalem”</text>
<text x="535.0" y="679.1" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Ezra 1:1-2</text>
<path d="M336 647 H380" stroke="#8b1e1e" stroke-width="2"/>
<path d="M384.0 646.6 L376.8 650.1 L376.8 643.1 Z" fill="#8b1e1e"/>
<text x="360.0" y="707.7" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">143 years ahead on the traditional date; in Cyrus’s own day on the critics’</text>
<rect x="40" y="731.7" width="290" height="100" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="185.0" y="752.6" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">Far: the Servant</text>
<text x="185.0" y="770.2" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“Here is My Servant, whom I uphold”</text>
<text x="185.0" y="787.7" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“Before they spring forth</text>
<text x="185.0" y="805.3" font-size="13.5" fill="#3b2f1e" text-anchor="middle">I proclaim them”</text>
<text x="185.0" y="822.8" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 42:1, 9</text>
<rect x="390" y="731.7" width="290" height="82" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="535.0" y="752.6" font-size="13.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">In Jesus, AD 30</text>
<text x="535.0" y="770.2" font-size="13.5" fill="#3b2f1e" text-anchor="middle">“This was to fulfill what was spoken</text>
<text x="535.0" y="787.7" font-size="13.5" fill="#3b2f1e" text-anchor="middle">through the prophet Isaiah”</text>
<text x="535.0" y="805.3" font-size="12.0" fill="#6b5a3e" text-anchor="middle" font-style="italic">Matthew 12:17-18</text>
<path d="M336 782 H380" stroke="#8b1e1e" stroke-width="2"/>
<path d="M384.0 781.6 L376.8 785.1 L376.8 778.1 Z" fill="#8b1e1e"/>
<text x="360.0" y="851.5" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">711 years ahead on the traditional date; 570 on the critics’ latest</text>
<text x="360.0" y="897.5" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE VERDICT</text>
<path d="M300.0 906.45 H420.0" stroke="#3b2f1e" stroke-width="0.6"/>
<text x="360.0" y="959.5" font-size="40" fill="#8b1e1e" text-anchor="middle" direction="rtl">צַדִּיק</text>
<text x="360.0" y="985.5" font-size="13" fill="#6b5a3e" text-anchor="middle" font-style="italic">tsaddiq, “right, righteous”: the party the court finds in the right</text>
<text x="360.0" y="1013.5" font-size="14.5" fill="#3b2f1e" text-anchor="middle">Of the idols: none can say “He was right” (Isaiah 41:26).</text>
<text x="360.0" y="1035.5" font-size="14.5" fill="#3b2f1e" text-anchor="middle" font-weight="bold">Of the LORD: “a righteous God and Savior” (Isaiah 45:21).</text>
<text x="360.0" y="1083.5" font-size="15" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE CASE TAKEN UP</text>
<path d="M300.0 1092.45 H420.0" stroke="#3b2f1e" stroke-width="0.6"/>
<rect x="40" y="1107.45" width="206" height="97" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="143.0" y="1127.8" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">“I am He”</text>
<text x="143.0" y="1144.7" font-size="13" fill="#3b2f1e" text-anchor="middle">“so that when it comes</text>
<text x="143.0" y="1161.6" font-size="13" fill="#3b2f1e" text-anchor="middle">to pass, you will believe</text>
<text x="143.0" y="1178.5" font-size="13" fill="#3b2f1e" text-anchor="middle">that I am He”</text>
<text x="143.0" y="1195.4" font-size="11.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">John 13:19; Isaiah 43:10</text>
<rect x="257" y="1107.45" width="206" height="97" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="360.0" y="1127.8" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">Every knee bows</text>
<text x="360.0" y="1144.7" font-size="13" fill="#3b2f1e" text-anchor="middle">sworn by the LORD,</text>
<text x="360.0" y="1161.6" font-size="13" fill="#3b2f1e" text-anchor="middle">said of Jesus:</text>
<text x="360.0" y="1178.5" font-size="13" fill="#3b2f1e" text-anchor="middle">“at the name of Jesus”</text>
<text x="360.0" y="1195.4" font-size="11.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Isaiah 45:23; Philippians 2:10</text>
<rect x="474" y="1107.45" width="206" height="97" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="577.0" y="1127.8" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">Witnesses again</text>
<text x="577.0" y="1144.7" font-size="13" fill="#3b2f1e" text-anchor="middle">“You are My witnesses”</text>
<text x="577.0" y="1161.6" font-size="13" fill="#3b2f1e" text-anchor="middle">Isaiah 43:10, and</text>
<text x="577.0" y="1178.5" font-size="13" fill="#3b2f1e" text-anchor="middle">“You are witnesses”</text>
<text x="577.0" y="1195.4" font-size="11.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Luke 24:48: an echo</text>
<rect x="110.0" y="1229.95" width="110" height="20" rx="4" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.2"/>
<text x="230.0" y="1245.0" font-size="12.5" fill="#3b2f1e">the text states or quotes it</text>
<rect x="400.0" y="1229.95" width="110" height="20" rx="4" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="520.0" y="1245.0" font-size="12.5" fill="#3b2f1e">an echo it does not quote</text>
<path d="M210.0 1273.95 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="1300.0" font-size="15.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">“Turn to Me and be saved, all the ends of the earth;</text>
<text x="360.0" y="1322.0" font-size="15.5" fill="#3b2f1e" text-anchor="middle" font-style="italic">for I am God, and there is no other.”</text>
<text x="360.0" y="1342.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle">Isaiah 45:22 (BSB)</text>
<text x="696.0" y="1369.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
