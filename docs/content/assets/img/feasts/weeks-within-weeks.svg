<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1210" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Weeks within weeks</title>
<desc id="d">The Zadok calendar's nested sevens. At the top, the 364-day year: four quarters, each of three 30-day months and one Tekufah day, 91 days or 13 weeks, so the year is exactly 52 weeks and 1 Abib always falls on a Wednesday. Below, a ladder: the week of seven days, the year of 52 weeks, the sabbatical of seven years (Leviticus 25:1-7), and the jubilee, forty-nine years and then the fiftieth (Leviticus 25:8-10). There the count divides. On the Rabbis' count the jubilee stands alone and a cycle is 50 years; on Rabbi Yehuda's, and in the book of Jubilees, the fiftieth year also begins the next cycle and a cycle is 49 (b. Nedarim 61a; b. Arakhin 12b; Jubilees 50:4). Ten jubilees make 500 or 490 years, forty make 2,000 or 1,960, and so on. dsscalendar.org's 500-year Onah and 140-jubilee wheel are dashed as its own construction; Daniel's 490 years and the Talmud's 2,000-year ages and 85 jubilees are solid.</desc>
