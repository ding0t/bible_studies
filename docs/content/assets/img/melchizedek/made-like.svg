<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1011" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Made like the Son</title>
<desc id="d">A chart of which way the likeness runs in Hebrews, in two columns. The sanctuary: the original is heaven itself, the true tent that the Lord set up, not man (Hebrews 8:2; 9:24); a red arrow, the pattern that was shown you on the mountain (Hebrews 8:5), leads down to the copy, the tabernacle, a copy and shadow of the heavenly things (Exodus 25:40; Hebrews 8:5; 9:24); a gold arrow, in Christ, leads to Christ entering the original, into heaven itself, now to appear in the presence of God on our behalf (Hebrews 9:24). The priest: the original is the Son of God, whom he appointed the heir of all things, through whom also he created the world (Hebrews 1:2); a red arrow, aphomoiomenos, made like, usually read as passive (Hebrews 7:3), leads down to Melchizedek, made like the Son, resembling the Son of God he continues a priest forever (Genesis 14:18-20; Hebrews 7:3); a gold arrow, fulfilled in Christ, leads to Jesus arising in that likeness, another priest arises in the likeness of Melchizedek (Hebrews 7:15). A side arrow marks the copy and the outline as earlier in time. A dashed note gives this study's reading: Hebrews 9:24 calls the earthly holy places antitypa, copies of the true things; this study reads the word as a coin struck from a die, and reads Melchizedek the same way, the Son the die and Genesis 14 the outline drawn first, to show what kind of priest the Son would be. Below, the Son was made like us: he had to be made like his brothers in every respect, so that he might become a merciful and faithful high priest (Hebrews 2:17; 4:15). It closes on Colossians 2:17, these are a shadow of the things to come, but the substance belongs to Christ.</desc>
