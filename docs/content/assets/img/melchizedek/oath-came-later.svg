<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1190" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The oath came later</title>
<desc id="d">A timeline of the priesthood in Hebrews 7, running down the page. Before the Law: in Genesis 14 Melchizedek, king of Salem and priest of God Most High, blesses Abram and receives a tenth, and the inferior is blessed by the superior (Genesis 14:18-20; Hebrews 7:1-2, 7). Beside it, Levi in Abraham's loins: Abraham, Isaac, Jacob, Levi, Kohath, Amram, Aaron, with Levi marked; Levi himself paid tithes through Abraham, for he was still in the loins of his ancestor (Hebrews 7:9-10; Genesis 21:3; 25:26; 29:34; Exodus 6:16-20). After this meeting comes God's covenant with Abraham (Genesis 15:18), where a red span begins, dashed at its start: the law, which came 430 years afterward (Galatians 3:17). Where the count starts is read two ways, since Exodus 12:40 counts 430 years in Egypt. Under the Law: at Sinai the Law is given and Aaron and his sons are appointed, and under it the people received the law (Exodus 28:1; Numbers 3:10; Hebrews 7:11); beside it, priests by descent, until death, many in number because they were prevented by death (Hebrews 7:16, 23). Later than the Law: in David's psalm God swears an oath, You are a priest forever after the order of Melchizedek (Psalm 110:1, 4); beside it, the oath is God's last word, the word of the oath, which came later than the law, appoints a Son (Hebrews 7:28). Fulfilled: Jesus, risen and seated in heaven, a high priest forever after the order of Melchizedek (Hebrews 6:20; 7:16; 8:1); beside it, one priest who never dies, he holds his priesthood permanently, because he continues forever (Hebrews 7:24). The line runs on past Him, marked forever. The plate is not drawn to scale, and the one span drawn is Galatians 3:17's 430 years. It closes on Psalm 110:4, The LORD has sworn and will not change his mind.</desc>
