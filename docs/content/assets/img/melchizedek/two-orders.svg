<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1372" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Two orders of priests</title>
<desc id="d">A chart of the two orders of priests in Hebrews 7. At the top, the problem: Levi held the altar, you shall appoint Aaron and his sons, and any outsider who comes near shall be put to death (Numbers 3:10); Judah held the throne, our Lord was descended from Judah, and Moses said nothing about priests in connection with that tribe (Hebrews 7:14; Genesis 49:10). A red wall stands between them, and King Uzziah of Judah entered the temple to burn incense and was struck with leprosy (2 Chronicles 26:16-21). If he were on earth, he would not be a priest at all (Hebrews 8:4). An arrow leads to God's oath, You are a priest forever after the order of Melchizedek (Psalm 110:4, quoted at Hebrews 5:6; 7:17, 21). Below, Aaron's sons, after the order of Aaron (Hebrews 7:11), and Jesus, after the order of Melchizedek (Hebrews 6:20), side by side, in Hebrews' own words: what makes him a priest: Aaron's sons, “a legal requirement concerning bodily descent” (Hebrews 7:16 · Ezra 2:62); Jesus, “the power of an indestructible life” (Hebrews 7:16); how he is installed: Aaron's sons, “made such without an oath” (Hebrews 7:20); Jesus, “made a priest with an oath” (Hebrews 7:21 · Psalm 110:4); how long he serves: Aaron's sons, “many in number, because they were prevented by death” (Hebrews 7:23); Jesus, “he holds his priesthood permanently” (Hebrews 7:24); his sacrifice: Aaron's sons, “sacrifices daily, first for his own sins” (Hebrews 7:27); Jesus, “once for all when he offered up himself” (Hebrews 7:27); where he serves: Aaron's sons, “a copy and shadow of the heavenly things” (Hebrews 8:5); Jesus, “the true tent that the Lord set up” (Hebrews 8:2); the covenant: Aaron's sons, “under it the people received the law” (Hebrews 7:11); Jesus, “the guarantor of a better covenant” (Hebrews 7:22). It closes on Hebrews 7:25, he always lives to make intercession for them.</desc>
