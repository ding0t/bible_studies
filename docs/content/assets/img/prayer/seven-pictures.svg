<text x="140.0" y="616.0" font-size="12" fill="#8b1e1e" font-weight="bold" letter-spacing="1.5">WEEK 5</text>
<text x="670.0" y="616.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">6:12</text>
<text x="140.0" y="638.0" font-size="16" fill="#3b2f1e" font-style="italic">“and forgive us our debts, as we also have forgiven our</text>
<text x="140.0" y="658.0" font-size="16" fill="#3b2f1e" font-style="italic">debtors.”</text>
<text x="140.0" y="680.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">God forgives us because Jesus paid what we owed, so we forgive</text>
<text x="140.0" y="698.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">each other.</text>
<rect x="34" y="728" width="652" height="96" rx="8" fill="#fffdf7" stroke="#a67c3d" stroke-width="1.2"/>
<circle cx="92" cy="776.0" r="30" fill="#fffdf7" stroke="#a67c3d" stroke-width="2"/>
<path d="M70 786.0 Q86 784.0 88 774.0 T114 764.0" fill="none" stroke="#8d6c45" stroke-width="5" stroke-linecap="round"/><path d="M70 786.0 Q86 784.0 88 774.0 T114 764.0" fill="none" stroke="#e2cc9a" stroke-width="2" stroke-dasharray="3 3"/>
<text x="140.0" y="754.0" font-size="12" fill="#8b1e1e" font-weight="bold" letter-spacing="1.5">WEEK 6</text>
<text x="670.0" y="754.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">6:13</text>
<text x="140.0" y="776.0" font-size="16" fill="#3b2f1e" font-style="italic">“And lead us not into temptation, but deliver us from evil.”</text>
<text x="140.0" y="798.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">God is stronger than the devil, and He keeps His children.</text>
