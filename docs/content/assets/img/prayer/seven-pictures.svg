<text x="670.0" y="370.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">6:10</text>
<text x="140.0" y="392.0" font-size="16" fill="#3b2f1e" font-style="italic">“Your kingdom come, your will be done, on earth as it is in</text>
<text x="140.0" y="412.0" font-size="16" fill="#3b2f1e" font-style="italic">heaven.”</text>
<text x="140.0" y="434.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">God is King, Jesus is coming back to reign, and God's way is</text>
<text x="140.0" y="452.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">best.</text>
<rect x="34" y="482" width="652" height="96" rx="8" fill="#fffdf7" stroke="#a67c3d" stroke-width="1.2"/>
