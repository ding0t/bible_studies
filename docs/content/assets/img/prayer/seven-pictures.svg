<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1084" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The Prayer in Seven Pictures</title>
<desc id="d">A card for the fridge: the Lord's Prayer (Matthew 6:9-13, ESV) in seven pictures, one for each week of the household guide. Week 1: a house with its door open, beside 'Our Father in heaven,' (6:9) and 'God is our Father, because Jesus made us His children.' Week 2: a mountain under a cloud, beside 'hallowed be your name.' (6:9) and 'God's name is who He is, and He is holy.' Week 3: a crown, beside 'Your kingdom come, your will be done, on earth as it is in heaven.' (6:10) and 'God is King, Jesus is coming back to reign, and God's way is best.' Week 4: a loaf, beside 'Give us this day our daily bread,' (6:11) and 'God gives us what we need, one day at a time.' Week 5: a ledger struck through, beside 'and forgive us our debts, as we also have forgiven our debtors.' (6:12) and 'God forgives us because Jesus paid what we owed, so we forgive each other.' Week 6: a path, beside 'And lead us not into temptation, but deliver us from evil.' (6:13) and 'God is stronger than the devil, and He keeps His children.' Week 7: a gold seal reading Amen, beside 'Amen.' (2 Corinthians 1:20) and 'Every promise God makes is “Yes” in Jesus.' Below: pray the whole prayer together every day, and in your own words in four steps: Our Father, Your will, Today, Forgive and keep.</desc>
<rect width="720" height="1084" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1068" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1056" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
