<text x="140.0" y="262.0" font-size="12" fill="#8b1e1e" font-weight="bold" letter-spacing="1.5">WEEK 2</text>
<text x="670.0" y="262.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">6:9</text>
<text x="140.0" y="284.0" font-size="16" fill="#3b2f1e" font-style="italic">“hallowed be your name.”</text>
<text x="140.0" y="306.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">God's name is who He is, and He is holy.</text>
