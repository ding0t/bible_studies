<text x="670.0" y="862.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">2 Corinthians 1:20</text>
<text x="140.0" y="884.0" font-size="16" fill="#3b2f1e" font-style="italic">Amen.</text>
<text x="140.0" y="906.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">Every promise God makes is “Yes” in Jesus.</text>
<text x="360.0" y="970.0" font-size="18" fill="#3b2f1e" text-anchor="middle" font-weight="bold" font-style="italic">Pray the whole prayer together every day.</text>
<text x="360.0" y="1002.0" font-size="14" fill="#6b5a3e" text-anchor="middle">In your own words, in four steps:</text>
<text x="360.0" y="1026.0" font-size="16" fill="#3b2f1e" text-anchor="middle" font-weight="bold">Our Father  ·  Your will  ·  Today  ·  Forgive and keep</text>
<text x="696.0" y="1062.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
