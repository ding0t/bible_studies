<path d="M74 417.0 L72 397.0 L83 407.0 L92 393.0 L101 407.0 L112 397.0 L110 417.0 Z" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.6" stroke-linejoin="round"/><circle cx="92" cy="411.0" r="3" fill="#8b1e1e"/>
