<circle cx="92" cy="884.0" r="18" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.6"/><circle cx="92" cy="884.0" r="14" fill="none" stroke="#a67c3d" stroke-width="0.8"/><text x="92.0" y="888.0" font-size="10" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="0.5">AMEN</text>
