<text x="140.0" y="508.0" font-size="12" fill="#8b1e1e" font-weight="bold" letter-spacing="1.5">WEEK 4</text>
<text x="670.0" y="508.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">6:11</text>
<text x="140.0" y="530.0" font-size="16" fill="#3b2f1e" font-style="italic">“Give us this day our daily bread,”</text>
<text x="140.0" y="552.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">God gives us what we need, one day at a time.</text>
<rect x="34" y="590" width="652" height="126" rx="8" fill="#fffdf7" stroke="#a67c3d" stroke-width="1.2"/>
