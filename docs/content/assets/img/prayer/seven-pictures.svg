<path d="M72 174.0 L92 156.0 L112 174.0" fill="none" stroke="#8d6c45" stroke-width="3" stroke-linejoin="round"/><rect x="77" y="172.0" width="30" height="20" fill="#f4e8cf" stroke="#8d6c45" stroke-width="1.6"/><rect x="87" y="179.0" width="10" height="13" fill="#e8c46a"/><path d="M87 179.0 L81 182.0 V194.0 L87 192.0 Z" fill="#c9a77a" stroke="#8d6c45" stroke-width="1"/>
<text x="140.0" y="154.0" font-size="12" fill="#8b1e1e" font-weight="bold" letter-spacing="1.5">WEEK 1</text>
<text x="670.0" y="154.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">6:9</text>
<text x="140.0" y="176.0" font-size="16" fill="#3b2f1e" font-style="italic">“Our Father in heaven,”</text>
<text x="140.0" y="198.0" font-size="14.5" fill="#2f4f7f" font-weight="bold">God is our Father, because Jesus made us His children.</text>
