<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Daniel at the window</title>
<desc id="d">An illustrated plate of Daniel 6:10-11. Above, a cut-away house in Babylon: in the upper chamber a small kneeling figure faces open windows toward Jerusalem, drawn far to the west across the desert with its walls broken and the temple burned (2 Kings 25:9-10). Seven numbered callouts quote the verses: the document signed; his house; windows in his upper chamber open toward Jerusalem; on his knees; three times a day he prayed and gave thanks, as he had done previously; the men who came by agreement and found him making petition and plea (Daniel 6:11); and Jerusalem. A dashed key line says the text does not state the hours, the number of windows, or the words he prayed. Below, two source cards: Solomon's prayer asking God to hear exiles who pray toward the land, the city and the house (1 Kings 8:48-49), and Jeremiah's promise, which Daniel read, that after seventy years 'you will call upon me and come and pray to me, and I will hear you' (Jeremiah 29:10-12; Daniel 9:2). At the foot, Daniel 9:18: 'because of your great mercy'.</desc>
