<circle cx="60" cy="280" r="11" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="60.0" y="284.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">7</text>
<circle cx="44" cy="608" r="9" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="44.0" y="612.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">1</text>
<text x="62.0" y="612.0" font-size="12.5" fill="#3b2f1e">“When Daniel knew that the document had been signed”</text>
<text x="690.0" y="612.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">Daniel 6:10</text>
<circle cx="44" cy="632" r="9" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="44.0" y="636.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">2</text>
<text x="62.0" y="636.0" font-size="12.5" fill="#3b2f1e">“he went to his house”</text>
<text x="690.0" y="636.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">Daniel 6:10</text>
<circle cx="44" cy="656" r="9" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="44.0" y="660.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">3</text>
<text x="62.0" y="660.0" font-size="12.5" fill="#3b2f1e">“where he had windows in his upper chamber open toward Jerusalem”</text>
<text x="690.0" y="660.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">Daniel 6:10</text>
<circle cx="44" cy="680" r="9" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="44.0" y="684.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">4</text>
<text x="62.0" y="684.0" font-size="12.5" fill="#3b2f1e">“He got down on his knees” · bārēk ʿal birkōhî, “kneeling on his knees”</text>
<text x="690.0" y="684.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">Daniel 6:10</text>
<circle cx="44" cy="704" r="9" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="44.0" y="708.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">5</text>
<text x="62.0" y="708.0" font-size="12.5" fill="#3b2f1e">“three times a day and prayed and gave thanks… as he had done previously”</text>
<text x="690.0" y="708.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">Daniel 6:10</text>
<circle cx="44" cy="728" r="9" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="44.0" y="732.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">6</text>
<text x="62.0" y="732.0" font-size="12.5" fill="#3b2f1e">“these men came by agreement and found Daniel making petition and plea”</text>
<text x="690.0" y="732.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">Daniel 6:11</text>
<circle cx="44" cy="752" r="9" fill="#faf6ec" stroke="#3b2f1e" stroke-width="1.6"/>
<text x="44.0" y="756.5" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">7</text>
<text x="62.0" y="756.0" font-size="12.5" fill="#3b2f1e">“he burned the house of the LORD… broke down the walls around Jerusalem”</text>
<text x="690.0" y="756.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">2 Kings 25:9-10</text>
<path d="M36 778 h20" stroke="#3b2f1e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="62.0" y="782.0" font-size="12" fill="#6b5a3e" font-style="italic">Not stated: the hours (Psalm 55:17 has “evening and morning and at noon”), how many</text>
<text x="62.0" y="798.0" font-size="12" fill="#6b5a3e" font-style="italic">windows, the room’s shape, or the words he prayed.</text>
<text x="30.0" y="826.0" font-size="13" fill="#6b5a3e" font-weight="bold" letter-spacing="1.2">THE PRAYER HE WAS ANSWERING</text>
<text x="370.0" y="826.0" font-size="13" fill="#6b5a3e" font-weight="bold" letter-spacing="1.2">THE PROMISE HE READ</text>
<rect x="30.0" y="838.0" width="320.0" height="146" rx="5" fill="#f6ecd0" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="38.0" y="856.5" font-size="12.5" fill="#3b2f1e" font-weight="bold">Solomon, at the temple’s dedication:</text>
<text x="38.0" y="873.5" font-size="12.5" fill="#3b2f1e">“if they repent… in the land of their</text>
<text x="38.0" y="890.5" font-size="12.5" fill="#3b2f1e">enemies, who carried them captive, and pray</text>
<text x="38.0" y="907.5" font-size="12.5" fill="#3b2f1e">to you toward their land… the city that you</text>
<text x="38.0" y="924.5" font-size="12.5" fill="#3b2f1e">have chosen, and the house that I have built</text>
<text x="38.0" y="941.5" font-size="12.5" fill="#3b2f1e">for your name, then hear in heaven your</text>
<text x="38.0" y="958.5" font-size="12.5" fill="#3b2f1e">dwelling place their prayer and their plea”</text>
<text x="38.0" y="975.5" font-size="11.0" fill="#6b5a3e" font-style="italic">1 Kings 8:48-49</text>
<rect x="370.0" y="838.0" width="320.0" height="112" rx="5" fill="#e3e9f2" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="378.0" y="856.5" font-size="12.5" fill="#3b2f1e" font-weight="bold">Jeremiah, read by Daniel (Daniel 9:2):</text>
<text x="378.0" y="873.5" font-size="12.5" fill="#3b2f1e">“When seventy years are completed for</text>
<text x="378.0" y="890.5" font-size="12.5" fill="#3b2f1e">Babylon, I will visit you… Then you will</text>
<text x="378.0" y="907.5" font-size="12.5" fill="#3b2f1e">call upon me and come and pray to me, and I</text>
<text x="378.0" y="924.5" font-size="12.5" fill="#3b2f1e">will hear you.”</text>
<text x="378.0" y="941.5" font-size="11.0" fill="#6b5a3e" font-style="italic">Jeremiah 29:10, 12 · Daniel 9:2</text>
