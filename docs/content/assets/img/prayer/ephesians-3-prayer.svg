<circle cx="48" cy="867" r="11" fill="#3b2f1e"/>
<text x="48.0" y="871.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">6</text>
<text x="68.0" y="872.0" font-size="14.5" fill="#3b2f1e" font-weight="bold">Filled with God</text>
<text x="440.0" y="872.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">3:19</text>
<text x="68.0" y="891.0" font-size="12.5" fill="#3b2f1e" font-style="italic">“that you may be filled with all the fullness</text>
<text x="68.0" y="908.0" font-size="12.5" fill="#3b2f1e" font-style="italic">of God”</text>
<text x="68.0" y="925.0" font-size="12" fill="#2f4f7f">πλήρωμα  plērōma, “fullness”</text>
