<text x="478.0" y="401.0" font-size="12.5" fill="#3b2f1e" font-weight="bold">a dwelling place for God</text>
<text x="478.0" y="417.0" font-size="12.5" fill="#3b2f1e">by the Spirit</text>
<text x="478.0" y="433.0" font-size="12.5" fill="#3b2f1e">κατοικητήριον</text>
<text x="478.0" y="451.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Ephesians 2:22</text>
<rect x="470" y="472" width="220" height="78" rx="5" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.5" stroke-dasharray="6 4"/>
