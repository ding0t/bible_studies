<text x="360.0" y="148.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE ADDRESS · 3:14-15</text>
<rect x="30" y="174" width="660" height="118" rx="6" fill="#f6ecd0" stroke="#a67c3d" stroke-width="1.5"/>
<g transform="translate(64 266) scale(1.1)" fill="#4a3a28"><path d="M-2 0 H26 Q30 0 30 -4 L28 -8 H8 Z"/><path d="M6 -6 Q2 -26 10 -40 L22 -38 Q16 -22 24 -8 Z"/><path d="M12 -38 Q2 -34 -6 -40 L-4 -44 Q4 -40 12 -44 Z"/><circle cx="17" cy="-49" r="7.5"/></g>
<text x="80.0" y="286.0" font-size="11.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">a prisoner (3:1)</text>
<text x="130.0" y="204.0" font-size="15" fill="#3b2f1e" font-style="italic">“I bow my knees before the Father,</text>
<text x="130.0" y="224.0" font-size="15" fill="#3b2f1e" font-style="italic">from whom every family in heaven and on earth is named”</text>
<text x="130.0" y="252.0" font-size="14" fill="#2f4f7f" font-weight="bold">πατήρ  patēr, “father”</text>
<path d="M318 248 H352" stroke="#2f4f7f" stroke-width="1.6"/>
<path d="M358.0 248.0 L350.8 251.5 L350.8 244.5 Z" fill="#2f4f7f"/>
<text x="366.0" y="252.0" font-size="14" fill="#2f4f7f" font-weight="bold">πατριά  patria, “family, fatherhood”</text>
<text x="130.0" y="274.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Every fatherhood takes its name from the Father. Kneeling: most stood to pray.</text>
<path d="M200.0 324 H520.0 L510.0 337.0 L520.0 350 H200.0 L210.0 337.0 Z" fill="#3b2f1e"/>
<text x="360.0" y="342.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE APPEALS · 3:16-19</text>
<text x="30.0" y="372.0" font-size="12" fill="#6b5a3e" font-weight="bold" letter-spacing="1.2">IN PAUL’S ORDER</text>
<text x="472.0" y="372.0" font-size="12" fill="#2f4f7f" font-weight="bold" letter-spacing="1">DWELLING AND FULLNESS</text>
<rect x="30" y="382" width="420" height="72" rx="6" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="48" cy="400" r="11" fill="#3b2f1e"/>
<text x="48.0" y="404.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">1</text>
<text x="68.0" y="405.0" font-size="14.5" fill="#3b2f1e" font-weight="bold">Strength, by the Spirit</text>
<text x="440.0" y="405.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">3:16</text>
<text x="68.0" y="424.0" font-size="12.5" fill="#3b2f1e" font-style="italic">“strengthened with power through his Spirit in</text>
<text x="68.0" y="441.0" font-size="12.5" fill="#3b2f1e" font-style="italic">your inner being”</text>
<path d="M48 454 V468" stroke="#3b2f1e" stroke-width="1.6"/>
<path d="M48.0 470.0 L44.5 462.8 L51.5 462.8 Z" fill="#3b2f1e"/>
<rect x="30" y="472" width="420" height="89" rx="6" fill="#f6ecd0" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="48" cy="490" r="11" fill="#3b2f1e"/>
<text x="48.0" y="494.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">2</text>
<text x="68.0" y="495.0" font-size="14.5" fill="#3b2f1e" font-weight="bold">Christ settling in</text>
<text x="440.0" y="495.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">3:17</text>
<text x="68.0" y="514.0" font-size="12.5" fill="#3b2f1e" font-style="italic">“so that Christ may dwell in your hearts</text>
<text x="68.0" y="531.0" font-size="12.5" fill="#3b2f1e" font-style="italic">through faith”</text>
<text x="68.0" y="548.0" font-size="12" fill="#2f4f7f">κατοικέω  katoikeō, “dwell, take up residence”</text>
<path d="M48 561 V575" stroke="#3b2f1e" stroke-width="1.6"/>
<path d="M48.0 577.0 L44.5 569.8 L51.5 569.8 Z" fill="#3b2f1e"/>
<rect x="30" y="579" width="420" height="72" rx="6" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="48" cy="597" r="11" fill="#3b2f1e"/>
<text x="48.0" y="601.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">3</text>
<text x="68.0" y="602.0" font-size="14.5" fill="#3b2f1e" font-weight="bold">Rooted and grounded</text>
<text x="440.0" y="602.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">3:17</text>
<text x="68.0" y="621.0" font-size="12.5" fill="#3b2f1e" font-style="italic">“being rooted and grounded in love”</text>
<text x="68.0" y="638.0" font-size="12" fill="#2f4f7f">ῥιζόω  rhizoō, “root” · θεμελιόω  themelioō, “found”</text>
<path d="M48 651 V665" stroke="#3b2f1e" stroke-width="1.6"/>
<path d="M48.0 667.0 L44.5 659.8 L51.5 659.8 Z" fill="#3b2f1e"/>
<rect x="30" y="669" width="420" height="72" rx="6" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="48" cy="687" r="11" fill="#3b2f1e"/>
<text x="48.0" y="691.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">4</text>
<text x="68.0" y="692.0" font-size="14.5" fill="#3b2f1e" font-weight="bold">Strength to grasp it</text>
<text x="440.0" y="692.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">3:18</text>
<text x="68.0" y="711.0" font-size="12.5" fill="#3b2f1e" font-style="italic">“to comprehend with all the saints what is the</text>
<text x="68.0" y="728.0" font-size="12.5" fill="#3b2f1e" font-style="italic">breadth and length and height and depth”</text>
<path d="M48 741 V755" stroke="#3b2f1e" stroke-width="1.6"/>
<path d="M48.0 757.0 L44.5 749.8 L51.5 749.8 Z" fill="#3b2f1e"/>
<rect x="30" y="759" width="420" height="72" rx="6" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<circle cx="48" cy="777" r="11" fill="#3b2f1e"/>
<text x="48.0" y="781.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">5</text>
<text x="68.0" y="782.0" font-size="14.5" fill="#3b2f1e" font-weight="bold">A love beyond knowing</text>
<text x="440.0" y="782.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">3:19</text>
<text x="68.0" y="801.0" font-size="12.5" fill="#3b2f1e" font-style="italic">“to know the love of Christ that surpasses</text>
<text x="68.0" y="818.0" font-size="12.5" fill="#3b2f1e" font-style="italic">knowledge”</text>
<path d="M48 831 V845" stroke="#3b2f1e" stroke-width="1.6"/>
<path d="M48.0 847.0 L44.5 839.8 L51.5 839.8 Z" fill="#3b2f1e"/>
