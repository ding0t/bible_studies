<text x="512.0" y="1023.0" font-size="12" fill="#3b2f1e">Colossians: the study’s link</text>
<path d="M190.0 1051 H530.0 L520.0 1064.0 L530.0 1077 H190.0 L200.0 1064.0 Z" fill="#3b2f1e"/>
<text x="360.0" y="1069.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE ADORATION · 3:20-21</text>
<text x="360.0" y="1101.0" font-size="14" fill="#3b2f1e" text-anchor="middle" font-style="italic">“Now to him who is able to do far more abundantly than all that we ask or think,</text>
<text x="360.0" y="1121.0" font-size="14" fill="#3b2f1e" text-anchor="middle" font-style="italic">according to the power at work within us, to him be glory…”</text>
<rect x="30" y="1143" width="180" height="22" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.2"/>
<text x="40.0" y="1159.0" font-size="13" fill="#3b2f1e" font-weight="bold">all that we ask</text>
<rect x="30" y="1173" width="330" height="22" fill="#f6ecd0" stroke="#3b2f1e" stroke-width="1.2"/>
<text x="40.0" y="1189.0" font-size="13" fill="#3b2f1e" font-weight="bold">or think</text>
<rect x="30" y="1203" width="660" height="22" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.4"/>
<path d="M690 1203 v22" stroke="#e8c46a" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M694.0 1214.0 L685.9 1217.9 L685.9 1210.1 Z" fill="#a67c3d"/>
<text x="40.0" y="1219.0" font-size="13" fill="#3b2f1e" font-weight="bold">far more abundantly</text>
<text x="686.0" y="1245.0" font-size="12" fill="#6b5a3e" text-anchor="end" font-style="italic">the last bar runs past the frame: the verse sets no edge to it</text>
<text x="696.0" y="1308.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
