<text x="478.0" y="507.0" font-size="12.5" fill="#3b2f1e">pleased to dwell in Him</text>
<text x="478.0" y="523.0" font-size="12.5" fill="#3b2f1e">πλήρωμα · κατοικέω</text>
<text x="478.0" y="541.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Colossians 1:19; 2:9</text>
<rect x="470" y="562" width="220" height="78" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.5"/>
<text x="478.0" y="581.0" font-size="12.5" fill="#3b2f1e" font-weight="bold">Christ dwells</text>
<text x="478.0" y="597.0" font-size="12.5" fill="#3b2f1e">in your hearts</text>
<text x="478.0" y="613.0" font-size="12.5" fill="#3b2f1e">κατοικέω</text>
<text x="478.0" y="631.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Ephesians 3:17</text>
<rect x="470" y="819" width="220" height="78" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.5"/>
<text x="478.0" y="838.0" font-size="12.5" fill="#3b2f1e" font-weight="bold">filled with all the</text>
<text x="478.0" y="854.0" font-size="12.5" fill="#3b2f1e">fullness of God</text>
<text x="478.0" y="870.0" font-size="12.5" fill="#3b2f1e">πλήρωμα</text>
<text x="478.0" y="888.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Ephesians 3:19</text>
<rect x="470" y="909" width="220" height="62" rx="5" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="478.0" y="928.0" font-size="12.5" fill="#3b2f1e" font-weight="bold">you have been filled</text>
<text x="478.0" y="944.0" font-size="12.5" fill="#3b2f1e">in Him</text>
<text x="478.0" y="962.0" font-size="11.5" fill="#6b5a3e" font-style="italic">Colossians 2:10</text>
