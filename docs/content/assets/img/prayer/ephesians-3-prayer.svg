<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1330" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Paul's prayer in Ephesians 3</title>
<desc id="d">A diagram of Ephesians 3:14-21 in three bands. The address: a prisoner (Ephesians 3:1) bows his knees before the Father, from whom every family is named; the Greek for family, patria, is built on patēr, father. The appeals, numbered in their order: strengthened with power through His Spirit in the inner being (3:16); Christ dwelling in your hearts through faith (3:17); rooted and grounded in love, drawn as roots and a foundation (3:17); strength to comprehend with all the saints the breadth, length, height and depth (3:18); to know the love of Christ that surpasses knowledge (3:19); filled with all the fullness of God (3:19). Beside them, a column traces the dwelling and fullness words: a dwelling place for God by the Spirit (Ephesians 2:22); all the fullness of God pleased to dwell in Christ (Colossians 1:19; 2:9) and you have been filled in Him (Colossians 2:10), both drawn dashed as links to another letter; Christ dwelling in your hearts (3:17); filled with the fullness of God (3:19). The adoration: nested bars show what we ask, what we think, and 'far more abundantly than all that we ask or think' running past the frame (3:20-21).</desc>
<rect width="720" height="1330" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1314" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1302" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
