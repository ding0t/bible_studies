<circle cx="59" cy="274" r="11" fill="#3b2f1e"/>
<text x="59.0" y="278.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">1</text>
<text x="76.0" y="279.0" font-size="14" fill="#3b2f1e" font-weight="bold">His name</text>
<text x="240.0" y="279.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">6:9</text>
<text x="52.0" y="300.0" font-size="13" fill="#3b2f1e" font-style="italic">“hallowed be your name.”</text>
<text x="52.0" y="358.0" font-size="12" fill="#2f4f7f">τὸ ὄνομά σου · your name</text>
<rect x="260" y="256" width="206" height="112" rx="6" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.5"/>
<circle cx="277" cy="274" r="11" fill="#3b2f1e"/>
<text x="277.0" y="278.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">2</text>
<text x="294.0" y="279.0" font-size="14" fill="#3b2f1e" font-weight="bold">His kingdom</text>
<text x="458.0" y="279.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">6:10</text>
<text x="270.0" y="300.0" font-size="13" fill="#3b2f1e" font-style="italic">“Your kingdom come,”</text>
<text x="270.0" y="358.0" font-size="12" fill="#2f4f7f">ἡ βασιλεία σου · your kingdom</text>
<rect x="478" y="256" width="206" height="112" rx="6" fill="#fffdf7" stroke="#2f4f7f" stroke-width="1.5"/>
<circle cx="495" cy="274" r="11" fill="#3b2f1e"/>
<text x="495.0" y="278.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">3</text>
<text x="512.0" y="279.0" font-size="14" fill="#3b2f1e" font-weight="bold">His will</text>
<text x="676.0" y="279.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">6:10</text>
<text x="488.0" y="300.0" font-size="13" fill="#3b2f1e" font-style="italic">“your will be done,”</text>
<text x="488.0" y="358.0" font-size="12" fill="#2f4f7f">τὸ θέλημά σου · your will</text>
<circle cx="222" cy="322" r="15" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.2"/>
<text x="222.0" y="327.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">σου</text>
<circle cx="440" cy="322" r="15" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.2"/>
<text x="440.0" y="327.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">σου</text>
<circle cx="658" cy="322" r="15" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.2"/>
<text x="658.0" y="327.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-weight="bold">σου</text>
<rect x="60" y="392" width="600" height="58" rx="29" fill="#e8c46a" stroke="#a67c3d" stroke-width="2"/>
<text x="360.0" y="417.0" font-size="18" fill="#3b2f1e" text-anchor="middle" font-weight="bold" font-style="italic">“on earth as it is in heaven.”</text>
<text x="360.0" y="438.0" font-size="12.5" fill="#3b2f1e" text-anchor="middle">ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς · the hinge · 6:10</text>
<text x="360.0" y="466.0" font-size="12" fill="#6b5a3e" text-anchor="middle" font-style="italic">Whether it governs all three petitions above or only the third is debated.</text>
<rect x="30" y="480" width="660" height="240" rx="8" fill="url(#lp-earth)" stroke="#8d6c45" stroke-width="1.2"/>
<text x="46.0" y="504.0" font-size="12" fill="#8d6c45" font-weight="bold" letter-spacing="1.5">ON EARTH</text>
<text x="674.0" y="504.0" font-size="12" fill="#8d6c45" text-anchor="end" font-style="italic">for us</text>
<rect x="42" y="518" width="206" height="150" rx="6" fill="#fffdf7" stroke="#8d6c45" stroke-width="1.5"/>
<circle cx="59" cy="536" r="11" fill="#3b2f1e"/>
<text x="59.0" y="540.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">4</text>
<text x="76.0" y="541.0" font-size="14" fill="#3b2f1e" font-weight="bold">Bread</text>
<text x="240.0" y="541.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">6:11</text>
<text x="52.0" y="562.0" font-size="13" fill="#3b2f1e" font-style="italic">“Give us this day our daily</text>
<text x="52.0" y="579.0" font-size="13" fill="#3b2f1e" font-style="italic">bread,”</text>
<text x="52.0" y="658.0" font-size="12" fill="#2f4f7f">δὸς ἡμῖν · give us</text>
<g transform="translate(214 636)"><ellipse cx="0" cy="0" rx="20" ry="10" fill="#d9a85f" stroke="#8d6c45" stroke-width="1.2"/><path d="M-10 -4 q4 6 0 10 M0 -6 q4 7 0 12 M10 -4 q4 6 0 10" fill="none" stroke="#8d6c45" stroke-width="1"/></g>
<rect x="260" y="518" width="206" height="150" rx="6" fill="#fffdf7" stroke="#8d6c45" stroke-width="1.5"/>
<circle cx="277" cy="536" r="11" fill="#3b2f1e"/>
<text x="277.0" y="540.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">5</text>
<text x="294.0" y="541.0" font-size="14" fill="#3b2f1e" font-weight="bold">Debts</text>
<text x="458.0" y="541.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">6:12</text>
<text x="270.0" y="562.0" font-size="13" fill="#3b2f1e" font-style="italic">“and forgive us our debts, as</text>
<text x="270.0" y="579.0" font-size="13" fill="#3b2f1e" font-style="italic">we also have forgiven our</text>
<text x="270.0" y="596.0" font-size="13" fill="#3b2f1e" font-style="italic">debtors.”</text>
<text x="270.0" y="658.0" font-size="12" fill="#2f4f7f">ἄφες ἡμῖν · forgive us</text>
<rect x="416" y="622" width="32" height="26" rx="2" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.2"/><path d="M421 629 H443" stroke="#6b5a3e" stroke-width="1"/><path d="M421 636 H443" stroke="#6b5a3e" stroke-width="1"/><path d="M421 643 H443" stroke="#6b5a3e" stroke-width="1"/><path d="M419 625 L445 645" stroke="#8b1e1e" stroke-width="2"/>
<rect x="478" y="518" width="206" height="150" rx="6" fill="#fffdf7" stroke="#8d6c45" stroke-width="1.5"/>
<circle cx="495" cy="536" r="11" fill="#3b2f1e"/>
<text x="495.0" y="540.5" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold">6</text>
<text x="512.0" y="541.0" font-size="14" fill="#3b2f1e" font-weight="bold">Keeping</text>
<text x="676.0" y="541.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">6:13</text>
<text x="488.0" y="562.0" font-size="13" fill="#3b2f1e" font-style="italic">“And lead us not into</text>
<text x="488.0" y="579.0" font-size="13" fill="#3b2f1e" font-style="italic">temptation, but deliver us</text>
<text x="488.0" y="596.0" font-size="13" fill="#3b2f1e" font-style="italic">from evil.”</text>
<text x="488.0" y="658.0" font-size="12" fill="#2f4f7f">ῥῦσαι ἡμᾶς · deliver us</text>
