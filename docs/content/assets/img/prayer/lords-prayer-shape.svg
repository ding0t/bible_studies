<text x="616.0" y="708.0" font-size="11.5" fill="#8d6c45" text-anchor="end" font-style="italic">the one praying</text>
<text x="360.0" y="754.0" font-size="12" fill="#6b5a3e" text-anchor="middle" font-weight="bold" letter-spacing="1.2">COUNT THE PRONOUNS IN THE GREEK</text>
<text x="196.0" y="781.0" font-size="13" fill="#3b2f1e" text-anchor="end">your (σου), 6:9-10</text>
<circle cx="214" cy="776" r="9" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.2"/>
<circle cx="240" cy="776" r="9" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.2"/>
<circle cx="266" cy="776" r="9" fill="#e8c46a" stroke="#a67c3d" stroke-width="1.2"/>
<text x="300.0" y="781.0" font-size="14" fill="#3b2f1e" font-weight="bold">3</text>
<text x="196.0" y="809.0" font-size="13" fill="#3b2f1e" text-anchor="end">us, our, we, 6:11-13</text>
<circle cx="214" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<circle cx="240" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<circle cx="266" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<circle cx="292" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<circle cx="318" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<circle cx="344" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<circle cx="370" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<circle cx="396" cy="804" r="9" fill="#cdb07a" stroke="#8d6c45" stroke-width="1.2"/>
<text x="430.0" y="809.0" font-size="14" fill="#3b2f1e" font-weight="bold">8</text>
<text x="456.0" y="795.0" font-size="12.5" fill="#6b5a3e" font-style="italic">Every request for yourself</text>
<text x="456.0" y="812.0" font-size="12.5" fill="#6b5a3e" font-style="italic">is prayed in the plural.</text>
<rect x="90" y="834" width="540" height="58" rx="6" fill="#fffdf7" stroke="#6b5a3e" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="360.0" y="858.0" font-size="13.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">“For yours is the kingdom and the power and the glory, forever. Amen.”</text>
<text x="360.0" y="878.0" font-size="12" fill="#6b5a3e" text-anchor="middle">Not in the earliest manuscripts; the ESV prints it in a footnote to 6:13.</text>
<path d="M200.0 926 H520.0 L510.0 939.0 L520.0 952 H200.0 L210.0 939.0 Z" fill="#8b1e1e"/>
<text x="360.0" y="944.0" font-size="14" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">HE PRAYED IT HIMSELF</text>
<rect x="42" y="970" width="300" height="96" rx="6" fill="#fffdf7" stroke="#8b1e1e" stroke-width="1.5"/>
<text x="54.0" y="992.0" font-size="14" fill="#3b2f1e" font-weight="bold">Taught on the mountain</text>
<text x="330.0" y="992.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">Matthew 6:10</text>
<text x="54.0" y="1012.0" font-size="13" fill="#3b2f1e" font-style="italic">“your will be done,”</text>
<text x="54.0" y="1056.0" font-size="13" fill="#2f4f7f" font-weight="bold">γενηθήτω τὸ θέλημά σου</text>
<rect x="378" y="970" width="300" height="96" rx="6" fill="#fffdf7" stroke="#8b1e1e" stroke-width="1.5"/>
<text x="390.0" y="992.0" font-size="14" fill="#3b2f1e" font-weight="bold">Prayed in Gethsemane</text>
<text x="666.0" y="992.0" font-size="11.5" fill="#6b5a3e" text-anchor="end" font-style="italic">Matthew 26:42</text>
<text x="390.0" y="1012.0" font-size="13" fill="#3b2f1e" font-style="italic">“My Father, if this cannot pass unless I</text>
<text x="390.0" y="1029.0" font-size="13" fill="#3b2f1e" font-style="italic">drink it, your will be done.”</text>
<text x="390.0" y="1056.0" font-size="13" fill="#2f4f7f" font-weight="bold">γενηθήτω τὸ θέλημά σου</text>
<path d="M342 1051 H376" stroke="#8b1e1e" stroke-width="2"/>
<text x="360.0" y="1086.0" font-size="13" fill="#3b2f1e" text-anchor="middle" font-style="italic">The same Greek words. The cup was not taken away, and He drank it.</text>
<text x="360.0" y="1126.0" font-size="19" fill="#3b2f1e" text-anchor="middle" font-weight="bold" font-style="italic">The attitude of prayer is that we are God’s.</text>
<text x="696.0" y="1148.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>
