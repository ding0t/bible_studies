<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1170" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The shape of the Lord's Prayer</title>
<desc id="d">A diagram of Matthew 6:9-13 (ESV) drawn as heaven above and earth below. In the heaven band: the address, 'Our Father in heaven' (6:9), then three petitions, each with the Greek 'your' (sou): 1 'hallowed be your name' (6:9), 2 'Your kingdom come' (6:10), 3 'your will be done' (6:10). A gold band joins heaven to earth with the words 'on earth as it is in heaven' (6:10), noted dashed as debated: whether the phrase governs all three petitions or only the third. In the earth band: three petitions spoken as 'us': 4 'Give us this day our daily bread' (6:11), with a loaf; 5 'and forgive us our debts, as we also have forgiven our debtors' (6:12), with a ledger struck through; 6 'And lead us not into temptation, but deliver us from evil' (6:13), with a path. A small figure kneels on the ground. A count: 'your' three times in 6:9-10, 'us', 'our' and 'we' eight times in 6:11-13. A dashed card: the doxology 'For yours is the kingdom and the power and the glory, forever. Amen' is not in the earliest manuscripts; the ESV prints it in a footnote. Below, 'He prayed it Himself': Matthew 6:10 and Matthew 26:42, 'My Father, if this cannot pass unless I drink it, your will be done', share the Greek words genēthētō to thelēma sou. The plate closes with the line 'The attitude of prayer is that we are God's.'</desc>
<rect width="720" height="1170" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="1154" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="1142" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">THE SHAPE OF THE PRAYER</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">Matthew 6:9-13 · heaven first, then earth</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
