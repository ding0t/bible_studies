<text x="360.0" y="206.0" font-size="12.5" fill="#2f4f7f" text-anchor="middle">πάτερ ἡμῶν  pater hēmōn · a child, and a creature · 6:9</text>
<path d="M360.0 224 L220 248" stroke="#3b2f1e" stroke-width="1.3"/>
<path d="M220.0 250.0 L226.4 245.3 L227.7 252.1 Z" fill="#3b2f1e"/>
