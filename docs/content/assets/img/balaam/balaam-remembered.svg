<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 892" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">How Scripture remembers Balaam</title>
<desc id="d">Chart of how Scripture remembers Balaam. At the top, Numbers 22 to 25 and 31 hold two things: his mouth, which spoke the LORD's blessing (Numbers 23:5), and his counsel, which led Israel into sin at Peor (Numbers 31:16). The left column, the Old Testament, remembers what the LORD did: Deuteronomy 23:4-5, the LORD turned the curse into a blessing because He loves Israel; Joshua 24:9-10, the LORD says I would not listen to Balaam; Nehemiah 13:1-2, the same read aloud after the exile; Micah 6:5, remember, so that you may acknowledge the righteousness of the LORD. The right column, the New Testament, warns what Balaam did: 2 Peter 2:15-16, the way of Balaam, who loved the wages of wickedness and was rebuked by a donkey; Jude 11, the error of Balaam, rushing for profit beside Cain and Korah; Revelation 2:14, the teaching of Balaam, a stumbling block of idol food and immorality; and, dashed because it names Peor and not Balaam, 1 Corinthians 10:8 and 11, written down as warnings for us. Each card names the verses in Numbers it reads. The chart closes with Deuteronomy 23:5.</desc>
<rect width="720" height="892" fill="#faf6ec"/>
<rect x="8" y="8" width="704" height="876" fill="none" stroke="#3b2f1e" stroke-width="2.5"/>
<rect x="14" y="14" width="692" height="864" fill="none" stroke="#3b2f1e" stroke-width="0.8"/>
<text x="360.0" y="50.0" font-size="26" fill="#3b2f1e" text-anchor="middle" font-weight="bold" letter-spacing="2">HOW SCRIPTURE REMEMBERS BALAAM</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">One man, two memories (Numbers 22-25; 31)</text>
<path d="M210.0 92 H510.0" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="360.0" cy="92" r="3" fill="#3b2f1e"/>
<rect x="150.0" y="106.0" width="420.0" height="61" rx="5" fill="#f6ecd0" stroke="#a67c3d" stroke-width="1.4"/>
<text x="158.0" y="124.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">NUMBERS 22-25; 31</text>
<text x="158.0" y="141.4" font-size="13.5" fill="#3b2f1e">His mouth: the LORD's word (Numbers 23:5)</text>
<text x="158.0" y="158.4" font-size="13.5" fill="#3b2f1e">His counsel: the sin at Peor (Numbers 31:16)</text>
<path d="M50.0 189 H340.0 L330.0 202.0 L340.0 215 H50.0 L60.0 202.0 Z" fill="#2f4f7f"/>
<text x="195.0" y="206.7" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">THE LORD'S ACT</text>
<path d="M380.0 189 H670.0 L660.0 202.0 L670.0 215 H380.0 L390.0 202.0 Z" fill="#8b1e1e"/>
<text x="525.0" y="206.7" font-size="13" fill="#faf6ec" text-anchor="middle" font-weight="bold" letter-spacing="1.5">BALAAM'S WAY</text>
<text x="195.0" y="233.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">the Old Testament remembers</text>
<text x="525.0" y="233.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">the New Testament warns</text>
<rect x="40.0" y="247.0" width="310.0" height="95" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="48.0" y="265.4" font-size="13" fill="#3b2f1e" font-weight="bold">Moses</text>
<text x="48.0" y="282.4" font-size="13" fill="#3b2f1e">the LORD “turned the curse into</text>
<text x="48.0" y="299.4" font-size="13" fill="#3b2f1e">a blessing for you, because the</text>
<text x="48.0" y="316.4" font-size="13" fill="#3b2f1e">LORD your God loves you”</text>
<text x="48.0" y="333.4" font-size="11.5" fill="#6b5a3e" font-style="italic">Deuteronomy 23:4-5</text>
<rect x="40.0" y="355.0" width="310.0" height="78" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="48.0" y="373.4" font-size="13" fill="#3b2f1e" font-weight="bold">The LORD, through Joshua</text>
<text x="48.0" y="390.4" font-size="13" fill="#3b2f1e">“I would not listen to Balaam ...</text>
<text x="48.0" y="407.4" font-size="13" fill="#3b2f1e">I delivered you from his hand”</text>
<text x="48.0" y="424.4" font-size="11.5" fill="#6b5a3e" font-style="italic">Joshua 24:9-10</text>
<rect x="40.0" y="463.0" width="310.0" height="78" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="48.0" y="481.4" font-size="13" fill="#3b2f1e" font-weight="bold">Read aloud after the exile</text>
<text x="48.0" y="498.4" font-size="13" fill="#3b2f1e">“our God had turned the curse</text>
<text x="48.0" y="515.5" font-size="13" fill="#3b2f1e">into a blessing”</text>
<text x="48.0" y="532.5" font-size="11.5" fill="#6b5a3e" font-style="italic">Nehemiah 13:1-2</text>
<rect x="40.0" y="571.0" width="310.0" height="95" rx="5" fill="#e3e9f2" stroke="#2f4f7f" stroke-width="1.4"/>
<text x="48.0" y="589.5" font-size="13" fill="#3b2f1e" font-weight="bold">The prophet</text>
<text x="48.0" y="606.5" font-size="13" fill="#3b2f1e">“remember ... so that you may</text>
<text x="48.0" y="623.5" font-size="13" fill="#3b2f1e">acknowledge the righteousness</text>
<text x="48.0" y="640.5" font-size="13" fill="#3b2f1e">of the LORD”</text>
<text x="48.0" y="657.5" font-size="11.5" fill="#6b5a3e" font-style="italic">Micah 6:5</text>
<rect x="370.0" y="247.0" width="310.0" height="95" rx="5" fill="#f1dcd4" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="378.0" y="265.4" font-size="13" fill="#3b2f1e" font-weight="bold">THE WAY OF BALAAM</text>
<text x="378.0" y="282.4" font-size="13" fill="#3b2f1e">“loved the wages of wickedness”</text>
<text x="378.0" y="299.4" font-size="13" fill="#3b2f1e">rebuked by a donkey that spoke</text>
<text x="378.0" y="316.4" font-size="13" fill="#3b2f1e">reads Numbers 22:7, 17, 28-30</text>
<text x="378.0" y="333.4" font-size="11.5" fill="#6b5a3e" font-style="italic">2 Peter 2:15-16</text>
<rect x="370.0" y="355.0" width="310.0" height="95" rx="5" fill="#f1dcd4" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="378.0" y="373.4" font-size="13" fill="#3b2f1e" font-weight="bold">THE ERROR OF BALAAM</text>
<text x="378.0" y="390.4" font-size="13" fill="#3b2f1e">“rushed for profit”</text>
<text x="378.0" y="407.4" font-size="13" fill="#3b2f1e">beside Cain and Korah</text>
<text x="378.0" y="424.4" font-size="13" fill="#3b2f1e">reads Numbers 22:7, 17</text>
<text x="378.0" y="441.4" font-size="11.5" fill="#6b5a3e" font-style="italic">Jude 11</text>
<rect x="370.0" y="463.0" width="310.0" height="95" rx="5" fill="#f1dcd4" stroke="#8b1e1e" stroke-width="1.4"/>
<text x="378.0" y="481.4" font-size="13" fill="#3b2f1e" font-weight="bold">THE TEACHING OF BALAAM</text>
<text x="378.0" y="498.4" font-size="13" fill="#3b2f1e">“a stumbling block”: “food sacrificed</text>
<text x="378.0" y="515.5" font-size="13" fill="#3b2f1e">to idols”, “sexual immorality”</text>
<text x="378.0" y="532.5" font-size="13" fill="#3b2f1e">reads Numbers 25:1-3; 31:16</text>
<text x="378.0" y="549.5" font-size="11.5" fill="#6b5a3e" font-style="italic">Revelation 2:14</text>
<rect x="370.0" y="571.0" width="310.0" height="95" rx="5" fill="#fffdf7" stroke="#8b1e1e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="378.0" y="589.5" font-size="13" fill="#3b2f1e" font-weight="bold">PEOR AS A WARNING</text>
<text x="378.0" y="606.5" font-size="13" fill="#3b2f1e">“written down as warnings for us”</text>
<text x="378.0" y="623.5" font-size="13" fill="#3b2f1e">names Peor's sin, not Balaam</text>
<text x="378.0" y="640.5" font-size="13" fill="#3b2f1e">reads Numbers 25:1-9</text>
<text x="378.0" y="657.5" font-size="11.5" fill="#6b5a3e" font-style="italic">1 Corinthians 10:8, 11</text>
<rect x="40.0" y="685.0" width="640.0" height="78" rx="5" fill="#fffdf7" stroke="#3b2f1e" stroke-width="1.4"/>
<text x="48.0" y="703.5" font-size="13.5" fill="#3b2f1e" font-weight="bold">Both memories together</text>
<text x="48.0" y="720.5" font-size="13.5" fill="#3b2f1e">No curse from outside can touch the people God has blessed, and He claims</text>
<text x="48.0" y="737.5" font-size="13.5" fill="#3b2f1e">the victory as His own. A man can still stand under that blessing and choose</text>
<text x="48.0" y="754.5" font-size="13.5" fill="#3b2f1e">the wages, and the warning is written down for the church.</text>
<text x="360.0" y="799.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-style="italic">“the LORD your God turned the curse into a blessing for you,</text>
<text x="360.0" y="819.0" font-size="15" fill="#3b2f1e" text-anchor="middle" font-style="italic">because the LORD your God loves you.”</text>
<text x="360.0" y="839.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle">Deuteronomy 23:5 (BSB)</text>
<text x="40.0" y="868.0" font-size="10.5" fill="#6b5a3e" font-style="italic">Solid: the text names Balaam. Dashed: it names Peor only.</text>
<text x="696.0" y="870.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">After the manner of Clarence Larkin · the-way.lewy.au</text>
</svg>