<title id="t">Ruchi: my Spirit</title>
<desc id="d">Ruchi, רוּחִי: my Spirit. And I will put my Spirit within you, and you shall live. (Ezekiel 37:14 (ESV)). In the scene: the valley full of bones, very dry (Ezekiel 37:1-2); breath from the four winds (37:9); they lived and stood on their feet, an exceedingly great army (37:10).</desc>
