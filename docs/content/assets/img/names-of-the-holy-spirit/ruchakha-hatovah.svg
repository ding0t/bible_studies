<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 429" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Ruchakha Hattovah: and your good Spirit</title>
<desc id="d">Ruchakha Hattovah, וְרוּחֲךָ הַטּוֹבָה: and your good Spirit. You gave your good Spirit to instruct them and did not withhold your manna from their mouth and gave them water for their thirst. (Nehemiah 9:20 (ESV)). In the scene: the pillar of cloud to lead them by day (Nehemiah 9:19); water out of the rock (9:15, 20); manna on the ground (9:20). Not stated, drawn for the scene: the camp's tents.</desc>
