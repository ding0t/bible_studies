<text x="532.0" y="196.0" font-size="22" fill="#3b2f1e" text-anchor="middle" font-weight="bold" font-style="italic">Ruchakha Hattovah</text>
<text x="532.0" y="219.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">and your good Spirit</text>
<path d="M412 234 H652" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="532" cy="234" r="2.6" fill="#3b2f1e"/>
<text x="532.0" y="256.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">You gave your good Spirit to instruct</text>
<text x="532.0" y="274.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">them and did not withhold your manna</text>
<text x="532.0" y="292.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">from their mouth and gave them water for</text>
<text x="532.0" y="310.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">their thirst.</text>
<text x="532.0" y="328.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Nehemiah 9:20 (ESV)</text>
<text x="30.0" y="354.0" font-size="12.5" fill="#6b5a3e">In the scene: the pillar of cloud to lead them by day (Nehemiah 9:19); water out of the rock (9:15, 20);</text>
<text x="30.0" y="371.0" font-size="12.5" fill="#6b5a3e">manna on the ground (9:20).</text>
<text x="30.0" y="388.0" font-size="12.5" fill="#2f4f7f" font-style="italic">Not stated, drawn for the scene: the camp's tents.</text>
<text x="696.0" y="407.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">The Names of the Holy Spirit · the-way.lewy.au</text>
</svg>
