<text x="532.0" y="219.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">your Holy Spirit</text>
<path d="M412 234 H652" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="532" cy="234" r="2.6" fill="#3b2f1e"/>
<text x="532.0" y="256.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">Cast me not away from your presence, and</text>
<text x="532.0" y="274.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">take not your Holy Spirit from me.</text>
<text x="532.0" y="292.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Psalm 51:11 (ESV)</text>
<text x="30.0" y="318.0" font-size="12.5" fill="#6b5a3e">In the scene: Nathan sent to David, and gone (2 Samuel 12:1, 15).</text>
<text x="30.0" y="335.0" font-size="12.5" fill="#2f4f7f" font-style="italic">Not stated, drawn for the scene: the night, the room, the lamp, and David on his knees.</text>
