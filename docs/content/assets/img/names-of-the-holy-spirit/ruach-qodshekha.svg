<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Ruach Qodshekha: your Holy Spirit</title>
<desc id="d">Ruach Qodshekha, רוּחַ קָדְשְׁךָ: your Holy Spirit. Cast me not away from your presence, and take not your Holy Spirit from me. (Psalm 51:11 (ESV)). In the scene: Nathan sent to David, and gone (2 Samuel 12:1, 15). Not stated, drawn for the scene: the night, the room, the lamp, and David on his knees.</desc>
