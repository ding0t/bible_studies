<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Ruach YHWH: the Spirit of the LORD</title>
<desc id="d">Ruach YHWH, רוּחַ יְהוָה: the Spirit of the LORD. And the Spirit of the LORD rushed upon David from that day forward. (1 Samuel 16:13 (ESV)). In the scene: Samuel anoints David with the horn of oil (1 Samuel 16:13); in the midst of his brothers, the seven Jesse had brought before Samuel (16:10, 13); the sheep the youngest was keeping (16:11); the Spirit of the LORD rushing upon David, drawn as light (16:13). Not stated, drawn for the scene: David kneeling.</desc>
