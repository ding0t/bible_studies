<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Paraklētos: the Helper: one called alongside to help</title>
<desc id="d">Paraklētos, ὁ παράκλητος: the Helper: one called alongside to help. And I will ask the Father, and he will give you another Helper, to be with you forever. (John 14:16 (ESV)). In the scene: a large upper room, furnished (Mark 14:15); and it was night (John 13:30); the basin and the towel (13:5). Not stated, drawn for the scene: the disciples, drawn without faces; Jesus, who is speaking, is not drawn.</desc>
