<text x="532.0" y="196.0" font-size="22" fill="#3b2f1e" text-anchor="middle" font-weight="bold" font-style="italic">Paraklētos</text>
<text x="532.0" y="219.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">the Helper: one called alongside to help</text>
<path d="M412 234 H652" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="532" cy="234" r="2.6" fill="#3b2f1e"/>
<text x="532.0" y="256.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">And I will ask the Father, and he will</text>
<text x="532.0" y="274.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">give you another Helper, to be with you</text>
<text x="532.0" y="292.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">forever.</text>
<text x="532.0" y="310.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">John 14:16 (ESV)</text>
<text x="30.0" y="336.0" font-size="12.5" fill="#6b5a3e">In the scene: a large upper room, furnished (Mark 14:15); and it was night (John 13:30); the basin and</text>
<text x="30.0" y="353.0" font-size="12.5" fill="#6b5a3e">the towel (13:5).</text>
<text x="30.0" y="370.0" font-size="12.5" fill="#2f4f7f" font-style="italic">Not stated, drawn for the scene: the disciples, drawn without faces; Jesus, who is speaking, is not</text>
<text x="30.0" y="387.0" font-size="12.5" fill="#2f4f7f" font-style="italic">drawn.</text>
<text x="696.0" y="406.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">The Names of the Holy Spirit · the-way.lewy.au</text>
