<text x="532.0" y="196.0" font-size="22" fill="#3b2f1e" text-anchor="middle" font-weight="bold" font-style="italic">Ruach Elohim</text>
<text x="532.0" y="219.0" font-size="15" fill="#6b5a3e" text-anchor="middle" font-style="italic">the Spirit of God</text>
<path d="M412 234 H652" stroke="#3b2f1e" stroke-width="0.8"/>
<circle cx="532" cy="234" r="2.6" fill="#3b2f1e"/>
<text x="532.0" y="256.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">And the Spirit of God was hovering over</text>
<text x="532.0" y="274.0" font-size="14.5" fill="#3b2f1e" text-anchor="middle">the face of the waters.</text>
<text x="532.0" y="292.0" font-size="12.5" fill="#6b5a3e" text-anchor="middle" font-style="italic">Genesis 1:2 (ESV)</text>
<text x="30.0" y="318.0" font-size="12.5" fill="#6b5a3e">In the scene: darkness over the face of the deep (Genesis 1:2); the face of the waters (1:2); the Spirit</text>
<text x="30.0" y="335.0" font-size="12.5" fill="#6b5a3e">of God hovering over them (1:2).</text>
<text x="30.0" y="352.0" font-size="12.5" fill="#2f4f7f" font-style="italic">Not stated, drawn for the scene: the light and moving air that picture Him.</text>
<text x="696.0" y="371.0" font-size="11" fill="#6b5a3e" text-anchor="end" font-style="italic">The Names of the Holy Spirit · the-way.lewy.au</text>
</svg>
