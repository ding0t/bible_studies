<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 393" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Ruach Elohim: the Spirit of God</title>
<desc id="d">Ruach Elohim, רוּחַ אֱלֹהִים: the Spirit of God. And the Spirit of God was hovering over the face of the waters. (Genesis 1:2 (ESV)). In the scene: darkness over the face of the deep (Genesis 1:2); the face of the waters (1:2); the Spirit of God hovering over them (1:2). Not stated, drawn for the scene: the light and moving air that picture Him.</desc>
