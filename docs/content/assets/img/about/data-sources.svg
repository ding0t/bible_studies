<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1060" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">Where the data comes from</title>
<desc id="d">How this site's data is organised. Three licence tiers sit across the top. Open, quoted at any length: the Hebrew and Greek texts (WLC, SBLGNT, Brenton LXX, UHB, UGNT, Tischendorf); word data (MACULA parsing, syntax and semantic domains, Strong's numbers, TWOT ids); 29 English versions with the WEB as the default; 831,290 cross-references from OpenBible.info and the WEB translators' notes; and unfoldingWord's word alignment. Restricted, used and flagged non-commercial: 262 Dead Sea Scrolls, the Byzantine and Textus Receptus Greek, the Samaritan Pentateuch, a few English versions, and, held but not ingested, BHSA and Mounce. Quotation-only, a sentence or two with attribution: 11 study Bibles and texts (ESV, NIV, NKJV, CSB, NASB, LSB, NLT, NA28), TWOT's discussion prose, and the Bible Knowledge Commentary, read by hand. Open and restricted sources feed bible-text.db, in the public repository, 321 works and 1,222,501 verses rebuilt from source. Quotation-only sources feed study-notes.db, on local storage and never committed. The church fathers and unvetted teaching notes are kept beside them and read by hand. An MCP server with 33 lookup tools, and the query.py command line, read both databases. What reaches a page: a study whose every language claim resolves to a row, and verse and word pop-ups built from the open tier only by export_popups.py.</desc>
