<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
<title id="t">The Way: one road through Scripture</title>
<desc id="d">A road drawn rising from left to right across the plate, labelled with the Hebrew derek and the Greek hodos, the words for a road or way. Seven milestones stand beside it, each a verse that names the way, in the ESV: Isaiah 30:21, "This is the way, walk in it"; Isaiah 40:3, "prepare the way of the LORD"; Malachi 3:1, "he will prepare the way before me"; Mark 1:3, "Prepare the way of the Lord"; John 14:6, "I am the way", picked out in gold; Hebrews 10:20, "the new and living way"; and Acts 9:2, "belonging to the Way", beside three small figures walking the road. Ribbons beneath group them as the Prophets, the Gospels and the Church. The road ends in a circle of light, marked "to the Father" (John 14:6).</desc>
