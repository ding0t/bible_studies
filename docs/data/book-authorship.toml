# Who wrote each book of the Bible, when, where, and in what language -- under two dating schemes.
#
# Read by references/build/unity_measures.py (What Literary Criticism Declares). Every value is
# sourced; nothing is recalled. Years are integers, negative for BC (-1446 = 1446 BC), and a range
# is [earliest, latest] for when the book reached the form we have.
#
#   date            the traditional / conservative date, from the ESV Study Bible introduction
#                   (book or section) unless date_source says otherwise
#   critical        the date critical scholarship assigns, ONLY where the source itself states it
#                   (the ESV Study Bible introductions report the critical view where it differs).
#                   Absent means no source consulted gives a different date -- it does NOT mean
#                   critics agree. The measures treat it as "same as traditional" and say so.
#   author          as the source states it; "anonymous" where the book names no author and the
#                   source does not settle one
#   author_key      groups books by writer for counting distinct authors. Anonymous books get their
#                   own key, so they count once each (the conservative choice: fewer authors).
#   written_from    only where Scripture or the source places the writing; absent otherwise
#   region          the continent of written_from; for Old Testament books with no written_from,
#                   the land of Israel (Asia), where the source places the author. Absent where
#                   neither Scripture nor the source places the writing (Luke, Galatians, Hebrews...)
#   critical_author_key  the writer the critical view assigns where it denies the traditional one
#                   (the ESV SB names the view for these books: Daniel, the Pastorals, Ephesians,
#                   2 Thessalonians, 1 Peter). critical_parts splits Isaiah the way the critical
#                   view does: "late eighth", "middle of the sixth" and "sometime in the fifth"
#                   century, rendered as the ranges below.
#   language        "hebrew", "aramaic" or "greek"; aramaic_portion lists the passages, counted
#                   from the morphhb-wlc morphology (A-prefixed morph codes)
#
# Sources: ESV Study Bible (Crossway), book introductions and the section introductions to 1-2
# Samuel, 1-2 Kings, 1-2 Chronicles, Psalms, Song of Solomon and Revelation; CSB Ancient Faith Study
# Bible (Holman) where noted.

[[book]]
id = "Gen"
author = "Moses"
author_key = "moses"
date = [-1446, -1406]
date_note = "Moses lived in the 1500s or 1300s BC; the early-exodus date is used throughout"
critical = [-500, -400]
critical_note = "final form in the fifth century BC (ESV SB on the critical view of the Pentateuch)"
written_from = "wilderness of Sinai and plains of Moab"
region = "Asia"
language = "hebrew"
aramaic_portion = "Genesis 31:47 (two words)"
genre = "narrative"

