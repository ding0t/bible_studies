# Prophecies Scripture itself says were fulfilled, with the year of the fulfilment, for the
# prophecy validator in What Literary Criticism Declares (references/build/unity_measures.py).
#
# The test each entry is put through: was the prophecy written, and does a copy of it survive,
# before the thing it predicted happened? It is run on three dates:
#
#   traditional   when the book was written, from docs/data/book-authorship.toml
#   critical      the LATEST date critical scholarship assigns that book (Daniel 167-164 BC, Isaiah
#                 40-55 the mid-6th century...), from the same table. This is the date chosen to
#                 make the prophecy as late as possible.
#   manuscript    the date of a surviving copy or translation, which no theory of authorship can
#                 move: the Greek translation of "the Law, the prophecies and the rest of the books"
#                 that the prologue to Sirach already knows of in the 38th year of Euergetes (about
#                 132 BC); the Great Isaiah Scroll (1QIsa-a, c. 125 BC); and any Qumran copy, all
#                 deposited before Qumran fell in AD 68. Qumran attestation is computed, not listed.
#
# Fields
#   prophecy      the text, English versification
#   masoretic     the Hebrew reference where it differs (psalm superscriptions, Micah 5)
#   predicts      what the text says will happen, in its own terms
#   specific      what makes it checkable: name, place, number, time, manner, sequence
#   fulfilment    where Scripture records or claims the fulfilment
#   event         an id in docs/data/chronology.json (anchors, anchor_table, milestones) for the
#                 year; `year` + `year_source` only where the chronology has no entry
#   written       a year the text itself dates the prophecy to, where the book's date would mislead
#   standing      "stated"           Scripture says in so many words that this fulfilled it
#                 "contested-reading" the fulfilment is stated, but what the prophecy text means
#                                     is disputed (the case on both sides goes in the study)
#                 "contested-reckoning" the meaning is agreed, the arithmetic is disputed
#                 "record-after"      the only record of the prophecy is in a book completed after
#                                     the fulfilment, so it cannot serve as evidence here. Kept to
#                                     show the test excludes it.
#   group         "history" (fulfilled inside the Old Testament period), "messiah" (in Jesus),
#                 "after" (after the prophecy's New Testament or Old Testament context closes)

[[prophecy]]
