# Memory verse cards, printed from docs/content/resources/memory-verses.md.
#
# Add a verse here, then from references/build run:
#     uv run python export_memory_verses.py
# which looks up the Hebrew or Greek words, their transliteration and gloss, and each translation
# below, and writes docs/data/memory-verses.json (committed -- CI cannot rebuild the databases).
#
#   ref    Full book name, chapter:verse or chapter:verse-verse within one chapter, numbered as
#          English Bibles number it.
#   theme  A one- or two-word heading for the card.
#   set    Optional. A page shows one set with <!-- memory-verses: <set> -->, or every verse with
#          <!-- memory-verses -->. Cards print in the order they appear here.

translations = ["ESV", "WEB"]

[[verse]]
ref = "Genesis 1:1"
theme = "Creation"
set = "foundations"

[[verse]]
ref = "John 1:1"
theme = "The Word"
set = "foundations"

[[verse]]
ref = "Genesis 15:6"
theme = "Faith"
set = "foundations"

[[verse]]
ref = "Ephesians 2:8-9"
theme = "Grace"
set = "foundations"

[[verse]]
ref = "Isaiah 53:5"
theme = "The Servant"
set = "foundations"

[[verse]]
ref = "Romans 6:23"
theme = "The Gift"
set = "foundations"

[[verse]]
ref = "Deuteronomy 6:4"
theme = "The Shema"
set = "foundations"

[[verse]]
ref = "John 3:16"
theme = "God's Love"
set = "foundations"
