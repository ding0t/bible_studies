# Pictures for the History Chart (docs/content/chronology/history-chart.md), drawn from the comic
# library by: python3 utils/build_chart_sprites.py
#
# Each vignette is one comic panel with no bubbles and no caption, keyed by the id of the event it
# illustrates in docs/data/chronology.json (anything loadEvents() returns). The chart puts it above
# that event when there is room. The panel fields are the comic ones (scene, sky, cast, props); see
# .claude/skills/one-minute-comic/SKILL.md. `shows` is the alt text, read aloud by a screen reader
# and printed nowhere.
#
# The comic rules hold here too: nothing is drawn that the text does not give. Adam and Eve wear
# Genesis 3:21's skins, so they are not drawn at Creation, where they wore nothing (Genesis 2:25).

[[vignette]]
event = "creation"
scene = "plain"
sky = "dawn"
shows = "first light over an empty land, water rising from the ground and sheep grazing"
props = [
  { what = "spring", x = 0.32, s = 0.9 },
  { what = "sheep", x = 0.7, s = 0.8 },
]

