# Which English rendering this site follows for a word the ULT and the Berean Interlinear render
# differently. Read by references/build/alignment_ranking.py, which writes the kind and the
# rendering into docs/dev/alignment-disagreements.md, so a decision survives regenerating it.
#
# The position (2026-11-06): the original word decides, and the translations are witnesses. Where
# they disagree, settle it from (1) the word's own uses, (2) the Septuagint and the New Testament,
# which are Scripture's own translation of it, (3) the ESV, the site's quotation translation; and
# mark it contested where it stays contested.
#
# kind:
#   wording       synonyms; nothing turns on the choice
#   convention    a naming or printing convention (LORD for the divine name); follow the site's
#   idiom         one side renders the literal word, the other its meaning; a claim follows the
#                 meaning, a word study may give the literal
#   interpretive  the choice carries a reading; a study resting on this word says which it follows
#                 and why
# status: "proposed" until the author confirms it, then "decided". Only a decided entry reaches
# readers: the word's pop-up card then says "This site follows ..." with the why. Re-run
# alignment_ranking.py after editing.
#
# Keyed by the Berean's Strong's number, as the report prints it.

[H3068]
kind = "convention"
follow = "LORD"
status = "decided"
why = "LORD in capitals stands for God's own name, יהוה (YHWH, usually pronounced Yahweh), which the Septuagint and the New Testament render Κύριος (Kyrios, \"Lord\"; Exodus 3:15). The site follows the ESV's LORD, and says the name itself wherever the name is the point."

[H3069]
kind = "convention"
follow = "GOD"
status = "decided"
why = "GOD in capitals is still God's name, יהוה (YHWH, Yahweh). After אֲדֹנָי (Adonai, \"Lord\") the Masoretes pointed it יֱהוִה, with the vowels of אֱלֹהִים (Elohim, \"God\"), so it is read \"Lord God\" (Genesis 15:2); the ESV prints it Lord GOD."

[H3050]
kind = "convention"
follow = "LORD"
status = "decided"
why = "יָהּ (Yah) is the short form of God's name יהוה, the \"jah\" of Hallelujah, הַלְלוּ־יָהּ, \"praise Yah\" (Psalm 146:1). The ESV renders it LORD in all 50 tagged places, and the site follows it."

[H325]
kind = "convention"
follow = "Ahasuerus"
status = "decided"
why = "The ESV keeps the Hebrew name; the BSB uses the Greek Xerxes. Both name the same king."

[H639]
kind = "idiom"
follow = "anger"
status = "decided"
why = "אַף is the nose, and \"burning of the nose\" is the Hebrew idiom for anger. The ESV gives anger (177) or wrath (22); the ULT's nose is the literal word for a word study, not the meaning."

[H727]
kind = "wording"
follow = "ark"
status = "decided"
why = "The ESV and the BSB say ark; the ULT says box. The same object."

[H3727]
kind = "interpretive"
follow = "mercy seat"
status = "decided"
why = "The Septuagint renders it ἱλαστήριον (Exodus 25:17), the word Hebrews 9:5 uses for it and Paul uses of Christ (Romans 3:25). \"Mercy seat\" (ESV, BSB) keeps that line. The ULT's \"atonement lid\" keeps something too: the word comes from כָּפַר (kaphar, to atone or cover), worth a sentence in any study of the Day of Atonement."

[H2617]
kind = "interpretive"
follow = "steadfast love"
status = "decided"
why = "Contested. The word's range runs from loyalty within a covenant to kindness beyond what is owed, and each English keeps part of it: covenant faithfulness (ULT) the first, loving devotion (BSB) the second, steadfast love (ESV) both in part. The site follows the ESV so a study's wording and its quotations agree; a study about חֶסֶד itself works the word from its uses."
