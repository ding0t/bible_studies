# The Names of Jesus: the Hebrew of the Old Testament names, each card quoting the New Testament verse
# that gives the name to Jesus (quote_ref) where there is one. The study is
# docs/content/jesus/names-of-jesus.md. The last three letters (ת, ז, ג) arrive on cards for names
# the study does not treat -- a son given, the offspring, the Redeemer -- so the deck reaches all 22.

[deck.names-of-jesus]
title = "The Names of Jesus"

[[deck.names-of-jesus.card]]
hebrew = "יֵשׁוּעַ"
ref = "Nehemiah 8:17"
