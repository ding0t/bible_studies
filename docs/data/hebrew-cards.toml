# Hebrew word cards, printed from docs/content/hebrew/ pages with <!-- hebrew-cards: <deck> -->.
#
# After editing, from references/build run:
#     uv run python export_hebrew_cards.py
# which checks every Hebrew word against STEPBible's TAHOT at the card's verse (a word that is not
# there fails the export), takes its syllables, stress and Strong's number from TAHOT, checks the
# quotation against the ESV in study-notes.db, works out which letters each card introduces, and
# writes docs/data/hebrew-cards.json (committed -- CI cannot reach either database).
#
#   hebrew   The words as the verse writes them, vowel points and all, separated by spaces. A word
#            may be one part of a TAHOT word: אֵל matches the אֵל in לְאֵל.
#   ref      The verse the Hebrew is taken from, numbered as English Bibles number it.
#   name     The name as the card titles it.
#   popular  Optional. The form people know it by, where that differs from what the verse says.
#   meaning  The English, short enough for a card.
#   quote    Words from the ESV of `quote_ref` (default `ref`), copied exactly; the export fails if
#            they are not there.
#   modern   One line on the word in Hebrew spoken today.
#   divine   true for the four-letter name: the card says "read Adonai" and gives no respelling.
#
# Cards print in this order. Each one adds a few letters, so working through the deck in order
# teaches the alphabet; the export prints the running count.

[deck.names-of-god]
title = "The Names of God"

[[deck.names-of-god.card]]
hebrew = "אֵלִי"
ref = "Psalm 22:1"
name = "Eli"
meaning = "my God"
quote = "My God, my God, why have you forsaken me?"
modern = "El (אֵל) lives on inside names: Michael, Daniel, Israel."

[[deck.names-of-god.card]]
hebrew = "אֱלֹהִים"
ref = "Genesis 1:1"
name = "Elohim"
meaning = "God"
quote = "In the beginning, God created the heavens and the earth."
modern = "Still the everyday word for God."

[[deck.names-of-god.card]]
hebrew = "אֲדֹנָי"
ref = "Genesis 15:2"
name = "Adonai"
meaning = "Lord, my Lord"
quote = "O Lord GOD, what will you give me"
modern = "Adoni (אֲדוֹנִי), \"sir\", is everyday polite address."

[[deck.names-of-god.card]]
