ref = "Exodus 3:14"
name = "Ehyeh asher Ehyeh"
meaning = "I AM WHO I AM"
quote = "I AM WHO I AM."
modern = "Ehyeh (אֶהְיֶה) is ordinary future tense today: \"I will be\"."

[[deck.names-of-god.card]]
hebrew = "אֵל שַׁדַּי"
ref = "Genesis 17:1"
name = "El Shaddai"
meaning = "God Almighty"
quote = "I am God Almighty; walk before me, and be blameless"
modern = "Shaddai is written on the back of the scroll inside a mezuzah."

[[deck.names-of-god.card]]
