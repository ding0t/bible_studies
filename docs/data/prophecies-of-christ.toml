research = "drafted"
tier = 1
category = "birth"
prophecy = "Micah 5:2"
masoretic = "Micah 5:1"
predicts = "a ruler of Israel, 'whose coming forth is from of old', will come from Bethlehem Ephrathah"
specific = ["place"]
uses = [
  { ref = "Matthew 2:1-6", kind = "split", text = "neither", note = "'by no means least' (οὐδαμῶς ἐλαχίστη) turns Micah's 'small' (צָעִיר, tsa'ir; LXX ὀλιγοστός) around; 'rulers' (ἡγεμόσιν) reads the consonants of בְּאַלְפֵי (be'alphei, 'among the clans') as אַלֻּפֵי (alluphei, 'chiefs'); 'who will be the shepherd of My people Israel' comes from 2 Samuel 5:2. Matthew stops at Micah 5:2" },
  { ref = "John 7:42", kind = "fulfilment", text = "none", note = "the crowd: 'the Christ will come from the line of David and from Bethlehem' (BSB)" },
]
status = "partly"
control = "unwitting"
recognition = "known-before"
event = "anchor_37"
future_event = "millennium"
split = { first = "Micah 5:2 (the ruler from Bethlehem, whose origins are of old)", rest = "Micah 5:3-4 (he stands and shepherds; 'His greatness will extend to the ends of the earth', BSB)", at = "Matthew 2:6", signal = "Micah 5:3: 'Israel will be abandoned until she who is in labor has given birth' (BSB), עַד־עֵת יוֹלֵדָה יָלָדָה (ad-et yoledah yaladah): an interval stated inside the prophecy, between the birth and the shepherding" }
recognition_evidence = [
  { note = "the chief priests and scribes answer Herod from Micah 5:2 before the magi find the child: the reading was held in Jerusalem", source = "Matthew 2:4-6", year = -5 },
  { note = "the crowd at the Feast of Booths: the Christ comes from Bethlehem", source = "John 7:41-42", year = 32 },
]
standing = "stated"
notes = "Augustus's census brought Joseph from Nazareth to Bethlehem (Luke 2:1-4): control 'unwitting'. 'One whose origins are of old, from the days of eternity' (Micah 5:2, BSB), מִקֶּדֶם מִימֵי עוֹלָם (miqqedem mimei olam): a lead for category nature. The Targum of the Prophets names the Messiah at Micah 5:1 (Hebrew); date it before citing it (session 8)."

