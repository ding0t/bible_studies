# The Old Testament's prophecies of Christ: what each says, when it was written, where the New
# Testament records it fulfilled (or still to come), and who could have known it beforehand.
#
# The authority for every messianic entry. An entry with `standing` also feeds the prophecy
# validator in What Literary Criticism Declares (references/build/unity_measures.py, which reads it
# as group "messiah" beside docs/data/fulfilled-prophecy.toml). Adding `standing` to an entry
# changes that page's counts: re-run unity_measures.py and re-read the page's prose.
#
# Checked by utils/check_prophecies.py (npm test). Work on it is tracked in
# references/study-state/prophecy-and-jesus.yml, and the method is
# .claude/skills/develop-bible-study/prophecy-method.md.
#
# Computed elsewhere, never typed here: the date written (docs/data/book-authorship.toml, both
# schemes), the fulfilment year (docs/data/chronology.json via `event`), the years between them,
# the earliest surviving copy (Qumran, the Great Isaiah Scroll, the Septuagint), the Septuagint's
# versification (references/build/versification.py) and every quoted text (bible-text.db).
#
# ---- Fields ------------------------------------------------------------------------------------
#
# Every entry
#   id            kebab-case, never reused; ids from fulfilled-prophecy.toml kept as they were
#   research      "candidate"  listed from the New Testament's quotations or a tradition; nothing
#                              beyond the references is settled
#                 "drafted"    researched; the fields below filled in from the tools
#                 "verified"   every claim checked and recorded as evidence in the state file
#   tier          1  the New Testament says the text was fulfilled in Jesus or spoke of Him
#                    (a fulfilment formula, "this is", "he foresaw and spoke", Acts 2:31)
#                 2  the New Testament applies the words to Jesus, or reads the text as a type,
#                    without saying it spoke of Him
#                 3  a reading of Christ held by tradition; the New Testament at most alludes
#   category      what the prophecy is about, the backlog's headings (about/backlog.md 2.1):
#                 nature | lineage | birth | childhood | forerunner | ministry | passion |
#                 resurrection (with the ascension and the session at the right hand) |
#                 redemption (the covenant, the Spirit, the nations) | office | future
#   prophecy      the Old Testament text, English versification
#   uses          the New Testament's uses: [{ ref, kind, text?, note? }]. `kind` is the label in
#                 prophecy-method.md section 2:
#                   fulfilment   the writer says this fulfilled it, or that it spoke of Him
#                   split        the quotation stops part-way, or the context keeps back the rest
#                   type         a pattern the writer draws (τύπος, "as… so")
#                   application  the words applied with no claim of fulfilment
#                   imagery      shared pictures with changed details
#                   allusion     the words echoed without a citation
#                 Tier 3 entries may carry allusions and applications only.
#                 `text` is which text the use's wording follows, compared in bible-text.db: "mt"
#                 (the Hebrew, rendered afresh) | "lxx" (the Septuagint's wording) | "both" (they
#                 agree, and so does the use) | "neither" | "none" (no words quoted). Required on
#                 fulfilment, split and application uses once drafted.
#   status        "fulfilled" | "partly" (one part fulfilled, the rest still to come) | "future".
#                 Provisional while research = "candidate".
#
# Optional on a candidate, required once drafted
#   predicts      what the text says will happen, in its own terms
#   specific      what makes it checkable: name | place | number | time | manner | sequence |
#                 lineage | person
#   control       who brought the fulfilment about, the measure of whether it could be arranged:
#                 "divine"     beyond any human agent (a virgin conceives, the dead rise)
#                 "opponents"  done by those who rejected Him (the lots, the thirty pieces)
#                 "unwitting"  done by someone with no thought of the prophecy (Augustus's census)
#                 "followers"  done by His own people (Joseph's tomb; the apostles choosing
#                              Matthias): the case a critic says could have been arranged
#                 "chosen"     Jesus acted, knowing the text (the donkey; "to fulfil the Scripture",
#                              John 19:28)
#                 "unfulfilled" for status "future"
#   recognition   whether the text was read of the Messiah before Jesus:
#                 "known-before" a witness older than the fulfilment reads it so (Qumran, the
#                                Septuagint's rendering, or the New Testament reporting what was
#                                already believed: Matthew 2:4-6; John 1:21; 7:42)
#                 "partly"       read of the Messiah, but not of the part Jesus fulfilled
#                                (a Messiah who reigns, where Jesus fulfilled the one who suffers)
#                 "veiled"       no witness reads it so before the fulfilment
#                 "unassessed"   not yet looked at
#
# Optional
#   masoretic     the Hebrew reference where it differs (psalm superscriptions, Micah 5)
#   form          "prediction" (the default) | "type" (a person, event or institution that the
#                 New Testament reads as a pattern of Christ)
#   speaker       who speaks in the Old Testament text where it matters: "messiah" for the
#                 first-person texts the New Testament puts in Jesus' mouth (Psalm 22; Psalm 40:6-8;
#                 Isaiah 50:6; Isaiah 61:1)
#   near          what the text first meant in its own day: a person, a people, an event
#   exceeds       the particular the near referent fails, with a reference (Acts 2:29-31: David
#                 saw corruption, so Psalm 16:10 is not about David)
#   offices       ["prophet", "priest", "king"]: a tag across categories
#   yhwh_text     true where the Old Testament text speaks of the LORD (יהוה) and the New
#                 Testament applies it to Jesus
#   recognition_evidence  [{ source, year, note }]: year an integer, negative for BC, the date of
#                 the witness (a midrash dated by its compilation, never by the rabbi it names)
#   understood_after      a New Testament text saying it was understood only afterwards
#                 (John 2:22; 12:16; 20:9; Luke 24:25-27, 44-45)
#   event         an id in docs/data/chronology.json (anchors, anchor_table, milestones,
#                 life_events) for the fulfilment year; `year` + `year_source` where it has none
#   future_event  an id in chronology.json future_sequence, for status "future" or "partly"
#   split         { first, rest, at, signal }: the fulfilled words, the words still to come, the
#                 New Testament text that divides them, and what in the Old Testament text could
#                 have shown the join beforehand
#   standing      the validator's field (see fulfilled-prophecy.toml): stated | contested-reading
#                 | contested-reckoning | record-after; with standing_note
#   written       a year the text itself dates the prophecy to
#   notes         leads and observations; a lead says "lead:" until it is checked

# ================================================================================================
# Moved from fulfilled-prophecy.toml (2026-11-25), ids unchanged. Each one's `fulfilment` text is
# now `uses`; its comments are now `notes`. Their validator fields are researched; the new ones
# (control, recognition, each use's text) are not, so they start as candidates with the rest.
# ================================================================================================

