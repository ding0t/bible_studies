# One-minute comic for docs/content/christian-life/test-the-spirits.md.
# Drawn by: python3 utils/build_comics.py test-the-spirits
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-13.
#
# The study in five beats: the command (1 John 4:1), two of the counterfeits it takes apart (a sign
# that comes true, Deuteronomy 13:1-3; Bible words, Matthew 4:6), testing done well (the Bereans
# test even Paul, Acts 17:11), and the Shepherd who keeps the sheep (John 10:4-5, 27; 1 John 4:4).
# Deuteronomy's prophet is unnamed, so he is a generic man. The devil is never drawn: his words come
# from beyond the panel edge. Acts records no words at Berea, so that panel has none. John and Paul
# are reserved here, the first comic to need them.

title = "Test the Spirits"
subtitle = "Recognising false teachers in one minute"
layout = "setting-exchange-evidence-verdict"
note = "The devil is heard in panel 3 and never drawn. The three marks in the point are the study’s."
point = "God gave you His word to test every teacher by: the Christ they preach, the life they live, where they lead you. A sign or a Bible verse proves nothing on its own, and the One who is in you is greater (1 John 4:4)."

[[panel]]
ref = "1 John 4:1"
scene = "room"
caption = "John writes to the churches."
caption_w = 220
aside = "“Test”: δοκιμάζω (dokimazō), the word for gold tried in the fire (1 Peter 1:7)."
aside_w = 260
shows = "John seated by lamplight with a scroll, writing to the churches"
cast = [
  { who = "john", x = 0.60, face = "left", stance = "sit", pose = "hold", holds = "scroll" },
]
say = [
  { by = "john", text = "Beloved, do not believe every spirit, but test the spirits to see whether they are from God.", source = "condensed", at = [0.80, 0.12], w = 220 },
]

[[panel]]
ref = "Deuteronomy 13:1-3"
scene = "street"
sky = "day"
caption = "The sign comes to pass. “You shall not listen.”"
caption_w = 230
shows = "a prophet with his hand raised calls two Israelites after other gods"
cast = [
  { who = "man", id = "prophet", name = "a prophet", x = 0.30, face = "right", pose = "raise", tone = 3 },
  { who = "man", id = "hearer", name = "a hearer", x = 0.66, face = "left", pose = "fold" },
  { who = "woman", id = "hearer2", name = "a hearer", x = 0.84, face = "left", pose = "stand" },
]
say = [
  { by = "prophet", text = "Let us go after other gods … and let us serve them.", source = "condensed", at = [0.5, 0.26], w = 190 },
]

[[panel]]
ref = "Matthew 4:5-7"
scene = "temple"
sky = "day"
caption = "The devil quotes Scripture."
caption_w = 200
shows = "Jesus at the temple in the holy city; the devil's words come from beyond the panel and are not drawn"
cast = [
  { who = "jesus", x = 0.86, face = "left", pose = "open", s = 0.75 },
]
say = [
  { by = "devil", name = "the devil", from = [-0.05, 0.40], text = "If you are the Son of God, throw yourself down, for it is written…", source = "condensed", at = [0.34, 0.27], w = 180 },
  { by = "jesus", text = "Again it is written, ‘You shall not put the Lord your God to the test.’", source = "esv", at = [0.46, 0.60], w = 180 },
]

[[panel]]
ref = "Acts 17:10-11"
scene = "synagogue"
caption = "Berea. They test even Paul, “examining the Scriptures daily to see if these things were so.” Luke calls them more noble."
caption_w = 380
shows = "Paul teaching in the synagogue at Berea while his hearers search scrolls of the Scriptures"
cast = [
  { who = "paul", x = 0.18, face = "right", pose = "open" },
  { who = "authority", id = "bereans", name = "the Bereans", n = 3, x = 0.52, x2 = 0.88, face = "left", pose = "hold", holds = "scroll", s = 0.95 },
]

[[panel]]
ref = "John 10:5, 27; 1 John 4:4"
scene = "hills"
sky = "day"
caption = "“He who is in you is greater than he who is in the world.” (1 John 4:4)"
caption_w = 340
shows = "Jesus calls on a hillside and His sheep come to Him; a stranger at the far side calls and the sheep turn from him"
props = [
  { what = "sheep", n = 4, x = 0.40, x2 = 0.64, s = 0.9 },
]
cast = [
  { who = "jesus", x = 0.80, face = "left", pose = "open" },
  { who = "man", id = "stranger", name = "a stranger", x = 0.10, face = "right", pose = "point", tone = 4 },
]
say = [
  { by = "jesus", text = "My sheep hear my voice, and I know them, and they follow me.", source = "esv", at = [0.70, 0.26], w = 220 },
]
