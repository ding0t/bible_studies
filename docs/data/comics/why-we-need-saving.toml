# One-minute comic for docs/content/sin/why-we-need-saving.md.
# Drawn by: python3 utils/build_comics.py why-we-need-saving
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-23.
#
# The study in five beats: God gives every tree and one command, for the man's life (Genesis 2:9,
# 16-17); the serpent contradicts God, and the forbidden tree looks "good for food" (Genesis 3:4-6),
# the words Genesis 2:9 used of the trees God gave (טוֹב and נֶחְמָד, checked with bible_interlinear);
# God calls "Where are you?" and the man answers from hiding (Genesis 3:8-10); every one of us has
# gone astray like sheep to his own way (Isaiah 53:6); and while we were still sinners, Christ died
# for us (Romans 5:8).
# No person is drawn in the garden. Adam and Eve are reserved figures drawn only in the garments of
# skins (Genesis 3:21), and these panels come before 3:21: the man's words come from the thicket he
# hid in (3:8), and the woman is named in the caption. God gives no form in Genesis 2-3, so He is a
# voice. Genesis gives the serpent no shape before the curse (3:14) and names no fruit; both are drawn
# plainly and the note says so. The forbidden tree is drawn as the same tree as the others because to
# the woman it looked like them (3:6). The evening light is "the cool of the day" (3:8). The crosses
# have no figures on them, by the site's rule, under the darkness of Luke 23:44.

title = "Why We Need Saving"
subtitle = "Sin and the God who came looking, in one minute"
layout = [[300, 1], [300, 1, 1], [300, 1, 1]]
note = "No one is drawn in the garden: God gives no form there, and Adam and Eve are drawn only once He has clothed them (Genesis 3:21). Genesis names no fruit and gives the serpent no shape before the curse."
point = "God's commands are for your good, and sin calls His good evil. Every one of us went our own way, but God came looking: while you were still a sinner, His Son Jesus died for you (Romans 5:8)."

