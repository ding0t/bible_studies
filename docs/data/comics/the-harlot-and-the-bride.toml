# One-minute comic for docs/content/last-things/the-harlot-and-the-bride.md.
# Drawn by: python3 utils/build_comics.py the-harlot-and-the-bride
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-17.
#
# A comparison in the echo shape: the harlot down the left, the Bride down the right, one beat per row.
# Row 1, the invitation: one of the seven bowl angels says to John, "Come, I will show you" both
# times. SBLGNT Revelation 17:1 and 21:9 share "Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς
# ἑπτὰ φιάλας ... καὶ ἐλάλησεν μετʼ ἐμοῦ λέγων· Δεῦρο, δείξω σοι" (checked 2026-10-17), which the
# word thread names. The angel is a voice with no figure; John is the reserved `john`.
# Row 2, her dress: purple, scarlet, gold and the golden cup (17:4) against linen "granted her"
# (19:8). The harlot is drawn seated because John sees her "sitting" (17:3) and she says "I sit as a
# queen" (18:7); the scarlet beast she sits on is not drawn, and the note says so. She is a city
# pictured as a woman (17:18), and the comic names no city: the study marks the identification as
# contested.
# Row 3, her end: an empty, ruined street at night under 18:23's "no more", with no figure, since
# 17:16's devouring is left to the words. The Bride's end is the marriage supper (19:9). Jesus is
# drawn as the Lamb whose marriage it is (19:7), the identification Revelation itself makes (5:6-9).
# Row 4, the call: "Come out of her, my people" (18:4), a voice from heaven to people walking out;
# the Bride's "Come" (22:17) to one who is thirsty, beside the spring of the water of life.

title = "The Harlot and the Bride"
subtitle = "Two women, two invitations, two ends"
layout = [[280, 1, 1], [46, 1], [300, 1, 1], [300, 1, 1], [300, 1, 1]]
headers = ["The harlot", "The Bride"]
note = "Both women are John’s pictures: the harlot a city (Revelation 17:18), the Bride God’s people. The beast she sits on is not drawn."
point = "Two women call, and Scripture has already written how each one ends. Come out of Babylon, and answer the Bride’s “Come” (Revelation 18:4; 22:17)."

[[panel]]
ref = "Revelation 17:1"
scene = "plain"
sky = "dusk"
caption = "One of the seven angels to John."
caption_w = 190
shows = "John standing on a plain at dusk, looking up toward a voice from above"
cast = [
  { who = "john", x = 0.20, face = "right", pose = "look_up", tag = "John" },
]
say = [
  { by = "angel", name = "the angel", from = [0.72, -0.2], style = "voice", text = "Come, I will show you the judgment of the *great prostitute*", source = "esv", at = [0.68, 0.40], w = 150 },
]

[[panel]]
ref = "Revelation 21:9"
scene = "vista"
horizon = 0.66
sky = "dawn"
