# One-minute comic for docs/content/last-things/judgment-seat-of-christ.md.
# Drawn by: python3 utils/build_comics.py judgment-seat-of-christ
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-15.
#
# The study in five beats, in the order it puts them: the robe is given before any work is weighed
# (Isaiah 61:10; Revelation 7:14; Romans 8:1); every believer appears before the βῆμα (2 Corinthians
# 5:10); the fire tests the work, which survives for reward or burns for loss while the builder is
# saved (1 Corinthians 3:13-15); the crowns go back to the throne (Revelation 4:10-11); and, a
# thousand years later (Revelation 20:5, 7), a different judgment at the great white throne, where
# the question is the book of life (Revelation 20:11-15).
# The builder in panels 3 and 4 keeps the white robe of panel 1 while the work burns: the study's
# point that loss at the judgment seat is never condemnation (Romans 8:1).
# The reward is drawn as a wreath because Paul names the reward a στέφανος (1 Corinthians 9:25) and
# the elders cast their στέφανοι (Revelation 4:10). The one seated on each throne is drawn as light:
# Revelation describes His presence, and gives no form (4:2-3; 20:11).
# The "time gap" strip is the device this comic introduces: a ribbon between rows naming the span
# the text puts between two scenes.

title = "The Judgment Seat of Christ"
subtitle = "The robe first, then the fire"
layout = [[300, 1, 1], [300, 1, 1], [290, 1], [46, 1], [300, 1]]
note = "The One on each throne is drawn as light; the reward as a wreath (1 Corinthians 9:25)."
point = "You stand before Christ’s judgment seat in a robe washed in His blood; there your work is tested for reward or loss, and every crown goes back to Him. Both the robe and the reward are His gift (2 Corinthians 5:10; Revelation 4:10)."

