]
say = [
  { from = [0.95, -0.1], by = "isaiah", name = "Isaiah", style = "text", text = "He gives power to the *faint*,", source = "esv", at = [0.68, 0.30], w = 140 },
  { from = [0.95, -0.1], by = "isaiah", name = "Isaiah", style = "text", text = "they shall *run and not be weary*;", source = "esv", at = [0.68, 0.56], w = 140 },
