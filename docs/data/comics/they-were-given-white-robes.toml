# One-minute comic for docs/content/last-things/they-were-given-white-robes.md.
# Drawn by: python3 utils/build_comics.py they-were-given-white-robes
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-15.
#
# The study in five beats: God clothes Adam and Eve in garments of skins after their fig leaves
# failed (Genesis 3:7, 10, 21); the son who is "no longer worthy" is given the best robe, a στολή
# (Luke 15:21-22); Jesus' clothes turn whiter than any fuller could make them (Mark 9:2-3); the
# multitude's robes are made white in the Lamb's blood (Revelation 7:9, 13-14); and the Bride is
# granted fine linen, the righteous deeds of the saints (Revelation 19:7-8).
# Panels 3 and 4 hold the only two New Testament uses of λευκαίνω, "make white" (Mark 9:3;
# Revelation 7:14; checked with bible_concordance G3021), and the word thread under them says so.
# Genesis 3:21 records no words and names no animal: the panel's words are the narrator's verse, and
# "an animal died to make them" is marked as the study's reading. Moses and Elijah (Mark 9:4) are
# left out of panel 3, which is about the clothes. Jesus' radiant look is Matthew 17:2 ("his face
# shone like the sun, and his clothes became white as light"). The multitude carry palm branches
# (Revelation 7:9). The elder's crown is Revelation 4:4. The Bride is Revelation's own picture of the
# people of God (19:7), drawn as one figure.

title = "They Were Given White Robes"
subtitle = "Who are these, and where did the white come from?"
layout = [[300, 1, 1], [360, 1, 1], [46, 1], [300, 1]]
note = "Panel 1 draws no one giving the clothes: Genesis gives no form. The Bride is Revelation’s picture of God’s people."
point = "God puts the white on His people: the robe is washed white in the Lamb’s blood, and even the linen of their righteous deeds is granted. Stand in what He washed (Revelation 7:14; 19:8)."

