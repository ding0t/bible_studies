# One-minute comic for the "Given the work, and the Spirit to do it" section of
# docs/content/last-things/judgment-seat-of-christ.md.
# Drawn by: python3 utils/build_comics.py ezekiels-commission
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-15.
#
# Five beats: Ezekiel falls on his face before the glory and is told to stand (Ezekiel 1:28-2:1); the
# Spirit enters him and sets him on his feet (2:2); a hand holds out a scroll and he eats it, sweet
# as honey (2:9-3:3); God makes him a watchman, "whether they hear or refuse to hear" (2:7; 3:17;
# 33:2-6); and Paul uses the watchman's terms for his own ministry at Miletus (Acts 20:26-27).
# Ezekiel is drawn lying for "I fell on my face" (Ezekiel 1:28); the glory itself is not drawn, only
# the cloud of 1:4, since Ezekiel describes it as "the appearance of the likeness" (1:28). The hand and the
# scroll are 2:9. The breath is רוּחַ (2:2), wind, breath or spirit; the ESV reads the Spirit. The
# wall, trumpet and turning crowd are Ezekiel 33:2-6's own picture of the watchman. The Ephesian
# elders weep because "there was much weeping on the part of all" (Acts 20:37).
# Nobody in panel 4's crowd speaks: Ezekiel records no words from them.

title = "Ezekiel’s Commission"
subtitle = "The work, the words and the Spirit, all given"
layout = [[290, 1, 1], [300, 1, 1], [290, 1]]
note = "The glory is not drawn: Ezekiel saw only “the appearance of the likeness” (Ezekiel 1:28)."
point = "God gives the work, the words and the Spirit to do it, and asks that you be found faithful with what He gave (Ezekiel 2:2, 7; 1 Corinthians 4:2)."

