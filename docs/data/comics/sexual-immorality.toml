# One-minute comic for docs/content/sin/sexual-immorality.md.
# Drawn by: python3 utils/build_comics.py sexual-immorality
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-17.
#
# The study's sentence in five beats: Corinth's slogans (1 Corinthians 6:12-13), Paul's answer that
# the body is for the Lord (6:13), the reason, bought with a price (6:19-20), what fleeing looks like
# (Joseph, Genesis 39:12, under 6:18), and the grace the argument stands on (6:11).
# Panel 1: the quotation marks are the ESV's reading (Greek has none; NASB, LSB and NKJV omit them),
# which the study follows and marks, so the panel's aside says so. The speakers are generic men of
# Corinth; the text says only that some Corinthians said this.
# Panel 2: Paul wrote from Ephesus (1 Corinthians 16:8), drawn writing with a scroll.
# Panel 3: the price is "the precious blood of Christ" (1 Peter 1:18-19; Revelation 5:9), the study's
# own grounding, so the crosses stand empty on the rise and the aside names the verse.
# Panel 4: Potiphar's wife is unnamed in Scripture, so she is the generic `egyptian` (her dress is
# background from Egyptian tomb painting, recorded in comic.py). She holds the garment (39:12);
# her words are not drawn. Joseph runs for the door. His reason, "How then can I do this great
# wickedness and sin against God?" (39:9), was said on an earlier day, so it is an aside, not a bubble.
# Panel 5: "And such were some of you" (6:11), drawn as believers in white.

title = "Flee, and Glorify God in Your Body"
