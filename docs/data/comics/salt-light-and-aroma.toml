# One-minute comic for docs/content/christian-life/salt-light-and-aroma.md.
# Drawn by: python3 utils/build_comics.py salt-light-and-aroma
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-22.
#
# Panel 1: "he went up on the mountain, and when he sat down, his disciples came to him" (Matthew
#   5:1). Peter is the only disciple named; Matthew names none here, so the rest are generic and Peter
#   carries no tag. Key words on the two identity statements.
# Panel 2: a lamp on a household stand, night in a house. The stand is λυχνία (G3087); the basket
#   Jesus rules out is μόδιος (G3426), a grain measure, so no basket is drawn over a lamp.
# Panel 3: Revelation 1:12-13, 20. Seven separate lampstands, counted. John gives them no shape;
#   each is drawn as one stand with one flame so seven read as seven, and the note says so (see
#   prop_golden_lampstand; the-heavenly-pattern/lampstand.md on the menorah as symbol). Jesus "in
#   the midst of the lampstands" (1:13). John falls at His feet (1:17); drawn kneeling.
# Thread: λυχνία in Matthew 5:15 and Revelation 1:20, verified with bible_concordance on
#   macula-greek-sblgnt (12 occurrences in 11 verses; Matthew 5:15 is one, Revelation 1:20 has two).
#   The thread names the shared word only; that the church is the stand of Matthew 5:15 is this
#   study's connection, and the aside says so.
# Panel 4: Matthew 5:16. Good works are drawn as bread given to a poor man (Matthew 25:35 names
#   feeding the hungry); onlookers praise looking up, toward "your Father who is in heaven".

title = "Salt and Light"
subtitle = "You are the salt of the earth and the light of the world, in one minute"
layout = [[280, 1], [300, 1, 1], [46, 1], [290, 1]]
note = "Revelation gives the lampstands no shape, so each is drawn as one stand. Panel 4's bread is one example of a good work."
point = "Jesus has made you salt and light, and He walks among His churches, His lampstands. Shine together where people can see, so they give glory to your Father in heaven (Matthew 5:16; Revelation 1:20)."

