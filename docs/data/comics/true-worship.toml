]
cast = [
  { who = "jesus", x = 0.42, face = "right", pose = "open", look = "radiant" },
  { who = "magdalene", x = 0.66, face = "left", stance = "kneel", pose = "look_up" },
  { who = "woman", id = "othermary", name = "the other Mary", x = 0.84, face = "left", stance = "kneel", pose = "fold", tone = 1 },
