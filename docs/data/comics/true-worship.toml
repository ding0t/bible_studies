  { who = "robed", id = "multitude", name = "every creature", n = 7, x = 0.04, x2 = 0.30, depth = 0.5, face = "right", stance = "kneel", pose = ["praise", "fold"] },
]
say = [
  { by = "multitude", text = "To him who sits on the throne and to the Lamb be *blessing and honor and glory and might* forever and ever!", source = "esv", at = [0.30, 0.38], w = 260 },
]
