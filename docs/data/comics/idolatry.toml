# One-minute comic for docs/content/sin/idolatry.md.
# Drawn by: python3 utils/build_comics.py idolatry
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-22.
#
# The study in five beats, in its own order: the made god is nothing, a log that half bakes bread and
# half is prayed to (Isaiah 44:15-17); the worship given to a god goes to demons (1 Corinthians
# 10:20, quoting Deuteronomy 32:17) -- and only there, which is why the aside says so; the uncarved
# idol Paul names is money (Colossians 3:5), and Jesus puts it in God's place by name (Matthew 6:24);
# pride is the door, wealth and a lifted heart before other gods (Deuteronomy 8:12-19); and John's
# last word, after naming Jesus Christ the true God (1 John 5:20-21).
# The carpenter kneels because Isaiah 44:17 says he "falls down to it". The charcoal fire is the
# half of the log he burned (44:16). Moses speaks Deuteronomy 8 to Israel on the plains of Moab
# (Deuteronomy 1:5); the speaker is drawn, the hearers are a small crowd. Jesus' hearers in Matthew
# 6 are "his disciples" and the crowds (5:1; 7:28).

title = "Idolatry"
subtitle = "What you trust and serve in God’s place"
layout = [[300, 1, 1], [300, 1, 1], [250, 1]]
point = "Whatever you trust and serve in God’s place is an idol. Turn from it to the living God and His Son Jesus Christ, the true God (1 Thessalonians 1:9; 1 John 5:20-21)."

