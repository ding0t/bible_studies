# One-minute comic for docs/content/jesus/bread-of-life-feeding-the-multitudes.md.
# Drawn by: python3 utils/build_comics.py bread-of-life
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-12.
#
# The two settings are drawn from what each account gives. The 5,000: spring, "the Passover ... was
# at hand" (John 6:4), "the green grass" (Mark 6:39), "much grass" (John 6:10), sat "in groups, by
# hundreds and by fifties" (Mark 6:40), in Jewish Galilee. The 4,000: "the region of the Decapolis"
# (Mark 7:31), "three days", "some of them have come from far away" (Mark 8:2-3), sat "on the
# ground" (Mark 8:6). Both are a "desolate place" (Mark 6:35; 8:4), so that is not drawn as the
# difference. The baskets are counted: 12 κόφινοι (Mark 6:43) and 7 σπυρίδες (Mark 8:8), the
# distinction Jesus keeps at Mark 8:19-20.

title = "Two Tables"
subtitle = "The feeding of the 5,000 and the 4,000 in one minute"
layout = "two-tables"
point = "God fed Israel first, then the nations, to the full and from the same hands, and the true bread from heaven is His Son. So come to Jesus Himself, and count the baskets He has already filled for you (John 6:35; Mark 8:21)."

