# Comic for docs/content/jesus/three-days-and-three-nights.md, section "The week as the Hebrew
# calendar counts it". It replaces the mermaid flowchart there and says the same thing.
# Drawn by: python3 utils/build_comics.py three-days
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-12.
#
# The Hebrew day runs from evening to evening (Genesis 1:5; Leviticus 23:32), so each column is one
# day with its night on top. The weekday names are the study's Friday reading; the dashed third
# night in the tally is what that reading has to absorb (Matthew 12:40), marked as the study marks
# it. Mark 16:2 has the women at the tomb "when the sun had risen", so day 3 counts from dawn.

title = "Three Days, Two Nights"
subtitle = "The week as the Hebrew calendar counts it, sunset to sunset"
layout = "day-by-day"
headers = ["The Preparation", "The Sabbath", "The first day"]
numbers = false
subheaders = ["Thursday sunset → Friday sunset", "Friday sunset → Saturday sunset", "Saturday sunset → Sunday sunset"]
note = "Each Hebrew day begins at sunset, so its night comes first. Weekdays follow this study's Friday reading."
point = "Mark names the day He died, “the day before the Sabbath,” and Luke counts that Sunday “the third day.” The Friday reading keeps both, and owes one night."

