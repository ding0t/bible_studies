# One-minute comic for docs/content/jesus/jesus-and-women.md.
# Drawn by: python3 utils/build_comics.py jesus-and-women
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-16.
#
# The study in five beats, in the Gospels' own order: women travel with Jesus beside the Twelve
# (Luke 8:1-3); Mary of Bethany takes the disciple's place at His feet and He defends it (Luke
# 10:38-42); the women who followed Him from Galilee stay at the cross (Mark 15:40-41); the risen
# Jesus sends Mary Magdalene to "my brothers" (John 20:17); she tells them, "I have seen the Lord"
# (John 20:18). Mary Magdalene is reserved here (Luke 8:2 names her first among the women); the
# other women are the generic cast. Luke 8:3 names no gifts, so none are drawn. Mary of Bethany is
# drawn seated, as Luke 10:39 says (παρακαθεσθεῖσα). The aside on panel 5 is Luke 24:10-11, the
# apostles' response to the women's earlier report from the tomb (not to John 20:18); every note in the comic is Scripture.

title = "Jesus and Women"
subtitle = "Disciples at His feet, witnesses of His rising"
layout = [[300, 1], [380, 3, 2], [390, 1, 1]]
note = "Luke 8:3 names no gifts, so none are drawn."
point = "Jesus taught women as His disciples and sent them as the first witnesses of His resurrection. Sit at His feet, and go and tell what you have seen (Luke 10:42; John 20:17-18)."

[[panel]]
ref = "Luke 8:1-3"
scene = "hills"
sky = "day"
caption = "Through the towns of Galilee, preaching the kingdom."
caption_w = 300
shows = "Jesus walks a hill road with two of the Twelve ahead of Him and three women following, Mary Magdalene among them"
cast = [
  { who = "woman", id = "women", name = "the other women", n = 2, x = 0.08, x2 = 0.2, face = "right", stance = "walk", tone = 1 },
  { who = "magdalene", x = 0.32, face = "right", stance = "walk", tag = "Mary Magdalene" },
  { who = "jesus", x = 0.55, face = "right", stance = "walk", pose = "open" },
  { who = "disciple", id = "twelve", name = "two of the Twelve", n = 2, x = 0.74, x2 = 0.88, face = "right", stance = "walk" },
]
say = [
  { by = "luke", name = "Luke", from = [0.5, -0.1], style = "text", text = "the twelve were with him, and also *some women*", source = "esv", at = [0.72, 0.30], w = 190 },
]

[[panel]]
ref = "Luke 10:38-42"
scene = "room"
caption = "Bethany: Mary sits at His feet."
caption_w = 220
aside = "At a teacher’s feet: the disciple’s place (Acts 22:3)."
