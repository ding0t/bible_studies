  { what = "crosses", x = 0.76, s = 0.8 },
]
cast = [
  { who = "magdalene", x = 0.16, face = "right", pose = "heart" },
  { who = "woman", id = "watchers", name = "Mary the mother of James and Joses, and Salome", n = 2, x = 0.3, x2 = 0.44, face = "right", pose = ["fold", "heart"], tone = 2 },
]
say = [
  { by = "mark", name = "Mark", from = [0.5, -0.1], style = "text", text = "When he was in Galilee, they *followed him* and ministered to him", source = "esv", at = [0.72, 0.24], w = 125 },
