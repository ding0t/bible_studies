cast = [
  { who = "jesus", x = 0.14, face = "right", stance = "sit", pose = "open" },
  { who = "woman", id = "mary", name = "Mary of Bethany", x = 0.36, face = "left", stance = "sit", pose = "fold", tone = 3 },
  { who = "woman", id = "martha", name = "Martha", x = 0.82, face = "left", pose = "point", tone = 0 },
]
say = [
  { by = "martha", text = "Lord, do you not care that my sister has left me to serve alone?", source = "esv", at = [0.80, 0.20], w = 140 },
  { by = "jesus", text = "Mary has chosen the *good portion*, which will not be taken away from her.", source = "esv", at = [0.30, 0.44], w = 190 },
]

[[panel]]
