# One-minute comic for docs/content/spiritual-beings/those-called-gods.md.
# Drawn by: python3 utils/build_comics.py those-called-gods
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-15.
#
# The study in five beats, in its own order: on earth God puts His name on those He appoints, Moses
# "like God to Pharaoh" (Exodus 7:1) and Israel's judges, before whom a case "shall come before God"
# (Exodus 22:9, where ʾĕlōhîm takes a plural verb); in Psalm 82 God stands in the council and
# sentences the "gods" to die like men (82:1, 6-7); over the nations stand princes in heaven (Daniel
# 10:13) and demons behind the idols (1 Corinthians 10:20; Deuteronomy 32:17); at the cross Christ
# disarmed the rulers and authorities (Colossians 2:15); and of the Son the Father says, "Your throne,
# O God" (Hebrews 1:8).
# Psalm 82's "gods" are drawn as men because the study's own case leans that way (82:2-4, 7; John
# 10:35), and the panel's aside marks the reading as contested, as the study does. The One on the
# throne is drawn as light, as in judgment-seat-of-christ. The angel who speaks to Daniel is drawn
# as a voice: the study is about the princes he names, and Daniel 10:5-6 gives a man of light too
# bright to look at. Daniel kneels because 10:10 sets him "on my hands and knees". Pharaoh is left
# out of panel 1: the verse is spoken to Moses.

title = "Those Called Gods"
subtitle = "Who carries the name, and who holds it"
layout = [[300, 1, 1], [310, 1], [300, 1, 1], [300, 1, 1]]
note = "The One on the throne is drawn as light; the angel in Daniel 10 as a voice."
point = "Every power that carries the name “god” was made through the Son, answers to God, and was disarmed at the cross. So fear none of them, and worship the Son, whose throne is forever (Colossians 2:15; Hebrews 1:8)."

