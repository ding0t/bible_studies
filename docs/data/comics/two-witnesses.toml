# One-minute comic for docs/content/last-things/two-witnesses.md.
# Drawn by: python3 utils/build_comics.py two-witnesses
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-12.
#
# An echo: their Lord's story down the left, in sepia because it is done, and the two witnesses'
# down the right, beat for beat, because "their Lord" is the study's own thesis (Revelation 11:8,
# 11-12; Acts 1:9). Revelation 11:3-13 records no word spoken by the witnesses or by the crowd. The
# only speech is heaven's: "Come up here!" (11:12). So the witnesses' bubble is the fire from their
# mouth (11:5), the crowd's is a bubble of presents (11:10), and the comic puts no words in either.
# Revelation names neither prophet; the study reads them as Moses and Elijah and marks it contested,
# so they are drawn as two unnamed men in sackcloth and not as reserved figures.

title = "Their Lord's Story"
subtitle = "The two witnesses of Revelation 11 in one minute"
layout = "echo"
headers = ["Their Lord", "His two witnesses"]
first_column_past = true
note = "Revelation records no words from the two witnesses or the crowd: fire and gifts stand where speech would."
point = "What God did for His Son Jesus, He does for those who bear witness to Him: no one silences them before their work is done, and He raises them in their enemies' sight. Your testimony is not lost when the world mocks it (Revelation 11:7, 11-12)."

[[panel]]
ref = "John 18:37"
scene = "colonnade"
sky = "day"
flashback = true
shows = "Jesus before Pilate"
cast = [
  { who = "pilate", x = 0.30, face = "right", pose = "fold", s = 0.85, tag = "Pilate" },
  { who = "jesus", x = 0.72, face = "left", pose = "heart", s = 0.85 },
]
say = [
  { by = "jesus", text = "For this purpose I have come into the world— to bear witness to the truth.", source = "esv", at = [0.5, 0.05], w = 190 },
]

[[panel]]
ref = "Revelation 11:2-6"
scene = "street"
sky = "storm"
caption = "Jerusalem, trampled by the nations. Two prophets in sackcloth prophesy for 1,260 days."
caption_w = 330
aside = "Revelation names neither of them."
aside_w = 230
shows = "in a Jerusalem street under a dark sky, two men in sackcloth face a soldier with a spear and a man raising a stone; fire pours from the prophets' mouths toward them"
cast = [
  { who = "witness", id = "w1", name = "the first witness", x = 0.14, face = "right", pose = "open" },
  { who = "witness", id = "w2", name = "the second witness", x = 0.28, face = "right", pose = "point", tone = 1 },
  { who = "soldier", id = "foe1", name = "a soldier", x = 0.74, face = "left", pose = "hold", holds = "spear" },
  { who = "man", id = "foe2", name = "a man with a stone", x = 0.90, face = "left", pose = "raise", holds = "stone" },
]
say = [
  { by = "w1", style = "fire", to = "foe1", text = "" },
  { by = "w2", style = "fire", to = "foe2", text = "" },
]

[[panel]]
