cast = [
  { who = "jesus", x = 0.12, face = "right", pose = "open" },
  { who = "disciple", id = "eleven", x = 0.46, x2 = 0.70, n = 3, face = "left", pose = ["praise", "fold", "praise"] },
  { who = "disciple", id = "doubter", name = "a doubting disciple", x = 0.91, face = "left", pose = "stand", marks = ["question"], tone = 2 },
