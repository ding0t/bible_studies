# One-minute comic for docs/content/last-things/they-were-given-white-robes.md, embedded in
# "The fine linen of righteous deeds", where the study sets the robe and the linen side by side.
# Drawn by: python3 utils/build_comics.py two-garments
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-15.
#
# A comparison in the echo shape: the white robe down the left, the fine linen down the right, one
# question per row.
# Row 1, how each comes: both are given, and Revelation uses the same verb for both, ἐδόθη (6:11;
# 19:8), which the word thread under the row names. The martyrs are "under the altar" (6:9).
# Row 2, what each is: the robe is iniquity taken away and pure clothing put on (Zechariah 3:3-4,
# the study's clothing-by-God thread); the linen "is the righteous deeds of the saints" (Revelation
# 19:8), which God "prepared beforehand" (Ephesians 2:10). The deed drawn, bread given to a poor
# man, is an example and carries no claim about which deeds.
# Row 3, the judgment seat: the robe holds when the work burns (1 Corinthians 3:15); surviving work
# brings reward (3:14). Setting the robe/linen pair against 1 Corinthians 3 is the study's reading
# (it links judgment-seat-of-christ.md), so the row carries an aside saying so.
# Row 4, worn together: Isaiah's song, clothed by God "as a bride adorns herself" (Isaiah 61:10).
# Zechariah 3:4's speaker is "the angel"; the study marks reading him as the LORD as contested, so
# the angel is a voice with no figure, named only as the angel.

title = "Two Garments"
subtitle = "The white robe and the fine linen, side by side"
layout = [[290, 1, 1], [46, 1], [300, 1, 1], [300, 1, 1], [280, 1]]
headers = ["The white robe", "The fine linen"]
note = "Panel 4’s bread is one example: Revelation names no deed. The Bride is Revelation’s picture of God’s people."
point = "Both garments are given. The robe is your standing, washed white by the Lamb and never burned; the linen is the deeds God prepared for you to walk in. Wear both as His gift (Revelation 6:11; 19:8; Ephesians 2:10)."

