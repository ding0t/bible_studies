# One-minute comic for docs/content/jesus/the-king-on-a-donkey.md, section "Peace now, the white
# horse later".
# Drawn by: python3 utils/build_comics.py the-king-comes-twice
# ESV wording verified against study-notes.db (esv-study-bible), 2026-11-09.
#
# One King, two comings, beat for beat. He comes: on the colt down the Mount of Olives (Luke
# 19:35-38), and on a white horse out of opened heaven (Revelation 19:11). What He comes to do: weep
# over the city that did not know "the things that make for peace" (Luke 19:41-42), and strike down
# the nations with the armies of heaven behind Him (Revelation 19:14-15). Who He is: Jerusalem asks
# "Who is this?" while Matthew has already quoted "your king is coming to you, humble" (Matthew 21:5,
# 10-11), and the name on His robe is "King of kings and Lord of lords" (Revelation 19:16).
# The word thread: βασιλεύς (G935), "king", in Matthew 21:5 and Revelation 19:16 (SBLGNT).
# The colt has no saddle and carries the disciples' cloaks because Mark 11:7 and Luke 19:35 say so;
# Matthew 21:7 has two animals brought, and Jesus is drawn on the colt, the one Mark, Luke and John
# say He sat on (Mark 11:7; Luke 19:35; John 12:14). The cloaks on the road are Luke 19:36. The tears
# are Luke 19:41 ("he wept over it"). Revelation 19 gives the horse its colour only (19:11). The
# diadems are 19:12; the eyes like fire, the robe dipped in blood (19:13) and the sword from His
# mouth (19:15) are left to the text, since the cast's faces stay blank and the costume is fixed.
# The armies are in white linen (19:14), the `robed` cast. Jerusalem is not drawn; captions place it.

title = "The King Comes Twice"
subtitle = "A donkey and a white horse, in one minute"
layout = [[300, 1, 1], [300, 1, 1], [300, 1, 1], [46, 1]]
headers = ["He came on a donkey", "He comes on a white horse"]
numbers = false
note = "Jesus is drawn on the colt, which Mark, Luke and John say He sat on. The diadems are Revelation 19:12's; the eyes like fire, the robe dipped in blood and the sword from His mouth are left to the text."
point = "One King comes twice. He came on a donkey to save the world (John 12:47) and make peace by His cross (Colossians 1:20), and He will come on a white horse to judge and reign (Revelation 19:11). Come to Him now, while He comes to you in peace."

