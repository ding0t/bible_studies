# One-minute comic for docs/content/christian-life/partakers-of-the-divine-nature.md.
# Drawn by: python3 utils/build_comics.py partakers-of-the-divine-nature
# ESV wording verified against study-notes.db (esv-study-bible), 2026-10-15.
#
# The study in four beats and a strip: Peter, knowing his death is near (2 Peter 1:14), writes that
# God's divine power "has granted to us all things that pertain to life and godliness" (1:3); Jesus
# at the vine, the fruit coming from abiding (John 15:5) and given with His joy (John 15:11); believers
# making every effort (2 Peter 1:5), the effort of commandments "not burdensome" (1 John 5:3); the
# word strip names Peter's eight qualities, faith first and love last (2 Peter 1:5-7), each joined to
# the last by ἐν, "in", seven times; and the master's welcome, "Enter into the joy of your master" (Matthew 25:21),
# for the entrance "richly provided" (2 Peter 1:11).
# The vine is drawn because John 15 sets the teaching at the vine by Jesus' own words ("I am the
# vine", 15:5); where He spoke it (after the upper room, John 14:31) is not drawn, so the scene is
# open hills. The bread given in panel 3 is one example of a deed and carries no claim. Panel 4 is
# Jesus' parable (Matthew 25:14-30); the master is drawn as a generic man, and setting it beside
# 2 Peter 1:11 is the study's reading, marked in the aside.

title = "Partakers of the Divine Nature"
subtitle = "Given everything, the branch bears fruit"
layout = [[300, 2, 3], [290, 1], [46, 1], [290, 1]]
note = "Panel 3’s bread is one example of a deed. Panel 4 is Jesus’ parable of the talents."
point = "God has given you everything for life and godliness and a share in His nature. So give every effort, the glad effort of a branch: the fruit is His, the load is light, and the welcome is joy (2 Peter 1:3-11)."

