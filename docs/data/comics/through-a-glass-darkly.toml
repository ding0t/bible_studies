# One-minute comic for docs/content/christian-life/through-a-glass-darkly.md.
# Drawn by: python3 utils/build_comics.py through-a-glass-darkly
# ESV wording verified against study-notes.db (esv-study-bible), 2026-11-12.
#
# The study's point: now we see Him in a mirror, in glimpses God gives; then face to face
# (1 Corinthians 13:12). Told through the Transfiguration in Luke's telling, the one gospel that says
# the three were "heavy with sleep" and saw His glory "when they became fully awake" (Luke 9:32;
# διαγρηγορέω, its only New Testament use, checked with bible_concordance G1235). Then the crossing
# to the reader: Peter, the eyewitness, sends his readers to the prophetic word "as to a lamp shining
# in a dark place, until the day dawns" (2 Peter 1:19).
# Moses and Elijah are named in Luke 9:30, so the reserved figures are drawn. Jesus' radiant look is
# Luke 9:29 ("his clothing became dazzling white"). The fear mark is Luke 9:34 ("they were afraid").
# The evening sky in panel 1 is atmosphere: Luke 9:37 has them come down "the next day".

title = "Through a Glass, Darkly"
subtitle = "Heavy with sleep, and then they saw His glory"
layout = [[300, 1], [300, 1, 1], [300, 1, 1]]
note = "Luke is the gospel that records the three asleep on the mountain (Luke 9:32)."
point = "Now you see Jesus in the mirror of the gospel, and every glimpse is His gift. Wake, look to Him, and wait: then you will see Him face to face (1 Corinthians 13:12)."

