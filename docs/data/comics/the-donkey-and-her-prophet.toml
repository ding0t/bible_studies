# One-minute comic for docs/content/biblical-figures/the-donkey-and-her-prophet.md.
# Drawn by: python3 utils/build_comics.py the-donkey-and-her-prophet
# ESV wording verified against study-notes.db (esv-study-bible), 2026-11-07.
#
# The study in five beats: Balak's princes bring the fees for divination and ask for a curse, and
# Balaam says he cannot go beyond the LORD's command (Numbers 22:7, 17-18); on the road the donkey
# sees the angel with the drawn sword and Balaam strikes her (22:22-25); she lies down, he strikes
# her with his staff, and the LORD opens her mouth (22:27-28); the LORD opens Balaam's eyes, and the
# angel sends him on to speak only the word he is given (22:31-35); on the heights he cannot curse
# whom God has not cursed (23:7-8).
# The donkey is a she-donkey, אָתוֹן (aton, H860), with feminine verbs throughout (22:23-33). She is
# saddled because 22:21 says so. Balaam rides her because 22:22 says so; his two servants (22:22)
# are left out to keep panel 2 clear. The vineyards and the walls are 22:24's. The angel of the LORD is drawn as
# light with the drawn sword the text gives (22:23, 31): Numbers gives no form. Balak is named but not
# drawn; his princes are generic men. The camp below the heights in panel 5 is not drawn; the caption
# places it.

title = "The Donkey and Her Prophet"
subtitle = "A hired curse that God would not let him speak, in one minute"
layout = [[300, 1], [300, 1, 1], [300, 1, 1]]
note = "The angel of the LORD is drawn as light holding the drawn sword Numbers gives him (22:23); the text gives no form. The donkey is a she-donkey (Hebrew aton). Balak is named in the story but not drawn."
point = "No one can curse those God has blessed. The LORD who opened a donkey's mouth and a prophet's eyes turned the curse into a blessing, because He loves His people (Deuteronomy 23:5), and in Jesus that blessing is yours (Galatians 3:14)."

[[panel]]
ref = "Numbers 22:7, 17-18"
scene = "plain"
sky = "dawn"
caption = "Pethor, by the Euphrates. Balak, king of Moab, has sent princes with the fees for divination."
caption_w = 300
shows = "at dawn, two princes of Moab hold out gifts to Balaam, who stands beside his saddled donkey with his staff"
props = [
  { what = "donkey", x = 0.64, s = 1.0 },
]
cast = [
  { who = "man", id = "prince", name = "a prince of Moab", n = 2, x = 0.12, x2 = 0.26, face = "right", pose = ["offer", "point"], holds = "gift", tone = 3 },
  { who = "balaam", x = 0.44, face = "left", pose = "open", holds = "staff", tag = "Balaam" },
]
say = [
  { by = "prince", text = "Come, *curse this people* for me.", source = "esv", at = [0.20, 0.36], w = 130 },
  { by = "balaam", text = "I could not go beyond the *command of the LORD* my God", source = "esv", at = [0.62, 0.34], w = 170 },
]

