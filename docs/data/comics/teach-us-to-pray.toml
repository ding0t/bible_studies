]
say = [
  { by = "child", name = "a child", text = "Our *Father* in heaven, hallowed be your name.", source = "esv", at = [0.30, 0.40], w = 115 },
  { by = "deuteronomy", name = "Deuteronomy", from = [1.05, 1.0], style = "text", text = "You shall teach them diligently to your children", source = "esv", at = [0.79, 0.30], w = 105 },
