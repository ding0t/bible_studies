name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'app/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Generate recently-updated page
        run: python3 utils/generate_recent_updates.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        run: npm ci
        working-directory: app

      - name: Run tests
        run: npm test
        working-directory: app

      # Must precede the mkdocs build: this regenerates docs/data/events.json from study
      # frontmatter and writes both React bundles into docs/content/assets/js/, which mkdocs then
      # copies into the site like any other asset. The output is gitignored, so it exists only
      # here and in a local dev tree.
      - name: Build tool bundles
        run: npm run build:tools
        working-directory: app

      - name: Build mkdocs content site
        run: uvx --with mkdocs-material --with mkdocs-awesome-pages-plugin --with mkdocs-git-revision-date-localized-plugin --with mkdocs-redirects mkdocs build --site-dir site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
