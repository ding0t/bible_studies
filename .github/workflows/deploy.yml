name: Deploy site to Cloudflare Workers

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'app/**'
      - 'mkdocs.yml'
      # hooks/draft_pages.py decides which pages reach the build at all, so a change to it
      # changes the published site even when no content file moves.
      - 'hooks/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Generate recently-updated page
        run: python3 utils/generate_recent_updates.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        run: npm ci
        working-directory: app

      - name: Run tests
        run: npm test
        working-directory: app

      # Must precede the mkdocs build: this regenerates docs/data/events.json from study
      # frontmatter and writes both React bundles into docs/content/assets/js/, which mkdocs then
      # copies into the site like any other asset. The output is gitignored, so it exists only
      # here and in a local dev tree.
      - name: Build tool bundles
        run: npm run build:tools
        working-directory: app

      - name: Build mkdocs content site
        run: uvx --with mkdocs-material --with mkdocs-awesome-pages-plugin --with mkdocs-git-revision-date-localized-plugin --with mkdocs-redirects mkdocs build --site-dir site

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No `wrangler` devDependency anywhere in the repo for the action to detect a version
          # from, so it silently falls back to an old pinned default (3.90.0) that doesn't
          # understand an assets-only wrangler.jsonc (no `main`) -- pin explicitly instead.
          wranglerVersion: '4'
