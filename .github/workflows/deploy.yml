name: Deploy site to Cloudflare Workers

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'app/**'
      - 'mkdocs.yml'
      # hooks/draft_pages.py decides which pages reach the build at all, so a change to it
      # changes the published site even when no content file moves.
      - 'hooks/**'
      # hooks/llms.py publishes the study skills at /skills/, and the connector serves them.
      - '.claude/skills/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Generate recently-updated page
        run: python3 utils/generate_recent_updates.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        run: npm ci
        working-directory: app

      - name: Run tests
        run: npm test
        working-directory: app

      # The content linter. Until 2026-09-20 this ran only by hand, so its one hard check --
      # an unbroken prose run over 600 words (check 21) -- could not stop a readability
      # regression from deploying. Warnings still exit 0 and are advisory; only errors fail
      # the build. Costs ~0.4s.
      - name: Validate content
        run: npm run validate
        working-directory: app

      # Must precede the mkdocs build: this regenerates docs/data/events.json from study
      # frontmatter and writes both React bundles into docs/content/assets/js/, which mkdocs then
      # copies into the site like any other asset. The output is gitignored, so it exists only
      # here and in a local dev tree.
      - name: Build tool bundles
        run: npm run build:tools
        working-directory: app

      # The public connector's original-language data (references/build/export_connector.py),
      # 130 MB of JSON: kept out of git and published as a release asset, because CI cannot
      # rebuild bible-text.db. mkdocs copies it into the site like any other asset.
      - name: Download original-language data
        run: |
          gh release download lang-data --pattern lang.tgz --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/lang.tgz" -C docs/content/assets
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build mkdocs content site
        run: uvx --with mkdocs-material --with mkdocs-awesome-pages-plugin --with mkdocs-git-revision-date-localized-plugin --with mkdocs-redirects --with segno mkdocs build --site-dir site

      # The connector (/mcp) against the site just built: the files the Worker will read.
      - name: Test connector
        run: CONNECTOR_SITE=../site npm run test:connector
        working-directory: app

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No `wrangler` devDependency anywhere in the repo for the action to detect a version
          # from, so it silently falls back to an old pinned default (3.90.0) that doesn't
          # understand wrangler.jsonc's assets block -- pin explicitly instead.
          wranglerVersion: '4'
