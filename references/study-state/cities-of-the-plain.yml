    notes: "Author asked for its own study with many good pictures, after archaeological-sites.md was given images. Filed in scripture/ (biblical archaeology); category archaeology."
  exegesis:
    historical_context:
      done: true
      notes: >-
        Genesis 13-19 set in the patriarchal period; ESV Study Bible dates the destruction c. 2067/1901 BC
        (early/late chronology). Valley of Siddim = Salt Sea (Genesis 14:3); bitumen pits (14:10).
        Location of the cities unknown; most study Bibles lean to the south/southeast of the Dead Sea
        (ESV SB, NIV BTSB on 13:10); CBSB says no certain identification. CSB/LSB footnote: kikkar 'Lit circle'.
    literary_context:
      done: true
      notes: >-
        Genesis 18:16-33 (intercession) frames 19:1-29; 19:29 summarises: God remembered Abraham.
        The judgment waits on Lot reaching Zoar (19:22-24), already treated in last-things/taken-before-judgment.md --
        link rather than repeat.
    content_word_studies:
      done: true
      notes: "Counts verified with bible_concordance (macula-hebrew-wlc / macula-greek-sblgnt)."
      terms:
