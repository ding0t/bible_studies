author_positions:
  - "Author favours Joel Kramer's (Expedition Bible) southern five-site model: Bab edh-Dhra, Numeira, Feifa, Khanazir burned and never resettled; es-Safi (Zoar) spared and continued. Lead with it as the main case."
  - "2026-10-08: author pressed that the bacterial study does not account for Kramer's 50-70 mm balls found in multitudes. Agreed: the paper tested two Masada nodules. Section rewritten to give both cases their best form and name the layer and isotope tests. The author was right that a ball floats: Kramer drops a burning ball into the Dead Sea at 19:31 of the video and it floats and goes out; that clip (18:22-19:58) is embedded. Clapp and Donahue (Bab edh-Dhra/Numeira geologists) proposed an earthquake-ignited sulphur/bitumen mechanism (video 17:36) -- not yet in the study."
  - "Author finds the in-sediment (bacterial) origin of the Lisan sulphur nodules unpersuasive against Genesis 19:24. Discussed 2026-10-06; section to present both cases, distinguishing nodules in lake-bed gypsum from any sulphur found in the cities' own burn layers."

open_questions:
  - "Kramer's sulphur balls: which layer were they taken from, and was any lab analysis (d34S against host) published? None found 2026-10-08. The section names layer and isotopes as the two deciding tests. CORRECTED 2026-10-08 from the video transcript: the opening five balls (four lit, one not) are a symbol of the five cities, not samples from each site; the earlier draft's 'Safi sample does not burn' was a misreading, and at 42:55 he sets the Zoar ball alight as a joke."
  - "How long does a burning sulphur ball float in Dead Sea brine? Kramer's ball floated (video 19:31); pure solid sulphur (2.07 g/cm3) is denser than the brine (1.24), so it must trap air. Unmeasured."
  - "Feifa and Khanazir: walled towns or cemeteries/enclosures? Excavation status to verify before calling them cities."
  - "Madaba Map discovery date: 1884 (found) vs 1896-97 (published during rebuilding of St George's) -- verify before stating."
  - "Wisdom 10:6 says fire fell on 'the five cities'; Genesis 19:21 and Deuteronomy 29:23 exempt Zoar. Say so where Wisdom is quoted."
  - "Fork candidate: the sin of Sodom (Ezekiel 16:49-50 with Jude 7) is its own study."

