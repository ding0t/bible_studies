genre: [ot-narrative, prophets, topical]

thesis: >-
  God overthrew four cities of the plain and spared the fifth, little Zoar, for Lot's sake, and
  the record keeps that difference for two thousand years -- the four never rebuilt, Zoar still a
  town in Isaiah's day, Josephus' day and on a sixth-century church floor -- because the Judge of
  all the earth judges exactly and keeps the people He has promised to keep.
outline:
  - section: "In one sentence / Key Takeaways"
    says: "The thesis; what the archaeology can and cannot carry."
  - section: "Five cities in one valley"
    says: "Genesis 13-14: the kikkar of the Jordan, the five kings, Bela that is Zoar, the bitumen pits by the Salt Sea."
  - section: "The overthrow and the little one"
    says: "Genesis 18-19: Abraham's intercession, Lot's plea for a 'little one' (mitsar -> Tsoar), 'I can do nothing till you arrive', sulfur and fire, Lot's wife, the smoke Abraham saw."
  - section: "Four never rebuilt, one lived on"
    says: "Deuteronomy 29:23 names four; the prophets make 'no one shall dwell there' a byword; Zoar reappears as a living Moabite town (Deuteronomy 34:3; Isaiah 15:5; Jeremiah 48:34) and in Josephus."
  - section: "Zoar on a church floor: the Madaba Map"
    says: "The c. AD 560 mosaic in St George's, Madaba: 'Balak also Segor, now Zoara' among palms, and the sanctuary of St Lot, excavated above Ghor es-Safi."
  - section: "Where were the burned cities?"
    says: "Southern case (Bab edh-Dhra, Numeira: burned, never resettled) and northern case (Tall el-Hammam); each has a dating problem; the 2021 airburst paper was retracted in 2025. Marked contested."
  - section: "The sulphur balls"
    says: "Wyatt's 1989 claim vs the geology of the Lisan Formation (Bishop, Turchyn & Sivan 2013): the nodules formed in place; the text's brimstone stands on the text."
  - section: "What the overthrow shows about God"
    says: "Genesis 18:25; 19:29; 2 Peter 2:6-9; Jude 7; Luke 17:28-32; Hosea 11:8 -- exact judgment, remembered mercy, an example and a warning that land on the reader."
  - section: "Discussion questions / References"
    says: ""
word_budget: 4500
word_budget_reason: >-
  An archaeology survey with about eighteen captioned photographs; image captions and credit lines
  count toward the budget and add roughly 500 words that a text-only study would not carry.

stages:
