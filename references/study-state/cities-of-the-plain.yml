        - {word: "גָּפְרִית", language: hebrew, transliteration: "gophrit", strongs_id: "H1614", gloss: "sulfur, brimstone", notes: "7 verses: Genesis 19:24; Deuteronomy 29:22(Heb)/23(Eng); Job 18:15; Psalm 11:6; Isaiah 30:33; 34:9; Ezekiel 38:22."}
        - {word: "מַהְפֵּכָה", language: hebrew, transliteration: "mahpekah", strongs_id: "H4114", gloss: "overthrow", notes: "6 verses, all the Sodom formula: Deuteronomy 29:22(Heb); Isaiah 1:7; 13:19; Jeremiah 49:18; 50:40; Amos 4:11. Isaiah 1:7 'as overthrown by foreigners' is the one not naming Sodom."}
        - {word: "הֲפֵכָה", language: hebrew, transliteration: "hafekah", strongs_id: "H2018", gloss: "overthrow", notes: "Only Genesis 19:29."}
        - {word: "τεφρόω", language: greek, transliteration: "tephroo", strongs_id: "G5077", gloss: "reduce to ashes", notes: "Only 2 Peter 2:6 in the NT."}
        - {word: "כִּכָּר", language: hebrew, transliteration: "kikkar", strongs_id: "H3603", gloss: "circle; round plain", notes: "Genesis 13:10-12; 19:17, 25, 28-29."}
