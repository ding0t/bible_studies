thesis: "When the prophets saw God's glory they reached for precious stones, because a gem shows a light it does not make; so the stones that carried Israel's names on the high priest's heart become the foundations of a city lit by God and the Lamb, and God means you to shine in the same way, with His light."
outline:
  - {section: "Hook", says: "Ezekiel 1:26-28 stacks 'like the appearance of' until the words run out, and lands on stones and a rainbow."}
  - {section: "Where the stones appear", says: "A map of the scenes, Eden to the city, with a drawn plate setting Exodus 28, Ezekiel 28 (MT and LXX) and Revelation 21 side by side."}
  - {section: "What the stones were", says: "Why translations disagree; the probable ancient stone behind each name (Pliny), with photographs; sapphire is lapis, John's jasper is clear."}
  - {section: "The language of appearance", says: "Ezekiel and John describe by likeness; Revelation 4 builds on Ezekiel 1; what the text picks out of the stones is gleam, clarity, fire and the rainbow."}
  - {section: "A light the stone does not make", says: "The answer to the light question: gems shine by received light; Revelation 21:11, 23 say the city's radiance is God's glory; Josephus's tradition says the same of the breastpiece. This shows that God is the light His works display."}
  - {section: "Names on the stones", says: "The tribes engraved over the priest's heart (Exodus 28:21, 29) and the apostles on the foundations (Revelation 21:14, 19); links New Jerusalem."}
  - {section: "Stones worn and stones built", says: "The cherub of Tyre wore the breastpiece's stones (LXX) and was corrupted by his beauty (Ezekiel 28:17); Babylon wears gems (Revelation 17:4); the Bride is built of them. Links Pride for the Satan question."}
  - {section: "So you may shine", says: "phoster in Philippians 2:15 and Revelation 21:11, Daniel 12:3, 2 Corinthians 3:18; 4:6, Zechariah 9:16: God makes His people reflect His glory now and at glorification."}
  - {section: "Annex: correlations that do not hold", says: "Stone-to-tribe and stone-to-apostle charts, the zodiac and months (Josephus), Victorinus's water-and-fire reading, birthstones: what Scripture states and what it leaves unstated."}
word_budget: 4400
word_budget_reason: "Author asked (2026-10-29) for the gemmological terms (transparency, lustre, refraction, dispersion, asterism, birefringence, pleochroism) in the text so site search finds them; the terms table and inline terms add about 45 words of reference vocabulary. Raised to 4200 the same day for the author-requested John 1:7-9 / John 5:35 witness-and-lamp paragraph in So you may shine (~90 words). Raised to 4400 on 2026-10-30 for the author-requested ephod and names plates (Names on the stones): two short paragraphs introducing them and two sentences in the annex's stone-to-tribe bullet (~180 words)."

stages:
  scoping:
    done: true
    notes: "Author's brief (2026-10-29): gemstones in Scripture, what they represent, characteristics, images of each stone, correlations (Ezekiel, Revelation), used to describe heavenly beings and objects; can anything be inferred from gem characteristics, e.g. how they respond to light."
  exegesis:
    historical_context:
      done: true
      notes: >-
        Ancient gem names are not modern mineralogy. Pliny NH 37.115: iaspis "viret et saepe tralucet"
        (green, often translucent) -- so John's jasper "clear as crystal" (Rev 21:11) is not modern opaque
        jasper (NIV CBSB calls it opaque; BKC/Walvoord: "in verse 11 the jasper is translucent").
        NH 37.120: sapphirus blue, gold gleams in spots, never translucent = lapis lazuli (NIV CBSB on Rev 4:3
        agrees). NH 37.136-137: the 'iris' crystal throws rainbow colours on a wall when struck by sun; the
        colours are not from the stone's substance. Josephus Ant. 3.7.5 (Whiston): stone order, birth order
        claim; 3.7.7: shoulder sardonyxes = sun and moon, twelve stones = months or zodiac; 3.8.9: right
        shoulder stone "shined out when God was present ... which splendor yet was not before natural to
        the stone"; breastplate shone before victory; ceased 200 years before he wrote. Tradition, not text.
        Translations disagree most on rows 1-2 of Ex 28 (odem: sardius/ruby/carnelian; nophek:
        emerald/turquoise; bareqet: carbuncle/emerald/beryl); row 3 agrees (from LXX). BSB, CSB, NLT
        footnote the identifications as uncertain.
    literary_context:
      done: true
      notes: >-
        Scenes: Eden (Gen 2:12 shoham; Ezek 28:13), Sinai (Ex 24:10 sappir pavement "like the very heaven
        for clearness"), the high priest (Ex 28:9-12 shoulder onyx "stones of remembrance"; 28:17-21, 29-30
        breastpiece names on his heart, Urim), the throne-chariot (Ezek 1:16, 22, 26-28; 10:1, 9), the man
        of Dan 10:6, the cherub of Tyre (Ezek 28:12-16 "stones of fire" 28:14), the promised city (Isa
        54:11-12, pinnacles lit. "suns" per CSB fn), the throne (Rev 4:3, 6), Babylon (Rev 17:4; 18:16
        gold, precious stone, pearls), the city (Rev 21:11, 18-21). Rev 4 builds on Ezek 1: crystal expanse
        (LXX krystallos) -> sea of glass like crystal; bow in cloud -> rainbow like emerald. Ezekiel's
        stacked reserve: kemar'eh / ke'eyn ("like the appearance", "like the gleam") -- 1:28 "appearance of
        the likeness of the glory of the LORD". ESV SB on Rev 4:3: imitating Ezekiel's reserve; jewels read
        together, not individually.
    content_word_studies:
      done: true
      notes: >-
        LXX Ezek 28:13 lists twelve stones = LXX Ex 28:17-20 in the same order, with silver and gold
        inserted after the sixth. MT Ezek 28:13 has nine = Ex 28 rows 1, 2, 4 (row 3 leshem/shevo/achlamah
        absent; those three occur only Ex 28:19; 39:12). Rev 21:19-20 vs LXX Ex 28: eight share the Greek
        name (iaspis, sappheiros, smaragdos, sardion, chrysolithos, beryllos/beryllion, topazion,
        amethystos); sardonyx is a ninth by family (onyx); chalcedon, chrysoprasos, hyakinthos are new.
        ESV masks this: sardion = "sardius" (Ex 28:17) but "carnelian" (Rev 21:20; 4:3); "agate" renders
        achates (Ex) and chalkedon (Rev 21:19). phoster G5458 (Rev 21:11 "radiance", LSB fn "Lit luminary"):
        NT only Phil 2:15 and Rev 21:11; LXX Gen 1:14, 16; DanOG 12:3. krystallizo G2929 hapax Rev 21:11.
        diauges "transparent" Rev 21:21 only. chashmal H2830 only Ezek 1:4, 27; 8:2 (LXX elektron).
        sappir H5601: Ex 24:10; 28:18; 39:11; Ezek 1:26; 10:1; 28:13; Isa 54:11; Job 28:6, 16; Lam 4:7;
        Song 5:14. tarshish H8658: Ex 28:20; 39:13; Ezek 1:16; 10:9; 28:13; Song 5:14; Dan 10:6.
        shoham H7718: 11x incl Gen 2:12, 1 Chr 29:2.
      terms:
        - {word: "סַפִּיר", language: hebrew, transliteration: "sappir", strongs_id: "H5601", gloss: "lapis lazuli (probable), trad. sapphire"}
        - {word: "תַּרְשִׁישׁ", language: hebrew, transliteration: "tarshish", strongs_id: "H8658", gloss: "a gold/yellow-green stone; beryl/chrysolite"}
        - {word: "שֹׁהַם", language: hebrew, transliteration: "shoham", strongs_id: "H7718", gloss: "onyx (probable)"}
        - {word: "חַשְׁמַל", language: hebrew, transliteration: "chashmal", strongs_id: "H2830", gloss: "gleaming substance; LXX electrum"}
        - {word: "עַיִן", language: hebrew, transliteration: "ayin", strongs_id: "H5869", gloss: "eye; gleam, sparkle (Ezek 1:16, 22, 27)"}
        - {word: "φωστήρ", language: greek, transliteration: "phōstēr", strongs_id: "G5458", gloss: "luminary, light-giver"}
        - {word: "ἴασπις", language: greek, transliteration: "iaspis", strongs_id: "G2393", gloss: "jasper (ancient: green, translucent)"}
        - {word: "κρυσταλλίζω", language: greek, transliteration: "krystallizō", strongs_id: "G2929", gloss: "be clear as crystal (hapax)"}
        - {word: "διαυγής", language: greek, transliteration: "diaugēs", strongs_id: "G1307", gloss: "transparent"}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: >-
        Cultural: the particular stones, their names, ancient value. Transcultural: what the texts select
        from them -- gleam, clarity, fire, rainbow (light) and permanence (foundations). No text assigns a
        meaning to an individual stone; ESV SB and Walvoord both read them together.
    theological_principle:
      done: true
      notes: >-
        God's glory is the light; created splendour shows it and holds none of its own (Rev 21:11, 23).
        Statement of faith (glorification: 2 Cor 3:18; Phil 3:21; Col 3:4) consistent; no conflict.
    application_draft:
      done: true
      notes: "Be Transformed: borrowed light (Rev 21:11, 23), humility (Ezek 28:17), good works that show God's glory (Matt 5:16). Close: Phil 2:15 echoes OG Dan 12:3 (phaino + phoster)."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Philippians 2:15", relation: "phoster: believers shine as lights"}
      - {ref: "Daniel 12:3", relation: "LXX OG phosteres: the wise shine"}
      - {ref: "2 Corinthians 3:18; 4:6", relation: "reflected glory, transformation"}
      - {ref: "Zechariah 9:16", relation: "God's people like jewels of a crown that shine"}
      - {ref: "1 Peter 2:4-5", relation: "living stones"}
      - {ref: "Genesis 9:13-16", relation: "the bow behind Ezek 1:28; Rev 4:3"}
    translations_compared: ["ESV", "NIV", "NASB", "LSB", "CSB", "NLT", "BSB", "LXX (Brenton)", "Tischendorf"]
    divergences_noted: "See content_word_studies: the ESV's English names hide the shared Greek between Ex 28 LXX and Rev 21."
