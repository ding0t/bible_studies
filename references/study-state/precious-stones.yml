review_2026-10-29:
  by: "review-bible-study (agent pass; author has not yet seen the findings)"
  checked:
    - "Phase 1: every ESV quotation re-queried from study-notes.db (Ezek 1:4-28; 10:1, 9; 28:12-17; Exod 24:10; 28:10-29; Isa 54:11-12; 60:19; Dan 10:6; 12:3; Zech 9:16; Gen 2:12; Matt 5:16; John 8:12; 2 Cor 3:18; 4:6; Phil 2:14-15; 3:21; Heb 4:14; 7:25; 1 Pet 2:5; 1 John 1:5; Rev 4:3-6; 17:4; 18:16; 21:10-23). All verbatim. NIV, NASB 2020 Exod 28:17-20 table verified; BSB/CSB/NLT footnotes on Exod 28:17 verified; LSB footnotes Ezek 1:22 'Or ice' and Rev 21:11 'Lit luminary' verified."
    - "Phase 2-3: Strong's ids for all tagged stone names confirmed by concordance; counts re-run (phoster NT 2 + DanOG 12:3 with phaino; krystallizo 1; diauges 1; chashmal 3; leshem/shevo/achlamah 2 each; Ezek 1:26-28 marʾeh 9, demut 4). LXX Exod 28:17-20 and Ezek 28:13 Greek lists verified (Brenton). ESV SB, NIV CBSB and BKC (EPUB on media volume) quotations verified verbatim. Josephus Ant. 3.168-169, 3.186, 3.215-218 (Whiston, via lexundria) verified; Victorinus ANF 7 on 4:3 verified; GIA articles verified (authors corrected)."
    - "Phase 5: NLT Life Application (uncited) on Rev 21:10-27 reads the city as symbolic -- complicates the study's literal-city aside mildly; study's exegesis (Walvoord, New Jerusalem link) answers it; no change. NIV CBSB on Rev 4:3 calls jasper opaque -- the text ('clear as crystal') and Pliny 37.115 ('saepe tralucet') support the study; no change."
  corrections_applied:
    - "Rev 21 'one word touches price' -> qualified: 'precious stone' itself is a price word (Ezek 28:13; Rev 21:19)."
    - "Exod 24:10 'colour of the night sky with stars' (unmarked inference) -> 'then a deep sky-blue flecked with gold', conditional on sappir = lapis."
    - "Asteria: Pliny's stone is whitish (37.131 'proxima candicantium'); study no longer equates it with the blue star sapphire; 'turned to the sun' for 'contraria soli'."
    - "Asterism mechanism: each needle set gives one bright line, three lines make six rays (Jin et al. 2025); was 'one arm' each."
    - "Josephus's first breastpiece stone is a sardonyx (Ant. 3.168), so his birth order puts Reuben on a sardonyx, not the carnelian; shoulder stone also 'sardonyx' per Josephus."
    - "LXX Ezek 28:13-14: the Greek has the king 'with the cherub', so the LXX-based sentence and Q4 now say 'king'."
    - "Pleochroism: 'emerald, beryl, amethyst more faintly' was unsourced (emerald is moderate-strong) -> 'in varying strength'; GIA articles credited to their authors."
    - "Smaller: table intro (rows 1, 2 and 4 differ), 'ancient jasper was often green', 'the plate's first three', Ezekiel/Pliny 'eye' marked as idiom vs picture, outline 'star stone'."
  open_for_author:
    - "Discussion questions: Q5 uses a non-facet label ('Looking closer.'); Q4's second half ('how far can a variant carry an argument') is a method question; several questions join two with 'and'."
    - "Pliny 37.137 says the iris crystal's colours are not its own but struck from the walls ('nec ut ipsae habeant') -- direct ancient support for the thesis, unused in the prose."
