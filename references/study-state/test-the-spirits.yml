primary_passage: "1 John 4:1-6; Deuteronomy 13:1-5; Matthew 7:15-23"
supporting_passages:
  - "Deuteronomy 18:20-22; Jeremiah 23:16-32; Ezekiel 13:1-23; Isaiah 8:20"
