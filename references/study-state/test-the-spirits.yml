  - "John 10:4-5, 27-29; Ephesians 4:11-15; 2 Timothy 2:24-26; Hebrews 13:7-9"
genre: [topical, epistle, gospel, law, prophets]

thesis: >-
  God guards His flock by giving it one fixed standard, the apostles' teaching about Jesus Christ
  come in the flesh; Scripture tells you to keep testing every teacher against it by three marks it
  repeats -- the Christ he preaches, the life he lives, and where he leads you -- because signs,
  success and Bible words can all be counterfeited, and the One who is in you is greater than the
  one who is in the world.
outline:
  - section: "Hook, In one sentence, Key Takeaways, Study outline"
    says: "Wolves are a pastoral reality the apostles expected; God gave a test and a Shepherd."
  - section: "Test, keep testing"
    says: "dokimazo is the assayer's word (1 Pet 1:7), present imperative; 1 Thess 5:21 test everything and hold fast; Bereans; Ephesus commended (Rev 2:2)."
  - section: "Where wolves come from"
    says: "From inside (Acts 20:30; 2 Pet 2:1 pareisago; Jude 4; 1 John 2:19); disguised (2 Cor 11:13-15); behind them spirits (1 Tim 4:1; 1 John 4:3; Ezek 13:3)."
  - section: "What does not prove a teacher"
    says: "Signs come true (Deut 13:1-3, nasah -- God is testing you); Matt 7:22; Matt 24:24; crowds (2 Pet 2:2; 1 John 4:5); borrowed words (Jer 23:30). Deut 18 is a necessary test, Deut 13 shows it is not sufficient."
  - section: "First mark: the Christ they preach"
    says: "1 John 4:2-3; 2:22-23; 2 John 7, 9; Cerinthus (Irenaeus) as likely background; another Jesus/spirit/gospel (2 Cor 11:4; Gal 1:8); deny the Master who bought them (2 Pet 2:1; Jude 4)."
  - section: "Second mark: the life they live"
    says: "Fruit (Matt 7:16-20); harpax = swindler; greed, sensuality, contempt for authority (2 Pet 2; Jude; Titus 1:11, 16; 1 Tim 6:5)."
  - section: "Third mark: where they lead you"
    says: "Away from God (Deut 13:5), after themselves (Acts 20:30), to peace without repentance (Jer 23:17; Ezek 13:10, 22), to what itching ears want (2 Tim 4:3), into new rules (1 Tim 4:3), into division (Rom 16:17; Jude 19)."
  - section: "What to do"
    says: "Abide in what you heard (1 John 2:24, 27; 2 Tim 3:14-17); no platform (2 John 10-11); avoid (Rom 16:17); elders refute (Titus 1:9-11); mercy for the wavering (Jude 22-23; 2 Tim 2:25). Distinguish wolves from brothers -- hurt-by-the-church."
  - section: "Kept by the Shepherd"
    says: "John 10:4-5, 27-29; 1 John 4:4; Eph 4:14; the end-time deception (Matt 24:24; 2 Thess 2:9-11) and Jude 24."
