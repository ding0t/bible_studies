    - "Jer 23:22 quotation omitted words without an ellipsis."
    - "Irenaeus 3.3.4 'through Polycarp' made precise: from those who heard Polycarp."
    - "Hurt by the Church described as answering a wolf by 'name him'; it says watch for and avoid him."
