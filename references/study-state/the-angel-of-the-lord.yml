    theological_principle: {done: true, notes: "God came near to the outcast and the guilty to save, and the One who came is most likely the Son. Consistent with the statement of faith. Statement of faith: one God in three co-eternal persons (check 'One God in Three'). The angel read as the Son is consistent; flag if the exegesis lands elsewhere."}
