open_questions:
  - "Which appearances are 'the angel of the LORD' and which only 'an angel' or 'a man' (Gen 18; 32:24; Josh 5:13)? Gen 18's three men and Jacob's wrestler are not called mal'akh YHWH in their own chapters (Hos 12:4 calls Jacob's opponent mal'akh): keep the categories apart and say which the argument uses."
  - "Does every 'angel of the LORD' denote the same figure? 2 Sam 24:16 and 2 Kgs 19:35 may be a created angel of judgment. Decide case by case from the text; do not claim all 51."
  - "Gen 48:15-16: 'the angel who has redeemed me' set in parallel with 'the God', with a singular verb 'bless' (yevarekh). Verify the singular."
  - "Exod 23:21 'he will not pardon your transgression': only God forgives (Mark 2:7). Check the Hebrew."
  - "Gal 4:14 'as an angel of God, as Christ Jesus': does Paul equate the two? Probably not (a comparison); check before using."
  - "Theophany vs Christophany: name the term once in plain words ('God appearing'), say which this study argues, and do not overclaim the burning bush's fire or the pillar as the Son's person."
