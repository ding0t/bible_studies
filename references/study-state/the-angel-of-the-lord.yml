genre: [topical, ot-narrative, prophets]

thesis: "The angel of the LORD speaks as God, swears by Himself, forgives sin and is not stopped when people fall before Him, yet Scripture sets Him beside the LORD who sends Him; the New Testament names the One who makes the unseen Father known, so the likeliest reading is that He is God the Son before Bethlehem, who found Hagar at a spring and called Moses from the bush, and who came in the flesh as Jesus to find you."
thesis_draft: "The angel of the LORD speaks as God, swears by Himself, takes worship and forgives, and Scripture still sets Him beside the LORD who sends Him; the New Testament names the One who makes the unseen Father known, so the most likely reading is that the angel is God the Son before Bethlehem, who came to Hagar at the spring and to Moses at the bush, and who later came in the flesh as Jesus to save you."
outline_draft:
  - {section: "Messenger: the word", says: "mal'akh H4397 and angelos G32 mean 'messenger', of men and of angels; the phrase mal'akh YHWH; 'the' and 'an' angel (Hebrew has no indefinite article: what the definite construct can and cannot carry)"}
  - {section: "He speaks as God", says: "Hagar (Gen 16:10, 13), Moriah (Gen 22:12, 16), Bethel (Gen 31:13), the bush (Exod 3:2-6), Bochim (Judg 2:1): first-person divine speech, and the hearers say they have seen God (Gen 16:13; Judg 6:22; 13:22)"}
  - {section: "He takes what only God takes", says: "Worship unforbidden (Josh 5:14-15; Num 22:31) against Rev 22:8-9; holy ground (Exod 3:5; Josh 5:15); 'My Name is in him' and he can pardon or not (Exod 23:21); the name pil'i, 'wonderful' (Judg 13:18; Isa 9:6)"}
  - {section: "He is distinguished from the LORD", says: "Sent by Him (Exod 23:20), commanded by Him (1 Chr 21:15, 27), interceding with Him (Zech 1:12-13), 'the LORD rebuke you' (Zech 3:2), 'the Messenger of the covenant' (Mal 3:1), the Angel of His Presence (Isa 63:9): one who is God and is not the Father"}
  - {section: "What the New Testament adds", says: "No one has seen God; the Son has made Him known (John 1:18); Abraham saw His day, 'before Abraham was, I am' (John 8:56-58); Isaiah saw His glory (John 12:41); the rock was Christ (1 Cor 10:4, 9); Jesus saved a people out of Egypt (Jude 5, with its variant)"}
  - {section: "The case against, and its answers", says: "An envoy speaks in his sender's first person; the bow alone is not decisive (Gen 33:3); Heb 1 sets the Son above the angels ('angel' names His sending, not His nature); NT 'an angel of the Lord' is a created angel (Luke 1:11, 19). Mark the confidence: likely, from the pattern, not stated in one verse"}
  - {section: "Why He came", says: "To the outcast (Hagar), the tested (Abraham), the fearful (Gideon), the barren (Manoah's wife), the guilty high priest (Zech 3:4): He came near before He came in the flesh, and He comes near to you"}
