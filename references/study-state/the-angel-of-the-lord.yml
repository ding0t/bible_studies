  cross_reference: {done: true, cross_refs: ["Acts 7:30-38 (Stephen: 'an angel' at the bush, 'the voice of the Lord')", "Heb 1:4-6, 13-14", "Rev 22:8-9", "Mark 2:7", "Exod 34:6-7", "Gen 19:24", "Mark 1:2", "Heb 7:25"], translations_compared: ["Isa 63:9: ESV/NIV/NASB/LSB/CSB follow MT 'angel of his presence'; NLT follows LXX 'he personally rescued them'", "Jude 5: BSB, ESV, LSB, CSB, NLT 'Jesus'; NASB, NIV, NKJV 'the Lord'", "John 1:18: BSB 'the one and only Son, who is Himself God' (CT monogenes theos); BYZ/TR 'only begotten Son'"], divergences_noted: "Jude 5: NA28/SBL Iesous; NE, WH, BYZ, TR 'the Lord' (BSB fn). 1 Cor 10:9: BSB Christ; WH, NE, Tischendorf 'the Lord'. Commentary: ESVSB Gen 16:7 gives both views (preincarnate Christ / commissioned representative); NIV BTSB Gen 16:7 'more likely ... God himself' (cites v. 13, Exod 3:2-4); ESVSB Exod 23:20-22 ties the Commander of Josh 5 to the angel (contributed); NIV BTSB Zech 3:1 'represents and speaks for God yet is distinct from God'. Jude 5 (Iesous / kyrios / theos) and 1 Cor 10:9 (Christon / kyrion): name the editions."}
  drafting: {done: true, file: "docs/content/jesus/the-angel-of-the-lord.md", notes: "2026-11-08 draft: true. 56 BSB quotations checked against berean-bsb (0 mismatches). Outline as approved, with two changes from the research: the case-against section answers Gen 22:16 (the angel uses ne'um YHWH once) and Judg 13:16 (offer it to the LORD); the angels of judgment (2 Sam 24; 1 Chr 21; 2 Kgs 19:35) are set aside as no evidence either way. Pronouns for the angel are capitalised in the study's own prose, since the study argues the identification, as the Balaam study does."}
