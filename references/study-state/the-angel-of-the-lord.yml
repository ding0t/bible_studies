  exegesis:
    historical_context: {done: true, notes: "2026-11-08. Envoy speech: 2 Kgs 18:28-29, the Rabshakeh marks his master's words with 'Hear the word of the great king ... This is what the king says'. The prophets' formula is the same (Hag 1:13 'the messenger of the LORD ... declares the LORD'). The angel uses the formula once (Gen 22:16 ne'um YHWH) and mostly speaks without it (Gen 16:10; 31:13; Judg 2:1; Zech 3:4). Earlier note: Envoy speech in the ancient Near East: a messenger speaks his master's words in the first person (cf. 2 Kgs 18:28-29). This is the main argument against, and needs a text, not a recollection."}
    literary_context: {done: true, notes: "2026-11-08. Narrator identifications (not only a character's): Gen 16:13 'the LORD who had spoken to her'; Exod 3:4 'the LORD saw ... God called out to him from within the bush'; Judg 6:14, 16 'the LORD turned to him' (MT; LXX Brenton 'the angel of the Lord'). Character identifications: Gen 31:13 'I am the God of Bethel' (cf. Gen 28:13); Judg 6:22; 13:22 'we have seen God'; Hos 12:3-5 calls Jacob's wrestler (Gen 32:24 'a man') both 'God' and 'the angel'. Distinctions: Exod 23:20; Zech 1:12-13 (intercedes with the LORD of Hosts); Zech 3:1-2 (the LORD says 'The LORD rebukes you'; cf. Gen 19:24); Mal 3:1 (the Lord = the Messenger of the covenant, after My messenger = John, Mark 1:2). Judgment angels (2 Sam 24:16; 1 Chr 21:15, 27; 2 Kgs 19:35) left open: 'God sent an angel' and the LORD commands him; the study does not count them as evidence either way."}
    content_word_studies:
      done: true
      notes: "2026-11-08 morphhb-wlc: mal'akh H4397 213x. mal'akh + YHWH 58x in 54 verses (Judg 19, Num 10, Gen 6, Zech 6, 1 Chr 5, 2 Kgs 3, Ps 3, and 1 each Exod, 1 Kgs, 2 Sam, Isa, Hag, Mal); two are men (Hag 1:13 Haggai; Mal 2:7 the priest), leaving 56 in 52 verses. Singular mal'akh (ha)Elohim of the figure: Gen 21:17; 31:11; Exod 14:19; Judg 6:20; 13:6, 9 (plus David likened to 'an angel of God', 1 Sam 29:9; 2 Sam 14:17, 20; 19:28 MT). Definiteness: uW Hebrew Grammar (state_construct): 'The absolute noun always determines whether a construct chain is definite'; so 'the angel of the LORD', but the same grammar makes Haggai 'the messenger of the LORD', so the article alone settles nothing. LXX/NT anarthrous angelos kyriou. Gen 48:16 ha-mal'akh ha-go'el (H1350) + singular yevarekh (Piel 3ms, H1288) after two lines naming 'the God'. Exod 23:21 lo yissa' (H5375) le-fish'akhem (H6588), the verb of Exod 34:7 'forgiving iniquity, transgression'; 'My Name is in him' be-qirbo. Judg 13:18 pil'i H6383; 13:19 u-mafli' H6381 participle ('one doing wonders'; BSB supplies 'the LORD'); Isa 9:6 pele H6382. Isa 63:9 Ketiv lo' 'not' / Qere lo 'to Him'; mal'akh panav; LXX (Brenton) 'not an envoy nor an angel, but He Himself saved them' (reading tsir); BSB/MSB footnote 'Or angel of His presence'; NLT follows LXX; 1QIsaa has lo' (16 extant words). Earlier list: mal'akh H4397; angelos G32; pil'i H6383 / pele H6382; panim 'presence' (Isa 63:9; Exod 33:14); sar tseva YHWH (Josh 5:14)."
      terms: []
