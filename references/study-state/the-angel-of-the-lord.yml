review_2026-11-08:
  reviewer: "review-bible-study skill (independent pass, separate agent from the drafting session); state file not trusted, everything re-derived"
  checked: "69 BSB quotations against berean-bsb (all match; four differ only in nested quote marks); mal'akh YHWH count (morphhb-wlc: 58 in 54 verses, per-book breakdown, 56/52 after Hag 1:13 and Mal 2:7, all confirmed; H4397 213x); singular mal'akh (ha)Elohim (Gen 21:17; 31:11; Exod 14:19; Judg 6:20; 13:6, 9 plus David similes 1 Sam 29:9; 2 Sam 14:17, 20; 19:28 MT, confirmed); Hebrew of Gen 48:16 (yevarekh Piel 3ms; ha-go'el), Exod 23:21 + 34:7 (nasa' + pesha' in both), Judg 13:18-19 (H6383; umafli' Hiphil ptc, MACULA subject YHWH), Isa 9:5 MT pele H6382, Mal 3:1, Isa 63:9 (Ketiv la, 1QIsaa lw' fully extant, Brenton LXX), Judg 6:14 and 6:16 LXX; uW grammar quotation verbatim; BSB/MSB footnotes on John 1:18, 1 Cor 10:9, Jude 5 (match the study); NA28 John 12:41; study_verse for Isa 63:9 and Judg 13:19 across ESV/NIV/CSB/NASB/LSB/NLT; NIV Cultural Backgrounds Study Bible on Gen 16:7, Exod 3:2, Judg 13:18 (commentary not cited by the study); review_gaps; cross_study_claims for Gen 16, Exod 3, 23, Judg 6, 13, Zech 3, Gen 48; validate (no warnings for this file); strongs_suggest; alignment_ranking."
  critical:
    - "Lines 330-333: 'The angel does this once, at Genesis 22:16' is false. Zech 3:6-7 'the angel of the LORD gave this charge ... This is what the LORD of Hosts says', and 3:9, 10 'declares the LORD of Hosts' twice; 2 Kgs 1:3-4 (message for Elijah, 'this is what the LORD says'); third-person LORD in Gen 16:11 and Judg 5:23. Zech 3:4, listed as unmarked speech, sits inside that same marked speech, and 3:9 puts 'I will remove the iniquity' under 'declares the LORD of Hosts', which also bears on 'The power to forgive'. Rewrite the envoy answer to rest on the narrators' naming."
    - "Lines 307-313: 'After Bethlehem the pattern stops ... once the Son had come in the flesh, He no longer appeared as the angel'. Two of the four examples are before Bethlehem (Matt 1:20; Luke 1:11), and Luke 1:11, 19 is Gabriel bearing the title before the conception. Retitle to the NT as a whole and drop or mark the timing inference."
  moderate:
    - "Line 101: 'The other 56 ... are the figure this study is about' contradicts lines 367-370 (judgment angels not counted) and includes Zech 12:8 (a simile), Ps 35:5-6, 2 Kgs 1, 1 Kgs 19:7, 2 Sam 24, 2 Kgs 19:35/Isa 37:36, 1 Chr 21."
    - "Judg 13:6 counted as 'He is called the angel of God' (lines 102, 425): kemar'eh mal'akh ha'elohim is a comparison, the same construction as the David similes the Annex sets apart."
    - "Exod 23:20's words are applied to John the Baptist in Matt 11:10; Mark 1:2; Luke 7:27 (LXX 'apostello ton angelon mou pro prosopou sou'); review_gaps flags Matt 11:10. The study uses Exod 23:20 for the Son without saying so."
    - "Exod 32:34; 33:2-3, 14-15 are in bible_references but never treated: 33:2-3 sets 'an angel' over against 'I will not go with you', and Moses refuses it (33:15). Answer it or drop the references."
    - "John 12:41: the Greek (NA28) is 'his glory'; the BSB supplies 'Jesus''. Say so and let 12:37, 42 fix the referent."
    - "Judg 6:16 LXX (Brenton): besides the angel as speaker (BSB fn 'also in verse 16'), 'I will be with you' becomes 'Kyrios estai meta sou'. The Greek turns divine first person into envoy speech; the Annex reports only 6:14."
    - "Isa 63:9 Annex: the NLT does not follow the Greek. It keeps the Qere 'he also suffered' and its own footnote reads 'Hebrew and the angel of his presence'. ESV/NIV/NASB/LSB/CSB follow the Qere (LSB and CSB footnote the Ketiv)."
    - "Commentary cross-check, NIV Cultural Backgrounds SB (Gen 16:7; Exod 3:2): complicates. Fully vested ANE envoys speak in the first person (Ugaritic messengers of Baal to Mot); 'When the messenger is speaking, it is the Lord speaking.' The narrator-identification answer survives (the envoy model does not explain Gen 16:13; Exod 3:4; Judg 6:14), but 'they mark the sender' should not be stated as a rule. No change to the conclusion."
    - "Thesis 'swears by Himself' rests on Gen 22:16, the one speech the study itself says carries ne'um YHWH, which the envoy reading explains most easily (cf. Heb 6:13)."
    - "Phase 6 Q5: the cultural-vs-transcultural line is not explicit; hermeneutics stages in this file are still done:false."
  minor:
    - "Line 187: 'so he is a strong likelihood' is garbled; lowercase 'he' for the Commander where the BSB itself capitalises (Josh 5:13-14); and 1 Chr 21:16 is used as evidence though line 369 says the judgment angels are not counted."
    - "Lines 202-203: 'that name is beqirbo' reads as if the name were beqirbo."
    - "Lines 192-194: Manoah's bow follows the angel's ascent (Judg 13:20), so 'none is told to get up' proves nothing there."
    - "Line 212: the participle has no expressed subject. MACULA and most translations take the LORD; KJV and WEB supply 'the angel'. Say 'most translations'."
    - "Line 210: WLC writes Ketiv/Qere pl'y; the study prints the lemma pil'i."
    - "Line 281: Gen 16:13b is 'obscure' (CSB footnote; LSB 'Lit seen here after the one who saw me'); 'seen God and lived' fits Jacob (Gen 32:30), not Hagar."
    - "Lines 283, 315-316, 394: 'Whenever God was seen, it was the Son' and similar sentences are flatter than the study's own 'likely' (line 376)."
    - "Line 173: Hosea does not say 'man'; Genesis and Hosea together do."
    - "Line 114: 'In three places the narrator says it' -- at least four on the study's own reading (Judg 6:16; 13:19)."
    - "Gen 48:16 subsection is under 'He is distinguished from the LORD' but argues identity."
    - "Line 270: 'distinguished from God' -- say 'from the LORD who sends Him' (statement of faith: three distinct persons)."
    - "Line 18: Gen 16:10 promises offspring, not children."
    - "Lines 74, 397: 'Joshua' is the high priest; the study also has Joshua son of Nun."
    - "Line 42: John 8:58 supports pre-existence, not the appearances."
    - "Word tags lines 213, 256 put the Hebrew inside the parentheses; beqirbo untagged (H7130). Ignore strongs_suggest's H3810 for lo (Lo-debar)."
    - "alignment_ranking: H7812 and H5375 have no recorded decision; propose word-renderings.toml entries."
    - "Heading '## References' vs the corpus convention '## References & Recommended Reading'."
  verified_true: "Hagar is the first person the angel of the LORD speaks to (Gen 16:7 is the phrase's first occurrence). No NT 'angel of the Lord' (Matt 1:20, 24; 2:13, 19; 28:2; Luke 1:11; 2:9; Acts 5:19; 8:26; 12:7, 23) speaks as God or receives a bow. Stephen quotations exact (Acts 7:30 MSB: the Majority text adds 'of the Lord'). John 1:18 / 1 Cor 10:9 / Jude 5 statements match the BSB footnotes. Statement of faith 'One God in Three': consistent."
