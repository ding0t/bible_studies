title: "Four Hundred and Eighty Years: From the Exodus to Solomon's Temple"
status: forked
target_path: docs/content/chronology/four-hundred-and-eighty-years.md
primary_passage: "1 Kings 6:1"
point: >
  1 Kings 6:1's 480 years from the Exodus to the temple holds once the judges are read as regional
  and overlapping and Ruth's five generations as telescoped -- the priestly line's ten generations
  and Ezra 7's compressed list both support that reading.
