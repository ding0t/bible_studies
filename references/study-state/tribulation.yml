review_2026-10-03:
  skill: review-bible-study (all eight phases, adversarial; no edits to the study)
  reviewer: "anthropic/claude-opus-5.5 (subagent; did not draft the study)"
  size: {readable_words_check23: 4481, budget: 4500, net_words_if_all_fixes_applied: "about 0 (adds ~+100 offset by named cuts ~-100)"}
  checked:
    - "Phase 1: every ESV quotation re-queried from study-notes.db (esv-study-bible) -- Dan 9:24-27; 12:1-12; 7:25; Jer 30:7; Zech 12:10; 13:8-9; Joel 2:11; Hab 3:2; Matt 24:5-30; Rom 11:25-26; 1 Thess 1:10; 5:9; 2 Thess 2:3-8; 2 Pet 3:9; Rev 1:3, 19; 3:10; 4:1; 6:1-17; 7:1-17; 8:1-2; 9:20-21; 11:2-3; 12:6-14; 13:5-8; 14:6; 15:1-3; 16:3-19; 19:11-16; 22:17. All verbatim except the phrase attributed to Rev 13:8."
    - "Phase 3: macula-greek-sblgnt concordance, full lists -- G1577 20 (19 in chs 1-3 + 22:16); G2347 5; G40 25 total, 13 plural 'saints' in 5:8-20:9; G3709 6, first 6:16; G2372 10, first 12:12; G3340 12 (8 in chs 2-3, 4 in 9:20-21; 16:9, 11, all negated). Rev 7:14 SBLGNT ἐκ τῆς θλίψεως τῆς μεγάλης (article twice) confirmed; 6:17 σταθῆναι / 7:9 ἑστῶτες both ἵστημι confirmed. עֵת צָרָה in Jer 30:7 and Dan 12:1 confirmed (ebible-heb)."
    - "Dan 12:1 Greek: ebible-grcbrent reads καιρὸς θλίψεως, θλίψις οἵα οὐ γέγονεν -- surface match with Matt 24:21 θλῖψις μεγάλη οἵα οὐ γέγονεν, but Brenton prints Theodotion's Daniel; the Old Greek is not in bible-text.db (lxx-lemmas has no Daniel). The 'OG' label in content_word_studies is wrong."
    - "Phase 4: all four SVGs and utils/build_tribulation_graphics.py (rendered with qlmanage). Counts in church_and_saints() match the concordance; 1,290/1,335 arithmetic correct."
    - "Phase 5: NKJV Cultural Backgrounds (uncited) -- confirms Rev 7:14 ~ Dan 12:1/Matt 24:21 and the 360-day reading of 12:6; complicates seal placement (Rev 6:1-8 note: such sufferings run through the present era, Matt 24:6, 8) and Dan 9:27 (Antiochus IV background). No contradiction of the thesis."
    - "Phase 6: review_gaps (Dan 11, 1 Cor 15 leads only); cross_study_claims for Dan 9, Rev 3, 7, 12, Matt 24; statement-of-faith End times consistent."
    - "npm run validate: only the expected ai_provider_models warning ('[]' parsed as an entry '[')."
  findings:
    critical:
      - "Line 28 'Revelation gives it twelve chapters' -- the study's own range, 6:1-19:21, is fourteen."
      - "seventieth-week.svg puts the multitude 'out of the great tribulation' (Rev 7:9-14) in year 3, while the prose (line 141) defines the great tribulation as the second half."
      - "Line 245 'Between the sixth and seventh of each series' -- false for the bowls; chs 12-14 come after the seventh trumpet and before the first bowl (the chart itself draws it there). Same claim in the judgments-unfolded alt text."
      - "Line 423 / church-and-saints.svg: metanoeo 'in the letters it is a call, eight times' -- 2:21 is narrative about Jezebel, and 2:21b (οὐ θέλει μετανοῆσαι) is already a refusal."
    moderate:
      - "Matt 24:21 follows Theodotion's Greek of Dan 12:1, not 'the Septuagint' unqualified; name the version and mark the OG difference."
      - "Seals in the first half: the sixth seal's cosmic signs (6:12-13) match Matt 24:29, which the master chart itself puts at the end; the inference needs this objection stated."
      - "Two witnesses 'either half' conflicts with the cascade: if 11:3 fills the second half, the seventh trumpet and all seven bowls fall after day 2,520. Master chart also places the witnesses card in the first half."
      - "Dashed/solid misclassified: 'A time of distress for Jacob' (Jer 30:7 dates nothing) should be dashed; beast's 42 months solid but holy city's 42 months dashed with the same basis; 'Woe 3' label on the seventh trumpet is inference."
      - "Dan 9:27's 'he' never identified (coming prince vs Messiah) though the whole framework depends on it; Antiochene background (Dan 11:31) unmentioned."
      - "Line 184 quotes 'those who dwell on the earth' for Rev 13:8, which reads 'all who dwell on earth'."
      - "'What the week shows about God': He is just / He is patient never reach the second person; 'So this is for you now.' is a signpost."
    minor:
      - "Missing 'tribulation' tag (used by 7 sibling studies); 'antichrist' is a one-off tag."
      - "'before any harm comes to the earth' (7:3) overstates; seals 1-6 have already harmed it."
      - "'Four times the judgments end with' -- two endings, four verbs."
      - "'a temple standing in Jerusalem' and 'Dispensational writers often assign...' stated without confidence mark or citation."
      - "'The backlog question this study was written to answer' leaks process; 'both deserve to be stated at strength', 'This cascade is the reading followed here' narrate."
      - "Discussion Q4 asks about evidence-weighting method."
      - "Chart 'The church before Christ's judgment seat' (2 Cor 5:10) appears nowhere in the prose."
      - "τηρήσω ἐκ (Rev 3:10) carries no Strong's tag (G5083)."
  note: "two-witnesses.md and trumpet.md (both draft: false) now embed week-in-days.svg and judgments-unfolded.svg, so chart fixes ripple to live pages."
  status: findings reported; nothing fixed
