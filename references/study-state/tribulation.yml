slug: "tribulation"
title: "The Tribulation: Daniel's Seventieth Week, Year by Year"
status: published
target_path: "docs/content/last-things/tribulation.md"

primary_passage: "Daniel 9:24-27; Revelation 6:1-19:21"
supporting_passages:
  - "Daniel 12:1-12"
  - "Jeremiah 30:7"
  - "Matthew 24:15-31"
  - "2 Thessalonians 2:3-8"
  - "Revelation 3:10"
  - "Revelation 7:1-17"
  - "Revelation 11:1-3"
  - "Revelation 12:6-17"
  - "Revelation 13:5-8"
  - "Zechariah 12:10; 13:8-9"
  - "Romans 11:25-26"
  - "1 Thessalonians 5:9"
genre: [apocalyptic, prophets, topical]

thesis: >-
  Daniel's seventieth week is seven years in which God keeps His word to Israel, judges a world
  that has refused His Son, and still saves a multitude no one can number; Revelation shows the
  whole week from the throne room, where on this site's reading the church already is.
outline:
  - section: "Seven years, counted from Daniel"
    says: "The week is the last of Daniel's seventy, decreed about Israel and Jerusalem; Jeremiah and Daniel name it, Jesus quotes Daniel 12:1 for it, and Revelation counts its halves three ways."
  - section: "What the week is for"
    says: "Three purposes, each from a text: Israel brought to repentance, the earth-dwellers judged, a multitude saved."
  - section: "Revelation's map of the week"
    says: "Rev 1:19 and 4:1 divide the book; the seventh seal opens into the trumpets and the seventh trumpet into the bowls, and the judgments escalate a fourth, a third, all."
  - section: "The first half"
    says: "Seals and trumpets: the Lamb opens every one, the 144,000 are sealed, and the unrepentant refuse twice."
  - section: "The midpoint"
    says: "The abomination, the dragon thrown down, the woman's flight and the beast's forty-two months all start here."
  - section: "The second half"
    says: "The bowls finish the wrath, Babylon falls, the kings gather, and the King comes."
  - section: "Who is where"
    says: "Church (the ekklesia count), Israel (sealed, sheltered, refined), tribulation saints (martyred, robed) and the earth-dwellers; contested points marked."
  - section: "What the week shows about God"
    says: "He is just, patient, faithful to Israel and saving to the last; so you may..."
word_budget: 4900
word_budget_reason: >-
  Covers Daniel's week and all of Revelation 6-19, with the event catalogue carried by four charts.
  Raised from 4,500 on 2026-10-03 when the review's fixes added the disclosures it required: who "he"
  is in Daniel 9:27, the sixth-seal objection, the witnesses under the cascade, the multitude seen
  ahead, the interludes corrected, and Theodotion named. A simplify-bible-study pass is the next
  step if the author wants it back under 4,500.

diagrams:
  generator: "utils/build_tribulation_graphics.py"
  files:
    - "docs/content/assets/img/tribulation/seventieth-week.svg"
    - "docs/content/assets/img/tribulation/judgments-unfolded.svg"
    - "docs/content/assets/img/tribulation/week-in-days.svg"
    - "docs/content/assets/img/tribulation/church-and-saints.svg"
  convention: >-
    Solid outline = the text dates the event; dashed = placed by its order in Revelation, an
    inference. The legend says so on every chart that uses it.

stages:
  scoping:
    done: true
    notes: "Backlog 5.9 is the brief: events in order, purpose, where the church is, where Israel is, whether there are saints in the tribulation."
  exegesis:
    historical_context:
      done: true
      notes: "Daniel 9 in Darius' first year, after Jeremiah's seventy years (Dan 9:1-2). Revelation to seven churches of Asia under pressure, John on Patmos (Rev 1:9). Sibling studies already cover both settings (immediately-after.md, trumpet.md)."
    literary_context:
      done: true
      notes: "Rev 1:19 three-part commission; 4:1 'after this' (meta tauta) opens the heaven vision. Seals 6:1-8:1; trumpets 8:2-11:19; interludes 7, 10:1-11:14, 12-14; bowls 15-16; Babylon 17-18; return 19."
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "θλῖψις", language: greek, transliteration: "thlipsis", strongs_id: "G2347", gloss: "tribulation, distress", notes: "5x in Revelation (macula-sblgnt): 1:9; 2:9, 10, 22; 7:14. Only 7:14 has the article twice: ἐκ τῆς θλίψεως τῆς μεγάλης, 'the great tribulation'."}
        - {word: "צָרָה", language: hebrew, transliteration: "tsarah", strongs_id: "H6869", gloss: "distress, trouble", notes: "עֵת צָרָה in both Jer 30:7 and Dan 12:1. Theodotion's Dan 12:1 (Brenton, ebible-grcbrent) reads θλίψις οἵα οὐ γέγονεν; Matt 24:21 θλῖψις μεγάλη οἵα οὐ γέγονεν -- Jesus' phrasing follows Daniel's Greek."}
        - {word: "ἐκκλησία", language: greek, transliteration: "ekklēsia", strongs_id: "G1577", gloss: "church, assembly", notes: "20x in Revelation: 19 in chs 1-3, then 22:16. None in 4:1-22:15."}
        - {word: "ἅγιοι", language: greek, transliteration: "hagioi", strongs_id: "G40", gloss: "saints, holy ones", notes: "Substantive 'saints' 13x, all in chs 5-20: 5:8; 8:3, 4; 11:18; 13:7, 10; 14:12; 16:6; 17:6; 18:20, 24; 19:8; 20:9. G40 total 25 in Rev."}
        - {word: "ὀργή", language: greek, transliteration: "orgē", strongs_id: "G3709", gloss: "wrath", notes: "6x in Rev, first at 6:16-17: 6:16, 17; 11:18; 14:10; 16:19; 19:15."}
        - {word: "θυμός", language: greek, transliteration: "thymos", strongs_id: "G2372", gloss: "fury", notes: "10x in Rev, first at 12:12 -- the devil's wrath -- then God's from 14:10 on."}
        - {word: "τηρέω ἐκ", language: greek, transliteration: "tēreō ek", strongs_id: "G5083", gloss: "keep from / out of", notes: "Rev 3:10 τηρήσω ἐκ τῆς ὥρας. NIV BTSB: either 'keep you from undergoing' or 'keep you through'; cf. John 17:15. Contested; marked so."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "The judgments are future; the promises and the call to repent and endure are for every reader (Rev 1:3; 22:7)."
    theological_principle:
      done: true
      notes: "God's wrath and mercy run together through the week: He judges the unrepentant, keeps His covenant with Israel, and saves to the end."
    application_draft:
      done: true
      notes: "Assurance (1 Thess 5:9); urgency of the gospel now (Rev 9:20-21; 16:9, 11 'did not repent'); worship of the Lamb who opens the seals."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Daniel 12:1 / Matthew 24:21", relation: "Jesus' 'great tribulation such as has not been' follows Theodotion's Greek of Daniel 12:1 (the Old Greek Daniel is not in bible-text.db)"}
      - {ref: "Jeremiah 30:7 / Daniel 12:1", relation: "same Hebrew phrase עֵת צָרָה, both followed by deliverance"}
      - {ref: "Daniel 9:27 / Matthew 24:15 / 2 Thessalonians 2:4", relation: "midpoint abomination"}
      - {ref: "Revelation 11:2-3; 12:6, 14; 13:5 / Daniel 7:25; 12:7", relation: "42 months = 1,260 days = time, times, half a time"}
    translations_compared: ["ESV", "Theodotion Daniel (Brenton)", "SBLGNT", "NASB", "LSB", "NIV", "NLT"]
    divergences_noted: ""
    sibling_check: "rapture.md (The tribulation, Kept from the hour), the-restrainer.md, two-witnesses.md (which half is undecided), trumpet.md (escalation fourth -> third), immediately-after.md (gap). No contradictions; this study keeps two-witnesses' 'either half' open."
  drafting:
    done: true
    file: "docs/content/last-things/tribulation.md"
