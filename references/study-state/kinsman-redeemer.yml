    - "Ruth 4:14's goel is the newborn (4:15; NIV BTSB); 4:13-17, the bridge to David, is skipped."
    - "Ruth 3:9 paraphrased 'near relative', losing Ruth's own word goel."
    - "Moabite question posed without either side (m. Yevamot 8:3 vs Neh 13:1-3, 23)."
    - "'at a cost to his own estate' is an unmarked inference for Boaz."
    - "Matt 22 and 1 Tim 5 paragraphs disown their own link."
    - "Pervasive hedging; theology unnamed ('analogy' x3, 11 denials; Lessons about Jesus mostly not about Jesus)."
    - "Sibling contradiction with bride-of-christ.md (one act vs two; Christ as kinsman flatly vs analogy). AUTHOR DECISION. Also bride-of-christ quotes 'your Redeemer the Holy One of Israel' as Isa 54:5; that wording is Isa 43:14 / 48:17."
  depth_plan: "Goel office (Lev 25:23, 47-55; Num 35; Jer 32:7); Gen 38 via Ruth 4:12 and the sandal; LXX ankhisteus/lytroo; the threshing floor 3:9-13; the gate with the 4:5 fork; the Moabite case both ways; the redeemer born 4:13-17 and the line to David and Matthew 1:5; typology anchors Isa 54:5, Isa 59:20 / Rom 11:26, Gal 4:4-5, Heb 2:11, 17, and where it stops. About 3,850 words."
  status: "Recommend re-drafting through develop-bible-study Phase 7 with this outline."

