review_2026-09-23:
  scope: "Structural, literary-context, theology, placement, and style review; compared with bride-of-christ.md."
  findings:
    - "The opening calls the Ruth material the one place Scripture shows the goel office end-to-end; this exclusivity claim remains unchecked."
    - "The draft conflates land redemption under Leviticus 25 with levirate duty under Deuteronomy 25; Boaz is not Mahlon's brother, and the legal relationship needs careful qualification."
    - "The draft now presents kinship, means, and willingness as narrative features rather than a Levitical formula, and marks the Christological connection as an analogy. The three occurrences of chesed in Ruth are now traced; the Moabite question remains open."
    - "The bride pattern repeats material already developed in bride-of-christ.md; the kinsman-redemption study should keep its center on Ruth's narrative and point across for the bridal connection."
  verification_limit: "MCP passage/review lookups and the source-catalog query stalled. A direct read-only morphology query confirmed chesed at Ruth 1:8, 2:20, and 3:10; scripture quotations and the remaining source-dependent claims were not independently verified."
  status: "Findings were applied to the draft on 2026-09-23; direct MCP/source verification remained unavailable."

followup_2026-09-23_crossrefs:
  findings:
    - "The highest-vote New Testament leads include Ruth 3:1 to 1 Timothy 5:8 and 5:14. The surrounding context confirms a thematic connection about family support and widow remarriage; it does not establish a reference to Ruth."
    - "Ruth 4:5 to Matthew 22:24 leads to Jesus' Sadducee exchange, where Deuteronomy's brother-and-widow rule frames a resurrection question. Added to clarify the distinct legal setting; Matthew does not discuss Boaz or Ruth."
    - "Ruth 4:18-22 links to Matthew 1 and Luke 3 genealogies. Added Luke 3 as a second New Testament witness to the Boaz-Obed-Jesse-David line; Matthew 1:5 explicitly names Ruth."
  source: "OpenBible.info cross-reference dataset (CC-BY), read from local bible-text.db; linked passages checked in WEB context."

