slug: "kinsman-redeemer"
title: "The Kinsman Redeemer: Boaz, Ruth, and the Right to Buy Back"
status: published
target_path: "docs/content/jesus/kinsman-redeemer.md"

primary_passage: "Ruth 4:1-22"
supporting_passages:
