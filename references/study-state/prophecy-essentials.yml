slug: "prophecy-essentials"
title: "Bible Prophecy Essentials"
status: published
target_path: "docs/content/last-things/prophecy-essentials.md"

primary_passage: "Luke 24:27"
supporting_passages:
  - "Micah 5:2"
  - "Matthew 2:1-6"
