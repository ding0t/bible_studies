  revision_2026-08-12c: >
    Author flagged "Note what this is. It is not a mystical flourish; it is an exegetical
    solution" as AI-register prose. Treated as a class rather than a one-off and swept the whole
    file; nine instances found and cut. The pattern behind all of them: announcing a point instead
    of making it, then propping it up against a straw alternative nobody had proposed. Cut —
    "Note what this is" plus "not a mystical flourish" (Jubilees section, now shows the mechanism:
    Jubilees has a problem in Genesis 2:17 and solves it); "that symmetry is the thing to notice"
    (now "The clause runs both directions. Peter's source does not."); "That matters for what the
    verse can bear" (deleted outright, nothing lost); "The clearest evidence that this was
    ordinary Jewish thinking rather than a scholar's speculation is that the Temple ran on it"
    (now opens "The Temple ran on it."); "None of this is a fringe reconstruction" (the apologia
    posture — now "Standard commentary says the same"); "This is not a resemblance a reader
    noticed afterwards" in the Prophecy takeaway (redundant, since the Type paragraph directly
    above already defines resemblance); "a position held against a known alternative, not an
    assumption nobody had examined"; and "Readiness in Scripture is never idleness" in the Do
    bullet, written only hours earlier — evidence that this register creeps back in on every
    drafting pass, not just the first.
    ONE OF THE NINE WAS NOT A STYLE PROBLEM. "Day three's two events, in order, are the third
    millennium's two events, in order" was FALSE. Genesis day three runs land (1:9-10) then seed
    (1:11-12); the third millennium runs the promise of seed and land together at Genesis 12:7 and
    only reaches dry ground at the Exodus, centuries later. The ordering does not match and the
    sentence claimed twice over that it did. Deleted — the paragraph's two lexical links
    (yabbashah, zera) stand without it. Worth noting for future passes: the sentence read as
    rhetorical flourish, which is how it survived the full adversarial review; chasing the
    flourish is what exposed the error underneath it.
    Retained deliberately: roughly a dozen "not X" constructions that correct a real alternative
    a reader would otherwise hold (mo'adim is not weather; a sign between two named parties is not
    a general ordinance; Hosea's subject is Israel, not directly the Messiah; day one is a
    cardinal, not an ordinal). The tell is the straw alternative, not the negation.
    All 28 block-quoted verses and every patristic, rabbinic and Jubilees fragment re-verified
    verbatim after the rewrites. npm run validate clean; mkdocs build --strict passes.
  revision_2026-08-12d: >
    Author-requested caution box added at the head of the study, immediately after the hook and
    above Key Takeaways: a mkdocs-material "!!! warning" admonition titled "Extra-biblical
    sources: useful, and not Scripture". Three short paragraphs. (a) Names what the study actually
    quotes — Jubilees, 1 and 2 Enoch, the Babylonian Talmud, and the fathers from Barnabas to
    Lactantius — and states that none of it is Scripture, with 2 Timothy 3:16 quoted for the
    canon-only claim, extended explicitly to the apocryphal/pseudepigraphal books, the rabbinic
    material and the fathers "however early or however many of them agree". (b) States what the
    sources DO establish: what people believed and when. Jubilees reading Genesis 2:17 through a
    thousand-year day two centuries before Peter is a fact about second-century-BC Judaism and
    bears on how a first-century reader heard 2 Peter 3:8; it is not evidence the reading is true.
    That distinction is the one the whole study depends on, so it belongs at the top rather than
    only in the References. (c) The governing rule: treat them as human commentary — useful,
    capable of being wrong, answerable to Scripture and not the reverse; where they agree they
    corroborate, where they conflict the text governs and they are mistaken.
    Wording note: the natural phrasings here ("worth knowing", "worth consulting") would trip
    validate Check 10, so they were avoided in drafting rather than fixed afterwards.
    Precedent for the form: docs/content/god/dreams-and-visions/personal-examples/*.md already
    carry a "!!! note 'Personal experience, not Scripture'" box for the same purpose.
    Verified: 2 Timothy 3:16 verbatim against esv-study-bible and added to bible_references;
    admonition body indented four spaces throughout; built HTML confirmed to render as
    <div class="admonition warning"> with the title and three paragraphs intact. Also reflowed the
    Do bullet, left ragged by the previous revision. npm run validate clean; mkdocs build
    --strict passes.
  revision_2026-08-12e: >
    Author's objection: the "Where Peter got it" section conceded Psalm 90:4 to a
    timelessness-only reading, which sits badly under a study premised on the day-to-millennium
    mapping; and the psalms material deserved fuller exposition. Reviewed objectively rather than
    rewritten to taste, and the objection is half right in a way that makes the section stronger
    when fixed properly.
    WHAT THE SOURCES ACTUALLY SUPPORT. Commentary does read Psalm 90:4 as a statement of scale:
    the NIV Biblical Theology SB takes it as highlighting "the difference between the Lord's and
    humankind's existence in time." That is not suppressible and the section now states it
    outright, with attribution. The psalm's own second comparison ("a watch in the night", roughly
    a third of a night) is smaller than its first, so the verse cannot be a conversion table on
    its own terms. Both facts kept.
    WHAT THE OLD VERSION CONCEDED WITHOUT NEEDING TO. Three checkable points were missing, all
    verified here: (1) A thousand is not an arbitrary large number — it is the ceiling of a human
    life in Hebrew reckoning, and the man the psalm is titled to is the one who recorded that
    nobody reached it (Genesis 5: Adam 930, Seth 912, Jared 962, Methuselah 969, all confirmed
    against esv-study-bible). Ecclesiastes 6:6 uses the figure the same way. Psalm 90:10 names the
    other end of the scale at seventy or eighty. (2) Moses picks a *day* when Scripture has other
    idioms available for the same point — Isaiah 40:17's "as nothing… less than nothing and
    emptiness" — and the unit he picks is the one the creation week is counted in. (3) Every later
    builder cited THIS verse: Sanhedrin 97a, Lactantius, Peter. The psalm supplies the units; the
    reception is the study's subject. Stating that where the verse is introduced, instead of sixty
    lines later, removes the hedge without overclaiming the psalm.
    NEW STRUCTURAL FINDING, and it is not this site's invention. Psalm 90 opens Book IV directly
    after Book III closes on Psalm 89's "How long, O LORD?" (89:46), "where is your steadfast love
    of old, which by your faithfulness you swore to David?" (89:49) and enemies who "mock the
    footsteps of your anointed" (89:51). The NIV Biblical Theology SB calls that placement
    "significant, especially in the light of the downbeat ending of Book III" and lists "an
    eternal hope grounded in an eternal God (90:1-2, 4)" among Book IV's themes. So the canonical
    sequence is mockery-at-a-delayed-promise answered by the eternal God and the thousand-year
    day — which is 2 Peter 3:4 answered by 3:8, the same move. Peter is not only quoting the
    psalm, he is repeating its shape.
    NEW SECTION, "The psalm for the seventh day", on Psalm 92. The only psalm in the Psalter
    assigned to a day of the week (NIV Cultural Backgrounds SB); Hebrew title מִזְמוֹר שִׁיר
    לְיוֹם הַשַׁבָּת, carrying the same definite construction as Genesis 2:2-3's seventh day. Its
    content is the point: a psalm for the day of rest that is about the destruction of the wicked
    (92:7, 9), the permanence of the righteous (92:12, 14) and God exalted forever at its centre
    (92:8). The NIV Biblical Theology SB reads the title the same way — the Sabbath rest
    "signified a spiritual and final rest that was to come." This matters for the study's honesty:
    the Temple's seventh-day psalm (b. Rosh HaShanah 31a) and the rabbis' "a day that is entirely
    Shabbat" (b. Sanhedrin 97a) are not importing an eschatology into Psalm 92; the psalm supplies
    one. Previously this sat only inside a block-quoted baraita and was never expounded.
    All thirteen new quotations verified verbatim against esv-study-bible; Genesis 5 ages
    re-checked individually. bible_references extended with Psalm 89:49, Psalm 92:1-9,
    Ecclesiastes 6:6, Isaiah 40:17, Genesis 5:27. Study now ~9,900 words. npm run validate clean;
    mkdocs build --strict passes.
  revision_2026-08-12f: >
    Author pushed back that the NIV Biblical Theology SB's reading is a data point and not
    necessarily a good one — a modern Western frame the study should not defer to, when the aim is
    the precepts held in common by Scripture, Jewish thought and early Christian thought. Checked
    before reweighting, and two things came out of it.
    FIRST, I HAD OVER-READ THE COMMENTARY. Its actual words are that verse 4 marks "the difference
    between the Lord's and humankind's existence IN time" and that God "does not account for time
    in the same way that humans do." Neither is an atemporality claim; both are about reckoning.
    The previous revision glossed it as supporting a timelessness reading and then conceded to
    that gloss. The concession was to my own paraphrase, not to the source.
    SECOND, THE PSALM'S OWN VOCABULARY CUTS AGAINST ATEMPORALITY, and this is checkable rather
    than a matter of preference. Psalm 90:2's word for God's eternity is עוֹלָם, used twice —
    מֵעוֹלָם עַד־עוֹלָם. MACULA glosses the two occurrences "antiquity" and "perpetuity"
    (verified by direct query); TWOT root 1631a defines the lemma as "long duration" (verified via
    twot_strongs). That is a word for the extent of time, not the absence of it. And the psalm
    keeps addressing God inside time after v. 4: "Return, O LORD! How long?" (90:13) and "for as
    many days as you have afflicted us, and for as many years as we have seen evil" (90:15) —
    both verified against esv-study-bible. A timeless being cannot be asked how long.
    So the section now names the atemporality reading as a later category the psalm does not
    supply, quotes the commentary accurately as a claim about reckoning, and sets it as one
    witness among several rather than the default the older reading must defend itself against.
    The convergence is stated as the weightier evidence: the psalm's own vocabulary, the Judaism
    that carried it, and the church that inherited it all take the units at face value.
    Deliberately NOT asserted: any history-of-ideas claim about where the atemporality category
    came from (Greek philosophy, Boethius, and so on). That is a real argument but nothing in this
    repo sources it, and the narrower textual case — olam is a duration word, and the psalm asks
    God "how long?" — is provable from the text already in hand and does the same work.
    TWOT root 1631a added to the References alongside 2323. npm run validate clean; mkdocs build
    --strict passes.
  revision_2026-08-12g: >
    Mermaid diagram added to "Where Peter got it", showing the Book III / Book IV seam alongside
    2 Peter 3 and the week. Three aligned rows, two columns, no subgraphs.
    STRUCTURAL FACT IT RESTS ON, verified: the Psalter's five-book division is marked in the text
    by closing doxologies at Psalms 41:13, 72:19, 89:52 and 106:48, so the Book III / Book IV seam
    is not imposed. First draft claimed all four sign off "Amen and Amen" — FALSE, 106:48 reads
    "Amen! Praise the LORD!" — corrected to "a doxology ending in Amen" before it went anywhere.
    That was a Phase 4 synthetic-claim error committed while adding a diagram, hours after writing
    the phase that catches them.
    LAYOUT, arrived at over four renders, each inspected as an image rather than assumed: three
    row-subgraphs read as three coloured panels and were confusing; converting to two
    column-subgraphs failed outright because mermaid IGNORES `direction TB` inside a subgraph when
    edges cross between subgraphs, producing a sprawling horizontal layout. Removing subgraphs
    entirely and using three bare pairs (A-->B, C-->D, E-->F) under `flowchart LR` gives dagre's
    natural two-rank layout: aligned columns, one row per witness, and no background fills at all.
    COLOUR: deliberately none. No diagram anywhere in docs/content uses classDef, style or fill,
    and the site runs light/dark palette switching — Material themes mermaid to the active palette,
    so hard-coded fills would survive into dark mode and break it. The colours the author saw were
    Zed's editor preview, not site output.
    BOLD: `<b>` removed from every label. `<br/>` is proven on this site (prophecy-chart.md,
    published), but `<b>` appears nowhere and only renders when mermaid's htmlLabels is enabled;
    Material does not disable it, but nothing in this repo demonstrates it, and the failure mode is
    a literal "<b>" printed on a published page. Row identity is carried instead by each node's
    lead-in ("Psalm 89 · Book III closes").
    EDGE LABELS: "same move" renamed. The lower two arrows read "the same pattern"; the top arrow
    reads "doxology, Ps 89:52" because it is a different KIND of link — an actual textual seam, not
    a resemblance. Chose "pattern" over the author's suggested "type" deliberately: the site's Key
    Takeaways format defines a type as an OT person/object/ritual patterning Christ or the gospel
    by resemblance, and only the third row is typological in that sense; labelling all three
    "type" would assert typology for the Psalter-to-2-Peter relation, which is a shared rhetorical
    and theological move rather than type and antitype. Flagged to the author rather than assumed.
    All ten quotations inside the diagram verified verbatim against esv-study-bible, including
    Psalm 93:1 "The LORD reigns". bible_references extended with Psalm 89:46-52 and Psalm 93:1.
    npm run validate clean; mkdocs build --strict passes.
