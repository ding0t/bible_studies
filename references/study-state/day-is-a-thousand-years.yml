  revision_2026-08-12b: >
    Attitude and Do rewritten alongside Think, at the author's direction, so the whole Be
    Transformed section turns on readiness. The underlying problem was repetition, not just
    emphasis: Attitude was making the anti-date-setting point a FOURTH time on the page (after
    the dedicated "Why nobody has got the date right" section, the old Think bullet, and the
    Prayer). Attitude now names the actual spiritual hazard of a long wait — that delay erodes
    expectation — anchored in Ezekiel 12:22-23, where Israel had a standing proverb about
    prophetic delay ("The days grow long, and every vision comes to nothing") that God answers by
    promising to abolish it ("The days are near"). That is the Old Testament counterpart to
    2 Peter 3:4's scoffers and to the wicked servant's "My master is delayed" (Matthew 24:48), and
    it is the objection a six-thousand-year framework invites more than any other. Do was reframed
    from a defensive Sabbath note ("not as law — Colossians 2:16 forbids…") to readiness as
    occupation: found at your post (Matthew 24:46; 2 Peter 3:14), with Sabbath-keeping as the
    weekly rehearsal. The Colossians 2:16 guardrail was not lost — it now sits in the "What is
    bound to Israel, and what isn't" section, where it belongs, so dropping it from the bullet
    removed another duplication. All six new quotations verified verbatim against
