  - {type: other, title: "2 Enoch 32:4-33:1", author: "scrollmapper deuterocanonical corpus", note: "'the first seven revolve in the form of the seventh thousand... at the beginning of the eighth thousand there should be a time of not-counting, endless.'"}
  - {type: other, title: "Babylonian Talmud, Sanhedrin 97a-b; Avodah Zarah 9a; Rosh Hashanah 31a; Tamid 33b (Mishnah Tamid 7:4)", author: "William Davidson Edition, Koren/Sefaria, CC-BY-NC", note: "Downloaded from the public Sefaria GCS export (storage.googleapis.com/sefaria-export). Sanhedrin 97a:12-14 = Rav Ketina, the shemittah baraita deriving the ratio from Ps 90:4 via Ps 92:1, and the school of Eliyahu's 2000/2000/2000. Rosh Hashanah 31a:2-6 = the Temple's daily psalm cycle mapped to the creation days, seventh = 'the future world will be a day that is all Shabbat', with R. Nehemiah's dissent recorded. Sanhedrin 97b:9 = the curse on those who calculate the end. Daf numbers recomputed from the export's index offset (text[2] = 2a), not assumed."}
  - {type: other, title: "Epistle of Barnabas 15", author: "ANF vol. 1 (Roberts & Donaldson), public domain", note: "/Volumes/media/bible/reference/patristics/ante-nicene-fathers/anf01.txt line ~13040. Quotes Gen 2:2 + 'a day is with Him a thousand years'; 'in six days, that is, in six thousand years, all things will be finished'; then the eighth day as 'a beginning of another world.' ANF footnote 1657 flags that Barnabas follows the Hebrew 'seventh' against the LXX's 'sixth'."}
  - {type: other, title: "Justin Martyr, Dialogue with Trypho 81", author: "ANF vol. 1", note: "anf01.txt ~21854. Isaiah 65 + Adam not completing a thousand years + 'the day of the Lord is as a thousand years' + John's thousand years in Jerusalem, in one argument."}
  - {type: other, title: "Irenaeus, Against Heresies 5.28.2-3 and 5.23.2", author: "ANF vol. 1", note: "anf01.txt ~53494 and ~52938. 5.28.3: 'For in as many days as this world was made, in so many thousand years shall it be concluded... they will come to an end at the sixth thousand year.' 5.28.2 reads 666 as summing up 'the whole of that apostasy which has taken place during six thousand years.' 5.23.2 records the Adam-died-within-the-thousand-years view as held by 'some'."}
  - {type: other, title: "Hippolytus, Commentary on Daniel (fragment on Dan 2), 4-6", author: "ANF vol. 5", note: "anf05.txt ~18011. Nativity at AM 5500, 6000 total, Rev 17:10's 'five are fallen, one is' as the sixth millennium, and the ark-measurement derivation (2.5+1.5+1.5 = 5.5 cubits) — included in the draft as an example of the method's unreliability, not as support."}
  - {type: other, title: "Cyprian, Exhortation to Martyrdom, preface 2", author: "ANF vol. 5", note: "anf05.txt ~49444. 'Six thousand years are now nearly completed since the devil first attacked man' — cited in passing as common knowledge, which is the evidentiary value."}
  - {type: other, title: "Lactantius, Divine Institutes 7.14 (and Epitome 70)", author: "ANF vol. 7", note: "anf07.txt ~20507 and ~24680. The fullest patristic statement: six ages of a thousand years each, Ps 90:4 cited as 'the prophet', righteousness reigning a thousand years after."}
  - {type: other, title: "Methodius (attrib.), fragment against Origen on the resurrection", author: "ANF vol. 6", note: "anf06.txt ~36169. Reports the six-thousand-year scheme as what 'they say' — a hostile-to-neutral witness that the view was widespread, which is stronger evidence of its currency than another advocate would be."}
  - {type: other, title: "Theological Wordbook of the Old Testament", author: "Archer, Harris & Waltke, Moody", note: "Root 2323 for שָׁבַת, via the committed twot_strongs_map.json. Cited across to day-is-near.md rather than re-derived."}
  - {type: other, title: "docs/content/feasts/zadok-calendar.md, last-things/genealogy-times.md, last-things/prophecy-chart.md, last-things/day-is-near.md", author: "this site", note: "1 Enoch 91-93 Apocalypse of Weeks is treated in zadok-calendar.md and cross-linked, not restated. Larkin's chart is in prophecy-chart.md. Chronology variants and the 4004 BC convention are in genealogy-times.md."}

