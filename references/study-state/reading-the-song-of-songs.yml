genre: [] # one or more of: epistle, ot-narrative, acts, gospel, parable, law, prophets, psalm, wisdom, apocalyptic, topical

# Written before drafting (Phase 7). The thesis becomes the page's "In one sentence:" line; the
# outline is the mind map, and becomes the page's Study outline when the study needs one.
thesis: >-
  The Song celebrates the love of a betrothed man and woman and, in its one mention of God, calls that love's fire the flame of the LORD (8:6); married love is His gift, and Paul names what it was always pointing to, Christ and the church (Ephesians 5:32).
outline:
  - section: "Opening"
    says: "A book about love that barely mentions God, and why it is in the Bible."
  - section: "Key Takeaways"
    says: "Types (Paul names the picture; the Song does not prophesy), Lessons about Jesus, Memory verse (8:6-7), Be Transformed, Prayer."
  - section: "What the Song is"
    says: "Love poetry of a betrothed couple (ESV SB, CBSB)."
  - section: "How it has been read"
    says: "Akiva's holy of holies; Origen's ten books."
  - section: "The flame of the LORD"
    says: "8:6 shalhevetyah, the seal, and 8:7 'many waters cannot quench love'."
  - section: "Reading it toward Christ"
    says: "Ephesians 5:32 carries the identification the Song cannot carry alone; the foxes caution."
  - section: "Arise, come away"
    says: "2:10-13 and the fig tree of Matthew 24:32, kept as a resonance."

