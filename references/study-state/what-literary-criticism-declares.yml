open_questions:
  - "132 BC for the Sirach prologue converts 'the 38th year of Euergetes' (Ptolemy VIII); the conversion is standard but not verified against a source in this repo."
  - "Zechariah 9-14: some critics date it later than the 5th century; no source consulted gives a date, so the critical column uses the book's range. Any date before the Greek translation (by 132 BC) leaves the messianic lead intact."
  - "Stylometry may separate Isaiah 1-39 from 40-66 and the Pastorals from Paul's other letters, the critics' own arguments. Report whatever it shows; author to decide whether the study runs it."
  - "Critical-date column: source each entry (ESV SB states the critical view for the contested books); entries without a source stay blank rather than recalled."
