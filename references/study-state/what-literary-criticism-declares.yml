genre: [topical, epistle]

thesis: "By literary criticism's own count the Bible is the work of many writers across more than eight centuries, and the measurements show one connected story whose prophecies were written, and survive in copies, before the events they name; that is what Scripture says of itself (Hebrews 1:1-2; Isaiah 46:10)."
outline:
  - {section: "Part one: what Scripture says", says: "Hebrews 1:1-2 many parts/ways, one Speaker; 1 Peter 1:10-12 prophets searched their own words; Isaiah 41-48 prediction as God's test (nagad); Luke 24:27, 44"}
  - {section: "Part two: what literary criticism says", says: "the method, sourced from ESV SB intros; its count gives 44 writers, more than 38; span floor 856 years on critics' own stated dates"}
  - {section: "Part three: what the measurements say", says: "authorship table; one web (72,094 links, one component, writers within 2 steps); quotation reach; Genesis 1-3 / Revelation 20-22; stylometry detects writers but does not split Isaiah; deuterocanon control 4.5 vs 1.0 per 1000"}
  - {section: "Part four: prophecy, a test of its own", says: "three dates (traditional, latest critical, oldest witness); 13/13 messianic prophecies precede on critical dates, Greek by 132 BC, 3 in 1QIsa-a; history group honest about critical redating; Daniel 9:26 contested"}
  - {section: "Where this argument is weak", says: "chosen quotation, canon selection, redaction, fulfilment is the NT's claim, no odds"}
  - {section: "Part five: what literary criticism declares", says: "inspiration: one Author through many hands, about His Son; so you may read the Bible as one book and trust His word"}
word_budget: 6000
word_budget_reason: "Series precedent: What Languages Declare runs ~6,100 words and What World Population Declares ~7,200, because Part two carries data. Method detail goes to an Annex, which Check 23 still counts; revisit after drafting."

data_findings_2026_11_03:
  intros_available: "ESV Study Bible book introductions cover 60 of 66 books with Author/Date sections (Samuel, Kings and Chronicles are combined; Psalms, Song of Songs and Revelation are missing). The CSB Ancient Faith 'Circumstances of Writing' sections cover Psalms, Song and Revelation. The ESV SB intros also state the critical view where it differs (Genesis: final form 5th c. BC; Daniel: 2nd c. BC), which lets a dual-dating table be sourced from the study notes for the contested books."
  openbible_revelation_bug: "cross_references (work openbible-crossrefs) holds ZERO Revelation rows. The scrollmapper cross_references_*.db shards name the book 'Revelation'; book_map.SCROLLMAPPER_NAME_TO_OSIS only has 'Revelation of John', so build.py ingest_scrollmapper_crossrefs silently drops 15,726 from-rows and 24,508 to-rows (~40k of ~871k). Fix: add 'Revelation': 'Rev' to the map and rebuild; then re-run export_popups.py and check what-the-links-reveal.md's counts."
  connectivity_probe_pre_fix: "Book pairs linked by OpenBible cross-refs (66 books, 2,145 pairs, Revelation absent): any votes 1,972 (92%); votes>=10 1,376 (64%); votes>=50 565 (26%). Re-run after the fix."
  deuterocanon_control_caution: "quotation-greek has 0 links into the deuterocanon, but link_lab.py excludes DEUTERO books from the LXX side by construction (lines 343, 388, 448, 752). The zero is the method's, not the text's. A control needs the method re-run with deuterocanon included."

