slug: "one-taken-one-left"
title: "One Taken, One Left"
status: review
target_path: "docs/content/last-things/one-taken-one-left.md"
primary_passage: "Matthew 24:37-41; Luke 17:26-37"
supporting_passages: ["Genesis 7:1", "Genesis 7:23", "Matthew 13:30-49", "Matthew 25:31-46", "John 14:3", "1 Thessalonians 4:17"]
genre: [gospel]
forked_from: "docs/content/last-things/olivet-discourse.md"
point: "Taken = removed in judgment, left = preserved, by the Noah illustration and Luke 17:37; the pretribulational case rests on other texts."

thesis: >
  In Matthew 24:40-41 the one taken is removed in judgment and the one left is preserved, as Noah
  was left when the flood took the rest; this shows that God judges with perfect discernment at His
  Son's return and keeps a people for His kingdom, and the church's hope of being caught up to Jesus
  rests on other texts.
outline:
  - section: "The saying in its two settings"
    says: "Matthew places it after the post-tribulation coming (24:29-31), between the flood and 'stay awake'; Luke on the road to Jerusalem with Noah and Lot; Luke 17:36 is a late addition."
  - section: "The verbs, and what decides their meaning"
    says: "paralambano/aphiemi carry no verdict; Louw-Nida separates John 14:3's welcoming sense (34.53) from Matt 24:40-41's carrying-off sense (15.168)."
  - section: "Noah was the one left"
    says: "Gen 7:23 'only Noah was left' (sha'ar, root of she'ar 'remnant'); Matthew's weeds gathered first (13:30, 41, 49) and the sheep/goats show the same order."
  - section: "Luke's answer to 'where?'"
    says: "Corpse and vultures = battlefield judgment; episynago echoes 24:31; the shared millstone."
  - section: "The case for the other reading"
    says: "Contested: airo vs paralambano, Lot leaving first, 24:31 proximity (ESVSB Luke note, NIV BTSB); answered, with the shared main point stated."
  - section: "Where the rapture fits"
    says: "Dispensational placement: wicked taken at the end of the tribulation, righteous survivors enter the kingdom; the rapture rests on 1 Thess 4, John 14, 2 Thess 2."
word_budget: 4000
word_budget_reason: ""

