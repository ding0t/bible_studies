  applied: domain-data paragraph rewritten (15.168 is take-along, with Matthew's benevolent and hostile uses; no "leans toward" claim); arithmetic corrected to ten verses after 24:30; Matthew 24:28 proverb added with the NIV BTSB reading; eagles footnote (G105, Job 39:27-30); carrion-bird citations reworded to "birds of the air/every sort" with only verified quotations; the three arguments for the other reading now answered in turn (verb, Luke's righteous using Noah left/preserved/brought through and Lot brought out, the gathering at 24:31 with the neutral episynago, 8 uses); NLT LASB recorded as reading Luke the other way; Matt 13:30 wheat gathered into the barn; John 14:3 marked as the dispensational reading; Strong's tags G1209, G4327, G4355, G2641, H7605; link to taken-before-judgment.md#what-scripture-calls-noah; status set to published.
