open_questions:
  - >
    Sibling tension (not edited, for the author): rapture.md files Matthew 24:36-44 under "The
    imminence of the rapture" (no signs, readiness), while this study and olivet-discourse.md place
    24:40-41 at the post-tribulation coming of 24:29-31. rapture.md's own sub-section already
    concedes 24:40-41 is not rapture evidence, but its heading still applies the surrounding
    paragraph to the rapture. Decide whether 24:36-44 addresses the church's waiting by
    application or by direct reference, and make the two studies say the same.
  - >
    Luke's Lot illustration (17:28-29) removes the righteous before the fire, and rapture.md uses
    Lot as a type of the rapture. This study answers the objection from Lot's wife (17:32) and the
    "where?" of 17:37; the author may judge that answer thinner than the rest of the case.
  - "Louw-Nida codes (15.168, 34.53) are carried from the parent's verification, not re-queried here."
