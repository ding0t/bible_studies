slug: "immediately-after"
title: "Immediately After: Daniel's Seventieth Week and the Olivet Discourse"
status: published
target_path: "docs/content/last-things/immediately-after.md"
primary_passage: "Matthew 24:29-31; Daniel 9:24-27"
forked_from: "docs/content/last-things/olivet-discourse.md"
genre: "Gospel discourse (apocalyptic, Matthew 24) read against OT apocalyptic prophecy (Daniel 9)"
point: "Matthew 24:29's 'immediately' rules out a gap after the distress; Daniel 9:24-27's own sequence puts the long interval between 24:14 and 24:15."
thesis: >
  God has fixed Israel's calendar in seventy sevens; sixty-nine ran to the cross, the church age runs
  in the gap Daniel's own sequence leaves before the seventieth, and Matthew 24:29's "immediately"
  joins the return of Jesus to the end of that last week's distress, so the God who kept sixty-nine
  weeks to the letter will keep the seventieth and send His Son at once.
outline:
  - "Hook: Daniel counting Jeremiah's seventy years (9:2, 19); the disciples' 'when' on Olivet (Matt 24:3); Matt 24:29-30 quoted; In one sentence."
  - "Key Takeaways: prophecy of 9:24-27 (two parts fulfilled, one future); Jesus as the anointed one, reader of the gap, and the one who comes at once; memory verses Dan 9:24, Matt 24:30; Be Transformed; prayer."
  - "Two passages in their setting: Daniel 9's date, prayer and Gabriel's six purposes (kapper, 'to atone'); Matthew 24's question and the verse-15 turn."
  - "Where the gap cannot sit: eutheos (13x in Matthew, e.g. 4:20, 26:74), Mark 13:24, AD 70's limited place; the two readings named by NIV BTSB, this study taking the second."
  - "Two mountain peaks: Luke 4 / Isaiah 61; Larkin as historical witness; discourse diagram; the gap placed before verse 15."
  - "Where the gap does sit: Daniel's three events in order; the contested 'he' of 9:27 with all three ESV SB readings; Larkin's seventy-weeks chart."
  - "The church age, the ruler, and the times of the Gentiles: Romans 11:25-26; 2 Thess 2:3-4; Luke 21:24 with Daniel 2:44; full-sequence diagram; rapture's dashed arrow."
  - "What this shows about God: He keeps His calendar (9:26-27 'decreed'); He limits the distress for the elect (24:22, 31); He finishes what the cross began (9:24)."
  - "Discussion Questions (six facets: language, context x2, Christ/prophecy, hard part, transformed); References."
word_budget: 4000
stages:
  forked:
    done: true
    notes: >
      Forked verbatim on 2026-09-26 (simplify-bible-study, readability-sweep-2026-09) from
      docs/content/last-things/olivet-discourse.md at commit dda393c: ### Where this sits on the timeline + ## "Immediately After" + ## Where the Discourse Sits in God's Whole Programme. Word studies and
      quotations were verified there (see olivet-discourse.yml review blocks) and are not redrafted.
  scope:
    done: true
    notes: >
      Primary passage set to Matthew 24:29-31 with Daniel 9:24-27 (the fork had Matthew 24:15-31).
      The study's argument turns on 24:29's eutheos and on Daniel 9's sequence; 24:15-28 is cited,
      and treated fully in the parent.
  historical_context:
    done: true
    notes: >
      Daniel 9: first year of Darius (9:1), 539 BC per ESV SB note on 9:1-27; Daniel reading
      Jeremiah's seventy years (9:2), confession and plea (9:19). Matthew 24: Olivet, disciples'
      three-part question (24:3); ESV SB note on 24:15-31 for the verse-15 turn.
  literary_context:
    done: true
    notes: >
      Daniel 9:24-27 as Gabriel's answer to the prayer (9:20-27); six purposes in 9:24; three events in
      9:25-27 in order. Matthew 24:4-14 (the age), 15-28 (the distress), 29-31 (the coming); Mark
      13:24 parallel lacks eutheos but places the signs "in those days, after that tribulation".
  word_studies:
    done: true
    notes: >
      eutheos G2112: 13x in Matthew (SBLGNT), always immediate sequence (4:20, 26:74 cited).
      shavu'im H7620 "sevens" (9:24); kapper H3722 "to atone" (9:24); mashiach H4899 (9:26);
      'am nagid habba (9:26). Moved text's word work (eutheos gloss, Daniel quotations) verified in
      the parent.
  hermeneutics:
    done: true
    notes: >
      Consistent with statement-of-faith.md "End times": seven-year tribulation = Daniel 9:27's week,
      pretribulational rapture, literal return, millennium. No conflict found. The 9:27 "he" is
      marked contested with all three ESV SB readings stated.
  cross_reference:
    done: true
    notes: >
      cross_study_claims.py "Daniel 9" run: chronology-anchors.md and prophecy-essentials.md date the
      69 weeks from 444/445 BC to AD 32/33; Larkin's chart caption gives AD 30 for the cross. The
      draft now says Larkin's AD 30 is his own date and links chronology-anchors.md. No other
      contradiction found.
  draft:
    done: true
    notes: >
      2026-09-26: opening hook, thesis, Key Takeaways, Study outline, setting section, theology
      section, discussion questions and References added; moved text tightened and recased (He/His
      for Jesus), parent-context phrases ("this study already...", "the abomination left one piece")
      rewritten, antithesis constructions removed. ~3,500 body words (prose, excluding mermaid).
  validate:
    done: true
    notes: >
      npm run validate: only the three provenance warnings (fields deliberately omitted on a draft).
      Check 15 (block-quote share of opening) cleared by quoting 24:29-30 only. mkdocs build
      --strict clean. study_structure.py: every section "ok".
