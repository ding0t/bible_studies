open_questions:
  - >
    Larkin chart date: the moved caption dates "Daniel's 'Seventy Weeks'" to 1919, while the prose
    (following another page on this site) cites Dispensational Truth as 1918, expanded 1920. The
    caption was verified in the parent; the author may want to confirm which edition the scanned
    chart comes from.
  - >
    The ESV SB 9:27 note's first reading (the Messiah as covenant-maker) is stated with its case. The
    draft's reply rests on 9:27's covenant-maker being linked to the abominations; an author read of
    whether that is fairly put would help.
  - >
    Body is ~3,500 words, above the brief's 1,500-3,000 aim and inside the 4,000 budget. If trimming,
    the "Two ways to read it" subsection and the 1948/1967 paragraph are the likeliest candidates.
  - >
    When published, turn the plain-text pointer in olivet-discourse.md ("a separate study,
    *Immediately After* (in preparation)") into a link.
