stages:
  scoping: {done: true, notes: "2026-11-27: siblings by cross_study_claims.py for Isaiah 41, 43, 45, 46, 48, John 13, Luke 24, Acts 17, 18, 1 Peter 1, Deuteronomy 18, 2 Peter 1"}
  exegesis:
    historical_context:
      done: true
      notes: >-
        Isaiah 40-48 addresses Judah's exiles in Babylon, among Babylon's gods (Bel and Nebo, 46:1).
        Traditional date: Isaiah son of Amoz, c. 740-681 BC (book-authorship.toml, ESV SB); critics: chapters
        40-55 c. 560-540 BC, Cyrus's own day. In its setting the trial's evidence is Cyrus: named 44:28;
        45:1; 'a bird of prey from the east' 46:11; fulfilled 539/538 BC (2 Chronicles 36:22-23; Ezra 1:1-4).
        ESV SB on 45:21: 'this' = Cyrus's conquest and the release (cf. 46:8-11). The argument for Christ
        survives the critics' date: Isaiah 53 stands centuries before the cross on any date, and the Great
        Isaiah Scroll is c. 125 BC.
    literary_context:
      done: true
      notes: >-
        Trial speeches: 41:21-29; 43:8-13; 44:6-8; 45:18-25; 46:8-11; 48:3-8. The first Servant Song (42:1-4)
        sits beside 'the former things have happened, and now I declare new things' (42:9); Matthew 12:17-18
        says Jesus fulfilled 42:1-4. 45:21's challenge leads straight into 45:22-23 (turn and be saved, every
        knee), which Paul applies to Jesus (Philippians 2:10-11): the passage itself joins the argument from
        prediction to the confession of Jesus. 48:6-7 'new things, hidden things' ~ Romans 16:25-26 (the
        mystery made known through the prophetic writings). Luke 24:44-48: fulfilled Scripture, then 'You are
        witnesses'; Acts 1:8 ends with Isaiah 49:6 LXX's ἕως ἐσχάτου τῆς γῆς word for word (Acts 13:47 quotes
        49:6). bible_trace finds no Isaiah 43:10 link for Acts 1:8: the shared word μάρτυρες is an echo, marked so.
    content_word_studies:
      done: true
      notes: "1QIsaa at 41:26 reads a lemma of the same root, צדק, where the MT has צַדִּיק (19 extant words); 45:21's scroll reading is זה for זאת (25 extant). Neither moves the sense."
      terms:
        - {word: "צַדִּיק", language: hebrew, transliteration: "tsaddiq", strongs_id: H6662, gloss: "right, righteous", notes: "Isaiah 41:26 'so that we may say: He was right' (no idol earns it); 45:21 'a righteous God' (אֵל צַדִּיק). LXX ἀληθῆ (41:26), δίκαιος (45:21). 28x in Isaiah."}
        - {word: "אֲנִי הוּא", language: hebrew, transliteration: "ani hu", gloss: "I am He", notes: "Isaiah 43:10, 13; 48:12; LXX ἐγώ εἰμι at 43:10, which John 13:19 takes up"}
        - {word: "παρατίθημι", language: greek, transliteration: "paratithemi", strongs_id: G3908, gloss: "set before", notes: "Acts 17:3 'proving' (BSB). 19x SBLGNT: food set before people (Luke 9:16; Mark 8:6), a parable put before them (Matthew 13:24, 31), commit (Luke 23:46). Gloss 'set before', never the prefix's 'beside'."}
        - {word: "διανοίγω", language: greek, transliteration: "dianoigo", strongs_id: G1272, gloss: "open", notes: "8x SBLGNT, 7 in Luke-Acts; Luke 24:31, 32, 45 (week 2 owns these) and Acts 17:3"}
        - {word: "ἐπιδείκνυμι", language: greek, transliteration: "epideiknymi", strongs_id: G1925, gloss: "show, demonstrate", notes: "Acts 18:28 'proving'; Matthew 16:1, the Pharisees ask Him 'to show them a sign', and are given the sign of Jonah (16:4)"}
        - {word: "βεβαιότερον", language: greek, transliteration: "bebaioteron", strongs_id: G949, gloss: "more sure", notes: "2 Peter 1:19. CONTESTED with textual reasons both ways: the comparative names no comparand, so 'surer than the voice we heard' (v. 18) or 'made surer by it'. ESV SB gives both. On either, the prophetic word is the lamp to heed."}
  hermeneutics:
    cultural_vs_transcultural: {done: true, notes: "Then: proof to exiles that the LORD alone is God, against Babylon's gods. Transcends: God proves Himself by foretelling and fulfilling (Deuteronomy 18:22; Isaiah 46:10); the test is applied to Jesus by Jesus (John 13:19) and the apostles (Acts 17:2-3; 18:28)."}
    theological_principle: {done: true, notes: "The God who alone foretells foretold the Christ, and Jesus fulfilled it and foretold as only the LORD does: so He is the Christ, and the 'I am He'. Taught explicitly: Luke 24:44; John 13:19; Acts 18:28; 2 Peter 1:19-21. Statement of faith: consistent (Scripture's authority, 2 Peter 1:20-21). Its 'Scripture judges my reasoning' is kept: the test is Scripture's own invitation (Isaiah 41:21; Deuteronomy 18:22; Acts 17:11)."}
    application_draft: {done: true, notes: "Think: Isaiah 46:10; Attitude: the Bereans, Acts 17:11; Do: read Isaiah 53:3-6 with one person and show where it came to pass, as a witness (Luke 24:48) and as Apollos did (Acts 18:28)"}
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Luke 16:31", relation: "Moses and the Prophets persuade where one risen from the dead will not: supports 'alone'"}
      - {ref: "Acts 17:31; 1 Corinthians 15:3-4", relation: "the resurrection is also proof, and was itself foretold ('according to the Scriptures'): it sits inside the argument"}
      - {ref: "Matthew 2:4-6", relation: "a text chosen before the event, by others: answers the selection objection in part; week 2 owns it"}
    translations_compared: ["BSB", "ESV", "NASB", "NIV", "CSB", "LSB", "NKJV"]
    divergences_noted: "2 Peter 1:19: 'confirmed beyond doubt' (BSB), 'more fully confirmed' (ESV), 'made more sure' (NASB), 'as more sure' (LSB), 'completely reliable' (NIV): the comparand question."
