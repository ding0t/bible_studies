thesis: >-
  More than a hundred prophecies, written centuries before Jesus was born, have come to pass in
  Him, and that alone proves He is the Christ: Apollos was "proving from the Scriptures that Jesus is
  the Christ" (Acts 18:28, BSB). Author's wording, 2026-11-27. Ledger: 102 of 118 fulfilled or in
  part (80 of them applied to Jesus by the New Testament itself); every dated one written before its
  event, at least 127 years ahead on any dating.
outline: # PROPOSED 2026-11-27, for the author before drafting
  - {section: "Key Takeaways, then Study outline", says: "Types & Prophecy; Lessons about Jesus; Memory verses (Isaiah 46:10, John 13:19); Be Transformed; Prayer"}
  - {section: "God's own argument", says: "Isaiah 40-48 in its setting: exiles among Babylon's gods; the trial speeches; Cyrus the evidence then (44:28; 45:1; Ezra 1:1-4); tsaddiq, the verdict 'He was right' (41:26) that the LORD alone earns (45:21); the law's test (Deuteronomy 18:22); the critics' date, and why the argument for Christ survives it"}
  - {section: "Former things, new things", says: "the Servant set beside 'before they spring forth I proclaim them' (42:1-9; Matthew 12:17-18); hidden things now made known (48:6-7; Romans 16:25-26): the argument reaches past Cyrus to the Christ"}
  - {section: "I am He", says: "Jesus foretells as the LORD foretold (John 13:19; 14:29; 8:28); ani hu / ego eimi (Isaiah 43:10; 48:12); in the same speech as 45:21, every knee bows (45:23), and Paul says to Jesus (Philippians 2:10-11); the LORD's words plate"}
  - {section: "Proving from the Scriptures", says: "how the apostles argued: Luke 24:44-48 (and 'you are witnesses'); Acts 17:2-3 opening and setting before; the Bereans (17:11); Apollos showing (18:28; the sign demanded, Matthew 16:1-4); Luke 16:31; 2 Peter 1:19-21 (contested comparative, both sides); the resurrection inside the prophecies (1 Corinthians 15:3-4; Acts 17:31)"}
  - {section: "The prophet's view and history's view", says: "1 Peter 1:10-12; the span chart and the dated sentence; link Where Jesus Stopped Reading"}
  - {section: "How unlikely by chance?", says: "the closing argument: no odds per prophecy; the rules; the reader-set floor; three assumptions named (independence; the Gospels' record; the texts were chosen after, answered in part by texts chosen before, Matthew 2:4-6, week 2); then 'this shows that God ___'"}
  - {section: "The studies, a week at a time", says: "series list; this is week 1"}
  - {section: "Discussion questions", says: "facets mirroring Key Takeaways"}
