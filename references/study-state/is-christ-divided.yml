genre: [epistle]

thesis: "Paul and Apollos were servants and only Christ was crucified for you, so take your name from Christ alone and count every faithful teacher as yours; and because God chose the despised and every believer is the Lord's own servant, never hold another church in contempt, while still testing every teacher by the gospel of first importance."
outline:
  - {section: "Hook", says: "Four slogans in one young church, and Paul's three questions."}
  - {section: "Key Takeaways", says: "Lessons about Jesus, memory verses, Be Transformed, prayer."}
  - {section: "Four names in Corinth", says: "Who founded, who watered, Chloe's report; 'I am of Paul' is a genitive of belonging; the 'of Christ' slogan is contested."}
  - {section: "Three questions", says: "Is Christ divided / crucified for you / baptized in Paul's name; schisma is a tear, katartizō is mending nets; the cross emptied by eloquence."}
  - {section: "What then is Apollos?", says: "'What', a function: diakonoi, hyperetai, oikonomoi; planting, watering, God gives growth; the teachers were one (1 Cor 3:8; 16:12) while their fans fought."}
  - {section: "All things are yours", says: "3:21-23 inverts the slogan: Paul belongs to you, you belong to Christ (same genitive). Today's denominations and teachers. Local church still matters (FAQ link)."}
  - {section: "Puffed up, one against another", says: "4:6-7, the root of factions is pride in what was received (humility link)."}
  - {section: "Do not despise", says: "exoutheneo: God chose the despised (1 Cor 1:28); Herod and the Pharisee; Rom 14:3-4, 10. loidoros (1 Cor 5:11; 6:10) vs Paul and Jesus reviled. Mark 9:38-40 and Num 11:29. Mocking another church."}
  - {section: "Where it stops", says: "Gal 1:8-9, Jude 3, 2 John 9-10, 1 Cor 15:3; Phil 1:15-18 the line is the gospel's content. Paul's own irony (1 Cor 4:8; Gal 5:12) as the hard part."}
  - {section: "What this shows about God", says: "One Lord, one body; Christ is undivided; the Father owns every servant."}
  - {section: "Discussion questions", says: "language, context, Christ, hard part, be transformed."}
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: "No existing study on 1 Cor 1:10-4:7 as primary. FAQ and saved-as-through-fire touch it."
  exegesis:
    historical_context:
      done: true
      notes: "Paul founded the church, 18 months (Acts 18:11). Apollos came after, from Ephesus with letters (Acts 18:27-28; 19:1). Cephas known to Corinth (1 Cor 9:5); whether Peter visited is not stated. Chloe's people reported (1 Cor 1:11); her location unknown (ESV SB). Letter from Ephesus (1 Cor 16:8), c. AD 53-55 per saved-as-through-fire. Paul and Apollos on good terms (1 Cor 16:12)."
    literary_context:
      done: true
      notes: "1:10-17 is the letter's body opening (STEP letter-structure). The unit runs to 4:21 (ESV SB). 1:18-2:16 the cross vs wisdom; 3:1-4 back to the slogans; 3:5-9 servants; 3:10-17 builders (sibling); 3:18-23 all are yours; 4:1-5 stewards; 4:6-7 the application 'I have applied these things to myself and Apollos'. The same schisma closes the body section on gifts (1 Cor 12:25)."
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "σχίσμα", language: greek, transliteration: "schisma", strongs_id: "G4978", gloss: "a tear, a split", notes: "8 NT: tear in a garment Matt 9:16, Mark 2:21; crowd divided John 7:43; 9:16; 10:19; 1 Cor 1:10; 11:18; 12:25."}
        - {word: "καταρτίζω", language: greek, transliteration: "katartizō", strongs_id: "G2675", gloss: "mend, restore, fit together", notes: "13 NT; mending nets Matt 4:21, Mark 1:19; restore Gal 6:1."}
        - {word: "μερίζω", language: greek, transliteration: "merizō", strongs_id: "G3307", gloss: "divide, apportion", notes: "14 NT. 1:13 perfect passive; ESV footnote allows statement 'Christ has been divided!'"}
        - {word: "Παύλου (genitive)", language: greek, transliteration: "Paulou", strongs_id: "G3972", gloss: "of Paul, belonging to Paul", notes: "ESV/NIV/BSB 'I follow'; NASB95/LSB/NKJV 'I am of'; CSB 'I belong to'. Same genitive in 3:23 'you are Christ's' and 2 Cor 10:7."}
        - {word: "διάκονος", language: greek, transliteration: "diakonos", strongs_id: "G1249", gloss: "servant", notes: "1 Cor 3:5"}
        - {word: "ὑπηρέτης", language: greek, transliteration: "hypēretēs", strongs_id: "G5257", gloss: "attendant, assistant", notes: "20 NT; Luke 4:20 the synagogue attendant. Do NOT use the 'under-rower' etymology."}
        - {word: "οἰκονόμος", language: greek, transliteration: "oikonomos", strongs_id: "G3623", gloss: "steward, household manager", notes: "1 Cor 4:1-2"}
        - {word: "φυσιόω", language: greek, transliteration: "physioō", strongs_id: "G5448", gloss: "puff up", notes: "7 NT, 6 in 1 Cor (4:6, 18, 19; 5:2; 8:1; 13:4) + Col 2:18. humility.md already states this."}
        - {word: "ἐξουθενέω", language: greek, transliteration: "exoutheneō", strongs_id: "G1848", gloss: "despise, treat as nothing", notes: "11 NT (SBLGNT): 1 Cor 1:28; 6:4; 16:11; 1 Thess 5:20; 2 Cor 10:10; Acts 4:11; Gal 4:14; Luke 18:9; 23:11; Rom 14:3, 10."}
        - {word: "λοίδορος", language: greek, transliteration: "loidoros", strongs_id: "G3060", gloss: "reviler, verbal abuser", notes: "2 NT, both 1 Cor (5:11; 6:10). Verb λοιδορέω G3058 4x incl. 1 Cor 4:12 and 1 Pet 2:23."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Then: house-church factions in one city around personalities and rhetoric. Now: the nearest equivalents are denominations, movements, celebrity teachers and online fan bases. The transfer is application, marked as such. Paul addresses factions inside one church; 1:2 widens the frame to 'all those who in every place call upon the name'."
    theological_principle:
      done: true
      notes: "The church is one because Christ is one (1 Cor 1:13; 12:12-13; Eph 4:4-6). Teachers are servants God gives to the whole church (3:21-22). Contempt for another believer despises one God has welcomed (Rom 14:3). The limit is the gospel itself (Gal 1:8-9; 1 Cor 15:3)."
    application_draft:
      done: true
      notes: "Speak of yourself as Christ's; thank God for teachers outside your stream; stop jokes about other churches; still test the gospel. Statement of faith 'lowest common denominator' line is consistent with the 'where it stops' section — no conflict."
