review_2026-11-28:
  checked: "Every quoted verse re-queried in full (ESV via study_verse, not substring); 1:12-13 Greek against NA28/SBLGNT/UGNT; all seven word counts re-run with occurrence lists; study-Bible notes cited in References; FAQ/humility/test-the-spirits/first-take-the-log-out/saved-as-through-fire links and anchors; review_gaps; alignment_ranking; strongs_suggest; cross_study_claims for 1 Cor 1, 3, 4; statement of faith."
  fixed: "'three and a half chapters' to 'nearly three' (4:6 is reached by ~2.8 chapters); Greek of 1:12 given as ἐγὼ μέν εἰμι Παύλου (NA28/SBLGNT) in body and Q1, 'ἐγὼ μέν ... ἐγὼ δέ'; 1:13 statement-reading footnote reattributed ESV->LSB (no ESV footnotes in study-notes.db); 'he' -> 'Paul' at 1 Cor 2:2; deleted 'Paul meant it.'; FAQ paraphrase corrected; Herod 'night of His trial' -> 'morning He was crucified' (Luke 22:66); '4:12 same chapter as question about Apollos' (3:5) corrected; bible_references + 1 Cor 4:14, Galatians 5:2-4, Romans 14:1-6."
  open_for_author: "1:13 'expects the answer no' vs no μή; 'each has the same answer: Jesus'; katartizō 'net with holes' picture; 3:16-17 omission; 1 Cor 4:8 mockery vs sibling through-a-glass-darkly; exoutheneō has no word-renderings entry; uncited bible_references (1 Cor 12:12-13, 16:14, Titus 3:2); commentary_index/section_index re-run at publish."

author_calls_2026-11-28:
  applied: "1) 1 Cor 3:16-17 added as its own subsection. 2) 4:8 investigated from 4:8-14 context and Greek; 'The hard part' rewritten; through-a-glass-darkly 'mocking' -> 'irony'. 3) gospel line now names Scripture's authority (15:3-4 'in accordance with the Scriptures'; 2 Tim 3:16), the Trinity (Matt 28:19, one ὄνομα) and the deity of Jesus (John 1:1). 4) no study notes for the fourth slogan: ESV SB sentence removed, 'each one of you says' (1:12) added as the text's own reason. 5) the three 'no X' foils kept (author: they make sense in context). 6) 'Reviled, we bless' now ends with a conclusion and a second-person charge. 7) bible_references pruned/added, luke + acts tags, word-renderings G1848 (status proposed)."

