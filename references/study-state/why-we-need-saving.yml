  skill: review-bible-study
  checked:
    - "Phase 1: every ESV quotation re-queried from study-notes.db esv-study-bible; all verbatim, references and labels correct."
    - "Phase 2/3: concordance re-run (macula-greek-sblgnt / macula-hebrew-wlc). Confirmed: G266 172 NT, 48 Romans, first at 3:9, 42 in Rom 5-8; G5302 16; G3800 4 (Luke 3:14, 1Cor 9:7, 2Cor 11:8, Rom 6:23); G1818 at 2Cor 11:3 and Rom 7:11; G3900 Eph 1:7, 2:1, 2:5; G3847 at Rom 5:14; H2398 'miss' Judg 20:16; H5753 Lam 3:9; H6586 2Kgs 8:20, 1Kgs 12:19; H2530 Gen 2:9 + 3:6; H914 Hiphil participle Isa 59:2; Exod 34:7 avon + pesha + chatta'ah (H2401). Genesis 3 has none of H2398/H2403/H5771/H5753/H6588; first H2403 Gen 4:7, H5771 Gen 4:13, H6588 Gen 31:36. TWOT 638, 1577, 1846 confirmed. CSB footnotes at Rom 3:9 ('Under sin's power or dominion'), 3:23 ('Or and lack the'), 5:12 ('Or have sinned') confirmed."
    - "Phase 5: ESV and NIV BTSB notes on Gen 3:6 and NLT Life Application on Gen 3:6 confirm the tov/nechmad reading and 'sin made to look good'; ESV and NIV BTSB on Rom 5:12 confirm the two readings; NLT LASB on Rom 5:12 is silent between them."
    - "Phase 6: review_gaps -- Psalm 14 (Rom 3:10-12 quotes it) covered via the 'from the Psalms' line and what-the-links-reveal link; Romans 4:7-8 quotes Psalm 32:1-2 (not mentioned, left as suggestion); 1 Cor 15:22 added to the representative case. No sibling contradicts the study (cross_study_claims Romans 3, Romans 5)."
  fixed:
    - "Synthetic claim: 'He comes back to it four more times in seven verses' and 'the paragraph's four \"one man\" statements' -- Rom 5:18 says 'one trespass', and 5:16, 5:17 add further 'one man' phrases, so 'four' was not a count of anything. Reworded to 'that one man and his one trespass through the next seven verses' / 'repeated \"one man\" and \"one trespass\"'."
    - "Citation: the personal-sin reading's Jewish background was attributed to the NIV Cultural Backgrounds note on Rom 5:12, which says only that Adam introduced sin and death. The 'descendants then sinned as he did' claim is in the article 'Adam in Jewish Tradition'; citation and References entry now name the article, and 'Jewish writers of the time commonly' became 'Jewish tradition normally' (the article's word, and it includes later rabbis)."
    - "Fairness of Rom 5:12: added to the personal side that the verse itself never says 'in Adam'; added 1 Cor 15:22 'in Adam all die' to the representative side."
    - "Romans 5:19 tense: 'one Man's obedience makes the many righteous' -> 'will make' (ESV 'will be made')."
    - "Romans 1:18 paraphrase ('against what destroys His creation and defies Him') replaced with the verse's own words."
    - "'None of the four Hebrew words below' -> 'None of the Hebrew words below' (five are listed; none occurs in Genesis 3)."
    - "'The Hebrew gives this tree the words God had used' -> 'the words used for the trees God gave' (Gen 2:9 is narration). 'Eve said so herself' -> 'Eve named it'."
    - "Style rule 5: 'he insists the command was never the problem' -> 'he says the command itself is good'; 'The problem was never God's strength or His hearing' -> 'The LORD could save, and He could hear'; heading 'My way instead of His' -> 'Our own way'. 'His command protected Himself' -> 'served Him'."
    - "Strong's numbers added: G264 (hemarton), G5449 (physei), G5485 (charis). bible_references gained Psalm 8:5, Romans 1:18, Romans 2:21-24, 1 Corinthians 15:22."
    - "Cuts to hold the budget: 1 Cor 9:7 clause in the opsonion bullet, 'The New Testament has the same range.', 'Paul's comparison needs it.' Budget words 3,305 -> 3,299 (validator measure)."
