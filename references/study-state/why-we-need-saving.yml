open_questions:
  - "Fork candidate: Romans 5:12 eph' ho and imputation in full (federal vs. realist vs. personal), with patristic reading (Augustine's in quo from the Latin). This study marks it contested and gives the textual case only."
  - "Fork candidate: teshuqah 'desire' in Genesis 4:7 and 3:16, the same word; christian-life/submission-in-context.md treats 3:16."
  - "Fork candidate: Adam's lost glory in Jewish tradition and Romans 3:23 (NKJV Cultural Backgrounds article 'Adam in Jewish Tradition'); this study states the Romans 1:23 / 8:30 link from the text only."
research_findings:
  - "Genesis 2:9 (nechmad H2530, tov H2896, 'good for food') and Genesis 3:6 (tov for food, nechmad to make wise): the forbidden tree described in the words of the given trees."
  - "exapatao G1818 in both 2 Corinthians 11:3 (serpent, Eve) and Romans 7:11 (sin, Paul); apate G539 in Hebrews 3:13."
  - "Isaiah 53:6: avon H5771 'iniquity of us all' laid on him; Isaiah 30:21 'This is the way, walk in it'."
  - "Genesis 3 uses none of H2398/H2403/H5771/H6588. First chatta't Genesis 4:7; first avon Genesis 4:13 ('punishment'); first pesha Genesis 31:36 (macula-hebrew-wlc)."
  - "H2398 chata' = 'miss': Judges 20:16 slingers 'would not miss' (yachati'), Proverbs 19:2 'misses his way'. TWOT 638."
  - "H5771 avon, TWOT 1577a, root avah H5753 'bend': Lamentations 3:9 'made crooked', Psalm 38:7 (Heb) 'bent down', Isaiah 21:3. Avon covers guilt and its punishment (Genesis 4:13 ESV 'punishment')."
  - "H6588 pesha, verb H6586: 2 Kings 8:20 Edom 'revolted'; 1 Kings 12:19 Israel 'in rebellion against the house of David'."
  - "Exodus 34:7 has avon, pesha, chatta'ah together (interlinear)."
  - "G266 hamartia: 172 in SBLGNT, 48 in Romans, first at Romans 3:9 (hyph' hamartian, 'under sin'), 42 of 48 in Romans 5-8. CSB footnote at 3:9: 'Under sin's power or dominion'."
  - "Romans 3:23: hemarton aorist, hysterountai present (G5302, 16x NT). CSB footnote 'Or and lack the'."
  - "Romans 5:12 eph' ho; 5:14 parabasis G3847 of Adam; 5:14 'not like the transgression of Adam' yet death reigned."
  - "G3800 opsonion: 4x NT (Luke 3:14 soldiers' wages; 1 Corinthians 9:7 'serves as a soldier at his own expense'; 2 Corinthians 11:8; Romans 6:23)."
  - "G3900 paraptoma in Ephesians: 1:7, 2:1, 2:5."
