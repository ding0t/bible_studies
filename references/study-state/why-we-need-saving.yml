thesis: "God is good and gave His commands for your good, but since Adam every one of us has turned to our own way, believing the lie that His good is evil; so sin separates you from God, enslaves you and earns you death, and God showed His love by sending His Son Jesus to die for you while you were still a sinner (Romans 5:8)."
thesis_note: "Author (2026-10-23) added: sin is against the good God intends for us; His law and way are for our good (Deuteronomy 10:13); we stray like sheep to our own way (Isaiah 53:6); 'my way is better' is the same straying; calling evil good is the deceit of sin. Became the new section The good God gave and the garden section's Genesis 2:9 / 3:6 tov-nechmad finding."
outline:
  - {section: "Hook: 'Where are you?'", says: "The first question God asks after the first sin (Genesis 3:9); the sinner hides and God comes looking."}
  - {section: "The good God gave", says: "Genesis 1:31; 2:9, 16-17; Deuteronomy 10:13; 6:24; 30:15-19; Isaiah 30:21; Psalm 119:68. God's commands come from His goodness and are for your life."}
  - {section: "What happened in the garden", says: "Genesis 2:17; 3:1-13 shows sin before it is named: doubt God's word, deny His warning, want His place, take; then shame, hiding and blame. The first word for sin arrives at Genesis 4:7, crouching at the door."}
  - {section: "Three words for one thing", says: "chata' misses the mark (Judges 20:16), avon bends what was straight and carries its guilt and penalty (Lamentations 3:9; Genesis 4:13), pesha rebels against a rightful king (2 Kings 8:20). Exodus 34:7, Psalm 32 and Psalm 51 use all three; Psalm 51:4 says whom sin is against. Greek: hamartia, paraptoma, parabasis, anomia (1 John 3:4)."}
  - {section: "None is righteous", says: "Romans 3:9-20: Jew and Gentile alike 'under sin', a power; the catena from the Psalms and Isaiah 59; every mouth stopped. 3:23: sinned (aorist) and are falling short (present) of God's glory, the glory Romans 1:23 says was exchanged."}
  - {section: "Through one man", says: "Romans 5:12-19 and Ephesians 2:3: sin entered through Adam and reached everyone. eph' ho contested (in Adam / personally), with textual reasons; 5:19 'made sinners' and 5:14 favour representation; statement of faith agrees."}
  - {section: "What sin costs", says: "Separation (Isaiah 59:2), death toward God (Ephesians 2:1), slavery (Romans 6:16-17), wages paid out as death (Romans 6:23, opsonion), wrath (Ephesians 2:3). Law shows sin and cannot remove it (Romans 3:20); Isaiah 59:16 'no man'."}
  - {section: "But God", says: "Isaiah 59:16, 20 (His own arm, a Redeemer); Genesis 3:15, 21; Ephesians 2:4-5; Romans 5:6-8. God's love meets sinners where they are: lands on Romans 5:8 and hands on to week two, Grace."}
  - {section: "Discussion questions / Be Transformed / Prayer / References", says: "facet-labelled questions; Think/Attitude/Do; prayer naming Jesus."}
