title: "When Love Grows Cold: The Falling Away and the Remnant"
status: published
target_path: "docs/content/christian-life/when-love-grows-cold.md"

primary_passage: "Matthew 24:9-13; 1 Kings 19:9-18; Romans 11:1-6"
supporting_passages:
  - "Matthew 26:31-35; 28:7-10, 16-17"
