genre: [gospel, ot-narrative, prophets, epistle, topical]

thesis: >-
  Jesus told His disciples beforehand that the love of the many would grow cold, and the same
  Scripture records a God who has always kept a remnant for Himself by grace and who goes after
  those who stumble, so you can grieve a friend's cooling faith without despair, keep yourself in
  His love, and go after them in hope.
outline:
  - section: "He told you beforehand (Matthew 24:9-13)"
    says: "Cooling is predicted, has a cause (lawlessness multiplied) and touches the many; Jesus' answer is endurance."
  - section: "I, even I only, am left (1 Kings 19)"
    says: "Elijah read his loneliness as the end of the faithful; God answered with seven thousand He Himself kept."
  - section: "A remnant through the Old Testament"
    says: "Isaiah and Malachi: God leaves a stump, a returning remnant, a book of remembrance; Paul's 'chosen by grace'. Israel's doctrine; God's character carries over."
  - section: "You will all fall away (Matthew 26-28)"
    says: "The same verb lands on the Eleven; the risen Jesus goes before them and calls them brothers; the smouldering wick."
  - section: "Two names on Paul's list"
    says: "Mark returned, Demas is left open; the Lord knows those who are His, so you are spared the sorting."
  - section: "What to do while the love of many cools"
    says: "Keep yourself, exhort daily, go after the one who wanders, gently; endure."
word_budget: 4000
word_budget_reason: ""

