genre: [epistle, topical]

thesis: "God fills His church with His Spirit so that it sings: the old psalms and new songs about Jesus carry the word of Christ into every member's memory, so that you teach one another with them and thank the Father with them."
outline:
  - {section: "Before daylight, a song to Christ", says: "Hook: Pliny (c. AD 112) found Christians singing to Christ as God; Paul had commanded it fifty years earlier."}
  - {section: "One command, five participles", says: "Eph 5:18-21 is one imperative (be filled, present passive) worked out in speaking, singing, making melody, giving thanks, submitting; the Spirit fills, the songs go to the Lord Jesus, thanks go to the Father."}
  - {section: "The word of Christ, sung", says: "Col 3:16 names the source as the word of Christ dwelling richly; the songs teach and admonish one another (horizontal) and go to the Lord (vertical). Same life described twice."}
  - {section: "Three words", says: "psalmos/hymnos/ode with Hebrew mizmor/tehillah/shir; LXX Ps 76 title carries all three; the terms overlap, each has a centre; 'spiritual' ties back to v.18."}
  - {section: "Only the Psalter? (contested)", says: "Case for psalms-only (LXX titles) and the case for psalms plus new songs (1 Cor 14:26, Eph 5:14, Rev 5:9 'new song', Luke's canticles, Tertullian Apol. 39); marked."}
  - {section: "Israel's songbook", says: "Exod 15 to Deut 32 (a song to outlive forgetting) to Deborah, Hannah, David's 288 trained singers, Hezekiah, the five books of Psalms, Ascents, Hallel."}
  - {section: "The church's first songs", says: "Luke's four canticles, the Hallel in the upper room, Acts 16:25 at midnight, hymn fragments in the letters, Revelation's new song; Rev 15:3 sings Exod 15 again with the Lamb."}
  - {section: "The God who sings", says: "Christ sings among His brothers (Heb 2:12), the LORD exults over His people with singing (Zeph 3:17): our singing joins His."}
  - {section: "What the church kept", says: "The Odes appended to the Psalter (Codex Alexandrinus); Eusebius 5.28.5 -- psalms and hymns by the brethren from the beginning; this is the precedent for the site's songbook."}
  - {section: "Sing it when", says: "Application: James 5:13, songs as memory, link to the songbook."}
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: "Primary Eph 5:18-21 read with its twin Col 3:16-17. Topical spread across OT/NT song history, kept in check by moving the catalogue into a separate songbook page so the study explains and the songbook lists."
  exegesis:
    historical_context:
      done: true
      notes: "Ephesians and Colossians are companion prison letters carried by Tychicus (Eph 6:21; Col 4:7). Ephesus: Dionysiac drinking-cult setting often cited for the wine/Spirit contrast -- NOT verified here, do not assert without a source. Oral culture: songs as the teaching medium (ESVSB note on Col 3:16 makes this point; use as background only)."
    literary_context:
      done: true
      notes: "Eph 5:15-21 one Greek sentence (ESVSB note on 5:21). Imperative πληροῦσθε (present passive, ongoing) then five participles: λαλοῦντες, ᾄδοντες, ψάλλοντες, εὐχαριστοῦντες, ὑποτασσόμενοι. Trinitarian structure in the text: Spirit (v18), Lord = Christ (v19, cf. v20 'our Lord Jesus Christ'), God the Father (v20). Eph 5:14 'Therefore it says' introduces lines not found verbatim in the OT -- likely a hymn or a summary of Isa 26:19 / 60:1 (contested; three study Bibles split). Col 3:16 parallel: the source is 'the word of Christ' dwelling richly rather than 'be filled with the Spirit' -- read together, Spirit-filling and the indwelt word of Christ produce the same singing."
    content_word_studies:
      done: true
      notes: "Counts verified (MACULA SBLGNT; morphhb-wlc; lxx-lemmas) 2026-10-25."
      terms:
        - {word: "ψαλμός", language: greek, transliteration: "psalmos", strongs_id: "G5568", gloss: "psalm, song sung to a plucked instrument", notes: "7x NT: Luke 20:42; 24:44; Acts 1:20; 13:33 (the book of Psalms); 1 Cor 14:26; Eph 5:19; Col 3:16. LXX Psalms 72x, nearly all in titles, rendering מִזְמוֹר."}
        - {word: "ὕμνος", language: greek, transliteration: "hymnos", strongs_id: "G5215", gloss: "song of praise to God", notes: "NT only Eph 5:19 and Col 3:16. Verb ὑμνέω G5214 4x: Matt 26:30; Mark 14:26; Acts 16:25; Heb 2:12. LXX Ps 13x; LXX Ps 71:20 (Eng 72:20) 'the hymns of David are ended' where Hebrew has 'prayers' (תְּפִלּוֹת). Titles 'ἐν ὕμνοις' render בִּנְגִינוֹת (with stringed instruments): LXX Ps 6, 54, 60, 66, 75."}
        - {word: "ᾠδή", language: greek, transliteration: "ōdē", strongs_id: "G5603", gloss: "song", notes: "7 tokens NT in 5 verses: Eph 5:19; Col 3:16; Rev 5:9; 14:3 (x2); 15:3 (x2: song of Moses, song of the Lamb). LXX Ps 44x, incl. every Song of Ascents title (LXX 119-133), rendering שִׁיר. Generic word -- 'spiritual' specifies it."}
        - {word: "πνευματικός", language: greek, transliteration: "pneumatikos", strongs_id: "G4152", gloss: "spiritual, of the Spirit", notes: "Agrees with ᾠδαῖς (nearest noun); may qualify all three. CSB footnote at Col 3:16: 'Or and songs prompted by the Spirit'. Ties back to πληροῦσθε ἐν πνεύματι v18."}
        - {word: "ψάλλω", language: greek, transliteration: "psallō", strongs_id: "G5567", gloss: "sing praise (orig. pluck strings)", notes: "5 tokens NT: Rom 15:9; 1 Cor 14:15 (x2); Eph 5:19; Jas 5:13. Instruments debate exists (a cappella traditions) -- mention only if needed; Paul's named instrument here is 'your heart'."}
        - {word: "ᾄδω", language: greek, transliteration: "adō", strongs_id: "G103", gloss: "sing", notes: "5x NT: Eph 5:19; Col 3:16; Rev 5:9; 14:3; 15:3."}
        - {word: "מִזְמוֹר", language: hebrew, transliteration: "mizmor", strongs_id: "H4210", gloss: "psalm (song with accompaniment)", notes: "57x WLC, every one in the Psalms, all in titles."}
        - {word: "שִׁיר", language: hebrew, transliteration: "shir", strongs_id: "H7892", gloss: "song", notes: "82x WLC (with shirah), Ps 38, spread across 16 books incl. Exod 15:1, Deut 31-32, Song 1:1."}
        - {word: "תְּהִלָּה", language: hebrew, transliteration: "tehillah", strongs_id: "H8416", gloss: "praise, song of praise", notes: "45x WLC; Psalm 145 the only psalm titled tehillah; plural Tehillim is the Hebrew name of the book."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Transcultural: Spirit-filled churches sing; the songs carry Christ's word; they are addressed both to one another and to the Lord; thanks to the Father in Jesus' name. Cultural/contested: which repertoire (psalms only vs new songs), instruments, spontaneous Spirit-prompted songs (1 Cor 14:15, 26)."
    theological_principle:
      done: true
      notes: "God fills His church with His Spirit and the result is song: Trinitarian (Spirit fills, sung to the Son, thanks to the Father), word-shaped (Col 3:16), mutual (to one another), and memorable (Deut 31:21 -- the song lives unforgotten). Christ Himself sings among His people (Heb 2:12)."
    application_draft:
      done: false
      notes: "Think: singing is a means of teaching, not a warm-up. Attitude: sing to the Lord with your heart, to the person beside you with your mouth. Do: learn one biblical song by heart (songbook)."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Colossians 3:16-17", relation: "twin passage"}
      - {ref: "Ephesians 5:14", relation: "likely hymn citation in near context (contested)"}
      - {ref: "1 Corinthians 14:15, 26", relation: "psalm brought to the gathering; sing with spirit and mind"}
      - {ref: "Exodus 15 / Revelation 15:3", relation: "first song and last: Moses' song sung with the Lamb's"}
      - {ref: "Deuteronomy 31:19-22", relation: "song as remembered witness"}
      - {ref: "Hebrews 2:12 (Psalm 22:22)", relation: "Christ sings in the congregation"}
    translations_compared: ["ESV", "NASB", "WEB", "NA28", "LSB footnotes", "CSB footnote"]
    divergences_noted: "ESV/NASB 'addressing/speaking to one another'; LSB footnote 'Or yourselves' (ἑαυτοῖς). 1 Cor 14:26 ESV renders ψαλμόν as 'hymn' (WEB 'psalm') -- an English reader loses the link to Eph 5:19. CSB footnote Col 3:16 'songs prompted by the Spirit'."
  drafting:
    done: true
    file: "docs/content/christian-life/psalms-hymns-and-spiritual-songs.md"
    notes: "Approved as outlined. Corrections made while drafting: Pliny's Bithynia is not Paul's province of Asia; Exodus 15 is the first song recorded as sung to the LORD (songs are mentioned at Genesis 31:27); Revelation 7:10 is said, not sung; zimrat (H2176) in Exodus 15:2 is contested between 'song' (ESV/CSB/NASB/NLT) and 'defense' (NIV; CSB fn 'Or might') -- marked in the text."
  review:
    done: true
    validated: true # npm run validate clean for this file; mkdocs build --strict clean; rendered and checked in webkit light/dark/mobile
    review_2026-10-25:
      checked: "Every ESV quotation in the study against study-notes.db (25 verses); every WEB first_line, quotation and reference in docs/data/songbook.toml against bible-text.db; NT counts (MACULA SBLGNT), Hebrew counts (morphhb-wlc), LXX Psalter counts and titles (lxx-lemmas, ebible-grcbrent), Odes 1-14 order and Ode 14 text (swete-lxx); Pliny 10.96 (McGiffert note, NPNF2 1, ch. 3.33), Eusebius HE 5.28.5 and Tertullian Apol. 39 (ANF 3) against $BIBLE_MEDIA_ROOT/reference/patristics; footnotes at Exod 15:2, Eph 5, Col 3:16; review_gaps; siblings for Ephesians 5; npm run validate."
      fixed:
        - "Critical (Phase 4): 'Its last song returns to the first' -- Rev 15 is not Revelation's last song (19:1-8 follows). Now 'One of its songs'."
        - "Critical (Phase 4): Odes paragraph said two odes were outside the Protestant canon and 'the rest are Scripture', then called the fourteenth a Christian hymn. Four are outside (Manasseh, the two Greek-Daniel odes, Ode 14); ten are Scripture."
        - "Moderate: Col 3:16 punctuation fork undisclosed -- NASB/CSB/NIV attach the psalms to teaching, ESV to singing (LSB footnote 'Or one another, singing with psalms'). One sentence added; Eph 5:19 carries the point either way."
        - "Minor: Rev 5:9 singers are the living creatures and elders, not 'the saints' (now matches the songbook card)."
        - "Minor: Colossians parallel was 'close to word for word' -- overstated; now 'runs closely parallel'."
        - "Minor: Acts 13:33 cites 'the second Psalm', not the book -- 'four of them referring to the Psalms'."
        - "Minor: shir 'from Moses' song ... to the Song of Songs' implied Exodus first; Genesis 31:27 is one of the 16 books."
        - "Minor: LXX ode is 44 tokens in 43 verses -- 'times' not 'places'."
        - "Minor: NASB reads 'strength and song' (no 'my'); zimrat sentence now quotes 'song'/'defense'."
        - "Minor: Eusebius' writer answered the followers of Artemon (HE 5.28.1-2), not one heretic; LXX 75:1 label is Brenton's Greek text (English is ours), punctuation matched."
        - "Minor: ὑμνήσω given G5214 (strongs_suggest); frontmatter bible_references gained Isaiah 26:19, 60:1, 2 Samuel 22, Revelation 4:8-11, 19:1-8 (cited in prose)."
        - "Songbook: first lines not from the opening verse now carry their verse (Judges 5:3, Isaiah 12:2, Habakkuk 3:17-18, Revelation 19:6); Matthew 21:9 crowds 'shouted', not 'sang'; Psalm 136 antiphony marked 'Probably'; Ephesians 5:14 intro quoted in the WEB ('Therefore he says'); 2 Samuel 1:4-6 for Gilboa."
      left_for_author:
        - "Eph 5:18 'Passive: the Holy Spirit does the filling' -- ἐν πνεύματι as agent vs means/content is contested; the passive alone does not name the agent. Mark confidence or rephrase."
        - "Table pairs hymnos with tehillah; LXX hymnos renders tehillah in 5 of 13 Psalter uses (LXX 39:4, 64:2, 99:4, 118:171, 148:14) but in the titles, including Ps 76, it renders neginot ('stringed instruments'). Consider saying so."
        - "'This study holds that reading and marks it as held against a serious alternative' -- narrated-argument phrasing (style guide)."
        - "Publish dependency unchanged: jesus/psalm-118-road-to-gethsemane.md and resources/songbook.md are draft:true."
      commentary_crosscheck: "NLT Life Application note on Eph 5:18-21 (not cited by the study): confirms the participles as by-products of Spirit-filling (counts four)."

