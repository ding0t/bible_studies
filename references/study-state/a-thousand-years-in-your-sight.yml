slug: "a-thousand-years-in-your-sight"
title: "A Thousand Years in Your Sight"
status: drafted
target_path: "docs/content/last-things/a-thousand-years-in-your-sight.md"
primary_passage: "Psalm 90:1-17"
supporting_passages: ["Psalm 89:46-52", "Psalm 92:1-14", "Psalm 106:45", "Exodus 32:12-14", "Exodus 34:6", "Numbers 14:29-34", "Genesis 3:19", "Hebrews 1:8-12", "2 Peter 3:4-9"]
genre: "psalm (community lament, attributed to Moses) + canonical-sequence reading of Psalter Books III-IV"
point: >
  Psalm 90 in its own context: Moses' prayer over the dying wilderness generation, setting God's
  eternity against human frailty under wrath, and asking the eternal God to return, relent and
  establish the work of mortal hands. The eschatological (week-of-millennia) reading stays the
  parent's.
thesis: >
  The God who is from everlasting to everlasting has been His people's home in every generation, and
  because a thousand years are as yesterday to Him, mortal and sinful people can ask Him to return, to
  satisfy them with His steadfast love, and to establish the work of their few days.
outline:
  - "Opening: Moses buried a generation (Num 14:29, 34); Ps 90:1-2 quoted; In one sentence."
  - "A prayer of Moses: only psalm title naming Moses; Deut 33:1 'man of God'; ESVSB Deuteronomy setting; four-step structure."
  - "The eternal God and the thousand-year day: ma'on (dwelling), moved vocabulary + olam sections; timelessness marked contested with both sides."
  - "Our days under His wrath: shuv/Gen 3:19; vv. 7-9 death as judgment on sin; v. 12 manah, number our days."
  - "Return, O LORD: shuv turned back to God; shuv + nacham = Exodus 32:12 golden-calf prayer, answered 32:14; chesed (Ex 34:6); establish the work of our hands; grace landed on reader."
  - "Where the psalm stands in the Psalter: moved seam/doxology material; 106:45 answers 90:13; Peter's 2 Pet 3:4/8/9; week-of-millennia handed to parent."
  - "The psalm for the seventh day: moved Ps 92 material + new vocabulary echo (92:2, 4 answer 90:14-17)."
word_budget: 4000
