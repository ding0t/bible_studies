review_2026-10-20:
  skill: review-bible-study (full, phases 1-8)
  reviewer: anthropic/claude-opus-5.5 (author not in session; findings recorded, study markdown NOT edited)
  status_at_review: "draft: false (live)"
  checked: >
    Every ESV quotation re-pulled from study-notes.db (study_verse, esv-study-bible) and compared
    verbatim: Ps 90:1-17, 89:46-52, 92:1-15, 106:45-48, 41:13, 72:19, 102:27; Num 14:29-34; Eccl 6:6;
    Isa 40:17; Exod 32:12-14, 34:6; Gen 3:19; Deut 33:1; Heb 1:8-12, 13:8; John 1:14; 2 Tim 1:10;
    1 Cor 15:58; 2 Pet 3:4-9 -- all match, references correct, labels correct. Existing 35 evidence
    entries replayed (verify_claims.py --only-evidence): 0 failing. Interlinear re-run for Ps 90:1-5,
    12-17; 92:1, 2, 4, 7; 106:45; Exod 32:12; Gen 2:3, 3:19. TWOT roots re-checked (1581a, 1631a, 2340,
    1213, 1344, 698a all correct). Moses-in-Psalms count (8, only 90:1 a title) re-run: correct.
    All footnotes on Ps 90 read (CSB Ancient Faith, LSB). Study notes re-read (ESVSB, NIVBTSB,
    NIVCBSB, NLT Life Application as the independent commentary). b. Sanhedrin 97a and
    b. Rosh HaShanah 31a checked against the cached Sefaria texts. LXX psalm titles checked
    (ebible-grcbrent). validate-content.js, review_gaps, cross_study_claims "Psalm 90",
    study_structure.py, mermaid render (529px wide, OK) and the pop-up resolver
    (app/src/entries/popups.js) run against the file.
  word_count: "~3,300 counted words (validator Check 23 silent); budget 4,000. Net effect of all fixes below: about +60 words."
  findings:
    - id: 1
      severity: critical
      location: "Where the psalm stands in the Psalter > The seam after Psalm 89 (line ~255)"
      issue: >
        False synthetic claim: "Each of the Psalter's five books closes with a doxology ending in
        'Amen' (Psalms 41:13; 72:19; 89:52; 106:48)". Only four references are given because only four
        books close that way; Book V closes with Psalm 150 ("Praise the LORD!", 150:6), and 106:48
        itself ends "Praise the LORD!" after its "Amen".
      fix: >-
        "Each of the first four books closes with a doxology and an 'Amen' (Psalms 41:13; 72:19; 89:52; 106:48)." (+2 words)
      verdict: confirmed against ESV text (evidence ps41-13-esv, ps72-19-esv, ps89-52-esv, ps106-48-esv, ps150-6-esv)
    - id: 2
      severity: critical
      location: "The psalm for the seventh day, opening sentence (line ~295)"
      issue: >
        Uniqueness claim broader than its source: "the only psalm in the Psalter assigned to a day of
        the week". NIVCBSB says only that Ps 92 is the only psalm designated *for the Sabbath*. The
        Septuagint Psalter titles four more to weekdays (LXX 23/Eng 24 first day, 47/48 second day,
        93/94 fourth day, 92/93 the day before the Sabbath), and b. Rosh HaShanah 31a -- which this
        study itself cites -- lists a Temple psalm for every day. The sibling day-is-a-thousand-years.md
        quotes that list, so the corpus contradicts itself here.
      fix: >-
        "...comes the only psalm whose Hebrew title assigns it to a day of the week." (+2 words) Optionally a clause noting the Temple sang a psalm for each day.
      verdict: confirmed (evidence lxx-ps24-title, lxx-ps48-title, lxx-ps93-title, lxx-ps94-title, nivcb-ps92-title)
    - id: 3
      severity: moderate
      location: "The eternal God and the thousand-year day > The dwelling place (line ~117)"
      issue: >
        Undisclosed textual fork. The section's argument turns on ma'on = "home" (a homeless
        generation always had one), but CSB Ancient Faith footnotes 90:1 "Some Hb mss, LXX; other Hb
        mss read dwelling place" (CSB text reads "refuge"), LSB notes "some ancient mss place of
        refuge", and the LXX reads katafygē. The study quotes LSB's footnote but drops its second half.
      fix: One sentence -- "A few Hebrew manuscripts and the Septuagint read 'refuge' (ma'oz); the Masoretic text, which the ESV follows, reads 'dwelling'." (+25 words)
      verdict: confirmed (evidence csb-ps90-1-variant, lsb-ps90-1-variant, lxx-ps90-1-refuge)
    - id: 4
      severity: moderate
      location: "The psalm for the seventh day, last paragraph (line ~335)"
      issue: >
        Talmud quotation presents the translator's gloss as the rabbis' words and does not name the
        version. In the William Davidson Edition (CC-BY-NC) of b. Sanhedrin 97a the bold Talmud text is
        "a day ... that is entirely Shabbat"; "i.e., one thousand years" is Steinsaltz's unbolded
        explanatory insertion. The sibling study labels the same quotation "William Davidson Edition".
      fix: Quote only the Talmud's words ("a day that is entirely Shabbat") and attribute "b. Sanhedrin 97a, William Davidson Edition"; say the thousand-year sense comes from the surrounding baraita. (+4 words)
      verdict: confirmed against references/build/cache/sefaria (Sanhedrin, Davidson edition)
    - id: 5
      severity: moderate
      location: "Pop-up references: line ~132 '(90:10)', line ~177 '(note on 90:3)', line ~271 '(3:8, ESV)', Discussion Q2 '(90:10)'"
      issue: >
        Four bare references resolve against the last book named in their paragraph
        (app/src/entries/popups.js): 90:10 -> Genesis 90:10 (after "Genesis 1"); note on 90:3 ->
        Genesis 90:3 (after Genesis 3:19); 3:8 -> Psalm 3:8 (after "Psalm 90:4") -- the reader opening
        Peter's quotation is shown the wrong verse; Q2 90:10 -> Numbers 90:10.
      fix: Write "Psalm 90:10", "Psalm 90:3", "2 Peter 3:8", "Psalm 90:10". (+5 words)
      verdict: confirmed by reading the resolver; not tested in a browser
    - id: 6
      severity: moderate
      location: "The psalm's own vocabulary, first paragraph (line ~125-129)"
      issue: >
        Unsupported synthetic claim: "A thousand is the ceiling of a human life in Hebrew reckoning".
        No source given; Eccl 6:6, cited as support, actually reaches past it ("a thousand years twice
        over"). The ESVSB note on 90:3-6 does read v. 4's thousand as "the longest imaginable" life,
        and the sibling's Jubilees 4:29-30 (Adam 70 short of the thousand-year day) is the ancient
        witness for the idea. Ages verified (Gen 5: 930/912/962/969); Noah's 950 (Gen 9:29) also
        stays under.
      fix: >-
        "A thousand years is the longest life anyone in Genesis approaches" + cite ESVSB note on 90:3-6 or link the sibling's Jubilees section; reword Eccl 6:6 as hyperbole reaching past even that. (~+15 words)
      verdict: claim partly supported, overstated as written
    - id: 7
      severity: minor
      location: "Key Takeaways > Lessons about Jesus, first bullet; Discussion Q3"
      issue: >
        "The eternal God of Psalm 90 is the God the Son" (also a grammar slip, "the God the Son").
        Hebrews applies Psalm 102 (not 90) to the Son; the bridge to Psalm 90 is inference left
        unmarked, and "is ... the Son" / Q3 "the eternal God of Psalm 90:2 is Jesus" can read as
        identifying the LORD of Ps 90 with the Son alone. Not a conflict with the statement of faith's
        "One God in Three" (Son co-eternal), but tighter wording keeps it clearly Trinitarian. Q3 also
        attributes "of the Son" to Heb 1:10-12; the phrase is in 1:8.
      fix: >-
        "The Son shares the eternity Psalm 90 confesses." Q3 -> "Hebrews 1:8, 10-12". (~0 words)
    - id: 8
      severity: minor
      location: "Our days under His wrath / A song of final sorting (lines ~327-330)"
      issue: >
        "Psalm 92's wicked are the grass now" sits beside a section that argues from shared Hebrew
        words, but the grass words differ (90:5 chatsir H2682; 92:7 'esev H6212). Image link only.
      fix: Leave as image, or add "(a different word, the same picture)". (+6 words)
      verdict: confirmed (evidence ps90-5-chatsir, ps92-7-esev)
    - id: 9
      severity: minor
      location: "A song of final sorting, last sentence (line ~331)"
      issue: NIVBTSB "draws the same conclusion" -- its title note concludes the Sabbath signified a final *rest*; the study's conclusion is final *sorting*. Related, not the same.
      fix: >-
        "draws a related conclusion". (0 words)
    - id: 10
      severity: minor
      location: "Hebrew title, line ~302"
      issue: Pointing slip -- study has הַשַׁבָּת (shin without dagesh forte); WLC reads הַשַּׁבָּת.
      fix: Add the dagesh to the shin. (0 words)
    - id: 11
      severity: minor
      location: "lines ~154 and ~156"
      issue: Bold added inside quotations ("**How long?**" in the ESV; "**in** time" in the NIVBTSB note) without "emphasis added".
      fix: Drop the bold or add "(emphasis added)". (0-4 words)
    - id: 12
      severity: minor
      location: "Citations without locators"
      issue: >
        "Lactantius quotes it" has no locator and no References entry (sibling cites Divine Institutes
        7.14); "three watches" for ashmurah is uncited (Judges 7:19 "middle watch" supports it).
        Augustine/Boethius remain cited at book level from general knowledge (open question from
        drafting, still unverified against the patristics corpus).
      fix: Add "(Divine Institutes 7.14)" and a References line; add "(Judges 7:19)". (+8 words)
    - id: 13
      severity: minor
      location: "Discussion Questions"
      issue: Validator Check 25 -- 6 of 6 questions lack facet labels; no **Be transformed.** question (Q5/Q6 are personal and could take the label).
      fix: Label per discussion-questions.md (The language. Q1; The text in its context. Q2; Christ. Q3; The hard part. Q4; Be transformed. Q5, Q6). (+12 words)
    - id: 14
      severity: minor
      location: "Placement / frontmatter"
      issue: >
        Open question from drafting still open: the study is about God's eternity and human frailty
        in Psalm 90 and now sits in last-things/ with category "prophecy" and tag "last-days"; its
        eschatology is handed to the sibling. A god/ or scripture/ placement fits the subject better,
        but the page is live, so a move costs a redirect. Author's call. Provenance fields current.
      fix: Author decision; if moved, add a mkdocs-redirects entry.
    - id: 15
      severity: minor
      location: "The psalm's own vocabulary, paragraph 2 (line ~139-142)"
      issue: Style -- the Isaiah 40:17 foil ("Scripture has other ways ... Psalm 90 does not use them") defines the point by what it is not. Otherwise the register is clean (antithesis count low).
      fix: Optional cut of the Isaiah sentence (-30 words).
  confirmed_without_finding:
    - "All ESV quotations verbatim; all cited references correct; translation labels correct."
    - "shuv + niphal imperative nacham in Ps 90:13 = Exod 32:12 (VNv2ms both); 106:45 nacham + chesed."
    - "Ps 92:2, 4 reuse all six terms claimed from 90:14-17: chesed, boqer, samach, po'al, ranan, ma'aseh yadayim."
