      God eternal and His people's home; death as His judgment on sin; God merciful, relents
      according to chesed; landed via Jesus (Heb 1:8-12, 13:8; John 1:14; 2 Tim 1:10; 1 Cor 15:58).
      Statement of faith silent on divine timelessness -- no conflict; contested point marked with
      both sides (Augustine/Boethius timeless vs everlasting-through-time).
