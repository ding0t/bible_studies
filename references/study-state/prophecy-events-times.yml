  - {type: other, title: "Lunar Visibility and the Crucifixion (QJRAS 31, 1990)", author: "Bradley E. Schaefer", note: "peer-reviewed rebuttal: eclipsed portion would have been barely perceptible against twilight/horizon brightness, not a vivid 'blood moon'"}
  - {type: other, title: "Solar eclipse of 1207 BC helps to date pharaohs (Astronomy & Geophysics 58, 2017)", author: "Colin J. Humphreys and W. G. Waddington", note: "reinterprets Joshua 10's 'sun stood still' as an annular eclipse at Gibeon; in tension with the text's own stated effect (a LENGTHENED day, not a darkened one)"}
