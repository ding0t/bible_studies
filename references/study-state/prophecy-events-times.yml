  - {type: other, title: "Assyrian Eponym Canon / Bur-Sagale eclipse", author: "n/a (primary Assyrian administrative record)", note: "763 BC eclipse anchors Assyrian absolute chronology from 911 BC"}
  - {type: other, title: "Sennacherib's Prism (Taylor Prism)", author: "Sennacherib", note: "'shut up like a caged bird', 701 BC, British Museum"}
  - {type: other, title: "Babylonian Chronicle ABC 5 (Jerusalem Chronicle)", author: "n/a", note: "597 BC capture of Jerusalem dated to 2 Adar, Nebuchadnezzar's 7th year; BM 21946"}
  - {type: other, title: "Jehoiachin's Ration Tablets", author: "trans. Ernst Weidner", note: "names 'Ya'u-kinu king of Yahudu'; excavated by Koldewey"}
  - {type: other, title: "Cyrus Cylinder; Nabonidus Chronicle", author: "n/a", note: "539/538 BC; confirms Belshazzar's historicity as Nabonidus's co-regent"}
  - {type: other, title: "Elephantine papyri", author: "n/a", note: "dual-dated Egyptian/Jewish-calendar documents fixing Artaxerxes I's regnal years"}
  - {type: other, title: "The Coming Prince", author: "Sir Robert Anderson (1894)", note: "173,880-day / 69-week calculation, 445 BC -> 6 Apr AD 32"}
  - {type: other, title: "Chronological Aspects of the Life of Christ", author: "Harold W. Hoehner", note: "refines Anderson: 444 BC -> 30 Mar AD 33"}
