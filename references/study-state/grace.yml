open_questions:
  - "Fork candidate: John 1:16 charin anti charitos -- 'grace upon grace' (accumulation) or 'grace in place of grace' (law replaced by Christ, NIV BTSB). Not treated here."
  - "Fork candidate: Exodus 33:19 in Romans 9:15 and election. Paul quotes the whole verse from the LXX, whose eleeo renders chanan and oikteiro renders racham (corrected in review_2026-11-15: an earlier note here said he quotes 'not the chanan half'). Election not treated."
  - "Titus 2:13 'great God and Savior Jesus Christ' (one person, Granville Sharp) vs LSB footnote 'the great God and our Savior'. Not treated; the study only says 'the appearing of the glory'."
  - "Backlog 11.2 (attributes) will treat Exodus 34:6-7 fully; this study gives chanun one paragraph and links the backlog entry."
