genre: [topical, epistle, ot-narrative, law, gospel]

thesis: "Grace is God's favour given freely, in His Son Jesus, to people who had earned the opposite: it saves you apart from anything you bring, it overflows wherever sin has spread, and the same grace trains you to live for God and works in you as you serve Him."
outline:
  - {section: "Hook", says: "Saul the persecutor (Acts 8:3; 1 Timothy 1:13-15): the man who had earned God's judgment received God's favour."}
  - {section: "Favour in the eyes of the LORD", says: "chen (H2580) first at Genesis 6:8; Moses asks on the ground of chen six times (Exodus 33:12-34:9), God answers 'I will be gracious' (chanan, 33:19) and proclaims Himself chanun (34:6); first chanun is the poor man's cry (Exodus 22:27). Link names-of-god and backlog 11.2."}
  - {section: "The word the apostles used", says: "charis (G5485): LXX renders every chen in Exodus with charis; range in Luke (favour, gracious words, credit, thanks); 155 NT, 101 in Paul. Luke 6:32-35: God is kind to the acharistoi. Benefaction and thanks (charis = 'thanks', 1 Cor 15:57). Mercy and grace in Eph 2:4-5."}
  - {section: "Grace and truth came through Jesus Christ", says: "John 1:14-17 echoes Exodus 33-34 (glory seen, tent, Moses, no one has seen God), 'grace and truth' most likely for chesed ve'emet. The gracious God of Sinai came in person. 2 Corinthians 8:9."}
  - {section: "By grace you have been saved", says: "Ephesians 2:4-9: charis three times, riches of grace shown in the coming ages, saved through faith, no boasting; link faith and assurance. Romans 3:24 dorean = John 15:25 'without a cause', Galatians 2:21."}
  - {section: "Otherwise grace would no longer be grace", says: "Romans 11:5-6 in its Elijah context and Romans 4:4 (kata charin vs kata opheilema): grace is defined by being unearned; adding works unmakes it. Link when-love-grows-cold and faith."}
  - {section: "Where sin increased", says: "Romans 5:15-21 from the 'much more' side: five gift words, hyperperisseuo (2x NT), grace reigns; Romans 6:1-2, 14 answers the objection."}
  - {section: "The grace that trains", says: "Titus 2:11-14: grace appeared (epiphaino) and glory will appear (epiphaneia); paideuo is child-training (Heb 12:6); Exodus 19:5 / Psalm 130:8 behind 2:14. 'All people' contested, both cases."}
  - {section: "The grace that works", says: "1 Corinthians 15:8-10 (kenos 15:10, 14, 58), Ephesians 3:2, 7-8 (stewardship of grace; link israel-and-the-church), 2 Corinthians 12:9."}
  - {section: "Discussion questions / References", says: "five facet-labelled questions ending on Be transformed."}
