stages:
  scoping:
    done: true
    notes: "Backlog 4.4; week two of Saved. Placement salvation/ (Soteriology: 'Grace, redemption, assurance, death' in placement-and-tags.md). No existing study treats grace as its subject; siblings use it in passing."
  exegesis:
    historical_context:
      done: true
      notes: "Ephesians: Paul, prison letter, probably circulated in Asia (ESV intro; assurance-of-salvation already sets this). Titus: Paul to Titus on Crete; 2:1-10 household instructions (older men, women, young men, slaves) grounded by 'For' in 2:11. 1 Corinthians 15: resurrection witness list, Paul last (15:8). Greco-Roman benefaction: recipients repaid benefactors with honour and gratitude (NIV Cultural Backgrounds notes on 2 Cor 8:14, 8:19)."
    literary_context:
      done: true
      notes: "Eph 2:1-10 one sentence (ESV SB); 2:1-3 dead, 2:4-10 But God. Romans 5:12-21 Adam/Christ; 5:20-21 law and grace; 6:1 objection. Romans 11:1-6 remnant, Elijah. Titus 2:11-14 is the ground ('For') of 2:1-10 and is followed by 3:4-7 (second epiphaino). Exodus 33:12-34:9 Moses' intercession after the calf, built on chen."
    content_word_studies:
      done: true
      notes: "See terms and evidence."
      terms:
        - {word: "חֵן", language: hebrew, transliteration: "chen", strongs_id: "H2580", gloss: "favour, grace", range_of_meanings: ["favour found in another's eyes (Gen 6:8; Exod 33:12-17)", "favour granted (Exod 3:21; 11:3; 12:36)", "charm, graciousness (Eccl 10:12)"], notes: "69x (macula-hebrew-wlc). First use Gen 6:8. Six in Moses' intercession: Exod 33:12, 13 (x2), 16, 17; 34:9. TWOT 694a. LXX renders every chen in Exodus with charis (lxx-lemmas)."}
        - {word: "חָנַן", language: hebrew, transliteration: "chanan", strongs_id: "H2603", gloss: "show favour, be gracious", range_of_meanings: [], notes: "76x. Exodus 33:19 twice ('I will be gracious to whom I will be gracious'); Numbers 6:25. TWOT 694. LXX Exod 33:19 renders with eleeo."}
        - {word: "חַנּוּן", language: hebrew, transliteration: "chanun", strongs_id: "H2587", gloss: "gracious", range_of_meanings: [], notes: "13x; twelve of God; Psalm 112:4 most likely the man who fears the LORD. First use Exodus 22:27 (Heb 22:26), the poor man's cloak, ESV 'compassionate'. Exodus 34:6 'gracious'. LXX Exod 34:6 renders eleemon, not charis. TWOT 694d."}
        - {word: "χάρις", language: greek, transliteration: "charis", strongs_id: "G5485", gloss: "grace, favour, thanks", range_of_meanings: ["favour (Luke 1:30; 2:52)", "graciousness (Luke 4:22)", "credit (Luke 6:32-34)", "thanks (Luke 17:9; Rom 6:17; 1 Cor 15:57)", "gift (1 Cor 16:3)", "God's saving favour (Rom 3:24; Eph 2:5, 8)", "grace that empowers (1 Cor 15:10; 2 Cor 12:9)"], notes: "155 NT (SBLGNT), 101 in Paul's thirteen letters, 25 in Romans, 12 Ephesians. None in Matthew or Mark; John's Gospel only 1:14, 16 (x2), 17. 161 in lxx-lemmas."}
        - {word: "δωρεάν", language: greek, transliteration: "dorean", strongs_id: "G1432", gloss: "as a gift, freely, without cause", range_of_meanings: ["freely (Matt 10:8; Rom 3:24; Rev 21:6; 22:17)", "without cause (John 15:25)", "for nothing / in vain (Gal 2:21)", "without payment (2 Thess 3:8)"], notes: "9x NT."}
        - {word: "ὑπερπερισσεύω", language: greek, transliteration: "hyperperisseuo", strongs_id: "G5248", gloss: "overflow beyond measure", range_of_meanings: [], notes: "2x NT: Rom 5:20; 2 Cor 7:4."}
        - {word: "παιδεύω", language: greek, transliteration: "paideuo", strongs_id: "G3811", gloss: "train, bring up, discipline", range_of_meanings: ["educate (Acts 7:22; 22:3)", "discipline as a father (Heb 12:6, 7, 10; Rev 3:19)", "punish (Luke 23:16, 22)"], notes: "13x NT. LSB footnote at Titus 2:12 'Or disciplining'."}
        - {word: "ἐπιφαίνω / ἐπιφάνεια", language: greek, transliteration: "epiphaino / epiphaneia", strongs_id: "G2014 / G2015", gloss: "appear / appearing", range_of_meanings: [], notes: "epiphaino 4x (Luke 1:79; Acts 27:20; Titus 2:11; 3:4). epiphaneia 6x, all Paul (2 Thess 2:8; 1 Tim 6:14; 2 Tim 1:10; 4:1, 8; Titus 2:13); 2 Tim 1:10 of the first coming."}
        - {word: "κενός", language: greek, transliteration: "kenos", strongs_id: "G2756", gloss: "empty, in vain", range_of_meanings: [], notes: "1 Corinthians 15:10, 14 (x2), 58."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Benefaction culture expected the client to repay with honour; Paul keeps the response (thanks, good works, labour) and removes the repayment: grace is received kata charin, never kata opheilema (Romans 4:4). Transcultural."
    theological_principle:
      done: true
      notes: "God is gracious by His own proclaimed character (Exodus 34:6), and in His Son Jesus He gives His favour to people who earned wrath; grace saves apart from works, outruns sin, trains the saved, and empowers service."
    application_draft:
      done: true
      notes: "Think: you stand in grace (Rom 5:2; Eph 2:8). Attitude: 'not I, but the grace of God' (1 Cor 15:10). Do: Luke 6:35, do good to someone who cannot repay."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Exodus 33:18-34:7 -> John 1:14-18", relation: "allusion, probable: glory seen, tabernacling, Moses and the law, no one has seen God (Exod 33:20); 'grace and truth' most likely the Hebrew chesed ve'emet (ESV SB John 1:16-17; NIV BTSB John 1:14; NIV CBSB chart John 1:14-18). The LXX of Exod 34:6 reads polyeleos kai alethinos, so the link runs through the Hebrew, not shared Greek wording."}
      - {ref: "Psalm 130:8 LXX -> Titus 2:14", relation: "shared lytroo + pas + anomia (lxx-lemmas Ps 129:8); bible_trace found no derived connection, i.e. the method is silent, the wording is there. ESV SB notes the resemblance."}
      - {ref: "Exodus 19:5; Deuteronomy 14:2 LXX -> Titus 2:14", relation: "laos periousios, shared phrase (lxx-lemmas)."}
      - {ref: "Genesis 6:8 LXX -> Luke 1:30", relation: "heuriskein charin, the Septuagint idiom for matsa chen."}
    translations_compared: ["ESV", "BSB", "KJV", "MSB", "LSB (footnotes)", "CSB (footnotes)"]
    divergences_noted: "Exodus 22:27 ESV renders chanun 'compassionate', 34:6 'gracious'. Ephesians 3:2 oikonomia: ESV 'stewardship', KJV 'dispensation'. Romans 11:6: the Majority text (KJV, MSB) adds the converse clause; CSB footnote 'Other mss add'. Titus 2:11: CSB footnote 'Or appeared with saving power'; LSB 'Or to all men, bringing'. Titus 2:12 LSB 'Or disciplining'."
  drafting:
    done: true
    file: "docs/content/salvation/grace.md"
    notes: "Drafted 2026-11-15 as draft: true. 3,130 words by validator Check 23's measure (block quotes excluded; 4,151 with them), budget 4,000. Outline section required by Check 22 and present. All 60 ESV quotations checked against study-notes.db esv-study-bible by script (0 misses); one casing fix (Luke 17:9 'Does'). Antithesis count: 0 in own prose (the one ', not ' is inside the CBSB quotation)."
  review:
    done: false
    validated: true # npm run validate 2026-11-15: only the three provenance warnings (author runs refresh_frontmatter_provenance.py at commit); mkdocs build --strict clean; all internal links and anchors checked by script
    statement_of_faith_check: "Salvation ('grace of God alone, through faith alone, in Christ alone'; Eph 2:8-9; Titus 3:5): consistent. Justification ('justified by his grace as a gift', Rom 3:24): consistent, and pointed forward to week five. Sanctification ('The house God is building', 'Reward for the believer: grace crowning what grace produced'): consistent with Titus 2:11-14 and 1 Cor 15:10. No tension found. The statement is silent on the extent of Titus 2:11's 'all people'; the draft marks it contested and says so."
    contested_points_marked:
      - "Titus 2:11 'for all people': every person (no limit stated; 1 Tim 2:4; ESV SB) vs every kind of person (follows the 2:1-10 household list; 'For'). Both given; shared ground stated; statement of faith silent."
      - "John 1:14-17 echoing Exodus 33-34 and 'grace and truth' = chesed ve'emet: marked 'very likely' / 'probable', on four shared features; noted that the LXX of Exod 34:6 has different Greek."
      - "Psalm 112:4 chanun: 'most likely' the man who fears the LORD."
      - "Romans 11:6 longer reading: stated as a manuscript addition followed by the KJV."
    proposed_back_links: # do NOT apply while this study is draft (Check 24); apply in the publish commit
      - {slug: "series/saved.md", where: "sessions: replace `- planned: \"Grace\"` with `- study: salvation/grace.md` and a why line", note: "author does this at publish"}
