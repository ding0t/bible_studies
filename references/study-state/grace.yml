review_2026-11-15:
  by: "review-bible-study (subagent, independent of the drafting session)"
  checked:
    - "Phase 1: all 32 block-quote verse segments and every inline ESV quotation re-checked by script against study-notes.db esv-study-bible (0 misquotes; the only non-matches were sentence-initial capitals on mid-verse fragments and the study's own glosses). KJV Romans 11:6 and Ephesians 3:2 checked against bible-text.db. ESV SB (Titus 2:11), NIV CBSB (2 Cor 8:14) and LSB footnote (Titus 2:12) quotations verified; NLT CBB 'Mercy' article paraphrase is faithful."
    - "Phase 2: TWOT 694/694a/694d, every Strong's number, all five internal anchors and the eight sibling pages (all draft: false) verified. strongs_suggest.py: nothing missing. No bare references."
    - "Phase 3: chen 69 (43 verses share matsa, so 'most often find favour' holds); chen 6x in Exod 33:12-34:9; LXX charis at all 9 Exodus chen; chanun 13 (12 of God, Ps 112:4 the man); charis 155 NT / 101 Paul / 4 John; hyperperisseuo 2; epiphaino 4; paideuo 13 (9 discipline/chastise, 3 instruct); kenos 4 in 1 Cor 15. Root-fallacy check on paideuo 'bringing up a child': supported synchronically by Heb 12:6-7, 10 (father and sons) and the NIV BTSB Titus 2:12 note ('like a parent instructs a child'); kept, with the 'every son' clause of Heb 12:6 now quoted so the reader sees it."
    - "Phase 4: Romans 5:15-17 gift-word count re-derived word by word: charis 3 (15, 15, 17), charisma 2 (15, 16), dorea 2 (15, 17), dorema 1 (16) = 8, four words. Correct. Four John/Exodus shared features counted (glory, no one sees God, tent, grace and truth): correct."
    - "Phase 5: NLT Life Application (uncited) on Eph 2:4-8 and Rom 11:6: confirms. NIV BTSB John 1:14 confirms the Exod 34:6 parallel (the study's citation of it holds)."
    - "Phase 6: genre covered (topical, each text read in its own kind); occasion partial (Ephesians' occasion left to the linked assurance study, acceptable for a topical study); literary context covered; original language covered; cultural/transcultural explicit (benefaction: thanks kept, repayment removed); principle taught across both testaments. Statement of faith (Salvation, Justification, Sanctification): consistent, no tension; silent on Titus 2:11's extent, as the study says. review_gaps: nothing bearing on the argument (Prov 3:12 behind Heb 12:6 and Num 14:18 behind Exod 34:6-7 are leads only). cross_study_claims on Titus 2, John 1, Romans 5, Ephesians 2, Exodus 33, Romans 11, 1 Corinthians 15: no disagreement with a sibling."
    - "Phase 7: placement salvation/ correct; category matches siblings; provenance fields present (file committed)."
    - "Phase 8: antithesis count 0 in own prose; no intensifiers or grader adjectives; no 'worth ___'. Key Takeaways, Be Transformed and prayer are in devotional register, name Jesus, close 'In Jesus' name. Amen.' Be Transformed: Think/Attitude/Do each cite a verse; Do is the passage's own command (Luke 6:35). Memory verses: standard shape, both quoted in the body. Discussion questions: five facets, ends on Be transformed."
    - "Drafter's flagged weakness (essay register in word-study passages): the word studies are analytical, which style-guide.md assigns to them; the sections still land in the second person. The real defect in the Romans 5:15-17 paragraph was evidence, not register: the count included Romans 5:16, which the block quote skipped, so three of the eight words were invisible to the reader."
  fixed:
    - "Romans 5:15-17: block quote extended to include 5:16, and one sentence added that the ESV renders charisma, dorea and dorema all 'free gift', five times in three verses, so the count can be checked on the page. 'He piles' -> 'Paul piles'. (Moderate: argued from wording the reader could not see.)"
    - "Exodus 33:19: added the Septuagint's eleeo for chanan, Paul's Romans 9:15 and the BSB's 'I will have mercy' (the pop-up's reading translation contradicted the ESV 'gracious' the paragraph argues from, undisclosed; alignment_ranking flagged H2603 ULT 'gracious' / BSB 'mercy', no recorded decision). (Moderate.)"
    - "Series claim: 'justified, and redemption, are weeks of their own in this series' was false; series/saved.md plans Repentance, Justified, Adopted, Made Holy, and no redemption week. Rewritten to name only justification as a week; Kinsman Redeemer link kept. (Critical-class false synthetic claim, one clause.)"
    - "Exodus 33: 'six times in his intercession' included Exodus 33:17, which is the LORD's reply -> 'six times between Moses and the LORD'. 'Went back up to plead ... the whole plea on chen' conflated the 32:30-32 plea (no chen) with 33:12-17 -> cited 32:30-32 and 'When he pleaded again'. (Minor.)"
    - "Ephesians 2:4-9: 'three times in five verses' (the quoted unit is six; occurrences 2:5, 7, 8) -> 'in these six verses (Ephesians 2:5, 7, 8)'. 'Every verb belongs to God' was false ('we were dead', 'no one may boast') -> 'God is the subject of every main verb'. (Minor, exhaustiveness.)"
    - "Titus 2:14 / Psalm 130:8: 'follows the Septuagint' -> 'echoes' (shared lytroo, pas, anomia, but ek vs apo and bible_trace finds no derived link). (Minor, confidence.)"
    - "Romans 5:20: transliteration was the lemma's under the inflected form -> 'ὑπερεπερίσσευσεν, from ὑπερπερισσεύω (hyperperisseuo ...)', matching the study's own shape for epiphaino and paideuo. (Minor.)"
    - "Style, restated conclusions cut: 'Add works to grace as its ground and you have something other than grace' (restates Rom 11:6 just quoted); 'A king rules.' (restates 'grace is a king'). (Minor.)"
    - "Hebrews 12:6 quotation extended through 'and chastises every son whom he receives' so the father-son sense of paideuo is visible. (Minor.)"
    - "Discussion question 1: added χάρις beside *charis* (author's convention: script plus transliteration in The language. questions). (Minor.)"
    - "Missing sibling link: biblical-figures/paul.md (thesis: Paul saved as a pattern of grace, 1 Tim 1:16; cites 1 Cor 15:8-10) added to On this site. (Minor.)"
    - "Frontmatter: tag 'luke' added (Luke 1, 2, 4, 6, 17 carry a section and a block quote); bible_references += Exodus 32:30-32, Romans 9:15, Psalm 112:4, 1 Timothy 1:16. (Minor.)"
  left_for_author:
    - "word-renderings.toml has no entry for H2603 (chanan): proposed {kind: interpretive, follow: 'be gracious / show favour', status: proposed, why: 'the noun chen and adjective chanun are favour and gracious; the LXX renders the verb eleeo at Exodus 33:19 and Paul quotes that, so mercy and grace overlap in this root; the site follows the ESV gracious and names the LXX mercy where a study rests on it'}. Not written: outside this review's file scope."
    - "charis 155 NT / 101 Paul / 25 Romans, from macula-greek-sblgnt, include Romans 16:24, which that data carries with no glosses and NA28 (study-notes.db na28-greek-nt) omits. Without it the figures are 154 / 100 / 24. The pop-up counts the same rows, so the page agrees with itself; whether to state the critical-text figure is the author's call."
    - "John 1:16 'grace upon grace': CSB footnote 'Or in place of' and NLT footnote 'grace of Christ rather than the grace of the law' (and NIV BTSB) give the other reading; the study quotes the verse but argues nothing from charin anti charitos. Incidental (Minor); already an open fork."
    - "Key Takeaways 'Types & Prophecy' holds one bullet (Titus 2:11/13 appearings) that is neither a type nor a stated prediction-fulfilment in key-takeaways.md's sense; the laos periousios pattern (Exodus 19:5 -> Titus 2:14) is the study's nearer type. Heading choice is the author's."
    - "'self-controlled toward yourself, upright toward others, godly toward God' (Titus 2:12) is a traditional reading (Calvin) stated flat; acceptable, author may mark it."
    - "Discussion question 5 quotes 1 Corinthians 15:10 but asks only about Luke 6:35's kindness; the first quotation does no work in the question."
    - "Back-link proposals (apply at publish, Check 24): add biblical-figures/paul.md (at 1 Timothy 1:16 'pattern' or its On this site list) to proposed_back_links."
  size: "Check 23 measure 3,158 -> 3,213 words (+55), budget 4,000. Whole file 4,922 words."
