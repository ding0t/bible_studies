      - {slug: "christian-life/when-love-grows-cold.md", where: "at the Romans 11:5 quotation", note: "link for 'chosen by grace' and Romans 11:6"}
      - {slug: "christian-life/forgiveness.md", where: "the charizomai < charis paragraph (Ephesians 4:32)", note: "enrich: link the grace study for charis; forgiving as you were graced"}
      - {slug: "salvation/assurance-of-salvation.md", where: "'The grammar of not your own doing' or On this site", note: "link the grace study for charis and Ephesians 2:4-7"}
      - {slug: "jesus/kinsman-redeemer.md", where: "at the Romans 3:24 quotation", note: "optional: link for 'justified by his grace as a gift' (dorean)"}
