  types_and_prophecy: "Swapped: Exodus 19:5's laos periousios to Titus 2:14 (periousios's only NT use) is now the Types & Prophecy bullet; the two appearings (Titus 2:11, 13) moved to Lessons about Jesus, replacing the bullet that repeated Titus 2:14."
  charis_count: "Kept 155/101, the count in the SBLGNT the site uses (it prints Romans 16:24 within variant markers), with a parenthesis that editions omitting Romans 16:24 have one fewer."
  titus_2_12: "The self / others / God reading is now introduced as a traditional reading."
  discussion_question_5: "Now uses both quotations: grace working through you (1 Corinthians 15:10) toward the ungrateful (Luke 6:35)."
  renderings: "H2603 decided in docs/data/word-renderings.toml: be gracious, with the Septuagint's and Paul's mercy named where a study rests on it."

