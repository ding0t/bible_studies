genre: [gospel, topical]

thesis: "Jesus refused the cup that would have dulled His suffering and drank to the end the cup His Father gave Him, the cup of wrath you deserved, so that the cup He hands you is salvation and the wine of a wedding still to come."
outline: # approved by author 2026-10-30
  - {section: "Cana: the good wine kept until now", says: "John 2 sets the hour, the mother, and Psalm 69 that the cross closes"}
  - {section: "The cup that I drink", says: "the prophets' cup is the LORD's wrath; Jesus names His death by it"}
  - {section: "The Supper's vow", says: "link to four-cups; the vow stays open"}
  - {section: "Gethsemane: the cup the Father gave", says: "remove this cup / shall I not drink it"}
  - {section: "Golgotha: the cup refused", says: "myrrh/gall wine, Prov 31:6, Talmud custom, tasted and refused to stay awake"}
  - {section: "Golgotha: the cup received", says: "sour wine, why He took it (four reasons), reed, hyssop, two-sponges answered"}
  - {section: "The cup still to come", says: "wrath-cup for refusers, cup of blessing, marriage supper"}
  - {section: "Annex: how the two drinks became one", says: "Barnabas, Gospel of Peter, Irenaeus, Tertullian, Diatessaron, Byzantine Matt 27:34 merge the drinks; Origen"}
