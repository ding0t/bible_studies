stages:
  scoping:
    done: true
    notes: >
      Prompted by a review of thetabernacleman.com 'two sponges' post (Mark 15:35-36), judged
      not valid: σπόγγος occurs only Matt 27:48, Mark 15:36, John 19:29 (one event); the refused
      drink (Mark 15:23 / Matt 27:34) has no sponge. Author asked for a study and a passion series;
      this is the first study of the series. Backlog 2.1 lists "Passion" with no notes.
  exegesis:
    historical_context:
      done: true
      notes: >
        Myrrh-wine as stupefying drink: b. Sanhedrin 43a (William Davidson ed., Koren-Steinsaltz):
        court gives the condemned "a grain of frankincense in a cup of wine ... in order to confuse
        his mind", citing Prov 31:6; "prominent women of Jerusalem" donated it. Late (Babylonian
        Talmud) -- cite as later witness to a custom, not as proof of who offered at Golgotha.
        Sour wine (ὄξος / Heb חֹמֶץ) = cheap workers'/soldiers' drink: Ruth 2:14 LXX ὄξος (Boaz's
        reapers dip bread in it); CBSB and ESVSB notes on Luke 23:36, John 19:29.
        Sponge-on-stick (xylospongium/tersorium) real: Seneca Ep. 70.20 "lignum id quod ad
        emundanda obscena adhaerente spongia positum est" (verified, thelatinlibrary.com). No
        source ties it to crucifixion.
    literary_context:
      done: true
      notes: >
        Mark: refused drink at arrival, before crucifixion (15:22-24), imperfect ἐδίδουν "they were
        offering"; subject "they" = soldiers of 15:16-24 (NIV BTSB's "sympathizers" reads in the
        Talmud custom -- contested, give both). Sour wine after the cry of dereliction (15:34-36),
        offered with the Elijah taunt. Matthew same order (27:34, 48). Luke 23:36 soldiers' mocking
        offer of ὄξος, no sponge, no drinking reported. John: no refused drink at all; "I thirst"
        (19:28) "to fulfill the Scripture", received (19:30). John's 'hour' arc: 2:4 not yet ->
        12:23; 13:1 has come. Mother present only at Cana (2:1) and cross (19:25), "Woman" both
        (2:4; 19:26). Cup sayings: Mark 10:38-39; 14:36 (par. Luke 22:42); John 18:11.
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "ποτήριον", language: greek, transliteration: "potērion", strongs_id: "G4221", gloss: "cup", notes: "64 NT occurrences (count_only). OT background: cup of wrath Isa 51:17,22; Jer 25:15; Ps 75:8; Hab 2:16; cup of salvation Ps 116:13; Rev 14:10."}
        - {word: "σμυρνίζω", language: greek, transliteration: "smyrnizō", strongs_id: "G4669", gloss: "mix with myrrh", notes: "Only Mark 15:23 in NT (bible_concordance)."}
        - {word: "χολή", language: greek, transliteration: "cholē", strongs_id: "G5521", gloss: "gall, bitter substance", notes: "NT only Matt 27:34; Acts 8:23. LXX Ps 68:22 (Eng 69:21) has χολή AND ὄξος in one verse: 'ἔδωκαν εἰς τὸ βρῶμά μου χολὴν, καὶ εἰς τὴν δίψαν μου ἐπότισάν με ὄξος' (ebible-grcbrent). Hebrew רֹאשׁ (rosh, H7219) 'poison' + חֹמֶץ (chomets, H2558)."}
        - {word: "ὄξος", language: greek, transliteration: "oxos", strongs_id: "G3690", gloss: "sour wine, wine vinegar", notes: "NT: Matt 27:48; Mark 15:36; Luke 23:36; John 19:29 (x2), 19:30 -- 6 in SBLGNT. Majority text reads ὄξος at Matt 27:34 too (MSB footnote 'CT offered Him wine'; CSB AFSB footnote 'Other mss read sour wine'). LXX: Num 6:3 (Nazirite abstains), Ruth 2:14, Ps 68:22, Prov 32:20(LXX)."}
        - {word: "λαμβάνω", language: greek, transliteration: "lambanō", strongs_id: "G2983", gloss: "take, receive", notes: "Mark 15:23 οὐκ ἔλαβεν 'did not take'; John 19:30 ὅτε ἔλαβεν 'when he received'. Same verb across two Gospels: a canonical observation, not one author's design -- mark it so."}
        - {word: "τελέω", language: greek, transliteration: "teleō", strongs_id: "G5055", gloss: "finish, accomplish", notes: "τετέλεσται perfect passive at John 19:28 and 19:30; τελειόω (G5048) 'that the Scripture might be fulfilled/completed' 19:28 (LSB footnote: 'Lit Scripture would be finished')."}
        - {word: "πίνω (οὐ μὴ πίω)", language: greek, transliteration: "pinō", strongs_id: "G4095", gloss: "drink", notes: "John 18:11 emphatic double negative in a question: 'shall I not drink it?' expects 'I certainly shall'."}
        - {word: "γεύομαι", language: greek, transliteration: "geuomai", strongs_id: "G1089", gloss: "taste", notes: "Matt 27:34 γευσάμενος οὐκ ἠθέλησεν πιεῖν -- tasted, then refused: He identified it and chose."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Cultural: the drinks themselves (sedative wine, posca, sponge, hyssop). Transcultural: the Son's will joined to the Father's; He bore the wrath-cup consciously and fully; the cup of salvation given to us; the table still to come."
    theological_principle:
      done: true
      notes: "Jesus refused the cup that would have spared Him and drank the cup the Father gave, the cup of wrath, to its end; so the cup He hands His people is the cup of blessing and the wine of the wedding supper still to come (propitiation; substitution)."
    application_draft:
      done: false
      notes: "Statement-of-faith check: substitutionary atonement / wrath satisfied -- check wording at drafting."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Psalm 69:21", relation: "Matthew's χολή + ὄξος both from LXX Ps 68:22; John 19:28 'to fulfill the Scripture' (ESVSB, NIV BTSB: probably Ps 69:21; CBSB: some suggest Ps 22:15)"}
      - {ref: "Proverbs 31:6", relation: "wine for the perishing; cited by b. Sanh. 43a for the stupefying cup"}
      - {ref: "Isaiah 51:17, 22", relation: "cup of wrath drunk to the dregs, then taken from the people's hand"}
      - {ref: "Mark 10:38-39", relation: "'the cup that I drink' -- His own word for His death"}
      - {ref: "Matthew 27:30 / 27:48", relation: "same κάλαμος: the reed that struck Him lifts the sponge"}
      - {ref: "Exodus 12:22 / John 19:29", relation: "hyssop -- already in passover.md"}
      - {ref: "Revelation 14:10 / 19:9", relation: "the wrath-cup for those outside Christ; the supper for those invited"}
    translations_compared: ["ESV", "BSB", "MSB", "LSB footnotes", "CSB footnotes"]
    divergences_noted: "Matt 27:34 wine (CT) vs sour wine (Majority) -- the Majority reading assimilates to Ps 69:21 more fully; mention in one sentence."
  drafting:
    done: true
    file: "docs/content/jesus/the-cups-jesus-drank.md"
