reframe_2026-09-28:
  approved_by: "author, via coordinator"
  summary: >
    Reframed from "the priesthood passed Adam -> household heads -> firstborn -> Levites" to what
    Scripture shows: household heads offer sacrifice but are never called kohen; only outsiders
    (Melchizedek, Potiphera, Egypt's priests, Jethro) carry the title before Sinai; the Exod 19:22-24
    and 24:5 figures are contested (both sides given); God claims the firstborn and takes the Levites
    in their place for service, while the priesthood is Aaron's sons alone. Adam, Enoch and
    firstborn-as-priests moved into one "What later tradition added" section with confidence marked.
    Title now "Before Aaron: Who Offered Sacrifice?" (slug unchanged). Tags: dropped person/adam,
    added person/melchizedek. bible_references extended.
