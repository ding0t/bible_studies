        Levite census counts males from a month old so their number matches the firstborn.
        Redemption price five shekels per head (3:47) for the 273 surplus firstborn (3:43 vs
        3:39).
    literary_context:
      done: true
      notes: >
        Unit is Numbers 3:5-13 (duties 5-10, substitution 11-13), framed by 3:1-4 (Nadab and Abihu
        die, Eleazar and Ithamar serve) and 3:14-51 (census and redemption). 3:38 places Moses,
        Aaron and sons on the east side as shomerim of the sanctuary. The frame -- priests dying
        at the start, a surplus bought back at the end -- was new to this draft and supplies the
        "every holder is replaced" point from within the primary passage itself.
