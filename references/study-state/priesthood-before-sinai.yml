open_questions:
  - "The Eden-as-sanctuary / Adam-as-priest reading is marked contested and given both sides. Beale's The Temple and the Church's Mission (standard academic source for it) is still not available locally -- see melchizedek-priesthood.yml. The case against is argued from the text (Gen 2:5; 3:23; first kohen at 14:18), not from a named scholar; a named opposing commentator would strengthen it."
  - "Numbers 3:38's shomerim on the east side is offered as a parallel to the cherubim at Eden's east (Gen 3:24). The directional parallel is this study's observation, not drawn from a commentary -- author should judge whether it stays."
  - "Hebrews 12:23's 'assembly of the firstborn' is read with the ESVSB as Jesus' followers; NIV CBSB notes it may be God's people as a whole (Exod 4:22). The study does not pursue the Israel/church question there; consistent with statement-of-faith, but flag if the author wants the dispensational distinction stated."
  - "Rabbinic Melchizedek = Shem identification carried over from parent without a primary citation (e.g. b. Nedarim 32b); a citation would help."
  - "On publish: link this page from the parent's plain-text pointer (melchizedek-priesthood.md line ~155), run refresh_frontmatter_provenance.py, commentary_index.py and section_index.py."

