slug: "priesthood-before-sinai"
title: "Priesthood before Sinai: Adam, the Firstborn and the Levites"
status: review
target_path: "docs/content/jesus/priesthood-before-sinai.md"
primary_passage: "Numbers 3:5-13"
supporting_passages: ["Numbers 3:1-4", "Numbers 3:38-51", "Genesis 2:15", "Genesis 3:23-24", "Exodus 13:2", "Exodus 32:26-29", "Hebrews 5:4-5", "Hebrews 7:23-25", "Hebrews 12:23"]
genre: [law, ot-narrative, epistle, topical]
point: >
  God has always appointed His own priests: the office passed from Adam in Eden to the household
  heads of Genesis, then to Israel's firstborn and finally to Levi, reassigned by God after each
  failure -- the pattern Hebrews says Jesus' permanent priesthood ends.

thesis: >
  God has always chosen who serves Him as priest -- the household heads of Genesis, then Israel's
  firstborn, then the Levites in their place, and on a contested reading Adam before them all -- and
  every holder failed or died, until God appointed His Son Jesus, who "holds his priesthood
  permanently, because he continues forever" (Hebrews 7:24, ESV).
outline:
  - {section: "Opening + Numbers 3:12-13 quote", says: "'Instead of' means the office already had holders; Numbers 3 is one handover among several"}
  - {section: "Key Takeaways", says: "Jesus appointed, Jesus the last holder, Jesus makes His people priests; Heb 7:24-25 and 5:4; Think/Attitude/Do; prayer"}
  - {section: "Study outline", says: "added because the body passed 2,500 words with 6+ sections"}
  - {section: "Numbers 3 in its setting", says: "Sinai, year two; Nadab and Abihu die (3:4); Levite duties (3:5-10); 22,273 firstborn vs 22,000 Levites, 273 redeemed at five shekels; this shows God decides who draws near"}
  - {section: "Adam in the garden: a contested reading", says: "case for (avad/shamar pair, cherubim guard, tabernacle's east side guarded by shomerim, three study Bibles); case against (no kohen before Gen 14:18, avad + 'the ground' in 2:5 and 3:23); study holds it as a reading and builds nothing on it alone"}
  - {section: "Household priests: Noah and the patriarchs", says: "priesthood belongs to headship in Genesis (moved text)"}
  - {section: "From the firstborn to the Levites", says: "firstborn claimed (Exod 13:2), kingdom of priests (Exod 19:6), golden calf, tachat 'instead of' (Num 3:12; 8:16), Aaron's line (moved text + additions)"}
  - {section: "What the line sets up for Hebrews", says: "God appoints (Heb 5:4-5); every holder is replaced (Heb 7:11, 23-24); Melchizedek stands outside the line (moved text, tightened)"}
  - {section: "The priest who continues forever", says: "this shows God keeps the choice of who comes near and answers sin and death in His Son; Heb 7:25; assembly of the firstborn (Heb 12:23); Rev 1:6; lands in second person"}
  - {section: "Discussion Questions", says: "five: language, context, the hard part (earned vs taken), Christ, transformed"}
word_budget: 4000
word_budget_reason: ""

