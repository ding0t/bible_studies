slug: "priesthood-before-sinai"
title: "Before Aaron: Who Offered Sacrifice?"
status: published # 2026-09-28, author approved
target_path: "docs/content/jesus/priesthood-before-sinai.md"
primary_passage: "Numbers 3:5-13"
supporting_passages: ["Numbers 3:1-4", "Numbers 3:38-51", "Genesis 2:15", "Genesis 3:23-24", "Exodus 13:2", "Exodus 32:26-29", "Hebrews 5:4-5", "Hebrews 7:23-25", "Hebrews 12:23"]
genre: [law, ot-narrative, epistle, topical]
point: >
  Before Sinai the heads of families offered sacrifice but Scripture calls none of them a priest;
  God then appointed Aaron's sons and gave the Levites in place of the firstborn, because priesthood
  is always His appointment (Heb 5:4) -- and He appointed His Son Jesus, who holds it forever.

thesis: >
  Before Sinai the heads of families offered sacrifice for their households, yet Scripture calls none
  of them a priest; the title belongs to outsiders such as Melchizedek until God appoints Aaron's sons
  and gives the Levites to serve them in place of Israel's firstborn, because priesthood is always
  God's appointment (Hebrews 5:4), and He appointed His Son Jesus, who "holds his priesthood
  permanently, because he continues forever" (Hebrews 7:24, ESV).
outline:
  - {section: "Opening + Numbers 3:12-13 quote", says: "'Instead of' raises the question: who offered sacrifice before Aaron, and was any of them a priest?"}
  - {section: "Key Takeaways", says: "Jesus appointed, Jesus the last holder, Jesus makes His people priests (Rev 1:6; 1 Pet 2:9)"}
  - {section: "Study outline", says: "descriptive annotations"}
  - {section: "Numbers 3 in its setting", says: "Nadab and Abihu; Levites given to Aaron, priesthood Aaron's sons alone (3:9-10; 18:7); 22,273 vs 22,000; 'mine' three times"}
  - {section: "Before Sinai: fathers at the altar", says: "Noah, Abraham (22:13), Isaac, Jacob (31:54; 46:1), Job offer; kohen x7 in Genesis all outsiders; Jethro"}
  - {section: "At Sinai: priests before Aaron?", says: "Exod 19:22-24, 24:5 read two ways (NIVBTSB, ESVSB); Exod 19:6 with 1 Pet 2:5, 9"}
  - {section: "From the firstborn to the Levites", says: "Exod 13:2 claim; golden calf; tachat; Aaron named before the calf"}
  - {section: "What later tradition added", says: "firstborn (m. Zevachim 14:4), Adam (typology of Gen 2:15, Jubilees 3:27), Enoch (Jubilees 4:25 vs Gen 5:24, Heb 11:5, Jude 14), Melchizedek=Shem (Tg Ps-J, b. Ned 32b, Gen Rab 56:10)"}
  - {section: "What this sets up for Hebrews", says: "God appoints; every holder dies; Melchizedek the one priest of God Most High in Genesis"}
  - {section: "The priest who continues forever", says: "Heb 7:25; assembly of the firstborn; Rev 1:6; second person"}
  - {section: "Discussion Questions", says: "five: silence of kohen, Nadab/Abihu, instead-of exchange, earned vs taken, prayer as royal priesthood"}
word_budget: 4000
word_budget_reason: ""

