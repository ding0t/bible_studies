author_direction_2026-10-02: >
  "Treat [what the Supper does] as per the other moed. It is a type. A thing to remember and teach.
  It keeps us grounded, eyes set on truth. The cup not taken reminds us we are to finish with the
  Lord, likely at the wedding banquet. Link other study work. Back all with scripture ... not
  tradition." Applied: placed in feasts/ beside Passover and the four-cups study; structure follows
  passover.md (memorial -> children's question -> New Testament); Didache and Justin dropped as
  support; "This is my body" handled from Scripture's own sign language (Exod 12:11; 1 Cor 10:4;
  John 10:9) and the meal's three biblical names (remembrance, proclamation, participation), with
  the churches' disagreement marked contested in one sentence and no tradition cited. Graphics:
  three-tables (Passover -> Supper -> marriage supper) and the Corinth house reconstruction; the
  Didache one-loaf graphic dropped with the Didache.
