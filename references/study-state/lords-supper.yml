      Placement israel-and-church/ (ecclesiology: the church's ordinances).
  exegesis:
    historical_context:
      done: true
      notes: >
        1 Corinthians written from Ephesus, spring AD 53-55 (ESVSB intro; 16:8). 11:2-14:40 is
        disorder in corporate worship (ESVSB). 11:17-34 learned by oral report (11:18). NIV CBSB
        'Banquets in Corinth': status governed banquet seating and food; churches met in wealthy
        homes; average wealthy home reclined 9-12 on three couches in the triclinium, up to ~40 in
        the atrium; 'whatever the particulars' the wealthy minority (1:26) hosted. Latecomers may
        be labourers/slaves (NIV CBSB on 11:21). The Passover the Supper was modelled on was an
        intimate family meal centred on redemption.
    literary_context:
      done: true
      notes: >
        10:14-22 (flee idolatry: the cup/table of the Lord vs of demons, Israel 'participants in
        the altar') precedes; 11:2-16 head coverings; 11:17-34 the Supper; 12-14 gifts and the body.
        11:23 'received ... delivered' is tradition language (NIV CBSB; cf. 15:3). Paul's remedy
        is 11:33 'wait for one another'.
    content_word_studies:
      done: true
      notes: "All verified via bible_concordance / interlinear 2026-10-02."
      terms:
        - {word: "ἀνάμνησις", language: greek, transliteration: "anamnēsis", strongs_id: "G364", gloss: "remembrance, reminder", notes: "NT only Luke 22:19; 1 Cor 11:24, 25; Heb 10:3 (sacrifices a yearly 'reminder of sins'). LXX Lev 24:7 (memorial portion on the showbread), Num 10:10 (trumpets over offerings 'for remembrance before your God'), Ps 38/70 titles. Whether the remembrance is Godward or manward is contested -- mark it."}
        - {word: "κοινωνία", language: greek, transliteration: "koinōnia", strongs_id: "G2842", gloss: "participation, sharing", notes: "19x NT. 1 Cor 10:16 twice. ESVSB: align with Jesus, share His sufferings, benefit from His death; contrast 10:18-21."}
        - {word: "κυριακός", language: greek, transliteration: "kyriakos", strongs_id: "G2960", gloss: "belonging to the Lord", notes: "NT only 1 Cor 11:20 and Rev 1:10."}
        - {word: "καταγγέλλω", language: greek, transliteration: "katangellō", strongs_id: "G2605", gloss: "proclaim", notes: "1 Cor 2:1; 9:14; 11:26 -- Paul's word for preaching the gospel."}
        - {word: "ἀναξίως", language: greek, transliteration: "anaxiōs", strongs_id: "G371", gloss: "unworthily", notes: "NT only 1 Cor 11:27; an adverb (manner of eating)."}
        - {word: "διακρίνω", language: greek, transliteration: "diakrinō", strongs_id: "G1252", gloss: "discern, judge rightly", notes: "1 Cor 11:29 and 11:31; wordplay with krima (11:29), krinō, katakrinō (11:32)."}
        - {word: "εὐχαριστέω", language: greek, transliteration: "eucharisteō", strongs_id: "G2168", gloss: "give thanks", notes: "1 Cor 11:24; source of 'Eucharist' (Didache 9; Justin 1 Apol. 66)."}
        - {word: "κλάσις", language: greek, transliteration: "klasis", strongs_id: "G2800", gloss: "breaking", notes: "NT only Luke 24:35; Acts 2:42."}
