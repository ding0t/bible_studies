    file: "docs/content/assets/img/lords-supper-four-directions.svg"
    shows: "The Supper's four directions: back (remember His death), up (share in Christ), around (one bread, one body), ahead (proclaim until He comes) -- each with its verse and Greek word."
  - id: svg-2
