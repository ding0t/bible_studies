    shows: "Floor plan of a wealthy Corinthian house: triclinium with three couches (9-12 reclining, host's food and wine) beside the atrium (up to 40, latecomers, little food). Labelled with 1 Cor 11:21-22, 33. Marked as a reconstruction from the NIV CBSB 'Banquets in Corinth' article."
  - id: svg-3 (optional)
    file: "docs/content/assets/img/lords-supper-one-loaf.svg"
    shows: "Didache 9:4 beside 1 Cor 10:17: scattered grain on the hills gathered into one loaf, one body. Could fold into svg-1 instead."
graphics_constraints: "Content column ~560px (diagrams.md). Design viewBox ~640 wide, text >= 15 units so it renders >= 13px. Fixed colours with own background (an <img> SVG cannot read the site's dark-mode variables). title + desc for accessibility; full alt text in the markdown, as new-jerusalem.md does."

stages:
  scoping:
    done: true
    notes: >
