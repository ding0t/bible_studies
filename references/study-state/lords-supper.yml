  - "Numbers 10:10"
  - "Leviticus 24:7"
  - "Revelation 1:10"
genre: [epistle, gospel, acts, topical]

thesis: >
  The Lord's Supper is the meal Jesus gave His church to remember His death, to share in His body
  and blood, to show that we who eat one bread are one body, and to proclaim His death until He
  comes; so you come to it examined, reconciled to your brothers and sisters, and waiting for one
  another and for Him.
outline:
  - section: "What the meal is called"
    says: "The Lord's supper (kyriakos, only here and 'the Lord's day', Rev 1:10), the breaking of bread (Acts 2:42; 20:7; Luke 24:35), the Eucharist (eucharisteo, 1 Cor 11:24; Didache 9; Justin). Points to the four-cups study for the night itself."
  - section: "What Paul handed on (1 Cor 11:23-26)"
    says: "Received and delivered: the words of institution as the church's tradition, with their two commands to remember."
  - section: "Four things the Supper does"
    says: "Remember (anamnesis: Luke 22:19, 1 Cor 11:24-25 against Heb 10:3's yearly 'reminder of sins'); share (koinonia, 1 Cor 10:16, with the altar and the table of demons, 10:18-21); be one body (10:17; Didache 9:4); proclaim until He comes (katangello, 11:26). SVG 1."
  - section: "What went wrong at Corinth (11:17-22)"
    says: "Banquet by rank in a host's house; the rich eat first, the poor go hungry; 'it is not the Lord's supper that you eat.' SVG 2 (reconstruction, marked)."
  - section: "Coming in a worthy manner (11:27-32)"
    says: "anaxios (NT hapax) describes the manner of eating; examine yourself (dokimazo); discern the body (diakrino; two readings, and the 11:29 variant adding 'unworthily' and 'Lord's'); the judgment word chain; discipline so as not to be condemned."
  - section: "Wait for one another (11:33-34)"
    says: "Paul's remedy; Didache 14 on reconciliation before breaking bread."
  - section: "'This is my body': how Christians have read it"
    says: "Contested; the four main positions set out fairly (ESVSB note on 11:24; Justin 1 Apol. 66 claimed by all sides). Site position to be supplied by the author."
  - section: "Theological principle / Until He comes"
    says: "Church-age ordinance between the cross and the kingdom table; links to four-cups for the undrunk cup."
word_budget: 4000
word_budget_reason: ""

graphics_plan:
