primary_passage: "Genesis 11:10-32"
genre: [topical]

parent_review: "references/study-state/genealogy-calendar-review.yml"
relationship: >
  Third and last page of the chronology set. genealogy-times.md holds the ELASTIC zone (manuscript
  evidence above Abraham); chronology-anchors.md holds the RIGID zone (41 datable events below him);
  this page puts both on one line and explains why the timeline has that shape at all. It carries no
  evidence of its own -- every figure is derived from the generator or quoted from the other two --
  so it should never be the place a claim is first made.

stages:
