  exegesis:
    historical_context: {done: true, notes: "No new exegesis. The anchoring chain (Gen 12:4, Gal 3:17, Acts 7:4, 1 Kgs 6:1) is set out in the other two pages and referenced here."}
    literary_context: {done: true, notes: "The structural observation the page rests on: Genesis 5 and 11 give age-at-heir-birth for nineteen consecutive generations (ten Adam to Noah, nine Shem to Terah) and stop dead at Terah -- the 'twenty' first written here was corrected by the 2026-08-22 review, which is why the method changes there and the timeline has a hinge rather than a gradient."}
    content_word_studies: {done: true, terms: [], notes: "None. Deliberately -- this is a synthesis page."}
