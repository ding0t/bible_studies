review_2026_08_22:
  reviewer: "review-bible-study skill, full 8-phase adversarial pass"
  scope: "combined-timeline.md (newly published, never reviewed) plus the substantial edits made the same day to chronology-anchors.md and genealogy-times.md. All three live (draft: false), which raised the priority of every finding."
  phase_1_scripture: "No block quotes on combined-timeline. Inline citations (Gen 12:4, Gal 3:17, Acts 7:4, 1 Kgs 6:1, Gen 11:26) all spot-checked against study-notes.db and confirmed to say what is claimed."
  phase_2_citations: "All 9 internal links resolve, including the #where-year-0-sits anchor on zadok-calendar.md. Bur-Sagale verified at 15 June 763 BC proleptic Julian; identification undisputed since Rawlinson 1867. No Hebrew in these files, so no bold-wrap risk."
  phase_3_word_studies: "None on combined-timeline, deliberately. The two Greek terms on chronology-anchors (oikodomethe, naos) were derived during drafting and not re-opened."
  phase_4_synthetic_claims: >
    THE PHASE THAT MATTERED -- these are chronology pages, so nearly everything is a synthetic claim.
    TWO CRITICAL ERRORS FOUND AND FIXED, both stated in the study's own voice:
    (1) "The Septuagint's chain is nearly twice the Samaritan's" -- actual ratio 1.505x. The
        near-double relation holds against harmonized_v1 (1.900x), not the Samaritan. The sentence
        named the wrong comparator and sat directly under the bar chart that disproves it.
        Now: "half as long again as the Samaritan's, and nearly twice harmonized_v1's."
    (2) "twenty consecutive generations" with age-at-heir-birth data -- actual count 19 (ten Adam
        to Noah, nine Shem to Terah). Re-derived from source data, not recounted from prose.
    ONE MODERATE: "twenty-seven of them are datable to within a year" conflated the FIXED TIER
    count with the ERROR BAR. Of the 27 Fixed, two carry +/-2 and +/-3; and 31 entries overall are
    within a year once the six Anchored +/-1 entries are included. Appeared as the opening bold
    claim of chronology-anchors.md and again on combined-timeline.md. Both now say thirty-one, and
    chronology-anchors gained a sentence stating that tier and precision are different axes.
    VERIFIED CLEAN: the 1,646-year creation spread; all four variants at Abraham 1996 BC; bar-chart
    values 1828/2008/2309/3474; three-of-four Terah convergence at 2126 BC; the 45-year shift
    uniform across all eight rigid-zone rows; 41 rows with tiers 27/10/4; sabbatical intervals 28
    and 98, both exact multiples of seven; Samaritan chapter split re-derived at 6-0 and 0-6.
  phase_5_commentary: >
    NLT Life Application Study Bible checked on Genesis 11:10-32 (not cited by any of the three
    pages). CONFIRMS: its textual note at Genesis 11:32 reads "Some ancient versions read 145
    years; compare 11:26 and 12:4" -- pointing at exactly the two verses the Terah puzzle turns on
    and treating 145 as the reconciling reading. Independent support for harmonized_v1's Terah
    substitution that the site had not been using. Now cited in genealogy-times.md's Terah section
    and its references.
  phase_6_context: >
    combined-timeline is a synthesis page carrying no evidence of its own, so genre, historical
    occasion, original-language and cultural-vs-transcultural are all absent by design and the
    state file records that. Literary context IS covered -- the Genesis 5/11 formula stopping dead
    at Terah is what gives the timeline a hinge rather than a gradient. Not raised as findings.
  phase_7_placement: >
    last-things/ correct, alongside the other two chronology pages. Tags clean. MINOR FIXED: five
    of eleven bible_references were never cited in the body. Genesis 21:5, 25:26 and 47:9 belong to
    the 430-in-Egypt chain, which this page does not use, and were removed; Genesis 7:11 and
    Exodus 12:40-41 are genuinely load-bearing and are now cited in the prose instead.
  phase_8_style: >
    Both new pages clean -- 0.13 and 0.21 em-dashes per sentence, zero instances of the
    negative-definition rhythm, no `worth ___`, no reader-reassurance. MINOR FIXED: "and it is what
    this page exists to show" cut from the opening (study narrating itself). A dangling em-dash
    aside introduced by the finding-2 fix was caught and repaired before completion.
    NOT FIXED, pre-existing and outside this work's edits: genealogy-times.md runs 0.49 em-dashes
    per sentence and carried 9 `worth ___` instances (now 8 -- one was removed incidentally while
    adding the NLT note, since it was also a virtue contrast). Flagged for a separate style pass.
  outcome: "All Critical and Moderate findings fixed and re-verified by fresh computation. npm run validate 10 warnings (unchanged, none on these files); npm test 21/21; mkdocs build --strict clean."
