main_findings:
  the_hinge: >
    ALL FOUR manuscript variants put Abram's birth at 1996 BC, to the year, while disagreeing about
    creation by 1,646 years (harmonized_v1 3824 BC to LXX 5470 BC). This is the anchoring working as
    designed, not independent agreement between the traditions -- every variant is measured back
    from the same Exodus, and the chain from Abraham to the Exodus uses figures none of them
    dispute. Worth stating explicitly on the page so the convergence is not mistaken for
    corroboration.
  three_of_four_converge_earlier: >
    MT, LXX and SP also agree on Terah's birth at 2126 BC. harmonized_v1 differs (2066 BC) only
    because it reads Genesis 11:26's 70 plainly, which the Samaritan 145-year Terah allows.
  two_zones: >
    Above Abraham both the AM year and the Gregorian date move, and they move by MANUSCRIPT.
    Below Abraham the Gregorian dates are fixed by contemporary documents and astronomy, and only
    the AM label moves, by EPOCH SCENARIO -- a uniform 45-year shift, not a stretch. The two open
    questions are therefore independent: choosing a manuscript tradition settles nothing about the
    epoch, and vice versa.
  elastic_zone_lengths: "Years from creation to Abraham: harmonized_v1 1828, MT 2008, SP 2309, LXX 3474."

open_questions:
  - "Figures are quoted under the ACTIVE epoch scenario (ussher_published). If the epoch is ever changed, the elastic-zone table's Gregorian column and the rigid-zone AM columns both need regenerating from references/build/genealogy_chronology.py. The AM column in the elastic table does not move."
  - "The rigid-zone table shows only two of the four tracked scenarios (active and a_prime) to stay readable. Full set is in docs/data/genealogy/index.json and on zadok-calendar.md."
  - "No mermaid diagram on this page has been eyeballed in a browser -- no browser tooling was available. The xychart-beta bar chart in particular is a type this site has used only since 2026-08-18."

