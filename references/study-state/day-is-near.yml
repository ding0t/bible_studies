  - {type: dictionary, title: "TWOT (Theological Wordbook of the Old Testament)", author: "Archer, Harris & Waltke", note: "root 2323 (shabat, 'cease') via twot_strongs MCP tool"}
  - {type: commentary, title: "ESV Study Bible", author: "Crossway, 2016", note: "notes on Heb 4:1-13, 4:8-10; 2 Pet 3:1-13, 3:8-10; Acts 1:6-11, 1:11; Matt 24:1-14, 24:5-8 -- consulted last, after independent word-study draft; confirmed Heb 4 reads as gospel-rest not explicitly millennial, and Acts 1:11 as manner-not-timing, both of which changed how the redraft frames those two sections rather than just confirming what was already written"}
