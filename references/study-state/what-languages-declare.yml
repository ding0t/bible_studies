genre: [ot-narrative, topical]

thesis: >-
  At Babel God divided one language in a single act, and the shape of the world's languages today,
  hundreds of lineages with no common trunk, is what that act leaves behind; the long common ancestry
  that does without Babel has to assume language growth stood almost still for tens of thousands of
  years, a stillness no recorded family shows.

outline:
  - section: "Hook + In one sentence + series link"
    says: "Seventy nations, 7,674 languages, 429 lineages; drift would leave a fifth of core words shared."
  - section: "Key Takeaways"
    says: "Zephaniah 3:9 prophecy; Pentecost, Revelation 5:9 and Genesis 12:3 about Jesus; memory verses Genesis 11:9 and Revelation 7:9; Think/Attitude/Do; prayer."
  - section: "Part one: Genesis 10 first, then its cause"
    says: "lashon in ch. 10, the outcome; 11:1-9 the cause, dated by Peleg."
  - section: "Part one: One lip, and the verb that broke it"
    says: "saphah, devarim achadim, let us / let us, puts reversed, balal/Bavel, LXX Synchysis; God acts at a stroke, on speech, scattering in mercy (Deuteronomy 32:8; Acts 17:26-27)."
  - section: "Part one: Genesis 10 groups nations by descent, land and language"
    says: "Canaan and Elam; no language count in Genesis."
  - section: "Part two: 429 lineages and no common trunk"
    says: "Glottolog 5.3; comparative method's reach; chart no-common-trunk."
  - section: "Part two: The decay test"
    says: "Lees/Swadesh band; 17-29% at 2103 BC; three models; young+gradual ruled out; Babel required within the Bible's chronology. Chart decay-test."
  - section: "Part two: How fast tongues multiply"
    says: "Author's added emphasis (2026-10-20): the case against long common ancestry. Babel needs a 609-yr doubling, slower than every recorded family; one tongue 50k/100k years ago needs 3,874/7,748, 10-30x slower, i.e. an assumed birth/death balance. Chart how-fast-tongues-multiply."
  - section: "Part two: Two more facts to weigh"
    says: "Every known language complete (Sapir 1921); speech old, writing young."
  - section: "Part two: The first written witnesses"
    says: "Chart first-written-witnesses; IE all after Peleg; pre-Flood writing on conventional dates linked to king-lists."
  - section: "Part two: Speech and writing have different family trees"
    says: "Added at the author's request (2026-10-20): writing invented a few times and spread by borrowing across language lines; speech shows the break; Genesis 11:7 targets hearing (shama)."
  - section: "Annex: Babel in Sumerian memory"
    says: "Enmerkar 134-155, tense disputed; distorted memory at most."
  - section: "Annex: Chinese characters and the creation story"
    says: "Kang & Nelson; Shuowen 船 and 禁 as sound+meaning compounds; oracle bones post-Moses; left out."
  - section: "Part two: Where this argument is weak"
    says: "Decay test neutral vs deep time; 70 vs 429; Indo-European timing (Kanesh 1900 BC vs Heggarty 8,100 BP; Atkinson bursts); Pagel."
  - section: "Part three: what languages declare"
    says: "Acts 2:6 synecho echo; Medes and Elamites; languages kept; Revelation 7:9, 5:9; Zephaniah 3:9 in the kingdom; God judges pride, rules the nations, redeems them; so you may pray."
