slug: discussion-questions-sweep-2026-10
title: "Bring every discussion-question set up to the facet-labelled format"
status: in-progress
started: 2026-10-10

benchmark: >
  christian-life/hurt-by-the-church.md, "## Discussion questions": each question opens with its
  facet in bold (The language. / The text in its context. / Christ. / The hard part. /
  Be transformed.), is rooted in a named text, and the set ends on Be transformed. Format codified
  in .claude/skills/develop-bible-study/discussion-questions.md "The format"; validator Check 25
  flags the gap. 2026-10-10 count: 92 sets, 26 labelled, 70 files flagged (66 unlabelled with no
  Be transformed question, 4 labelled but missing it).

pass: >
  Rewrite each set against the study as it now stands, using discussion-questions.md's facet
  table and rules. Include only the facets the study earned (no language question without a word
  study in the body). Keep any existing question that is still good -- relabel it rather than
  rewrite it. Root each question in a named text and quote ESV verified against study-notes.db
  (study_verse), never from memory. Touch only the Discussion questions section. Normalise
  variant labels (Language., Context., You.) to the canonical five.

waves: ~4 studies per agent wave, author approves each wave before the next.
commits: 'one per study, "docs(<section>): label discussion questions in <study>".'

