    notes: "No backlog entry and no existing study on Ezekiel 9. Filed christian-life (practical theology: the believer's heart toward sin). Not sin/, because the subject is the godly response, not a form of sin."
  exegesis:
    historical_context:
      done: true
      notes: "Ezekiel 8:1 dates the vision to the sixth year, sixth month, fifth day of Jehoiachin's exile (about September 592 BC). Ezekiel is a priest in Babylon (Ezekiel 1:3), transported in vision to Jerusalem (Ezekiel 8:3). Jerusalem falls in 586 BC. The temple still stands at the time of the vision."
    literary_context:
      done: true
      notes: "Unit is chs. 8-11 (temple vision; glory departs 10:18-19; 11:23). Chapter 8: 'do you see' at 8:6, 12, 15, 17; elders say 'The LORD does not see us' (8:12), repeated 9:9. 8:18 'though they cry in my ears with a loud voice' answered by 9:1 'he cried in my ears with a loud voice' (ESV note). Ezekiel 9:8 the prophet intercedes; 11:13 again. Ezekiel 11:19-20 promises the new heart in the same vision."
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "נֶאֱנָחִים", language: hebrew, transliteration: "ne'enachim", strongs_id: "H584", gloss: "sighing, groaning", range_of_meanings: [], notes: "Niphal participle. 12 verses in MACULA WLC: Exod 2:23; Ezek 9:4; 21:6-7 (Heb 21:11-12); Isa 24:7; Jer 22:23; Joel 1:18; Lam 1:4, 8, 11, 21; Prov 29:2. God hears it in Exodus 2:23-24."}
        - {word: "נֶאֱנָקִים", language: hebrew, transliteration: "ne'enaqim", strongs_id: "H602", gloss: "groaning, crying out", range_of_meanings: [], notes: "Niphal participle. 4 verses: Ezek 9:4; 24:17; 26:15; Jer 51:52. Ezek 24:17 is the prophet's silent groan at his wife's death."}
        - {word: "תָּו", language: hebrew, transliteration: "tav", strongs_id: "H8420", gloss: "mark, signature", range_of_meanings: [], notes: "3 occurrences: Ezek 9:4, 6; Job 31:35 ('Here is my signature'). Verb תָּוָה (H8427) in Ezek 9:4 and 1 Sam 21:13 (Eng.) only."}
        - {word: "קוּט", language: hebrew, transliteration: "qut", strongs_id: "H6962", gloss: "feel loathing", range_of_meanings: [], notes: "8 verses: Ezek 6:9; 20:43; 36:31; Job 8:14; 10:1; Ps 95:10; 119:158; 139:21. God is subject in Ps 95:10."}
        - {word: "שָׁבַר", language: hebrew, transliteration: "shavar", strongs_id: "H7665", gloss: "break", range_of_meanings: [], notes: "Ezek 6:9 MT נִשְׁבַּרְתִּי 'I was broken'. LXX ὀμώμοκα 'I have sworn' (read שבע). ESV, NASB, NIV, CSB, LSB, NKJV, NLT all keep MT sense."}
        - {word: "לֵבָב", language: hebrew, transliteration: "levav", strongs_id: "H3824", gloss: "heart", range_of_meanings: [], notes: "1 Sam 13:14 כִּלְבָבוֹ 'according to his heart'. NIV/NKJV Cultural Backgrounds: 'of his own choosing', from Babylonian royal idiom. Acts 13:22 adds 'who will do all my will'."}
        - {word: "πενθέω", language: greek, transliteration: "pentheō", strongs_id: "G3996", gloss: "mourn", range_of_meanings: [], notes: "Matt 5:4 and 1 Cor 5:2 use the same verb."}
        - {word: "λυπέω", language: greek, transliteration: "lypeō", strongs_id: "G3076", gloss: "grieve", range_of_meanings: [], notes: "Eph 4:30, same verse as 'sealed' (σφραγίζω G4972)."}
        - {word: "συλλυπέω", language: greek, transliteration: "syllypeō", strongs_id: "G4818", gloss: "be grieved with", range_of_meanings: [], notes: "Mark 3:5."}
        - {word: "βασανίζω", language: greek, transliteration: "basanizō", strongs_id: "G928", gloss: "torment", range_of_meanings: [], notes: "2 Pet 2:8, imperfect: Lot kept tormenting his righteous soul."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Tied to its time: the physical mark, the executioners, Jerusalem 586 BC. Transcends it: God sees, God distinguishes His own in judgment, and the sign He looks for is a heart that grieves over sin as He does."
    theological_principle:
      done: true
      notes: "The heart that belongs to God feels about sin what God feels: grief that holds both hatred of the sin and no pleasure in the sinner's death. God gives that heart (Ezek 36:26) and seals it (Eph 1:13). Grief is the evidence of belonging, not its price. Taught explicitly in Matt 5:4; 1 Cor 5:2; 2 Cor 7:10; Rom 12:9."
    application_draft:
      done: true
      notes: "Be Transformed: God sees and feels; let grief start with your own sin (Ps 139:23-24); name one thing laughed at that God calls an abomination and pray over it."
