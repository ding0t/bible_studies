thesis: "God marks as His own those whose hearts break over what breaks His: in Ezekiel 9 the scribe set the tav on everyone who sighed and groaned over Jerusalem's abominations, and in Christ God gives that heart and seals it with His Spirit, who Himself can be grieved."
outline:
  - section: "The vision: Ezekiel 8-9"
    says: "In 592 BC God takes the exiled priest on a tour of the temple's abominations, asking four times 'do you see?', while the elders say 'The LORD does not see.' Chapter 9 is God's answer: He sees, and He sees who grieves."
  - section: "What grieves God"
    says: "God is grieved by sin (Genesis 6:6; Psalm 78:40; Isaiah 63:10; Ezekiel 6:9 'I have been broken'), and He takes no pleasure in the death of the wicked (Ezekiel 18:23; 33:11). His grief holds both."
  - section: "The mark on the forehead"
    says: "Ezekiel 9:4 word study: ne'enachim / ne'enaqim (H584, H602), Niphal participles of ongoing groaning; tav (H8420), a plain mark or signature (Job 31:35); the criterion is grief, and the man in linen is sent to look for it before the six executioners strike."
  - section: "The test: who groans, and when"
    says: "Everyone in Jerusalem would groan (Ezekiel 21:6-7; Lamentations 1:4, 8, 11, 21). The marked groaned over the sin before the judgment; the rest groaned over the judgment after it. Amos 6:6 and 1 Corinthians 5:2 name the failure: not grieved. Judgment began at the sanctuary (Ezekiel 9:6; 1 Peter 4:17)."
  - section: "A heart after God's own"
    says: "1 Samuel 13:14 is contested (God's choice vs. David's heart); Acts 13:22 and Jeremiah 3:15 join choice to character. The same feeling crosses from God to His people: qut (H6962) is God's loathing in Psalm 95:10, the psalmist's in Psalm 119:158, and the restored remnant's toward its own sin in Ezekiel 6:9; 36:31. Psalm 119:136, Ezra 9:4 and Lot (2 Peter 2:8) show the same heart."
  - section: "Jesus: the heart wholly God's"
    says: "Jesus is grieved at hard hearts (Mark 3:5), weeps over the city (Luke 19:41), and carries the reproaches aimed at God (Psalm 69:9; Romans 15:3). He loves righteousness and hates wickedness (Hebrews 1:9)."
  - section: "God chose by looking on the heart"
    says: "1 Samuel 16:1 'I have seen for myself a king' and 16:7 'the LORD looks on the heart' join the choice and character readings; Psalm 78:70-72. Acts 13:22 is a composite (Psalm 89:20 + 1 Samuel 13:14 + Isaiah 44:28, said of Cyrus), so it does not decide the 13:14 question."
  - section: "The mark now"
    says: "God promised the new heart and His Spirit (Ezekiel 11:19; 36:26-27). Believers are sealed by the Spirit who can be grieved (Ephesians 1:13; 4:30) and who groans in them (Romans 8:26). The seal is God's act; the grief is what it looks like from outside (2 Timothy 2:19). The pattern returns in Revelation 7:3; 9:4."
  - section: "Annex: the tav and the cross"
    says: "Paleo-Hebrew tav was an X or + shape; Aquila and Theodotion transliterated it, and Tertullian (Against Marcion 3.22) read it as the cross. A later Christian reading, marked as such."
