    departures_from_text: "The cloud is drawn as a rising column and could read as smoke; the first attempt also had elders holding staffs and few visible almonds, both fixed here."
    embed: |
      ![Painting at dawn of an old man seen from behind at the entrance of a goat-hair tent inside a linen-curtained court, holding up a wooden staff covered in leaves, white almond blossoms, buds and green almonds, before tribal chiefs holding bare staffs, with the tents of a great desert camp beyond](../../assets/img/heavenly-pattern/aarons-staff-morning.jpg){ loading=lazy }
      *Moses brings out the staffs: "and they looked, and each man took his staff" (Numbers 17:9, ESV).
      AI-generated illustration; the arrangement of the scene is not described in Numbers.*
    grounded_in: "Num 17:9 (brought out to all the people; they looked; each took his staff); Num 17:8 (sprouted, buds, blossoms, ripe almonds); Num 17:2-3 (names written on the staffs); Exod 26:7, 14 (goat-hair and red-dyed ram-skin coverings); Exod 27:9-16 (linen court hangings, coloured east gate screen); Num 9:15-16 (the cloud over the tabernacle)."
    prompt: |
      A realistic oil painting in warm, natural light, wide landscape format (3:2). Early morning in
      the wilderness of Sinai, about 1400 BC.

      In the middle distance stands the wilderness tabernacle. It is a long, low tent covered in dark
      goat-hair cloth with an outer layer of ram skins dyed red. It stands inside a rectangular court
      of white linen curtains hung on bronze-based posts, with an embroidered entrance screen of blue,
      purple and scarlet. Above the tent hangs a soft, still pillar of white cloud. It is cloud, not
      smoke: billowy and luminous, resting quietly, with no fire beneath it and no dark plume.

      In the foreground, just outside the court, an old man seen from behind and slightly to one side
      (Moses, no face visible) holds up a single wooden staff in his right hand. That staff alone has
      come alive overnight. Along its whole length it carries fresh green almond leaves, a few pink
      buds, open almond blossoms (five white petals, each with a deep pink centre), and at least as
      many clusters of RIPE almonds as blossoms. The almonds are mature: plump, velvety grey-green
      hulls, many split open to show the pale tan, pitted shell inside. Draw it botanically accurate,
      like a real flowering and fruiting almond branch, but growing from an old, dry, cut walking staff.

      With his left arm he carries exactly twelve other staffs, plain, dry and bare, each about as tall
      as a man, with a few short marks cut near the top. He carries them HORIZONTALLY, as a bundle laid
      across the crook of his bent left arm and cradled against his side, the way a man carries a
      bundle of long poles. His left hand grips the bundle from below, and the ends stick out level in
      front of and behind him. His arm and hand must be anatomically natural, with the elbow bent and
      the forearm under the bundle.

      Facing him in a loose half-circle are about a dozen tribal elders in simple Late Bronze Age
      Semitic dress: undyed and earth-coloured wool robes, mantles with coloured borders, head cloths,
      sandals. Their hands are EMPTY; none of them holds a staff. They are small in the frame and turned
      toward the blossoming staff, mostly seen from the side or behind, with no detailed faces.
      Behind them, the tents of a vast camp stretch across a pale desert plain to bare mountains, with
      the low sun at the left horizon.

      Mood: hushed, awed, the moment before Moses hands each man back his own bare staff.

      Do NOT include: halos, light beams, glowing or radiating objects, angels, a visible face of God
      or any divine figure, smoke or fire above the tent, a menorah, a Star of David, any lettering,
      modern almond orchards, Roman or medieval clothing, metal armour, camels in the foreground, more
      than twelve staffs in the bundle, any staff held by the elders, a vertical or upright bundle, or
      text or a signature.
