thesis: >
  God put the almond, whose Hebrew name sounds like "watching", into His tent twice: as the
  lampstand's gold blossoms and as Aaron's dead staff that budded, flowered and bore ripe almonds in
  one night to end the argument over whom He had chosen to come near Him; both show the God who
  watches over His word to perform it, and who settled the priesthood for good by raising Jesus,
  the High Priest appointed "by the power of an indestructible life" (Hebrews 7:16).
outline:
  - section: "Hook + In one sentence + Key Takeaways + Study outline"
    says: "Moses walks into the tent at dawn and finds one stick of twelve-plus-one in fruit."
  - section: "The tree that watches"
    says: "shaqed (H8247) and shaqad (H8245) share TWOT root 2451; Jeremiah 1:11-12 makes the pun; first tree to bloom (ESV SB); Jeremiah 31:28 God watches to build and plant. Every other almond in the OT in one paragraph: Genesis 43:11 (choice fruit of the land), Genesis 30:37 (luz, H3869), Ecclesiastes 12:5 (white hair of age, verb contested)."
  - section: "An almond tree of gold"
    says: "Short, linking to lampstand.md rather than repeating it: meshuqqadim (6x, all the lampstand), its kaftor and perach."
  - section: "Whom God chooses (Numbers 16-17)"
    says: "Korah's challenge and Moses' answer 'the one whom he chooses he will bring near' (16:5); matteh = staff and tribe; twelve staffs and Aaron's (ESV SB: 13); laid 'before the testimony, where I meet with you'; four verbs overnight: sprouted, perach, tsits, ripe almonds."
  - section: "The blossom on the lampstand and on the priest's forehead"
    says: "Shared vocabulary, marked as such: perach is the lampstand's word for its flowers (Exodus 25:31-34; Numbers 8:4); tsits is the gold plate 'Holy to the LORD' on Aaron's forehead (Exodus 28:36; 39:30; Leviticus 8:9). The text states the words; the meaning is inference."
  - section: "A sign for the rebels, kept before the testimony"
    says: "Numbers 17:10-13: the sign ends grumbling 'lest they die'; Numbers 18 gives the priesthood as a gift that guards the approach. Where the staff went: Numbers 20:9 'from before the LORD' (NIV BTSB: most likely this staff; contested); Hebrews 9:4 in the ark; 1 Kings 8:9 only the tablets -- link ark.md, don't redo it."
  - section: "The Priest God chose"
    says: "Hebrews 5:4-6 states the principle (called by God, as Aaron was); 7:16 'indestructible life'. The staff as a type of resurrection is resemblance, not stated in the NT -- mark it. Psalm 110:2's 'mighty scepter' is matteh: shared word only."
  - section: "What the almond shows about God"
    says: "Principle; confidence table (stated / echoed / inferred / tradition)."
  - section: "Discussion questions; References"
    says: ""
