  - "Matt 22:11-13: whether the host supplied the wedding garment has no first-century evidence the study can cite; left as contested."
  - "ON PUBLISH: publish together with the shortened 'Two garments' in judgment-seat-of-christ.md, which links here. Offer the author links from we-shall-all-be-changed.md and rapture.md (published; need approval)."
  - "Rev 19:13 'robe dipped in blood' (His own or His enemies', Isa 63:1-3) left out: contested and not needed for the thesis. Fork candidate with Isaiah 63."
