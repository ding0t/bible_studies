review_2026-10-15:
  reviewer: "independent review-bible-study pass (separate session from drafting)"
  checked: >
    Every ESV quotation (37 verses) against study-notes.db; all verbatim. Strong's numbers and counts
    for στολή, λευκός, λευκαίνω, πλύνω, βύσσινος, δικαίωμα, ἄξιος (MACULA SBLGNT, count_only); לָבַשׁ
    hiphil at Gen 3:21, Isa 61:10, Zech 3:4 and צְדָקָה at Isa 61:10 / 64:5 Heb (morphhb-wlc, MACULA);
    LXX Ps 50:9, Isa 1:18, Theodotion Dan 12:1, 10 (Brenton); Rev 22:14 in SBLGNT, Tischendorf, TR, Byz,
    KJV and the CSB AFSB footnote; ESV SB notes on Rev 3:4-5, 4:4, 7:13-14, 19:7-8, Matt 22:11; NIV CBSB
    and NIV BTSB on Matt 22:11. All links and anchors resolve. Statement of faith: Declared righteous,
    Reward for the believer, End times. Siblings: judgment-seat-of-christ, we-shall-all-be-changed,
    rapture, saved-as-through-fire, the-restrainer.
  found_and_fixed:
    - "Intro 'Revelation puts God's people in white eight times': the eight table scenes include 19:8 and 22:14, whose garments are not called white. Reworded to 'eight scenes of white robes and bright linen'."
    - "'In Sardis ... had soiled theirs (Revelation 3:4)': 3:4 names the few who had NOT; reworded to 'all but a few names'."
    - "'Same verb in the same form': Gen 3:21 wayyiqtol, Isa 61:10 perfect, Zech 3:4 infinitive absolute -- same hiphil stem, not same form. And Zech 3:4's speaker is the angel of the LORD; the God-as-subject reading is now marked."
    - "'Isaiah uses one noun for two garments': the shared noun is tsedaqah, not a garment word; clarified. 'soiled rag' imported KJV 'filthy rags'; now Isaiah's 'polluted garment'."
