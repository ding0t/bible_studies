stages:
  scoping:
    done: true
    notes: "Backlog 5.6 is the brief. Placement last-things/ beside judgment-seat-of-christ."
  exegesis:
    historical_context:
      done: true
      notes: >
        Revelation to seven churches in Asia (Sardis's history of unwatched walls, ESV SB note on
        3:1-6); white garments as festal and priestly dress; fuller's bleaching as a trade (Mark 9:3).
        Zechariah 3 post-exilic high priest. Genesis 3 garments of skins.
    literary_context:
      done: true
      notes: >
        Rev 6:9-11 fifth seal; 7:9-17 interlude after the sixth seal, answering 6:17 'who can stand?';
        19:7-8 marriage of the Lamb after Babylon's fall (Babylon wears byssinos 18:16); 19:14 the
        armies; 22:14 closing beatitude. Rev 3 letters to Sardis and Laodicea.
    content_word_studies:
      done: true
      notes: "All counts from MACULA SBLGNT / WLC via bible_concordance on 2026-10-15."
      terms:
        - {word: "στολή", language: greek, transliteration: "stolē", strongs_id: "G4749", gloss: "long robe", notes: "9 NT: Luke 15:22; 20:46; Mark 12:38; 16:5; Rev 6:11; 7:9, 13, 14; 22:14 (5 in Rev)."}
        - {word: "λευκός", language: greek, transliteration: "leukos", strongs_id: "G3022", gloss: "white", notes: "25 occurrences in 23 NT verses; 16 in Revelation in 14 verses (1:14 x2, 2:17, 3:4, 3:5, 3:18, 4:4, 6:2, 6:11, 7:9, 7:13, 14:14, 19:11, 19:14 x2, 20:11)."}
        - {word: "λευκαίνω", language: greek, transliteration: "leukainō", strongs_id: "G3021", gloss: "make white", notes: "2 NT: Mark 9:3; Rev 7:14. LXX: Ps 50:9 (Eng 51:7) and Isa 1:18 (λευκανῶ, 1st sg, God the subject); ἐκλευκαίνω in Theodotion Dan 12:10."}
        - {word: "πλύνω", language: greek, transliteration: "plynō", strongs_id: "G4150", gloss: "wash (clothes)", notes: "2 in SBLGNT: Rev 7:14 (aorist ἔπλυναν); 22:14 (present participle πλύνοντες). LXX Ps 50:9 πλυνεῖς με."}
        - {word: "βύσσινος", language: greek, transliteration: "byssinos", strongs_id: "G1039", gloss: "of fine linen", notes: "5 occurrences in 4 verses: Rev 18:12, 16; 19:8 (x2), 14."}
        - {word: "δικαίωμα", language: greek, transliteration: "dikaiōma", strongs_id: "G1345", gloss: "righteous act, requirement", notes: "10 NT. Rev 15:4 God's righteous acts; Rev 19:8 the saints'; Rom 8:4 the righteous requirement fulfilled in us who walk by the Spirit; Rom 5:18 Christ's one act of righteousness."}
        - {word: "ἱμάτιον", language: greek, transliteration: "himation", strongs_id: "G2440", gloss: "garment", notes: "Rev 3:4, 5, 18; 4:4; 16:15; 19:13, 16."}
        - {word: "ἄξιος", language: greek, transliteration: "axios", strongs_id: "G514", gloss: "worthy", notes: "7 in Rev: 3:4; 4:11; 5:2, 4, 9, 12; 16:6. Luke 15:21 'no longer worthy' before the stolē of 15:22."}
        - {word: "לָבַשׁ", language: hebrew, transliteration: "labash", strongs_id: "H3847", gloss: "clothe (hiphil)", notes: "Hiphil with God as subject at Gen 3:21 (וַיַּלְבִּשֵׁם), Isa 61:10 (הִלְבִּישַׁנִי), Zech 3:4 (הַלְבֵּשׁ). 96 occurrences of the root in MACULA WLC (all stems)."}
        - {word: "לָבַן", language: hebrew, transliteration: "laban", strongs_id: "H3835", gloss: "be/make white", notes: "Isa 1:18 (hiphil yalbinu); Ps 51:9 Heb = 51:7 Eng (albin); Dan 11:35; 12:10 (hithpael yitlabbenu, 'make themselves white'); Joel 1:7."}
        - {word: "צְדָקָה", language: hebrew, transliteration: "tsedaqah", strongs_id: "H6666", gloss: "righteousness", notes: "Isa 61:10 me'il tsedaqah 'robe of righteousness'; Isa 64:5 Heb = 64:6 Eng kol-tsidqotenu 'all our righteous deeds' like a polluted garment."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "The garments are pictures; what transcends is who supplies them and what makes them white."
    theological_principle:
      done: true
      notes: "See thesis. Imputed righteousness (robe) and the Spirit-produced works God prepared (linen), both given."
    application_draft:
      done: true
      notes: "Stop sewing fig leaves; come to the blood daily (22:14 present, 1 John 1:7); walk worthy and keep the garment (Rev 16:15)."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Ps 51:7 (LXX 50:9)", relation: "Shares both verbs of Rev 7:14 (πλύνω, λευκαίνω); bible_trace silent, verified by reading the LXX. Marked as echo. ESV SB note on 7:13-14 also cites Ps 51:7."}
      - {ref: "Dan 12:1, 10 (Theodotion)", relation: "θλῖψις in the time of trouble; ἐκλευκανθῶσι 'made white'. Rev 7:14 'out of the great tribulation... made them white'. Echo, marked."}
      - {ref: "Isa 1:18 LXX", relation: "ὡς χιόνα λευκανῶ, God speaking: 'I will make white'. Hebrew: they shall be white."}
      - {ref: "Mark 9:3", relation: "Only other NT λευκαίνω."}
      - {ref: "Isa 64:6 / Isa 61:10", relation: "Same noun tsedaqah: our righteous deeds a polluted garment; His robe of righteousness."}
      - {ref: "Gen 3:21 / Isa 61:10 / Zech 3:4", relation: "labash hiphil, God the subject."}
    translations_compared: ["ESV", "WEB", "ULT", "KJV (Rev 22:14)", "LXX Brenton", "SBLGNT"]
    divergences_noted: "Rev 22:14: TR/Byzantine 'do his commandments' (KJV) vs 'wash their robes' (SBLGNT, ESV; CSB footnote 'Other mss read who keep his commands'). Ezek-style ULT 'wind' for ruach not relevant here."
  drafting:
    done: true
    file: "docs/content/last-things/they-were-given-white-robes.md"
  review:
    done: true
    validated: true

