thesis: >-
  God puts the white garment on His people: the robe is given and made white in the Lamb's blood,
  whiter than any launderer on earth could make it, and even the fine linen of the saints' righteous
  deeds is granted, so you stand in what He washed and wear what He worked in you.
outline:
  - {section: "Key Takeaways", says: "Types & prophecy (Gen 3:21 marked as a reading), lessons about Jesus, memory verses Rev 7:14 and Isa 61:10, Be Transformed, prayer."}
  - {section: "Study outline", says: "Map."}
  - {section: "The clothes God makes", says: "Gen 3:7 self-made loincloths vs 3:21 God makes and clothes; labash hiphil with God as subject at Gen 3:21, Isa 61:10, Zech 3:4; Isaiah's same word tsedaqah for our deeds as a polluted garment (64:6) and His robe of righteousness (61:10)."}
  - {section: "Whiter than snow", says: "laban 'make white': Isa 1:18 (LXX: God says 'I will make white'), Ps 51:7 (LXX plyno + leukaino), Dan 12:10 in the time of trouble (12:1). White as God's own colour: Dan 7:9; Rev 1:14."}
  - {section: "As no one on earth could bleach them", says: "leukaino twice in the NT: Mark 9:3 and Rev 7:14. The whiteness is His; the robes are whitened in His blood. Angels in white."}
  - {section: "Every white garment in Revelation", says: "Table of eight scenes with word, wearer and how received; words stole, himation, byssinos, leukos counted."}
  - {section: "Given, washed, granted", says: "edothe at 6:11 and 19:8; eplynan/eleukanan en to haimati (7:14) with Ps 51:7 and Dan 12 echoes; 22:14 present participle and the TR variant."}
  - {section: "The fine linen of righteous deeds", says: "dikaiomata (Rev 15:4 God's, 19:8 the saints'; Rom 8:4 fulfilled in us by the Spirit); Isa 64:6 beside Rev 19:8; Eph 2:10; armies in the same linen (link rapture); link judgment seat for reward."}
  - {section: "Who wears them", says: "Martyrs, the tribulation multitude, Sardis' few, the elders (contested), the Bride; the step to every believer marked with its grounds; not the resurrection body (link)."}
  - {section: "Worthy, soiled, and the wedding garment", says: "The hard part: Rev 3:4 'worthy' (axios: 7 in Rev), 3:18 buy from Me, 16:15 keep garments on, Jude 23, Matt 22:11-13 (supplied garment contested)."}
  - {section: "Discussion questions", says: "Five facets."}
  - {section: "References", says: "Sources and on-this-site links."}
