slug: "they-were-given-white-robes"
title: "They Were Given White Robes"
status: published # scoping | exegesis | hermeneutics | cross-reference | drafting | review | published
target_path: "docs/content/last-things/they-were-given-white-robes.md"
brief: >
  Backlog 5.6 "They were given white robes" (docs/content/about/backlog.md) is the brief: gather every
  occurrence, ask what the robes mean, who wears them, and whether they are God's gift; the
  Transfiguration parallel; gift or deeds; the words; the tie to The Wife of the Lamb and The Bride
  of Christ; not the resurrection body. Author asked on 2026-10-15 to split the robes and linen out
  of judgment-seat-of-christ.md "given multiple studies now discuss it", with comics.

primary_passage: "Revelation 6:11; Revelation 7:9-14; Revelation 19:7-8"
