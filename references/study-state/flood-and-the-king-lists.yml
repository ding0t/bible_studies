review_2026-09-28:
  reviewer: "review-bible-study skill, full pass on the unfinished fork (draft: true, never developed)"
  verdict: >
    NOT READY. Plainly unfinished: no opening, no "In one sentence:" thesis, no Key Takeaways,
    no discussion questions, an editorial fork note still at the top, and no Scripture quoted at
    all. Needs develop-bible-study before any further review. No missing content was written here.
  phase_1_scripture: "No block quotes or inline Scripture quotations to check."
  phase_2_citations: >
    NIV Cultural Backgrounds SB note on Gen 11:1 verified verbatim (study_note): "the whole universe
    in unison spoke to Enlil in one tongue" and "Nothing else in this account parallels the tower of
    Babel". Bronk Ramsey et al., Science 328 (2010) 1554-1557, 211 measurements, Djoser 2691-2625 BC:
    consistent with the parent's verified record. Table arithmetic re-run (752/552/322/212 years).
    Sumerian King List 8 antediluvian kings / 241,200 years matches WB 444. NOT independently
    verifiable here and inherited from the parent's review: Redford's caution "before Ramesses II"
    (odd as phrased, since the canon itself dates to Ramesses II), Manetho's "some 5,500 years", and
    "seven pre-Sargonic rulers attested". Dendrochronology and varves are asserted in the opening and
    never argued or cited anywhere in the file.
  phase_3_word_study: "None in the file."
  phase_4_synthetic_claims: >
    CRITICAL, FIXED: the MT/LXX pattern paragraph was false. Checked against docs/data/genealogy
    (morphhb-wlc vs ebible-grcbrent) and Brenton Gen 11:12-13, 11:24: the +100 shift covers Adam,
    Seth, Enosh, Kenan, Mahalalel, Enoch AND Shelah, Eber, Peleg, Reu, Serug as well as Arpachshad;
    exceptions are Jared (0), Methuselah (-20), Lamech (+6), Noah, Shem, Terah (0), Nahor (+150),
    plus the inserted Cainan. The stated motive ("where a 100-year shift would have carried
    Methuselah's death past the Flood") was wrong twice: a shift at Jared moves his death and the
    Flood equally, and the LXX's own 167 makes Methuselah outlive the Flood by 14 years
    (genealogy-times.md table). Rewritten to state the pattern and point to genealogy-times.
    Also fixed: Sargon "at the Flood" -> "14 years after" (2334 vs 2348); stale "required-rate
    column above" now links the parent's #the-chronology; the unexplained 2148 BC dispersion labelled
    as a modeled date. 3228 BC and 880-year gap recomputed clean (LXX Flood-to-Terah's-death 1307 yrs).
  phase_5_commentary: "NIV CBSB (already cited) confirms the Enmerkar assessment. Nothing independent contradicts."
  phase_6_context: >
    Genre/occasion/literary context for Genesis 5 and 11 missing (expected for an undeveloped fork).
    Footnote fork undisclosed: NLT footnotes Gen 11:10ff "Or the ancestor of", i.e. the gap reading
    under which the genealogies give no chronology at all. Statement of faith: no conflict
    (inerrancy is claimed for the original writing; choosing between MT and LXX numbers is a
    textual-critical question it does not settle). review_gaps: crossref noise only.
  siblings: >
    OPEN FOR AUTHOR. (1) The LXX Flood at 3228 BC depends on the inserted second Cainan (130 yrs),
    which genealogy-times.md "The Cainan question" argues is a later insertion; without him the LXX
    Flood is c. 3098 BC, level with Dynasty 1 (c. 3100), and with Alexandrinus' Nahor 79 it is
    c. 2998 BC, after it. The study's point ("before Egypt's First Dynasty") rests on both readings.
    (2) The site's working chronology (genealogy-times harmonized_v1) keeps an MT Flood at 2288 BC,
    so this study's LXX resolution runs against the reconstruction the site itself adopts.
