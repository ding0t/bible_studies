develop_2026-09-28:
  skill: develop-bible-study, full pass on author instruction
  author_instruction: >
    "What makes most logical sense -- when we first trust scripture, and acknowledge which of the
    texts is most accurate and why." Textual question made the spine; outside evidence only after
    the recommendation.
  genre: "OT narrative genealogy (Genesis 5; 11:10-26) with textual criticism; topical"
  thesis: >
    Tested first by Scripture's own consistency, the Masoretic Text preserves Genesis 5 and 11 best,
    because the Septuagint and Samaritan numbers carry the marks of scribes solving problems; and
    since no defensible reading moves the Flood before Egypt's First Dynasty, the conflict with
    archaeology is real under every text and cannot be solved by changing manuscripts.
  thesis_change: >
    CONCLUSION CHANGED from the fork's point ("LXX puts the Flood before Dynasty 1"). That point
    rested on Brenton's second Cainan (130 yrs), which genealogy-times.md and Steinmann reject.
    Author to confirm.
  outline:
    - "Three witnesses: what MT/LXX/SP are; the four Flood dates"
    - "What Scripture says: Gen 7:23 + 1 Pet 3:20 rule out LXX Methuselah; NT uses LXX wording (Heb 11:5, Acts 7:14) but cites no age; Luke 3:36 Cainan contested; Rom 3:2"
    - "How each text was changed: Steinmann's 860-variant collation; LXX Gen 5 +100/-100; SP three deaths in AM 1307; Gen 11 +100 as fix for MT's crowded family; MT slips"
    - "Recommendation with confidence levels: settled / strong / contested / gap view / Terah open"
    - "Test: Egypt and Sumer (Dee 2013, Bronk Ramsey 2010, king-list reliability); no defensible text clears Aha"
    - "Tree rings and varves: longer than every text; bearing on dating physics, not manuscripts"
    - "Babel's archaeology (kept, short)"
    - "What this shows about God"
  word_budget: 4000
  words: "c. 4,350 raw wc incl. References and outline; Check 23 silent (under budget as counted)"
  resources_consulted:
    - "Andrew E. Steinmann, JETS 64/1 (2021) 25-43 -- read in full (PDF). CONTRIBUTED the spine: secondary-reading counts (MT 58 / SP 272 / LXX 467; shared SP+LXX 96), Gen 5 and 11 analysis, Nahor +50, Terah 205, Eber 430 slip, Goettingen LXX Methuselah 167 and Nahor 79."
    - "Lita Sanders, ARJ 18 (2025) 183-187 -- abstract only; confirms pro-MT case. Listed in reading, not relied on."
    - "Henry B. Smith Jr., ICC 2018, 117-132 -- NOT read (403); cited only as the case for LXX, per Steinmann's citation."
    - "Klein HTR 67 (1974); Hendel 1998 -- cited only as Steinmann cites them; not read."
    - "Theophilus, To Autolycus 3.24 (ANF 2) and Africanus, Chronography fr. III-VIII (ANF 6) -- read from $BIBLE_MEDIA_ROOT patristics: Theophilus 167 / Flood 2242 / no Cainan / Nahor 75; Africanus 187 / Flood 2262 / no Cainan."
    - "Dee et al. 2013 Proc R Soc A 469:20130395 -- Aha 3111-3045 BC (68%), 3218-3035 (95%), via search-result abstract text (publisher page 403)."
    - "Reimer et al. 2020 Radiocarbon 62:725-757 (IntCal20); Bronk Ramsey et al. 2012 Science 338:370-374 (Suigetsu) -- bibliographic details verified by search; the 'beyond twelve thousand years' tree-ring statement is deliberately conservative."
