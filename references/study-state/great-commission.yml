genre: [gospel, apocalyptic, epistle, prophets, topical]

thesis: >-
  The risen Jesus commands His church to make disciples of all nations, under His authority and in
  His presence, and that command is a joy to obey; the day of His return is fixed by the Father,
  Matthew 24:14 is Jesus' promise of what God will see done before the end, and the Lord Himself
  adds to His church, so you share the gospel as a forgiven child with no debt of guilt to pay.
outline:
  - section: "Hook, In one sentence, Key Takeaways, Study outline"
    says: "Names the slogan ('He can't come back until we finish') and the guilt it lays."
  - section: "The commission"
    says: "Matthew 28:16-20: His authority, the one imperative matheteusate (G3100, 4x NT), 'go' as a real command, the promise of His presence; binding on the church."
  - section: "Matthew 24:14: a promise about the end"
    says: "Future passive 'will be proclaimed'; its place in the Olivet sequence (24:9-15, inside Daniel's seventieth week per immediately-after.md and olivet-discourse.md); Revelation 14:6; Colossians 1:6, 23; other readings stated; the rapture is signless (rapture.md). Verdict on the slogan."
  - section: "Hastening the day?"
    says: "2 Peter 3:9-12 contested: ESV SB says evangelism hastens from a human perspective; context ties it to holiness, the day is fixed (Acts 17:31), delay is God's patience. Acts 1:7-8: times are the Father's, witness is ours by the Spirit's power."
  - section: "Blood on your hands?"
    says: "Ezekiel's watchman is a prophetic office to Israel; Paul applies it to his own ministry (Acts 20:26-27); the principle of faithful speech carries, the guilt-lever does not."
  - section: "Whose mission is it?"
    says: "The Lord builds and adds and gives the growth; the outcome is certain (Rev 5:9, 7:9); each serves as assigned (1 Cor 3:5), including senders (3 John 8) and quiet lives (1 Thess 4:11-12); guilt resolved at Romans 8:1, linking run-the-race and assurance-of-salvation."
