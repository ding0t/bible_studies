open_questions:
  - "Author's position (2026-10-01): 'Jesus won't come until the gospel is heard by all' is a likely misinterpretation of the Great Commission. Study states that verdict and gives the hastening case (ESV SB on 2 Peter 3:12) fairly."
  - "day-is-near.md checked at the author's request: no contradiction of the pretrib position, since 24:14's telos is the end of the age at the visible return. Its phrase 'a finished evangelistic task as the last named condition' frames 24:14 as the church's task; author to decide whether to soften. Not edited. Original note: day-is-near.md Be Transformed and discussion question 4 frame Matthew 24:14 as the church's labour and 'the stated condition before the end will come'. Possible tension with this study and rapture.md's imminence; surfaced to the author, not edited."

