slug: "six-days-of-history"
title: "Six Days of History"
status: drafted
target_path: "docs/content/last-things/six-days-of-history.md"
primary_passage: "Genesis 1:1-31"
supporting_passages: ["Genesis 2:1-3", "Genesis 4-11", "Exodus 20:11", "Revelation 13:14-18", "Colossians 1:15", "2 Corinthians 3:18", "Romans 8:29"]
genre: "OT narrative (creation account, Genesis 1:1-2:3) read typologically as a framework for history; Revelation 13 (apocalyptic) at day six"
point: >
  Each working day of the creation week has a lexical counterpart in the millennium of history
  the thousand-year-day reading assigns to it, ending in man's counterfeit image on day six.
thesis: >
  Read as a framework, the six working days of Genesis 1 match the shape of the six thousand years
  that follow them, from light divided from darkness to man's counterfeit image, and the pattern
  shows a God who orders history as He ordered creation, sends His Son Jesus at the appointed time
  as the true image of God, and brings the week to His rest.
outline:
  - "Genesis 1 in its setting -- Mosaic book for wilderness Israel; 1:1-2:3 in seven sections; day six the peak; the chapter's own point is God the Creator ordering by His word."
  - "Reading the week as history -- Barnabas 15 and Irenaeus AH 5.28.3 as witnesses; day-by-day matching labelled this site's construction (typology); no date (Acts 1:7; epochs differ, see day-is-near); the table."
  - "The first three days -- light and the two lines (Jubilees on Adam's death); the waters divided and the Flood; dry land and the seed. God keeps His word through judgment."
  - "The last three days -- mo'adim and the throne, closing with the Sun of Righteousness and Galatians 4:4; the swarming sea and the gospel; the image and its counterfeit (eikon, 666, Irenaeus)."
  - "The true image -- Colossians 1:15, Romans 8:29, 2 Corinthians 3:18; God restores His image through Jesus; the week ends in His rest (Genesis 2:3, Hebrews 4:9, Isaiah 46:10)."
  - "Reading Genesis 1 in English -- which translations keep 'day one' and 'the sixth day'."
word_budget: 4000
stages:
  scoping:
    done: true
    notes: >
      Forked verbatim from docs/content/last-things/day-is-a-thousand-years.md @ 7ddf284 during
      the 2026-09-26 simplify pass. The Day one-six subsections, the translation-articles table and
      the millennium table were verified there (review_2026-08-09) and kept, with out-of-context
      references fixed ("Jubilees' whole point" now explains Jubilees 4:29-30 and links the parent;
      "Neither marked feature above" now introduced by a short restatement of day one's cardinal and
      day six's article, linking the parent's "The week's own grammar"). Hosea 6:1-3 section
      removed -- see open_questions.
  historical_context:
    done: true
    notes: >
      ESV Study Bible introduction to Genesis: traditional Mosaic authorship, held by Jews and
      Christians until the 19th century. First hearers: Israel after the exodus, given the Sabbath
      grounded in the creation week (Exodus 20:11).
  literary_context:
    done: true
    notes: >
      Unit is Genesis 1:1-2:3 (ESV SB note on 1:1-2:3: seven sections marked by set phrases; each
      workday opens "And God said" and closes with the evening-morning formula). ESV SB note on
      1:24-31: day six is by far the longest section, the peak of interest. ESV SB note on 1:31:
      six "good" verdicts (vv. 4, 10, 12, 18, 21, 25) then "very good". The chapter's own point is
      God the Creator ordering all by His word; the six-thousand-year reading is marked in the
      draft as a second, typological step.
  content_words:
    done: true
    notes: >
      Moved word studies (ki tov, yabbashah, zera, mo'adim, eikon) verified in the parent. New:
      eikon at Colossians 1:15 (SBLGNT eikon tou theou) and 2 Corinthians 3:18 (ten auten eikona).
  hermeneutics:
    done: true
    notes: >
      Principle: God orders history as He ordered creation, restores His image in Jesus, and brings
      the week to His rest. The day-by-day scheme is framed as typology/framework, never as a
      date. Consistent with statement-of-faith.md End times (literal millennium, Revelation 20)
      and with day-is-near.md (both flag epoch disagreement; this study links rather than picks a
      year and notes 4004 BC puts AM 6000 at AD 1997 while day-is-near reaches AD 2075).
  cross_reference:
    done: true
    notes: >
      Links parent (5 anchors, all resolved in the built parent), day-is-near#when-is-the-year-6000,
      genealogy-times.md, and sibling draft a-thousand-years-in-your-sight.md (Psalm 90 not
      duplicated -- one-line pointer).
  draft:
    done: true
    notes: >
      2026-09-27: opening hook, Genesis 1:31 quote + In one sentence, Key Takeaways (all five parts),
      Study outline, "Genesis 1 in its setting", "Reading the week as history", "The true image",
      section theology lines, discussion questions (5), References. ~3,600 words counted
      (excl. frontmatter, Study outline, References) -- under the 4,000 budget, above the 3,000
      aim; the translation and millennium tables account for much of the difference.
  validate:
    done: true
    notes: >
      npm run validate: no warnings or errors for this file. mkdocs build --strict passed (draft
      dropped from build, so its own links were checked by hand against the built parent).
