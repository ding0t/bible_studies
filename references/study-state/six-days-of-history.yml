chronology_alignment_2026-10-01: >
  Creation 3959 BC. Solomon's temple begun AM 2993 and finished AM 3000 on this epoch (noted as carrying Solomon's +/-5, not leaned on). Nativity paragraph updated as in the parent study. The site's single chronology line, and the reason for each date, is recorded in
  references/study-state/chronology-anchors.yml under chronology_line.

review_2026-10-20:
  reviewer: "anthropic/claude-opus-5.5 (review-bible-study, agent session; author not present -- nothing in the study edited)"
  file_status: "draft: false (live)"
  checked: >
    Phase 1: all 29 quoted ESV verses re-queried in study-notes.db (esv-study-bible) -- every one
    verbatim, references correct. Phase 2: Barnabas 15, Irenaeus AH 5.23.2, 5.28.2, 5.28.3 checked
    against ANF vol. 1 on the media volume (anf01.txt) -- all verbatim and correctly sectioned;
    NKJV CB note on Genesis 4:26 confirmed; all five parent-study anchors and the two site links
    resolve; a-thousand-years-in-your-sight.md is now draft: false (open question 2 is closed).
    Phase 3: H4150 in Leviticus 23 = 2+2+1+1 at 23:2, 4, 37, 44 (six across four verses, correct);
    H3004 at Gen 1:9-10 and Exod 14:22 correct; ki tov absent from MT 1:8, present 1:10 and 1:12;
    LXX kat' eikona (1:26-27), pnoe (2:7), SBLGNT pneuma/eikon (Rev 13:15) correct; translation
    table re-queried for all seven rows (WLC, ESV, BSB, WEB, ASV, NASB 2020, Rotherham) -- all
    correct. Genesis 1 footnotes read: CSB 1:14 "Or for the appointed times" supports the mo'adim
    reading. Phase 4 arithmetic: Adam d. AM 930, Enoch AM 987, Flood AM 1656, Temple AM 2993/3000,
    Nativity AM 3954 (5 BC), cross AM 3991 (AD 33), AM 4000 = AD 42, AM 6000 = AD 2042, Ussher AM
    4000 = 4 BC -- all correct. Phase 5: NIV CB on 1:14 and ESV SB on 1:6-8 -- silent on the
    typology, nothing contradicts. Phase 6: review_gaps (no load-bearing quotation gap);
    cross_study_claims "Genesis 1" (30 siblings). Validator: two Check 25 warnings, no errors.
  findings:
    - id: R1
      severity: critical
      location: "Day five, final sentence"
      finding: >
        False synthetic claim: "The church is the one thing in this scheme that begins with a
        blessing and a command to multiply." Genesis 1:28 (day six, man), Genesis 9:1 (Noah, AM
        1657, day two) and Genesis 35:11 (Jacob, day three) each have God's blessing and "be
        fruitful and multiply". Sibling world-population-declares-gods-creation-and-biblical-truth.md
        traces exactly this mandate re-issued from 1:28 to Noah.
      proposed_fix: "Delete the sentence (about -20 words), or narrow it to what is distinctive (the word itself multiplying -- see R2)."
      verdict: open
    - id: R2
      severity: moderate
      location: "Day five, second paragraph"
      finding: >
        "a commission whose verbs are day five's verbs" is unsupported by the verses cited:
        Matthew 4:19 and 13:47 share no verb with Genesis 1:22, and Matthew 28:19's verbs (go, make
        disciples, baptize, teach) are not day five's. The real echo exists and is uncited: LXX
        Genesis 1:22 auxanesthe kai plethynesthe; Acts 12:24 "the word of God increased and
        multiplied" (ηὔξανεν καὶ ἐπληθύνετο), also Acts 6:7. Note Gen 1:28 LXX has the same verbs,
        so mark the echo as shared with day six.
      proposed_fix: "Replace the phrase with Acts 12:24 (ESV) plus the Greek pair against LXX Genesis 1:22 (about +25 words)."
      verdict: open
    - id: R3
      severity: critical
      location: "Day four, paragraph 2 ('The fourth millennium is when Israel starts running on it')"
      finding: >
        False synthetic claim. The mo'adim of Leviticus 23 were given at Sinai and kept from the
        Exodus (Passover, Exod 12; Num 9:5; Josh 5:10) -- AM ~2513, the third millennium on the
        site's own epoch. "The throne established in the same period" is also off: the Davidic
        covenant is 1001 BC = AM 2958 in chronology.json, David crowned AM 2948 -- both third
        millennium. Psalm 89 itself (written after the throne's humbling, vv. 38-51) is fourth
        millennium, but the throne it describes was established before AM 3000.
      proposed_fix: >
        Recast as "the fourth millennium gives that calendar its house": Solomon offering "according
        to the commandment of Moses for the Sabbaths, the new moons, and the three annual feasts"
        (2 Chronicles 8:13, ESV), and the throne promised just before AM 3000 sung in day four's
        terms in Psalm 89. About +15 words net.
      verdict: open
    - id: R4
      severity: moderate
      location: "Day five and table row 5 vs the site's own epoch"
      finding: >
        On the 3959 BC epoch Pentecost (AD 33) is AM 3991 -- day four -- and AM 5000 is AD 1042, so
        the Reformation and the modern missionary expansion fall in day six, while the church-age
        continues through nearly all of day six before Revelation 13. "The fifth millennium is the
        gospel going out over that sea" is therefore a loose fit the study does not mark, unlike
        the Temple fit (which it does mark). Same class as the day-is-a-thousand-years day-three
        ordering error caught in Phase 4 history.
      proposed_fix: "Add one marked-confidence sentence: the gospel launches at the close of day four and its widest spread is in day six; the fit is in the first centuries' spread, offered as typology. About +30 words."
      verdict: open
    - id: R5
      severity: minor
      location: "Day two, first sentence"
      finding: >
        "the only day of the week God does not call good" -- day seven is not called good either
        (the claim holds for the six working days). And LXX Genesis 1:8 adds "and God saw that it
        was good"; the study uses the LXX elsewhere (eikon), so the fork deserves one clause.
      proposed_fix: "'the only working day ...' plus '(the Septuagint supplies it; the Hebrew does not)'. About +10 words."
      verdict: open
    - id: R6
      severity: minor
      location: "Inline quotations throughout days one-six (Gen 4:26, 8:2, 12:7, 22:17-18, Exod 14:22, Ps 89:36-37, Gen 15:5, Mal 4:2, Gen 1:22, Rev 17:15, Matt 4:19, 13:47, Rev 13:14-15, 13:18)"
      finding: "Quotations verified ESV-verbatim but carry no translation label; AGENTS.md requires the translation on every quote. References section's 'quoted throughout' partly covers it."
      proposed_fix: "Add (ESV) at first quote in each subsection. About +15 words."
      verdict: open
    - id: R7
      severity: minor
      location: "Discussion Questions"
      finding: "Validator Check 25: none of the five carries a facet label, and no **Be transformed.** label (Q3 and Q5 are personal in substance). No question touches Christ's death on the sixth day or the day-four/Temple material."
      proposed_fix: "Label: Q1 The language., Q2 The text in its context., Q3 Christ., Q4 The hard part., Q5 Be transformed. About +10 words."
      verdict: open
    - id: R8
