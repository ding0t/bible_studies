stages:
  scoping:
    done: true
    notes: "Chosen with the ark 2026-09-28 as the next Revelation-referenced furnishings. Tier 1 anchor: Revelation 5:8 interprets the incense itself."
  exegesis:
    historical_context:
      done: true
      notes: >
        Exodus 30 places the altar's instructions after the priesthood chapters (28-29), not with
        the other furniture (25-27). Solomon's was cedar overlaid with gold (1 Kings 6:20-22).
        Uzziah (792-740 BC, ESVSB) struck with leprosy at it (2 Chronicles 26:16-21). In Jesus' day
        the offering priest was chosen by lot, likely once in a lifetime (CBSB on Luke 1:9).
    literary_context:
      done: true
      notes: >
        Revelation's heavenly altar opens the trumpet cycle (8:2-5) and answers the martyrs' cry of
        6:10; 9:13 and 16:7 keep it speaking through the judgments.
    content_word_studies:
      done: true
      notes: >
        Exodus 30:1 mizbeach miqtar qetoret (H4196, H4729, H7004) "an altar, a place of burning of
        incense". qetoret 60x in WLC. Exodus 30:8 "between the evenings" and qetoret tamid. Exodus
        30:6 "before the kapporet ... where I will meet with you" (niphal ya'ad H3259). Exodus 30:4
        ring count ambiguous: ESV/CSB/NASB two in all; NIV two on each side. Hebrews 9:4
        thymiaterion (G2369) + echousa "having"; LXX uses thymiaterion for a censer at 2 Chr 26:19,
        Ezek 8:11; LSB footnote "Or censer". libanotos (G3031) "censer" only Rev 8:3, 5 in NT.
        thymiama (G2368) 6x NT: Luke 1:10, 11; Rev 5:8; 8:3, 4; 18:13. 1 Kings 6:22 "the altar that
        was to the debir" (l:H1687). thusiasterion (G2379) 8x in Revelation: 6:9; 8:3 (2x); 8:5;
        9:13; 11:1; 14:18; 16:7; "golden" only at 8:3 and 9:13.
      terms:
        - {word: "קְטֹרֶת", language: hebrew, transliteration: "qetoret", strongs_id: "H7004", gloss: "incense"}
        - {word: "מִקְטָר", language: hebrew, transliteration: "miqtar", strongs_id: "H4729", gloss: "place of burning"}
        - {word: "θυμιατήριον", language: greek, transliteration: "thymiatērion", strongs_id: "G2369", gloss: "altar of incense or censer"}
        - {word: "θυμίαμα", language: greek, transliteration: "thymiama", strongs_id: "G2368", gloss: "incense"}
        - {word: "λιβανωτός", language: greek, transliteration: "libanōtos", strongs_id: "G3031", gloss: "censer"}
