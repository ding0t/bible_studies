thesis: >
  God set a golden altar before the veil, facing the mercy seat, where the priest burned His own
  incense every morning and evening as he tended the lamps; Scripture itself says what that incense
  is -- the prayers of God's people (Psalm 141:2; Revelation 5:8) -- and in heaven the same altar
  receives the saints' prayers and sends fire back to the earth, so the prayers of the saints are
  heard before God's throne and answered in what He does.
outline:
  - section: "Hook + In one sentence + Key Takeaways + Study outline"
    says: "Luke 1:10-11: the people praying outside at the hour of incense, an angel at the right side of the altar, 'your prayer has been heard'."
  - section: "Made after the pattern (Exodus 30:1-10)"
    says: "Every main dimension given (1 x 1 x 2 cubits), so the plate is to scale; horns of one piece; molding; rings ambiguous (two in all or two a side); placed before the veil facing the mercy seat 'where I will meet with you'."
  - section: "His incense and His fire"
    says: "The recipe is holy and forbidden for private use (30:34-38); Nadab and Abihu's unauthorized fire (Lev 10:1-3); Aaron's censer between the dead and the living (Num 16:46-48); Uzziah struck at the altar (2 Chr 26:16-21). God sets how He is approached."
  - section: "Morning and evening, with the lamps"
    says: "qetoret tamid at the hour the lamps are tended (30:7-8), ties to the lampstand page; blood on its horns once a year (30:10); the incense cloud over the mercy seat on the Day of Atonement (Lev 16:12-13)."
  - section: "Outside the veil, belonging to the inner room"
    says: "1 Kings 6:22 'the altar that belonged to the inner sanctuary'; Hebrews 9:4 'having' (echousa); thymiaterion as altar or censer (LXX censer at 2 Chr 26:19; Ezek 8:11; LSB footnote 'Or censer'). Both cases given."
  - section: "Incense is prayer"
    says: "Psalm 141:2; Luke 1:9-13 (hour of incense, prayer heard); Malachi 1:11 incense among the nations. The OT's own reading before Revelation states it."
  - section: "The golden altar before the throne"
    says: "Tier 1: Rev 5:8 bowls of incense 'which are the prayers of the saints'. Rev 8:3-5 incense added to the prayers, fire thrown to earth, trumpets follow; 9:13 voice from its horns; 6:9 souls under 'the altar' (which altar contested; ESVSB one altar in heaven serving both); 16:7 'the altar saying'. Link how-god-answers-prayer.md and at-home-with-the-lord.md."
  - section: "What the altar shows about God"
    says: "Tier table. Christ's intercession (Heb 7:25) marked as an inference (NIVBT 'may prefigure'); prayer through the priest God appointed; your prayers rise and are answered."
  - section: "Discussion questions; References"
    says: ""
