hebrew_nt_check_2026-09-25:
  asked: "Author asked to check the Hebrew NT (Salkinson-Ginsburg) for language insight on the restrainer."
  source_profile: "hebrew-nt: 19th-century translations INTO Hebrew; informed opinion, not textual evidence."
  found: >-
    Delitzsch (ebible-heb): 2 Thess 2:7 mitokh ha-mone'a ... yusar; Phil 2:15 betokh dor iqqesh; 2 Cor
    6:17 tse'u mitokham -- one Hebrew word (tokh) carries all three, matching Greek mesos. Salkinson-
    Ginsburg (ebible-hebsg): ha-otser ya'atsrennu (atsar, hold back); 'ad asher yusar mitokh
    ha-mesillah -- 'from the midst of the road', i.e. the English idiom 'out of the way'. Both use the
    passive yusar ('be removed'), supplying the agent the Greek omits -- stated in the study.
  bible_trace_2thess2_7: "No connections or leads."

