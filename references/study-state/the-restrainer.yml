thesis: >-
  The restrainer of 2 Thessalonians 2:6-7 is the Holy Spirit dwelling in the church, the body of believers; while the church stands in the midst of the world God holds back the full revelation of lawlessness, and when the church is caught up His restraining presence comes to be out of the midst and the lawless one is revealed.
