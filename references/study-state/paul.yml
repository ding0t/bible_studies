  - {type: other, title: "MACULA Greek Linguistic Dataset (SBLGNT)", author: "n/a", note: "confirmed occurrence counts: hypotyposis 2x NT (1 Tim 1:16, 2 Tim 1:13), ektroma 1x NT (1 Cor 15:8), enkentrizo 6x NT (all in Rom 11), skeuos at Acts 9:15 and Rom 9:21-23"}
  - {type: commentary, title: "ESV Study Bible", author: "Crossway, 2016", note: "confirmed 1 Tim 1:12-17 section heading ('Paul: An Example of the Effect of the True Gospel'), Acts 9 conversion chronology and threefold retelling, Gal 2:7-9 division-of-labor reading, Rom 11:22-24 lesser-to-greater argument, 1 Cor 15:8 note on Paul as last apostle"}
  - {type: commentary, title: "NIV Biblical Theology Study Bible", author: "Zondervan, 2018", note: "explicit parallel offered between God's unmerited choice of Israel (Deut 9:4-5) and unmerited mercy to Paul at 1 Tim 1:16 -- 'if Paul could be saved, anyone could' -- the closest a consulted commentary comes to the user's proposed connection, used as the source for that specific move rather than asserting it independently"}
  - {type: commentary, title: "NIV Cultural Backgrounds Study Bible", author: "Zondervan, 2016", note: "background on ancient olive-grafting practice and 'contrary to nature' at Rom 11:17-24; confirmed as background only, contributed nothing about Paul's own conversion"}
