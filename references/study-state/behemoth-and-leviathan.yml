  - {type: lexicon, title: "TWOT (Theological Wordbook of the Old Testament)", author: "Archer, Harris & Waltke", note: "Roots/glosses for behemot (H930/208b), livyatan (H3882/1089b), tannin (H8577/2528b), nachash (H5175/1347a), yatsar (H3335/898) via twot_strongs."}
  - {type: lexicon, title: "MACULA Hebrew Linguistic Datasets (WLC)", author: "Clear Bible, CC BY 4.0", note: "Morphology for MT Job 41:10-13 (the ke- simile-marking count), 41:23-24 (metsulah/yam/tehom), and the H6231 ashaq concordance."}
  - {type: other, title: "Brenton Septuagint (ebible-grcbrent)", note: "Job 40:23, Job 40:25 (δράκοντα), Job 41:11-13, Ps 103:26 LXX (= MT 104:26, ἔπλασας / δράκων), Isa 27:1 (δράκων x3)."}
  - {type: other, title: "Ugaritic Baal Cycle (KTU 1.5, Ras Shamra, c. 13th c. BC)", note: "Lotan as bthn brh / bthn 'qltn — both roots shared with Isa 27:1. Cited as cultural background, not as evidence for the creature's existence."}
  - {type: other, title: "Calvert Watkins, How to Kill a Dragon: Aspects of Indo-European Poetics", author: "Oxford, 1995", note: "The reconstructed PIE serpent-slaying formula — why widely separated dragon traditions are one witness, not many."}
  - {type: other, title: "Adrienne Mayor, The First Fossil Hunters", author: "Princeton", note: "Fossil remains as a documented origin for legendary creatures (Protoceratops and the griffin)."}
