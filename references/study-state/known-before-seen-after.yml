genre: [topical, gospel]

thesis: >-
  Before Jesus came, Israel read the prophecies of the Messiah's line and throne as His, and read
  none of the prophecies of His suffering so; His opponents fulfilled the hidden ones without knowing
  it (Acts 13:27), and the risen Christ opened the Scriptures to show that the sufferings came first
  and then the glory (Luke 24:26, 45). So the cross was not staged, and you can read the whole of it
  now.
outline:
  - {section: "hook", says: "John 12:34: the crowd knew 'the Christ will remain forever' and could not fit 'lifted up'"}
  - {section: "Key Takeaways", says: ""}
  - {section: "What 'known before' means", says: "read of the Messiah by a witness older than Jesus: Qumran, the Psalms of Solomon, the Septuagint, the New Testament reporting settled belief; the Targums dated and counted apart; 'written before' is What Literary Criticism Declares' question, linked"}
  - {section: "Known before: the line and the throne", says: "Bethlehem (Matthew 2:4-6), the son of David (John 7:42), the Branch (4Q174; 4Q252), the Prophet (John 1:21; 4Q175), Elijah (Mark 9:11; Sirach 48:10): lineage 6 of 8"}
  - {section: "Hidden: the suffering", says: "passion 0 of 26 known before; Peter's 'Far be it from You' (Matthew 16:22); 'the meaning was hidden from them' (Luke 18:34); even the later Targum turns Isaiah 53's wounds away"}
  - {section: "Done by those who did not know", says: "of 19 fulfilled by His opponents, none known before; Acts 13:27; 3:17-18; 1 Corinthians 2:8. What that says to 'it was staged', and the honest exceptions He chose knowingly (the donkey; John 19:28)"}
  - {section: "Seen after", says: "the six texts that say so (John 2:22; 12:16; 20:9; Luke 18:34; 24:45; John 7:39); 'He opened their minds' (Luke 24:45); the order: suffer, then glory (Luke 24:26; 1 Peter 1:11)"}
  - {section: "Why God hid it", says: "the hidden wisdom destined for our glory (1 Corinthians 2:7-8); His set purpose working through ignorance (Acts 2:23; 4:27-28); and the prophecies still ahead, known before and read now with opened minds"}
  - {section: "Discussion questions; References", says: ""}
