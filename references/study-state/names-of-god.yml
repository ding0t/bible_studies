stages:
  scoping:
    done: true
    notes: >
      Topical study requested 2026-10-17 as the theology companion to the names-of-God word cards.
      Placement god/ (Theology Proper: how God makes Himself known). No backlog entry. The names
      covered are the deck's; the study should treat each as revealed in a narrative moment, not
      as a list of titles, and end on the name of Jesus.
  exegesis:
    historical_context:
      done: true
      notes: >
        Each name sits in its own narrative setting; the study's spine is Exodus 3 (Moses at Horeb,
        Israel enslaved in Egypt) with Exodus 6 and 34 as God's own expansions. Names in Genesis
        belong to the patriarchal narratives; Tsevaot first appears at Shiloh in the judges'
        period (1 Samuel 1:3); Immanuel/El Gibbor in Isaiah's Ahaz-era oracles (Isaiah 7-10);
        Tsidkenu in Jeremiah's prophecies against Judah's last kings.
    literary_context:
      done: true
      notes: >
        Exodus 3:12-15 is one exchange: Moses' objection 'Who am I?' (3:11) is answered 'I will be
        with you' (ehyeh, 3:12), and his next, 'What is his name?' (3:13), with ehyeh asher ehyeh
        (3:14) and YHWH (3:15). Exodus 6:2-8 is framed by 'I am the LORD' (6:2, 6, 8) around seven
        'I will' promises. Exodus 34:5-7 follows the golden calf and Moses' request to see God's
        glory (33:18-19, where God promises to proclaim His name).
    content_word_studies:
      done: false
      notes: >
        Verified against MACULA WLC / unfoldingWord interlinear / Brenton LXX (2026-10-18):
        ehyeh (H1961 Vqi1cs) in Exodus 3:12 and 3:14 identical form; LXX Exodus 3:14 'ego eimi ho
        on'. Exodus 6:3 'nodati' Niphal of yada. Counts per one text (macula-hebrew-wlc): YHWH
        H3068 6,513 (H3069 is separate); elohim H430 2,601 (agrees with those-called-gods);
        Shaddai H7706 48, 31 in Job, 6 in Genesis (17:1; 28:3; 35:11; 43:14; 48:3; 49:25);
        Adonai H136 438, first at Genesis 15:2; YHWH + tsevaot within three words 264 times,
        first 1 Samuel 1:3, second 1:11 (Hannah). nes H5251: Exodus 17:15, Numbers 21:8-9,
        Isaiah 11:10, 12. Genesis 22:8 and 22:14 both H7200. El Gibbor at Isaiah 9:6 (Heb 9:5)
        and 10:21. Shaddai in LXX: Genesis 17:1 'ho theos sou', Ruth 1:20 'ho hikanos', Job 5:17
        'pantokrator'; TWOT 2333 gloss 'sufficient'.
      terms:
        - {word: "אֶהְיֶה", language: hebrew, transliteration: ehyeh, strongs_id: H1961, gloss: "I will be / I am", notes: "same form in 3:12 and 3:14"}
        - {word: "יהוה", language: hebrew, transliteration: YHWH, strongs_id: H3068, gloss: "the LORD", notes: "read Adonai; see hebrew/pronunciation.md"}
        - {word: "שַׁדַּי", language: hebrew, transliteration: Shaddai, strongs_id: H7706, gloss: "Almighty (contested)", notes: "three ancient renderings; context in Genesis = fruitfulness"}
        - {word: "נֵס", language: hebrew, transliteration: nes, strongs_id: H5251, gloss: "banner, pole, signal"}
        - {word: "גִּבּוֹר", language: hebrew, transliteration: gibbor, strongs_id: H1368, gloss: "mighty, warrior"}
  hermeneutics:
    cultural_vs_transcultural:
      done: false
      notes: ""
    theological_principle:
      done: true
      notes: >
        God makes Himself known by name as a promise to act, and keeps it; the NT gives the divine
        name and its titles to Jesus (Philippians 2:9-11 from Isaiah 45:23; Romans 10:13 from Joel
        2:32; John 8:58; John 17:11). Consistent with statement-of-faith.md (Trinity, deity of
        Christ; it cites Matthew 28:19's single 'name'). No conflict.
    application_draft:
      done: false
      notes: ""
