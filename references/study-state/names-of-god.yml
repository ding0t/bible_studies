thesis: >
  God names Himself by what He does: almost every name He gave was spoken to someone at the end of
  their own resources, each is a promise He has kept, and all of them meet in Jesus, whose name means
  "the LORD saves".
outline:
  - {section: "Key Takeaways", says: "Types & prophecy (nes; the lamb God sees to), lessons about Jesus, memory verses (Exodus 3:15; Philippians 2:9-10), Be transformed, prayer."}
  - {section: "\"What is his name?\" (Exodus 3:12-15)", says: "God answers Moses' fear with ehyeh, 'I will be with you' (3:12), and names Himself with the same verb two verses later (3:14); YHWH is His name forever (3:15). How it is read is pronunciation.md's job -- one link."}
  - {section: "The name explained (Exodus 34:5-7)", says: "God's own commentary on His name: merciful, gracious, slow to anger, abounding in steadfast love, and just."}
  - {section: "Known by name, known by deed (Exodus 6:2-8)", says: "The hard verse. Genesis has the name spoken to Abram (15:7) and by him (14:22; 22:14), so 'not known' means not yet known in what it promises -- the redemption 6:6-8 lists. Face-value alternative stated and why Genesis weighs against it."}
  - {section: "Names given in the hard places", says: "Grouped walk-through, each name in its narrative moment: El Shaddai to the childless (four of six Genesis uses with 'fruitful and multiply'; meaning contested -- the Greek has 'your God', 'the Sufficient', 'the Almighty'); LORD of hosts first on barren Hannah's lips (1 Samuel 1:3, 11); El Roi to a runaway slave (Genesis 16:13); YHWH Yireh on Moriah (22:8 and 22:14 share ra'ah) and the Lamb (John 1:29); YHWH Rofekha at bitter Marah (Exodus 15:23-26); YHWH Nissi, nes = the serpent's pole (Numbers 21:8-9) and the root of Jesse's signal (Isaiah 11:10) -- link as-the-snake-was-lifted; YHWH Shalom to terrified Gideon (Judges 6:22-24); El Elyon and Adonai briefly, linking melchizedek-priesthood."}
  - {section: "Names the prophets gave the coming King", says: "Immanuel (Isaiah 7:14; Matthew 1:23); El Gibbor -- Isaiah's own next use is the LORD (10:21), so the child bears a divine title; YHWH Tsidkenu for the Branch (Jeremiah 23:5-6), shared with the city in 33:16 -- the righteousness is given to His people (1 Corinthians 1:30; 2 Corinthians 5:21)."}
  - {section: "The name above every name", says: "Yeshua (Numbers 13:16; Matthew 1:21); 'Eli, Eli' on the cross (Psalm 22:1; Matthew 27:46); 'before Abraham was, I am' (John 8:58, link woman-at-well); 'your name, which you have given me' (John 17:11); every knee (Isaiah 45:23; Philippians 2:9-11); calling on the name (Joel 2:32; Romans 10:13); one name of Father, Son and Spirit (Matthew 28:19). So you may call on Him by name."}
  - {section: "Discussion questions", says: "Facet-labelled per discussion-questions.md."}
  - {section: "References & Recommended Reading", says: "Lexicons, TAHOT/MACULA, study Bibles consulted, Brenton LXX."}
