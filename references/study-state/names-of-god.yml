review_2026-10-18:
  by: "review-bible-study (subagent)"
  checked: >
    All ESV quotations and quoted fragments re-queried (Exod 3:11-15, 6:2-8, 33:19, 34:5-7, 15:22-26,
    17:8-15; Gen 4:26, 14:18-22, 15:2-7, 16:11-13, 17:1-2, 22:7-14; Num 13:16, 21:8; Judg 6:22-24;
    1 Sam 1:3-11; Ruth 1:20, 4:17; Isa 6:3, 7:14, 9:6, 10:21, 11:10, 42:8, 45:23; Jer 23:5-6, 33:16;
    Joel 2:32; Matt 1:21-23, 27:46, 28:19; John 1:29, 3:14, 8:58-59, 17:11; Rom 10:9-13; 1 Cor 1:30,
    8:6; 2 Cor 5:21; Phil 2:9-11) -- all verbatim. Brenton LXX Exod 3:14, Gen 17:1, Ruth 1:20,
    Job 5:17, Num 13:16, Joel 3:5; SBLGNT Phil 2:11, John 8:58, Matt 28:19, Rom 10:13. WLC morphology
    for every Hebrew form and Strong's tag (H1961 Vqi1cs in 3:12 and 3:14; nodati VNp1cs; H7200 in
    Gen 22:8/14; H7495, H5251, H7965, H6664, H1368 at Isa 9:5 Heb and 10:21, H1954 -> H3091, H5945
    tagged 5945a, H7210). Counts re-run. All nine internal links and anchors resolve; every linked
    sibling is draft: false. ESVSB and NIV Biblical Theology Study Bible (independent) both confirm
    the 3:12/3:14 link and the 'known in experience' reading of 6:3.
  fixed:
    - "Exod 3:14 footnotes: CSB reads 'I WILL BE WHO I WILL BE' (and 'I AM BECAUSE I AM'), not 'WHAT'; now NLT and CSB given separately."
    - "YHWH tsevaot '264' -> 240 adjacent, 261 with 'the LORD God of hosts' (264 had 3 false hits: Ps 103:21, Isa 13:4 double, Isa 24:21). Prose and References."
    - "'He healed the water before He gave them a single statute' was false (Passover 'statute', Exod 12:14, 43) -> 'before He set them the statute and rule of Marah (Exodus 15:25)'."
    - "'Job uses it 31 times' -> 'the book of Job' (Eliphaz, Bildad, Zophar and Elihu say it too, e.g. Job 5:17)."
    - "hayah tagged H1961 (strongs_suggest)."
    - "bible_references completed with passages the argument quotes: Gen 4:26, Isa 42:8, 1 Sam 1:3, Num 21:8-9, Isa 11:10, John 1:29, John 3:14, 2 Cor 5:21, 1 Cor 1:30."
  open_for_author:
    - "Thesis and hook say EACH name was given to someone in trouble / at the end of their resources; the body says 'almost every'. El Elyon (Gen 14, after victory), the first LORD of hosts (1 Sam 1:3, Elkanah at worship), Isa 6:3 and Exod 3 itself do not fit. Hedge the thesis or the names chosen (Moderate)."
    - "Key Takeaways labels Exod 17:15's nes a Type of the cross via Num 21:8 and John 3:14. The link is lexical only; John 3:14 applies the serpent, not Exod 17, and as-the-snake-was-lifted.md says of Isa 11 'the vocabulary simply runs through both'. Consider 'Connection' rather than 'Type' (Moderate)."
