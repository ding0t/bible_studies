slug: "deliverance-and-the-edge-of-sorcery"
title: "Deliverance and the Edge of Sorcery"
status: published # 2026-09-28, author approved
target_path: "docs/content/spiritual-beings/deliverance/deliverance-and-the-edge-of-sorcery.md"

primary_passage: "Acts 16:16-18"
supporting_passages:
  - "Acts 16:11-40 (Philippi frame: 16:14, 16:19, 16:31)"
  - "Acts 19:13-20"
  - "Deuteronomy 18:10-11, 15; 13:1-5"
  - "1 Samuel 28:8; 1 Chronicles 10:13-14; Isaiah 8:19"
  - "Mark 1:25, 34; Luke 4:41; Mark 5:7-13"
  - "Luke 10:17-20; 1 John 4:1-4"
  - "Colossians 1:13; 2:15; Hebrews 2:14; James 4:7"
genre: [acts, gospel, epistle, topical]

point: "Command a spirit in Jesus' name and ask it nothing; rest on Jesus, not technique; weigh confession; rejoice in your name written in heaven."
thesis: >
  God has given His people His Son to listen to and His Son's name to act in, so the apostolic
  pattern commands an unclean spirit to leave in the name of Jesus and never questions it for
  knowledge -- seeking knowledge from a spirit is the inquiry Deuteronomy 18 forbids -- and the
  tests Scripture supplies (silence the spirit, rest on Jesus, weigh confession, rejoice in your name
  written in heaven) let you judge any ministry, beginning with your own.
outline:
  - {section: "Hook + In one sentence", says: "Philippi: a spirit telling the truth, silenced by one command in Jesus' name."}
  - {section: "Key Takeaways", says: "Lessons about Jesus, memory verses (Acts 16:18; Luke 10:20), Be Transformed, prayer."}
  - {section: "Philippi: the passage in its setting", says: "Lydia/girl/jailer frame; manteuomai = LXX Deut 18:10 and 1 Sam 28:8; diaponeomai; Paul's motive contested; Acts narrative corroborated by Jesus' own practice."}
  - {section: "Four tests", says: "1 command, ask nothing (+ Gerasene counter-example, both sides); 2 technique fails (Sceva); 3 confession tests a spirit; 4 rejoice in names written in heaven."}
  - {section: "When a believer manifests", says: "Indwelling vs oppression (links sibling word study); more than two explanations."}
  - {section: "What this shows about God", says: "The Prophet to listen to (Deut 18:15); the cross's victory over the powers (Col 2:15; Heb 2:14)."}
  - {section: "Discussion questions", says: "Five: language, context, Christ, hard part (Mark 5:9), transformed."}
  - {section: "Annex", says: "The moved table of NT statements about demons."}
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: |
      Forked 2026-09-26 by simplify-bible-study from docs/content/sin/sorcery.md at commit 0ffe050:
      the whole "## Deliverance and the edge of sorcery" section and "## What Scripture says about
      demons" (table + note), moved verbatim. Quotations and word studies in the moved text were
