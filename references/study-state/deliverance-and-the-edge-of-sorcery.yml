      Developed 2026-09-26 into a complete study: Acts 16:16-18 made the primary passage (it was
      already the fork's primary_passage) and given its own historical/literary exegesis.
      "the older draft of this study" sentence rewritten ("Holding indwelling and oppression
      together matters."). Divine pronouns capitalised in own prose; antithesis constructions in
      the moved text rewritten affirmatively (headings "confession, not manifestation" and "Power is
      not the measure" recast). Provenance fields removed per brief (script fills them).
      Relation to siblings: christians-and-deliverance.md owns the daimonizomai word study and the
      indwelling argument -- this study now summarises in two paragraphs and links to it;
      contemporary-deliverance.md linked as the survey of ministries; test-the-spirits.md linked
      from test 3. No content duplicated beyond that summary.
  exegesis:
    historical_context:
      done: true
      notes: |
        Philippi first Macedonian city Paul evangelised; four-part narrative (ESV SB note on
        16:11-40). "We" section (16:10ff) -- narrator traditionally Luke (ESV SB intro, Irenaeus).
        Python spirit = Delphic oracle (covered in parent, linked not repeated). Exorcists of the day
        invoked stronger spirits against weaker ones (NIV CBSB on 16:18, 19:13); name-magic: knowing a
        spirit's name thought to give control (NIV CBSB on Mark 5:9, Acts 19:13).
    literary_context:
      done: true
      notes: |
        Girl's episode sits between Lydia (16:14) and the jailer (16:31): a voice speaking about
        salvation set between two who receive it. Owners' "hope of gain was gone" (16:19) triggers
        the arrest. Acts narrative: pattern corroborated by Jesus' explicit practice (Mark 1:25, 34;
        Luke 4:41), so the study does not build a rule on one narrative.
    content_word_studies:
      done: true
      terms:
        - {word: "μαντεύομαι", language: greek, transliteration: "manteuomai", strongs_id: "G3132", gloss: "to divine, tell fortunes", notes: "1x NT (Acts 16:16), 12x LXX incl. Deut 18:10 and 1 Sam 28:8"}
        - {word: "διαπονέω", language: greek, transliteration: "diaponeō", strongs_id: "G1278", gloss: "to be greatly annoyed/distressed", notes: "NT: Acts 4:2, 16:18 (both ESV 'greatly annoyed')"}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Transcultural: command in Jesus' name; no inquiry of spirits; confession test. Cultural: Delphic oracle background."
    theological_principle:
      done: true
      notes: "God has given the Prophet to listen to (Deut 18:15) and won the victory over the powers at the cross (Col 2:15; Heb 2:14)."
    application_draft:
      done: true
      notes: "Be Transformed + prayer + discussion question 5."
  cross_reference:
    done: true
    translations_compared: ["ESV", "SBLGNT/UGNT interlinear", "LXX lemmas"]
    divergences_noted: "None material. LSB footnote at 16:18: 'Lit hour'."
    sibling_check: "cross_study_claims.py 'Acts 16' and 'Mark 5': no contradictions with other studies."
  drafting:
    done: true
    file: "docs/content/spiritual-beings/deliverance/deliverance-and-the-edge-of-sorcery.md"
  review:
    done: true
    validated: true
    notes: "npm run validate: only the expected provenance-field warnings (fields omitted per brief). mkdocs build --strict passes (draft dropped from build); anchors checked by eye."

