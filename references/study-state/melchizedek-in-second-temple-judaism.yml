    review_gaps: Ps 110:1 quoted in Mark 12:36 / Matt 22:44 / Acts 2:34 not cited -- optional lead,
    not added. Tags vs live vocabulary ok; 'second-temple' is new (only use). validate clean.
  fixed:
    - "Internal count contradiction: 11Q13 intro said 'a psalm and two prophecies', later 'a psalm and three prophecies'; the scroll uses Ps 82:1-2 and Ps 7:7-8 (English), so both now read 'two psalms and three prophecies'; Ps 7:7-8 added to the Ps 82 paragraph, References catena and bible_references."
