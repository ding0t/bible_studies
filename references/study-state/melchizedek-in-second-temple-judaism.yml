      licence: "CC BY-SA 4.0 (Perseus); Whiston public domain"
  # Raw-source checks, not replayable by evidence tooling (sources are off-disk or web-only):
  findings_11q13:
    - "II 2-3: Lev 25:13 and Deut 15:2 quoted; Deut 15:2 'shmwt kwl b`l msh yd 'sr ysh' survives."
    - "II 4: 'pshrw l'hryt hymym `l hshbwyym' -- 'its interpretation, for the last days, concerns the captives' (Isa 61:1's word). pshrw itself restored."
    - "II 5: 'wmnhlt mlky sdq' -- 'from the inheritance of Melchizedek'; no 'sons of Heaven' in the surviving letters. Johnson's 'the sons of Heaven and the lot of Melchizedek' is not DJD's text."
    - "II 6: 'ysybmh 'lyhmh wqr' lhmh drwr l`zwb lhmh [ms'] kwl `wwnwtyhmh' -- 'will bring them back to it and proclaim liberty to them, to release them [from the debt] of all their iniquities'. 'debt' restored."
    - "II 7: 'bshbw` hywbl hr'yshwn 'hr tsh[`t h]ywblym' -- first week of the jubilee after the ni[ne] jubilees; only tav-shin of 'nine' survive."
    - "II 7-8: 'wy[wm hkp]wrym ... s[wp] h`syry lkpr bw `l kwl bny [`wr w]'nsy gwrl ml[ky] sdq' -- Day of Atonement partly restored; 'tenth' survives; 'sons of [light]' restored; 'men of the lot of Melchizedek' survives."
    - "II 9: 'lsnt hrswn lmlky sdq' -- Isa 61:2's 'year of favour' with Melchizedek for YHWH; survives whole."
    - "II 10: 'k'sr ktwb `lyw bsyry dwyd ... 'lwhym [n]sb b`[dt 'l] bqwrb 'lwhym yspwt' -- Ps 82:1 applied 'concerning him' (Melchizedek). Survives except bracketed letters."
    - "II 10-11: Ps 7:8-9 (MT numbering; English 7:7-8) with 'l for MT yhwh (checked morphhb-wlc Ps 7:9). II 11: Ps 82:2. II 12: 'pshrw `l bly`l w`l rwhy gwrlw'. II 13: 'wmlky sdq yqwm nqm mspty '[l]'."
    - "II 15-16: Isa 52:7 largely survives. II 18: 'whmbsr hw['h msyh hrw]h k'sr 'mr dn[y'l ...]' -- 'anointed of the spirit' mostly restored, the Daniel 9:25 quotation wholly restored. II 24-25: 'your God' explained; Melchizedek's name there restored."
  findings_philo: >
    Leg. 3.79 king of peace and 'his own priest'; 3.80 'houtos de estin ho orthos logos' (right
    reason) against 'ho tyrannos nous'; 3.82 'hiereus gar esti logos kleron echon ton onta'. De Fuga
    108 'ton archierea ouk anthropon alla logon theion einai' -- about the Levitical high priest of
    Lev 21; Melchizedek not named in De Fuga. Philo never identifies Melchizedek with the divine
    Logos in so many words; Key Takeaways and 'reaching for' narrowed accordingly and De Fuga 108 cited.
  findings_josephus: >
    Ant. 1.180: king of Solyma (not Salem), 'semainei de touto basileus dikaios ... hierea genesthai
    tou theou; ten mentoi Solyma hysteron ekalesen Hierosolyma'. BJ 6.438: 'Chananaion dynastes ho
    te patrioi glossei klētheis basileus dikaios ... hierasato te toi theoi protos kai to hieron
    protos deimamenos' -- the name Melchizedek is absent from the Greek; Whiston supplies it in brackets.
  study_changes:
    - "Qumran section rewritten on the DJD Hebrew, own translations with editors' brackets kept; 'sons of Heaven' removed; II 9 Melchizedek-for-YHWH substitution added; Ps 82:1 'concerning him' and Ps 7 El-for-YHWH added; Daniel 9:25 now marked as a restoration; 'Melchizedek makes atonement' softened to 'whose day brings atonement'."
    - "Philo section rewritten from the Greek; De Fuga 108 added; Key Takeaways and Hebrews bullet narrowed."
    - "Josephus section rewritten from the Greek; section numbers now Niese (Ant. 1.180, BJ 6.438) with Whiston's; Solyma; name absent in BJ noted."
    - "References rewritten with editions, URLs and licences; footnote 11q13 now cites DJD 23; Isaiah 61:1-2 in bible_references."
  still_unverified: "11Q13's date ('roughly the mid-first century BC') -- not stated on the pages consulted."
