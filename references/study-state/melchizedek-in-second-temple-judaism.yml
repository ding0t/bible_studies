slug: "melchizedek-in-second-temple-judaism"
title: "Melchizedek in Second Temple Judaism"
status: draft
target_path: "docs/content/scripture/melchizedek-in-second-temple-judaism.md"
primary_passage: "Psalm 110:4"
point: >
  Before Hebrews was written, Jewish readers of Genesis 14 and Psalm 110 had built three different
  Melchizedeks -- Qumran's heavenly redeemer (11Q13), Philo's Logos, Josephus's historical king --
  and Hebrews reads Genesis 14's silences as a designed resemblance to the Son instead.
