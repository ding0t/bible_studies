slug: "melchizedek-in-second-temple-judaism"
title: "Melchizedek in Second Temple Judaism"
status: review
target_path: "docs/content/scripture/melchizedek-in-second-temple-judaism.md"

primary_passage: "Psalm 110:4"
supporting_passages: ["Genesis 14:17-20", "Psalm 76:2", "Psalm 82:1-8", "Isaiah 61:1", "Luke 4:18-21", "John 10:34-36", "Hebrews 1:13", "Hebrews 5:11", "Hebrews 7:1-27", "Hebrews 10:12-13"]
genre: [topical, psalm, ot-narrative, epistle]

point: >
  Before Hebrews was written, Jewish readers of Genesis 14 and Psalm 110 had built several different
  Melchizedeks -- Qumran's heavenly redeemer (11Q13), the Genesis retellings, the Hasmonean
  priest-kings, Philo's Logos, Josephus's historical king -- and Hebrews reads Genesis 14's silences
  as a designed resemblance to the Son and Psalm 110's oath as kept in Jesus.

thesis: >
  Second Temple Jews read Genesis 14 and Psalm 110 as a promise of a coming priest-king and reached
  for a heavenly deliverer, a divine Word or a righteous king of Jerusalem; Hebrews 7 shows that God
  kept His sworn oath in His Son Jesus, the one priest "forever" who is all three, so you can draw
  near to God through Him.
outline:
  - {section: "Key Takeaways", says: "Type (made like the Son) and prophecy (the oath); four lessons about Jesus; Ps 110:4 and Heb 7:25"}
  - {section: "The two texts", says: "Gen 14:18-20 and Ps 110:4, the silences (no genealogy, ambiguous tither) and the one question every later reader answers"}
  - {section: "Qumran: a heavenly Melchizedek", says: "11Q13's catena (Jubilee, Isa 61, Ps 82, Isa 52, Dan 9) builds an end-times redeemer on the name; caution on elohim; Johnson's chronology attributed"}
  - {section: "Genesis retold", says: "Genesis Apocryphon fills the gaps (Salem = Jerusalem, tithe from the spoil); Jubilees 13:25 keeps the tithe and loses the man (contested why)"}
  - {section: "Priest-kings in Jerusalem", says: "1 Macc 14:41 and As. Mos. 6:1: Hasmoneans take the title; their 'forever' has an expiry clause, God's oath has none"}
  - {section: "Philo and Josephus", says: "Allegory and history"}
  - {section: "What Hebrews does with the same texts", says: "Reads the silence (made like the Son), reads the oath (indestructible life, once-for-all, intercession), answers what each reader reached for, contested knowledge of 11Q13, the King still to reign"}
  - {section: "Discussion Questions", says: "Six: language, context, Christ, the hard part, be transformed"}
word_budget: 4000
word_budget_reason: ""

