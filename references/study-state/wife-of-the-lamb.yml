open_questions:
  - >-
    DECISION FOR AUTHOR: Rev 21:9-14 shows 'the Bride, the wife of the Lamb' as the city, with Israel's twelve tribes on the gates and the apostles on the foundations (ESV SB: unity of OT and NT believers). Is the wife the church alone, or all the redeemed? Intersects statement-of-faith / israel-and-the-church.
  - >-
    Hosea 2:16 is addressed to Israel. The moved text applies it to 'what the church is'; mark the referent.

