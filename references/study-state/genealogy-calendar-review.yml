dsscalendar_epoch_2026_08_22:
  source: "https://dsscalendar.org/o/ and /e/ (Ken Johnson, BibleFacts)"
  creation_bc: 3925
  note_plus_minus: "stated as 'give or take one year'"
  convention: "AM 1 = the creation year (NOT AM 0 as this repo's genealogy data uses)"
  current_year: "AD 2026 = AM 5951 on their reckoning"
  year_6000: "AD 2075, Nisan 1; year 6001 (the 'First Kingdom year') begins AD 2076"
  scheme: "14 Onahs of 500 yrs = 7,000; Enoch wheel also divides it as 10 weeks of 700, 70 centuries of 100, and 140 jubilees of 50"
  verified_mapping: "Their published week boundaries are internally exact: wk1 1-700 AM = 3925-3226 BC; wk6 3501-4200 AM = 425 BC-AD 275; wk10 6301-7000 AM = AD 2376-3075. All consistent with AM 1 = 3925 BC."
  SIGNIFICANCE: >
    This is the epoch day-is-near.md follows, and the source zadok-calendar.md cites for the
    calendar's structure -- while the site's own zadok_year uses Ussher's 4004 BC. That is the
    origin of the 79-year discrepancy the repo already flagged as unresolved.
    KEY TEST APPLIED: our Masoretic chain puts the Exodus at AM 2513, so each epoch implies an
    Exodus date -- 4004 BC implies 1491 (Ussher's own), 3959 BC implies 1446 (the standard date,
    from 1 Kgs 6:1 + the Assyrian synchronism on the 763 BC eclipse), and 3925 BC implies 1412,
    which corresponds to no reckoning I could trace. On that test A' is the only one of the three
    whose implied Exodus is independently defensible. Strengthens the A' recommendation.
