units:
  note: >
    THREE different year lengths are in play and conflating them is the biggest silent-error risk
    in the whole model. Every interval must carry its unit.
  solar:     {days: 365.2422, use: "Ages, lifespans, regnal years, all historical intervals."}
  julian:    {days: 365.25,   use: "Calendar arithmetic before AD 1582."}
  zadok:     {days: 364, intercalated: 365.25, use: "This site's absolute year-count from creation."}
  prophetic: {days: 360, use: "Prophetic spans only — Dan 7:25, 9:24-27, 12:7; Rev 11:2-3, 12:6,14."}
  KEY_FINDING_zadok_is_solar: >
    The Zadok year is 364 days (12x30 + 4 tekufah = exactly 52 weeks), but dsscalendar.org's
    intercalary week every ~5.6 years brings the mean to 364 + 7/5.6 = 365.25 days — the Julian
    year exactly. WITH intercalation, Zadok year counts ARE solar-equivalent and comparable to
    BC/AD directly. WITHOUT it, 6000 Zadok years = 5,979 solar years, a 21-year error.
    So the intercalation is not a detail; it is what makes "Zadok is absolute since creation" true.
    ACTION: state this explicitly in zadok-calendar.md. It is currently unstated.
  KEY_FINDING_prophetic_is_not: >
    1 prophetic year = 360/365.2422 = 0.98565 solar years. 490 prophetic years = 483.0 solar years.
    Prophetic years are a counting unit for prophecy, never a calendar for history. Do not use them
    for genealogy or regnal intervals.

rejected_frameworks:
  rabbinic_anno_mundi:
    epoch: "3761 BC (AD 2026 = AM 5786)"
    rejected_because: >
      Rests on Seder 'Olam Rabbah, which allots the Persian period about 52 years where Babylonian
      and Greek records give about 207 — the documented 'missing 165 years'. The compression is not
      a matter of taste; it is contradicted by dated contemporary records.
  catholic_jubilee:
    rejected_because: >
      Instituted AD 1300 by Boniface VIII; cycle went 100 -> 50 -> 33 -> 25 years, fixed at 25 since
      1470. Ecclesiastical invention with no claimed continuity to Leviticus 25's count.
  note: "Both are recorded here so the choice reads as deliberate rather than accidental."

decision_register:

  # ---- HIGH LEVERAGE: hundreds of years -------------------------
  - id: D-01
    decision: "Genesis 5 textual tradition"
    leverage_years: 586
    options:
      - {value: "MT", support: "SP concurs 6-0 in disputed places; Qumran precursors; targums; Seder Olam"}
      - {value: "LXX (+100 pattern)", support: "Josephus, Theophilus, Africanus all follow it"}
      - {value: "SP", support: "shortens Jared/Methuselah/Lamech drastically; resolves Methuselah/Flood"}
    chosen: "MT"
    reason: "The Samaritan Pentateuch is an independent HEBREW recension and it sides with MT 6-0 here. That is the strongest available non-aligned witness."
    flexibility: {give: "high", note: "Reopen if a Qumran Genesis 5 fragment with begetting ages is ever cited."}

  - id: D-02
    decision: "Genesis 11 textual tradition"
    leverage_years: 650
    options:
      - {value: "MT (short)", support: "received Hebrew; targums; Seder Olam"}
      - {value: "long (LXX/SP +100)", support: "SP concurs 6-0; Josephus 4-of-8; Africanus 4-of-4; Theophilus 6-of-9"}
    chosen: "MT — PROVISIONAL, and the weakest choice in the register"
    reason: >
      Chosen to preserve the site's published corpus, NOT because the evidence favours it. The
      evidence here runs the other way: SP swings to the long reading 6-0, exactly opposite to its
      Genesis 5 behaviour, and three early independent witnesses agree. This is the decision most
      likely to need revisiting.
    flexibility: {give: "HIGH — flagged", note: "Switching to the long reading moves creation back ~650 yrs and moves year 6000 into the past."}

  - id: D-03
    decision: "Exodus 12:40 — what the 430 years measure"
    leverage_years: 215
    options:
      - {value: "430 in Egypt (MT)", support: "plain MT reading", cost: "makes Gal 3:17's promise-to-law span 645 yrs, requiring Paul to be dating from Jacob at Beersheba"}
      - {value: "430 from the promise (LXX/SP 'and in Canaan')", support: "Gal 3:17 natural; CSB and NLT carry the variant; chain closes exactly at 215+215"}
    chosen: "430 from the promise"
    reason: "NT authority weighted per user instruction. Paul's 430 reads most naturally from the Abrahamic promise, and the internal chain then closes exactly."
    flexibility: {give: "moderate", note: "The MT defence is workable, not absurd. 215 yrs is the single largest lever after the traditions."}

  - id: D-04
    decision: "Cainan between Arphaxad and Shelah"
    leverage_years: 130
    options:
      - {value: "omit", support: "SP, Josephus, Africanus, Theophilus, Seder Olam, all 3 targums, P75, Codex Bezae; LXX's own numbers for him duplicate Shelah's exactly; absent from 1 Chr 1:24 in BOTH MT and LXX"}
      - {value: "include", support: "NA28 prints it unbracketed at Luke 3:36; Codex Vaticanus; Augustine; Jubilees 8:1-5"}
    chosen: "omit"
    reason: "Steinmann, JETS 60/4 (2017) 697-711. Every witness that has Cainan is 4th century or later. The duplicated-numbers argument is decisive."
    flexibility: {give: "low", note: "Only bites if the long Genesis 11 is adopted; irrelevant under MT."}

  # ---- MID LEVERAGE: tens of years ------------------------------
  - id: D-05
    decision: "Terah's age at Abram's birth"
    leverage_years: 60
    options:
      - {value: 70, support: "Gen 11:26 plain", cost: "contradicts Acts 7:4 unless SP's 145-yr Terah total is also taken"}
      - {value: 130, support: "Acts 7:4 + Gen 11:32 + Gen 12:4; Abram listed first by covenant priority, as Shem is over the elder Japheth (Gen 10:21)"}
      - {value: "70 with SP's 145 total", support: "satisfies Gen 11:26 AND Acts 7:4 with no reinterpretation; already adopted by harmonized_v1"}
    chosen: 130
    reason: "NT authority. Acts 7:4 places Abram's departure after Terah's death; with a 205-yr Terah that forces 130."
    flexibility: {give: "moderate", note: "The SP route is arguably more elegant and reaches the same place by a different door."}

  - id: D-06
    decision: "Nahor's age at Terah's birth"
    leverage_years: 50
    options:
      - {value: 29, support: "MT alone"}
      - {value: 79, support: "Samaritan Pentateuch AND LXX Codex Alexandrinus; Theophilus at 75"}
      - {value: 179, support: "LXX Codex Vaticanus / Brenton only — looks like the familiar +100"}
    chosen: "79 — for variant A''; 29 retained in A'"
    reason: >
      MT's 29 stands alone against an independent Hebrew recension plus a major LXX uncial. On the
      repo's own harmonized_v1 principle (adopt a reading only where it earns its keep) 79 earns it.
      This single number is what lets A'' reach the published 4004 BC epoch.
    flexibility: {give: "low", note: "Well attested. Also dissolves one of the two 'SP sides with neither' cases, which was an artifact of the repo following Brenton."}

  # ---- LOW LEVERAGE: single years, but they set the anchors ------
  - id: D-07
    decision: "Crucifixion year"
    leverage_years: 3
    options:
      - {value: "AD 33 (Fri 3 April)", support: "user preference; most common; Dan 9 from a 444 BC decree lands AD 33.1; Luke 3:1 + a ~3.5-yr ministry"}
      - {value: "AD 30 (Fri 7 April)", support: "also an astronomically valid Nisan Passover; favoured on a 445 BC decree with a shorter ministry"}
    chosen: "AD 33 — Friday 3 April. SETTLED 2026-08-22 after a dedicated pass."
    candidate_set: >
      Hard constraint: crucifixion on a Friday (Mark 15:42; Luke 23:54; John 19:31) at Passover
      under Pilate (prefect AD 26-36). Reconstructing the calendar from first crescent visibility,
      Nisan 14 fell on a Friday exactly twice in that window: 7 April AD 30 and 3 April AD 33.
      BOTH are Nisan 14, so the Synoptic-vs-John question of Nisan 14 or 15 does NOT discriminate.
    evidence_for_AD33:
      - {weight: PRIMARY, item: "Luke 3:1. Tiberius acceded 19 Aug AD 14, so his 15th year is Aug 28 - Aug 29. ESVSB: 'probably A.D. 29 (plus or minus a year)'; NIVBTSB: 'AD 28-29'. John starts there, Jesus after, and John's Passovers (2:13; 6:4; 11:55, maybe 5:1) carry ~3 years to AD 33. Reaching AD 30 needs the co-regency reckoning from AD 11-13, which sits awkwardly beside Luke's precision with five named officials."}
      - {weight: SUPPORTING, item: "Sejanus. John 19:12's 'not Caesar's friend' (amicus Caesaris) bites on Pilate only after his patron Sejanus fell in Oct AD 31. Favours a date after AD 31, excluding AD 30."}
      - {weight: SUPPORTING, item: "Daniel 9:25 EXCLUDES AD 30 outright on this site's reckoning. 69 x 7 x 360 = 173,880 d = 476.07 solar yr. From 445 BC -> AD 32; from 444 BC -> AD 33. Neither route reaches AD 30."}
      - {weight: WEAK, item: "Paul. Gallio proconsul of Achaia AD 51/52 (Acts 18:12); Gal 1:18 + 2:1 give 3 then 14 years back to a conversion c. AD 34-35. Sits better after AD 33 than AD 30. Weak because the two spans may overlap."}
    evidence_neutral:
      - >
        JOHN 2:20 IS NEUTRAL — this CORRECTS an earlier claim in this session that it favoured AD 30,
        and a subsequent overcorrection that the Greek settled it for AD 33. The text is
        'Tesserakonta kai hex etesin oikodomethe ho naos houtos' — aorist oikodomethe, and NAOS
        (sanctuary) not HIERON (precinct). Josephus has the naos built in 18 months from Herod's
        18th year, done c. 18/17 BC; the precinct was unfinished until the AD 60s. The dative etesin
        supports two senses and each pairs with one candidate to give a ~3-year ministry:
          'has taken 46 years to build' , from Herod's start 20/19 BC -> first Passover AD 27 -> AD 30
          'was built 46 years ago'      , from the naos done 18/17 BC -> first Passover AD 29/30 -> AD 33
        Compatible with both; selects neither.
    evidence_rejected:
      - >
        THE LUNAR ECLIPSE ARGUMENT IS NOT USED. Humphreys & Waddington (Nature 306, 1983) proposed
        the partial eclipse rising over Jerusalem on 3 April AD 33 as the referent of Acts 2:20's
        'the moon to blood'. It fails twice. (a) Bradley Schaefer argues the eclipsed portion was
        not detectable to the naked eye at moonrise; Humphreys' reply has not settled it.
        (b) Peter is quoting Joel 2:31 about what WILL happen before the day of the LORD, so reading
        it as a report of the previous Friday's sky asks the sermon for something it is not doing.
        An argument needing both a contested observation and a strained citation cannot be
        load-bearing. Removed from the case even though it points the way we chose.
    verdict: >
      Friday 3 April AD 33. The DATE is astronomically exact once the year is fixed; the YEAR is a
      strong judgement, not a certainty. AD 30 remains defensible for anyone taking Tiberius's 15th
      year from the co-regency, and the page records that rather than dismissing it.
    flexibility: {give: "low", note: "Settled on Luke 3:1 read naturally + Sejanus + Daniel 9 + Paul. Would reopen only if the co-regency reckoning of Tiberius were independently established."}

  - id: D-08
    decision: "Artaxerxes' 20th year (Neh 2:1) — the Daniel 9 decree"
    leverage_years: 1
    options:
      - {value: "445 BC", support: "accession-year reckoning; Anderson's classic, lands Triumphal Entry 6 Apr AD 32"}
      - {value: "444 BC", support: "non-accession / Tishri reckoning; lands AD 33"}
    chosen: "444 BC"
    reason: "Follows from D-07. Recorded as a consequence, not an independent finding."
    flexibility: {give: "high", note: "One year. Chosen for consistency with the crucifixion date rather than on its own evidence."}

  - id: D-09
    decision: "Solomon's 4th year (the chain's only non-biblical anchor)"
    leverage_years: 5
    options:
      - {value: "966 BC", support: "Thiele; standard; via Ahab at Qarqar 853 BC, anchored by the Bur-Sagale eclipse of 763 BC"}
      - {value: "961 BC", support: "within the accession/non-accession and co-regency spread; required for A'' to land exactly on 4004 BC"}
    chosen: "966 BC for A'; 961 BC for A''-exact"
    reason: "966 is the defensible default. 961 is only used to demonstrate that the published epoch IS reachable, and is marked as a nudge."
    flexibility: {give: "moderate", note: "HONESTY FLAG: adjusting this to hit a predetermined creation date is reasoning backwards. Keep 1446 BC unless there is independent regnal evidence."}

  - id: D-10
    decision: "Exodus date"
    leverage_years: 186
    options:
      - {value: "1446 BC (early)", support: "1 Kgs 6:1's 480 taken literally + Solomon 966"}
      - {value: "1441 BC", support: "as above with Solomon 961"}
      - {value: "c.1260 BC (late)", support: "Ramesses II archaeology", cost: "requires reading the 480 as 12 generations x 40, i.e. symbolic"}
    chosen: "1446 BC"
    reason: "Site already uses it in prophecy-events-times.md and ancient-texts-manuscripts.md. Takes 1 Kgs 6:1 at face value."
    flexibility: {give: "low", note: "The late date would push creation ~186 yrs later and is inconsistent with the site's existing pages."}

  # ---- FRAMEWORK DECISIONS, not date decisions ------------------
  - id: D-11
    decision: "Jubilee cycle length"
    leverage_years: "~120 over 6000 yrs"
    options:
      - {value: 49, support: "Lev 25:8's 'seven times seven years... forty-nine years'; year 50 doubles as year 1 of the next cycle"}
      - {value: 50, support: "Lev 25:10's 'consecrate the fiftieth year' as a standalone year"}
    chosen: "UNRESOLVED — deliberately"
    reason: >
      Leviticus 25:8-10 is genuinely ambiguous and the text does not settle it. Over ~120 cycles the
      two readings diverge by ~120 years, so jubilee counting CANNOT bridge from creation.
    flexibility: {give: "n/a", note: "RULE ADOPTED: jubilees may be used as a resolution bucket for the historical era, counted BACKWARD from an attested sabbatical year. Never counted forward from creation."}
    external_datum_2026_08_22: >
      dsscalendar.org's Enoch wheel divides 7,000 years into 10 weeks of 700, 70 centuries of 100,
      and 140 JUBILEES OF 50 YEARS. So Ken Johnson's scheme resolves the Lev 25:8-10 ambiguity as
      50, not 49 -- 140 x 50 = 7,000 exactly, where 49-year cycles do not divide the total.
      Recorded as that scheme's answer, not adopted here: our own rule still forbids counting
      jubilees forward from creation, and the three attested sabbatical years anchor the historical
      cycle independently of which length is used.

  - id: D-12
    decision: "Jubilee 'magnetism' — how events attach to cycles"
    options:
      - {value: "ATTRACTED", support: "Scripture itself dates the event by a sabbatical/jubilee marker"}
      - {value: "SNAPPED", support: "we round an undated event to the nearest cycle"}
    chosen: "ATTRACTED only; SNAPPED forbidden"
    reason: >
      Snapping manufactures precision. Attracted cases are real and verified this session:
      Ezekiel 40:1 (25th year of exile, 10th day of the 7th month = Day of Atonement, which
      Lev 25:9 names as the jubilee trumpet day); 2 Chr 36:21 (70 years as the land's missed
      sabbaths, implying 490 years of breach); Daniel 9:24 (seventy weeks = 490).
    flexibility: {give: "none", note: "If an event must be snapped, mark it visibly as an editorial placement, not a date."}

  - id: D-13
    decision: "Retain or retire the year-6000 expectation"
    options:
      - {value: "retain", requires: "creation no earlier than 3975 BC — only A' (3959) qualifies, giving year 6000 = AD 2042"}
      - {value: "retire", requires: "accepting that any epoch at or before 3975 BC puts year 6000 in the past"}
    chosen: "OPEN — user decision"
    reason: >
      Derived constraint: Zadok 6000 falls in AD (6000 - creation_BC + 1). Future from AD 2026
      requires creation <= 3975 BC. The site's published 4004 BC gives AD 1997, already past.
      This is arithmetic, not interpretation.
    flexibility: {give: "n/a", note: "The framework is an inference from 2 Pet 3:8 + Rev 20. The manuscript readings are evidence. Weigh accordingly."}

leverage_summary: >
  Ordered by how many years each decision moves the answer:
    Gen 11 tradition 650 | Gen 5 tradition 586 | sojourn reading 215 | Exodus date 186 |
    Cainan 130 | Terah 60 | Nahor 50 | Solomon's 4th yr 5 | crucifixion 3 | decree 1
  CONSEQUENCE WORTH STATING ON THE PAGE: the anchors are the precise part. All the argument about
  +/-5 years at Solomon is dwarfed by one decision about what Exodus 12:40's 430 years measure.
  Spend the reader's attention accordingly.
