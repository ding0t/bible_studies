opened: "2026-08-22"
trigger: >
  Raised out of the world-population study's weakness section. User asked for a Scripture-first
  review of the genealogy and calendar studies, weighing how NT authors treat dates, tracking two
  Scripture-based timelines, and recommending which is most logically based. Zadok year is taken as
  ABSOLUTE years since creation, so each timeline variant must carry its own Gregorian offset.

# ---------------------------------------------------------------- anchors
anchor_chain:
  note: >
    One extra-biblical peg only. Everything else is Scripture's own arithmetic.
  pegs:
    - {ref: "1 Kings 6:1", datum: "480 years from the Exodus to Solomon's 4th year"}
    - {ref: "Solomon yr 4 = 966 BC", datum: "Assyrian synchronism (Ahab at Qarqar 853 BC), itself anchored by the astronomically fixed Bur-Sagale solar eclipse of 763 BC. THE ONLY NON-BIBLICAL ANCHOR IN THE CHAIN."}
    - {ref: "-> Exodus 1446 BC", datum: "the 'early date'; the site already uses it in prophecy-events-times.md and ancient-texts-manuscripts.md"}
    - {ref: "Genesis 12:4", datum: "Abram 75 at the call"}
    - {ref: "Genesis 21:5 / 25:26 / 47:9", datum: "Abraham 100 at Isaac; Isaac 60 at Jacob; Jacob 130 at the descent into Egypt"}
    - {ref: "Genesis 7:11 / 11:10", datum: "Flood in Noah's 600th year; Arphaxad born 2 years after it"}
  all_verified: "2026-08-22, against study-notes.db esv-study-bible. Zero mismatches."

# ---------------------------------------------------------------- NT weight
nt_treatment_of_dates:
  luke_3_36_cainan:
    verdict: "PROBABLY NOT AUTHENTIC — corrects an earlier claim made in this session."
    detail: >
      I had told the user Luke 3:36's Cainan was the strongest NT datum for the LXX. Andrew
      Steinmann, "Challenging the Authenticity of Cainan, Son of Arpachshad," JETS 60/4 (2017)
      697-711, makes a strong contrary case, and the primary evidence checks out.
      AGAINST Cainan: P75 (early 3rd c., the oldest extant Luke) omits it; Codex Bezae omits it;
      Josephus, Julius Africanus, Theophilus of Antioch, Seder 'Olam Rabbah, all three Targums and
      the Samaritan Pentateuch have no knowledge of him. Every source that has him is 4th century
      or later (Codex Vaticanus onward). Mechanism for insertion is easy — Luke 3:37 has Kainam one
      line down, so a scribe's eye-skip inserts it at 3:36; there is no comparable trigger for
      accidental omission.
      KILLER INTERNAL ARGUMENT: LXX Gen 11:12-13 gives Cainan 130 years before Shelah's birth and
      330 after — exactly the numbers LXX gives Shelah before and after fathering Eber (11:14-15).
      No other father/son pair in Genesis 5 or 11 shares BOTH numbers in any tradition. The Cainan
      entry looks like a mechanical duplication of the Shelah entry with the name swapped.
      CONFIRMED INDEPENDENTLY FROM REPO DATA: 1 Chr 1:24 has no Cainan in MT (WEB) or in the
      Brenton LXX. The Septuagint contradicts itself — Cainan in Gen 11, absent in 1 Chr 1.
      COUNTERWEIGHT, recorded fairly: NA28/UBS still print Cainan unbracketed; Helen Jacobus
      (JSP 18, 2009) argues he was original to the MT; and a 2020 paper questions the P75 fragment
      identification. Contested, but the weight is against authenticity.
    effect: "Removes 130 years from any LXX-based chronology."
  acts_7_4:
    datum: "Abraham left Haran AFTER Terah died. With Terah's 205 (Gen 11:32) and Abram's 75 (Gen 12:4), Terah was 130 at Abram's birth, not the 70 of Gen 11:26."
    note: "Gen 11:26 lists Abram first by covenant priority, not birth order — same convention as Shem/Ham/Japheth, where Gen 10:21 makes Japheth the elder. SP's 145-year Terah total satisfies Acts 7:4 with a plain 70 instead, which is why harmonized_v1 already adopts it."
  gal_3_17:
    datum: "The law came 430 years after the promise."
    note: >
      MOST NATURAL on the LXX/SP reading of Exod 12:40 (430 years in Egypt AND Canaan, i.e. from
      Abram's call). On MT's 430-in-Egypt the span from the call to the Exodus is 645 years, and
      Paul's 430 has to be measured from God's word to Jacob at Beersheba (Gen 46:2-4) instead.
      That defence works but is less natural. VERIFIED: under the 215-year reading the chain closes
      exactly — call at Abram 75, Isaac at 100, Jacob at Isaac 60, descent at Jacob 130, 215 years
      in Egypt = 430 from call to Exodus.
  acts_7_14:
    datum: "75 souls to Egypt (LXX Gen 46:27 / Exod 1:5), where MT reads 70. Genuine NT use of an LXX number."
  jude_14:
    datum: "'Enoch, the seventh from Adam' — Adam(1) Seth(2) Enosh(3) Kenan(4) Mahalalel(5) Jared(6) Enoch(7)."
    note: "Holds identically in MT, LXX and SP, so it does not discriminate between them. It DOES witness that Genesis 5 is a closed chain with no telescoping in its first seven links — which is what the arithmetic requires."
  matthew_1:
    datum: "Demonstrably selective — omits Ahaziah, Joash and Amaziah between Joram and Uzziah to make 14/14/14."
    note: "Proves biblical genealogies CAN telescope. Does not reach Genesis 5/11, which give age-at-begetting rather than bare names; a skipped name there would break the arithmetic, not just the list."

# ---------------------------------------------------------------- textual evidence
manuscript_evidence:
  MAIN_FINDING: >
    The Samaritan Pentateuch is the swing witness, and it swings DIFFERENTLY IN EACH CHAPTER.
    Derived directly from docs/data/genealogy/*.json, counting only places where MT and LXX differ:
      Genesis 5  — SP sides with MT 6 times, with LXX 0 times.
      Genesis 11 — SP sides with LXX 6 times, with MT 0 times.
    SP is an independent HEBREW recension (c. 100 BC) transmitted outside both rabbinic and
    Christian channels, so this is not Greek-vs-Hebrew. It is evidence that Genesis 5 and Genesis 11
    have different textual histories and should not be decided as one block.
  supporting_witnesses_for_long_genesis_11:
    - "Josephus (late 1st c., Jewish, pre-Christian-recension): agrees with LXX against MT in 4 of 8 Gen 11 fathering ages, and gives numbers 100 higher than MT in 2 more."
    - "Julius Africanus (late 2nd/early 3rd c.): agrees with LXX against MT in all 4 Gen 11 ages he reports."
    - "Theophilus of Antioch (c. AD 169-184): agrees with LXX against MT in 6 of 9."
    - "Samaritan Pentateuch: 6 of 6."
  nahor_variant:
    detail: "MT 29 / LXX-Brenton(Vaticanus) 179 / SP 79 / Codex Alexandrinus 79 / Theophilus 75. The 179 is a Vaticanus-only reading that looks like the familiar +100. The repo's LXX data uses Brenton and therefore inherits 179, inflating every LXX-based total by 100 years."
    action: "Treat 79 as the better-attested long reading."

# ---------------------------------------------------------------- the timelines
timelines_computed:
  method: "Zadok year = absolute years since creation. Gregorian epoch DERIVED per variant by anchoring the Exodus at 1446 BC and walking Scripture's chain backward."
  results:
    - {id: "A",  desc: "MT throughout, 430-in-Egypt",                         creation_bc: 4174, flood_bc: 2518, abram_bc: 2166, year_6000: "AD 1827", today_zadok: 6199}
    - {id: "A'", desc: "MT throughout, 430-from-the-promise (= Ussher's own chain)", creation_bc: 3959, flood_bc: 2303, abram_bc: 1951, year_6000: "AD 2042", today_zadok: 5984}
    - {id: "B",  desc: "LXX throughout + Cainan + Nahor 179 (maximal long)",  creation_bc: 5425, flood_bc: 3183, abram_bc: 1951, year_6000: "AD 576",  today_zadok: 7450}
    - {id: "B'", desc: "LXX throughout, Cainan removed, Nahor 179",           creation_bc: 5295, flood_bc: 3053, abram_bc: 1951, year_6000: "AD 706",  today_zadok: 7320}
    - {id: "C",  desc: "MT Gen 5 + long Gen 11, no Cainan, Nahor 79",         creation_bc: 4609, flood_bc: 2953, abram_bc: 1951, year_6000: "AD 1392", today_zadok: 6634}
    - {id: "C'", desc: "as C but Terah 70 with SP's 145 total",               creation_bc: 4549, flood_bc: 2893, abram_bc: 1951, year_6000: "AD 1452", today_zadok: 6574}
    - {id: "A''", desc: "A' with Nahor 79 (SP/Alexandrinus), Exodus 1446 BC",  creation_bc: 4009, flood_bc: 2353, abram_bc: 1951, year_6000: "AD 1992", today_zadok: 6034}
    - {id: "A''*", desc: "A'' with Exodus 1441 BC — REPRODUCES THE SITE'S PUBLISHED EPOCH EXACTLY", creation_bc: 4004, flood_bc: 2348, abram_bc: 1946, year_6000: "AD 1997", today_zadok: 6029}
  a_double_prime:
    question: "User asked whether a variant exists that lands on the site's published 4004 BC."
    answer: >
      YES. Exhaustive search over Gen5 tradition x Gen11 tradition x Cainan x Nahor variant x Terah
      x sojourn found exactly one chain reaching 4004 BC on a defensible Exodus date: MT throughout,
      no Cainan, Terah 130 (Acts 7:4), 430-from-the-promise, and NAHOR AT 79 instead of MT's 29.
      Chain length creation->Exodus = AM 2563; with Exodus 1441 BC that is creation 4004 BC and
      Flood 2348 BC — identical to every number the site already publishes, including AM 4000 = 4 BC
      (the traditional Nativity date day-is-a-thousand-years.md already notes).
    nahor_attestation:
      MT: 29
      Samaritan_Pentateuch: 79
      LXX_Codex_Alexandrinus: 79
      Theophilus_of_Antioch: 75
      LXX_Codex_Vaticanus_Brenton: 179
      assessment: >
        79 carries an independent Hebrew recension (SP) plus a major LXX uncial (A), with Theophilus
        at 75 nearby. MT's 29 stands alone and looks like loss of an initial digit; Vaticanus's 179
        looks like the familiar +100. On the repo's own harmonized_v1 principle — adopt a reading
        only where it earns its keep — Nahor 79 earns it. NOTE this also dissolves one of the two
        "SP sides with neither" cases in the Genesis 11 table: SP and LXX-A agree at 79, and the
        disagreement was an artifact of the repo's LXX data following Brenton/Vaticanus.
    honest_caveats:
      - "Landing EXACTLY on 4004 needs the Exodus at 1441 BC (Solomon's 4th year 961 rather than 966). That is inside the spread of Israelite regnal chronology, but it is a 5-year adjustment made to hit a predetermined number. At the standard 1446 BC the chain gives 4009 BC."
      - "The convergence with Ussher is arithmetic coincidence, not confirmation. Ussher reached 4004 BC with Nahor 29 and an Exodus of 1491 BC. A'' reaches it with Nahor 79 and an Exodus of 1441. The +50 from Nahor and the -50 from the anchor cancel. Two different routes, same destination — do not present this as independent corroboration."
      - "DECISIVE COST: creation at 4004/4009 BC puts Zadok 6000 at AD 1997/1992 — already past. The six-days-of-history framework in day-is-a-thousand-years.md and day-is-near.md cannot survive it."
  six_millennia_constraint:
    derivation: "Zadok 6000 falls in AD (6000 - creation_BC + 1). For that to still be future from AD 2026, creation must be no earlier than 3975 BC."
    consequence: >
      A' (3959 BC) satisfies it with 16 years in hand, giving year 6000 = AD 2042.
      A'' (4004/4009 BC) fails it. The site's published epoch and its published six-days framework
      are mutually exclusive; this is the same contradiction day-is-a-thousand-years.md already
      flags at its "Why nobody has got the date right" table, now quantified.
  ussher_cross_check:
    finding: >
      A' reproduces Ussher exactly. Ussher's Exodus sits at AM 2513 and so does A'. Ussher published
      creation 4004 BC because he anchored the Exodus at 1491 BC; 4004 - 1491 = 3959 - 1446 = 2513.
      So the site's 4004 BC IS Ussher's chain, carrying Ussher's 1491 BC Exodus date — which the
      site has already abandoned elsewhere in favour of 1446 BC.
      CONSEQUENCE: on the site's own stated Exodus date, its own MT chain gives creation 3959 BC,
      not 4004 BC, and year 6000 at AD 2042 rather than AD 1997.

# ---------------------------------------------------------------- the trilemma
central_tension:
  statement: >
    Three goals cannot be satisfied at once, and the site currently holds all three implicitly.
  legs:
    - goal: "Year 6000 still future (the six-days-of-history framework in day-is-a-thousand-years.md and day-is-near.md)"
      requires: "A short, MT-type chronology. Only A' (AD 2042) keeps it future at all."
      cost: "Maximal conflict with Egyptian and Mesopotamian archaeology."
    - goal: "Archaeological fit (Flood before Egypt's Dynasty 1, c. 3100 BC)"
      requires: "The maximal long chronology B (Flood 3183 BC)."
      cost: "Depends on the two WEAKEST-attested readings — Cainan (spurious per Steinmann) and Nahor 179 (Vaticanus only). And it puts year 6000 at AD 576, destroying the framework."
    - goal: "Follow the manuscript evidence chapter by chapter"
      requires: "C — MT Genesis 5, long Genesis 11 without Cainan, Nahor 79."
      cost: "Flood 2953 BC still postdates Dynasty 1 by ~150 years, so it does NOT rescue the archaeology; and year 6000 fell in AD 1392."
  honest_conclusion: >
    The reconstruction that best fits the manuscripts does not fix the archaeology, and the one that
    fixes the archaeology has the weakest textual support. This CORRECTS the impression given
    earlier in the session that the LXX cleanly dissolves the Egyptian problem — it does so only in
    its maximal form, which the evidence does not support.

# ---------------------------------------------------------------- defects found
defects:
  - id: "GEN-1"
    severity: "Major"
    status: "RESOLVED 2026-08-22"
    resolution: >
      genealogy_chronology.py no longer stamps a Gregorian year during the walk. It now derives
      each variant's creation epoch from ONE shared downstream anchor (the Exodus) via
      creation_epoch_bc(), then applies it in apply_epoch(). All anchor parameters live in
      index.json's new chronology_anchor block with their scriptural basis, so moving the epoch
      is a one-number change. LXX Flood corrected from 1762 BC to 3228 BC -- now EARLIER than
      MT's, as its longer genealogies require. MT output unchanged (creation 4004 BC, Flood
      2348 BC), so nothing already published moved.
      TWO SUB-DEFECTS SURFACED AND FIXED WHILE DOING THIS:
      (a) The walk chained Shem's birth from Genesis 5:32 (Noah 500) while the hardcoded -4004
          offset assumed the Genesis 11:10 chain (Arpachshad 2 years after the Flood). The two
          disagree by 2 years and the mismatch was silent. Now an explicit shem_birth_basis
          setting, defaulting to gen_11_10 with both readings documented.
      (b) harmonized_v1 was incoherent under a global terah_to_abram of 130: it adopts the
          Samaritan 145-year Terah precisely so Genesis 11:26's plain 70 satisfies Acts 7:4.
          Variants may now override terah_to_abram; harmonized_v1 sets 70 with its reason.
    verified: "utils/validate_genealogy.py PASSED; npm test all green (four timeline variants indexed); mkdocs --strict clean; no new validate warnings."
    where: "references/build/genealogy_chronology.py lines 92, 94"
    finding: "gregorian_year is computed as `zadok_year - 4004` for EVERY timeline variant. That pins creation at one Gregorian date and lets the Flood slide later under longer genealogies, inverting their actual effect. Zadok 0 is creation (absolute); its Gregorian equivalent is DERIVED and must differ per variant."
    effect: "Publishes LXX Flood at 1762 BC — later than MT's 2348 BC — when the LXX's longer chain should place it EARLIER, near 3050-3180 BC. Feeds genealogy-times.md's four-variant table and the world-population study's sensitivity table."
    fix: "Give each variant its own epoch, derived by anchoring a fixed historical point (Exodus 1446 BC) and walking the chain back."
  - id: "GEN-2"
    severity: "Moderate"
    status: "RESOLVED 2026-08-22"
    resolution: >
      Root cause was a missing year zero. Gregorian years run 1 BC -> AD 1 with no year 0, so an
      elapsed-year count crossing that boundary gains one; both converters subtracted straight
      through it. Standardised on the convention the genealogy data already used (Zadok/AM year =
      ELAPSED years since creation, Adam at 0, creation year 4004 BC), because that is the larger
      body of data (33 people x 4 variants), it is what chronology-anchors.md already used, and it
      matches the user's own framing that Zadok is absolute since creation.
      FIXED: app/src/utils/calendarConvert.js (zadokToGregorian/gregorianToZadok now skip the gap;
      year 0 input rejected) and app/src/utils/chronology.js (amToGregorian/gregorianToAm likewise
      -- a SECOND converter with the identical defect, found while fixing the first).
      DATA CORRECTED: three studies carried a zadok_year one too high --
      feasts/last-supper-four-cups.md 4037 -> 4036, jesus/woman-issue-of-blood-faith-and-access.md
      and jesus/woman-with-the-issue-of-blood.md 4036 -> 4035. docs/data/events.json regenerated.
      docs/data/chronology.json's millennial_2075 epoch moved from am0_gregorian -3925 to -3926,
      because dsscalendar.org counts the creation year as AM 1 rather than AM 0; without that shift
      the corrected arithmetic would have rendered AM 6000 as AD 2076 and broken the AD 2075 claim
      that epoch exists to encode. Its genealogy epoch note was also stale after GEN-1 and now says
      each variant derives its own creation_bc.
      NOTE: the file's own header had said "Year 0 = Adam's creation (4004 BC)" while its test
      asserted gregorianToZadok(-4003) === 1, i.e. AM 1 = 4004 BC. The two conventions had been
      live in one file.
    verified: "npm test 21/21 green including new boundary assertions (AM 4003 = 1 BC, AM 4004 = AD 1, year zero rejected); mkdocs --strict clean."
    where: "app/src/utils/calendarConvert.js"
    finding: "Off-by-one between the file's comments and its arithmetic. The header says 'Adam created in 4004 BC = Year -4003 in astronomical numbering = Zadok Year 0', but zadokToGregorian(0) returns -4004, which is 4005 BC. A worked example also labels zadokToGregorian(4004)=0 as 'Adam's birth year'."
    effect: "One-year drift in every published zadok_year/gregorian_year pair and on the prophetic timeline."
  - id: "GEN-3"
    severity: "Moderate"
    status: "RESOLVED 2026-08-22 -- zadok-calendar.md gains a 'Where year 0 sits' section stating that Zadok year 0 is Adam's creation and absolute, tabulating the three live epochs (4004 / 3959 / 3925 BC) with what each makes of the present and of year 6000, showing that all three differ ONLY in where they anchor the Exodus (1491 / 1446 / 1412 BC), and naming the unreconciled fact that the page follows dsscalendar.org on structure but Ussher on epoch."
    where: "docs/content/feasts/zadok-calendar.md"
    finding: "The page never states or argues where year 0 sits. The 4004 BC epoch exists only as a hardcoded constant in two code files, sourced to Ussher implicitly and never defended from Scripture anywhere on the site."
  - id: "GEN-4"
    severity: "Moderate"
    where: "docs/data/genealogy/*.json (lxx tradition), Nahor"
    finding: "LXX Nahor 179 follows Brenton/Vaticanus. SP, Codex Alexandrinus and Theophilus all give 79. Inflates LXX totals by 100 years."
  - id: "GEN-5"
    severity: "Minor"
    status: "RESOLVED 2026-08-22 -- index.json's lxx description now records that Luke's Cainan is absent from P75 and Codex Bezae and from every witness before the 4th century, and that LXX gives Cainan the same two numbers it gives Shelah. Retained as the LXX-as-printed variant, explicitly not as an endorsement."
    where: "docs/data/genealogy/index.json, lxx variant description"
    finding: "Describes the extra Cainan as 'matching Luke 3:36' without noting that Luke's Cainan is itself contested and absent from P75 and Codex Bezae."
  - id: "GEN-6"
    severity: "Resolved-by-analysis"
    where: "day-is-near.md (~3925 BC) vs the site convention (4004 BC)"
    finding: "The 79-year gap the repo already flags as unresolved shrinks to 34 years once the MT chain is re-anchored to the site's own 1446 BC Exodus (A', creation 3959 BC, year 6000 = AD 2042)."

scenarios_now_tracked_in_code:
  where: "docs/data/genealogy/index.json -> chronology_scenarios"
  added: "2026-08-22"
  design: >
    Two orthogonal axes, previously conflated. timeline_variants are MANUSCRIPT traditions
    (MT / LXX / SP / harmonized_v1). chronology_scenarios are ANCHORING decisions -- the Exodus
    anchor and the Nahor reading. A creation date is the product of one variant and one scenario,
    never of a variant alone. 'active' drives the generated files; the other scenarios are computed
    and printed by genealogy_chronology.py on every run so the alternates stay visible.
  scoping_bug_caught_while_building_it: >
    A scenario-level Nahor reading initially applied to EVERY variant, which overwrote the
    Septuagint's own 179 and the Samaritan's 79 and made both useless as independent witnesses
    (LXX creation moved 5470 -> 5320 BC). Now restricted to MT-based variants, which is the only
    chain the scenarios are defined against. Published LXX/SP figures verified unchanged after
    the fix.
  each_scenario_carries: "anchor_exodus_bc, nahor_age_at_terah_birth with its source, derived_creation_bc_mt, am_of_ad_2026, year_6000_falls, and explicit 'for' and 'against' lists."
  active: "ussher_published -- unchanged, so nothing already published moved."

recommendation:
  primary: >
    Keep the Masoretic chain as the site default, but re-anchor it. Adopt A': creation 3959 BC,
    year 6000 = AD 2042. This is Ussher's own arithmetic carried on the Exodus date the site already
    uses elsewhere, it takes the Gal 3:17-friendly reading of Exodus 12:40, and it very nearly closes
    the standing day-is-near.md discrepancy.
  second_timeline_to_track: >
    C — MT Genesis 5 + long Genesis 11 without Cainan, Nahor 79 — creation 4609 BC. Best-attested
    long option, following the Samaritan swing witness chapter by chapter rather than adopting a
    tradition wholesale. Track it as the alternate rather than the default, and state plainly that
    it moves year 6000 into the past.
  do_not: >
    Do not adopt the maximal LXX (B). It buys archaeological fit with the two readings the evidence
    least supports, and it forfeits the six-days framework entirely.

