thesis: >-
  Yom Teruah is a day of rest and shouting at the seventh new moon, a memorial in which God's
  people sound out before Him and He remembers them; the New Testament never names the feast, so
  its link to "the last trumpet" stays a suggestive inference, while its call to readiness for the
  Lord's coming is plain.
outline:
  - "The day in Israel's calendar: first of the autumn three; the only Lev 23 feast on a new moon (date known only within two days); Num 29:1 'yom teruah'; shabbaton."
  - "Teruah: the word (36 occurrences, shout/alarm/joy); Lev 23:24 names no instrument (MT, 11Q1, 4Q24) -- LXX supplies 'trumpets'; Num 10:9-10 explains zikkaron + teruah: God remembers His people (covenant faithfulness)."
  - "How Israel kept it: Mishnah RH 1:1 (four new years), 1:7 + 4:4 (witnesses), 3:3 + 4:9 (shofar); Ezek 40:1 only biblical 'rosh hashanah'; ceremonial-law line, Col 2:17."
  - "Typology: Chumney's first/last/great trumpet scheme; what 1 Cor 15:51-52 and Matt 24:31 state; three checked links (PRE 31, Ps 81:3 keseh, 20th-c. sources); held as suggestive, pretrib position does not rest on it."
  - "What the feast teaches: God remembers; God summons (Joel 2:1, 12, 15; Ezek 33); the Lord is coming (1 Thess 4:16; Matt 24:42)."
word_budget: 4000

