review_2026-10-01:
  reviewer: independent review-bible-study pass (separate agent from the drafter)
  checked: >
    Every ESV quotation re-queried in study-notes.db (all verbatim); Mark 2:16 across ESV, CSB, NIV,
    NASB, LSB, NKJV, NA28, SBLGNT, UGNT, Byz, TR, KJV; CSB footnote; G1122 63 (59 x 53.94 incl. John
    8:3, 3 x 27.22 Matt 13:52 / 23:34 / 1 Cor 1:20, 1 x 37.94 Acts 19:35) and 22 in Matthew;
    G1122+G5330 same-verse counts Matt 10 (7 in ch. 23), Mark 3, Luke 5 (5:21, 30; 6:7; 11:53;
    15:2), John 1, Acts 1; no G1122+G4523 verse; G3544 9x, 6 in Luke; G139 at Acts 5:17, 15:5, 26:5
    (also 24:5, 14; 28:22 of Christians); G3313 LN 11.8 at Acts 23:6, 9; lxx-lemmas γραμματεύς at
    2Esd 7:6, 11 and Sir 38:24; H5608a Ezra 7:6, H6567 Neh 8:8; TBESG Abbott-Smith (Aram. פְּרִישָׁא,
    Sadducee < 2 Sam 15:24); Middle LSJ "Separatist" (found in TFLSJ, not TBESG); Sirach 38:24-39:6 KJV
    raw text; Josephus War 2.162 and Ant 13.297 in Whiston (Josephus_complete.pdf) and Niese Greek
    (Perseus grc2, re-fetched); Life 12 in Whiston. ESV SB note on Matt 23:2 and 23:13-36; NIV BTSB
    and NLT LASB on Matt 23:34 (independent commentary check). review_gaps: no quotation gaps.
    validate: only the expected ai_provider_models warning. Statement of faith: 66-book canon
    (Sirach disclaimer consistent); Justification "credited, not achieved" consistent with the
    revised Be Transformed.
  findings_and_fixes: >
    MODERATE (false synthetic claim) "Luke's parallel keeps the two groups apart ... Luke separates
    the trade from the school; Matthew joins them" -- Luke pairs the two nouns in 5 verses, one of
    them (11:53) closing the very scene. Rewritten: Luke divides the woes, then names both at 11:53,
    so his lawyers are the scribes; Matthew keeps the pair in all six woes that name their hearers.
    MINOR: "Six woes follow" -- Matthew 23 has seven (ESV SB counts seven); six name scribes and
    Pharisees, 23:16 "blind guides". Fixed. MINOR: "Mark says so in three words" -- the Greek phrase
    is four. Fixed. MINOR: "Where Luke has 'apostles', Matthew has 'scribes'" overprecise (two terms
    vs three); "the scribes Jesus sends are His disciples" was unattributed -- now set against NLT
    LASB (early-church leaders) and NIV BTSB (adds John the Baptist and Jesus). MINOR: Josephus
    "same two words" -- Josephus has the noun ἀκρίβεια, Acts 26:5 the adjective; now cites Acts 22:3
    where Luke's Paul uses the same noun. MINOR: Josephus "a Pharisee by his own account" given its
    source (Life 12) and his own wording. MINOR: Ezra 7:11 is the narrator's heading, not the
    letter; now quotes the letter itself (7:12). MINOR: μέρος "technical term for a faction"
    softened (LN 11.8, literally "part", same word as Acts 23:6). MINOR: Middle LSJ misattributed
    to TBESG (it is in TFLSJ), and the "separation from impurity and those careless of the Law"
    gloss was unsourced; replaced with the LSJ's own sense. MINOR: Be Transformed "Think" ended in
    two unanchored sentences ("tools"; "Righteousness comes from Jesus") -- now anchored in
    Philippians 3:7-9 and names credited righteousness. MINOR: "What this shows about God" --
    "the Word the Law spoke of" mixed John 1 and Moses; now John 5:46. MINOR: bible_references
    lacked Mark 7:3, Nehemiah 8:8; added with Luke 11:53 and Acts 22:3. MINOR: named Byz/TR as the
    source of the Mark 2:16 variant. References updated (TFLSJ, Life 12, NIV BTSB 23:34, NLT LASB).
  not_changed_for_author: >
    (a) New singleton tags scribes / pharisees / sadducees -- keep or drop. (b) αἵρεσις is also
    Luke's word for the Christians (Acts 24:5, 14; 28:22); the study says only "scribes are never
    called an αἵρεσις", which is true, but the Christian usage would strengthen "school". Not added
    (add-nothing on size). (c) Matthew 23:2-3 "Jesus affirms the office" is the common reading; an
    ironic reading exists and is unmarked. (d) Antithesis density low (about 3 in ~3,000 words);
    no Check-21 run over 600 words; register of Key Takeaways, prayer and application left to the
    author's ear per human-review.md.
  size: "~3,790 words by wc incl. frontmatter and references (budget 4,000); review fixes net about +230."

