slug: "scribes-and-pharisees"
title: "Scribes and Pharisees: a Trade and a School"
status: drafting
target_path: "docs/content/scripture/scribes-and-pharisees.md"

primary_passage: "Mark 2:16"
supporting_passages:
  - "Luke 5:30"
  - "Acts 23:6-9"
  - "Acts 19:35"
  - "1 Corinthians 1:20"
  - "Ezra 7:6-11"
  - "Acts 5:17"
  - "Acts 15:5"
  - "Acts 26:5"
  - "Philippians 3:5"
  - "Matthew 5:20"
  - "Matthew 23:1-36"
  - "Luke 11:42-52"
  - "Mark 12:38"
  - "Mark 1:22"
  - "John 7:15"
  - "Matthew 13:52"
  - "Matthew 23:34"
genre: [gospel, acts, topical]

thesis: >
  Scribe names a trade, the trained work of knowing and teaching a written law, and Pharisee names a
  school of how to read and keep that Law; Matthew joins the two to name the whole teaching
  establishment of Israel, and Jesus, who never trained under either, makes scribes of His own
  disciples and sends them out.
outline:
  - {section: "Scribe names a trade", says: "Mark 2:16, Luke 5:30 and Acts 23:9 attach scribes to a party; Acts 19:35 has a pagan one; MACULA/Louw-Nida introduced; 63 occurrences (62 outside John 8:3)"}
  - {section: "What a scribe did", says: "Ezra 7:6, 10-11 as the model; Sirach 38:24-39:11 as an extra-biblical witness to the profession c. 180 BC"}
  - {section: "Pharisee and Sadducee name schools", says: "hairesis in Acts; Josephus War 2.162 and Ant. 13.297; contested etymologies; scribes who were not Pharisees (inference)"}
  - {section: "Why Matthew pairs them", says: "Matthew 5:20 and 23 against Luke 11's split woes and Mark 12:38; pairing names the teaching establishment (marked as a reading)"}
  - {section: "Jesus's own scribes", says: "Mark 1:22, John 7:15; Matthew 13:52; Matthew 23:34 vs Luke 11:49; what this shows about God, landed on the reader"}
word_budget: 4000
word_budget_reason: ""

stages:
  forked:
    done: true
    notes: >
      Forked 2026-10-01 by the simplify pass on docs/content/scripture/scribe-trained-for-the-kingdom.md
      (working copy on top of commit 36464d6d; the parent's review edits were uncommitted at the
      time). Moved verbatim: the first four paragraphs of the H3 "A trade, not a school of thought"
      (the Pharisee/Sadducee-vs-scribe distinction; Mark 2:16 and Acts 23:9 with μέρος G3313; Acts
      19:35 the Ephesian town clerk, Louw-Nida 37.94 vs 53.94; the 62-occurrence NT distribution
      58/1/3). Only edit on the way: the heading promoted from ### to ##. The section's fifth
      paragraph (γραμματεὺς μαθητευθείς) stayed in the parent.
  developed:
    done: true
    notes: >
      2026-10-01 develop-bible-study pass. Built out opening, In one sentence, Key Takeaways (Lessons
      about Jesus, Memory verses, Be Transformed, Prayer; no Types & Prophecy -- none earned), Study
      outline, five teaching sections, discussion questions, References. Forked prose kept; the fork's
      H2 "A trade, not a school of thought" renamed "Scribe names a trade" (antithesis heading) and
      split into H3s. Re-verified every forked claim from source (see findings). Draft left
      draft: true; provenance script not run (instructed), so ai_provider_models is still [] and
      validate warns on it.
  findings: >
    (1) COUNT CORRECTION. The fork said γραμματεύς occurs 62 times. bible_concordance G1122 on
    macula-greek-sblgnt returns 63. The 63rd is John 8:3 (pericope adulterae), whose lemma is stored
    with a different Unicode accent (tonos vs oxia), so the parent's lemma='γραμματεύς' SQL query
    missed it. Domain split of all 63: 53.94 x59 (incl. John 8:3), 27.22 x3 (Matt 13:52, 23:34, 1 Cor
    1:20), 37.94 x1 (Acts 19:35). The study now says 63, and 58/1/3 of the 62 outside John 7:53-8:11.
    The parent study (scribe-trained-for-the-kingdom.md) does not print 62 in its current text as far
    as checked (its 22-in-Matthew count is unaffected) -- flag for its review anyway.
    (2) TEXTUAL VARIANT at Mark 2:16: CSB footnote "Other mss read scribes and Pharisees"; NKJV follows
    that reading. SBLGNT (with apparatus marks), NA28 and UGNT all print τῶν Φαρισαίων. Added a short
    note; argument does not rest on Mark alone (Luke 5:30 οἱ γραμματεῖς αὐτῶν; Acts 23:9 μέρους).
    (3) αἵρεσις (G139, LN 11.50) used of Sadducees (Acts 5:17) and Pharisees (Acts 15:5; 26:5); never of
    scribes. Acts 26:5 ἀκριβεστάτην αἵρεσιν matches Josephus BJ 2.162 μετὰ ἀκριβείας ... αἵρεσιν.
    (4) Matthew: γραμματεύς and Φαρισαῖος share a verse 10 times (5:20; 12:38; 15:1; 23:2, 13, 15, 23,
    25, 27, 29) -- 7 in ch. 23. Mark 3 verses, Luke 5, John 1 (8:3), Acts 1. No verse has γραμματεύς
    with Σαδδουκαῖος.
    (5) Luke 11:42-52 splits woes: Pharisees (42-44), lawyers νομικός G3544 (46-52). νομικός 9x NT, 6 in
    Luke. Matthew 23:34 "I send ... scribes" vs Luke 11:49 "the Wisdom of God said ... apostles".
    (6) Sirach 38:24 Greek γραμματεύς (lxx-lemmas Sir 38:24 pos 2); KJV Apocrypha renders "learned man".
    Text read raw from scrollmapper deuterocanonical (raw-only source).
    (7) Etymology: Abbott-Smith (TBESG) gives Aram. פְּרִישָׁא; Middle LSJ "Separatist, from pharash";
    TBESH H6567 פָּרַשׁ "to make distinct, declare, distinguish, separate"; Neh 8:8 מְפֹרָשׁ = H6567
    (MACULA). Marked contested in prose. Sadducee < Zadok (Abbott-Smith cites 2 Sam 15:24), marked
    debated.

