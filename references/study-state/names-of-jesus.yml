genre: [topical, gospel, prophets, apocalyptic, epistle]

thesis: >
  Jesus asked "Who do you say that I am?", and every name the Bible gives
  Him answers that He is the LORD Himself come as one of us: the names He took claim God's own titles,
  the names desperate people cried out to Him were answered on the spot, and the names Revelation
  gives Him He will wear when He returns to reign -- so you may call on Him by name, and He answers.
outline:
  - {section: "Key Takeaways", says: "Types & prophecy (Daniel 7's son of man; the Lamb; Isaiah 44:6's First and Last), lessons about Jesus, memory verses (Matthew 16:15-16; one other), Be transformed, prayer."}
  - {section: "\"Who do you say that I am?\" (Matthew 16:13-17)", says: "At Caesarea Philippi, a city of shrines to Pan and Caesar, Jesus asks. The crowd's names are prophets' names; Peter's are Christ and Son of the living God, and the Father revealed them. Matching Exodus 3:13's 'What is his name?' -- link names-of-god and peter."}
  - {section: "Names given before He was born", says: "Jesus/Yeshua and Immanuel briefly (names-of-god owns them); Gabriel's Son of the Most High and David's throne (Luke 1:31-33); the angels' 'a Savior, who is Christ the Lord' (Luke 2:11). Christ = mashiach, anointed (38 times in WLC, 528 Christos in SBLGNT)."}
  - {section: "The name He chose: the Son of Man", says: "81 times in the Gospels and on His own lips in all but two (John 12:34 the crowd quoting Him; Luke 24:7 angels recalling His words). Daniel 7:13-14 explains it: the one given an everlasting kingdom. At His trial He joined it to 'I am' and Daniel 7 (Mark 14:61-64), and was condemned for it. A humble-sounding title carrying the highest claim. Link as-the-snake-was-lifted, olivet-discourse."}
  - {section: "\"I am\": seven pictures and one name", says: "John's seven 'I am' sayings with a picture (bread, light, door, good shepherd, resurrection and life, way/truth/life, true vine), each answering an Old Testament promise and a need in front of Him, one short paragraph each, linking the sibling that owns it. Then the bare 'I am' (John 8:58) -- one sentence and link, names-of-god owns it."}
  - {section: "Names cried out in need", says: "Mirror of names-of-god's 'hard places': blind Bartimaeus 'Son of David, have mercy' (Mark 10:47-52); the Samaritans' 'Savior of the world' (John 4:42); the thief's 'Jesus, remember me' (Luke 23:42-43); Thomas's 'My Lord and my God' (John 20:28). Each name answered on the spot."}
  - {section: "Names the apostles gave Him", says: "The Word (John 1:1, 14); the Lamb of God (John 1:29, link passover); Lord (Kyrios, the Septuagint's word for YHWH; Philippians 2:11, link names-of-god); high priest (link melchizedek); last Adam (1 Corinthians 15:45). Short, grouped."}
  - {section: "Names He will wear when He returns", says: "The First and the Last (Isaiah 44:6 -> Revelation 1:17-18, 'Fear not'); the Lion who is a Lamb (Revelation 5:5-6); Faithful and True, the Word of God, a name no one knows, King of kings and Lord of lords (Revelation 19:11-16). Dispensational: worn at His return to reign. So you may call on Him by name now."}
  - {section: "Discussion questions", says: "Facet-labelled per discussion-questions.md."}
  - {section: "References & Recommended Reading", says: "SBLGNT/MACULA, WLC, Brenton LXX, study Bibles consulted, sibling studies."}
word_budget: 4500
word_budget_reason: "Topical survey of ~25 names across both Testaments; each name kept to a paragraph by linking the sibling that owns it. Names of God ran to ~4,360 against 4,000."

