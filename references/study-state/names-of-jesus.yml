    - "Counts: Iesous G2424 910; christos G5547 528; amnos G286 4 (John 1:29, 1:36, Acts 8:32, 1 Pet 1:19); arnion G721 30 = John 21:15 + 29 in Revelation, 28 of Jesus (13:11 the beast); mashiach H4899 38 in MACULA (Strong's lists 39; 2 Sam 1:21 is the one MACULA tags otherwise)"
