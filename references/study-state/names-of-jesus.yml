read_2026-10-18:
  by: "read-bible-study (subagent, fresh reader)"
  changed: >
    Structure only, no sentence changed outside the Study outline (prose-line diff against HEAD:
    every removed or added line is a Study outline continuation line). "### The King's names"
    (395 words) split at its paragraph break into "### Isaiah's four names for the King" (Isaiah
    9:6-7) and a new "### The Branch, the star and the shepherd" over the three bold run-in names.
    The study's closing paragraph ("So the names answer His question...") was buried as the last
    paragraph of the Revelation 19 item; it now has its own section, "## The names answer His
    question", which also brings "Names He will wear when He returns" from 414 to under 400.
    Study outline updated: renamed anchor, new sub-section link, and a descriptive bullet for the
    closing section; all 28 in-page anchors resolved against the served page. No incoming links
    to the renamed #the-kings-names anchor elsewhere. 25 -> 27 sections, median 139 -> 135 words,
    1 over 400 -> 0.
  open_for_author:
