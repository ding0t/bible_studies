open_questions:
  - "The visibility test in utils/compute_nisan_14.py is a rough age-and-lag rule, run at three thresholds (early, usual, late). A proper crescent-visibility criterion (Yallop or Odeh) would firm up which marginal years (AD 26, 27, 30) could have fallen either side; AD 33's crescent (29 h, 79 min lag) is clear on any criterion."
  - "AD 26's Friday 22 March sits the day before an equinox Passover; whether a calendar court would have added a second Adar that year (giving Sunday 21 April) is unknown. The page sets the year aside on Luke 3:1 alone, which holds either way."
  - "RESOLVED 2026-11-23: Pilate's AD 26-36 now cites the ESV SB note on Luke 3:1."

