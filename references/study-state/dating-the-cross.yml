genre: [gospel, topical]
origin: >
  Forked 2026-11-23 by simplify-bible-study, at the author's direction ("use chronology - and go ahead as
  recommended - use diagrams as logical"). The text was moved verbatim from three studies at commit ba3f1ff0:
  chronology-anchors.md "Settling the crucifixion year" (all of it, Humphreys-Waddington merged into the
  fuller copy below); three-days-and-three-nights.md "Can the crucifixion be dated?" (from the Matthew
  12:40 block quote to the counter-case) and the second half of "Where that leaves it" (now "Friday, and
  what it costs"); prophecy-events-times.md "The crucifixion darkness could not have been a solar eclipse"
  and "A separate, real event that same evening". Its "Three days and three nights" objection (which said
  "on the third day" eight times where the Greek count is nine) was replaced by a pointer here. Those
  sections' word studies and quotations were verified where they came from (see each study's state file).

thesis: >
  God sent His Son to the cross at the time He had set, and when each Passover under Pilate is
  reckoned by the Law's rules, the Gospels' details place it on Friday, 3 April AD 33, with AD 30 the
  one serious rival.
outline:
  - {section: "How the Passover is dated", says: "The Law fixes 14 Nisan; four calendar rules (sunset day, first crescent, equinox, John's 14 Nisan) give its weekday in each year AD 26-36; four years can give a Friday."}
  - {section: "The facts that bear on the date", says: "Each fact as the text or record gives it: the weekday statements, the three-day phrasings, the Wednesday case, Luke 3:1, John's Passovers, Sejanus, Daniel 9:25, John 2:20, Paul, the sky; then one table."}
  - {section: "Weighing the evidence", says: "The day is a Friday; the year is AD 33, on Luke 3:1 and John's Passovers, with Sejanus and Daniel 9:25 in support."}
  - {section: "Verdict", says: "Friday 3 April AD 33, and the strongest case against it."}
word_budget: 4000
word_budget_reason: ""

