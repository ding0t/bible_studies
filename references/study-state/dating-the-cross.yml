review_2026-11-23:
  status: applied 2026-11-23
  critical:
    - "Weekday filter tested only an early crescent; utils/compute_nisan_14.py now tests early and late. AD 27 can be Friday 11 April on a late crescent (before Luke 3:1, like AD 26). Text, chart and data updated."
    - "The interval table missed Matthew 27:63 ('after three days', now 4) and the six 'in three days' temple sayings; heading now 'nineteen other times'. The error came from three-days-and-three-nights (the table moved here). The FAQ's 'eight times' corrected to nine."
  moderate:
    - "'only two' left after the AD 26 edit: intro, filter and outline now set the years before John's preaching aside."
    - "Types & Prophecy misread Daniel 9:25 (the weeks run to 'the coming of an anointed one'; the cutting off follows, 9:26) and dropped the 444 BC condition; rewritten."
    - "Verdict and sky section left out John's Passovers, which the thesis and chart rest on; added, and the one-cleansing view added to the case for AD 30."
    - "Chart: AD 33's own cost on the Passovers card; Paul moved to the centre (cuts both ways); Sejanus given what AD 30 needs; alt text updated."
    - "Galatians 4:4 is about the incarnation; the timing of the cross now rests on Romans 5:6 and John 13:1 (opening, memory verses, prayer, Q5). Galatians 4:4-5 kept for the sending."
    - "Budget: the reviewer's ~4,900 counted tables and quotations; Check 23's count is 3,897 against 4,000. No change."
  minor: "AD 26 'on the eve of the equinox'; Pilate cited to ESV SB; Mark 15:42 memory verse replaced; 'genuinely' and 'rather than merely less likely' cut; Ezra 457 noted as 458 on a spring count with the ESV SB's AD 30-or-33 allowance; Jonah 1:17 and Mark 11:15-17 / Luke 19:45-46 cited."
  readability: "Applied: the filter split (AD 32 as H4), a parent H3 for the six lines with the chart under it, the four deciding lines first, Schaefer's reply as H4, the two sky headings renamed (no inbound links), the outline updated, a thesis line opening the day section, the year intro's repeated Friday argument and the verdict's repeated heading cut, 'page' made 'study'. Not applied: moving the sunset-reckoning paragraph (optional)."
rewrite_2026-11-24:
  by: author's direction ("open with a section on the passover, the rules that form our assumption of its calculation, and then the candidate dates by those rules ... then the next facts ... then drawing the logical assessment"; and "more Pauline sounding")
  structure: "Rebuilt as How the Passover is dated (the Law, four rules, an eleven-year table from docs/data/chronology.json) -> The facts that bear on the date (ten H3s and a summary table) -> Weighing the evidence (the day, the year) -> Verdict."
  prose: "Every prose paragraph rewritten to read aloud (style-guide rule 7): median sentence 22 -> 15 words, 35+ share 16% -> 2%. Clipped headline lines and dramatic headings removed. No fact, count or citation changed; new quotations Exodus 12:2, 12:6, Psalm 104:19 verified (evidence above), Leviticus 23:5-6 and Deuteronomy 16:1 cited without quotation."
  anchors: "Renamed: the-counter-case-at-its-strongest -> the-case-for-a-wednesday (firstfruits.md); john-220-neutral-between-both-years -> john-220-and-the-forty-six-years (chronology-anchors.md, dating-texts.json, chronology.json); pauls-chronology-which-cuts-both-ways -> pauls-three-years-and-fourteen-years; schaefers-reply-and-acts-220 -> the-sky-that-day (chronology.json). Kept: the-day-a-friday, settling-the-crucifixion-year, the-sky-that-day, verdict-friday-3-april-ad-33, and the Luke 3:1, John's Passovers, Sejanus and Daniel 9:25 headings."
  for_review: "Rule 4's handling of the 14/15 Nisan question is stated, not argued; a reviewer may want a sentence on why both candidate years survive either way, or a pointer to where the site treats it."
