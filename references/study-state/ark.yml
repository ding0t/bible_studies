thesis: >
  The ark was the footstool of God's throne on earth: a gold chest holding His covenant, under a lid
  of pure gold where the high priest sprinkled blood once a year and from above which God spoke.
  Israel lost it and Scripture never says how, but Paul names Jesus the hilasterion -- the mercy
  seat itself, which God put forward in public where the old one was hidden behind the veil -- and
  John sees the ark of God's covenant in the temple in heaven.
outline:
  - section: "Hook + In one sentence + Key Takeaways + Study outline"
    says: "Revelation 11:19: heaven's temple opened and the ark seen -- centuries after it vanished from the record on earth."
  - section: "Made after the pattern (Exodus 25:10-22)"
    says: "The first thing God describes. aron is the everyday word for a chest (Joseph's coffin Gen 50:26; Joash's collection chest 2 Kgs 12:10); Noah's ark is a different word (tevah, also Moses' basket); English and Greek (kibotos) use one word for both. Poles never removed. Plate to scale."
  - section: "The mercy seat and the cherubim"
    says: "kapporet 27x, all in Exodus-Numbers plus 1 Chr 28:11; TWOT 1023c 'propitiatory', related to kipper (ESVSB 'may be related' -- mark); LXX hilasterion. 'There I will meet with you' (25:22; Num 7:89). Enthroned on the cherubim (1 Sam 4:4; Ps 99:1); footstool (1 Chr 28:2; Ps 132:7); throne vs footstool contested (CBSB)."
  - section: "Blood on the lid"
    says: "Lev 16:2 not at any time; incense cloud; blood sprinkled on and before the mercy seat seven times (16:14-15); Heb 9:7 once a year, not without blood. The covenant inside, the blood on top: the juxtaposition is textual, the meaning an interpretation -- mark."
  - section: "The ark on the move"
    says: "Went before them (Num 10:33-36); Jordan (Josh 3:3-4, 2,000 cubits); treated as a charm and captured (1 Sam 4:3, 11, 21-22); Dagon (1 Sam 5:3-4); Uzzah (2 Sam 6:6-7); into the temple, cloud fills (1 Kgs 8:6-11). God's presence is holy and not a tool."
  - section: "What was in it"
    says: "Tablets inside (Exod 25:16; 40:20); jar and rod 'before the testimony' (Exod 16:34; Num 17:10); Heb 9:4 'in which'; 1 Kgs 8:9 only tablets (ESVSB: had once contained). Both texts given."
  - section: "Lost"
    says: "Named last in narrative at 2 Chr 35:3 (Josiah); never in 2 Kings' account of the fall (only the chest of 12:10-11); no mention in Ezra-Nehemiah or any prophet but Jer 3:16 (concordance). Jer 3:16-17: not remembered, not made again, Jerusalem called the throne. None in Ezekiel's temple. 2 Maccabees 2:4-8 (Jeremiah hid it) cited as tradition, not Scripture. Dispensational note on Jer 3:17 'in those days'."
  - section: "The mercy seat God put forward"
    says: "Rom 3:25 hilasterion 'put forward' (public) -- propitiation named; Heb 9:5 same word; Heb 4:16 throne of grace (echo). John 20:12 two angels at head and feet held as a later reading (tier 3)."
  - section: "Seen in heaven"
    says: "Rev 11:19 the ark of His covenant in His temple; the pattern's original; then Rev 21:22 no temple. Link new-jerusalem.md."
  - section: "What the ark shows about God"
    says: "Tier table; God meets His people over blood; propitiation in Jesus; approach with confidence."
  - section: "Discussion questions; References"
    says: ""
