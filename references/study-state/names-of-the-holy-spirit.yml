thesis: >
  The night before the cross Jesus promised "another Helper", and every name the Bible gives the
  Holy Spirit says whose He is and what He brings: He is the Spirit of God and of the LORD, of the
  Father and of the Son, God Himself present with His people, promised by the prophets and given to
  live in you forever, and He is the one by whom you call God "Abba! Father!" and say "Jesus is
  Lord", so the God whose names you have learned now lives in you.
outline:
  - {section: "Key Takeaways", says: "Types & prophecy (Joel 2:28, Ezekiel 36:27 promises; Isaiah 11:2 and 61:1 on the Messiah); lessons about Jesus; memory verses John 14:16-17 and Romans 8:15; Be transformed; prayer."}
  - {section: "Study outline", says: "Annotated."}
  - {section: "\"I will not leave you as orphans\" (John 14:15-18)", says: "Upper room. Jesus names Him three ways: another Helper (allos parakletos; the same word names Jesus in 1 John 2:1), the Spirit of truth, the one who dwells with you and will be in you, forever. Mirrors Exodus 3:13 and Matthew 16:15 in the sibling studies; link both."}
  - {section: "Breath, wind and Spirit", says: "ruach (H7307, 378x) and pneuma (G4151, 379x) both mean breath, wind and spirit: Genesis 1:2, Ezekiel 37, John 3:8. Most of His names are 'Spirit of ...': they say whose He is and what He brings."}
  - {section: "Names in the Old Testament", says: "### The Spirit of God (Genesis 1:2; Job 33:4). ### The Spirit of the LORD: on judges and David (1 Samuel 16:13), resting on the Branch with Isaiah 11:2's six names, on the Anointed (Isaiah 61:1, Luke 4:18); link names-of-jesus. ### Your Holy Spirit: three times only (Psalm 51:11; Isaiah 63:10-11), grieved (Ephesians 4:30 follows the Hebrew 'grieve', LXX has 'provoked'). ### Your good Spirit (Nehemiah 9:20; Psalm 143:10). ### My Spirit, poured out: Joel 2:28, Ezekiel 36:27, 37:14, Zechariah 4:6; the spirit of grace (Zechariah 12:10, LXX pneuma charitos = Hebrews 10:29), contested whether 'the Spirit' (NLT, CSB footnotes)."}
  - {section: "Names Jesus gave Him", says: "Helper (four times in John 14-16), Spirit of truth (three), Holy Spirit sent in my name (John 14:26), proceeds from the Father (15:26), sent by the Son (16:7), convicts (16:8), glorifies me (16:14); John's masculine ekeinos with neuter pneuma (link the-restrainer). The promise of the Father (Acts 1:4); Pentecost, link weeks."}
  - {section: "Names that say He is God", says: "Spirit of God = Spirit of Christ in one verse (Romans 8:9); Spirit of Jesus (Acts 16:7), of His Son (Galatians 4:6), of Jesus Christ (Philippians 1:19), of Christ in the prophets (1 Peter 1:11); the Lord is the Spirit (2 Corinthians 3:17); lying to the Spirit is lying to God (Acts 5:3-4); one name (Matthew 28:19); 2 Corinthians 13:14."}
  - {section: "Names for what He does in you", says: "Spirit of life (Romans 8:2); of adoption (Romans 8:15); the seal and the guarantee, arrabon 3x all of the Spirit (2 Corinthians 1:22; 5:5; Ephesians 1:14), link assurance and bride; Spirit of wisdom and revelation (Ephesians 1:17); Spirit of glory resting on you (1 Peter 4:14, the LXX verb of Isaiah 11:2); the eternal Spirit (Hebrews 9:14). Dispensational note, marked: the Spirit came upon and could depart (1 Samuel 16:14; Psalm 51:11); now He is given 'forever' (John 14:16)."}
  - {section: "Names at the end", says: "The seven spirits before the throne (Revelation 1:4; CSB footnote 'sevenfold Spirit'), contested, link lampstand; the Spirit and the Bride say 'Come' (Revelation 22:17)."}
  - {section: "The Spirit teaches you the other names", says: "Abba! Father! (Romans 8:15; Galatians 4:6) and 'Jesus is Lord' (1 Corinthians 12:3): the Spirit is how the names of God and of Jesus are spoken by you. Closes the trilogy."}
  - {section: "Discussion questions", says: "Facet-labelled."}
  - {section: "References & Recommended Reading", says: "WLC/MACULA, SBLGNT, Brenton LXX, ESV, footnotes (CSB, NLT, LSB), siblings."}
