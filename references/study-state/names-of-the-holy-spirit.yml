findings:
  - "ruach H7307: 378 in MACULA WLC; pneuma G4151: 379 in SBLGNT."
  - "ruach + qodesh (Holy Spirit) in the OT: Psalm 51:13 MT (51:11 English), Isaiah 63:10, 63:11 only."
  - "ruach directly before YHWH 29x, before Elohim 16x, but several are 'a harmful spirit from God/the LORD' (1 Samuel 16:15-16, 23; 18:10; 19:9). Do not print these counts unfiltered."
  - "parakletos G3875: John 14:16, 26; 15:26; 16:7; 1 John 2:1 (of Jesus)."
  - "arrabon G728: 2 Corinthians 1:22; 5:5; Ephesians 1:14, all of the Spirit."
  - "Zechariah 12:10 LXX pneuma charitos = Hebrews 10:29 to pneuma tes charitos."
  - "1 Peter 4:14 anapauetai = LXX Isaiah 11:2 anapausetai ep auton pneuma tou theou."
  - "Isaiah 63:10 LXX paroxynan (provoked); Ephesians 4:30 lypeite (grieve) matches the Hebrew."
  - "John 14:26: neuter relative ho with pneuma, then masculine ekeinos."
  - "Footnotes: Zechariah 12:10 'Or the Spirit' (NLT, CSB); Revelation 1:4 'Or the sevenfold Spirit' (CSB); Psalm 51:11 'Or your spirit of holiness' (NLT); John 14:16 'Or advocate, or comforter' (CSB), 'Gr parakletos, one called alongside as a helper' (LSB)."

