publish_2026-08-14:
  decision: >
    User chose to resolve the unverifiable-ESV problem by converting the study off ESV entirely rather
    than waiting for the NAS to be mounted. All 8 ESV quotations replaced with translations held in this
    repo's own bible-text.db, so every quotation on the page is now verifiable from inside the repo.
  translations:
    default: "WEB (ebible-eng-web, public domain)"
    exception: >
      Mark 14:24-25 is quoted from the ASV (scrollmapper-ASV, public domain). WEB follows the later
      manuscript tradition at Mark 14:24 and reads 'my blood of the NEW covenant'; the study's word-study
      section argues the Exodus 24:8 echo specifically depends on the shorter reading (SBLGNT: τὸ αἷμά μου
      τῆς διαθήκης, no καινῆς). Quoting WEB there would have put the study's own lead quotation in direct
      contradiction with its argument. ASV carries the shorter reading. Documented on the page itself
      under References & Recommended Reading.
    note: >
      One ESV mention remains on the page and is NOT a quotation -- the note that English translations
      split on παραλαμβάνω at John 14:3 (ESV 'take you to myself', WEB/ASV/KJV 'receive'), which is why
      the Exodus 6:7 LXX echo is easier to see in Greek than in English.
  verification: >
    All 20 quotations (7 crux blocks + 13 inline) checked verbatim against bible-text.db by script, not
    by eye. Two apparent mismatches were both normalizer artifacts, not text errors: a curly vs straight
    opening single quote at Revelation 19:9, and WEB's inline poetry markers (₁/₂) sitting flush against
    words at Jeremiah 31:33. Both confirmed identical after normalization.
  content_added: >
    User asked whether Types & Prophecy was reaching the wedding feast at all. It was not -- Revelation
    19:6-9 appeared only as a bare cross-reference. Added the link that closes the chain, which is
    Scripture's own move rather than an imported image: Hosea 2:19-23 takes Exodus 6:7's fourth-promise
    formula and makes it BETROTHAL ('I will betroth you to me forever ... I will tell those who were not
    my people, You are my people'). Also added Jesus's two wedding-feast parables, which in Matthew stand
    immediately before this meal (Matthew 22:2, a king who made a wedding feast for his son; Matthew
    25:10, the ready who went in to the wedding feast and the door shut). So the chain now runs:
    Exodus 6:7 -> Hosea 2 (betrothal) -> Matthew 22/25 (Jesus's own teaching) -> Revelation 19:9 wedding
    supper -> Revelation 21:3 formula consummated. All five verified against bible-text.db.
    Considered and NOT added: the kiddush / kiddushin shared root (קדש, 'set apart'), which would tie the
    Seder's first cup to betrothal terminology. It is very likely correct but is a rabbinic-terminology
    claim with no source inside this repo to check it against, so it stays out until it can be sourced.
  post_publish_steps_run:
    - "commentary_index.py -- regenerated; the changed bible_references added Hosea 2, Matthew 22/25,
       John 14, Revelation 21 etc. This also cleared a backlog from earlier studies that had never had
       their pages generated (e.g. Psalms 14 from israel-and-the-church.md), since it is a manual step."
    - "section_index.py -- regenerated docs/content/feasts/index.md, which now lists this study as
       published rather than draft."
    - "npm run validate -- passes clean (the only 2 warnings are pre-existing, in other files)."
  full_review_findings_and_outcomes:
    - "CRITICAL / FIXED: the kainos word study was contradicted by this repo's own semantic-domain
       data at the two verses it cited. Draft claimed 'Mark 14:25 has him drinking it kainon: new in
       kind, not next in sequence.' MACULA Louw-Nida tags Mark 14:25 and Luke 22:20 at 67.115 (domain
       67 = TIME), and tags Matthew 26:29 and 1 Cor 11:25 at 58.71 (domain 58 = class/character, the
       'new in kind' sense). The bullet argued the kind-sense from the two verses annotated as the
       time-sense. Also a root-fallacy flag: the kainos/neos split is softer than stated -- neos
       appears in 58.71, kainos appears 5x in 67.115, and Mark 2:22 carries BOTH codes. Rewritten to
       state the annotation honestly and keep the point that survives it (the same adjective ties the
       deferred cup to the covenant in all four accounts)."
    - "CRITICAL / FIXED: Jeremiah 31:31 was truncated without ellipsis, twice -- quote closed at 'with
       the house of Israel', omitting 'and the house of Judah'. On a dispensationally-inclined site the
       two-house scope is the contested point, so this was not a neutral trim. Now marked with an
       ellipsis and the both-houses scope stated in prose (avoiding a further unverified ESV quotation)."
    - "MODERATE / FIXED: 'Matthew (26:29) ... adding two words that matter later'. Against SBLGNT,
       Matthew differs from Mark twice, and only one is an addition: he adds μεθ᾽ ὑμῶν (2 words), and
       SUBSTITUTES 'my Father's kingdom' for Mark's 'the kingdom of God'. Rewritten as two differences,
