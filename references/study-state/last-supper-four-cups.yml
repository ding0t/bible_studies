insight_2026-09-26:
  added:
    - "**In one sentence:** God keeps every promise He makes to His people. In the blood of Jesus He has already brought you out, set you free and redeemed you. The cup Jesus left undrunk at the Last Supper is His pledge that He will take you to Himself, at the wedding supper of the Lamb."
    - "God, who calls a people His own, means to be with them at His table forever, and that table is set for you."   # KT 'Still outstanding'
    - "This shows that God redeems at a price. The atonement Jesus made in His own blood is the outstretched arm of Exodus 6:6. If you belong to Him, you have already been brought out, freed and redeemed."   # after four-promises diagram
    - "God wants His people for Himself. Paul's name for it is adoption, and you are still waiting for it (Romans 8:23)."   # Exodus 6:7 acquisition
    - "This shows that God binds Himself to His people as a bridegroom to his bride, so you can wait for Jesus as one already promised to Him."   # end of 'From covenant formula to wedding'
    - "God is faithful to the whole of His word. The three promises He has kept in Jesus are your warrant that He will keep the fourth."   # Theological principle
    - "Prayer: 'your Son' -> 'your Son Jesus'; divine pronouns capitalised; closes 'In Jesus' name. Amen.'"
  notes: >
    Divine pronouns capitalised only in added and shortened sentences; untouched prose elsewhere
    still uses lowercase he/his for God and Jesus -- a corpus-wide house-style pass would fix it
    without touching sentence content. Study outline (Check 22) left for the read pass.

