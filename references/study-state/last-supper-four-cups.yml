    - "Strong's/gloss confirmed: γένημα G1081, ἄμπελος G288, διαθήκη G1242, καινός G2537, ποτήριον G4221,
       εὐχαριστήσας (Mark 14:23), לָקַח H3947, παραλαμβάνω G3880."
    - "Content spot-checks against ASV (NOT ESV wording): Exodus 24:8, Psalm 116:13, Isaiah 25:6, Matthew
       8:11, Revelation 19:9, 1 Cor 11:26, Luke 22:17-18, Luke 22:20 -- all say what the study claims,
       under the correct references."
    - "ESV is ~10% of body text, far under the 50% cap in references/README.md. Commentary quotations are
       single clauses. Internal link ../about/key-takeaways.md resolves."
  new_material_added_this_pass: >
    At the user's direction, the fourth cup was promoted from a buried inference to the study's stated
    thesis, and grounded in the fourth PROMISE rather than the argument from silence. New section, "The
    fourth promise", traces: Exodus 6:7 (לקח + לי, 'take to myself') -> LXX λήψομαι ἐμαυτῷ ὑμᾶς ->
    John 14:3 παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, spoken the same night in the same room -> the covenant
    formula recurring at Jeremiah 31:33 -> Revelation 19:9 wedding supper and 21:3. The Exodus/John link
    is LEXICAL, not merely thematic (future of λαμβάνω + ὑμᾶς + reflexive ἐμαυτ- in both), verified
    against ebible-grcbrent and macula-greek-sblgnt. Stated as an echo, not a quotation: παραλαμβάνω is
