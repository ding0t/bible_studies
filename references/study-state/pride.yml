# Forked from humility.yml (backlog 10.5) at the author's suggestion, 2026-09-28: "feel free to spin
# off a counter study under sin/pride if needed". Backlog notes for pride: recognise it, where it
# comes from (Mark 7:21-22), God opposes the proud (James 4:6; 1 Pet 5:5), a pervasive deep sin;
# mark as contested any reading of Isaiah 14 or Ezekiel 28 as the fall of Satan.

slug: "pride"
title: "Pride"
status: published
target_path: "docs/content/sin/pride.md"

primary_passage: "Proverbs 16:18"
supporting_passages: ["Daniel 4:29-37", "Exodus 15:7", "Proverbs 8:13", "Obadiah 1:3-4", "Mark 7:21-23",
  "Genesis 3:5", "Deuteronomy 8:11-17", "2 Chronicles 26:16", "2 Chronicles 32:25-26", "1 Timothy 3:6",
  "Luke 18:9-14", "James 4:13-16", "Acts 12:21-23", "Isaiah 14:4-16", "Ezekiel 28:1-19", "Luke 10:18",
  "1 Corinthians 1:28-31", "Jeremiah 9:23-24"]
genre: [wisdom, prophets, topical]

thesis: >-
  Pride is self-sufficiency, living as though everything you have is your own doing, and at its root
  it wants God's place; it comes out of the heart, it deceives the one who has it, and God sets Himself
  against it, so the way down is to humble yourself before Him and boast in the cross of Jesus.
# Reframed 2026-09-28 at the author's direction (the opposite of humility-as-dependence). The earlier
# "majesty in the wrong hands" definition rested on ga'on alone and was contradicted by its range.
# New section "You are gods" added at the author's request, kept because Scripture answers the same
# claim repeatedly (Ezek 28:2; Acts 12:22-23; Acts 14:15; 2 Thess 2:4) and the proof texts (Ps 82:6;
# John 10:34; 2 Pet 1:4) can be read in context.
outline:
  - section: "Opening"
    says: "Nebuchadnezzar on the roof (Dan 4:30) and his confession (4:37)."
  - section: "What the words mean"
    says: "ga'on = God's majesty (Exod 15:7) and man's pride (Prov 16:18); govah, zadon; hyperephanos 'showing oneself above', typhoo 'wrap in smoke', physioo, alazoneia."
  - section: "Where pride comes from"
    says: "the heart (Mark 7:21-23); 'like God' (Gen 3:5); success (Deut 8; Uzziah); gifts and knowledge (1 Cor; 1 Tim 3:6)."
  - section: "What pride looks like"
    says: "comparison, planning without God, putting self first, taking God's glory, haughty eyes, religious show; it blinds (Obadiah)."
  - section: "Why God opposes the proud"
    says: "pride is a lie about glory; its end (Prov 29:23; Isa 2:11); mercy to the proud who turn (Hezekiah, Nebuchadnezzar, tax collector)."
  - section: "Did Satan fall through pride?"
    says: "contested: case for (language beyond a man; Origen, Tertullian; Luke 10:18 echo; 1 Tim 3:6) and against (named kings; ANE imagery; context); ESVSB/NIV BTSB middle path; no doctrine rests on it."
  - section: "The way down"
    says: "boast in the Lord (1 Cor 1:28-31; Rom 3:27; Gal 6:14); humble yourself (Jas 4:10) -> humility.md."
word_budget: 4000
word_budget_reason: ""

stages:
  scoping: {done: true, notes: "Filed under sin/. Sibling of christian-life/humility.md, which keeps a short pride section pointing here."}
  exegesis:
    historical_context: {done: true, notes: "Isa 14 taunt over the king of Babylon (14:4); Ezek 28 two oracles on Tyre's prince/king; Dan 4 Nebuchadnezzar; ANE imagery (helel = Venus, Ugaritic; northern divine mountain, Canaanite) per NIVCBSB and ESVSB."}
    literary_context: {done: true, notes: "Isa 14:16 'Is this the man'; Ezek 28:2 'you are but a man'; 1 Tim 3:6 inside overseer qualifications."}
    content_word_studies:
      done: true
      notes: "macula-hebrew-wlc counts: ga'on H1347 49x; govah H1363 17x; zadon H2087 11x; helel H1966 only Isa 14:12. Greek glosses from Abbott-Smith (STEPBible TBESG)."
      terms:
        - {word: "גָּאוֹן", language: hebrew, transliteration: "gaʾon", strongs_id: "H1347", gloss: "majesty; pride", notes: "Exod 15:7 God's majesty; Prov 16:18, 8:13 pride."}
        - {word: "ὑπερήφανος", language: greek, transliteration: "hyperēphanos", strongs_id: "G5244", gloss: "showing oneself above others (Abbott-Smith)"}
        - {word: "τυφόω", language: greek, transliteration: "typhoō", strongs_id: "G5187", gloss: "wrap in smoke; becloud with pride (Abbott-Smith)", notes: "1 Tim 3:6; 6:4; 2 Tim 3:4."}
  hermeneutics:
    cultural_vs_transcultural: {done: true, notes: ""}
    theological_principle: {done: true, notes: "See thesis. Statement of faith silent on Satan's fall; no conflict."}
    application_draft: {done: true, notes: "Boast in knowing the LORD; suspect yourself; ask someone where they see pride in you."}
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Luke 10:18", relation: "echo of Isa 14:12 LXX (ek tou ouranou + fall); bible_trace silent; ESVSB cf. Isa 14:12. Stated as an echo at most."}
    translations_compared: ["ESV", "LSB", "CSB", "NLT"]
    divergences_noted: "Isa 14:12 helel: ESV 'Day Star', LSB footnote 'Heb Helel; lit shining one', KJV 'Lucifer' via the Vulgate."
  drafting: {done: true, file: "docs/content/sin/pride.md"}
  review: {done: false, validated: true}

review_2026-09-28:
  by: "review-bible-study, subagent (anthropic/claude-opus-5.5)"
  verified_clean: "every ESV quotation; ga'on 49, govah 17, zadon 11, helel only Isa 14:12, hyperephania only Mark 7:22 (NT), typhoo 3; Abbott-Smith glosses; Origen and Tertullian quotations in ANF; NIV BTSB / NIVCBSB / ESVSB wording."
  critical_fixed:
    - "ga'on 'means two things' false (positive exaltation Isa 4:2, Ps 47:4; Jordan thicket Jer 12:5; 'arrogance' at Prov 8:13). Rewritten as a word for height whose value depends on who is lifted."
    - "ESVSB cited for a middle path it only reports ('Some have seen'). Now reported as such; the conclusion is the study's own."
  moderate_fixed:
    - "Origen: Ezek 28 = angel over Tyre; Isa 14 = devil, paired with Luke 10:18; Rufinus noted."
    - "'second century' -> 'early third century'."
    - "Added ESVSB 'second Adam' reading, Ezek 28:14 'with a cherub' fork (LXX meta tou cheroub; CSB footnote), and the oracle distinction."
    - "Luke 10:15 (heaven / Hades of Isa 14:13, 15) added to the echo, both ways."
    - "NLT Life Application cited for the Satan reading."
    - "'wrap in smoke' no longer argued from etymology; blindness rests on Obadiah."
    - "The cross named: justification by grace, redemption (Rom 3:24, 27)."
  minor_fixed: "1 Cor 4:18 ESV 'arrogant'; 1 Tim 3:6 paraphrase; worth-template in Lessons about Jesus; References trimmed to notes used; bible_references completed."
  open: "Dispensational commentaries' treatment of Isa 14 / Ezek 28 not in the repo; not named."

open_questions:
  - "1 Tim 3:6 genitive: condemnation the devil received vs. judgement brought by the devil (NIV BTSB). Study takes the first as 'most natural', marked."
resources_consulted:
