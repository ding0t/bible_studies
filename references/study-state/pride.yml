  - {type: commentary, title: "NIV Biblical Theology Study Bible", note: "Isa 14 argues for creaturely pride; application to Satan 'not inappropriate'; 1 Tim 3:6 alternative sense."}
  - {type: commentary, title: "NIV Cultural Backgrounds Study Bible", note: "helel = Venus, Ugaritic; Prov 11:2 Papyrus Insinger (not used)."}
  - {type: other, title: "Origen, De Principiis 1.5.4-5 (ANF 4); Tertullian, Against Marcion 2.10 (ANF 3)", note: "verified in $BIBLE_MEDIA_ROOT/reference/patristics/ante-nicene-fathers/."}
  - {type: lexicon, title: "Abbott-Smith via STEPBible TBESG", note: "hyperephanos, typhoo, alazoneia, physioo."}
