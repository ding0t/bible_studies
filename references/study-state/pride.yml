# Forked from humility.yml (backlog 10.5) at the author's suggestion, 2026-09-28: "feel free to spin
# off a counter study under sin/pride if needed". Backlog notes for pride: recognise it, where it
# comes from (Mark 7:21-22), God opposes the proud (James 4:6; 1 Pet 5:5), a pervasive deep sin;
# mark as contested any reading of Isaiah 14 or Ezekiel 28 as the fall of Satan.

slug: "pride"
title: "Pride"
status: review
target_path: "docs/content/sin/pride.md"

primary_passage: "Proverbs 16:18"
supporting_passages: ["Daniel 4:29-37", "Exodus 15:7", "Proverbs 8:13", "Obadiah 1:3-4", "Mark 7:21-23",
  "Genesis 3:5", "Deuteronomy 8:11-17", "2 Chronicles 26:16", "2 Chronicles 32:25-26", "1 Timothy 3:6",
  "Luke 18:9-14", "James 4:13-16", "Acts 12:21-23", "Isaiah 14:4-16", "Ezekiel 28:1-19", "Luke 10:18",
  "1 Corinthians 1:28-31", "Jeremiah 9:23-24"]
genre: [wisdom, prophets, topical]

thesis: >-
  Pride is claiming for yourself the height and glory that belong to God; it comes out of the heart,
  it blinds the one who has it, and God sets Himself against it, so the only way down from it is to
  humble yourself before Him and boast in the cross of Jesus.
outline:
  - section: "Opening"
    says: "Nebuchadnezzar on the roof (Dan 4:30) and his confession (4:37)."
  - section: "What the words mean"
    says: "ga'on = God's majesty (Exod 15:7) and man's pride (Prov 16:18); govah, zadon; hyperephanos 'showing oneself above', typhoo 'wrap in smoke', physioo, alazoneia."
  - section: "Where pride comes from"
    says: "the heart (Mark 7:21-23); 'like God' (Gen 3:5); success (Deut 8; Uzziah); gifts and knowledge (1 Cor; 1 Tim 3:6)."
  - section: "What pride looks like"
    says: "comparison, planning without God, putting self first, taking God's glory, haughty eyes, religious show; it blinds (Obadiah)."
  - section: "Why God opposes the proud"
    says: "pride is a lie about glory; its end (Prov 29:23; Isa 2:11); mercy to the proud who turn (Hezekiah, Nebuchadnezzar, tax collector)."
  - section: "Did Satan fall through pride?"
    says: "contested: case for (language beyond a man; Origen, Tertullian; Luke 10:18 echo; 1 Tim 3:6) and against (named kings; ANE imagery; context); ESVSB/NIV BTSB middle path; no doctrine rests on it."
  - section: "The way down"
    says: "boast in the Lord (1 Cor 1:28-31; Rom 3:27; Gal 6:14); humble yourself (Jas 4:10) -> humility.md."
word_budget: 4000
word_budget_reason: ""

