genre: [topical]

thesis: >
  A household learns the Lord's Prayer the way Deuteronomy 6 says every word of God is learned:
  in the ordinary hours of the day, one line at a time, prayed together before it is explained,
  so that children and parents come to know who the Father is and ask Him for what they need.
outline:
  - {section: "Key Takeaways", says: "Lessons about Jesus (He taught by praying first), memory verse, Be Transformed, a family prayer."}
  - {section: "Why a household teaches this prayer", says: "Deut 6:6-7 and Ps 78:4-7 put teaching in ordinary time; Luke 11:1 shows prayer learned by watching; Didache 8:3 shows the church praying it three times a day. Links prayer-as-communion#teaching-a-household-to-pray."}
  - {section: "How to use this guide", says: "One line a week for seven weeks; each week has the line, what it shows about God in one sentence a child can say, a Bible story, a question for children, a question for adults, a household practice, a verse to learn, and where to go deeper."}
  - {section: "Week 1 -- Our Father in heaven", says: "Adoption through Jesus; 'our' makes it a family prayer. Story: the prodigal's father (Luke 15:20). Deeper: lords-prayer#our-father-in-heaven, prayer-as-communion, assurance-of-salvation."}
  - {section: "Week 2 -- Hallowed be your name", says: "God's name is who He is (Exodus 34:6-7); a family carries it (Ezek 36:20). Story: God shows Moses His name (Exodus 34:5-7). Deeper: lords-prayer#hallowed-be-your-name."}
  - {section: "Week 3 -- Your kingdom come, your will be done", says: "Jesus is King and is coming back; 'your will' hands ours over. Story: Gethsemane (Matt 26:39). Deeper: your-kingdom-come, rapture."}
  - {section: "Week 4 -- Our daily bread", says: "The Father provides one day at a time. Story: manna (Exodus 16). Practice: specific thanks at meals, sharing. Deeper: bread-of-life-feeding-the-multitudes, humility#daily-bread."}
  - {section: "Week 5 -- Forgive us our debts", says: "Jesus paid the debt; we forgive because we are forgiven. Story: the unforgiving servant (Matt 18:21-35). Practice: family words for asking and granting forgiveness. Deeper: forgiveness, day-of-atonement, hurt-by-the-church."}
  - {section: "Week 6 -- Lead us not into temptation, deliver us from evil", says: "Jesus was tested and won; God gives the way of escape. Story: the wilderness (Matt 4:1-11). Practice: plan a way of escape. Deeper: fasting#forty-days-in-the-wilderness, rapture#kept-from-the-hour."}
  - {section: "Week 7 -- The whole prayer, and Amen", says: "Pray it together at set times; the doxology and what Amen means."}
  - {section: "Different ages", says: "Little ones memorise and say one sentence; school-age hear the story and answer; teenagers take the hard questions (James 1:13; Matt 6:15) from the main study."}
  - {section: "Questions for parents", says: "Discussion questions for the adults leading."}
