  findings:
    critical:
      - >
        "He presents her holy": ἄμωμος (G299) has eight NT occurrences and the study said "Seven
        describe people made morally blameless" -- then listed SIX (Eph 1:4, 5:27; Col 1:22;
        Phil 2:15; Jude 24; Rev 14:5) -- followed by "The eighth describes a lamb" and then named
        BOTH 1 Pet 1:19 and Heb 9:14. The real split is six of people, two of Christ. A Phase 4
        quantity claim internally contradicted two lines later. FIXED: "Six... The other two
        describe Christ". The point underneath is strengthened, not damaged -- the sacrifice/bride
        overlap is two of eight, not one.
    moderate:
      - >
        "So the title does change, and Scripture changes it at exactly the point the marriage
        comes." Overstated. γυνή does arrive at Rev 19:7 (verified), but νύμφη CONTINUES after the
        wedding at 21:2, 21:9 and 22:17, and 21:9 carries both nouns. The study's own next
        sentences conceded this, so the bold claim asserted more than the study held. FIXED to an
        ADDITION claim -- "Scripture gives her a second title, and gives it at the point the
        marriage comes" -- with the continuing νύμφη uses stated. Key Takeaways ("changes her
        title") and the frontmatter description were brought into line.
    minor:
      - 'Tier-2 mermaid label still read "chuppah -- Ps 19:5" while the prose had been corrected to Psalm 19:6 MT by the 2026-09-01 review. Half that fix had landed. FIXED to "Ps 19:6 MT".'
      - >
