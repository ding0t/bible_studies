revision_2026-09-20:
  request: >
    User: the study "does not give any so what factor - it is all superficial... i want a proper
    dispensational exegesis on the so what for the church as the bride of christ - betrothed
    (assurance, committed), preparing a chamber - what that means, and "always be with the LORD"
    and the covenant made - presenting his bride as holy."
  what_changed: >
    Added "## What the Betrothal Means for You Now" (~2,280 words, six sub-sections) between the
    popular-teaching tier section and the Discussion Questions, plus three discussion questions,
    frontmatter (tags 1-thessalonians/sanctification/rapture, 22 new bible_references, description),
    the prayer's close ("In Jesus' name. Amen."), and References entries. The six sub-sections:
    (1) the betrothal as a finished legal act -- harmozo + arrabon, landing on assurance;
    (2) He made the covenant and paid for it -- 1 Cor 6:20, Luke 22:20, Matt 26:29, the Mishnah's
    two exits closed by Rom 6:9, grounded in Hosea 2:19-20's five divine qualities;
    (3) why this belongs to the church and why now -- mysterion in Ephesians, Israel's betrothal
    uncancelled, the Rev 19:9 guests/bride question stated as contested;
    (4) the prepared place -- John 14:2-3, the mone pair, m. Ketubot 5:2's mutual preparation;
    (5) "and so we will always be with the Lord" -- 1 Thess 4:16-18, pantote, apantesis, and
    4:18's own stated pastoral purpose;
    (6) He presents her holy -- paristemi, amomos, loutron, Rev 19:7-8, Phil 1:6.
  every_esv_quote_verified: >
    All ESV quotations in the new section were pulled from study-notes.db (esv-study-bible verses
    table) in this session rather than recalled: Eph 5:25-27, 1 Thess 4:16-18, Eph 1:13-14, 4:30,
    2 Cor 1:22, 5:5, 5:10, Col 1:22, Jude 24, Rev 19:7-8, 1 Cor 6:20, Gen 38:17, Rom 6:9, Heb 9:14,
    1 Pet 1:19, Matt 25:6, Acts 28:15, John 14:2, 14:23, Titus 3:5, Eph 3:3, 3:5, 3:6, Luke 22:20,
    Hos 2:19-20, Phil 1:6.
  sibling_consistency: >
    Checked against rapture.md (which already argues the apantesis objection, the Bema, and where
    the supper sits) and israel-and-the-church.md (mysterion, Israel not replaced) and
    statement-of-faith.md's "End times". The new section defers the direction-of-travel argument to
    rapture.md rather than restating it, and defers the mystery word study to israel-and-the-church.
  validation: >
    npm run validate -- clean, no warnings on this file. mkdocs build --strict -- the only four
    warnings are pre-existing ones in about/key-takeaways.md, untouched here; all three new
    outbound links (assurance-of-salvation.md, israel-and-the-church.md#what-scripture-means-by-a-
    mystery, rapture.md) resolve.
  open: >
    The study's own prose uses lowercase divine pronouns throughout the PRE-EXISTING sections
    ("God took marriage as the picture of his covenant"), against AGENTS.md's capitalisation rule.
    The new section capitalises. Flagged to the user rather than silently rewriting the whole file,
    since a sweep has to avoid touching the quotations.


revision_2026-09-20b:
  request: >
    User asked for the wedding pattern broken into components and lined up against the church in OT
    and NT; the eight application domains they proposed (purchased, betrothed, prepared, covenanted,
    feasting, homed, always-with, inheritance) questioned and validated rather than accepted; and
    the ongoing meaning -- Sabbath rest, reigning with Christ, inheritance, and whether the bride is
    ever called wife. Diagrams requested.
  verse_corrections_made:
    - >
      "Purchased - 1 Pet 1:17" -> 1 Pet 1:18-19. 1:17 is conduct during exile; the ransom language
      (elytrothete / timio haimati Christou) starts at 1:18.
    - >
      "Betrothed - Eph 1:5, 1:13" -> 2 Cor 11:2. Eph 1:5 is huiothesia, ADOPTION, a different image
      (five NT occurrences, all Paul, LN 35.53, and Rom 9:4 applies it to Israel). Eph 1:13-14 is
      the sealing and the arrabon, which the study keeps but files under "Pledged", stage 3.
    - >
      "Feasting - Eph 1:6" -> Rev 19:7, 9. Eph 1:6 is "to the praise of his glorious grace". The
      feast word is gamos (G1062, 16 NT occurrences).
    - >
      "Prepared - 1 Pet 3" -> either 1 Pet 1:13 ("preparing your minds for action") or Eph 5:27 /
      John 14:2-3. 1 Pet 3 is household conduct and baptism; it does not carry a bridal preparation.
    - >
      "Always with the Lord" and "Inheritance" were moved OUT of the eight-stage pattern. They are
      what the marriage produces, not steps in it. Both now sit in the "After the Wedding" section.
    - >
      KEPT as the user had them: 2 Pet 3:13 and Eph 1:10 for "Homed" (though the study uses Rev 21:3
      and John 14:2 as the load-bearing pair); 1 Thess 4:17 and 5:10 for "always with the Lord";
      Eph 1:11/14/18 for the inheritance.
  main_finding: >
    THE CHURCH IS CALLED "WIFE", AND ENGLISH HIDES IT. Rev 19:7's "his Bride has made herself ready"
    is HE GYNE AUTOU in the Greek -- gyne (G1135), wife, with no nymphe in the verse. Verified via
    bible_interlinear Rev 19:7. Rev 21:9 has both nouns together: ten nymphen ten gynaika tou Arniou.
    So the title changes at the point the gamos comes, exactly as the user suspected it might.
    nymphe (G3565) has 8 NT occurrences, split by Louw-Nida: 3 at 10.60 (daughter-in-law -- Matt
    10:35, Luke 12:53 x2, all Jesus quoting Micah 7:6) and 5 at 10.57 (bride -- John 3:29, Rev
    18:23, 21:2, 21:9, 22:17). FOUR OF THE FIVE BRIDE USES ARE IN REVELATION, and one of those four
    (18:23) is Babylon's silenced wedding. Paul never uses nymphe of the church.
  supporting_word_data:
    - "sabbatismos G4520 -- hapax in the NT (Heb 4:9, LN 67.185) and ZERO LXX occurrences. Cross-linked to day-is-a-thousand-years.md rather than re-derived."
    - "symbasileuo G4821 -- exactly 2 NT occurrences, 0 LXX: 2 Tim 2:12 (the promise) and 1 Cor 4:8 (Paul's sarcasm at a church that thought it already reigned). The proportion is stated in the study."
    - "huiothesia G5206 -- 5 NT, all Paul, LN 35.53. Rom 9:4 gives it to ISRAEL; Rom 8:23 has it still FUTURE, the same already/not-yet shape as the betrothal."
    - "peripoiesis G4047 -- 5 NT (Eph 1:14; 1 Pet 2:9; 1 Thess 5:9; 2 Thess 2:14; Heb 10:39), 3 LXX including Mal 3:17 'my treasured possession'. Grounds the two-way inheritance."
    - "patria G3965 -- 3 NT (Luke 2:4; Acts 3:25; Eph 3:15), 174 LXX."
    - "gamos G1062 -- 16 NT; Rev 19:7, 9 use the ordinary wedding-feast word, same as Cana and Matt 22. LXX includes Gen 29:22 and Tobit 8:19-20, both already cited in this study."
    - "Hos 2:16 -- ishi (H376) replacing ba'li (H1180), verified via bible_interlinear. Isa 54:5 calls the LORD bo'alayik from the SAME root (H1166), so the root is not the problem; the study says so rather than over-reading Hosea."
    - "Ezek 16:8-9 -- covenant ('you became mine') THEN washing, the same order as Eph 5:25-26. ESV SB already draws the Ezek 16 link at Eph 5:26-27."
  what_changed: >
    Two new H2 sections and two new mermaid diagrams. "## The Pattern, Component by Component"
    (8-row table: component / custom / OT / church, plus a 3-subgraph TD diagram marking which four
    components are already done in the aorist, plus "### Three places the wrong verse gets cited").
    "## After the Wedding: Rest, Reign, Inheritance, Family" (five sub-sections, ending on Rev
    22:3-4 and 22:17, with a 2-column TD diagram). Key Takeaways gained the gyne finding; three
    discussion questions added (now 11); frontmatter description, tags and 28 further
    bible_references; References gained the MACULA/ULT and day-is-a-thousand-years entries.
