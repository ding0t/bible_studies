  found: >
    The seal. It sits beside the deposit in Paul's own clause and ties three passages the study
    already touches. In Genesis 38:18 -- the ONE Old Testament passage that uses erabon (H6162),
    the word behind arrabon -- the pledge Judah hands over is his chotam (H2368), a SEAL, with his
    cord and staff. So the pledge in that scene is the man's own identifying mark, and Tamar
    produces it later for exactly that purpose (38:25). Paul puts the same two things in one
    clause: God "has also put his seal on us and given us his Spirit in our hearts as a guarantee"
    (2 Corinthians 1:22) -- sealed AND deposited, the pair Genesis 38 already holds. Ephesians
    repeats it at 1:13-14. And Song of Songs 8:6's "Set me as a seal upon your heart" is chotam
    again, which lets the component cross-link to the annex section that already block-quotes that
    verse for shalhevetyah.
