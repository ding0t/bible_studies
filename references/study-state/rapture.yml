insight_2026-09-26:
  thesis_old: "The word Scripture uses for the rapture describes a real, sudden, physical rescue of the Church before the tribulation's judgment falls, and that promise is meant for comfort, not calculation."
  thesis_new: "God will send His Son Jesus to catch His Church up bodily to Himself before the tribulation's wrath falls, a sudden and real rescue He has promised in His own word, so that you can meet grief and waiting with comfort."
  prayer: "Closing changed from 'until you come. Amen.' to 'until you come. In Jesus' name. Amen.'"
  added:
    - section: "The word behind \"rapture\""
      text: "This shows that God gathers His people with the whole force the word carries: no one can snatch you out of His hand (John 10:28-29), and one day He will snatch you up to be with Jesus Himself."
    - section: "The promise"
      text: "This shows that God has tied your hope to a person: Jesus Himself is coming for you, so your heart need not be troubled (John 14:1)."
    - section: "The call to rapture"
      text: "This shows that God answers grief with the resurrection of the body: those you have buried in Christ rise first, and you will be with them and with the Lord always."
    - section: "The mystery of 1 Corinthians 15:51-53"
      text: "This is glorification, the last stage of your salvation, and God will complete it in you in the twinkling of an eye."
    - section: "The imminence of the rapture"
      text: "This shows that God keeps the day in His own hand and asks you for readiness: watch for Jesus Himself every day, because He is coming at an hour you do not expect (24:44)."
    - section: "Does the Church ride out with him?"
      text: "This shows that God means *always* in 1 Thessalonians 4:17: once you are caught up to Jesus you stay at His side, and when He appears in glory, you appear with Him (Colossians 3:4)."
    - section: "Who is the restrainer?"
      text: "This shows that God rules the timing of evil in His providence: the lawless one is revealed only \"in his time\" (2:6), so you need not be shaken or alarmed (2:2)."
    - section: "Where the supper sits"
      text: "This shows that God clothes the bride by grace from first to last: Jesus is the foundation already laid, and the linen is His gift, so you can build on Jesus now knowing that what He assesses at the Bema He first gave you."
    - section: "The tribulation"
      text: "This shows that God has already settled your destiny: He appointed you to obtain salvation through your Lord Jesus Christ, and on the reading argued here He will gather you before that week of wrath begins."
    - section: "Conclusion"
      text: "This is the blessed hope: God will send Jesus for you Himself, raise those who have died in Him, and keep you with Him forever, so encourage one another with these words (1 Thessalonians 4:18)."
  open_questions:
    - "Pointer links pending: when taken-before-judgment.md, meet-the-lord-in-the-air.md and rapture-in-the-early-church.md are published, link them from rapture.md (Key Takeaways 'Type'; the apantesis row of the vocabulary table / Think bullet; Other end-times views). Left out now because a published page linking a draft fails mkdocs --strict."
    - "Key Takeaways 'Type' still summarises Enoch/Lot typology whose body now lives in the taken-before-judgment fork."
    - "Study outline not added (Check 22); the read pass adds it, and it will push the page slightly past 4,000 -- the author may prefer word_budget 4200 then."
