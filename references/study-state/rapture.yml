    - old: "The counter-arguments named below — Revelation 3:10's ambiguity, 1 Thessalonians 4:17's *apantēsis* — are live ones, and a conclusion is only as strong as its handling of them."
      new: "The counter-argument named below, Revelation 3:10's ambiguity, is a live one, and a conclusion is only as strong as its handling of it."
