    content_word_studies:
      done: true
      notes: "Re-verified during review; two new terms added."
      terms:
        - {word: "ἁρπάζω", language: greek, transliteration: "harpazo", strongs_id: "G726", gloss: "seize, snatch, catch away by force", range_of_meanings: [], notes: "14 NT occurrences confirmed via bible_concordance; original draft's own enumeration only named 12 -- Matt 11:12 and John 6:15 added to close the gap."}
        - {word: "ἀπάντησις", language: greek, transliteration: "apantesis", strongs_id: "G529", gloss: "a going out to meet (civic-welcome sense)", range_of_meanings: ["technical term for a delegation going out to greet a dignitary and escort him back into the city"], notes: "Confirmed via bible_word: exactly 3 NT occurrences (1 Thess 4:17, Matt 25:6, Acts 28:15), all civic-welcome sense. Added as an honestly-engaged counter-argument to the multi-year-gap reading, not resolved away."}
        - {word: "βῆμα", language: greek, transliteration: "bema", strongs_id: "G968", gloss: "judgment seat / tribunal bench (Roman judicial)", range_of_meanings: [], notes: "CORRECTED during review -- original draft called it 'a Greek athletic term for the judge's platform at a games.' All 12 NT occurrences checked via bible_word are judicial/civic (Pilate, Herod, Gallio, Festus, Rom 14:10, 2 Cor 5:10); ESV Study Bible's note on 2 Cor 5:10 confirms Roman courtroom tribunal. Athletic-games gloss removed entirely."}
        - {word: "τὸ κατέχον / ὁ κατέχων", language: greek, transliteration: "to katechon / ho katechon", strongs_id: "G2722", gloss: "that which restrains (neuter, v.6) / the one restraining (masculine, v.7)", range_of_meanings: [], notes: "Confirmed directly against SBLGNT (macula-greek-sblgnt) via bible_verse: 2 Thess 2:6 has the neuter participle, 2:7 the masculine -- a real, independently-verifiable grammatical shift cited (via Robert Thomas, through Thomas Ice's article) as evidence for a personal restrainer consistent with the Spirit reading."}
  hermeneutics:
