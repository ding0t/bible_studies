      new: "Every time ἁρπάζω describes someone going to be with God, it describes a real, sudden, physical event. Paul chose that term in 1 Thessalonians 4:17, and it is the strongest lexical argument that the rapture is what it sounds like: a real, sudden, bodily gathering of the Church."
