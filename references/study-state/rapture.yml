revision_2026-09-06b:
  what: "User-requested comparative section on the two comings, plus the marriage supper's place in the wedding type."
  added:
    - >
      New section "Two comings, sorted by their own language" with two tables. The finding is that
      the usual argument -- different vocabulary, therefore different events -- mostly FAILS, and a
      better one replaces it. Checked against the corpus, not assumed: parousia, apokalypsis,
      epiphaneia, the episynago root and even salpinx (trumpet) all appear on BOTH sides. Only
      harpazo and apantesis are one-sided, and both sit in the same verse, 1 Thess 4:17. So the
      vocabulary argument reduces to one sentence of Paul's. The study's own earlier claim that the
      trumpet "ties this passage to 1 Corinthians 15" is now qualified, since Matt 24:31 has one too.
    - >
      Second table: eight FEATURES, every one of which lands in one column only -- direction the
      saints move, who accompanies him, who sees it, how the nations react, signs beforehand,
      judgment on the wicked, resurrection/transformation, and stated purpose in context. That is
      the argument the vocabulary could not carry.
    - >
      Third subsection on sequence markers, kept deliberately two-sided. Only the visible-coming
      texts carry an explicit time-stamp (Matt 24:29, "immediately after the tribulation"), so the
      rapture's position is inferred rather than stated -- an argument from silence, said plainly.
      Balanced by the one marker running the other way: Rev 19:7-8 has the marriage come and the
      bride ready TWO VERSES before the rider goes out at 19:11.
    - >
      New subsection "Where the supper sits, and what the bride is wearing", which makes a join
      neither this study nor bride-of-christ.md had made. Rev 19:8's fine linen "is the righteous
      deeds of the saints" -- dikaiomata, Louw-Nida 88.14 "righteous acts" (as at Rev 15:4), NOT
      the 33.334 "ordinances" sense the word carries in its six other NT uses (Luke 1:6; Rom 1:32,
      2:26, 8:4; Heb 9:1, 9:10). Those deeds are what the Bema assesses, and this study already
      places the Bema in heaven during the tribulation. So the bride wears the outcome of a
      judgment already completed, which the aorists of 19:7 (elthen, hetoimasen) confirm. Guarded
      against a merit reading by edothe aute, "it was granted her" -- a divine passive: given, and
      consisting of deeds, at once.
    - "The wedding-pattern diagram extended past the rapture to the Bema, the supper and the return. Re-measured at 276px, unchanged from before despite three more nodes."
  cut: "The 'Certainty' section's framing sentence about where Chuck Missler begins his own treatment -- reworded so the fact about Scripture leads and the citation follows, rather than the reverse."
  verification: >
    Every vocabulary row queried from macula-greek-sblgnt rather than recalled. Every feature-table
    citation pulled from study-notes.db (Titus 2:13, 1 Thess 4:18, 1 Cor 15:23, 1 Cor 1:7, 1 Pet
    1:13, 1 Thess 5:2, Rev 19:11). Rev 19:7-9 checked verbatim, and two of my own departures from
    the ESV corrected: an opening quotation mark added at v7 that the ESV does not carry there, and
    a space inserted before the em-dash at v8. bible_trace on Rev 1:7 returned only the stock LXX
    "all the tribes of the earth" blessing formula (Gen 12:3, 28:14, Ps 72:17), all uncorroborated,
    so it was NOT used -- but the direct Matt 24:30 / Rev 1:7 overlap (kopsontai plus that phrase)
    was observed in the Greek and is stated. mkdocs --strict clean, all four new anchors resolve,
    validate at the 8 pre-existing warnings.
  last_updated: "2026-09-06"

revision_2026-09-06c:
  what: >
    User question: does "the armies of heaven" at Rev 19:14 include the Bride, particularly given
    "we will always be with the Lord"? Answer is yes, on four converging lines -- and it forced a
    correction to the features table added earlier the same day.
  correction_to_own_work:
    - >
      The features table's row "Who comes with him" split cleanly (rapture: the dead in Christ /
      second coming: angels and armies), and the claim under it read "every one of them lands in one
      column or the other". Both were wrong. The Church is plausibly in BOTH columns, so the row now
      shows the overlap and the claim reads "seven of the eight". A shared row is the honest result
      and it turns out to be the most interesting one.
    - >
      Mid-draft I wrote that byssinos "clothes nobody else in the book". False: Rev 18:16 has
      Babylon periblebemene byssinon -- the same verb periballo as the Bride at 19:8. Caught by
      checking rather than by re-reading. The corrected version is stronger: THREE parties wear
      byssinos, and Babylon is the contrast rather than an exception -- she bought it (it is cargo
      at 18:12) and wears it with purple and scarlet, the Bride was GRANTED it bright and pure, and
      the armies' linen is qualified the Bride's way (white, pure) not Babylon's.
  evidence:
    - "Fabric: armies byssinon leukon katharon (19:14) against the Bride's byssinon lampron katharon (19:8), two of three words identical. Angels get a different noun -- linon katharon lampron (15:6) -- with the same participle endedymenoi."
    - "Rev 17:14, running up to the same scene: those with him are kletoi kai eklektoi kai pistoi, believer vocabulary rather than angel vocabulary."
    - "Col 3:4 states it directly: one verb phaneroo for Christ and for believers, joined by syn auto -- 'you also will appear WITH him in glory'."
    - >
      1 Thess 3:13 'with all his saints'. Handled with care rather than asserted: hoi hagioi as a
      substantive CAN mean angels (Zech 14:5, Jude 14, and 3:13 may echo Zechariah). But across 1-2
      Thessalonians Paul's substantive plural occurs only at 3:13 and 2 Thess 1:10, and 1:10 is
      unambiguously believers ('glorified in his saints... marveled at among all who have
      believed'). Every other hagios in those letters is 'Holy Spirit' or 'holy kiss'. Derived from
      the morphology, not recalled.
    - "pantote at 1 Thess 4:17 -- 'ALWAYS with the Lord', with no interval carved out."
  why_it_helps: >
    Stated in the study: this strengthens the pretribulational case rather than straining it, since
    the Church can only come WITH him if she was already taken TO him. It also explains the single
    shared row -- the two events differ in nearly everything but have the same people present, on
    opposite sides of the journey.
  verification: "All five ESV quotations re-checked verbatim against study-notes.db. mkdocs --strict clean, new anchor resolves, validate at the 8 pre-existing warnings."
  last_updated: "2026-09-06"

revision_2026-09-06d:
  what: "Section reordering after a user request to check whether the study's ordering is logical. It was not, in four specific ways."
  problems_found:
    - "The primary passage arrived seventh. Frontmatter names 1 Thess 4:15-18, but it was first quoted at line 165 of 530 -- after the word study, the sequence chart, the OT typology, John 14 and all of Matthew 24-25."
    - >
      The typology section preceded the texts it claimed to support, and said so in a sentence that
      contradicted itself: it opened "Before the New Testament describes the rapture directly" and
      then referred to "the direct teaching texts above", which were below it.
    - >
      The sequence diagram sat third, presenting the conclusion before any argument -- and this
      session made that worse by adding Bema and marriage-supper nodes that were not explained
      until 300+ lines later.
    - "The Jewish wedding pattern, and the new marriage-supper subsection inside it, sat AFTER Eternity, though the supper precedes the second coming. A four-section chronological backtrack."
    - "'Certainty' was a 131-word section with a title that named no content, holding a primary rapture text (John 14:1-3) that belonged beside the others."
  new_order: >
    Key Takeaways; harpazo word study; The promise (John 14, ex-"Certainty"); The call to rapture
    (1 Thess 4 + 1 Cor 15); The imminence; Two comings sorted; The restrainer; Types in the OT; The
    Jewish wedding pattern; The tribulation; The judgments; The millennial reign; Eternity; The
    whole sequence in one view; Early church testimony; Other end-times views; Conclusion;
    Discussion questions; References.
  rationale: >
    Grouped by function: lexical base, then the direct teaching texts, then the argument, then the
    systematic comparison, then the supporting typology (now genuinely after what it supports),
    then the wedding type, then the sequel events in order, then reception and conclusion. The
    diagram moved from third to a capstone after Eternity, which resolves every forward reference
    it had -- Bema, marriage supper and the sequel sections are all explained before the reader
    reaches it. Renamed "The whole sequence in one view" to signal it is a recap rather than a
    roadmap, with a matching lead-in.
  method: >
    Done mechanically rather than by hand: split the body on ## boundaries, reassembled by index,
    and asserted the body word count unchanged (9,219 before and after) so no content could be
    lost or duplicated in the move.
  reference_sweep: >
    The real cost of reordering here was not anchors but the 27 "above"/"below" references. Audited
    every one against the new section map. Five needed changing: the imminence back-reference in
    The call to rapture, the typology link in The imminence, the direct-teaching-texts reference in
    Types (which had been WRONG in the old order too and was corrected in the opposite direction
    earlier the same day), a vague "The sequence above" in the wedding section, and a now-stale
    '"Certainty" section above' in References. Three others had already been found wrong before the
    move -- two of them introduced by this session's own edits -- and were fixed then.
  anchor_safety: >
    Checked before moving anything: no other page on the site links to a rapture.md ANCHOR, only to
    the file, so reordering could not break an inbound link. All 11 of the study's own internal
    anchors re-verified as resolving after the move, including the two renamed headings; the two
    old anchors (#certainty, #the-sequence-of-end-time-events) confirmed gone from the built page.
  verification: "Body word count identical. mkdocs --strict clean. validate at the 8 pre-existing warnings. Both diagrams re-measured after the move: 276px and 552.8px, each rendering at 100%. All nine changed section junctions read for dangling transitions; none found."
  last_updated: "2026-09-06"

revision_2026-09-06e:
  what: >
    User asked whether rapture.md and bride-of-christ.md align on the seven-day wedding feast
    against the seven-year tribulation. They aligned only by omission -- neither drew the link --
    so a short observation was added to both, at the user's direction to state genuine linkage
    without overclaiming.
  finding: >
    The two durations are the SAME Hebrew noun: shabua (H7620). Gen 29:27's seven-day wedding feast
    and Dan 9:27's week of years share lemma and Strong's number, verified from macula-hebrew-wlc
    rather than assumed. The distribution is narrow and supports the link: 20 OT occurrences, of
    which 8 are the Feast of Weeks formula (Exod 34:22; Deut 16:9 x2, 16:10, 16:16; Num 28:26;
    2 Chr 8:13; Ezek 45:21). With those set aside, 10 of the remaining 12 sit in Genesis 29 (2) and
    Daniel 9-10 (8), leaving only Lev 12:5 and Jer 5:24 -- so the bare "bounded seven-period" sense
    is concentrated in exactly the two passages in question.
  limits_stated_in_both: >
    No text states the correspondence; it is inferred from two independently true durations. And
    the unit differs -- Genesis counts days, Daniel counts years -- which is the question rather
    than its answer. Scripture does use day-for-a-year (Num 14:34; Ezek 4:6) but for judgment
    reckonings, not feast typology, so that bridge was NOT invoked. Both studies now call it a
    resemblance in the vocabulary rather than a stated design.
  why_it_clears_the_bar: >
    bride-of-christ.md already declines three popular wedding-custom claims as undocumented,
    closing that "the invented details add colour and cost credibility". This one is different in
    kind: it is a resemblance in the biblical text rather than in a reconstructed custom, which is
    said explicitly in the note added there. Two things that study had already found now read as
    supporting context rather than isolated data -- Joel 2:16 placing bridegroom and bride leaving
    their chambers inside a day-of-the-LORD summons, and Isaiah 4:5 putting the chuppah word over
    Zion in an eschatological oracle.
  placement: >
    rapture.md: a single paragraph after the wedding-custom bullets, before "Where the supper sits",
    which is where the feast's LENGTH belongs and leads into the supper. bride-of-christ.md: two
    sentences appended to "The feast, and the canopy", the section that already documents the
    seven-day feast. Cross-linked both ways.
  verification: "All seven verses re-checked against study-notes.db (Gen 29:27; Judg 14:12; Dan 9:27; Num 14:34; Ezek 4:6; Joel 2:16; Isa 4:5). shabua occurrence list and count queried, not recalled. mkdocs --strict clean, both cross-links resolve in the built pages, Hebrew renders inside a dir=rtl span with no bold (validate Check 9 clean)."
  last_updated: "2026-09-06"

revision_2026-09-06f:
  what: >
    User noticed that the apantesis objection and the later "the Church returns with him" material
    look consistent rather than in tension, and asked for it validated and expanded. It is
    consistent, and checking it turned up that the study had been overstating the objection.
  finding_the_septuagint: >
    The study said apantesis "was the ordinary Greek term for a delegation going out to formally
    greet an arriving dignitary and then escorting him back into the city", resting that on the two
    other NT uses. Three occurrences is a thin base, and the study had never consulted the
    Septuagint -- which is Paul's own Bible and uses eis apantesin TWENTY times. The range is far
    wider than a civic-welcome script: Israel goes out eis apantesin autois EIS POLEMON, "to meet
    them for war" (1 Sam 4:1); Michal goes out eis apantesin to David and rebukes him (2 Sam 6:20);
    Ishmael goes out eis apantesin weeping and murders the men he meets (Jer 41:6, LXX 48:6).
    Greetings and welcomes sit alongside those. The noun means "go out and meet"; welcome, rebuke
    and ambush are all supplied by context. Verified in ebible-grcbrent, quoting the Greek.
  finding_the_commentary: >
    The NIV Cultural Backgrounds Study Bible -- which rapture.md did NOT cite, so an independent
    check -- states the civic sense with a condition the study had dropped: "WHEN USED IN A CONTEXT
    OF A ROYAL 'COMING'", those welcoming him "would go to form his escort EN ROUTE TO HIS
    DESTINATION". Both halves matter. The sense is conditioned on context rather than resident in
    the word, and the escort accompanies him to HIS destination, which the note does not identify --
    so it does not decide the direction of travel.
  the_users_point_validated: >
    Correct, and now stated. The objection assumes the pattern needs an IMMEDIATE return. What it
    needs is a return. Christ is met in the air at 1 Thess 4:17 and comes back with his own at Rev
    19:14 -- the case already made in "Does the Church ride out with him?" -- so the civic pattern
    completes with an interval inside it. The two sections were never in tension; the study simply
    had not joined them.
  bonus: >
    Matthew 25:6 is the one apantesis text that is also a wedding, and it is usually cited AGAINST
    the pretribulational reading. Its own sequence is meeting (25:6) then "went in with him to the
    marriage feast" (25:10) -- which is the order this study now argues: caught up, assessed,
    married, returning. On the sequence set out here it fits rather than opposes.
  heading_changed: >
    "The strongest objection: apantesis" is no longer accurate, so it became "The apantesis
    objection, and what the Septuagint does to it". Checked first that nothing on the site linked
    the old anchor; nothing did.
  not_overclaimed: >
    The section still says outright that apantesis is not a plank in the case and that the argument
    rests on imminence, the absent-signs contrast and 1 Thess 5:9. The change is that the word is
    weaker as an OBJECTION than it is usually made to carry -- not that it now supports the
    conclusion.
  last_updated: "2026-09-06"

