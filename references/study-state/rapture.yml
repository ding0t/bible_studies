    translations_compared: ["ESV", "SBLGNT (Greek, queried directly)"]
    divergences_noted: "None found in the ESV quotations themselves (all 28 verified verbatim against study-notes.db); the substantive finding was mis-description of Greek etymology (bema) and an unengaged counter-reading (apantesis), not translation divergence."
