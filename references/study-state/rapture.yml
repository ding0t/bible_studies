  shortened:
    - old: "Two well-argued perspectives exist on how this happens. The first holds that the rapture — the *harpazo*, \"catching up\" — is a distinct event from the second coming, separated by the seven-year tribulation. The second holds that the *harpazo* and the second coming are the same event described in different terms. What follows makes the case for the first: pretribulational and dispensational, consistent with how this site reads prophecy elsewhere (see [The Zadok Calendar] and [The Day is Near])."
