# State for docs/content/scripture/what-the-links-reveal.md -- a reading of the derived scripture
# links as a whole. Every count in the study is a claim below; re-run with
#   uv run python verify_claims.py what-the-links-reveal   (from references/build)
# Strong links are the rows the build marks `strong`: a rule in quotations.py admitted each one,
# and `basis` names the rule (docs/dev/link-detection-research.md).
slug: what-the-links-reveal
status: drafted
date: 2026-10-20
history:
  - 2026-10-19 first draft against 1,114 links (surface matching only)
  - 2026-10-20 revised after the link rules changed; several absences were the method's
  - 2026-10-20 reviewed against the shipped data: genealogy allusions 35->32, deuterocanon 20->19, OpenBible verses with no derived link 2,224->2,234 (English-scheme targets), Psalm 95 "seven verses"; six claims added
claims:
  - id: strong-total
    what: strong links of every kind
    sql: "SELECT COUNT(*) FROM scripture_links WHERE strong"
    expect: 2500
  - id: strong-greek-quotations
    what: strong Greek quotations, NT to Septuagint
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='quotation-greek' AND strong"
    expect: 246
  - id: inner-biblical
    what: Hebrew Old Testament links to itself
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='inner-biblical' AND strong"
    expect: 2054
  - id: crosslang
    what: quotations read against the Hebrew
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='quotation-crosslang' AND strong"
    expect: 48
  - id: weak-greek
    what: Greek matches no rule admits
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='quotation-greek' AND NOT strong"
    expect: 5161
  - id: hebrews-links
    what: strong links from Hebrews
    sql: "SELECT COUNT(*) FROM scripture_links WHERE from_book='Heb' AND strong"
    expect: 65
  - id: revelation-quotations
    what: strong Greek quotations in Revelation
    sql: "SELECT COUNT(*) FROM scripture_links WHERE from_book='Rev' AND link_type='quotation-greek' AND strong"
    expect: 3
  - id: john-10-34
    what: John 10:34 quoting LXX Psalm 81:6 (English 82:6) is strong
    sql: "SELECT COUNT(*) FROM scripture_links WHERE strong AND from_book='John' AND from_chapter=10 AND from_verse=34 AND to_book='Ps' AND to_chapter=81"
    expect: 1
  - id: matt-2-6-micah
    what: Matthew 2:6 quoting Micah is strong
    sql: "SELECT COUNT(*) FROM scripture_links WHERE strong AND from_book='Matt' AND from_chapter=2 AND from_verse=6 AND to_book='Mic'"
    expect: 1
  - id: matt-27-46
    what: any link from Matthew 27:46
    sql: "SELECT COUNT(*) FROM scripture_links WHERE from_book='Matt' AND from_chapter=27 AND from_verse=46"
    expect: 0
  - id: matt-24-15-strong
    what: strong links from Matthew 24:15
    sql: "SELECT COUNT(*) FROM scripture_links WHERE strong AND from_book='Matt' AND from_chapter=24 AND from_verse=15"
    expect: 0
  - id: chron-16-psalms
    what: Hebrew links between 1 Chronicles 16 and the Psalms
    sql: |
      SELECT COUNT(*) FROM scripture_links WHERE link_type='inner-biblical' AND strong AND
        ((from_book='1Chr' AND from_chapter=16 AND to_book='Ps') OR (to_book='1Chr' AND to_chapter=16 AND from_book='Ps'))
    expect: 25
  - id: chron-16-8-surface
    what: 1 Chronicles 16:8 against Psalm 105:1 on the surface, under the old line
    sql: "SELECT alignment FROM scripture_links WHERE link_type='inner-biblical' AND from_book='1Chr' AND from_chapter=16 AND from_verse=8 AND to_book='Ps' AND to_chapter=105"
    expect: 12
  - id: rom-3-13-psalm-13
    what: Romans 3:13 aligns with LXX Psalm 13:3
    sql: "SELECT alignment FROM scripture_links WHERE link_type='quotation-greek' AND from_book='Rom' AND from_chapter=3 AND from_verse=13 AND to_book='Ps' AND to_chapter=13 AND to_verse=3"
    expect: 30
  - id: mark-12-30-deut
    what: strong Greek links from Mark 12:30 to Deuteronomy
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='quotation-greek' AND strong AND from_book='Mark' AND from_chapter=12 AND from_verse=30 AND to_book='Deut'"
    expect: 8
  - id: james-2-8-surface
    what: James 2:8 against Leviticus 19:18 on surface alignment, under the old line of 18
    sql: "SELECT alignment FROM scripture_links WHERE link_type='quotation-greek' AND from_book='Jas' AND from_chapter=2 AND from_verse=8 AND to_book='Lev'"
    expect: 12
  - id: formula-rule-precision
    what: links admitted by the formula rule alone that independent cross-references confirm
    sql: "SELECT SUM(corroborated) FROM scripture_links WHERE basis='formula+phrases'"
    expect: 20
  - id: genealogy-allusions
    what: allusion links from Jesus' genealogies (Matthew 1, Luke 3)
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='allusion-lemma' AND strong AND ((from_book='Matt' AND from_chapter=1) OR (from_book='Luke' AND from_chapter=3))"
    expect: 32
  - id: deuterocanon-allusions
    what: allusion links to deuterocanonical books
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='allusion-lemma' AND strong AND to_book IN ('Wis','Sir','1Macc','2Macc','3Macc','4Macc','TobS','PsSol','2Esd')"
    expect: 19
  - id: regnal-formula
    what: Hebrew links where either verse carries "the rest of the acts" (WEB)
    sql: "SELECT COUNT(*) FROM scripture_links s WHERE strong AND link_type='inner-biblical' AND EXISTS (SELECT 1 FROM verses w WHERE w.work_id='ebible-eng-web' AND lower(w.text) LIKE '%rest of the acts%' AND ((w.book=s.from_book AND w.chapter=s.from_chapter AND w.verse=s.from_verse) OR (w.book=s.to_book AND w.chapter=s.to_chapter AND w.verse=s.to_verse)))"
    expect: 229
  - id: tabernacle-commanded-built
    what: Hebrew links joining Exodus 25-31 to Exodus 35-40
    sql: "SELECT COUNT(*) FROM scripture_links WHERE link_type='inner-biblical' AND strong AND from_book='Exod' AND to_book='Exod' AND MIN(from_chapter,to_chapter) BETWEEN 25 AND 31 AND MAX(from_chapter,to_chapter) BETWEEN 35 AND 40"
    expect: 181
  - id: hebrews-psalm-95
    what: verses of Hebrews strongly linked to Psalm 95 (LXX 94)
    sql: "SELECT COUNT(DISTINCT from_chapter*100+from_verse) FROM scripture_links WHERE strong AND from_book='Heb' AND to_book='Ps' AND to_english_chapter=95"
    expect: 7
  - id: greek-alignment-only-precision
    what: per cent of Greek links admitted on alignment alone, no unique phrase, that are confirmed (method page)
    sql: "SELECT ROUND(100.0*AVG(corroborated)) FROM scripture_links WHERE link_type='quotation-greek' AND strong AND basis='alignment'"
    expect: 56
