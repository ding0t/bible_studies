genre: [law, ot-narrative, gospel, epistle, prophets, topical]

thesis: >
  God set a table in His tent and kept bread on it before His face every Sabbath, from the twelve
  tribes and eaten by His priests, continuing the meal Israel's elders ate in His presence on
  Sinai; the New Testament never explains the table, but it names the Lord's table and the table
  in His kingdom, so in His Son Jesus you are given a place at God's table now and at His table to
  come.
outline:
  - section: "Hook + In one sentence + Key Takeaways + Study outline"
    says: "Exodus 24:11 'they beheld God, and ate and drank', then the first thing God orders after the ark is a table."
  - section: "Made after the pattern (Exodus 25:23-30)"
    says: "2 x 1 x 1.5 cubits, acacia overlaid with gold, a handbreadth rim, rings at the legs for poles, gold plates, dishes, flagons and bowls (LSB footnote 'Or platters'). Plate drawn to scale; what the text leaves out drawn dashed."
  - section: "The bread of the Face"
    says: "lechem panim set lefanai tamid (Exodus 25:30): panim twice, 'bread of the Face before My face' (LSB 'Lit Face'). Twelve loaves of two tenths each, two ma'arakhot (ESV 'piles', interlinear 'rows'; the plate flags both), frankincense as the memorial, set out every Sabbath 'from the people of Israel as a covenant forever', eaten by the priests in a holy place (Leviticus 24:5-9). The text's own reasons it is not food for God: weekly, and eaten by the priests (CBSB background on ANE temple feeding, set beside the text, not carrying it)."
  - section: "From the wilderness to the temple"
    says: "Blue cloth and 'the regular bread' on the march (Numbers 4:7); Kohathites prepare it every Sabbath (1 Chronicles 9:32); David's gold and silver tables and Solomon's ten (1 Chronicles 28:16; 2 Chronicles 4:8, 19); Ezekiel's wooden 'table that is before the LORD' (Ezekiel 41:22). Hebrews 9:2 lists it in the first tent."
  - section: "David ate the holy bread"
    says: "1 Samuel 21:1-6: the bread 'removed from before the LORD', replaced by hot bread. Jesus reads it in Matthew 12:1-8 (and Mark 2:25-28; Luke 6:3-5): the priests' bread given to the hungry, 'something greater than the temple is here', mercy and not sacrifice, the Son of Man lord of the Sabbath. Greek prothesis, 'loaves of presentation'."
  - section: "The table of the Lord"
    says: "Malachi 1:7, 12, the LORD's table despised by the priests; Paul's 'table of the Lord' (1 Corinthians 10:21); Jesus' 'eat and drink at my table in my kingdom' (Luke 22:29-30). Link the Lord's Supper and Four Cups studies."
  - section: "What the table shows about God"
    says: "Tier table: stated (Hebrews 9:2 lists it; Jesus cites the bread), echoed (Lord's table, table in the kingdom), inferred (John 6:35 bread of life; Christ as the bread before God's face), later tradition. Hebrews 9:5's limit. God feeds His people before His face, and in Jesus you eat with Him."
  - section: "Discussion questions; References"
    says: ""
