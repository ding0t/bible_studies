  exegesis:
    historical_context:
      done: true
      notes: >
        Instructions given on Sinai (Exodus 25-31), carried out in 37:10-16, placed 'on the north
        side ... outside the veil' (Exodus 40:22-23). Immediately before, the covenant is ratified
        and the elders 'beheld God, and ate and drank' (Exodus 24:11); ESVSB reads it as the
        fellowship the peace offering signifies. ANE temples fed their gods daily; CBSB notes the
        tabernacle bread differs: weekly, and eaten by priests (Leviticus 24:8-9).
    literary_context:
      done: true
      notes: >
        Exodus 25 orders the furniture from the inside out: ark (10-22), table (23-30), lampstand
        (31-40). The table is the first thing outside the Most Holy Place. Leviticus 24:1-9 pairs
        the lamp oil and the bread right after the feast calendar of chapter 23.
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "שֻׁלְחָן", language: hebrew, transliteration: "shulchan", strongs_id: "H7979", gloss: "table", notes: "71 occurrences (macula-hebrew-wlc, count_only)."}
        - {word: "לֶחֶם פָּנִים", language: hebrew, transliteration: "lechem panim", strongs_id: "H3899 + H6440", gloss: "bread of (the) face/presence", notes: "Exodus 25:30 sets it לְפָנַי 'before my face': panim twice. LSB footnote 'Lit Face'."}
        - {word: "תָּמִיד", language: hebrew, transliteration: "tamid", strongs_id: "H8548", gloss: "continually, regularly", notes: "Exodus 25:30; Leviticus 24:8. LSB 'at all times', footnote 'Or continually'. Same word the lampstand page works."}
        - {word: "מַעֲרָכָה / מַעֲרֶכֶת", language: hebrew, transliteration: "ma'arakhah / ma'arekhet", strongs_id: "H4634 / H4635", gloss: "row, pile, arrangement", notes: "Leviticus 24:6: two ma'arakhot, six in the ma'arekhet. ESV 'piles', ULT 'rows'. Verb arakh (H6186) 'arrange' in 24:8 and Exodus 40:23. Plate must flag both readings."}
        - {word: "πρόθεσις", language: greek, transliteration: "prothesis", strongs_id: "G4286", gloss: "presentation, setting out; purpose", notes: "12 NT uses (SBLGNT): the bread in Matthew 12:4; Mark 2:26; Luke 6:4; Hebrews 9:2 ('presentation'); elsewhere God's or a person's purpose (Romans 8:28; 9:11; Ephesians 1:11; 3:11; 2 Timothy 1:9; 3:10; Acts 11:23; 27:13). LSB footnote at Matthew 12:4 'lit loaves of presentation'. Two senses of one word: do NOT build an argument on the overlap."}
