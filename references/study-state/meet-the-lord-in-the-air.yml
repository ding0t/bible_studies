slug: "meet-the-lord-in-the-air"
status: draft
target_path: "docs/content/last-things/meet-the-lord-in-the-air.md"
genre: "epistle (1 Thessalonians 4:13-18), with a Greek word study across the NT and LXX"
word_budget: 4000
last_updated: "2026-09-27"

thesis: >
  Apantesis means going out to meet someone arriving, and what happens after the meeting is set by
  the occasion; Paul names the occasion as the Lord Jesus coming for His own, promises "we will
  always be with the Lord," and does not say which way the company travels next, so the word leaves
  room for Jesus to take His Church to the Father's house first and bring her back with Him at the
  end of the tribulation.

outline:
  - "The passage: grieving church (Acts 17:5-10; AD 49-51), 1 Thess 4:13-18 block quote, point = comfort (4:18); parousia (4:15) and apantesis (4:17) named."
  - "The objection at full strength: Peterson 1930 civic reception; ESVSB and NIV BTSB notes; Gundry 1996 vs Cosby; Acts 28:15-16, Matt 25:6, John 12:12-13 (hypantesis) fit it."
  - "What the word carries: Brenton LXX 24x/22 verses, all eis (ten) apantesin; greeting/war/rebuke/massacre; Hebrew liqrat; Matt 8:34 hypantesis ending in dismissal; Sinai (Exod 19:16-17, synantesis) as a contested allusion."
  - "What the civic-sense commentary actually says (moved): NIV CBSB's condition and 'his destination'; John 14:2-3; 4:17 states the company, not the direction."
  - "The escort, completed later (moved): return at Rev 19:14 via rapture.md; 4:14; Matthew 25 meeting-feast-return."
  - "Settled and contested: explicit lists; apantesis not a plank in the pretrib case."

