corrections_to_moved_text:
  - "Moved text said the Septuagint uses eis apantesin 'twenty times'. Brenton's Greek has the noun 24 times in 22 verses (1 Sam 30:21 and Jer 28:31 LXX twice each), 19 verses matching the exact string 'εἰς ἀπάντησιν' (1 Sam 9:14 has εἰς τὴν ἀπάντησιν; 1 Sam 25:32, 34 accent ἀπάντησίν). Draft now says 24/22 and gives the lemma-data count (41 verses). rapture.yml's revision_2026-09-06f records 'TWENTY' -- author may want that note corrected."
  - "Moved text had 'Ishmael goes out eis apantesin weeping'. In the Hebrew/ESV Ishmael weeps; in the LXX (Jer 48:6 Brenton) it is the pilgrims who 'were walking and weeping'. Draft now cites ESV Jer 41:6-7 for the massacre and drops the weeping detail."

