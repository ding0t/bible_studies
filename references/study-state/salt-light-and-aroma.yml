review_2026-10-22:
  checked:
    - "Phase 1: all 68 ESV quotations re-queried from study-notes.db (esv-study-bible) by script; all verbatim apart from dropped sentence-initial conjunctions (Matthew 7:26 'And', Ephesians 5:1 'Therefore', Ephesians 5:8 'for'). Comic bubbles: build_comics.py --verify all ok."
    - "Phase 3: bible_concordance on macula-greek-sblgnt re-derived G217 (7), G3471 (4), G741 (3), G3426 (3), G5458 (2), G2175 (3), G3744 (6 in 5 verses), G2358 (2), G3087 (12 in 11 verses, 5 outside Revelation); all match. Mark 9:50 also has ἅλα tagged G251 (1), not counted under G217, which is consistent with the pop-up. H5207: Ezekiel 20:41 is the only occurrence applied to a people (others are offerings, incl. idols' at Ezekiel 6:13; 16:19; 20:28), so 'Once God says it of a people' holds. NA28 checked for Ὑμεῖς ἐστε (Matthew 5:13-14), τὸ φῶς τοῦ κόσμου (John 8:12), τὸ φῶς ὑμῶν (5:16), ἐν τίνι ἁλισθήσεται, ἐν ἑαυτοῖς (Mark 9:50). Brenton LXX checked for Genesis 1:14 φωστῆρες, Genesis 8:21 and Ezekiel 20:41 ὀσμὴ εὐωδίας, Deuteronomy 32:5 γενεὰ σκολιὰ καὶ διεστραμμένη. Footnotes on Matthew 5:13-16 and 2 Corinthians 2:14-16: only CSB 5:13 and LSB 5:14, 5:15, all already disclosed."
    - "Phase 2: study-note attributions checked: NIV CB Matthew 5:13, 5:14, 5:15, Colossians 4:6 confirmed; NIV BT 2 Corinthians 2:14 (captives, Colossians 2:15) confirmed."
    - "Phase 5: NLT Life Application (uncited) on Matthew 5:13-14 confirms the salt/light reading (distinct and engaged; city visible at night); silent on the aroma."
    - "Phase 6: review_gaps: no quotation gap bearing on the argument (Isaiah 33:18 via 1 Corinthians 1:20 is incidental). cross_study_claims Matthew 5, 2 Corinthians 2, Revelation 2: consistent with lampstand.md and the-restrainer.md. Statement of faith: consistent; see the open question on 'thrown out'."
  fixed:
    - "Critical (synthetic claim): 'to every church He says, \"I know your works\"' was false; Smyrna hears 'I know your tribulation' (2:9) and Pergamum 'I know where you dwell' (2:13). Now 'church after church' with the five references; bible_references extended."
    - "Critical (citation): incense along the triumph route was attributed to the NIV Biblical Theology Study Bible, whose note says nothing of incense. Re-attributed to the ESV Study Bible's 2:15-16a note ('taken by some'). The historical_context note above repeats the wrong attribution (NIV BT, Cultural Backgrounds); neither note mentions incense."
    - "Moderate: the Revelation 4:5 sentence said the lampstands' light is connected to the seven spirits; Revelation 4:5 has torches, and lampstand.md says 'John sees torches here, and no lampstand'. Reworded."
    - "Minor: Matthew 7:26 'the same word' was the adjective μωρός, not the verb; 'an ordinary house' for a picture that includes the smoke of an offering; Acts 13:45 'many in the synagogue' became 'the Jews of Pisidian Antioch'; NIV CB salt-impurity note re-attributed to 'commentators' as the note does; transliteration 'reach' became 'reyach' with pronunciation; pronunciations added for nine glossed Greek words (house rule)."
    - "Minor (comic): the point read 'walks among His churches as their lampstands' (He is not the lampstands); now 'His churches, His lampstands'. SVG rebuilt, --verify ok, alt text in the study matches --alt."
  not_fixed:
    - "Question for the author: Matthew 5:13 'thrown out' and Revelation 2:5 removal are read as loss of usefulness/place. The study never says whether 'thrown out' bears on a believer's salvation; statement-of-faith 'The house God is building' (the foundation is never at risk) would answer it in one sentence. Doctrinal addition, left to the author."
    - "Minor: the 2 Corinthians 2:15 memory verse ends mid-sentence on a comma; consider 2:15-16a."
    - "Minor: tag 'light' is used by no other page; 'witness' by one other (great-commission.md)."
  size: "5,342 words raw; validator Check 23 counts under the 4,000 budget (quotes excluded). Fixes added about 45 words."


