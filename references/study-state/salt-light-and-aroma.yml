slug: "salt-light-and-aroma"
title: "Salt, Light and the Aroma of Christ"
status: published
target_path: "docs/content/christian-life/salt-light-and-aroma.md"

primary_passage: "Matthew 5:13-16; 2 Corinthians 2:14-16"
supporting_passages:
  - "Mark 9:49-50"
  - "Luke 14:34-35"
  - "Colossians 4:5-6"
  - "Leviticus 2:13; Numbers 18:19; 2 Chronicles 13:5; 2 Kings 2:19-22"
  - "John 8:12; 9:5; Isaiah 42:6; 49:6; Acts 13:47"
  - "Philippians 2:14-16; Ephesians 5:1-2, 8-9; 1 Peter 2:9-12; 2 Corinthians 4:6"
  - "Revelation 1:12-13, 20; 2:1, 4-5"
  - "Genesis 8:21; Ezekiel 20:41; Philippians 4:18; John 12:3"
sibling_studies:
  - {slug: "jesus/the-heavenly-pattern/lampstand.md", role: cited, use: link, note: "Covers Revelation 1-2 lampstands, the Ephesus warning and Jesus as High Priest among them; link to #seven-lampstands-on-patmos instead of re-arguing. It already cites Matthew 5:14-16 and counts λυχνία outside Revelation (5)."}
  - {slug: "last-things/the-restrainer.md", role: cited, use: none, note: "Cites Philippians 2:15 (church in the midst of a crooked generation). Consistent with this study."}
  - {slug: "christian-life/humility.md", role: primary, use: none, note: "Philippians 2:1-13; this study uses 2:15 only."}
  - {slug: "last-things/two-witnesses.md", role: cited, use: none, note: "Revelation 11:4 lampstands; not needed here."}
  - {slug: "jesus/the-heavenly-pattern/incense-altar.md", role: prose, use: enrich, note: "Could take a link back to this study's aroma section (Ezekiel 20:41; 2 Corinthians 2:15). Offer only."}
genre: [gospel, epistle, apocalyptic, topical]

thesis: "Jesus calls His disciples salt, light and the aroma of Christ: each believer carries what is His, and together, as a city on a hill and as lampstands He walks among, the church shows the world the Father, so that people see your good works and give glory to God."
outline:
  - {section: "Who Jesus is talking to", says: "Matthew 5:1-12: disciples, plural, just called blessed in persecution; 'you are' is a statement of what they are."}
  - {section: "The salt of the earth", says: "Salt preserved, seasoned and sealed covenants; μωραίνω means become foolish; salt that stops being salt is thrown out; Mark 9:50 and Colossians 4:6 put it in the church's peace and in speech."}
  - {section: "The light of the world", says: "Jesus is the light and gives it; Isaiah's Servant's calling; a city (corporate) and a lamp (household); 'your (plural) light (singular)'; the light is good works that bring glory to the Father."}
  - {section: "Churches as lampstands", says: "Revelation 1:20 names churches as lampstands; Jesus walks among them and can remove one (2:5), the same warning as salt thrown out. Link The Lampstand."}
  - {section: "The aroma of Christ", says: "2 Corinthians 2:14-16 joins the triumph and the sacrifice's pleasing aroma; God accepts His people as an aroma (Ezekiel 20:41); Ephesians 5:2 and Philippians 4:18 extend it to every believer and a church's giving; one fragrance, two responses."}
  - {section: "What this shows about God", says: "God puts His own life in His people and is seen through them; table of individual and church for each image."}
word_budget: 4400
word_budget_reason: "The author asked (2026-10-22) for a paragraph on whether 'thrown out' and lampstand removal touch salvation; it took the study to 4,004 counted words. Raised to 4,400 on 2026-10-27 when the author asked for 'Salt kept in the earth' (salt as preservation, read with Sodom and the restrainer), taking it to about 4,290."

stages:
  scoping:
    done: true
    notes: "Author approved thesis and outline 2026-10-22. No primary sibling on Matthew 5:13-16 or 2 Corinthians 2:14-16. Placement christian-life/ (practical theology); israel-and-church/ was considered, but the study is mainly about the believer's life before the world."
  exegesis:
    historical_context:
      done: true
      notes: "Sermon on the Mount near Capernaum, to disciples with the crowds listening (Matthew 5:1; 7:28). Galilean oil lamps were small, set on a stand; μόδιος a grain measure (~8.75 litres; LSB fn 'peck-measure'). Salt: preservative, seasoning, required on offerings (Leviticus 2:13; Ezekiel 43:24), 'covenant of salt' for permanence (Numbers 18:19; 2 Chronicles 13:5), Elisha's healing of Jericho's spring (2 Kings 2:19-22). Ancient salt from the Dead Sea area carried impurities and could leach (Cultural Backgrounds note). 2 Corinthians 2:14: the Roman triumph, the only other NT use of θριαμβεύω being Colossians 2:15; incense in the streets 'taken by some' (ESV SB note on 2:15-16a; corrected in review 2026-10-22, NIV BT and Cultural Backgrounds say nothing of incense on the route), and euōdia/osmē is the LXX sacrifice phrase (ESV SB)."
    literary_context:
      done: true
      notes: "Matthew 5:13-16 follows directly on 5:10-12 (persecuted like the prophets) and leads into 5:17-20 (the righteousness that exceeds the scribes'). Good works (5:16) are then defined by 5:21-7:12. 2 Corinthians 2:14-17 opens Paul's defence of his ministry (2:14-7:4); 'we' is first Paul and his co-workers (2:17), and Ephesians 5:2 and Philippians 4:18 carry the aroma language to all believers and a church's gift."
    content_word_studies:
      done: true
      notes: "Counts verified via bible_concordance on macula-greek-sblgnt, 2026-10-22."
      terms:
        - {word: "ἅλας", language: greek, transliteration: "halas", strongs_id: "G217", gloss: "salt", notes: "7 occurrences in 4 passages: Matthew 5:13 (x2); Mark 9:50 (x2); Luke 14:34 (x2); Colossians 4:6."}
        - {word: "μωραίνω", language: greek, transliteration: "mōrainō", strongs_id: "G3471", gloss: "become foolish / tasteless", notes: "4 NT: Matthew 5:13; Luke 14:34 (salt); Romans 1:22 'became fools'; 1 Corinthians 1:20 'made foolish'."}
        - {word: "ἀρτύω", language: greek, transliteration: "artyō", strongs_id: "G741", gloss: "season", notes: "3 NT: Mark 9:50; Luke 14:34; Colossians 4:6 - ties Paul's speech 'seasoned with salt' to the salt sayings."}
        - {word: "מֶלַח", language: hebrew, transliteration: "melach", strongs_id: "H4417", gloss: "salt", notes: "Leviticus 2:13 'salt of the covenant'; Numbers 18:19 'covenant of salt forever'."}
        - {word: "φῶς", language: greek, transliteration: "phōs", strongs_id: "G5457", gloss: "light", notes: "Matthew 5:14, 16; John 8:12; 9:5."}
        - {word: "λύχνος", language: greek, transliteration: "lychnos", strongs_id: "G3088", gloss: "lamp", notes: "Matthew 5:15."}
        - {word: "λυχνία", language: greek, transliteration: "lychnia", strongs_id: "G3087", gloss: "lampstand", notes: "12 occurrences in 11 verses: Matthew 5:15; Mark 4:21; Luke 8:16; 11:33; Hebrews 9:2; Revelation 1:12, 13, 20 (x2); 2:1, 5; 11:4."}
        - {word: "μόδιος", language: greek, transliteration: "modios", strongs_id: "G3426", gloss: "grain measure, basket", notes: "3 NT, all the lamp saying: Matthew 5:15; Mark 4:21; Luke 11:33."}
        - {word: "φωστήρ", language: greek, transliteration: "phōstēr", strongs_id: "G5458", gloss: "light, luminary", notes: "2 NT: Philippians 2:15; Revelation 21:11. LXX Genesis 1:14 for the lights of the sky."}
        - {word: "εὐωδία", language: greek, transliteration: "euōdia", strongs_id: "G2175", gloss: "fragrance, pleasing aroma", notes: "3 NT: 2 Corinthians 2:15; Ephesians 5:2; Philippians 4:18. LXX ὀσμὴ εὐωδίας for רֵיחַ נִיחֹחַ (Genesis 8:21; Ezekiel 20:41)."}
        - {word: "ὀσμή", language: greek, transliteration: "osmē", strongs_id: "G3744", gloss: "smell, aroma", notes: "6 NT in 5 verses: John 12:3; 2 Corinthians 2:14, 16 (x2); Ephesians 5:2; Philippians 4:18."}
        - {word: "θριαμβεύω", language: greek, transliteration: "thriambeuō", strongs_id: "G2358", gloss: "lead in a triumphal procession", notes: "2 NT: 2 Corinthians 2:14; Colossians 2:15."}
        - {word: "רֵיחַ נִיחֹחַ", language: hebrew, transliteration: "reach nichoach", strongs_id: "H7381; H5207", gloss: "a soothing, pleasing aroma", notes: "Genesis 8:21; Ezekiel 20:41 (God accepts His people 'as a pleasing aroma')."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Salt-as-preservative and clay lamps are the cultural vehicle; the identity statement and the purpose clause (Matthew 5:16) carry over. The triumph image is Roman; the sacrifice image is Israel's and Paul extends it to all believers in Ephesians 5:2."
    theological_principle:
      done: true
      notes: "God puts His own light and fragrance in His people, individually and together, and is seen in their good works; a people that stops being what He made it is set aside from its use (salt thrown out; lampstand removed). Consistent with statement-of-faith; no intersection with its Israel/church or eschatology positions. Isaiah 49:6 is applied by Paul to his mission (Acts 13:47) without cancelling Isaiah 60's promise to Zion; stated that way to keep Israel and church distinct."
    application_draft:
      done: true
      notes: "In the Be Transformed and the closing section."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Mark 9:49-50", relation: "salt saying with 'be at peace with one another' - corporate"}
      - {ref: "Luke 14:34-35", relation: "salt saying after counting the cost of discipleship"}
      - {ref: "Colossians 4:6", relation: "speech seasoned with salt; same verb ἀρτύω"}
      - {ref: "Mark 4:21; Luke 8:16; 11:33", relation: "lamp on a stand parallels"}
      - {ref: "Revelation 1:20; 2:5", relation: "churches as lampstands; removal"}
      - {ref: "Philippians 2:15", relation: "shine as lights in the world, from Deuteronomy 32:5 LXX wording"}
      - {ref: "1 Peter 2:12", relation: "see your good deeds and glorify God - echoes Matthew 5:16"}
      - {ref: "Ezekiel 20:41", relation: "God accepts His people as a pleasing aroma"}
      - {ref: "Ephesians 5:2; Philippians 4:18", relation: "εὐωδία of Christ's sacrifice and a church's gift"}
    translations_compared: ["ESV", "WEB", "NA28/SBLGNT", "LSB footnotes", "CSB footnote"]
    divergences_noted: "Matthew 5:13 ἐν τίνι ἁλισθήσεται: ESV 'how shall its saltiness be restored'; WEB 'with what will it be salted'; CSB footnote 'Or how can the earth be salted?'. LSB footnotes 'peck-measure' (5:15) and 'mountain' (5:14)."
  drafting:
    done: true
    file: "docs/content/christian-life/salt-light-and-aroma.md"
