# Backlog 10.1 "Know the truth" (docs/content/about/backlog.md). Author's notes: what is truth
# (Hebrew and Greek words); there is truth, expressed in the OT, the NT and by Jesus; objective truth
# can be known; truth sets you free from lies and confusion; the devil keeps people unaware of the
# truth and deceives those who do not hold fast to it. Sibling: jesus/the-way.md treats John 14:6.


