# Written before drafting (Phase 7). The thesis becomes the page's "In one sentence:" line; the
# outline is the mind map, and becomes the page's Study outline when the study needs one.
thesis: >-
  Truth in Scripture is God's own firmness: He cannot lie, His word is truth, and in His Son Jesus truth took flesh. So truth is there to be known, you come to know it by abiding in Jesus' word, and it sets you free from sin and from the devil, the father of lies, whose first move was to make God's word doubtful.
outline:
  - section: "Opening"
    says: "Pilate asks 'What is truth?' (John 18:38) of the one who is truth."
  - section: "What the Bible means by truth"
    says: "emet (root aman, firmness; 127x) -- Ex 34:6 chesed ve-emet, Ps 31:5 El emet, Isa 65:16 the God of amen, Rev 3:14 the Amen; aletheia 109x NT, 25 in John, 9 in 1 John."
  - section: "Where truth comes from"
    says: "God who cannot lie (Heb 6:18); His word (Ps 119:160; John 17:17); His Son, full of grace and truth (John 1:14, 17; 14:6 -> the-way.md); His Spirit (John 16:13)."
  - section: "Truth can be known"
    says: "John 8:31-32: abide, then know; Luke 1:4 certainty; 1 John 2:21; 5:20. 'Objective' is our word -- the texts place truth outside us, in God's word and a Person, and say it is known."
  - section: "What the truth frees you from"
    says: "John 8:33-36 -- slavery to sin; the Son sets free; Eph 4:14-15 no longer tossed by every wind."
  - section: "The father of lies"
    says: "John 8:44; Gen 3:1, 4; 2 Cor 11:3, 14; 2 Cor 4:4; Rev 12:9; 2 Thess 2:10 (refused to love the truth, end-times setting marked); Rom 1:25."
  - section: "Holding fast to the truth"
    says: "John 8:47; Eph 6:14 belt of truth; 1 Tim 3:15; 1 John 4:6; 2 Tim 3:7 as the warning."

