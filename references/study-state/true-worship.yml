      - {ref: "Matthew 4:10 <- Deuteronomy 6:13", relation: "Matthew προσκυνήσεις where MT 'fear' and Brenton LXX φοβηθήσῃ; μόνῳ ('only') matches the LXX."}
    translations_compared: ["ESV", "LXX (Brenton)", "SBLGNT", "MT (WLC)"]
    divergences_noted: "Deut 32:43: MT shorter than LXX and 4Q44."
  drafting: {done: true, file: "docs/content/christian-life/true-worship.md"}
  review: {done: true, validated: true}

