  - "Sunday / the Lord's day: Acts 20:7 and 1 Cor 16:2 record practice; Revelation 1:10. Marked as recorded practice."
  - "Fork candidate: music in worship (Psalms, Col 3:16, Eph 5:19)."
resources_consulted:
  - {type: commentary, title: "ESV Study Bible", author: "Crossway", note: "Heb 1:6 note confirmed: only God is worthy of worship, so the angels' worship of the Son shows His deity; cites Deut 32:43 LXX or Ps 97:7. Rev 19:9-10 note confirmed John's double rebuke as 'dramatic confirmation of the deity of Jesus'. Rom 12:1 note contributed the broad (whole life) and narrow (acts of praise) senses of worship. John 4:24 note: God is spirit, so worship is not confined to one place."}
