genre: [topical, epistle, law, prophets, psalm]

thesis: "Idolatry is giving a created thing the trust and service that belong to God; in its plainest form it is a made god, whose worship goes to demons, and in the form Paul names in the church it is greed, money trusted in God's place, while pride is the self-sufficiency that opens the door to both, and God answers every one of them with a jealous love and the call back to His Son Jesus Christ, the true God."
# Revised 2026-10-22 at the author's correction: demons are tied in Scripture to sacrifice/worship
# offered to a god (Lev 17:7; Deut 32:17; Ps 106:37; 1 Cor 10:20; Rev 9:20), never to covetousness
# or pride. Pride is a distinct sin and the door (Deut 8:12-19; 32:15-17), linked to pride.md.
outline:
  - {section: "What idolatry is", says: "Trust, worship and service given to a created thing (Exod 20:5; Isa 44:17; Jer 17:5-7; Rom 1:25)."}
  - {section: "Made to worship", says: "Added 2026-10-22 at the author's request. Isa 43:7; Col 1:16; Rev 4:11 (made for His glory); Rom 1:21, 25 (withheld worship goes to the creature); Jer 2:13 (the thirst stays, so they dig); Acts 17:16-27. The 'built-in need' step is marked as the church's reading, with Augustine Confessions 1.1 paraphrased (not in the local patristics corpus, so not quoted). Turning back now ends on John 4:23 and links woman-at-well; the full worship study is backlog 10.6."}
  - {section: "The made god is nothing", says: "Isa 44; Jer 10:5; Ps 115:8 you become like it; the exchange of glory (Ps 106:20; Jer 2:11-13; Rom 1:23 from LXX Ps 105:20)."}
  - {section: "The worship goes to demons", says: "1 Cor 8:4 and 10:19-22 both Paul's; quotes LXX Deut 32:17 and 32:21; shedim 2x; Lev 17:7; table of texts; demons only where a god is worshipped; general demonic influence (Eph 2:2; Jas 3:15; 4:7) kept distinct."}
  - {section: "Greed, the idolatry Paul names", says: "Col 3:5 grammar; Eph 5:5; Job 31:24-28; Hab 1:11, 16; Matt 6:24 douleuo = 1 Thess 1:9; Luke 12:15-21; 1 Tim 6:17."}
  - {section: "Pride, the door to the idol", says: "Deut 8:12-19 and 32:15-17 order; 1 Sam 15:23 is a comparison; Ezek 28:2; 2 Thess 2:4; 2 Tim 3:2-4; 'idolatry of self' marked as a teaching phrase; links pride.md."}
  - {section: "The idol in the heart", says: "Ezek 14:1-8; gillulim 48x/39 in Ezekiel, likely 'dung'; amulet suggestion marked; God lays hold of the heart."}
  - {section: "Why God is jealous", says: "Exod 20:5-6; Deut 32:16; Lev 17:7; Jas 4:4; covenant husband."}
  - {section: "Three questions for your heart", says: "Trust (Isa 44:17; Job 31:24), serve (Matt 6:24), could not give up (Luke 12:20)."}
  - {section: "Turning back", says: "Ezek 14:6; 1 Thess 1:9-10; Col 3:1-5; 1 John 5:20-21."}
