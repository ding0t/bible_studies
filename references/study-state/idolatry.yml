      - {ref: "Romans 1:23 <- Psalm 106:20 (LXX 105:20)", relation: "shared ἀλλάσσω + τὴν δόξαν + ἐν ὁμοιώματι; tool silent"}
    translations_compared: ["ESV", "WEB", "LXX (Brenton Greek)", "SBLGNT"]
    divergences_noted: "ESV 1 Cor 8:4 'an idol has no real existence' (paraphrastic) vs WEB 'no idol is anything in the world' (closer to οὐδὲν εἴδωλον ἐν κόσμῳ). ESV Lev 17:7 'goat demons' vs KJV 'devils'. Col 3:5 ESV 'what is earthly in you' vs WEB/LSB footnote 'members which are on the earth' (τὰ μέλη)."
