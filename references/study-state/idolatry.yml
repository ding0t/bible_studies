stages:
  scoping:
    done: true
    notes: "Brief is the stub's own question, 'Is idolatry the worship of demons?', plus its heart theme (Col 3:5, Ezek 14:3). No backlog entry (backlog 0.8 lists it only as a stub needing a develop pass). URL is published, so the file stays at sin/idolatry.md. The stub answers the question 'no'; 1 Cor 10:20 answers 'yes' by quoting Deut 32:17, so the draft corrects the stub."
  exegesis:
    historical_context:
      done: true
      notes: "Corinth: meat sold after temple sacrifice, meals in temple dining rooms (1 Cor 8:10). Ezekiel 14: elders of the exile at Tel-abib consulting the prophet (cf. 8:1; 20:1). Deut 32: Song of Moses, covenant witness before entry. Colossae: Gentile converts (1:21), vice list 3:5-9."
    literary_context:
      done: true
      notes: "1 Cor 8-10 is one argument: 8:4 concedes 'an idol has no real existence'; 10:1-13 the wilderness warning; 10:14 'flee from idolatry'; 10:19-20 denies the idol is anything, then says the sacrifice goes to demons; 10:22 'provoke the Lord to jealousy' = Deut 32:21. So both statements are Paul's, two chapters apart, in one argument. Col 3:5 follows 3:1-4 (raised with Christ, life hidden with Him): the 'therefore' grounds the putting-to-death in union with Christ."
    content_word_studies:
      done: true
      notes: "Counts verified with bible_concordance on macula-greek-sblgnt / macula-hebrew-wlc (an unrestricted count double-counts across morphology works: H1544 95 -> 48; G1497 102 -> 11)."
      terms:
        - {word: "εἴδωλον", language: greek, transliteration: "eidōlon", strongs_id: "G1497", gloss: "idol, image", notes: "11x SBLGNT. 1 Cor 8:4 οὐδὲν εἴδωλον ἐν κόσμῳ."}
        - {word: "εἰδωλολατρία", language: greek, transliteration: "eidōlolatria", strongs_id: "G1495", gloss: "idolatry", notes: "4x: 1 Cor 10:14; Gal 5:20; Col 3:5; 1 Pet 4:3."}
        - {word: "εἰδωλολάτρης", language: greek, transliteration: "eidōlolatrēs", strongs_id: "G1496", gloss: "idolater", notes: "7x: 1 Cor 5:10, 11; 6:9; 10:7; Eph 5:5; Rev 21:8; 22:15."}
        - {word: "πλεονεξία", language: greek, transliteration: "pleonexia", strongs_id: "G4124", gloss: "covetousness, greed, wanting more", notes: "10x SBLGNT. Col 3:5 τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία: the article and ἥτις single out covetousness as the one Paul names idolatry."}
        - {word: "δαιμόνιον", language: greek, transliteration: "daimonion", strongs_id: "G1140", gloss: "demon", notes: "1 Cor 10:20-21 four times."}
        - {word: "κοινωνός", language: greek, transliteration: "koinōnos", strongs_id: "G2844", gloss: "partner, participant", notes: "1 Cor 10:18, 20: participants in the altar / with demons."}
        - {word: "שֵׁד", language: hebrew, transliteration: "shed", strongs_id: "H7700", gloss: "demon", notes: "2x only: Deut 32:17; Ps 106:37 (verified). LXX δαιμόνια both."}
        - {word: "שָׂעִיר", language: hebrew, transliteration: "saʿir", strongs_id: "H8163", gloss: "hairy one, goat; goat demon", notes: "Lev 17:7 'goat demons, after whom they whore' (זָנָה); also 2 Chr 11:15."}
        - {word: "גִּלּוּלִים", language: hebrew, transliteration: "gillulim", strongs_id: "H1544", gloss: "idols (probably 'dung pellets')", notes: "48x WLC, 39 in Ezekiel. Derivation from gll/gel 'dung' is the common view (NLT footnote 'round things, probably alludes to dung'); mark as likely, not certain."}
        - {word: "אֱלִילִים", language: hebrew, transliteration: "ʾelilim", strongs_id: "H457", gloss: "worthless things, idols", notes: "20x WLC. Ps 96:5 pun on ʾelohim — already treated in those-called-gods.md; cite briefly."}
        - {word: "מוּר", language: hebrew, transliteration: "mur", strongs_id: "H4171", gloss: "exchange", notes: "Ps 106:20; Jer 2:11 (twice). LXX Ps 105:20 ἠλλάξαντο τὴν δόξαν αὐτῶν ἐν ὁμοιώματι μόσχου -> Rom 1:23 ἤλλαξαν τὴν δόξαν ... ἐν ὁμοιώματι. bible_trace silent (middle vs active form); the shared phrase is visible in the Greek, cite directly."}
        - {word: "הֶעֱלוּ ... עַל לִבָּם", language: hebrew, transliteration: "heʿelu ... ʿal libbam", strongs_id: "H5927", gloss: "brought up onto their heart", notes: "Ezek 14:3, 4, 7. Hiphil of ʿalah. Cultural Backgrounds suggests amulets worn on the chest; possible, but 14:5 'lay hold of the hearts' and 14:7 'separates himself from me' keep the referent inward."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Temple meat is Corinth's occasion; the principle (no fellowship at two tables; the worship goes somewhere) transcends it. Carved images are rare in a Western reader's life; covetousness (Col 3:5) and trust (Ps 115:8; Isa 44:17 'deliver me') are not."
    theological_principle:
      done: true
      notes: "God made the heart for Himself and loves His people with an exclusive, covenant love; idolatry is the heart's exchange of that God for a made thing it can control, and the exchange is never neutral because demons receive the worship. The remedy is a turning to the living God through His Son (1 Thess 1:9-10; 1 John 5:20-21)."
    application_draft:
      done: false
      notes: ""
