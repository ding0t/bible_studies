open_questions:
  - "NIV/NKJV Cultural Backgrounds note on Deut 32:17 argues the shedim 'would not have been considered demons' (Akkadian shedu / Deir Alla shdyn). Paul's quotation of the LXX at 1 Cor 10:20 reads them as demons, as do Ps 106:37 and the ESV Study Bible. Per the ancient-witness-over-modern-gloss rule, Paul's reading carries the argument; give the background note one marked sentence."
  - "gillulim etymology ('dung pellets') is likely, not certain; mark it."
  - "Fork candidate: food offered to idols and the weak conscience (1 Cor 8; 10:23-33; Rom 14) — a Christian-liberty study, outside this thesis."
  - "Fork candidate: Revelation's idolatry (13:14-15 the image of the beast; 9:20) — last-things material."
