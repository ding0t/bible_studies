  changes:
    - "Study, do, teach: added '### *Meforash*: \"clearly\", or \"translating\"' over the Nehemiah 8:8 paragraph, so the contested reading is findable (rule 5)."
    - "Who should teach (300 words, three ideas): added '### James 3:1: a greater judgment' and '### Apollos: teaching under correction'; the every-believer paragraph stays as the section's opening. Makes findable what the description promises (James 3:1 for a teacher who is not a pastor)."
  verified: "diff against a pre-pass copy shows only the three heading lines (and blank lines) added; no prose line removed or changed. No directional references or in-page anchors in the file; no inbound anchor links."
