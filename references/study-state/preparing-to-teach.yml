last_updated: 2026-10-19
primary_passage: "Ezra 7:10"
genre: "topical (OT narrative, pastoral epistles)"
origin: >
  Merges the author's Sermon Principles (sermons/sermon-howto.md, seven one-line principles, kept as
  the section's structure) and On Teaching (sermons/on-teaching.md, one external link on lay
  accountability), both drafted 2026-10-19 for rewrite. Redirects from both old paths.
thesis: >
  Ezra studied God's Law, did it, and then taught it, in that order; a teacher in the church follows
  the same order, teaches plainly from the verses, points to Christ, and answers to God for it.
