  validate: "No errors on this file; only the three expected missing-provenance warnings."

author_rulings_2026-10-19:
  - "Principle 4: 'every passage points to Christ' kept, marked as the position the page holds (read first for Christ, then for what it asks of you), grounded on Luke 24:27."
  - "Ezra relabelled 'Parallel' (Scripture draws no type)."
  - "1 Peter 3:15 dropped from principle 5 (context is answering outsiders)."
  - "Apollos: noted the manner (together, private, respectful) and pointed the women-teaching question to submission-in-context#the-two-readings, unsettled here."
  - "1 Timothy 4:16 added to 'Study, do, teach'."
  - "Section renamed sermons/ -> teaching/ before first publish."
