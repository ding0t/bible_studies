review_2026-10-19:
  scope: "review-bible-study, all eight phases, on the merged draft (2,305 words before fixes; budget 4,000)."
  verified: >
    All 30 ESV quotations re-queried in full against study-notes.db (verbatim, references and labels
    correct). Hebrew forms and Strong's numbers of Ezra 7:10 and Nehemiah 8:8 against WLC/MACULA; Greek
    meizon krima and orthotomounta against SBLGNT; G3718 concordance (NT once, LXX Prov 3:6 and 11:5);
    LSB footnotes at Ezra 7:10 and Neh 8:8. Commentary cross-check: ESV Study Bible and NIV Biblical
    Theology Study Bible on Ezra 7:10 and Neh 8:8 confirm the study-do-teach reading and the
    translation option. Statement of faith: consistent (Scripture's authority, Acts 17:11). All four
    internal links resolve to published pages.
  fixed:
    - "Critical: 'The Septuagint uses it twice, of God making a path straight' was false. LXX Prov 11:5 has righteousness as subject; LXX Prov 3:6 has 'know her' (wisdom) so that she cuts the ways straight, and the ESV quoted translates the Hebrew. Rewritten to say so."
    - "Acts 18: 'He received it' is not in the text; replaced with what 18:27 says (the brothers wrote ahead to welcome him)."
    - "bible_references: added Proverbs 11:5, which the prose cites."
    - "Linked sibling scripture/scribes-and-pharisees.md (cites Ezra 7:6-11 and Neh 8:8, treats meforash), previously unlinked."
  open_for_author:
    - "Principle 4 and the prayer say every passage shows Jesus; Luke 24:27 supports 'all the Scriptures concern Him', and 'every passage' is an extension. Mark as a hermeneutical position or narrow it."
    - "Types & Prophecy calls Ezra a 'Picture' of Christ opening the Scriptures; Scripture does not draw the type. Consider relabelling as a parallel."
    - "1 Peter 3:15 is about answering outsiders who ask for your hope, not correcting error; its use in principle 5 is a stretch."
    - "'Any brother or sister who can show him the text' (Acts 18:26) states what Priscilla did; confirm the author is content that it does not read as taking a side on women teaching (1 Timothy 2:12), which the page does not argue."
    - "Lead: 1 Timothy 4:16 ('watch on yourself and on the teaching'), cited by the ESV Study Bible on Ezra 7:10, supports the do-before-teach order directly."
    - "Optional: LSB footnotes James 3:1 'Or greater condemnation'."
  validate: "No errors on this file; only the three expected missing-provenance warnings."
