stages:
  scoping:
    done: true
    notes: >-
      Author's brief (2026-10-14): salvation section, "saved as one escaping the flames" applied to
      Christians who profess faith but are limited in understanding and action; those who say they
      are Christians but don't live like it; those whose beliefs are shaped more by the world than
      Scripture; and Jude's "snatched from the fire" as encouraging such believers back to the
      truth in love. Two passages, two different fires -- see exegesis notes.
  exegesis:
    historical_context:
      done: true
      notes: >-
        1 Corinthians: Paul from Ephesus, spring AD 53-55 (ESV SB intro; 1 Cor 16:8). A church
        divided by allegiance to leaders (1:10-12), importing the status culture of Greco-Roman
        "wisdom" (1:20; 3:18-20). Jude: letter to churches where false teachers had "crept in
        unnoticed" (Jude 4), perverting grace into sensuality; Jude 17-25 turns to the faithful's
        response.
    literary_context:
      done: true
      notes: >-
        1 Cor 3:10-15 sits inside 3:1-4:21 (Paul and Apollos as servants; stop boasting in men).
        3:1-4 calls the Corinthians brothers, infants in Christ, yet sarkinos/sarkikos, "walking
        according to man" (kata anthrōpon, 3:3) -- their divisions are the world's way of
        thinking. 3:5-9 field; 3:10-15 building, builders tested; 3:16-17 temple, the destroyer
        destroyed (a different and worse case than 3:15); 3:18-20 the wisdom of this world is folly.
        So the "worldly-minded believer" is in the immediate context, but 3:15's subject is the
        builder whose WORK (what he built into the church) burns. Primary referent is teachers
        (Paul, Apollos, "someone else is building", 3:10); ESV SB note extends to anyone who
        contributes to building up the church (12:7; 14:12). Statement of faith extends further, to
        each believer's own life. Mark that step as application.
        Jude 22-23 sits after 20-21 (keep yourselves) and before the doxology (24-25, "him who is
        able to keep you"). Jude 9 has Michael say "The Lord rebuke you" -- Zech 3:2's first half.
        Jude 23's "out of the fire" and "garment stained" are Zech 3:2b-4. Jude reads Zechariah 3
        twice.
    content_word_studies:
      done: true
      notes: "Counts verified by bible_concordance on macula-greek-sblgnt, 2026-10-14."
      terms:
        - word: "σαρκίνοις"
          language: greek
          transliteration: "sarkinos"
          strongs_id: "G4560"
          gloss: "made of flesh, fleshly"
          notes: "1 Cor 3:1. 4 NT occurrences (1 Cor 3:1; 2 Cor 3:3; Heb 7:16; Rom 7:14)."
        - word: "σαρκικοί"
          language: greek
          transliteration: "sarkikos"
          strongs_id: "G4559"
          gloss: "fleshly, characterised by the flesh"
          notes: "1 Cor 3:3 twice. Addressed to 'brothers', 'infants in Christ' (3:1)."
        - word: "ψυχικός"
          language: greek
          transliteration: "psychikos"
          strongs_id: "G5591"
          gloss: "natural, unspiritual"
          notes: >-
            6 occurrences in 4 verses: 1 Cor 2:14; 15:44 (x2); 15:46; James 3:15; Jude 19. Paul
            uses it of the person who does not accept the things of the Spirit (2:14) and then
            switches to sarkinos for the Corinthian brothers (3:1). Jude 19 uses psychikos of the
            false teachers, "devoid of the Spirit". The text itself distinguishes the worldly-acting
            believer from the person without the Spirit.
        - word: "ζημιωθήσεται"
          language: greek
          transliteration: "zēmioō"
          strongs_id: "G2210"
          gloss: "suffer loss, forfeit"
          notes: "6 NT occurrences incl. Matt 16:26 / Mark 8:36 / Luke 9:25 (forfeit his soul) and Phil 3:8 (Paul's loss of all things). CSB AF footnote: 'Or suffer'."
        - word: "ὡς διὰ πυρός"
          language: greek
          transliteration: "hōs dia pyros"
          strongs_id: "G4442"
          gloss: "as through fire"
          notes: >-
            hōs = the comparison; the man is not refined by the fire, he escapes it like someone
            out of a burning building. LXX Amos 4:11 'hōs dalos exespasmenos ek pyros' shares hōs +
            pyros: possible proverbial background, mark as likely, not demonstrated (verb and
            preposition differ).
        - word: "ἁρπάζοντες"
          language: greek
          transliteration: "harpazō"
          strongs_id: "G726"
          gloss: "seize, snatch"
          notes: "14 NT occurrences; John 10:28-29 (no one will snatch them out of my hand), 1 Thess 4:17."
        - word: "διακρινομένους"
          language: greek
          transliteration: "diakrinomai"
          strongs_id: "G1252"
          gloss: "doubt, waver; dispute"
          notes: "Twice in Jude: 9 (Michael 'disputing') and 22 ('those who doubt'). Contested whether 22 means doubters or disputers."
        - word: "אוּד מֻצָּל מֵאֵשׁ"
          language: hebrew
          transliteration: "ud mutsal me'esh"
          strongs_id: "H181"
          gloss: "a firebrand snatched from the fire"
          notes: "Zech 3:2 (and Amos 4:11 'from the burning', שְׂרֵפָה). LXX Zech 3:2: hōs dalos exespasmenos ek pyros. Jude 23 shares 'ek pyros'."
