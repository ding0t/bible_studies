genre: ["epistle", "topical"]

thesis: "A believer who builds with the world's wisdom is still saved, but only as one escaping through the flames with nothing in his hands; and God, who plucked Joshua from the fire and clothed him clean, sends you to pull drifting brothers and sisters back in mercy."
outline:
  - {section: "Two verses, two fires", says: "1 Cor 3:15's fire tests a believer's work; Jude 23's fire is judgment closing on a person. Same people, two sides."}
  - {section: "Brothers who think like the world", says: "Corinth imported the world's wisdom; Paul separates psychikos (no Spirit) from sarkikos (brothers living by the flesh) and keeps teaching them."}
  - {section: "The builder and the Day", says: "Builders are first those who build the church; the Day's fire reveals; loss of reward, the builder himself saved."}
  - {section: "What 'saved as through fire' does not promise", says: "3:17, 6:9-11, 5:5/5:11 limit it; the carnal-Christian category marked contested with both cases."}
  - {section: "Snatching them out of the fire", says: "Jude 22-23's groups (two or three, textually contested): mercy, rescue, mercy with fear; link when-love-grows-cold for Gal 6:1/James 5."}
  - {section: "A brand plucked from the fire", says: "Jude reads Zech 3 twice; God rescues, silences the accuser and clothes Joshua clean, pointing to the Branch and the single day; the rescuer was rescued first."}
