review_2026-10-01:
  reviewer: "anthropic/claude-opus-5.5 (review-bible-study), at the author's direction via the backlog item"
  checked: >-
    Every quotation re-queried against study-notes.db (ESV, NIV, LSB, CSB, NLT) or bible-text.db
    (KJV, SBLGNT, Tischendorf, Byzantine 2013, TR); Mark 9:29, Matt 17:21, Acts 10:30, 1 Cor 7:5
    across the Greek texts; concordance counts for tsum, tsom, nesteuo, nesteia, ochyroma; TWOT;
    translator footnotes for Mark 9:29, Matt 9:15, 17:20-21, Acts 10:30; commentary cross-check
    (ESVSB, NIV BTSB, NIV CBSB); Mishnah via sefaria.py (Kulp CC-BY); Didache Greek from
    $BIBLE_MEDIA_ROOT patristics; style guide; statement of faith; validator.
  findings_fixed:
    critical:
      - "Joel 2:12-13 and Zechariah 7:5 quoted without a translation label, and neither matched the ESV (Joel: 'with fasting, weeping, and mourning ... rend your heart'; Zech: 'was it actually for Me')."
      - "Leviticus 16:29 'deny yourselves' is the NIV's rendering, presented in a paragraph that otherwise followed the ESV; the Hebrew gloss is now given with both."
      - "tsum glossed 'to cover the mouth' -- no lexical support (TWOT 1890 'abstain from food')."
      - "'Spiritual warfare' given as a Church Age purpose of fasting on the strength of the Mark 9:29 variant, and 'Break spiritual strongholds' listed in When to Fast; Jesus' wilderness fast said to 'prepare Him for spiritual warfare'. No text teaches either (author's backlog item). Rewritten."
    moderate:
      - "'over 50 times' for tsum: verb 21 + noun 26 = 47."
      - "Ezra 8:21-23 cited for 'seeking guidance for decisions'; the text is a fast for a safe journey. Guidance now rests on Judges 20:26-28 and Acts 13:2-3; 14:23."
      - "Zechariah 8:19 listed under 'questioning motives'; it promises fasts turned to feasts."
      - "Elijah's 'fast' (1 Kings 19:8): the text says he went in the strength of the angel's food."
      - "'Daniel fast - vegetables and water' conflated Daniel 1:12 (not a fast) with Daniel 10:3."
      - "2 Corinthians 6:5 and 11:27 presented as Paul's fasting; ESV renders 'hunger' / 'often without food' in a hardship list."
      - "Jewish practice paragraph (sunrise-to-sunset, 25-hour fast, synagogue services) unsourced; replaced with m. Yoma 8:1, m. Ta'anit 1:6, Didache 8.1, NIV CBSB on Luke 18:12."
      - "No primary_passage / bible_references: study was invisible to commentary_index.py and review_gaps."
      - "Context coverage: cultural-vs-transcultural never drawn; no hook, no Key Takeaways, no discussion questions, no prayer; outline-shaped bullets throughout."
    minor:
      - "Tags: 'communion' collides with its Lord's Supper use in last-supper-four-cups.md; 'devotion' used nowhere else; 'faith' dropped. Now fasting, prayer, humility, repentance, book tags, method/lang facets."
      - "Description 'Understanding fasting' said nothing."
  commentary_cross_check:
    - "Isaiah 58:3-12 central claim (fasting as leverage refused; true fast = justice): NIV BTSB confirms ('self-affliction in order to get favors from God')."
    - "Mark 9:29 (the failure is about the disciples' relationship to Jesus; prayer realigns): NIV BTSB and ESVSB confirm; neither mentions fasting."
    - "Leviticus 16:29 afflict = self-denial connected with fasting (Ps 35:13; Isa 58:3; Ezra 8:21): ESVSB confirms -- same three texts the study uses."
    - "Zechariah 8:19 dispensational (future, Judah) reading: ESVSB silent on timing ('the days ahead'); both readings marked in the prose."
  review_gaps: "Not runnable before the fix (no frontmatter passages); frontmatter now added."
  cross_study: "humility.md (Colossians 2:18 fasting as false humility) consistent and linked. No sibling treats Mark 9:29."
  size: "Check 23 count 1,251 before, 3,905 after, budget 4,000."
  left_for_author:
    - "Zechariah 8:19 is given a dispensational reading marked as one reading among two; confirm you want it stated that way."
    - "The misuse section is the site's first worked 'commonly misquoted scripture' entry for fasting; the backlog list may want to link to #verses-often-misused-about-fasting."
    - "christian-life/index.md card still shows the old description; run references/build/section_index.py to refresh."
    - "Provenance fields not refreshed (run utils/refresh_frontmatter_provenance.py before committing)."
    - "Human-review tells (essay register in Key Takeaways/prayer, writing around the theology) need the author's read."

