# Fasting -- written 2026-01-24 with Sonnet 4.5 before the develop-bible-study skill existed, never
# reviewed until 2026-10-01. No research trail exists for its original drafting; the stages below
# record only what the 2026-10-01 review and rewrite actually did.
# Backlog: "Fix the fasting study -- When to fast 'Break spiritual strongholds' is reading like
# deliverance ministry -- needs a rewrite" (Priority 2); also listed under "commonly misquoted
# scripture".

slug: "fasting"
title: "Fasting"
status: published
target_path: "docs/content/christian-life/fasting.md"

primary_passage: "Matthew 6:16-18"
supporting_passages: ["Leviticus 16:29-31", "Isaiah 58:1-12", "Psalm 35:13", "Ezra 8:21-23",
  "1 Kings 21:27-29", "Daniel 10:2-14", "Joel 2:12-13", "Jonah 3:5-10", "2 Samuel 12:16-23",
  "Matthew 4:1-4", "Deuteronomy 8:2-3", "Matthew 9:14-15", "Acts 13:1-3", "Acts 14:23",
  "Mark 9:14-29", "Matthew 17:14-21", "2 Corinthians 10:3-5", "Zechariah 7:5", "Zechariah 8:19"]
genre: [topical, law, prophets, gospel, acts]

thesis: >-
  Fasting is humbling yourself before God, going without food to seek Him in repentance, grief,
  need and decision; it has no power of its own, because God hears the humble out of His own mercy,
  and Christians fast in the days while Jesus, the Bridegroom, is away.
outline:
  - section: "What the words mean"
    says: "tsum/tsom (21/26x); the Law's own term is anah + nefesh 'afflict/humble yourselves' (Lev 16:29), paralleled with fasting at Isa 58:3, Ps 35:13, Ezra 8:21, and God/angel naming fasts as humbling (1 Kgs 21:29; Dan 10:12). nesteuo 20x, nesteia 5x; 'the Fast' = Day of Atonement (Acts 27:9)."
  - section: "Fasting in the Old Testament"
    says: "One commanded fast (Lev 16). Occasions: repentance, grief, need, intercession, direction (Judg 20:26-28), meeting with God. Elijah's 40 days not called a fast. 'Who knows?' (2 Sam 12:22; Jonah 3:9): God is free and hears out of mercy (Joel 2:13)."
  - section: "The fast God chooses"
    says: "Isa 58:3-9: fasting while oppressing workers refused; the chosen fast frees the oppressed. Zech 7:5; Jer 14:10-12; m. Yoma 8:9."
  - section: "Jesus and fasting"
    says: "Matt 4:1-4 recapitulates Deut 8:2-3; the Word answered the devil, the fast showed dependence. Matt 6:16-18 in secret; Luke 18:12 the Pharisee. Matt 9:15 bridegroom (mourn/fast)."
  - section: "Fasting in the church"
    says: "Acts 13:2-3; 14:23 fasting before decisions/commissioning; Anna (Luke 2:37); Didache 1.3, 7.4, 8.1. Church Age: no commanded fast, Heb 9:12; bridegroom absent; Zech 8:19 dispensational reading marked against the general one."
  - section: "Verses often misused about fasting"
    says: "Mark 9:29 / Matt 17:21 variants (NA28/SBLGNT/Tisch vs Byz/TR), same addition at Acts 10:30 and 1 Cor 7:5; context = faith (Mark 9:19-24; Matt 17:20). Isa 58:6 yokes are social oppression. 2 Cor 10:4 ochyroma = arguments (10:5), hapax. Dan 10: heard on day one; text never links fast to the heavenly conflict. NT resisting the devil: James 4:7-10; 1 Pet 5:9."
  - section: "Practical application"
    says: "Cultural vs lasting; When to fast (seven occasions, each with texts); How to fast (Daniel fast correction, Dan 1:12 vs 10:3); cautions."
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: "christian-life/ (practical theology), category spiritual-disciplines like humility.md. Deliverance material kept to the misuse section, with a link to spiritual-beings/deliverance/deliverance-and-the-edge-of-sorcery.md rather than argued here."
  exegesis:
    historical_context:
      done: true
      notes: "Day of Atonement (Lev 16:29-31; 23:27-32); exilic fasts of 4th/5th/7th/10th months (ESVSB on Zech 8:19); Pharisaic Mon/Thu fasts (NIV CBSB on Luke 18:12; m. Ta'anit 1:6; Didache 8.1); Yom Kippur prohibitions m. Yoma 8:1 (Kulp, CC-BY). Isaiah 58 left undated in the prose (authorship/date contested; not needed for the argument)."
    literary_context:
      done: true
      notes: "Mark 9:14-29 read whole (9:19 faithless generation, 9:23-24 belief, 9:25 rebuke, 9:28-29); Matt 17:19-20 little faith; 2 Cor 10:1-11 Paul vs opponents (ESVSB); Dan 10:2-14 and 10:20; Isa 58:1-9 whole unit; Deut 8:2-3 behind Matt 4:4."
    content_word_studies:
      done: true
      notes: "Counts from macula-hebrew-wlc / macula-greek-sblgnt; TWOT via twot_lookup."
      terms:
        - {word: "צוּם", language: hebrew, transliteration: "tsum", strongs_id: "H6684", gloss: "to fast", notes: "21x; TWOT 1890 'abstain from food'. The old draft's 'to cover the mouth' has no lexical support and was removed."}
        - {word: "צוֹם", language: hebrew, transliteration: "tsom", strongs_id: "H6685", gloss: "a fast", notes: "26x. Old draft's 'over 50 times' was wrong (21+26 = 47)."}
        - {word: "עָנָה + נֶפֶשׁ", language: hebrew, transliteration: "anah nefesh", strongs_id: "H6031 + H5315", gloss: "afflict/humble oneself", notes: "Lev 16:29, 31; Isa 58:3, 5; Ps 35:13; hitpael of anah at Ezra 8:21 and Dan 10:12."}
        - {word: "νηστεύω", language: greek, transliteration: "nēsteuō", strongs_id: "G3522", gloss: "to fast", notes: "20x SBLGNT."}
        - {word: "νηστεία", language: greek, transliteration: "nēsteia", strongs_id: "G3521", gloss: "fasting", notes: "5x SBLGNT: Luke 2:37; Acts 14:23; 27:9; 2 Cor 6:5; 11:27. ESV renders 2 Cor 6:5 'hunger', 11:27 'often without food' -- involuntary hardship likely."}
        - {word: "ὀχύρωμα", language: greek, transliteration: "ochyrōma", strongs_id: "G3794", gloss: "stronghold", notes: "1x NT (2 Cor 10:4); 10:5 defines as arguments and lofty opinions."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Cultural: sackcloth/ashes, set weekdays, Yom Kippur halakhah. Lasting: humbling before God, repentance, secrecy, neighbour-love in the same act (Isa 58), trusting God's mercy for the outcome."
    theological_principle:
      done: true
      notes: "God hears the humble out of His own compassion (Joel 2:13; 1 Kgs 21:29; Dan 10:12); fasting has no leverage (2 Sam 12:22; Jonah 3:9). Church-age fasting answers to the Bridegroom's absence (Matt 9:15)."
  statement_of_faith:
    done: true
    notes: "Consistent with Justification (fasting not meritorious) and Reward for the believer (Matt 6:18 reward before the Father). The statement's Sanctification note -- discernment grows from knowing Christ more than from a study of counterfeits -- is why the misuse section argues each verse from its own context rather than cataloguing deliverance teaching. No conflict found."

