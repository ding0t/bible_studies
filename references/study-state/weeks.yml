thesis: >-
  The Feast of Weeks counted fifty days from the first sheaf to the first loaves of the wheat
  harvest, a day of joy shared with the poor and the stranger; fifty days after Jesus rose, on that
  very feast, the exalted Christ poured out the Holy Spirit and the harvest of the church began; so
  the Holy Spirit in you is God's firstfruits of everything He will finish.
outline:
  - {section: "The feast", says: "names, the count, the offerings, the joy that reached the outsider"}
  - {section: "Leavened loaves", says: "Leviticus 2:12 explains the leavened firstfruits; Jew/Gentile reading held as illustration"}
  - {section: "Weeks and Sinai", says: "the Sinai link is tradition (Jubilees, Talmud), Luke never states it"}
  - {section: "The day of Pentecost", says: "Acts 1-2, the fifty days, the beginning of the church"}
  - {section: "Firstfruits of the Spirit", says: "Romans 8:23 / Ephesians 1:14 -- the Spirit as pledge of the rest"}
