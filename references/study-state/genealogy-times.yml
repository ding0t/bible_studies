    New script: references/build/genealogy_chronology.py -- validates the age+after=total
    invariant across all 33 people (zero errors), then walks the heir_id chain from Adam (zadok 0)
    per named timeline_variant (now in index.json: mt, lxx, sp, harmonized_v1) and writes
