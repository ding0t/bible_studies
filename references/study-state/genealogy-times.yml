exodus_judges_gap_status:
  done: true
  notes: >
    Added as a new section in genealogy-times.md (2026-07-24), per user request to close this
    gap using genealogy as an anchor where possible. All Judges-cycle figures, 1 Sam 13:1's
    Saul lacuna, 1 Kings 6:1, the priestly line (1 Chr 6:35-38 cross-checked against Ezra 7:1-5,
    word-for-word identical), and the Davidic line (Ruth 4:18-22 + Numbers 1:7 for Nahshon)
    pulled directly from morphhb-wlc via sqlite3, not from memory or secondary tables.
    Findings: (1) summing every Judges figure sequentially gives 410 years for Judges proper,
    and comfortably over 480 total once wilderness/conquest/Eli/Saul/David/Solomon are added --
    a real, long-recognized problem ("the Judges chronology problem"), not a new discovery.
    (2) Judges 10:7-9 explicitly states the Philistine and Ammonite oppressions were
    simultaneous, not sequential -- direct textual warrant for regional/overlapping judgeships,
    not an invented harmonization. (3) The priestly genealogy (Aaron to Zadok, 10 generations)
    is broadly compatible with a ~400-480 year span (~40-48 yr/generation, high but plausible for
    a priestly succession). (4) The Davidic genealogy via Ruth (Nahshon, an Exodus-era figure
    per Numbers 1:7, to David) is only 5 generational gaps -- 80-96 yr/generation over the same
    span, not biologically plausible, strongly suggesting Ruth's list telescopes (skips names),
    the same phenomenon already documented for Matthew 1:17's genealogy elsewhere in this study.
    Conclusion drawn: 1 Kings 6:1's 480 years is plausible via judges-overlap (textually
    supported), while Ruth's genealogy almost certainly omits generations -- deliberately did
    NOT construct a single precise year-by-year overlap allocation, since that level of
    precision isn't recoverable from the text and would overclaim.
  known_deferred_items:
    - "No explicit verse gives Samuel's own number of years judging Israel before Saul's
       accession -- left as an unspecified gap in the reconstruction, not estimated."
    - "Acts 13:19-21's 'about 450 years' is genuinely ambiguous in the Greek as to whether it
       describes the pre-conquest period (Egypt+wilderness+conquest) or the Judges period's own
       duration -- not resolved here; only Acts 13:21's '40 years' for Saul was used (filling
       the 1 Sam 13:1 MT lacuna), the 450-year figure was deliberately not leaned on given the
       ambiguity."
    - "Exact synchronization of which judges overlap which, and by how many years, is not
       attempted -- only the existence and textual basis of overlap (Judges 10:7-9) is
       established, not a specific allocation that sums to exactly 480."

