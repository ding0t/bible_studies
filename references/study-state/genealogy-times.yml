    Headline computed results per variant (zadok year of the Flood): MT 1656, LXX 2242, SP 1307,
    harmonized_v1 1536. These match independently-published comparison figures for MT/LXX/SP,
    which is a good sign the manual Hebrew/Greek/Samaritan number-reading held up under the
