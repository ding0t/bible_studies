      - {ref: "2 Kings 9:24-27", relation: "Joram and Ahaziah die the same day: both lines close together"}
    translations_compared: ["ESV", "LXX"]
    divergences_noted: "LXX 1 Kings (3 Kingdoms) 6:1 reads 440th year (τεσσαρακοστῷ καὶ τετρακοσιοστῷ) against MT 480."
