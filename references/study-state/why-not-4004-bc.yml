review_2026-10-08:
  reviewer: "review-bible-study skill (independent session)"
  checked:
    - "All ESV quotations re-queried from study-notes.db (esv-study-bible): 2 Kgs 25:27, 1 Kgs 6:1, 15:25, 15:28, 16:8, 16:10, 22:51, 2 Kgs 3:1, 8:16, 15:5, Gal 4:4, Ps 119:160 -- all verbatim."
    - "Table reign lengths and references re-pulled: Israel 22+2+24+2+12+22+2+12 = 98 (+ Zimri 7 days); Judah 17+3+41+25+8+1 = 95."
    - "Nonaccession arithmetic: 931-841 touches 91 calendar years, 7 shared accession years -> 98 nominal, 90 elapsed. 853-841: Ahaziah 2 + Joram 12 = 14 nominal, 12 elapsed."
    - "Judah simple sum Solomon yr 4 to Zedekiah recomputed: 37 + 393 = 430. 1012-588 = 424; 966-586 = 380."
    - "1 Kgs 15:25 interlinear: malakh (H4427, qatal and wayyiqtol) for both verbs; shenatayim H8141 Ncfda (dual)."
    - "LXX 3 Kgdms 6:1 lemmas: tessarakostos kai tetrakosiostos = 440th."
    - "ESV Study Bible note 1 Kgs 6:1 (966 / 1446 face value / 12x40 -> c.1260) and NIV BTSB note (966 from Assyrian synchronisms; schematic or aggregate of partly concurrent periods) both confirm the study's summary. NIV BTSB on 1 Kgs 15:25 dates Nadab 910/9-909/8: confirms the one-calendar-year reading (independent commentary, Phase 5)."
    - "Wikipedia 'Ussher chronology' re-fetched: 430 -> 424 'by positing a few overlapping reigns', 1012-588; 562 BC Amel-Marduk; Nativity 5 BC because Josephus puts Herod's death in 4 BC; 4000-year Adam-to-Christ span was a widely held prior expectation."
    - "Dunham Bible Museum KJV@400 re-fetched: 1701 Lloyd Bible first with marginal dates; 'at least the next 250 years'. (Dunham calls Lloyd 'Bishop of London'; he was Bishop of Worcester from 1699 -- study is right.)"
    - "Statement-of-faith quotation verbatim (line 39); Psalm 119:160 is its starting point (line 41)."
  fixed:
    - "Critical (arithmetic): study said the site reads 1 Kgs 6:1 'the way Ussher did' and that everything above the temple inherits the 46-year shift. Ussher's 1012 -> 1491 is 479 years; the site's 966 -> 1446 is 480 (AM 2513 -> 2993). Added the one-year step-2 difference; Exodus/creation move 45, not 46. Lede 'whole difference' -> 'all but one year'."
    - "Nativity: 'round number partly built in because Ussher worked from Herod's death' was unsupported; replaced with the sourced reason (prior 4000-year expectation) and 5 BC; birth/crucifixion basis now names Herod's death."
    - "'went unseen for three centuries' -> 'stood in Bible margins for two and a half centuries' (Assyriologists questioned it from the 1860s)."
    - "'closes on a single afternoon' -> 'in one chariot chase' (2 Kgs 9:27 has Ahaziah die at Megiddo)."
    - "Closing 'the one convention he missed' contradicted the study's own two-habit explanation; reworded."
    - "Discussion Q4 'scribes who never heard of Israel's God' false (Assyrians name the LORD, 2 Kgs 18:22-25); reworded."
    - "Added lang/hebrew tag."
  open_for_author:
    - "2 Kgs 8:16 'when Jehoshaphat was king of Judah' is textually uncertain (CSB footnote; omitted in some witnesses), and in Thiele Jehoram's 8 years count from 848 sole reign, so it does not inflate the 95. Stronger co-regency evidence for this span: 2 Kgs 1:17 vs 3:1 (Jehoshaphat-Jehoram) and 1 Kgs 22:41-42 vs 16:29 (Asa-Jehoshaphat, the 3 years that do inflate the 95)."
    - "'he did not count Israel's part-years the way Nadab's verse shows' -- claim about Ussher's method not in the cited sources."
    - "'a check Ussher could not fully use' is vague; Ussher had both lists."
    - "Optional precision: Israel's 98 -> 90 can be stated exactly (seven shared accession years plus inclusive counting)."
  sibling_inconsistencies:
    - "day-is-a-thousand-years.md:385-386 says Ussher's AM 4000 = 4 BC and that he 'fixed his epoch partly by working back from Herod's death'; Wikipedia gives Nativity 5 BC and attributes the 4000 to a prior expectation."
    - "chronology-anchors.md:57-58 and combined-timeline.md say 1491 BC 'by the same verse would put entry 1 at 1012 BC'; by the site's 480 count it gives 1011 -- 1012 is Ussher's 479."
    - "prophecy-events-times.md:169 'simply summed ... without correcting for co-regencies' (already in open_questions)."
