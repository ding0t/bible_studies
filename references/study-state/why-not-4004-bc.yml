  exegesis:
    historical_context:
      done: true
      notes: >-
        Ussher, Annales Veteris Testamenti (1650): anchored Amel-Marduk's accession at 562 BC
        (Wikipedia 'Ussher chronology', which also gives the simple Judahite sum 430 shortened to 424
        by 'a few overlapping reigns', 1012 to 588 BC). Dates printed in the margin of the 1701
        Authorised Version under William Lloyd and for ~250 years after (Dunham Bible Museum /
        Wikipedia on Lloyd). Assyrian cuneiform deciphered in the 1850s; Thiele, Mysterious Numbers
        (1951; 3rd ed. 1983).
    literary_context:
      done: true
      notes: >-
        Kings' regnal formula: accession synchronised to the other kingdom's king + length of reign.
        The synchronisms are the internal check; the lengths alone are what Ussher summed.
    content_word_studies:
      done: true
      notes: "1 Kings 15:25 interlinear: malakh (H4427) for both 'began to reign' and 'reigned'; shenatayim dual of shanah (H8141). malakh occurs 121x in 1 Kings."
      terms:
        - {word: "מָלַךְ", language: hebrew, transliteration: "malakh", strongs_id: "H4427", gloss: "to be or become king, to reign"}
        - {word: "שְׁנָתָיִם", language: hebrew, transliteration: "shenatayim", strongs_id: "H8141", gloss: "two years (dual)"}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Non-accession and accession reckoning are ancient court conventions; the transcultural point is reading a text by its own conventions."
    theological_principle:
      done: true
      notes: >-
        God's word is true in what it affirms as written (statement-of-faith 'Scripture is the
        infallible word of God', Psalm 119:160). The apparent error was the reader's convention.
        Consistent with the statement of faith; no conflict.
    application_draft:
      done: true
      notes: ""
  cross_reference:
    done: true
    cross_refs:
