slug: "why-not-4004-bc"
title: "Why Not 4004 BC? Where Ussher's Forty-Six Years Came From"
status: published
target_path: "docs/content/chronology/why-not-4004-bc.md"

primary_passage: "1 Kings 15:25-28"
supporting_passages: ["1 Kings 6:1", "1 Kings 14:20-21", "1 Kings 15:1-2", "1 Kings 15:9-10", "1 Kings 15:33", "1 Kings 16:8-10", "1 Kings 16:23", "1 Kings 16:29", "1 Kings 22:41-42", "1 Kings 22:51", "2 Kings 3:1", "2 Kings 8:16-17", "2 Kings 8:25-26", "2 Kings 9:24-27", "2 Kings 15:5", "2 Kings 25:27", "Psalm 119:160", "Galatians 4:4"]
genre: [ot-narrative, topical]

thesis: >-
  Ussher's count from Adam to the Exodus and his Babylonian anchor both stand; his forty-six-year
  error lies in laying the kings' reigns end to end as full years, and the synchronisms in Kings
  itself, checked by an Assyrian eclipse, show how Israel's scribes actually counted.
outline:
  - {section: "What Ussher did", says: "Worked back from Evil-merodach (2 Kings 25:27, 562 BC) through the kings to the temple (1012), the Exodus (1491) and creation (4004); his dates sat in Bible margins from 1701."}
  - {section: "Two of his three steps still stand", says: "His Exodus is AM 2513, same as the site's; his 562 BC anchor is still the accepted date. The whole difference is in the kings."}
  - {section: "Scripture counts the same years twice", says: "Division to Jehu: Israel's list sums 98, Judah's 95, for a span both lines close on one day (2 Kings 9:24, 27)."}
  - {section: "A part-year counted whole", says: "Nadab 'reigned two years' from Asa's 2nd year to Asa's 3rd; Elah the same. Non-accession counting."}
  - {section: "Sons beside their fathers", says: "2 Kings 8:16, 15:5 name co-regencies; Ussher allowed a few (430 -> 424); reconstruction 380."}
  - {section: "The Assyrian check", says: "Bur-Sagale 763 BC; Qarqar 853 and Jehu 841 leave 12 years for Scripture's 2 + 12 counted Nadab's way."}
  - {section: "What is still contested", says: "Hezekiah synchronisms, 587/586, 480 literal vs schematic, LXX 440. None restores 1012."}
  - {section: "What moved", says: "Table of Ussher vs site dates; year 6000 moves from 1997 to 2042; AM 4000 Nativity fit lost."}
  - {section: "The sum of your word is truth", says: "God's word was right as written; the error was the reader's assumption about how it counted."}
word_budget: 4000
word_budget_reason: ""

