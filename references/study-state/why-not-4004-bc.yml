evidence_verified_2026_10_08:
  - "Israel, division to Jehu: Jeroboam 22 (1 Kgs 14:20), Nadab 2 (15:25), Baasha 24 (15:33), Elah 2 (16:8), Zimri 7 days (16:15), Omri 12 (16:23), Ahab 22 (16:29), Ahaziah 2 (22:51), Joram 12 (2 Kgs 3:1) = 98 years 7 days"
  - "Judah, same span: Rehoboam 17 (1 Kgs 14:21), Abijam 3 (15:2), Asa 41 (15:10), Jehoshaphat 25 (22:42), Jehoram 8 (2 Kgs 8:17), Ahaziah 1 (8:26) = 95"
  - "Nadab: began Asa 2 (15:25), killed Asa 3 (15:28). Elah: began Asa 26 (16:8), killed Asa 27 (16:10)."
  - "Thiele: 931 division, 853 Ahab at Qarqar, 841 Jehu, 966 temple, 586 fall; span 931-841 = 90."

