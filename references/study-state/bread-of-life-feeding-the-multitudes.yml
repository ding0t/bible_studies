open_questions:
  - "The kophinos = 'small Jewish personal provision basket' identification is standard lexical
     background but is not stated by the Gospel writers; the contrast with spyris is textually solid
     (see word studies), the ethnic-marker reading of it is an inference. Drafted as an inference,
     not as a fact."
  - "The Jewish-vs-Gentile audience reading of the two feedings rests on geography (Mark 7:31 ->
     8:1), Matt 15:31's 'glorified the God of Israel', the basket vocabulary, and the eulogeo/
     eucharisteo split. Each strand is real; the cumulative reading is still an inference and is
     presented that way. Did not chase whether the Decapolis crowd could have included diaspora Jews,
     which it certainly could."
  - "Number symbolism (12 = Israel, 7 = completeness) follows the pattern table in this repo's own
     hebrew-studies/hebrew-alphabet.md, whose stated source is Bullinger's Number in Scripture. Mark
     8:19-21 shows Jesus treating the numbers as significant, but neither he nor the narrator says
     what they signify -- so the section is explicitly tiered by confidence and the speculative
     readings (5 loaves = Torah/grace, 5+2=7) are labelled as traditional, not exegetical."
  - "Did not independently verify against a manuscript apparatus whether any tradition harmonizes
     the two basket words; the concordance of the ingested SBLGNT shows none, but that is one Greek
     text, not a survey of variants."
