repo_findings:
  - "DATA GAP -- FOUND DURING THIS STUDY, NOW FIXED (2026-07-25). The ebible-eng-web work in
     references/build/out/bible-text.db contained only 44 of 66 books: every numbered book
     (1-2 Samuel, 1-2 Kings, 1-2 Chronicles, 1-2 Corinthians, 1-2 Thessalonians, 1-2 Timothy,
     1-2 Peter, 1-3 John, etc.) plus Ezekiel, Jonah, Nahum, James, Jude were absent. Found by
     SELECT book, COUNT(*) FROM verses WHERE work_id='ebible-eng-web' GROUP BY book, after a
     bible_passage lookup of 2 Kings 4:42-44 silently returned zero verses -- note the failure mode
     is an empty result, not an error, so it is easy to mistake for a bad reference. The
     scrollmapper-* translations all had the full 66, which localized the fault to the eBible ingest
     step of build.py. Cause: BibleOrgSys's getBookList() returns its own normalized BBB codes rather
     than raw USFM markers, flipping numbered-book prefixes (1SA -> SA1) and renaming five books
     (EZK -> EZE, JAS -> JAM, JON -> JNA, JUD -> JDE, NAM -> NAH), so MACULA_USFM_TO_OSIS.get()
     missed them and ingest_ebible skipped them as out-of-scope front matter. Fixed by a
     BOS_CODE_TO_USFM translation map in book_map.py, routed through in ingest_ebible (this fix was
     not made by the agent writing this study). Verified after rebuild: 66 distinct books, 1,992
     verses across 2Kgs + Ezek. The study's ASV quotations were reverted to WEB accordingly."
