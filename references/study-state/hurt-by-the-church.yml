genre: [topical, gospel, epistle, prophets, psalm, parable]

thesis: >-
  Jesus was betrayed by a friend, deserted by His disciples and opposed by the shepherds of His own
  people, so He knows church hurt from the inside; Scripture tells the difference between a brother
  who fails you, a shepherd who harms you, a wolf who preys on you and the weeds of the world, and
  answers each differently -- forgive and restore the brother, expose the shepherd and the wolf,
  judge inside the church and leave the world to the harvest -- while the Good Shepherd Himself
  seeks, binds up and keeps His sheep, so you can stay with His people.
outline:
  - section: "Hook, In one sentence, Key Takeaways, Study outline"
    says: "Church hurt is real and Scripture names it; the four kinds are answered differently."
  - section: "Jesus was hurt by His own"
    says: "John 1:11; Psalm 41:9 at John 13:18; Mark 14:50; John 6:66-68; Psalm 55 and its 'cast your burden'."
  - section: "Brothers who fail you"
    says: "Acts 15:38-39, Philippians 4:2, 2 Timothy 4:10, 16; bear with, forgive, go to him, restore (Mark, Peter). Forgiveness in depth is a separate backlog item."
  - section: "Shepherds who harm"
    says: "Ezekiel 34 (perek, H6531: Egypt's slavery, forbidden between brothers in Leviticus 25, used of Israel's shepherds); 3 John 9-10; katakyrieuo (G2634) in Matthew 20:25 and 1 Peter 5:3; God Himself shepherds; crimes go to the authorities (Romans 13:4)."
  - section: "Wolves and false teachers"
    says: "lykos (G3074) 6x NT: outside persecutors and inside deceivers; the tests (fruit, confession of Christ, the gospel received, motive); watch, avoid, contend."
  - section: "Weeds in the field"
    says: "Matthew 13:38 the field is the world (ESV SB, NIV BTSB); 1 Corinthians 5:12-13 the church judges insiders; verdict on applying the tares to the church."
  - section: "Staying with His people"
    says: "Hebrews 10:25, 12:15; leaving a church and leaving the church; Psalm 34:18; Matthew 12:20; John 6:68."
word_budget: 4000
word_budget_reason: ""

