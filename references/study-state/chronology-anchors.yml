  findings_critical:
    - "STALE ENTRY NUMBERS. The table was renumbered, but the prose was not: 'Nativity bracket (#22)' is #37, '\"Forty-six years\" (#24)' is #39, and the 444 BC decree is 'chosen for consistency with entry 26' where it means #41 (entry 26 is Antiochus IV)."
    - "KEY TAKEAWAYS CONTRADICTS THE VERDICT. 'Two independent chains land on the same year' (Daniel 9 and Luke 3:1). The Verdict says the 444 BC decree 'follows from this choice rather than standing behind it', and this file's open_questions says the same, so that the two 'cannot be mistaken for independent confirmation'. The takeaway makes exactly that mistake."
    - "THE ACTIVE COLUMN CONTRADICTS 1 KINGS 6:1, THE PAGE'S OWN PRIMARY PASSAGE. The active scenario (ussher_published) puts the Exodus at 1491 BC = AM 2513, and its 480th year is AM 2992 = 1012 BC. The column places Thiele's 966 BC temple at AM 3038, which is 525 years after its own Exodus. Only a_prime (Exodus 1446, temple AM 2993) is consistent with both the Masoretic chain and the rail. The page never names 1491 BC. Two of its claims hold only for a_prime: the opening says everything before Abraham is 'measured backward from' the rail, and the +/-5 section says it 'propagates to creation unchanged'. The same mix of anchors is on combined-timeline.md, where the active column puts the 1446 BC Exodus at AM 2558. genealogy-times.md and flood-and-the-king-lists.md anchor the Masoretic chain at 1491 (Flood 2348) and say the Exodus anchor is still open. The numbers agree with the 2026-09-28 decision; the page mixes two Exodus dates without saying so. This is the author's epoch decision (index.json already flags it), so it is surfaced here, not resolved."
    - "MISQUOTE. Matthew 2:16 is quoted as 'two years old and under'. The ESV reads 'two years old or under'."
    - "EZEKIEL 40:1 AND THE DAY OF ATONEMENT. The heading and the prose say the vision is dated to the Day of Atonement ('the tenth day of the seventh month'). The verse says 'at the beginning of the year', not the seventh month. The ESV SB note dates it to April 573 BC, and the NLT footnote to 28 April 573 BC: 10 Nisan, not 10 Tishri. The Tishri/jubilee reading can be defended, but it is contested and not marked as such. 'A twenty-fifth year sits at the midpoint of a fifty-year cycle' also assumes, without saying so, that year 1 of the exile was year 1 of a jubilee cycle."
    - "'TWO ENTRIES ARE DATABLE TO THE DAY' (the desecration and the rededication) is false by the page's own evidence. It also gives Bur-Sagale 15 June 763, Jehoiachin 2 Adar / 16 March 597, Babylon 16 Tishri / 12 October 539 and Friday 3 April AD 33 to the day, and Ezra 6:15 and Haggai 1:1 carry day dates too."
    - "SEVENTY YEARS: '586 BC to 516 BC from the temple's destruction to its completion' contradicts entry 18 (515 BC, Ezra 6:15 on 3 Adar of Darius's 6th year). 586 to 515 is 71 years; the span is 70 only from 587, or to 516."
    - "WRONG SOURCE: BM 21946 is cited for entries 10, 11 and 12. The chronicle covers 605 to 594 BC and does not reach the fall of Jerusalem (#12). No Babylonian chronicle does; the 587/586 date is argued from biblical synchronisms."
  findings_moderate:
    - "'1 Maccabees NOT held in this repo's bible-text.db, so cited by reference without local verification' (References, and this file's open_questions). The first half is true. The conclusion is false: 1 Maccabees is in references/open-data/scrollmapper-bible-databases-deuterocanonical (raw-only), and every date the page takes from it has now been checked. This is the same mistake as the Tobit precedent."
    - "TIER OVERSTATED at #4 Shishak. The Bubastite Portal neither dates the campaign nor names Rehoboam; the year comes from 1 Kings 14:25 with Thiele's 931, which makes it Anchored under the page's own definition. Also at #41, the crucifixion: the year is argued, and the Verdict calls AD 30 defensible, so it is Anchored (the day follows once the year is chosen). Correcting both changes the tier counts to 25/12/4 but leaves the count at a year or less unchanged at 31."
    - "Jerusalem's fall at 586 is not marked as contested. The ESV SB has '587 or 586' and uses 587 elsewhere. The +/-1 bar covers the range, but the prose never says so."
    - "Accession-year explanation at #11 ('Judah's scribes did not'). This is stated as settled, but it is one of several explanations. The review_gaps quotation lead makes the point stronger than the study does: Jeremiah 52:28 (ESV) dates the same deportation to Nebuchadnezzar's 'seventh year', agreeing with BM 21946, while 2 Kings 24:12 says 'eighth'. Scripture itself carries both counts. The page never cites Jeremiah 52."
    - "'Forty-six years' bracket (#39) does not follow from its own arithmetic. Herod's 18th year counted from 40 BC is 23/22 BC, and adding 46 gives AD 24/25, outside the stated AD 27-30. AD 30 comes only from the naos-completion reading, not from Herod's start. Josephus's War 1.401 gives the 15th year and is not mentioned."
    - "The Cultural Backgrounds counter-case is understated. Both CB volumes (Luke 3:1) date Tiberius's shared rule to AD 13, not 'around AD 11-13'. They say 'scholars often date' the fifteenth year to 'Sept. of AD 27 and Oct. of AD 28', which is a stated scholarly dating, stronger than the page's 'a reckoning ... available'."
    - "The Passover count is not shown for AD 33. From a late AD 29 start, crucifixion in AD 33 needs Passovers in 30, 31, 32 and 33: four, so the feast at 5:1 or an unnamed fourth has to be one. The page says the three named Passovers 'carry the ministry ... to AD 33'. John 2:20's reading 1 (first Passover AD 27) also falls before Luke 3:1's earliest start on the accession count."
    - "Paul's chronology is argued in the wrong direction. The ESV SB's own chart (Acts 9 note) puts Galatians 1:18 at AD 36/37, so conversion falls about 33/34. That is tight after an AD 33 crucifixion, and the same compression is often argued in favour of AD 30. The page's 'comfortable after AD 33, unexplained gap after AD 30' presents the contested direction as settled, although it does call the line weak."
    - "'2 Chronicles 36:21 implies 490 years of breach'. This is a common inference, stated without a confidence marker."
    - "The sabbatical table does not say whose reconstruction its years follow (the listed years appear to be Wacholder's, with Zuckermann's a year earlier; not checked against either). 'Three independent notices sit on one unbroken cycle' is partly circular, since placing each notice in a year already assumes the cycle."
    - "Sibling: last-things/prophecy-essentials.md says a 445 BC decree 'lands within days of the week Jesus rode into Jerusalem'. That is Anderson's AD 32 terminus, the year this page excludes. Which page to change is the author's call."
