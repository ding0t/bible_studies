relationship: >
  This page is the FIXED RAIL half of the chronology work. The elastic pre-Abrahamic half lives in
  genealogy-times.md. The decision register that governs both — units, epochs, rejected frameworks,
  and every choice with its options and flexibility — is in the parent review file, not duplicated
  here. Read that first.

stages:
  scoping:
    done: true
    notes: >
      Arose from the genealogy/calendar review. The insight driving it: all textual-variant
      disagreement is BEFORE Abraham; from Abraham forward every candidate timeline agrees within a
      few years because they are all anchored on the Exodus. So the timeline splits into a rigid
      zone and an elastic zone, and the rigid zone deserves its own page with its own evidence.
  exegesis:
    historical_context: {done: true, notes: "Each entry carries its own dating method inline rather than a single shared setting."}
    literary_context: {done: true, notes: "Daniel 8:20-25 supplies its own angelic interpretation (Media/Persia, Greece, the first king, four kingdoms) — Scripture interpreting itself, which is why the Greek-period entries lean on it."}
    content_word_studies:
      done: true
      terms:
        - {word: "οἰκοδομήθη", language: greek, transliteration: "oikodomethe", strongs_id: "G3618", gloss: "was built", notes: "John 2:20. AORIST, and the noun is ναός (sanctuary) not ἱερόν (precinct). Decides that the verse is compatible with BOTH candidate crucifixion years, not that it selects one."}
        - {word: "ναός", language: greek, transliteration: "naos", strongs_id: "G3485", gloss: "sanctuary, temple proper", notes: "Josephus: built in 18 months, done c. 18/17 BC. The ἱερόν precinct ran to the AD 60s."}
  hermeneutics:
    cultural_vs_transcultural: {done: true, notes: "Accession-year vs non-accession regnal reckoning explained once at entry 11 (2 Kgs 24:12 vs BM 21946) and reused; it is a scribal convention difference, not an error in either source."}
    theological_principle: {done: true, notes: "God keeps appointments in datable time. The rail exists to be checkable, not to be impressive."}
  cross_reference: {done: true, translations_compared: ["ESV"], divergences_noted: "none bearing on dates"}
  drafting: {done: true, file: "docs/content/chronology/chronology-anchors.md"}
  review: {done: true, validated: true}

settled_questions:
  crucifixion_year:
    verdict: "Friday 3 April AD 33"
    settled: "2026-08-22"
    full_reasoning: "parent review file, decision register D-07"
    summary: >
      Only two Fridays in Pilate's prefecture carry Nisan 14: 7 Apr AD 30 and 3 Apr AD 33. Both are
      Nisan 14, so the Synoptic/John question does not discriminate. Decided on Luke 3:1 read with
      accession reckoning (PRIMARY), with Sejanus, Daniel 9 and Pauline chronology supporting.
      John 2:20 shown NEUTRAL. The lunar-eclipse argument deliberately NOT used despite favouring
      the chosen year — contested astronomy (Schaefer vs Humphreys) plus a strained reading of
      Acts 2:20, which quotes Joel about the future rather than reporting Friday's sky.

