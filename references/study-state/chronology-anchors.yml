  - "Solomon's 4th year carries +/-5 yrs and everything above it inherits that. Small beside the genealogy uncertainties, but it does propagate to creation."
  - "RESOLVED 2026-10-01: the epoch was decided (a_prime, creation 3959 BC, Exodus 1446 BC), so the table collapsed to one Zadok column as planned. See decisions_2026-10-01."
  - "1 Maccabees is not in bible-text.db, but it is in the raw-only deuterocanonical source (references/open-data/scrollmapper-bible-databases-deuterocanonical). Every date the page takes from it was checked there on 2026-10-01 (see review_2026-10-01)."
  - "Sabbatical-cycle anchoring carries the Wacholder/Zuckermann one-year dispute. The three attested years used here are internally consistent; the absolute placement is +/-1."

