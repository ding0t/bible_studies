decisions_2026-10-01:
  decided_by: author, 2026-10-01, on the recommendations in review_2026-10-01
  epoch: >
    The site moved from ussher_published (Exodus 1491, creation 4004 BC) to a_prime (Exodus 1446,
    creation 3959 BC). The author: the Nativity need not sit on Zadok 4000. Done site-wide:
    index.json active scenario and era ranges; genealogy_chronology.py regenerated (MT creation
    3959 BC, Flood 2303 BC, LXX 5425/3183, SP 4200/2893); calendarConvert.js offset 3959 and its
    tests; chronology.json genealogy epoch; GenealogyViewer era bands; the six era files (rail
    records from David onward keep their BC year and move 45 AM back; Genesis- and Exodus-dated
    records keep their AM and move 45 years later); three frontmatter zadok/gregorian pairs and
    events.json; prose on combined-timeline, genealogy-times, flood-and-the-king-lists,
    world-population (headline 0.481% -> 0.486%/yr, doubling 144 -> 143 years, every derived table
    recomputed), zadok-calendar, day-is-a-thousand-years, six-days-of-history, day-is-near,
    prophecy-events-times. This page's table is now one Zadok column.
  found_while_switching: >
    patriarchal.json still had Abraham at AM 1948 (Terah 70), although the 2026-09-28 Masoretic
    decision puts him at AM 2008 (Terah 130). Abraham through Tamar moved +60 AM with the switch;
    the EXTRAPOLATED Hezron, Ram and Amminadab were re-spaced evenly between Perez (AM 2213) and
    Nahshon (AM 2447, 66 at the Exodus), by the same equal-spacing rule they were built with.
    NOT FIXED, pre-existing: Rahab and Salmon are born after the conquest (Rahab 1351 BC); Perez's
    'Entry to Egypt' event (AM 2228) is 70 years before Jacob's (AM 2298). The pre-David Judah line
    is placeholder data that the four-hundred-and-eighty-years draft is the place to resolve.
  ezekiel_40_1: "Both readings of 'the beginning of the year' given (10 Nisan per ESV SB and NLT; 10 Tishri / Day of Atonement / jubilee), marked contested; the 'midpoint of a fifty-year cycle' argument and 'clearest case on the site' dropped. Exodus 12:2-3 added to bible_references."
  key_takeaways: "Rewritten: Luke fixes the year; Daniel's 476 years reach AD 32 or 33 by reckoning and never AD 30; the day-level agreement is stated as following from the 444 BC choice. The Verdict now says Daniel 9 supports the year by excluding AD 30 on either reckoning, which the Daniel 9:25 section already says. No remaining conflict with the Verdict or the 444 BC section."
  prophecy_essentials: "The 445 BC / 'fixed by the Elephantine papyri' sentence now names Artaxerxes' twentieth year, gives Hoehner's AD 33 from 444 BC as the site's reckoning, and Anderson's AD 32 from 445 BC."

chronology_line:
  adopted: 2026-10-01
  principle: >
    The site works to ONE chronology line and every study, data file and tool agrees with it.
    Alternatives are shown only as labelled comparisons (the Prophetic Timeline's toggles, the
    tables of other reckonings), never as the date a study argues from. A study that needs a
    different date says so and records why in its state file.
  register:
    - {event: "Genesis 5 and 11 numbers", value: "Masoretic Text throughout, Terah 205 (Abram born at Terah 130)", why: "Genesis 7:23 rules out the LXX Methuselah; SP/LXX share one secondary text type (Steinmann, JETS 64/1, 2021); their +100 and Terah 145 read as harmonizations", source: "chronology/flood-and-the-king-lists.md#why-this-site-follows-the-masoretic-numbers; genealogy-times.yml decision_2026-09-28_masoretic_chronology"}
    - {event: "Solomon's 4th year", value: "966 BC (+/-5)", why: "Thiele, via Qarqar 853 / Jehu 841 and the 763 BC Bur-Sagale eclipse; ESV SB 1 Kgs 6:1 note 'around the year 966 B.C.'", source: "chronology-anchors.md entry 1"}
    - {event: "Exodus", value: "1446 BC = AM 2513", why: "1 Kings 6:1's 480th year counted back from 966 BC; the Masoretic chain puts the Exodus at AM 2513 (Abram AM 2008 + 75 + 430, Galatians 3:17)", source: "index.json chronology_scenarios.a_prime"}
    - {event: "Creation", value: "3959 BC = AM 0", why: "1446 + 2513", source: "genealogy_chronology.py"}
    - {event: "Flood", value: "2303 BC = AM 1656", why: "Masoretic chain", source: "generated/mt.json"}
    - {event: "Abram born", value: "1951 BC = AM 2008", why: "Terah 130 (Acts 7:4 with Genesis 11:32, 12:4)", source: "patriarchal.json"}
    - {event: "Nativity", value: "6-4 BC (5 BC in the table), about AM 3954", why: "Matthew 2:1, 16 against Herod's death in 4 BC (majority view; 1 BC is the minority)", source: "chronology-anchors.md entries 37-38"}
    - {event: "Decree of Nehemiah 2:1", value: "444 BC", why: "Tishri count implied by Nehemiah 1:1 and 2:1; chosen to fit AD 33 (Hoehner) -- a dependency, not independent evidence; ESV SB has 445", source: "chronology-anchors.md entry 20"}
    - {event: "Crucifixion", value: "Friday 3 April AD 33 = AM 3991", why: "Luke 3:1 read naturally, with Sejanus and Daniel 9 (which excludes AD 30 on either decree year); the Passover lunar eclipse is NOT counted", source: "chronology-anchors.md 'Settling the crucifixion year'"}
    - {event: "Year 6000", value: "AD 2042 (+/-5)", why: "arithmetic on the line above; explicitly not a date for the return (Mark 13:32; Acts 1:7)", source: "day-is-a-thousand-years.md; day-is-near.md"}
    - {event: "Passion Week and Pentecost, AD 33", value: "Triumphal Entry Monday 30 March (10 Nisan, Hoehner; tradition Sunday 29 March); Last Supper Thursday evening as Nisan 14 began; crucifixion Friday 3 April, third to ninth hour; Sabbath 4 April = 15 Nisan, first day of Unleavened Bread; empty tomb and Firstfruits Sunday 5 April (both ancient readings of Leviticus 23:11 coincide in AD 33); Ascension about Thursday 14 May (Acts 1:3); Pentecost Sunday 24 May, about 6 Sivan (Leviticus 23:15-16)", why: "Weekdays counted from Friday 3 April AD 33 (Julian); Hebrew days sunset to sunset; the three days and nights as jesus/three-days-and-three-nights.md counts them (three days touched, two nights, inclusive reckoning). Clock hours are the Gospels' where given (Mark 15:25, 33-34) and approximate, in the text's order, elsewhere.", source: "docs/data/chronology.json passion_sequence; chronology.test.js section 9"}
  not_followed:
    - "Ussher 4004 BC / Exodus 1491 BC: puts Solomon's temple at 1012 BC by 1 Kings 6:1, against the Assyrian synchronisms. Site epoch until 2026-10-01."
    - "dsscalendar.org 3925 BC / year 6000 in AD 2075: taken from its week boundaries, not derived from the Masoretic numbers or 1 Kings 6:1. The Day Is Near used it until 2026-10-01."
    - "Anderson's AD 32 terminus from 445 BC: Nisan 14 in AD 32 is not a Friday."
  aligned_2026-10-01: >
    Brought onto the line: day-is-near.md (was AD 2075; stale '2032 from Charting End Times' removed --
    that date left prophecy-chart.md on 2026-08-07), day-is-a-thousand-years.md (this site's row now
    the working line; 'every year 6000 has passed' qualified), six-days-of-history.md (Temple finished
    AM 3000 on this epoch, noted as carrying the +/-5; Nativity paragraph), prophecy-events-times.md
    (the eclipse no longer counted as 'a third independent line'; decree 445/444 with 444 followed),
    prophecy-chart.md, zadok-calendar.md (dsscalendar departure stated as a decision, not an open
    inconsistency), genealogy-times.md, world-population (David's census moved from 1055 BC, before
    David's birth, to c. 975 BC; rates recomputed), archaeological-sites.md (Garden Tomb period AD 33),
    docs/data/chronology.json and the Prophetic Timeline (one line by default, comparisons labelled,
    study links repointed from the dead studies/prophecy/ paths, Anderson and eclipse milestones
    removed, decree anchor 444 BC).
  still_open:
    - "The pre-David Judah line in conquest-judges.json is placeholder (Rahab born after the conquest; Perez's entry to Egypt 70 years before Jacob's). The Four Hundred and Eighty Years draft is the place to settle it."
    - "Sabbatical-cycle reconstruction (Wacholder or Zuckermann) not named in the table."

data_model_2026-10-01:
  what: >
    One set of facts behind both tools. Each person stores one calendar (zadok_year_* for Genesis-dated
    people -- Adam to Nahshon and Elisheba -- gregorian_year_* for Salmon onward); each event is stored
    once in docs/data/chronology.json (life_events plus the Genesis markers, anchor table, milestones and
    AD 33 sequence), tagged with the people it involves; app/src/utils/chronology.js (loadEvents,
    eventsForPerson, loadGenealogyPeople) derives the other calendar and each person's event list. The
    epoch lives only in chronology.json; calendarConvert.js reads it, and index.json's eras store Anno
    Mundi bounds only. utils/validate_genealogy.py fails on a person storing both calendars, an event list
    back in an era file, or a lifespan that disagrees with birth and death; chronology.test.js section 10
    checks the same from the app side.
  verified: "Before/after snapshot of every person's derived dates under all three variants: identical except the fixes below. genealogy_chronology.py output unchanged."
  fixes_found_by_consolidating:
    - "Jacob died at 180 in the data; Genesis 47:28 gives 147, seventeen years after entering Egypt (AM 2298 -> 2315)."
    - "Sarah died in Abraham's death year; Genesis 23:1 gives 127, and Genesis 17:17 makes her ten years younger than Abraham (born AM 2018, died 2145)."
    - "Rachel, Leah and Judah carried lifespans marked ACTUAL that Scripture does not give; now CALCULATED from their stored dates."
    - "Solomon's temple begun 965 and dedicated 958 BC on his record; the anchor table's 966 and 959 BC kept."
    - "Hezekiah's record had Sennacherib's siege in 702 BC; the anchor table's 701 BC kept."
    - "Rehoboam's 'Kingdom Divided' and 'Reign' in 950 BC dropped; the division is anchor 3, 931 BC."
    - "Rahab's faith and rescue at Jericho moved from AM 2644 (91 years after the conquest) to AM 2553, the conquest year."
    - "Perez's 'Entry to Egypt' (AM 2228, 70 years before Jacob's) merged into the Genesis marker at AM 2298."
    - "Solomon's 'Divine Appearance' in his birth year and 'Request for Wisdom' are one event, 1 Kings 3:4-15, early in his reign (c. 970 BC)."
    - "Abram renamed Abraham at 99 (Genesis 17:1, 5): AM 2107, not 2108."
    - "Ahaziah killed by Jehu in 841 BC, the year he reigned (2 Kings 8:26; 9:27), not 840."
    - "Cain's and Abel's events had placeholder dates of AM 0; Genesis gives no year, so they are undated."
    - "Solomon's 'Reign of Peace' dropped as a description, not an event."

