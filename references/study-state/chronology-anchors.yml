slug: "chronology-anchors"
title: "Chronology Anchors: What Can Actually Be Dated, and How Tightly"
status: published
target_path: "docs/content/last-things/chronology-anchors.md"

primary_passage: "1 Kings 6:1"
genre: [topical, ot-narrative, prophets]

parent_review: "references/study-state/genealogy-calendar-review.yml"
relationship: >
  This page is the FIXED RAIL half of the chronology work. The elastic pre-Abrahamic half lives in
  genealogy-times.md. The decision register that governs both — units, epochs, rejected frameworks,
  and every choice with its options and flexibility — is in the parent review file, not duplicated
  here. Read that first.

stages:
  scoping:
    done: true
    notes: >
      Arose from the genealogy/calendar review. The insight driving it: all textual-variant
      disagreement is BEFORE Abraham; from Abraham forward every candidate timeline agrees within a
      few years because they are all anchored on the Exodus. So the timeline splits into a rigid
      zone and an elastic zone, and the rigid zone deserves its own page with its own evidence.
  exegesis:
    historical_context: {done: true, notes: "Each entry carries its own dating method inline rather than a single shared setting."}
    literary_context: {done: true, notes: "Daniel 8:20-25 supplies its own angelic interpretation (Media/Persia, Greece, the first king, four kingdoms) — Scripture interpreting itself, which is why the Greek-period entries lean on it."}
    content_word_studies:
      done: true
      terms:
        - {word: "οἰκοδομήθη", language: greek, transliteration: "oikodomethe", strongs_id: "G3618", gloss: "was built", notes: "John 2:20. AORIST, and the noun is ναός (sanctuary) not ἱερόν (precinct). Decides that the verse is compatible with BOTH candidate crucifixion years, not that it selects one."}
        - {word: "ναός", language: greek, transliteration: "naos", strongs_id: "G3485", gloss: "sanctuary, temple proper", notes: "Josephus: built in 18 months, done c. 18/17 BC. The ἱερόν precinct ran to the AD 60s."}
  hermeneutics:
    cultural_vs_transcultural: {done: true, notes: "Accession-year vs non-accession regnal reckoning explained once at entry 11 (2 Kgs 24:12 vs BM 21946) and reused; it is a scribal convention difference, not an error in either source."}
    theological_principle: {done: true, notes: "God keeps appointments in datable time. The rail exists to be checkable, not to be impressive."}
  cross_reference: {done: true, translations_compared: ["ESV"], divergences_noted: "none bearing on dates"}
  drafting: {done: true, file: "docs/content/last-things/chronology-anchors.md"}
  review: {done: true, validated: true}

settled_questions:
  crucifixion_year:
    verdict: "Friday 3 April AD 33"
    settled: "2026-08-22"
    full_reasoning: "parent review file, decision register D-07"
    summary: >
      Only two Fridays in Pilate's prefecture carry Nisan 14: 7 Apr AD 30 and 3 Apr AD 33. Both are
      Nisan 14, so the Synoptic/John question does not discriminate. Decided on Luke 3:1 read with
      accession reckoning (PRIMARY), with Sejanus, Daniel 9 and Pauline chronology supporting.
      John 2:20 shown NEUTRAL. The lunar-eclipse argument deliberately NOT used despite favouring
      the chosen year — contested astronomy (Schaefer vs Humphreys) plus a strained reading of
      Acts 2:20, which quotes Joel about the future rather than reporting Friday's sky.

open_questions:
  - "Entry 20's 444 BC decree follows FROM the AD 33 choice rather than supporting it. Stated on the page so the two cannot be mistaken for independent confirmation. If the crucifixion year ever moves, this must move with it."
  - "Solomon's 4th year carries +/-5 yrs and everything above it inherits that. Small beside the genealogy uncertainties, but it does propagate to creation."
  - "The Zadok columns show two of the tracked epoch scenarios -- `active` (ussher_published, creation 4004 BC) and `a_prime` (creation 3959 BC) -- because the epoch question is still open. Columns were labelled A'/A'' until publication; renamed to the scenario ids in docs/data/genealogy/index.json so the page and the data agree, since `a_double_prime` is 4009 BC and was NOT what the 4004 column held. Collapse to one column only after the epoch is decided."
  - "1 Maccabees is NOT in this repo's bible-text.db (the apocrypha-bearing works carry 66 books only). Maccabean entries cite it by reference without local verification — flagged rather than hidden."
  - "Sabbatical-cycle anchoring carries the Wacholder/Zuckermann one-year dispute. The three attested years used here are internally consistent; the absolute placement is +/-1."

resources_consulted:
  - {type: commentary, title: "ESV Study Bible", note: "Luke 3:1 ('probably A.D. 29 plus or minus a year'), John 2:20 (the naos/hieron distinction and the 'built 46 years ago' alternative), John 19:14."}
  - {type: commentary, title: "NIV Biblical Theology Study Bible", note: "Luke 3:1 at AD 28-29; John 19:31 on the special Sabbath."}
  - {type: commentary, title: "NIV/NKJV Cultural Backgrounds Study Bible", note: "Luke 3:1 noting the co-regency reckoning that would permit AD 30 — the strongest counter-case, recorded rather than omitted."}
  - {type: other, title: "Humphreys & Waddington, 'Dating the Crucifixion', Nature 306 (1983) 743-746", note: "Source of the two-candidate result. Their eclipse argument is cited and DECLINED."}
  - {type: other, title: "Bradley Schaefer's critique of the eclipse visibility", note: "Why the eclipse argument is not used."}
  - {type: other, title: "Edwin R. Thiele, The Mysterious Numbers of the Hebrew Kings", note: "Regnal reconstruction behind entries 1-9 and the accession-year convention."}
  - {type: other, title: "Babylonian Chronicle BM 21946; Nabonidus Chronicle; Assyrian Eponym List (Bur-Sagale); Kurkh Monolith; Black Obelisk; Taylor Prism; Bubastite Portal", note: "The contemporary documents behind every Fixed entry."}

