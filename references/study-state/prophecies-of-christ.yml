primary_passage: "Isaiah 45:21; Luke 24:44"
genre: [topical, prophets]
thesis: >-
  God staked His name on telling what was still to come (Isaiah 45:21; 46:9-10), and in His Son
  Jesus He kept His word: the page sets out every Old Testament prophecy the New Testament reads of
  Him, so you can test each one.
