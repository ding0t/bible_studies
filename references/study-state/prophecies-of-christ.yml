slug: "prophecies-of-christ"
title: "The Prophecies of Christ"
status: drafting
target_path: "docs/content/jesus/prophecies-of-christ.md"

primary_passage: "Isaiah 45:21; Luke 24:44"
genre: [topical, prophets]
thesis: >-
  God staked His name on telling what was still to come (Isaiah 45:21; 46:9-10), and in His Son
  Jesus He kept His word: the page sets out every Old Testament prophecy the New Testament reads of
  Him, so you can test each one.
outline:
  - {section: "God's own argument", says: "Isaiah 45:21; 41:23; 48:5; 46:10; Jesus takes the LORD's words, John 13:19 = Isaiah 43:10 LXX (hina pisteusete ... hoti ego eimi); Luke 24:44"}
  - {section: "How to read the ledger", says: "the three tiers; the six measures; no odds (decision no_odds)"}
  - {section: "measures table, dated sentence, the span chart", says: "generated; 1 Peter 1:11"}
  - {section: "The studies, a week at a time", says: "series-sessions"}
  - {section: "one section per category, then the New Testament's own predictions", says: "generated cards"}
word_budget: 4000
word_budget_reason: "the hand-written prose only; the cards are generated"

open_questions:
  - "31 fulfilled or partly-fulfilled entries carry no `event` (the nature entries, most of lineage, the types), so they are off the span chart's history panel; giving each a dated event is ledger research"
  - "the series' membership and order are a proposal for the author: Known Before, Seen After; Where Jesus Stopped Reading; The King on a Donkey; The Cups Jesus Drank; Three Days and Three Nights; Melchizedek Priesthood; The Bright Morning Star"
  - "publish with the two draft studies, which this page lists as coming until they are published"
  - "FOR THE AUTHOR (review 2026-11-26): the-passover-lamb, the-bronze-serpent and three-days-in-the-fish are tier 1 with only type or allusion uses; the schema puts a type at tier 2. 1 Corinthians 5:7 ('Christ, our Passover lamb, has been sacrificed') and John 3:14's 'must' may carry tier 1; check_prophecies.py allows a type to close tier 1. Re-tier or keep, and say which rule"
  - "lead (review 2026-11-26): b. Megillah 3a may tie Daniel to 'the end of the Messiah', which would make sixty-nine-weeks read-after; read it at source (Sefaria export) before changing the ledger"
  - "critical dates are recorded for 26 of the 71 dated prophecies; the Psalms, Zechariah 9-14, Micah, Hosea, Joel, Jonah and Jeremiah have none in docs/data/book-authorship.toml, so their cards show only the traditional date. Adding sourced critical dates (critical_parts for Zechariah 9-14) would widen the test"
  - "the span chart labels a multi-reference split by its first reference (Hosea 3:4-5 for a four-reference entry)"
