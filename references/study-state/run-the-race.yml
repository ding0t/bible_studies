        - {word: "φορτίζω", language: greek, transliteration: "phortizō", strongs_id: "G5412", gloss: "load, burden", notes: "2x NT: Matthew 11:28, Luke 11:46 (lawyers load people)."}
        - {word: "φορτίον", language: greek, transliteration: "phortion", strongs_id: "G5413", gloss: "burden, cargo", notes: "Matthew 11:30 vs Matthew 23:4; also Luke 11:46 x2, Galatians 6:5, Acts 27:10."}
        - {word: "ἀναπαύω / ἀνάπαυσις", language: greek, transliteration: "anapauō / anapausis", strongs_id: "G373 / G372", gloss: "give rest / rest", notes: "anapausis 5x NT; 11:28 'I will give rest', 11:29 'you will find rest'."}
        - {word: "ζυγός", language: greek, transliteration: "zygos", strongs_id: "G2218", gloss: "yoke", notes: "Acts 15:10, Galatians 5:1 yoke of law; 1 Timothy 6:1 slavery; Revelation 6:5 scales."}
        - {word: "χρηστός", language: greek, transliteration: "chrēstos", strongs_id: "G5543", gloss: "kind, good, easy", notes: "7x NT."}
        - {word: "ἐλαφρός", language: greek, transliteration: "elaphros", strongs_id: "G1645", gloss: "light", notes: "2x NT: Matthew 11:30; 2 Corinthians 4:17."}
        - {word: "מַרְגּוֹעַ", language: hebrew, transliteration: "margoaʿ", strongs_id: "H4771", gloss: "rest, place of repose", notes: "Only Jeremiah 6:16 (macula-hebrew-wlc). LXX reads ἁγνισμόν 'purification'; Matthew 11:29 follows the Hebrew."}
        - {word: "ὑπομονή / ὑπομένω", language: greek, transliteration: "hypomonē / hypomenō", strongs_id: "G5281 / G5278", gloss: "endurance / endure", notes: "Hebrews: hypomone 10:36, 12:1; hypomeno 10:32, 12:2, 12:3, 12:7. Isaiah 40:31 LXX hypomenontes = Hebrew qoye (wait for)."}
        - {word: "ὄγκος", language: greek, transliteration: "onkos", strongs_id: "G3591", gloss: "weight, bulk", notes: "NT hapax, Hebrews 12:1."}
        - {word: "εὐπερίστατος", language: greek, transliteration: "euperistatos", strongs_id: "G2139", gloss: "easily entangling", notes: "NT hapax, Hebrews 12:1."}
        - {word: "ἀφοράω", language: greek, transliteration: "aphoraō", strongs_id: "G872", gloss: "look away to, fix eyes on", notes: "2x NT: Hebrews 12:2, Philippians 2:23."}
