genre: [gospel, epistle, prophets, wisdom, parable, topical]

thesis: >-
  Jesus calls the weary to come to Him and gives them rest by yoking them to Himself, the gentle
  and lowly Son; the Christian runs the long race on that same rest, looking to Jesus, fed by His
  word, kept in prayer and stirred up by one another, and grows weary again when other loads are
  taken back up: works done to be seen, discipline used to earn, and the cares of this age that
  choke the word.
outline:
  - section: "Hook, passages, In one sentence, Key Takeaways, Study outline"
    says: "Weariness is common among believers; the two passages answer it together."
  - section: "Come to me"
    says: "Matthew 11:28-30 in context: the Son who alone reveals the Father offers the rest Israel refused at Jeremiah 6:16, against the Pharisees' loads (phortizo only here and Luke 11:46); rest is given, then found under His yoke."
  - section: "Why believers grow weary"
    says: "Hebrews' readers had endured and were now drooping, drifting and skipping the assembly; weariness itself is not sin (John 4:6), and Jesus feeds the crowd lest they faint on the way (ekluo, Mark 8:3)."
  - section: "Run with endurance, looking to Jesus"
    says: "Hebrews 12:1-3 walked through: lay aside, run with hypomone, look away to Jesus founder and perfecter, consider Him so you do not grow weary; Isaiah 40:31 LXX puts waiting, running and not growing weary in one verse; the flint face is the Servant's (Isaiah 50:7, Luke 9:51) and Philippians 3:12 roots our pressing on in Christ's prior grip."
  - section: "What feeds the runner"
    says: "The backlog's three, with verdicts: meeting together (Hebrews 10:24-25, 3:13), prayer as communion and daily bread, living on the word (Deuteronomy 8:3, Isaiah 50:4) — Acts 2:42 holds all three."
  - section: "What weighs the runner down"
    says: "Works done to be seen (Matthew 6:1, 23:5), fasting to earn (Luke 18:12), and the Sower's cares of this age (Mark 4:19, Luke 8:14, Luke 21:34); guard your heart (Proverbs 4:23) and God's peace guards it (Philippians 4:7)."
  - section: "Discussion questions; References"
    says: "Facets: language, context, Christ, the hard part (thorny soil), transformed."
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: >-
      From backlog.md "### Run the race - come to me all who are weary". Author's brief: rest at
      Christ's invitation, His burden lighter than salvation by works; why Christians grow weary;
      run with endurance, face like flint, take hold of that for which Christ took hold of me.
      Proposed helps: meeting/encouraging, prayer as communion and daily bread, living on the
      word. Proposed hindrances: works to be seen pious, fasting to work toward life, news and
      world's troubles (cares choking the seed), all that stole the word in the Sower. Proverbs:
      guard heart and mind, trust Him. Placement christian-life/. Give fair/out-of-context verdicts
      on the author's phrases (flint, take hold).
  exegesis:
    historical_context:
      done: true
      notes: >-
        Matthew 11 sits in mounting opposition (ESV SB on 11:1-12:50). Yoke a Jewish metaphor for
        the law / kingdom (ESV SB, NIV CBSB on 11:29). Hebrews addressed to believers who had
        endured persecution (10:32-34) and were tempted to drift/shrink back (2:1; 10:25, 35-39);
        athletic imagery of stripping to run (NIV CBSB on 12:1).
    literary_context:
      done: true
      notes: >-
        Matthew 11:19 "wisdom is justified by her deeds"; 11:25-27 the Son reveals the Father;
        11:28-30 the invitation; 12:1 "At that time" (same phrase as 11:25) grainfields on the
        Sabbath, disciples hungry; 12:7 mercy not sacrifice; 13:1 "That same day" the Sower. So
        rest -> Sabbath controversy -> Sower runs as one sequence. Hebrews 12:1-3 hinges ch. 11
        (faith) to 12:4-13 (discipline/endurance); ekluo 12:3 picks up in the Proverbs 3:11
        quotation at 12:5; 12:12 drooping hands.
