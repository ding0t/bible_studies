slug: "run-the-race"
title: "Run the Race: Come to Me, All Who Are Weary"
status: published
target_path: "docs/content/christian-life/run-the-race.md"

primary_passage: "Matthew 11:28-30; Hebrews 12:1-3"
supporting_passages:
  - "Matthew 11:19-27"
  - "Matthew 12:1-14"
  - "Matthew 13:1-23; Mark 4:13-20; Luke 8:11-15"
  - "Matthew 23:4-5; Luke 11:46"
  - "Jeremiah 6:16"
  - "Isaiah 40:28-31"
  - "Isaiah 50:4-7; Luke 9:51"
  - "Hebrews 10:23-25, 32-36; 12:5, 12"
  - "Hebrews 3:12-13; 4:15-16"
  - "Philippians 3:12-14; 4:6-8"
  - "Proverbs 3:5-6; 4:20-23"
  - "Matthew 6:1, 11, 16, 34; 4:4; Deuteronomy 8:3"
  - "Luke 21:34; Luke 18:12; John 4:6; Mark 8:3; Matthew 15:32"
genre: [gospel, epistle, prophets, wisdom, parable, topical]

thesis: >-
  Jesus calls the weary to come to Him and gives them rest by yoking them to Himself, the gentle
  and lowly Son; the Christian runs the long race on that same rest, looking to Jesus, fed by His
  word, kept in prayer and stirred up by one another, and grows weary again when other loads are
  taken back up: works done to be seen, discipline used to earn, and the cares of this age that
  choke the word.
outline:
  - section: "Hook, passages, In one sentence, Key Takeaways, Study outline"
    says: "Weariness is common among believers; the two passages answer it together."
  - section: "Come to me"
    says: "Matthew 11:28-30 in context: the Son who alone reveals the Father offers the rest Israel refused at Jeremiah 6:16, against the Pharisees' loads (phortizo only here and Luke 11:46); rest is given, then found under His yoke."
  - section: "Why believers grow weary"
    says: "Hebrews' readers had endured and were now drooping, drifting and skipping the assembly; weariness itself is not sin (John 4:6), and Jesus feeds the crowd lest they faint on the way (ekluo, Mark 8:3)."
  - section: "Run with endurance, looking to Jesus"
    says: "Hebrews 12:1-3 walked through: lay aside, run with hypomone, look away to Jesus founder and perfecter, consider Him so you do not grow weary; Isaiah 40:31 LXX puts waiting, running and not growing weary in one verse; the flint face is the Servant's (Isaiah 50:7, Luke 9:51) and Philippians 3:12 roots our pressing on in Christ's prior grip."
  - section: "What feeds the runner"
    says: "The backlog's three, with verdicts: meeting together (Hebrews 10:24-25, 3:13), prayer as communion and daily bread, living on the word (Deuteronomy 8:3, Isaiah 50:4) — Acts 2:42 holds all three."
  - section: "What weighs the runner down"
    says: "Works done to be seen (Matthew 6:1, 23:5), fasting to earn (Luke 18:12), and the Sower's cares of this age (Mark 4:19, Luke 8:14, Luke 21:34); guard your heart (Proverbs 4:23) and God's peace guards it (Philippians 4:7)."
  - section: "Discussion questions; References"
    says: "Facets: language, context, Christ, the hard part (thorny soil), transformed."
word_budget: 4100
word_budget_reason: "Published at 4,096 words at the author's request, 2026-10-13, after review; simplify-bible-study can recommend trims later."

stages:
  scoping:
    done: true
    notes: >-
      From backlog.md "### Run the race - come to me all who are weary". Author's brief: rest at
      Christ's invitation, His burden lighter than salvation by works; why Christians grow weary;
      run with endurance, face like flint, take hold of that for which Christ took hold of me.
      Proposed helps: meeting/encouraging, prayer as communion and daily bread, living on the
      word. Proposed hindrances: works to be seen pious, fasting to work toward life, news and
      world's troubles (cares choking the seed), all that stole the word in the Sower. Proverbs:
      guard heart and mind, trust Him. Placement christian-life/. Give fair/out-of-context verdicts
      on the author's phrases (flint, take hold).
  exegesis:
    historical_context:
      done: true
      notes: >-
        Matthew 11 sits in mounting opposition (ESV SB on 11:1-12:50). Yoke a Jewish metaphor for
        the law / kingdom (ESV SB, NIV CBSB on 11:29). Hebrews addressed to believers who had
        endured persecution (10:32-34) and were tempted to drift/shrink back (2:1; 10:25, 35-39);
        athletic imagery of stripping to run (NIV CBSB on 12:1).
    literary_context:
      done: true
      notes: >-
        Matthew 11:19 "wisdom is justified by her deeds"; 11:25-27 the Son reveals the Father;
        11:28-30 the invitation; 12:1 "At that time" (same phrase as 11:25) grainfields on the
        Sabbath, disciples hungry; 12:7 mercy not sacrifice; 13:1 "That same day" the Sower. So
        rest -> Sabbath controversy -> Sower runs as one sequence. Hebrews 12:1-3 hinges ch. 11
        (faith) to 12:4-13 (discipline/endurance); ekluo 12:3 picks up in the Proverbs 3:11
        quotation at 12:5; 12:12 drooping hands.
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "κοπιάω", language: greek, transliteration: "kopiaō", strongs_id: "G2872", gloss: "labour to weariness", notes: "23x NT (SBLGNT). John 4:6 of Jesus wearied. Isaiah 40:31 LXX 'run and not grow weary'."}
        - {word: "φορτίζω", language: greek, transliteration: "phortizō", strongs_id: "G5412", gloss: "load, burden", notes: "2x NT: Matthew 11:28, Luke 11:46 (lawyers load people)."}
        - {word: "φορτίον", language: greek, transliteration: "phortion", strongs_id: "G5413", gloss: "burden, cargo", notes: "Matthew 11:30 vs Matthew 23:4; also Luke 11:46 x2, Galatians 6:5, Acts 27:10."}
        - {word: "ἀναπαύω / ἀνάπαυσις", language: greek, transliteration: "anapauō / anapausis", strongs_id: "G373 / G372", gloss: "give rest / rest", notes: "anapausis 5x NT; 11:28 'I will give rest', 11:29 'you will find rest'."}
        - {word: "ζυγός", language: greek, transliteration: "zygos", strongs_id: "G2218", gloss: "yoke", notes: "Acts 15:10, Galatians 5:1 yoke of law; 1 Timothy 6:1 slavery; Revelation 6:5 scales."}
        - {word: "χρηστός", language: greek, transliteration: "chrēstos", strongs_id: "G5543", gloss: "kind, good, easy", notes: "7x NT."}
        - {word: "ἐλαφρός", language: greek, transliteration: "elaphros", strongs_id: "G1645", gloss: "light", notes: "2x NT: Matthew 11:30; 2 Corinthians 4:17."}
        - {word: "מַרְגּוֹעַ", language: hebrew, transliteration: "margoaʿ", strongs_id: "H4771", gloss: "rest, place of repose", notes: "Only Jeremiah 6:16 (macula-hebrew-wlc). LXX reads ἁγνισμόν 'purification'; Matthew 11:29 follows the Hebrew."}
        - {word: "ὑπομονή / ὑπομένω", language: greek, transliteration: "hypomonē / hypomenō", strongs_id: "G5281 / G5278", gloss: "endurance / endure", notes: "Hebrews: hypomone 10:36, 12:1; hypomeno 10:32, 12:2, 12:3, 12:7. Isaiah 40:31 LXX hypomenontes = Hebrew qoye (wait for)."}
        - {word: "ὄγκος", language: greek, transliteration: "onkos", strongs_id: "G3591", gloss: "weight, bulk", notes: "NT hapax, Hebrews 12:1."}
        - {word: "εὐπερίστατος", language: greek, transliteration: "euperistatos", strongs_id: "G2139", gloss: "easily entangling", notes: "NT hapax, Hebrews 12:1."}
        - {word: "ἀφοράω", language: greek, transliteration: "aphoraō", strongs_id: "G872", gloss: "look away to, fix eyes on", notes: "2x NT: Hebrews 12:2, Philippians 2:23."}
        - {word: "κάμνω", language: greek, transliteration: "kamnō", strongs_id: "G2577", gloss: "grow weary, be sick", notes: "2x NT: Hebrews 12:3; James 5:15."}
        - {word: "ἐκλύω", language: greek, transliteration: "eklyō", strongs_id: "G1590", gloss: "faint, give out", notes: "5x NT: Galatians 6:9; Hebrews 12:3, 5; Mark 8:3; Matthew 15:32 (crowd would faint on the way)."}
        - {word: "μέριμνα", language: greek, transliteration: "merimna", strongs_id: "G3308", gloss: "care, anxiety", notes: "6x NT: Sower x3 (Matthew 13:22, Mark 4:19, Luke 8:14), Luke 21:34, 2 Corinthians 11:28, 1 Peter 5:7."}
        - {word: "καταλαμβάνω", language: greek, transliteration: "katalambanō", strongs_id: "G2638", gloss: "lay hold of, grasp", notes: "3x in Philippians 3:12-13; passive 'I was grasped by Christ Jesus'."}
        - {word: "חַלָּמִישׁ", language: hebrew, transliteration: "ḥallāmîš", strongs_id: "H2496", gloss: "flint", notes: "Isaiah 50:7 Servant sets face like flint."}
        - {word: "יָעֵף", language: hebrew, transliteration: "yāʿēp", strongs_id: "H3287", gloss: "weary", notes: "Isaiah 50:4 sustain the weary with a word; cognate verb H3286 in Isaiah 40:31."}
        - {word: "נָצַר", language: hebrew, transliteration: "nāṣar", strongs_id: "H5341", gloss: "guard, keep", notes: "Proverbs 4:23 with מִשְׁמָר (H4929) 'above all guarding'."}
        - {word: "φρουρέω", language: greek, transliteration: "phroureō", strongs_id: "G5432", gloss: "guard as a garrison", notes: "Philippians 4:7 God's peace guards; 1 Peter 1:5 guarded by God's power."}
