author_revision_2026-10-13: >-
  At the author's request: Sirach 51 removed (adds nothing above Scripture; quotation, reference
  entry and supporting passage gone). Pastoral pass, because a weary reader came for relief and met
  a technical start: hook and In-one-sentence now address the reader and end on rest; Key Takeaways
  drops Types & Prophecy (Isaiah 50 and Jeremiah 6:16 stay in the body) so it opens on Jesus who
  knows weariness; second-person landings added to Who was weary (Matt 12:7 "the guiltless") and
  Run with endurance (Isa 40:29). The two author items are written: tiredness is not sin (Heb 4:15,
  "without sin"), with the outline promise restored, and "This shows that God feeds His tired
  people Himself" closing What feeds the runner.
comic: >-
  docs/data/comics/run-the-race.toml, 2026-10-13: five panels (the laden called, Jesus wearied at
  Jacob's well, the yoke offered, the race looking to Jesus, Isaiah 40:29-31); every ESV bubble passes
  build_comics.py --verify. Cloud of witnesses deliberately not drawn (watch/testify is contested).
  Same day: the three orphaned "**Fair.**" verdict labels (from backlog 10.6's fair/out-of-context
  questions, whose framing review pass 1 removed) were taken out.
