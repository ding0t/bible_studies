        - "ekluo 'come loose': root fallacy for Hebrews 12:3. The literal 'loosen' survives in LXX Gen 27:40 (loosing a yoke), but all 5 NT uses are faint/give up (MACULA glosses) and LXX usage is mostly fainting (1 Sam 14:28, 2 Sam 17:2, Lam 2:12, 19, Deut 20:3). Now 'to faint, to give out'."
        - "merimna 'the divided mind': root fallacy (folk derivation from merizo, itself doubtful). Usage: care, anxiety, concern (1 Pet 5:7 anxiety; 2 Cor 11:28 Paul's care for the churches; LXX Ps 54:23). Now 'anxiety, worry'."
        - "phroureo 'a garrison posted at a gate': military sense fair (2 Cor 11:32 the governor guarding Damascus; Gal 3:23 custody; NIVCBSB 'frequent military sense'; ESVSB Philippi garrison), the gate an embellishment. Now 'a military verb (2 Corinthians 11:32)'; 'God's peace stands garrison' in Guard your heart kept as a fair image."
