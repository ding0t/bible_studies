    review_2026-10-01:
      checked: >-
        Every ESV quotation re-queried from study-notes.db (esv-study-bible verses): all verbatim, all
        references correct. Concordance (macula-greek-sblgnt / macula-hebrew-wlc) re-run: phortizo 2x NT
