  - "Review rec 3 applied: 'What wears a believer down' now lists causes from Hebrews (suffering prolonged 10:32/12:4, waiting 10:37, sin left in place 3:13/12:1, hardship misread as rejection 12:5-6, drifting/absence 2:1/10:25); new 'Never good enough' subsection (9:9, 9:14, 10:1-3, 10:14, 10:22, 1 John 3:20) resting on assurance-of-salvation.md, per the author."
  - "Review rec 4 applied: all three soils treated (Luke 8:12-14, Mark 4:17-19); 'The hard part: which hearers believed?' sits directly after them and links assurance-of-salvation.md#when-someone-walks-away (John 10:28, 1 John 2:19, Hebrews 10:39), per the author's request that it be read near assurance. News application moved after it."
  - "Trimmed to stay under budget: 'Matthew shows it at once', 'Then comes the remedy', 'A runner alone drops out unseen...', 'Bodies get tired...' (review rec 3 register tells), James 5:15 aside."
  - "Author request: church as a cause of weariness. Added 'When the church wears you out' (Hebrews 12:14-15; Psalm 55:12-14; John 13:18/Psalm 41:9; Acts 15:39; Philippians 4:2; 2 Timothy 4:10-17; Acts 20:29-30; 2 Peter 2:1; Matthew 7:15-16; 1 John 4:1; 1 Peter 2:23; Colossians 3:13; Romans 12:19; John 10:11-13). Tares: Matthew 13:38 'the field is the world'; ESV SB and NIV BTSB both read it as the kingdom in the world, so the study says the church application is a common misreading and keeps the harvest comfort. Pushes the page to 4,413 words (validator Check 23); budget decision left to the author."
  - "Fork candidate recommended: 'Hurt by the Church' -- wolves, false teachers, betrayal by friends, falling out, the tares misapplication, church discipline (where-two-or-three-are-gathered.md) vs bearing with one another, and forgiveness (ties to the backlog Forgiveness item). Would let this section shrink to a short pointer."
  - "Spin-off written: docs/content/christian-life/hurt-by-the-church.md. 'When the church wears you out' cut to a short paragraph linking it. Page now 4,116 words (Check 23); budget decision left to the author."
  - "Still open from review: rec 2 ('consider' link is English-only), 5 (root-leaning glosses), 6 (Servant pronoun capitals), 7 (Heb 12:3 variant), 8 (anapausis tag)."
