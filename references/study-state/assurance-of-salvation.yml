      - {ref: "Romans 8:31-39", relation: "nothing can separate from the love of God in Christ"}
      - {ref: "Romans 10:9-13", relation: "confession and faith unite Jew and Greek, same Lord over all"}
      - {ref: "Ephesians 1:13-14", relation: "sealed with the Spirit as guarantee of the inheritance"}
      - {ref: "2 Corinthians 5:17", relation: "new creation as evidence, not ground"}
      - {ref: "Titus 3:4-7", relation: "saved not by works done, by his mercy, made heirs"}
      - {ref: "Hebrews 7:25", relation: "able to save to the uttermost, always lives to intercede"}
      - {ref: "2 Timothy 1:12", relation: "convinced he is able to guard what has been entrusted"}
      - {ref: "1 Peter 1:3-5", relation: "inheritance kept in heaven, guarded through faith"}
      - {ref: "2 Peter 1:5-11", relation: "confirm your calling and election -- fruit as evidence not ground"}
    translations_compared: ["ESV", "WEB", "ASV"]
    divergences_noted: >
      1 John 5:13: WEB/Byzantine-family text adds a final clause not in the earlier text ESV
      follows ("and that you may continue to believe in the name of the Son of God") -- confirmed
      against SBLGNT (critical text), which ends the verse at "the Son of God" with no second hina
      clause, matching ESV. Worth a brief aside since a reader cross-checking WEB against ESV here
      would otherwise wonder about the discrepancy; doesn't change the verse's assurance claim
      either way (WEB's addition qualifies why he wrote, ESV's shorter form still carries the same
      "so that you may know" purpose).
  drafting:
    done: true
    file: "docs/content/salvation/assurance-of-salvation.md"
  review:
    done: true
    validated: true

open_questions:
  - "Whether to explicitly invoke a dispensational frame here -- decided not to force it; assurance/
     eternal security isn't where this site's Israel/Church distinctive actually bears, unlike
     eschatology. Left as standard grounding from the cited texts."
  - "1 John's traditional anti-Gnostic occasion is stated in the draft as traditional-but-unprovable,
     following ESV Study Bible's own caution, rather than as settled fact -- flag on review if this
     reads as too hedged or not hedged enough."
