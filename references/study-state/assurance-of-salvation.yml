review_2026-08-24:
  scope: "review-bible-study skill, full pass (Phases 1-8) against docs/content/salvation/assurance-of-salvation.md"
  findings_critical:
    - "1 John 5:8 quoted as ESV ('the Spirit, the water, and the blood; and the three agree as one') -- actual ESV reads 'the Spirit and the water and the blood; and these three agree.' Quoted text is WEB's wording under an ESV label."
    - "'the ESV Study Bible's introduction advises reading it \"paragraph by paragraph\"' -- the source's actual phrase is 'think paragraphs,' not quoted verbatim."
  findings_moderate:
    - "'seven of the letter's ten uses of [believe] fall here' reproduces ESV SB's count without re-derivation; live SBLGNT lemma query for pisteuo in 1 John returns 9 occurrences total (6 in ch.5) or 7 distinct verses (4 in ch.5) -- neither reconciles with 10/7."
    - "'ginosko ... 24 occurrences against 15 for oida' -- live query returns 25 ginosko occurrences, not 24."
    - "'Paul applies [Joel 2:32] to Jesus three verses earlier' (Rom 10:9 vs 10:13) -- actual gap is four verses."
    - "Phase 6: cultural-vs-transcultural line (the 'name' idiom as period vocabulary for a transcultural claim) is worked out in this state file's hermeneutics section but never stated explicitly in the published body text."
  findings_minor:
    - "Eph 2:1 quote elides the word 'the' via ellipsis ('dead in ... trespasses and sins') instead of quoting exactly."
    - "2 Peter 1:5-10 cited as the range for two phrases that both come from v.10 alone."
    - "Tags: John's Gospel used substantively across 5 passages (3:16-18, 5:24, 6:37-40, 10:27-29, 20:31) with no 'john' tag; 2 Peter 1:5-11 carries a full quote + discussion question with no '2-peter' tag."
    - "'notably does not include' -- mild grader-adverb."
    - "'some seven weeks earlier, at the preceding Passover' -- precise week count isn't determinable from Acts 3:1's silence on elapsed time since Pentecost."
  findings_confirmed_no_issue:
    - "Eph 2:8 touto/perfect-tense grammar claims cross-checked against NIV Biblical Theology Study Bible (independent commentary, not already cited) -- confirms, no contradiction."
    - "1 John 5:13 assurance-purpose reading cross-checked against same independent commentary -- confirms."
    - "Deut 17:6/19:15 two-or-three-witness cross-reference verified directly -- supports the claim as stated."
  status: "all 11 findings fixed 2026-08-24; re-validated (npm run validate clean) and rebuilt (mkdocs build --strict clean)"
