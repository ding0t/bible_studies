genre: [epistle, gospel, acts, topical]

stages:
  scoping:
    done: true
    notes: >
      Backlog item 4.1 (Salvation section). Scope per backlog.md: the question and assurance of
      salvation -- no other name by which we may be saved (Acts 4:12), not by works (Eph 2:8-9).
      Salvation section is defined in the taxonomy (our-taxonomy.md, commentary_index.py
      SUBJECT_DIRS, section_index.py SECTION_BLURBS) but has no content directory yet -- this
      study creates it. Primary passage chosen as 1 John 5:11-13 because it is the one passage
      that states assurance as its own explicit subject ("these things I have written ... that
      you may know that you have eternal life"), with Acts 4:12 and Ephesians 2:8-9 as the
      backlog's own named grounding texts, plus the wider NT witness (John, Romans, Ephesians,
      Titus, Hebrews, 2 Timothy, 1 Peter).
  exegesis:
    historical_context:
      done: true
      notes: >
        1 John: author is John son of Zebedee (traditional, ESV Study Bible follows), writing from
        Ephesus c. late 1st c. Occasion is definite in one respect only: the church had "witnessed
        an exodus from their ranks" (2:19) -- a group left. ESV SB deliberately declines to assert
        proto-Gnosticism as certain background (that movement's heyday is 2nd-5th c.), so this study
        should likewise not overclaim "Gnostic opponents" as established fact -- state it as the
        traditional but unprovable reading, and lean on what 2:19 itself states. Structure is not
        linear ("think paragraphs") -- built around recurring tests of whether one is "in Christ":
        doctrinal (belief about who Jesus is), moral (obedience/righteousness), social (love).
        5:13 is the letter's own purpose statement, deliberately answering the departure of 2:19 by
        telling those who stayed and believed that they may *know* they have life -- contrast with
        John 20:31 (Gospel's purpose: so that you may *believe*) as evangelistic vs. epistle's
        pastoral/assurance purpose.
        Acts 4:12: spoken by Peter before the Sanhedrin (Acts 4:1-22), the day after healing the
        lame man at the temple gate (Acts 3). Same verb sozo used for the man's healing (4:9,
        sesostai) and for the salvation Peter then declares (4:12, sothenai) -- the miracle
        functions as an enacted parable of the sermon's claim.
        Ephesians: no specific crisis occasioned it (unlike most epistles) -- general/circular
        instruction, probably read across several Asian churches. Ephesus's occult reputation (Acts
        19:19) explains the letter's emphasis on Christ's supremacy over every power -- relevant
        backdrop for 2:8-9's claim that salvation itself, not just protection from spiritual forces,
        is entirely God's doing.
    literary_context:
      done: true
      notes: >
        1 John 5:6-13 sits in the letter's climactic section on "Faith in the Son as the Way to
        Life" -- of the letter's 10 uses of "believe," 7 fall in ch. 5. vv.6-10 establish a legal
        threefold testimony (Spirit, water, blood -- echoing Deut 17:6/19:15's two-or-three-witness
        rule) to Jesus as the Son of God; v.11-12 states the content of that testimony (life is in
        the Son, full stop); v.13 is the writer stepping back to state why he wrote all of it. Don't
        isolate v.13 as a freestanding assurance proof-text without this run-up -- assurance in 1
        John is assurance *that the testimony about Jesus is true*, not a separate, freestanding
        psychological confidence.
        Eph 2:8-9 sits inside one long Greek sentence (2:1-10, following two more long sentences at
        1:3-14 and 1:15-23) -- v.8 "by grace you have been saved" restates 2:5 for emphasis; v.10
        ("created ... for good works") is the necessary next verse -- Paul pairs "not as a result of
        works" (v.9) immediately with "created for good works" (v.10) so the study should hold both,
        not quote 2:8-9 and stop.
        Acts 4:12 is Peter's own concluding line of a short speech (4:8-12) answering the Sanhedrin's
        question "by what power/name" (4:7) -- the "name" theme is the whole speech's frame, not an
        isolated slogan.
    content_word_studies:
      done: true
      notes: >
        See terms[] below. Two cautions recorded here rather than per-term: (1) oida/ginosko in 1
        John -- both map to the same Louw-Nida "know" domain (28.1) throughout the letter and are
        used near-interchangeably (24 ginosko, 15 oida occurrences) -- resisted the temptation to
        draw a sharp "settled vs. experiential knowledge" lexical distinction between them, since
        that specific distinction is a well-known overdrawn-synonym example in exegetical-fallacy
        literature (Carson, Exegetical Fallacies). Only claim: 5:13 uses oida (aorist subj. eidete),
        consistent with the letter's dominant "know" vocabulary, not a special word chosen for this
        verse alone. (2) sozo/soteria wordplay in Acts 4:9-12 verified directly from SBLGNT
        morphology, not secondary claim -- 4:9 sesostai and 4:12 sothenai are the same lemma sozo.
      terms:
        - word: "σῴζω / σωτηρία"
          language: greek
          transliteration: "sōzō / sōtēria"
          strongs_id: "G4982 / G4991"
          gloss: "save, heal, rescue / salvation, deliverance"
          range_of_meanings: ["physical healing/rescue from danger", "spiritual salvation from sin and judgment"]
          notes: >
            Same verb for both senses -- Acts 4:9 (healing, perfect sesostai) and 4:12 (salvation,
            aorist inf. sothenai) are the identical lemma, confirmed against SBLGNT morphology. The
            noun sotēria in 4:12 has no article-driven "a/the" ambiguity in the Greek that changes
            meaning; ESV "there is salvation in no one else" is a fair rendering. Jesus' own name
            (Iesous < Hebrew Yehoshua/Yeshua, built on the verb yasha, TWOT root 929, "deliver") is
            an enacted pun on this word -- Matt 1:21 makes it explicit: "you shall call his name
            Jesus, for he will save (sōsei) his people from their sins."
        - word: "χάρις / τοῦτο (demonstrative)"
          language: greek
          transliteration: "charis / touto"
          strongs_id: "G5485 / G5124"
          gloss: "grace / this"
          range_of_meanings: []
          notes: >
            Eph 2:8's touto ("this") is neuter; charis (grace) and pistis (faith) are both feminine
            nouns, so touto cannot grammatically point back to either word alone by gender-agreement
            -- confirmed against the MACULA syntax annotation, which resolves touto's referent to
            the whole clause "you have been saved" (sesōsmenoi), not to "faith" as an isolated noun.
            The neuter pronoun is taking in the whole preceding idea (a normal Greek usage), which
            is why "not of yourselves, it is the gift of God" covers the entire salvation-by-
            grace-through-faith transaction, faith included, not grace alone.
        - word: "σεσῳσμένοι"
          language: greek
          transliteration: "sesōsmenoi"
          strongs_id: "G4982"
          gloss: "having been saved (perfect passive participle)"
          range_of_meanings: []
          notes: >
            Perfect tense: a completed past action with a continuing present result. Grammatically
            encodes the doctrine before any doctrine is argued -- "you are in a saved state" as an
            existing fact, not "you are being saved" as an ongoing, uncertain process.
        - word: "ἀρραβών"
          language: greek
          transliteration: "arrabōn"
          strongs_id: "G728"
          gloss: "down payment, pledge, guarantee"
          range_of_meanings: []
          notes: >
            Eph 1:14 -- commercial/legal term for a first installment that legally guarantees the
            rest of a payment is coming. The Spirit himself is described as this installment on the
            "inheritance," not merely a sign pointing to it.
        - word: "ἁρπάζω"
          language: greek
          transliteration: "harpazō"
          strongs_id: "G726"
          gloss: "to snatch, seize by force"
          range_of_meanings: []
          notes: >
            John 10:28-29 -- denotes forcible seizure (per ESV SB note on v.1), set against the
            "hired hand" of 10:12-13 who abandons the flock. Security is stated twice, from the
            Son's hand and then the Father's, described as "greater than all."
        - word: "אַבָּא"
          language: aramaic
          transliteration: "abba"
          strongs_id: "G5"
          gloss: "father (intimate/family address)"
          range_of_meanings: []
          notes: >
            Rom 8:15 -- Aramaic, not Greek; retained untranslated in the Greek text itself,
            reflecting Jesus' own address to God in Gethsemane (Mark 14:36). Paul has Gentile
            believers in Rome using Jesus' own family word for God.
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: >
        Nothing in the core claim (salvation is God's gift, received by faith, grounded in Christ
        alone) is culturally local -- Acts 4:12, Eph 2:8-9, 1 John 5:11-13 all state the principle
        directly rather than illustrating it through a custom that needs translating forward. The
        one culturally-specific *form* worth flagging for readers is Acts 4:12's "name" idiom --
        in the Semitic world a name carries a person's whole identity/authority, not merely a label
        (hence "call upon the name of the Lord," Rom 10:13 quoting Joel 2:32) -- the transcultural
        content is "salvation is found in the person of Jesus alone," and "name" is the period's own
        vocabulary for saying it.
    theological_principle:
      done: true
      notes: >
        Assurance of salvation rests on an objective ground (what Christ did, received by grace
        through faith, Eph 2:8-9; there is no other name, Acts 4:12) that Scripture then invites
        believers to *know* they possess (1 John 5:13), confirmed subjectively by the Spirit's own
        witness (Rom 8:15-16) and by a life of growing obedience and love (2 Pet 1:5-11; this is 1
        John's own three "tests" running through the whole letter). Assurance is not self-generated
        confidence, and the fruit that confirms it is evidence, never the ground -- 2 Pet 1:10
        explicit on this point ("good works are evidence of and give assurance of salvation, though
        they are never the basis for it").
    application_draft:
      done: true
      notes: >
        Draft written directly into Be Transformed section of the study rather than restated here.
  cross_reference:
    done: true
    cross_refs:
