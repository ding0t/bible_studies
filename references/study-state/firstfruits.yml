claims:
  - id: aparche-count
    what: ἀπαρχή occurrences in the NT
    sql: "SELECT COUNT(*) FROM morphology WHERE work_id='macula-greek-sblgnt' AND lemma='ἀπαρχή'"
    expect: 9
  - id: aparche-in-1cor15
    what: ἀπαρχή in 1 Corinthians 15, both of Christ
    sql: |
      SELECT COUNT(*) FROM morphology WHERE work_id='macula-greek-sblgnt'
        AND lemma='ἀπαρχή' AND book='1Cor' AND chapter=15
    expect: 2
  - id: nuph-in-lev-23-11
    what: נוּף occurs twice in Leviticus 23:11
    sql: |
      SELECT COUNT(*) FROM morphology WHERE work_id='macula-hebrew-wlc'
        AND lemma='נוּף' AND book='Lev' AND chapter=23 AND verse=11
    expect: 2
  - id: lxx-lev-23-11-not-sabbath
    what: >
      Brenton LXX Lev 23:11 contains πρώτης and does NOT contain σαββ- ; the study's central
      textual claim. Returns 1 when both hold.
    sql: |
      SELECT COUNT(*) FROM verses WHERE work_id='ebible-grcbrent'
        AND book='Lev' AND chapter=23 AND verse=11
        AND text LIKE '%πρώτης%' AND text NOT LIKE '%σαββ%'
    expect: 1
  - id: lxx-lev-23-15-is-sabbath
    what: >
      Brenton LXX Lev 23:15 DOES contain σαββάτων, translating the same Hebrew phrase the other
      way. The pair of these two claims is the study's find.
    sql: |
      SELECT COUNT(*) FROM verses WHERE work_id='ebible-grcbrent'
        AND book='Lev' AND chapter=23 AND verse=15
        AND text LIKE '%σαββάτων%'
    expect: 1

corrections_during_drafting:
  - >
    ZADOK CALENDAR CLAIM WAS WRONG AND WAS CAUGHT BEFORE PUBLISHING. The draft's Related-links line
    said Firstfruits "always falls on a fixed Sunday" on the 364-day calendar. Checked against
    zadok-calendar.md rather than left as written: 1 Nisan is always a WEDNESDAY there, and with
    30-day months that puts Nisan 15 on a Wednesday and Nisan 16 on a THURSDAY. The weekly-Sabbath
    reading gives Nisan 19, a Sunday. So the calendar fixes the weekday by construction but does not
    by itself produce a Sunday -- which reading is taken still decides it. Line rewritten to say
    exactly that.

