thesis: >-
  God made Israel's whole harvest wait on one sheaf lifted before Him "on the day after the Sabbath,"
  and Paul names the risen Jesus by that offering's own word, ἀπαρχή, so His resurrection is the
  first sheaf of a harvest that includes you.
word_budget: 4000
outline:
  - "What the statute commands: one sheaf (omer), barley, waved (nuph), nothing eaten until it is (Lev 23:14)."
  - "The first one kept: Joshua 5:10-12 -- manna stops, land's grain eaten; the sheaf implied, not narrated."
  - "The disputed date: no textual variant; festival vs weekly readings; the LXX renders the phrase two ways (23:11 vs 23:15). Left open."
  - "AD 33: Nisan 15 on the weekly Sabbath, so the two main readings converge on the Sunday of the empty tomb."
  - "Christ the firstfruits: ἀπαρχή shared with LXX Lev 23:10; release (Lev 23:14) beyond the commentaries' foretaste."
  - "What the firstfruits guarantees: Rom 8:23, Jas 1:18, Rom 11:16 + Num 15:20-21; firstborn of/from the dead."

