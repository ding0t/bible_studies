  - "SETTLED 2026-11-26 (decisions.acts_15_amos_9; prophecy_ledger above). Original task: Acts 15:13-18 and Amos 9:11-12. Questions: what 'After this' (Μετὰ ταῦτα) attaches to (Jeremiah 12:15 LXX? Hosea 3:5?); what 'first visited' (πρῶτον, 15:14) orders; whether James claims fulfilment or agreement ('the words of the prophets agree', 15:15); Amos 9:13-15 (the land, planted never to be uprooted) beside 9:11-12; the Septuagint's reading against the Hebrew's Edom; the oldest readers (4QFlorilegium on Amos 9:11, before Christ; Justin, Irenaeus). Run as a fulfilment ledger (prophecy-method.md section 3). Schedule: after session 7, before the studies."
  - "the NT-original table: fields, and whether Jesus' passion predictions (Mark 8:31; 9:31; 10:33-34) go there"
  - "suffering-servant groups Isaiah 53:5, 9, 12 for the validator; splitting it changes What Literary Criticism Declares' counts"
