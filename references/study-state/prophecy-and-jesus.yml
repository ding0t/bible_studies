      - {particular: "'After this I will return' (James's opening)", ref: "Acts 15:16; Hosea 3:4-5 LXX; Jeremiah 12:15 LXX", marks: {church-age: partly, return: meets, split: meets}, evidence: "In Hosea the 'afterward' follows 'many days without king'; in Jeremiah it follows the uprooting"}
