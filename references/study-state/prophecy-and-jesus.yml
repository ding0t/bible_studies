      - {particular: "James's verb: the prophets 'agree'", ref: "Acts 15:15", marks: {church-age: meets, return: meets, split: meets}, evidence: "συμφωνοῦσιν, no fulfilment formula: the argument is that Scripture already includes Gentiles as Gentiles"}
