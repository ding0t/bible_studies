  - "verify the palaeographic dates given to each scroll (4Q174 -25, 4Q175 -75, 4Q252 -25, 4Q285 -1, 1QS/1QSa/1QSb -75, 1QM -25, 4Q521 -80, 11Q13 -50, 4Q246 -25; CD by composition, -100) against the DJD editions or a handbook before a study prints a year; they are approximate. 4Q285 and 4Q252 are in late hands: say 'before AD 68' if the edition puts them after the turn of the era"
  - "rabbinic leads from Edersheim, not yet read at source or dated (Sefaria; date each by compilation): b. Sukkah 52a (Zechariah 12:10, Messiah son of Joseph slain); b. Sanhedrin 98a (Daniel 7:13 against Zechariah 9:9); b. Sanhedrin 98b (Isaiah 53's 'leper'); Pesikta Rabbati 36-37 (Psalm 22:7 of the suffering Messiah Ephraim); Ecclesiastes Rabbah 1:9 (the latter redeemer brings down manna, for bread-from-heaven); Pirqe de Rabbi Eliezer 30 (Isaiah 63); Hagigah 14a (Daniel 7:9, Akiba's two thrones)"
  - "Edersheim's pointer for Psalm 80 is a verse off: the Targum's 'King Messiah' is at Hebrew 80:16 (English 80:15), and 80:17's 'son of man' stays. The Targum of Psalm 118:22 reads the rejected stone as David ('the youth… among the sons of Jesse'): the near referent, for the-rejected-stone. The Targum of Ezekiel 34:23 has 'one leader' and no David in the Aramaic"
  - "hub-page theme: God argues from fulfilled prediction Himself: 'Who foretold this long ago? Who announced it from ancient times? Was it not I, the LORD?' (Isaiah 45:21, BSB); with Isaiah 41:21-23; 44:7; 46:9-10; 48:3-5 (verify each). Open the reference with God's own claim, then the measures."
  - "Spot the Mistake leads: the devil's Psalm 91; the popular-list claims that fail"
  - "the 'more than the first person' test and the omission at John 13:18 are features for prophecy-method.md (session 10)"
  - "TOOL BUG, found 2026-11-26, FIXED the same day at the author's request (query._move, used by every verse-level lookup; tests in test_versification.py): bible_verse (query.lookup_verse) fetches Hebrew and Greek morphology through versification.align(), which ignores psalm superscriptions, so in every psalm with a title the words come from the verse before. English Psalm 22:18 returns the morphology of Hebrew 22:18 ('I count all my bones'), while the same result's stated_hebrew_reference correctly says 22:19. The LXX pairing is off the same way (21:18 for 21:19). It reached bible_align (so passage_brief's addressing), crossref, links, interlinear, alignment_diff, section, variants and trace, and export_connector's own numbering: the published language connector showed Psalm 22:18 with the Hebrew of 22:17 ('I count all my bones'). Regenerated locally 2026-11-26 (82 psalm chapters, 9 NT chapters quoting them, 17,334 psalm occurrences in the word files; nothing outside the Psalms moved). It goes live only after `uv run python export_connector.py --publish`, which the author runs or approves. passage_brief still fetches each translation's text at the reference as given and warns when the schemes disagree; read a psalm's Hebrew or Greek through bible_verse or bible_parallel."
  - "features seen in the passion entries, for session 10: His opponents fulfil most of them (control, counted 2026-11-26: opponents 14 of 25, chosen 6, divine 3, followers 2); of the uses with a text, the Hebrew rendered afresh 8, the Septuagint 6, both agreeing 6, neither 3; the New Testament renders the Hebrew afresh where the Septuagint misses the point (John 19:37 'pierced', Matthew 27:10 'potter', John 13:18 'heel', Luke 22:37 'with'); two omissions that respect the near referent (John 13:18 drops 'whom I trusted'; Luke 23:46 stops before 'You have redeemed me', an observation only); a change of person that names the agent (Matthew 26:31 'I will strike')"

