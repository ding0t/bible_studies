# Prophecy and Jesus (backlog 2.1): a reference of the Old Testament's prophecies of Christ, and the
# studies built on it. A multi-session project; this file is where each session starts.
#
# The ledger itself is docs/data/prophecies-of-christ.toml (schema at its head), checked by
# utils/check_prophecies.py in `npm test`. This file holds the plan, the decisions, what was left
# out and why, and the evidence once entries are researched.

slug: prophecy-and-jesus
title: "Prophecy and Jesus"
status: scoping
started: 2026-11-25

decisions: # agreed with the author 2026-11-25
  - scope: >-
      Three tiers. 1: the New Testament says the text was fulfilled in Jesus or spoke of Him.
      2: it applies the words to Him or reads a type. 3: tradition reads it of Christ and the New
      Testament at most alludes; marked lower confidence. A popular-list claim that fails the
      method gets an explicit "out of context" verdict (feedback: backlog item is the brief).
      No limit on the count.
  - data: >-
      docs/data/prophecies-of-christ.toml is the authority for messianic entries. The 13 messiah
      entries moved from fulfilled-prophecy.toml with ids unchanged; unity_measures.py reads the
      ones with `standing`. Verified 2026-11-25: the validator section of unity-measures.json is
      identical before and after the move.
  - nt_original: >-
      Predictions that start in the New Testament (Jesus' own of His death and return, Revelation's
      own) go in a separate, smaller table on the same page. Not yet designed; see open.
  - placement: >-
      A series under docs/content/jesus/, with the generated reference page as its hub.
  - new_covenant: >-
      SETTLED by the author 2026-11-26: the new covenant is righteousness through Christ by faith,
      open to Jew and Gentile. Romans 11:26-27 is Israel receiving that same covenant.
  - acts_15_amos_9: >-
      SETTLED by the author 2026-11-26: the split stands. Gentiles bearing God's name are gathered
      now; the regathering of the Jews to their Messiah, David their king, is future and driven by
      the tribulation (Hosea 5:15 'in their affliction'; Jeremiah 30:7 'the time of Jacob's
      distress').
  - recognition_read_after: >-
      SETTLED by the author 2026-11-26 ("add another value to capture the intent of the reading vs
      veiled"): 'read-after' marks a messianic reading the synagogue reached after the church and
      without it (a Targum, a midrash), so the chart can show it apart from 'veiled'.
  - one_corinthians_15_25: >-
      Researched 2026-11-26 at the author's request ("look more at the context and for the
      splits"). Lean: the reign that subdues enemies runs from His coming through the thousand
      years (1 Corinthians 15:23-26 order with gaps; Revelation 20:4-6, 14; Psalm 110 split three
      ways; Revelation 3:21's two thrones). Contested: Ephesians 1:20-22; Acts 2:36; Colossians
      2:15. Recorded on sit-at-my-right-hand; Psalm 110:2, 5-7 given its own entry.

# What the data has to answer, so the fields serve the page and the charts (the author asked to
# "visualise and categorise the miracle of prophecy fulfilled in Christ"):
measures:
  - {question: "How far ahead was it written?", from: "book-authorship.toml (both schemes) + event year", field: computed}
  - {question: "Did a copy exist before the event?", from: "Qumran / Great Isaiah Scroll / Septuagint dates", field: computed}
  - {question: "How checkable is it?", field: specific}
  - {question: "Could anyone have arranged it?", field: control}
  - {question: "Was it read of the Messiah before Jesus?", field: recognition, with: recognition_evidence}
  - {question: "Did the disciples understand it only afterwards?", field: understood_after}
  - {question: "Does the New Testament follow the Hebrew or the Greek?", field: text_followed}
  - {question: "Does the LORD's text become Jesus' text?", field: yhwh_text}
  - {question: "What did it first mean, and where do the words outrun that?", field: [near, exceeds]}
  - {question: "Where does one sentence hold two comings?", field: split}
  - {question: "Fulfilled, partly, or still to come?", field: [status, event, future_event]}

proposed: # Claude's proposals, for the author to accept or change
  - no_odds: >-
      ACCEPTED by author 2026-11-26 for single prophecies: no probability figure per prophecy
      (Stoner-style). The odds for each particular are guesses; one bad number discredits the true
      ones.
  - combined_floor: >-
      PROPOSED 2026-11-26, in answer to the author's "calculate odds of all being fulfilled": a
      floor the reader sets, never an estimate. (1) Count only entries that pass every filter:
      drafted or verified, tier 1, control divine / opponents / unwitting (never chosen or
      followers, which a critic says could be arranged), written before the event on the critics'
      own dates or attested in a manuscript before it. (2) Count each act once: several entries
      fulfilled by one act (the spear: pierced-one; the soldiers' choice: no-bone-broken) are one
      trial, which needs an `act` field grouping them (design in session 11). (3) The reader sets
      one chance for every prophecy with a slider, default a deliberately generous 1 in 2, and the
      page shows the product with the count and the filters beside it. At 1 in 2 the floor for n
      independent acts is 1 in 2^n. The page says what the number assumes: independence, and that
      the fulfilment record is the Gospels' (answered by the opponents' agency and, where it
      exists, a witness from outside, e.g. Tacitus, Annals 15.44, for the crucifixion under
      Pilate).

sessions:
  - n: 1
    date: 2026-11-25
    done: >-
      Schema; the 13 entries moved; the candidate inventory (108 entries: tier 1 55, tier 2 36,
      tier 3 17); utils/check_prophecies.py in npm test; this file.
  - n: 2
    date: 2026-11-26
    done: >-
      Passion: 25 entries drafted from side-by-side Greek (SBLGNT, Brenton LXX), BSB and WLC in
      bible-text.db; every quotation in the notes re-checked against the BSB. Schema: text_followed
      moved onto each use as `text` (Isaiah 53's uses follow different texts), and control gained
      "followers". cursed-on-a-tree moved to excluded. Psalms sweep (the author: "psalms has a lot
      of prophecy of Christ, including his childhood"): every strong NT link into the Psalms was
      already listed; 11 Psalms candidates added from psalms the New Testament puts in His mouth,
      three of them childhood (22:9-10, 69:8, 71:5-6, 17). 118 entries; 41 open on a psalm. The
      validator section of unity-measures.json re-checked identical.
  - n: 3
    date: 2026-11-26
    done: >-
      Birth, lineage and childhood: 16 entries drafted (41 drafted of 117). taught-from-my-youth
      moved to excluded with an out-of-context verdict. Fixed first, at the author's request: the
      psalm-title alignment bug in query.py and export_connector.py (see open). Found: Micah 5:3
      states the interval inside the Bethlehem prophecy ('until she who is in labor has given
      birth'); Balaam marks the distance himself (Numbers 24:17, 'not now… not near'); Hebrews 1:5
      leaves out 2 Samuel 7:14's 'When he does wrong', the second omission after John 13:18; the
      Septuagint, before Christ, reads a person in Genesis 3:15 (autos), Genesis 49:10 ('the
      expectation of nations') and Numbers 24:17 ('a man'); Matthew 2:4-6 and John 7:42 are
      known-before evidence for Bethlehem and David's line. Romans 15:12 moved off branch-of-jesse
      (it quotes Isaiah 11:10).
  - n: 4
    date: 2026-11-26
    done: >-
      Nature and forerunner: 17 entries drafted (58 drafted of 116); what-is-his-sons-name moved
      to excluded. Found: the New Testament writes Christ into the LORD's texts (1 Peter 3:15
      puts 'the Christ' where Isaiah 8:13 has 'Himself'; Malachi 3:1's 'before Me' becomes
      'before You'; Isaiah 40:3's 'our God' becomes 'His'); Revelation's 'the Last' renders the
      Hebrew where the Septuagint lost it (Isaiah 44:6); 4Q44 gives Hebrews 1:6's line a Hebrew
      witness at Deuteronomy 32:43; Malachi 4:5 is split by Jesus in one answer (Matthew
      17:11-12, 'comes' and 'has already come').
  - n: 5
    date: 2026-11-26
    done: >-
      Ministry and office: 23 entries drafted (81 drafted of 116). Found for the Isaiah 61 study:
      Jesus shaped the reading (Luke 4:18 leaves out 'to heal the brokenhearted' and splices in
      Isaiah 58:6 LXX), so the stop belongs to a deliberate edit; Matthew 11:5 makes the same cut
      on Isaiah 35:4-6 (the healings without 'your God will come with vengeance'); against the
      two-era reading, Isaiah 34:8 and 63:4 pair 'day' and 'year' on one side. Also: Zechariah 9:9's
      'righteous and victorious' left out by both Gospels; Paul and Peter follow the Hebrew of
      Isaiah 8:14 against the Septuagint's denial; Revelation 1:5 takes three phrases from Psalm
      88 LXX; John 2:17 makes Psalm 69:9's verb future.
  - n: 6
    date: 2026-11-26
    done: >-
      Resurrection and redemption: 19 entries drafted (100 drafted of 116); the-binding-of-isaac
      moved to category resurrection (Hebrews 11:19 draws the type at the return from death).
      Found: two Hebrew copies before Christ (1QIsa-a, 1Q8) read 'light' at Isaiah 53:11, life
      after the servant's death; Ephesians 4:8 'gave' against both texts' 'received'; Mark 12:36
      blends Psalm 8:6 into 110:1; Peter writes 'in the last days' for Joel's 'afterward'; James
      writes 'After this I will return' for Amos's 'In that day'; 2 Corinthians 6:2 puts Isaiah
      49:8's 'time of favor' (dektos, Isaiah 61:2's word) in the present. For the author:
      a-new-covenant and booth-of-david-rebuilt are contested inside dispensational reading, and
      1 Corinthians 15:25's reign (session or millennium) likewise; the statement of faith does
      not settle them.
  - n: 7
    date: 2026-11-26
    done: >-
      Future: 14 entries drafted, plus the two Psalms candidates left from session 2 and a new
      Psalm 110:2, 5-7 entry; every one of the 117 entries is now drafted. The New Testament table
      designed ([[nt_prophecy]] in the same file: speaker, fulfilment, recorded before or after,
      see) and seeded with 15 candidates; check_prophecies.py checks it (and now reads the
      chronology's anchors). Found: Mark 14:62 joins Psalm 110:1 (fulfilled) and Daniel 7:13
      (future) in one sentence; 1 Corinthians 15:54 dates Isaiah 25:8 to the believers'
      resurrection and 15:26 the end of death after it; Habakkuk 2:3's vision becomes a person in
      the Septuagint and Hebrews 10:37; Luke 21:24's 'until the times of the Gentiles'. Verdicts:
      all-that-he-has-done (a sermon parallel only) and desire-of-all-nations (the plural verb).
  - n: 8
    date: 2026-11-26
    done: >-
      Sources, at the author's word ("bring in the other sources as needed"; "download a copy";
      "if you can find DSS to use, do that"). The Targums are in bible-text.db (ingest_targums:
      Onkelos, Pseudo-Jonathan, the Fragment Targum, Jonathan on the Prophets, the Writings; Aramaic
      public domain, English Public Domain or CC0 only), dated in sources.toml [profiles.targums]
      from W. Bacher, 'Targum', Jewish Encyclopedia (1906). Every line of every scroll, the
      sectarian texts included, is in dss_lines (the dss_text tool). Edersheim's Life and Times
      (CCEL, public domain) is on the media volume, Appendix IX indexed by reference
      (edersheim.py, the edersheim_messianic tool). Recognition pass over all 118 entries: 20
      known-before, 6 partly, 92 veiled (then 10 of those read-after, by the author's decision). Rule used: known-before needs a witness from before Jesus
      reading the text of the Messiah or a messianic figure (the Branch of David, the prince of the
      congregation, the son of David, the prophet, Elijah); a Targum or midrash, always later than
      the New Testament, goes into recognition_evidence with its year and leaves the value as it
      was. Found: 4Q252 v 3 reads Genesis 49:10 as 'the Messiah of righteousness, the Branch of
      David'; 4Q174 reads 2 Samuel 7 and Amos 9:11 of the Branch, while CD vii 15-16 reads the same
      booth as 'the books of the Law'; 11Q13 ii gives Isaiah 61:2's 'year of favour' and the
      vengeance to one end-time figure (for session 9: a reading before Christ that keeps the two
      together); CD xix 7-11 reads Zechariah 13:7 of the final visitation 'when the Messiah of
      Aaron and Israel comes'; 1QM xi 6 quotes Numbers 24:17 'as You declared to us from of old'
      (the hub page's theme); the Psalms of Solomon (after Pompey's death, 48 BC: 2:30-31) give the
      son of David Psalm 2:9's rod of iron, Isaiah 11:2 and 11:4, and Ezekiel 34's shepherding;
      the Targum of Isaiah 53 gives the servant's exaltation to the Messiah and turns the wounds
      to the temple 'profaned on account of our sins' (53:5).
  - n: 9
    date: 2026-11-26
    done: >-
      Where Jesus Stopped Reading drafted (docs/content/jesus/where-jesus-stopped-reading.md, draft),
      with a plate (utils/build_jesus_graphics.py); reviewed and read by subagents; three commits.
      State: references/study-state/where-jesus-stopped-reading.yml. Waits on the author's read.
  - n: 10
    date: 2026-11-26
    done: >-
      Known Before, Seen After drafted (docs/content/jesus/known-before-seen-after.md, draft), with a
      chart drawn from the ledger; the counted features written into prophecy-method.md section 9.
      Found: passion 0 of 26 known before, lineage 6 of 8, opponents 0 of 19; Luke uses ἀγνοέω for
      the disciples (9:45) and the rulers (Acts 13:27); διανοίγω three times in Luke 24. State:
      references/study-state/known-before-seen-after.yml. Next: review and read passes.
  - n: 11
    plan: "generator hook and reference page, the span chart (prophet's view / history's view), the series hub"
  - n: 12
    plan: "review-bible-study, then read-bible-study in a separate session"

# Each entry, candidate -> drafted. One call to passage_brief per prophecy, research_batch_run for
# the rest. Record what is checked under evidence: below.
procedure:
  - "passage_brief on the Old Testament text: context, versification, the MT and LXX side by side"
  - "bible_trace on each New Testament use: confirm the kind, and text_followed from the wording"
  - "the near referent and what it fails (prophecy-method.md section 4); fill near / exceeds"
  - "a fulfilment ledger in prophecy_ledger below wherever a candidate is contested (section 3)"
  - "control, specific, predicts, status; event or future_event"
  - "recognition: the oldest witness, dated (section 6); unassessed until session 8 if none is in hand"
  - "tier and kind re-checked against the definitions; then research = drafted"

excluded: # read through all 471 STEP ot-quotations entries; left out, with the reason
  - group: "commandments and law cited for conduct"
    examples: "Matthew 5:21-43; 19:18-19; 22:37-39; Romans 13:9; James 2:8-11; 1 Peter 1:16"
    reason: "the text is applied to the reader's life; no claim about Christ"
  - group: "Israel's history retold"
    examples: "Acts 7:2-50; Acts 13:17-22; Hebrews 11; 1 Corinthians 10:1-10; Jude 1:5-11"
    reason: "narrative summary; the types inside them (the rock, the manna) have their own entries"
  - group: "Jesus arguing from Scripture"
    examples: "Matthew 12:3-7 (1 Samuel 21:6; Hosea 6:6); Matthew 19:4-7; 22:24-32; John 10:34 (Psalm 82:6)"
    reason: "He uses the text to make a point; the text is not about Him"
  - group: "the temptation"
    examples: "Matthew 4:4-10; Luke 4:4-12 (Deuteronomy 8:3; 6:13, 16; Psalm 91:11-12)"
    reason: "Jesus answers from Deuteronomy; Psalm 91 is the devil's misuse. Lead for Spot the Mistake"
  - group: "Paul's arguments on faith, Israel and the nations"
    examples: "Romans 3:10-18; 4:3-18; 9:7-29; 10:5-21; 11:1-10; Galatians 3:6-12; 4:22-30"
    reason: "about righteousness by faith and Israel's place; Galatians 3:16 and Romans 15:12 kept"
  - group: "end-time events with no Christ figure"
    examples: "Matthew 24:15, 21, 29 (Daniel's abomination; Jeremiah 30:7; the signs); Revelation 6-18's judgements, beast and Babylon"
    reason: "the subject of the end-times studies; the Christ texts in Revelation are kept"
  - group: "wisdom and exhortation"
    examples: "Hebrews 12:5-6; James 4:6; 1 Peter 3:10-12; 5:5-7; Romans 12:16-20"
    reason: "counsel to believers"
  - group: "judgement on the hearers"
    examples: "Matthew 15:8-9 (Isaiah 29:13); Acts 13:41 (Habakkuk 1:5); Matthew 21:13 (Isaiah 56:7; Jeremiah 7:11)"
    reason: "about the people's response or the temple's use; Isaiah 6:9-10 kept because John 12:41 ties it to His glory"
  - group: "single texts weighed and left out"
    items:
      - {ref: "Galatians 3:13 (Deuteronomy 21:22-23)", reason: "a law about the hanged; Paul applies its curse to the cross and the text makes no prediction. Moved out of the ledger 2026-11-26; belongs in a redemption study"}
      - {ref: "Hebrews 1:7 (Psalm 104:4)", reason: "about the angels, set against the Son"}
      - {ref: "Proverbs 30:4", reason: "Agur's riddle ('What is His name, and what is the name of His Son?', BSB) has no prediction in it, and no New Testament text cites it; the son may be Israel (Exodus 4:22). Removed 2026-11-26"}
      - {ref: "Psalm 71:5-6, 17", reason: "VERDICT out of context: the speaker is an old man ('Even when I am old and gray', 71:18, BSB), and nothing in the New Testament points here. Listed as a candidate 2026-11-26, removed the same day"}
      - {ref: "Matthew 10:35-36 (Micah 7:6)", reason: "the division His coming brings; about households"}
      - {ref: "John 6:45 (Isaiah 54:13)", reason: "about those taught by God"}
      - {ref: "Ephesians 2:17 (Isaiah 57:19)", reason: "applied to the gospel's reach; revisit under redemption if needed"}
      - {ref: "2 Corinthians 6:16-18", reason: "applied to the church (prophecy-method.md section 2's example)"}
      - {ref: "Hebrews 12:26 (Haggai 2:6)", reason: "kept as desire-of-all-nations, tier 3"}
      - {ref: "Revelation 21-22 (Ezekiel 40-48; Isaiah 60; 65)", reason: "the new creation's imagery: Ezekiel's Temple covers it; link"}

