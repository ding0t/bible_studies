genre: [topical, ot-narrative, gospel, epistle]

thesis: >
  Genesis 1:1, John 3:16 and Hebrews 11:1 survive being quoted alone because each states its
  paragraph's point in one sentence; read in their paragraphs they show more of the same God --
  Creator through His Son, Giver of His Son, and Keeper of His promises.
outline:
  - {section: "Key Takeaways", says: "the three truths and what they show of God"}
  - {section: "Why these travel well", says: "a verse that is its paragraph's thesis sentence keeps its meaning when quoted alone"}
  - {section: "Genesis 1:1", says: "bara, Elohim, merism; heading or first act; John 1:1-3"}
  - {section: "John 3:16", says: "houtos points back to the serpent; kosmos; monogenes; propitiation"}
  - {section: "Hebrews 11:1", says: "hypostasis and elenchos; the chapter's definition; Jesus the perfecter"}
  - {section: "Discussion questions", says: "language, context, Christ, the hard part, the reader"}
