      done: true
      notes: >
        John 3:16 opens Οὕτως γάρ, continuing 3:14-15 (as-the-snake-was-lifted.md). Hebrews 11:1
        defines the faith of 10:38-39 and heads the chapter (NIV CBSB: definition then thesis).
        Genesis 1:1: summary heading or first event (ESV SB gives both, prefers first event via
        Heb 11:3, Rev 4:11).
    content_word_studies:
      done: true
      terms:
        - {word: "בָּרָא", language: hebrew, transliteration: bara, strongs_id: H1254, gloss: "create", notes: "ESV SB: always God as subject in the OT."}
        - {word: "אֱלֹהִים", language: hebrew, transliteration: Elohim, strongs_id: H430, gloss: "God", notes: "plural form, singular verb bara (Vqp3ms per UHB)."}
        - {word: "οὕτως", language: greek, transliteration: houtōs, strongs_id: G3779, gloss: "thus, in this way"}
        - {word: "μονογενής", language: greek, transliteration: monogenēs, strongs_id: G3439, gloss: "only, unique", notes: "John 1:14, 18; 3:16, 18 in SBLGNT John."}
        - {word: "ὑπόστασις", language: greek, transliteration: hypostasis, strongs_id: G5287, gloss: "assurance, substance", notes: "5x SBLGNT: 2 Cor 9:4; 11:17; Heb 1:3; 3:14; 11:1. LSB fn 'Or substance'."}
        - {word: "ἔλεγχος", language: greek, transliteration: elenchos, strongs_id: G1650, gloss: "conviction, proof", notes: "LSB fn 'Or evidence'. MACULA also maps 2 Tim 3:16 to G1650 -- no exhaustiveness claim made."}
