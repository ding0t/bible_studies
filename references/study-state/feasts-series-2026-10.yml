# Feasts study series -- plan and progress. Started 2026-10-01 at the author's request
# ("plan-out developing the feasts study series ... begin when planned").
# Brief: backlog.md section 6 (6.1 Appointed times overarching; 6.2 one study per feast).

goal: >-
  One overarching study of the Leviticus 23 appointed times (the pattern, spring and fall, what was
  fulfilled at the first coming and what awaits the second), then one study per feast, each in the
  current house format (In one sentence, Key Takeaways, Study outline when long, verified quotes,
  word budget 4,000), each linking back to the overarching study and forward/back along the calendar.

conventions:
  section: "docs/content/feasts/"
  base_translation: "ESV, verified against study-notes.db (last-supper-four-cups.md is WEB-based; leave it)"
  hermeneutic: >-
    Exegesis first: what each feast was in Israel's calendar (Leviticus 23, Numbers 28-29,
    Deuteronomy 16, Exodus 12), then what the New Testament itself says it fulfils. Fulfilment the
    NT states (1 Corinthians 5:7 Passover; 1 Corinthians 15:20 firstfruits; Acts 2 Pentecost;
    Hebrews 9-10 Atonement; John 7 Tabernacles) is stated plainly. Fulfilment that is inferred
    (Trumpets = rapture; Atonement = Israel's national repentance; Tabernacles = millennium) is
    marked as inferred, with the case given -- the standard trumpets.md already sets.
  dispensational: "Fall feasts read toward Israel's future and the millennial kingdom per statement-of-faith.md End times; the church is not Israel (memory: Chumney/Hebrew Roots position rejected)."
  jewish_sources: "Mishnah via references/build/sefaria.py, open-licence versions only, dated as c. AD 200."
  caution: "(superseded 2026-10-02: no Chumney citations at all) trumpets.md cites Chumney's typology (described and weighed, not adopted). Keep that posture; do not lean on Chumney elsewhere."

