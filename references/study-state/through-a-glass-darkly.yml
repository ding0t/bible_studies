stages:
  scoping:
    done: true
    notes: "No existing study treats 1 Corinthians 13 (cross_study_claims). No backlog entry. Closest siblings listed above."
  exegesis:
    historical_context:
      done: true
      notes: "Paul from Ephesus, c. AD 53-55 (ESV SB intro). Corinth: wealthy, divided by arrogance of the 'knowing'. Corinthian bronze mirrors (CBSB note; ESV SB says dim; unfoldingWord tN says often good quality) -- quality is disputed, so the study rests the image on indirectness, which ainigma and Num 12:8 establish independently."
    literary_context:
      done: true
      notes: "BSB section 13:1-13 'Love' inside the gifts discussion of chs 12-14. 13:8-13 explains why love outranks the gifts: gifts are 'in part' and end when 'the perfect' comes; love abides. v12 'then' = the coming of Christ (1:7 'wait for the revealing'; 4:5; 11:26; 15:23). Corinthian over-realised claims (4:8) and knowledge that puffs up (8:1-3) are the target. 'Child' (nepios) echoes 3:1 and 14:20."
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "ἔσοπτρον", language: greek, transliteration: "esoptron", strongs_id: "G2072", gloss: "mirror", notes: "NT: 1 Cor 13:12; Jas 1:23. LXX: Sir 12:11; Wis 7:26 (Wisdom 'a spotless mirror of the working of God', beside apaugasma and eikon -- words the NT gives to Christ, Heb 1:3; 2 Cor 4:4). Wisdom echo is a likelihood, mark it."}
        - {word: "αἴνιγμα", language: greek, transliteration: "ainigma", strongs_id: "G135", gloss: "riddle, indirect saying", notes: "NT hapax (1 Cor 13:12, MACULA). LXX 9x incl. Num 12:8 'ou di' ainigmaton' for Hebrew חִידֹת (chidot). bible_trace finds no connection (silence = paraphrase/single word, not absence); CBSB notes the Num 12 Greek link independently. LSB fn 'Lit in a riddle'; CSB fn 'Lit we see indirectly'. ULT 'unclearly', BSB 'but a dim reflection'."}
        - {word: "ἐπιγινώσκω", language: greek, transliteration: "epiginōskō", strongs_id: "G1921", gloss: "know fully, recognise", notes: "44x in SBLGNT. 13:12 moves from ginōskō (present, 'I know in part') to epignōsomai (future middle) and epegnōsthēn (aorist passive -- God the implied agent, tN). Compare 1 Cor 8:3 egnōstai hyp' autou (perfect passive); Gal 4:9 gnontes theon, mallon de gnōsthentes hypo theou; Phil 3:12 katalabō ... katelēmphthēn hypo Christou."}
        - {word: "πρόσωπον πρὸς πρόσωπον", language: greek, transliteration: "prosōpon pros prosōpon", strongs_id: "G4383", gloss: "face to face", notes: "OT idiom of personal sight of God: Gen 32:30; Exod 33:11; Deut 34:10 (ESV SB list)."}
        - {word: "τὸ τέλειον", language: greek, transliteration: "to teleion", strongs_id: "G5046", gloss: "the perfect, the complete", notes: "LSB fn 'Or mature'. Cessationist vs continuationist reading contested (ESV SB lays out both; v12 'then' supports return of Christ). Keep brief: annex."}
        - {word: "תְּמוּנָה", language: hebrew, transliteration: "temunah", strongs_id: "H8544", gloss: "form, likeness", notes: "10x (MACULA). Israel saw no temunah at Horeb (Deut 4:12, 15); Moses beholds the LORD's temunah (Num 12:8); David: 'when I awake I shall be satisfied with your temunah' (Ps 17:15, ESV 'likeness'; CSB fn 'Lit form'). LXX Ps 16:15 renders it 'when your glory is seen'."}
        - {word: "κατοπτρίζομαι", language: greek, transliteration: "katoptrizomai", strongs_id: "G2734", gloss: "behold as in a mirror / reflect", notes: "NT hapax 2 Cor 3:18. 'behold' vs 'reflect' contested (ESV SB; CSB fn 'Or are reflecting'). Same writer, same mirror image, now with unveiled face."}
        - {word: "διαγρηγορέω", language: greek, transliteration: "diagrēgoreō", strongs_id: "G1235", gloss: "become fully awake", notes: "NT hapax Luke 9:32: 'heavy with sleep' (bebarēmenoi hypnō, CSB fn 'Lit weighed down with sleep'), 'having become fully awake they saw his glory'."}
        - {word: "βαρέω", language: greek, transliteration: "bareō", strongs_id: "G916", gloss: "weigh down", notes: "Luke 9:32 and Matt 26:43 bebarēmenoi (same participle, same three disciples, Transfiguration and Gethsemane); Luke 21:34 barēthōsin of hearts weighed down with cares (MACULA tags it G925 there, same lemma). Mark 14:40 uses kata-barynomai."}
        - {word: "κατάνυξις", language: greek, transliteration: "katanyxis", strongs_id: "G2659", gloss: "stupor", notes: "Rom 11:8 quoting LXX Isa 29:10 pneumati katanyxeos for Hebrew רוּחַ תַּרְדֵּמָה (ruach tardemah, 'spirit of deep sleep'). Judicial hardening of unbelieving Israel -- context guard: not the believer's state."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Mirror quality is cultural and disputed; the principle (indirect, partial knowledge of God now; direct, full knowledge then) transcends it and is taught explicitly elsewhere (1 John 3:2; 2 Cor 5:7; Rev 22:4)."
    theological_principle:
      done: true
      notes: "God's knowing of His people is prior and complete; their knowing of Him is real, mediated through Christ, partial, and growing; it will be completed by sight at Christ's appearing. Consistent with statement-of-faith 'Sanctified now, glorified then' (glorification happens at sight of Him, 1 John 3:2; 2 Cor 3:18 degree by degree). No conflict found."
