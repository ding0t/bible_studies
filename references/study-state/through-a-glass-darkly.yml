genre: [epistle, topical]

thesis: "God has known you fully from the start; now He shows Himself to you in Jesus as in a mirror and in riddles, enough to love Him by while sleep and the world dull your sight; and when Christ appears you will see Him face to face and know Him as He knows you."
outline:
  - section: "A church that thought it saw clearly"
    says: "Corinth prized knowledge (1:5; 4:8; 8:1-3); Paul files every gift, his own included, under 'in part', and calls this whole age childhood (13:9-11; 3:1; 14:20)."
  - section: "A mirror and a riddle"
    says: "esoptron and ainigma (NT hapax; LXX Num 12:8 'not in riddles'): now every believer stands where the prophets stood; 'then' outruns Moses, who saw the LORD's form (temunah) but only His back (Exod 33:20-23), while Israel at Horeb saw no form at all (Deut 4:12)."
  - section: "The face in the mirror is Jesus"
    says: "What we see now is the glory of God in the face of Jesus Christ (2 Cor 3:18; 4:6; John 1:18; 14:9). The glimpses are real: Luke 9:32 (heavy with sleep; fully awake, they saw His glory), Luke 24:31, 2 Kgs 6:17, 2 Pet 1:19, Job 26:14."
  - section: "Why the glass seems darker than it is"
    says: "Scripture names the haze: our sleep (Mark 14:40; Rom 13:11; Eph 5:14; 1 Thess 5:6), the world in front of our eyes (2 Cor 4:18; 1 John 2:15-17; Col 3:1-2), and deception (2 Cor 11:3, 14; Heb 3:13). Romans 11:8's 'spirit of stupor' is God's judgment on unbelief, marked as a warning to believers rather than a description of them; the veil comes off when one turns to the Lord (2 Cor 3:16)."
  - section: "Fully known"
    says: "epegnosthen, aorist passive: God knew you first and fully (1 Cor 8:3; Gal 4:9; Phil 3:12's same active/passive pattern). Your partial knowing rests on His complete knowing."
  - section: "Face to face"
    says: "'Then' is Christ's appearing (1 Cor 1:7; 13:10, 12): 1 John 3:2; Rev 22:4; Matt 5:8; Ps 17:15 (when I awake, satisfied with your form); Job 19:26-27; John 17:24; 1 Thess 4:17. Link the siblings for the resurrection body and the intermediate state."
  - section: "What remains while we wait"
    says: "Faith, hope and love abide (13:13); love is greatest because it outlasts sight and is the very relation in which God knows us (8:3). Walk by faith (2 Cor 5:7; 1 Pet 1:8; Heb 11:27), press on to know Him (Phil 3:8-14), purify yourself in hope (1 John 3:3)."
