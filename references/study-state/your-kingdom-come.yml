position_recommendation_2026-10-01:
  asked_by: >
    Author: "I am not amillennial because of all the allegories you then need to assume. But do find a
    sound position." Question: land a recommendation between classic and progressive dispensationalism
    (or a sound mediating position), argued from the text across both Testaments.
  method: >
    Separate agent; no content file edited. Every ESV text below verified with study_verse
    (esv-study-bible). Greek from macula-greek-sblgnt via query.py; Rev 5:10 from na28-greek-nt.
    Commentary: ESV Study Bible, NIV Biblical Theology SB, NIV Cultural Backgrounds SB (study_note);
    Bible Knowledge Commentary read raw from $BIBLE_MEDIA_ROOT/reference EPUB (Toussaint on Acts,
    Barbieri on Matthew, Walvoord on Revelation); ANF vol. 1 (Justin, Irenaeus; open tier).
  recommendation: >
    Jesus reigns now as the risen Messiah at the Father's right hand over a real, present kingdom
    (Colossians 1:13; Ephesians 1:20-22; Matthew 28:18), but He takes up David's throne, reigning over a
    restored Israel and the nations on the earth, only at His return (Luke 1:32-33; Matthew 19:28;
    25:31; Revelation 3:21; Acts 3:21), because the kingdom offered to Israel was refused and its
    earthly establishment deferred until Israel welcomes Him (Matthew 23:39; Acts 3:19-21;
    Romans 11:25-29).
  label: >
    Revised (normative) dispensationalism, the position of the Bible Knowledge Commentary authors,
    with two points conceded to progressive dispensationalism: the present age is Christ's own
    kingdom in its first, hidden stage (Matthew 13:11, 41; Colossians 1:13), and "kingdom of heaven"
    and "kingdom of God" name one kingdom (Matthew 19:23-24, already argued in this study). It keeps
    classic dispensationalism's offer-and-postponement and its future Davidic throne; it drops the older
    Scofield-era split between a "kingdom of heaven" and a "kingdom of God", which this study's own
    exegesis of Matthew 19:23-24 already rules out. One-line form for the study: "Christ reigns now
    from His Father's throne; He reigns from David's throne when He returns."
  textual_case:
    - point: "Jesus dates His sitting on His own throne to His return."
      verses: "Matthew 25:31; Matthew 19:28; Luke 22:29-30"
      evidence: >
        Matt 25:31 "When the Son of Man comes in his glory ... then he will sit on his glorious throne"
        (ESV): hotan + aorist subjunctive elthē, then tote + future indicative kathisei (G2523). Matt
        19:28 likewise hotan kathisē "in the new world" (palingenesia, G3824), with the Twelve on twelve
        thrones "judging the twelve tribes of Israel". The throne is future, glorious, and tied to Israel's
        tribes. Confidence: high (the tenses are not in dispute).
    - point: "Jesus distinguishes 'my throne' from 'my Father's throne', and puts Himself on the second now."
      verses: "Revelation 3:21"
      evidence: >
        "I will grant him to sit with me on my throne, as I also conquered and sat down with my Father on
        his throne" (ESV). Greek en tō thronō mou ... ekathisa meta tou patros mou en tō thronō autou:
        same verb (kathizō, G2523) both times, two possessives. The present session is on the Father's
        throne; the believer's shared throne is future (dōsō, future). ESV Study Bible (note on 3:21)
        concedes "Premillennialists also see this as a promise of reigning with Christ in the millennium";
        NIV BTSB (note on 3:21) reads the two as one ("Jesus shares his Father's throne as Messianic
        king"). Confidence: moderate-high -- the distinction is in the text; whether it is meant as a
        distinction of thrones or only of possessors is the point contested.
    - point: "The Davidic promise names a reign over the house of Jacob, which is not yet happening."
      verses: "2 Samuel 7:12-16; Luke 1:32-33; Romans 11:25-26; Psalm 89 (via BKC)"
      evidence: >
        2 Sam 7:13, 16: "I will establish the throne of his kingdom forever ... Your throne shall be
        established forever." Luke 1:32-33: "the throne of his father David, and he will reign over the
        house of Jacob forever" (ESV). The house of Jacob is at present under "a partial hardening ...
        until the fullness of the Gentiles has come in" (Rom 11:25, ESV). A throne whose defined realm
        is Israel is not yet exercised over Israel. Confidence: high on the observation; the inference
        (therefore not yet occupied) is where progressive dispensationalists answer that the reign is
        inaugurated now and extended to Israel later.
    - point: "Heaven holds the Messiah until the restoration the prophets spoke of; the disciples' question about Israel's kingdom stands."
      verses: "Acts 1:6-7; Acts 3:19-21; Matthew 17:11; Malachi 4:6 (LXX 3:23)"
      evidence: >
        Acts 1:6 apokathistaneis (G600); Acts 3:21 "whom heaven must receive until the time for restoring
        all the things about which God spoke by the mouth of his holy prophets" -- apokatastaseōs (G605,
        only NT occurrence), the noun of the same verb. G600 occurs 8 times in the NT (macula-greek-sblgnt);
        in the LXX it is used of returning Israel to the land (Jer 16:15; Hos 11:11) and of Elijah's
        restoring work (Mal 3:23 LXX = English 4:6; cf. Matt 17:11). ESV Study Bible on Acts 3:21 --
        not a dispensational source -- reads it as "when Christ will return and his kingdom will be
        established on earth"; NIV CBSB on 3:21 says restoration of God's people "may be the primary
        focus here; see Ac 1:6". Jesus answered only the timing (Acts 1:7). Confidence: high.
    - point: "The kingdom was offered to Israel, refused, and its earthly arrival made to wait on Israel's welcome."
      verses: "Matthew 4:17; 10:5-7; 15:24; 11:14; 23:37-39; Acts 3:19-20; Luke 19:11-27"
      evidence: >
        The Twelve sent "nowhere among the Gentiles ... but ... to the lost sheep of the house of Israel"
        with "The kingdom of heaven is at hand" (Matt 10:5-7, ESV). "If you are willing to accept it, he is
        Elijah" (11:14) puts a condition on the forerunner. "You will not see me again, until you say,
        'Blessed is he who comes in the name of the Lord'" (23:39): heōs an + aorist subjunctive, the
        return keyed to Israel's confession of Psalm 118:26 (ESV Study Bible on 23:39: He "will once
        again come to his people ... when they are finally ready to receive him"). After the resurrection
        Peter renews it: "Repent ... that he may send the Christ appointed for you, Jesus" (Acts 3:19-20).
        Toussaint (BKC on Acts 3:19-21) answers "in the affirmative" whether Israel's repentance would
        have brought the kingdom, on the hopōs + subjunctive purpose clauses. The nobleman goes "into a far
        country to receive for himself a kingdom and then return" (Luke 19:12), told "because they
        supposed that the kingdom of God was to appear immediately" (19:11); the citizens say "We do not
        want this man to reign over us" (19:14). ESV SB on 19:12: the kingdom he receives is "the land
        from which he started out". Confidence: moderate-high. That the offer was sincere is textual;
        how a divinely foreknown refusal "postpones" is a theological question the texts do not answer.
    - point: "Daniel and Psalm 2 split the one kingdom across two stages: conferred in heaven, exercised on earth."
      verses: "Daniel 7:13-14, 26-27; Daniel 2:44; Psalm 2:6-9 with Acts 13:33 and Revelation 19:15; Mark 14:62; Zechariah 14:4, 9"
      evidence: >
        The son of man "came to the Ancient of Days" and "to him was given dominion ... and a kingdom"
        (Dan 7:13-14, ESV) -- a heavenly investiture; only after the court removes the last beast's
        dominion (7:26) is "the kingdom ... under the whole heaven" given to "the people of the saints of
        the Most High" (7:27). Psalm 2:7 is applied to the resurrection (Acts 13:33), Psalm 2:9's "rod of
        iron" to the return (Rev 19:15). Mark 14:62 puts the two side by side: "seated at the right hand
        of Power, and coming with the clouds of heaven". Zech 14:9 ("the LORD will be king over all the
        earth") follows His feet standing on the Mount of Olives (14:4). Confidence: high that the texts
        run in two stages; this is common ground with progressive dispensationalism.
    - point: "There is a present kingdom of the Son, and Matthew 13 names its form."
      verses: "Colossians 1:13; Matthew 13:11, 38-41; Revelation 1:9; 5:10; Matthew 12:28"
      evidence: >
        "transferred us to the kingdom of his beloved Son" (Col 1:13, ESV; metestēsen, aorist). The
        weeds grow in the world until the harvest, and "the Son of Man will send his angels, and they will
        gather out of his kingdom all causes of sin" (Matt 13:41) -- the present field is already called
        His kingdom. Rev 5:10 has both halves in one verse: "you have made them a kingdom and priests
        ... and they shall reign on the earth" (NA28 basileusousin, future; a present-tense variant
        exists and is not decisive). This is the ground on which strict classic dispensationalism
        (present age wholly outside the kingdom) is weakest, and why the recommendation keeps a real
        present kingdom. Confidence: high.
    - point: "The Son's reign runs past His coming to a handover at the end."
      verses: "1 Corinthians 15:23-28; Revelation 20:4-6; Revelation 11:15"
      evidence: >
        "each in his own order: Christ the firstfruits, then at his coming those who belong to Christ.
        Then comes the end" (1 Cor 15:23-24): epeita ... eita, sequence words leaving room for an interval.
        "he must reign until" (15:25, dei basileuein, present infinitive) is compatible with the reign
        beginning at the ascension (progressive) or at the parousia (revised); this site's
        new-heaven-and-new-earth.md already places the handover at Revelation 20:14. Rev 20:4-6: "reigned
        with Christ for a thousand years" after the beast (19:20). Confidence: moderate on 1 Cor 15:25's
        starting point; high on the order.
  ancient_witness: >
    Justin Martyr, Dialogue with Trypho 80 (ANF 1, open tier): "I and others, who are right-minded
    Christians on all points, are assured that there will be a resurrection of the dead, and a thousand
    years in Jerusalem, which will then be built, adorned, and enlarged, [as] the prophets Ezekiel and
    Isaiah and others declare." He concedes in the same chapter that "many who belong to the pure and
    pious faith, and are true Christians, think otherwise." Irenaeus, Against Heresies 5.33.3 (ANF 1):
    the patriarchal blessing "belongs unquestionably to the times of the kingdom, when the righteous
    shall bear rule upon their rising from the dead". Both read the promises of land, city and reign
    as earthly and future -- the convergence of Scripture's terms, Jewish expectation (NIV CBSB on Acts
    1:6: tribes, house of David, temple) and second-century reception that the memory note on ancient
    witness weights. They do not settle the Acts 2 question (whether the right hand is David's throne).
  counter_evidence:
    - text: "Acts 2:30-36 (with Psalm 110:1; Psalm 132:11)"
      strength: "The strongest text for progressive dispensationalism, and a serious one."
      case: >
        Peter cites the oath "that he would set one of his descendants on his throne" (2:30), then the
        resurrection (2:31-32), then "exalted at the right hand of God" (2:33) with Psalm 110:1 (2:34-35),
        and concludes "God has made him both Lord and Christ" (2:36). The chain runs oath -> resurrection
        -> session -> Christ, so the session looks like the oath's fulfilment.
      answer: >
        (1) What Peter draws from the oath is the resurrection: David "foresaw and spoke about the
        resurrection of the Christ" (2:31, ESV) -- a dead descendant cannot sit on any throne forever.
        (2) The verbs and places differ: 2:30 kathisai (G2523) epi ton thronon autou; 2:34 Kathou (kathēmai,
        G2521) ek dexiōn mou. Peter never says the right hand is David's throne. (3) Jesus names the
        right hand His Father's throne (Rev 3:21) and dates His own to His coming (Matt 25:31). (4) Psalm
        110:1 itself is an interval text: "Sit at my right hand, until I make your enemies your
        footstool"; Heb 10:12-13 describes the session as "waiting (ekdechomenos) from that time until".
        Toussaint, Bible Knowledge Commentary on Acts 15:16: "He is now seated at the right hand of God
        ... When He returns He will sit on David's throne." Residual weight: "made him ... Christ" means
        Jesus is already installed as the Davidic Messiah; the recommendation grants that (He reigns now
        as Messiah) and withholds only the identification of the right hand with David's throne.
        Confidence in the answer: moderate. This is the one place a careful reader could go the other way.
    - text: "Psalm 110:2 'Rule in the midst of your enemies!'; Ephesians 1:20-22; Matthew 28:18"
      strength: "Real; shows present messianic rule."
      answer: >
        Conceded in full. The recommendation's first clause is that Jesus reigns now. What these texts
        do not name is David's throne, Israel's restoration, or Zion on earth.
    - text: "Matthew 21:43 'the kingdom of God will be taken away from you and given to a people producing its fruits'"
      strength: "Moderate; the favourite amillennial text, and ambiguous for dispensationalists."
      answer: >
        21:45 identifies the "you": "the chief priests and the Pharisees ... perceived that he was speaking
        about them". ethnei (G1484) is singular and anarthrous. Barbieri (BKC on 21:40-46) sets out two
        readings -- the church, or a future repentant generation of Israel (Rom 11:26-27) -- and prefers
        the second. The text itself does not name the recipient. Either reading leaves Romans 11:29
        ("the gifts and the calling of God are irrevocable") standing. Mark as contested.
    - text: "Acts 15:14-18 (Amos 9:11-12)"
      strength: "Contested among premillennialists."
      answer: >
        Already handled in israels-regathering-and-refining.md: the ESV SB (on 15:16-18) reads Gentile
        inclusion as the time Amos foresaw; Toussaint (BKC) reads James as showing agreement with the
        prophets without claiming fulfilment, noting "After this" for Amos's "in that day" and that
        anastrepsō means a literal return. Either way the tent of David is rebuilt at a return.
    - text: "Luke 17:20-21 'the kingdom of God is in the midst of you'"
      strength: "Supports the 'already'; no threat to the recommendation."
      answer: >
        The same speech turns at once to "the days of the Son of Man" and "the Son of Man ... in his day"
        like lightning (17:22-24). Present in the King; visible at His day.
