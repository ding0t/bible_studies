    target: "docs/content/last-things/your-kingdom-come.md -- section '## How the \"already\" and the \"not yet\" fit together'"
    instructions: >
      Keep the opening sentence and the three bullets (the progressive bullet gains a clause naming
      Acts 2:30-36 as its main text). Replace the final paragraph ("The first two keep ... everything still
      future.") with the '### Where this study lands' subsection below. Net about +380 words (study ~2,650
