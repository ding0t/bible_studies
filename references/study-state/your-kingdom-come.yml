thesis: >
  "Your kingdom come" asks God to finish what He began in Jesus: His reign broke into the world when
  Jesus drove out demons by the Spirit of God (Matthew 12:28), and you pray toward the day He
  establishes it in full, visibly and on earth (Daniel 2:44; Matthew 25:34; Acts 1:6-7).
genre: [gospel]
word_budget: 4000
outline:
  - {section: "Where Jesus puts this petition", says: "Kingdom frames the sermon; the Kaddish parallel; Jesus adds Himself"}
  - {section: "What kingdom means", says: "basileia = reign; Daniel 2:44; kingdom of heaven = kingdom of God"}
  - {section: "Already here", says: "Matt 12:28, finger of God, Luke 17:21 (entos contested)"}
  - {section: "Not yet complete", says: "Matt 25:34, Acts 1:6-7, Revelation 19-20; three views of how the two fit"}
  - {section: "How the petition is phrased", says: "one active verb: the kingdom arrives; God's to bring"}
