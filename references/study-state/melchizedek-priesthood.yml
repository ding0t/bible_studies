    Approved fixing critical + moderate findings, with one explicit correction to my framing: the
    user is fine with quoting WEB/ASV instead of ESV where it genuinely serves the argument (e.g.
    preserves a construct-noun sense ESV's smoother rendering loses) -- the problem was the silent,
    unlabeled drift, not the translation choice itself. Asked that this be codified in the skill.
  fixes_applied:
    - target: translation-label-mismatch (critical)
      action: >
        Did not rewrite the "Priesthood before Sinai" section's wording to ESV. Instead added
        explicit inline labels at each quote, matching the site's existing "(reference, TRANSLATION)"
        convention already used elsewhere in this file: Numbers 3:7-8 -> ", ASV" (with a one-clause
        note on why ASV's "charge" was kept over ESV's "keep guard over him" -- it preserves the
        construct-noun sense more visibly); Genesis 8:20, Exodus 13:2, Exodus 32:26-29, Numbers
        3:12, Numbers 8:16 -> ", WEB" (all re-confirmed verbatim WEB matches before labeling, not
        assumed). Genesis 14:22's hybrid "El Elyon" rendering (matching no translation verbatim) was
        corrected to WEB's actual wording ("God Most High"), with the El-Elyon thematic point moved
        outside the quotation marks as commentary rather than presented as if it were translated
        text.
    - target: quote-fidelity-ch4-10 (moderate)
      action: >
        Fixed to match ESV exactly rather than relabeling to a different translation, since these
        were unintentional drift with no thematic reason to prefer another translation: "draw near
        with confidence" (both occurrences) corrected to ESV's actual word order "with confidence
        draw near to the throne of grace"; the 4:14-16 composite quote rewritten as two separate,
        fully accurate citations (4:14 now actually quotes "let us hold fast our confession,"
        matching what the surrounding prose's own framing claims, instead of silently substituting
        4:16's different exhortation) rather than one misleading ellipsis-spliced sentence; 9:23-24
        and 10:1 wording corrected to ESV's exact phrasing ("copies of the heavenly things," "has
        entered, not into holy places," "but a shadow... instead of the true form... of these
        realities").
    - target: context-coverage-gap-cultural-vs-transcultural (moderate)
      action: >
        Added an explicit paragraph to the Theological Principle section separating what's
        historically particular (the Chedorlaomer campaign, Levitical tithe mechanics, Second Temple
        speculation) from what transcends it (the letter's own priesthood/sacrifice claim, true
        regardless of those particulars) -- previously only present in this state file's research
        trail, not in the reader-facing text.
    - target: skill update (user-requested)
      action: >
        Added a paragraph to .claude/skills/develop-bible-study/SKILL.md's Phase 7 translation-label
        bullet: quoting WEB/ASV/another named translation instead of ESV is legitimate when it
        genuinely serves the argument (same spirit as Phase 6's existing translation-comparison
        step) -- the failure mode is doing so silently, not the choice itself. Instructs checking
        which work_id a lookup actually returned before treating it as ESV by default, and labeling
        every non-ESV quote inline, not only in the References summary.
  verification: >
    Style-guide grep clean (also caught and fixed one new "worth separating explicitly" narrated-
    argument phrase introduced while drafting the cultural-vs-transcultural paragraph). Frontmatter
    valid. validate-content.js: 0 errors, only the same two pre-existing unrelated warnings as
    before these fixes (proverbs commentary page, homepage frontmatter) -- nothing new introduced.
  status: fixes applied, not yet committed -- awaiting user instruction on committing this round.
