addendum_2026-07-31:
  trigger: >
    User supplied three raw YouTube-transcript files at references/biblefacts/ (Dr. Ken Johnson /
    BibleFacts Ministries -- the same source already named in docs/content/studies/prophecy/
    zadok-calendar.md) and asked for a review of fit/value, then asked to add what's usable into
    this study, explicitly requesting the addition be labeled: new ideas vs. expansion/maturation
    of existing ideas vs. other threads for future studies. User also stated a personal editorial
    stance -- Pauline authorship of Hebrews, not the anonymous/Origen position the draft had been
    using -- and asked for that to replace the existing framing.
  review_findings: >
    Format: unedited speech-to-text of live teaching streams, unusable as-is, needed full rewrite
    for any use. Content split three ways: (1) 11Q13 exegetical detail (Jubilee/Isa 61 catena,
    Ps 82 judgment quotation, Isa 52:7/Dan 9:25 messenger identification) -- broadly consistent
    with mainstream DSS scholarship already summarized for this study via web search in the prior
    session, genuinely additive detail beyond what was drafted. (2) Johnson's own chronological
    overlay (9th Jubilee + 1 Shemittah = ~AD 32) -- not in the scroll's own fragmentary text,
    already precedented as a named, explicitly-attributed claim on zadok-calendar.md, safe to use
    with the same attribution discipline. (3) A stronger claim in the transcripts ("Melchizedek is
    God in the Flesh," an unqualified identity with Jesus) that goes beyond what 11Q13's own
    "elohim" vocabulary requires (Ps 82, the very psalm 11Q13 quotes, applies "elohim" to human
    judges) -- presented as one view among others rather than adopted as the study's position.
    (4) Pauline-authorship material (Clement of Alexandria via Eusebius, Hist. Eccl. 6.14.2-4) --
    directly usable to satisfy the user's stated editorial stance, verified via WebSearch against
    the primary patristic citation rather than taken from the transcript's paraphrase. (5) Material
    NOT used in this study: Hebrews-11-as-faith-in-the-coming-Messiah reading, "walking in the
    light" as a DSS calendar/prophecy idiom, Sirach 44:16 + Enoch's rapture-as-repentance, and
    Victorinus of Pettau's "restrainer = the church" reading of 2 Thess 2 -- all genuinely
    interesting but not about Melchizedek/Hebrews 7, flagged as open threads for other pages
    (a possible standalone Hebrews 11 study; a Johannine-idioms study; additions to rapture.md's
    existing "restrainer removed" section).
  what_was_added: >
    (a) Setting paragraph rewritten to Pauline authorship, citing Clement of Alexandria/Pantaenus
    via Eusebius Hist. Eccl. 6.14.2-4 for the Hebrew-original/Luke-translation tradition and
    Clement's own two reasons for the missing signature (Jewish prejudice, Pauline modesty toward
    a non-Gentile audience); modern anonymous-authorship position kept as a named alternative the
    study doesn't follow, not deleted outright. (b) Qumran paragraph in "Between the Testaments"
    expanded from 3 sentences to roughly four paragraphs: the Lev 25/Deut 15/Isa 61 Jubilee catena
    with the deror word-link, the Isa 61:1/Luke 4:18-19 convergence, the Ps 82:1/John 10:34-36
    convergence, the Isa 52:7/Dan 9:25 messenger identification, an explicit distinction between
    11Q13's angelic/elohim-tier Melchizedek and Genesis 14's human one (so the two don't get
    silently merged), a fair statement of the stronger "God in the Flesh" identity view without
    adopting it as the study's own claim, and the Johnson/zadok-calendar chronology cross-link,
    explicitly attributed and flagged as his framework. (c) One new Key Lessons bullet on the
    Isa 61/Ps 82 convergence with Jesus's own usage. (d) References section: added Ken Johnson/
    BibleFacts Ministries as a named source, with the same attribution discipline as (b).
    (e) frontmatter bible_references expanded with the eight newly-cited passages.
  not_added_but_flagged_as_threads: >
    See review_findings item (5) above -- recorded here rather than in the published file per the
    skill's "process narration belongs in state YAML, not the reader-facing markdown" rule.
  followup_trim: >
    User reviewed and asked for the authorship paragraph to be small, with the point being
    canonicity rather than a resolved authorship debate. Setting paragraph cut from 6 sentences
    to 3: Pauline ascription + Clement/Eusebius citation, one sentence stating the letter's
    canonical standing doesn't depend on settling authorship, then straight into the
    audience/dating content. Dropped: Clement's two stated reasons for the missing signature, and
    the "modern scholarship treats it as anonymous" aside -- both true and citable but more than
    the paragraph needed. Full post-trim file re-verified: no leftover Origen reference, no
    style-guide-flagged phrases, all six footnote refs match their definitions, frontmatter valid.

