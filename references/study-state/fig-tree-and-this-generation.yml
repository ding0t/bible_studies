slug: "fig-tree-and-this-generation"
title: "The Fig Tree and This Generation"
status: published
target_path: "docs/content/last-things/fig-tree-and-this-generation.md"
primary_passage: "Matthew 24:32-35; Mark 13:28-31; Luke 21:29-33"
genre: "Gospel (prophetic discourse) with a parable"
word_budget: 4000
forked_from: "docs/content/last-things/olivet-discourse.md"
point: "The fig tree parable teaches inference from signs; its budding echoes Israel planted again in her land (a well-grounded, contested resonance); 'this generation' is the generation that sees the signs -- and no year to count from."
