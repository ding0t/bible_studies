      docs/content/last-things/olivet-discourse.md at commit dda393c: ## The Fig Tree, and What It Does Not Say + ## "This Generation" -- Whose, and of What?. Word studies and
      quotations were verified there (see olivet-discourse.yml review blocks) and are not redrafted.
      Needs develop-bible-study for its own opening, "In one sentence:" thesis, Key Takeaways and
      discussion questions; draft: true until then. When published, turn the plain-text pointer in
      olivet-discourse.md into a link.
  historical_context:
    done: true
    notes: >
      Tuesday of Passion Week (Matt 26:2: Passover two days off); four disciples on Olivet (Mark 13:3);
      spring -- a fig in leaf the day before (Mark 11:13). Saying sits between the coming (24:29-31)
      and "that day and hour" (24:36); same order in all three Synoptics.
  literary_context:
    done: true
    notes: >
      24:32-35 is a hinge: sequence behind, watchfulness ahead. πάντα ταῦτα links 33 and 34;
      παρέρχομαι + οὐ μή links 34 and 35; θύρα links 24:33 to 25:10 and James 5:9.
  hermeneutics:
    done: true
    notes: >
      View 5 (ESVSB) -- the generation that sees the signs begin. Consistent with statement-of-faith
      End times (pretrib, literal seventieth week). Contemporaries view (NIV BTSB, CBSB) set out as the
      main alternative with its strongest argument (Matthew's eight-for-eight usage) and the cost of
      view 5 named.
  israel_reading_revisited:
    done: true
    notes: >
      2026-09-27, at the author's request: the fig-as-Israel reading was investigated before being
      discounted. Findings: disciples saw the cursed fig withered "from the roots" the SAME morning
      (Mark 11:20; the old text wrongly said "three days earlier"/"watched it wither on Monday");
      ESVSB Mark 11:13-14 says its "specific reference" is Israel; Mark 11:20 shares xērainō + rhiza
      with LXX Hosea 9:16, and Hosea closes with Israel re-rooted (14:5-7); Jeremiah's good figs are
      returned to the land then given a heart (24:6-7), Ezekiel 36's order; Matt 23:39 "until"; 24:15-20
      presuppose Jews in Judea; the NIV BTSB note the old text cited against the reading assumes the
      Israel symbolism in Matt/Mark. Against: Jesus names no referent and applies the leaves to
      "all these things"; Luke's "all the trees"; sykē mostly ordinary; Monday's tree is cursed for
      ever so is not Tuesday's revived; Hosea 14 uses no fig. Judgment recorded in the study: the echo
      is well grounded and contested, a step below the stated lesson; a clock (1948+40) has no basis.
      Consistent with israels-regathering-and-refining.md "About 1948" (candidate stage, undated).
  draft:
    done: true
    notes: >
      2026-09-26 develop pass: added hook with primary-passage block quote, In one sentence, Key
      Takeaways, Study outline, "The Setting" section, "Near, at the Very Doors" theology section
      (24:33 subject, θύρα, 24:35-36), discussion questions, references. Moved text kept; fixed
      out-of-context references (four warnings, "next section documents", "four verses later"),
      recased divine pronouns, removed several antithesis constructions, set out the contemporaries
      view fairly. ~3,400 words of prose.
thesis: >
  As a fig tree's new leaves tell you summer is near, the signs Jesus named tell His people that He
  is at the doors; spoken on the day the disciples found Israel's cursed fig tree withered to its
  roots, the image also carries the prophets' promise that God will plant Israel in her land again;
  and "this generation" is the generation that sees those signs begin, for God has fixed the
  sequence, His Son's word guarantees it, and the date belongs to the Father alone.
outline:
  - "Hook + 24:32-35 quote + thesis"
  - "Key Takeaways -- prophecy of the sequence; Jesus' authority, nearness, deference to the Father"
  - "The Setting -- where the saying falls in the discourse; a fig in leaf that week"
  - "The Fig Tree and Israel -- the lesson Jesus draws; the case for hearing Israel (withered tree + Hosea 9:16 LXX, Jer 24:6-7, Matt 23:39, 24:15-20, NIV BTSB concession); settled vs contested; no clock"
  - "'This Generation' -- 'all these things' fixed by 24:33; contemporaries view with its strength; view 5 argued with its cost; AD 70 and 1948/1967 placed"
  - "Near, at the Very Doors -- God fixed the end and His Son's word guarantees it; the Father keeps the date; stay awake"
  - "Discussion questions; References"

