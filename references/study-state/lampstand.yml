review_2026-09-28:
  by: "review-bible-study (subagent), applied by the drafting session on the author's instruction"
  fixed:
    - "Removed the unsupported 'priest trimmed a lamp that smoked'; the priest's work now anchored in Exodus 30:7 ('when he dresses the lamps')."
    - "tamid is already in Exodus 27:20; Leviticus 24:2-4 repeats it."
    - "Zechariah 4:2 lips/spouts (ESV, CSB; ESVSB 49 wicks) vs pipes/channels (WEB, NKJV, NIV) stated correctly; CSB misattribution removed."
    - "Tree-of-life quote cited to Revelation 2:7 alone; 'plant names' sentence corrected for yarekh; Revelation 1:10 cited."
    - "Talmud cited from the Aramaic (Samuel in the name of an elder), not the CC-BY-NC English; Rashi named in the Rosenbaum-Silbermann translation; 'straight' marked as an inference from 'slantwise'."
    - "Revelation 11: the symbolic reading given its case (1:20; 11:7 // 13:7; Deut 19:15); straw contrast removed."
    - "High-priestly robe marked 'most likely' in the thesis and takeaways; 'the light is Jesus' replaced by the text's 'its lamp is the Lamb'; table alternative now royal (Isa 22:21) or Daniel 10:5."
    - "1 Samuel 3:3 and the alah/Noah comparison marked as readings; Revelation 4:5 torches with Ezekiel 1:13 (NIVBT) as the alternative allusion."
    - "Closing section rewritten to teach rather than restate the takeaways; negative openers removed."
    - "Plate: lamps at one level labelled as Rashi's reading."

