# Pilot page of the series jesus/the-heavenly-pattern/ (one furnishing per page, each traced
# Sinai -> Solomon -> Zechariah/Ezekiel -> Christ and heaven, each with a generated plate).
# The series index ("According to the pattern") is not yet written; this page sets the template.

