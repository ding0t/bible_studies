    - "Revelation 11 rewritten: the Zechariah allusion (article, 'stand before the Lord of the earth', one lampstand + two trees -> two of each); three readings (witnessing church; Enoch and Elijah with Tertullian De Anima 50 and Hippolytus Christ and Antichrist 43, ANF 3 and 5, patristics corpus on BIBLE_MEDIA_ROOT; Moses and Elijah as this study's reading)."
