open_questions:
  - "Rev 1:13 robe and sash: priestly (Exodus 28:4; NIVBT allows both) or Danielic (Daniel 10:5, CBSB). Draft marks it contested and argues the priestly reading from 2:1, 2:5."
  - "Rev 11:4 two witnesses: the page leans on the dispensational reading (two individuals, 1,260 days, Jerusalem 11:8) and states the symbolic reading (ESVSB). Consistent with statement-of-faith pretribulation position -- the text itself re-identifies the lampstands in ch. 11, so they need not be the church."
  - "Talmud's ornament count (22 goblets, 11 knobs, 9 flowers; b. Menahot 28b) differs from a plain reading of Exodus 25:33-35; mention only in the plate annex."
  - "Ezekiel's temple (40-48) has sacrifices (43:18-27); statement-of-faith.md is silent. Needed before the series' Ezekiel sections, not for this page."
