genre: [law, ot-narrative, prophets, apocalyptic, topical]

thesis: >
  God told Moses to hammer one lampstand out of a single talent of gold, shaped as an almond tree
  in flower and kept burning before Him every night on oil His people brought; Revelation shows
  what that pictured, as the risen Jesus, robed as High Priest, walks among His churches as their
  lampstands, keeping them alight by His Spirit and keeping the right to remove one that stops
  shining.
outline:
  - section: "Hook + In one sentence + Key Takeaways + Study outline"
    says: "John turns on Patmos and sees tabernacle furniture: lampstands, and one walking among them."
  - section: "Made after the pattern (Exodus 25:31-40)"
    says: "One piece hammered from a talent of gold; counts but no measurements; the plate; what 'being shown' means (hophal participle) and Numbers 8:4's mar'eh."
  - section: "The almond: a tree that watches"
    says: "meshuqqadim is used only of the lampstand; same TWOT root as shaqed/shoqed (Jeremiah 1:11-12); Aaron's rod bore almonds (Numbers 17:8). Tree-of-life reading marked as commentators', not the text's."
  - section: "Tended every night"
    says: "Oil brought by the people, beaten olives; Aaron arranges it evening to morning, tamid; lamps 'raised up' (lit.); light falls in front, across to the table (Numbers 8:2; 26:35); 1 Samuel 3:3."
  - section: "From one lampstand to ten, and to none"
    says: "Solomon's ten (1 Kings 7:49), David's silver ones in the pattern (1 Chronicles 28:15), carried off (Jeremiah 52:19); Zechariah 4: a lampstand fed from olive trees with no priest -- 'by my Spirit'; absent from Ezekiel 40-48 (verified: menorah count 0)."
  - section: "Seven lampstands on Patmos (Revelation 1:12-2:5)"
    says: "Tier 1: 1:20 interprets. The one among them wears the poderes, the LXX word for the high priest's robe (contested: Daniel 10:5, royal). He walks among them (2:1) as Aaron tended the lamps; he threatens to remove a lampstand (2:5); the same letter promises the tree of life (2:7)."
  - section: "Before the throne and in the city"
    says: "Seven torches = seven spirits (4:5, echoing Zechariah 4); two lampstands = two witnesses (11:4; contested; dispensational reading of two individuals in the tribulation, consistent with pretribulation rapture); the Lamb is the city's lamp (21:23; 22:5)."
  - section: "What the lampstand shows about God"
    says: "Theological principle; tier table (NT explicit / NT echo / tradition)."
  - section: "Discussion questions; References"
    says: ""
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: >
      Chosen as pilot because it is Tier 1 early in Revelation: Revelation 1:20 interprets the seven
      lampstands itself ("the seven lampstands are the seven churches"). Series placement and the
      three-tier typology rule (NT explicit / NT echo / later tradition) agreed with the author
      2026-09-28. Plate to be generated by utils/sanctuary_plates.py from a data file tagging each
      measurement given / inferred / unstated.
  exegesis:
    historical_context:
      done: true
      notes: >
        Sinai instructions (Exodus 25-31) and their execution (35-40); the lampstand stands on the
        south side of the Holy Place opposite the table (26:35; 40:24). Solomon made ten, five on
        each side, before the inner sanctuary (1 Kings 7:49; 2 Chronicles 4:7); Babylon carried off
        lampstands (Jeremiah 52:19). Zechariah 4 is set in the rebuilding under Zerubbabel and
        Joshua (c. 520 BC). Revelation addressed to seven churches in Asia; CBSB: the seven-branched
        lampstand was the commonest symbol of Judaism across the Mediterranean.
    literary_context:
      done: true
      notes: >
        Exodus 25 moves ark -> table -> lampstand; the lampstand closes with the pattern command
        (25:40). Numbers 8:1-4 gives its operation. Revelation 1:9-20 is the inaugural vision that
        each of the seven letters draws its self-description from (Ephesus: 2:1).
    content_word_studies:
      done: true
      notes: >
        Exodus 25:40 "being shown" is a hophal participle (mor'eh, H7200): the pattern is shown as
        Moses stands there. Numbers 8:4 uses mar'eh (H4758, "appearance/vision"), not tabnit.
        meshuqqadim (H8246, pual participle, "almond-shaped") occurs 6x, all in Exodus 25 and 37 --
        only of the lampstand. TWOT files it under root 2451 with shaqad "watch" (H8245) and shaqed
        "almond" (H8247); Jeremiah 1:11-12 is the pun. qaneh (H7070) "stalk/reed" for the
        branches; yarekh (H3409) "thigh" for the base. Lamps are "raised up" (he'elah, H5927; LSB
        footnote "Lit raise up" at Exodus 25:37, Numbers 8:2; "Lit ascend" 27:20). tamid (H8548)
        "regularly/continually". lychnia (G3087): 12x in SBLGNT -- Revelation 1:12, 13, 20 (2x), 2:1,
        2:5, 11:4; Hebrews 9:2; the lamp-on-a-stand sayings (Matthew 5:15; Mark 4:21; Luke 8:16;
        11:33). poderes (G4158): only Revelation 1:13 in the NT; LXX uses it for the high priest's
        robe (Exodus 28:4, 31; 29:5), Joshua the high priest (Zechariah 3:4), the man in linen
        (Ezekiel 9:2, 3, 11), Aaron (Wisdom 18:24; Sirach 45:8). Zechariah 4:14 "sons of fresh oil"
        (yitshar, H3323). Revelation 4:5 lampades (G2985), "torches".
      terms:
        - {word: "מְנוֹרָה", language: hebrew, transliteration: "menorah", strongs_id: "H4501", gloss: "lampstand"}
        - {word: "מִקְשָׁה", language: hebrew, transliteration: "miqshah", strongs_id: "H4749", gloss: "hammered work"}
        - {word: "מְשֻׁקָּדִים", language: hebrew, transliteration: "meshuqqadim", strongs_id: "H8246", gloss: "shaped like almond blossoms"}
        - {word: "שָׁקֵד", language: hebrew, transliteration: "shaqed", strongs_id: "H8247", gloss: "almond"}
        - {word: "שֹׁקֵד", language: hebrew, transliteration: "shoqed", strongs_id: "H8245", gloss: "watching"}
        - {word: "תַּבְנִית", language: hebrew, transliteration: "tabnit", strongs_id: "H8403", gloss: "pattern"}
        - {word: "תָּמִיד", language: hebrew, transliteration: "tamid", strongs_id: "H8548", gloss: "continually"}
        - {word: "λυχνία", language: greek, transliteration: "lychnia", strongs_id: "G3087", gloss: "lampstand"}
        - {word: "ποδήρης", language: greek, transliteration: "podērēs", strongs_id: "G4158", gloss: "robe reaching to the feet"}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "The object, its oil supply and the priestly rota are tied to the tabernacle; God's will to keep a light before Him, supplied by His people and tended by a priest, carries to the church through Revelation 1:20."
    theological_principle:
      done: true
      notes: "God keeps a light before Him and wants His people to hold it; Jesus is the High Priest who tends His churches as lampstands, by the Holy Spirit, and He is the light itself in the city."
    application_draft:
      done: true
      notes: "Be Transformed: church as lampstand; depend on the Spirit; pray for one church by name."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Revelation 1:20", relation: "Tier 1: the text interprets the lampstands as churches"}
      - {ref: "Zechariah 4:2-6", relation: "Allusion behind Revelation 4:5 and 11:4 (CBSB, NIVBT); bible_trace finds no derived link -- Revelation paraphrases"}
      - {ref: "Leviticus 26:12", relation: "Possible echo behind 'walks among' (Rev 2:1): LXX emperipateo vs Rev peripateo; tier 2 at most"}
      - {ref: "Revelation 2:7", relation: "Same letter as the lampstand threat promises the tree of life"}
    translations_compared: ["ESV", "WEB", "LSB footnotes", "CSB footnotes", "ULT interlinear"]
    divergences_noted: "Zech 4:2 'seven lips' (ESV) vs 'seven pipes' (WEB); Zech 4:14 'anointed ones' vs 'sons of fresh oil' (lit.)."
  drafting:
    done: true
    file: "docs/content/jesus/the-heavenly-pattern/lampstand.md"
  review:
    done: false
    validated: false

