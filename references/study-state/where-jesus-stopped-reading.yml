open_questions:
  - "contested: whether Jesus joined Isaiah 58:6 by a skip (Mishnah Megillah 4:4) or Luke's Greek gives the reading that way; say both"
  - "contested: whether the stop marks an interval (the BKC; this site) or only the emphasis of a sermon on grace; the case for the interval is the New Testament's placing of the vengeance (2 Thessalonians 1:7-8), not Isaiah's grammar"
  - "Luke 21:22's 'days of vengeance' shares Hosea 9:7 and Deuteronomy 32:35 LXX's ἐκδίκησις, not Isaiah 61:2 LXX's ἀνταπόδοσις: mention with that limit, or leave out"
