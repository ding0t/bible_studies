stages:
  scoping:
    done: true
    notes: >-
      Findings carried from the project state file (re-query, never re-read): Luke 4:18 leaves out
      'to heal the brokenhearted' and splices in Isaiah 58:6 LXX ('to send the oppressed away in
      release'); Matthew 11:5 makes the same cut on Isaiah 35:4-6; Isaiah 34:8 and 63:4 pair 'day'
      and 'year' on one side; 11Q13 ii and 4Q521 2 ii read Isaiah 61 of the last days before Christ;
      2 Corinthians 6:2 puts Isaiah 49:8's 'time of favour' (dektos) in the present.
  exegesis:
    historical_context:
      done: true
      notes: >-
        Synagogue reading of the Law and the Prophets (Acts 13:15); stand to read, sit to teach
        (Luke 4:16, 20). Mishnah Megillah 4:4 (Sefaria Community Translation, CC0): 'Passages may
        be skipped over in the reading of the Prophets, but not in that of the Holy Law', while the
        meturgeman has not finished; the Mishnah is later than Jesus (date it in the study).
        Targum Jonathan, Isaiah 61:1 opens 'The prophet said' (Pauli 1871).
    literary_context:
      done: true
      notes: >-
        Isaiah 61:1-11 (BSB section 'The Year of the LORD's Favor'; editorial). The speaker carries
        the Spirit as 11:2, 42:1 and 48:16; 61:4-9 is Zion rebuilt with foreigners serving (61:5).
        Isaiah 34:8 and 63:4 pair day and year as one time (LXX ἀνταπόδοσις). Luke 4:16-30 is
        Luke's programmatic opening (parallels Matthew 13:53-58; Mark 6:1-6). Matthew 11:2-6 / Luke
        7:18-23 answers John with Isaiah 35:5-6 and 61:1 cut before 35:4; John had preached the axe
        and fire (Luke 3:9, 17).
    content_word_studies:
