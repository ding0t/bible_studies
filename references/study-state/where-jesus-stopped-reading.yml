genre: [prophets, gospel]

thesis: >-
  At Nazareth Jesus read Isaiah 61 as His own commission, shaped it to say what began that day
  (release, Luke's word for the forgiveness of sins, proclaimed to the poor and, as the synagogue
  heard with rage, to the Gentiles) and closed the scroll before "the day of vengeance", which waits
  for His return; the year of the Lord's favour is now.
outline:
  - {section: "hook", says: "the scroll rolled up in the middle of a sentence"}
  - {section: "Key Takeaways", says: "types and prophecy, lessons about Jesus, memory verses, Be Transformed, prayer"}
  - {section: "A Sabbath in Nazareth", says: "stand to read, sit to teach; the Law and the Prophets (Acts 13:15); the Mishnah allows a skip in the Prophets (Megillah 4:4); the interpreter's Aramaic is the Targum"}
  - {section: "Isaiah 61 in Isaiah", says: "the Spirit-anointed speaker (11:2; 42:1; 48:16) whom the Targum gives to the prophet; the Jubilee's derôr (link Melchizedek); in Isaiah's poetry the year and the day are one time (34:8; 63:4)"}
  - {section: "What Jesus read", says: "the Septuagint and Luke side by side: the cut (heal the brokenhearted), the splice joined on aphesis (Isaiah 58:6 LXX), the stop; aphesis is the forgiveness of sins in its other 8 uses in Luke-Acts (10 in all, 2 of them here)"}
  - {section: "Today: why He stopped", says: "the year fulfilled, the day kept back; the same cut for John, who had preached the axe and the fire (Matthew 11:2-6; Isaiah 35:4; Luke 3:9, 17); vengeance at His revealing (2 Thessalonians 1:7-8); now is the time of favour (2 Corinthians 6:2); the objection from Isaiah's pairing, with the confidence marked"}
  - {section: "No one had divided the sentence", says: "11Q13 keeps favour and vengeance in one figure's act; 4Q521 has Matthew 11:5's list, the dead raised included; the Targum gives the chapter to Isaiah"}
  - {section: "Why Nazareth turned", says: "'words of grace' (4:22); dektos twice, the year 'acceptable' and the prophet not (4:19, 24); Elijah and Elisha sent to Gentiles (4:25-27); Luke 24:47 closes the Gospel with the same proclamation to all nations"}
  - {section: "The year of the Lord's favour, now", says: "the doctrine: forgiveness of sins proclaimed while judgment waits; God's patience (2 Peter 3:9); the comfort for Zion still to come; application"}
  - {section: "Discussion questions; References", says: "facets mirroring Key Takeaways"}
