        - {word: "נָקָם", language: hebrew, transliteration: "naqam", strongs_id: "H5359", gloss: "vengeance", notes: "Isaiah 61:2; 34:8; 63:4; LXX ἀνταπόδοσις in all three"}
        - {word: "דְּרוֹר", language: hebrew, transliteration: "derôr", strongs_id: "H1865", gloss: "liberty, release", notes: "covered by the Melchizedek study; link"}
