        - {word: "δεκτός", language: greek, transliteration: "dektos", strongs_id: "G1184", gloss: "acceptable, favourable", notes: "Luke 4:19 the year; 4:24 no prophet is dektos; 2 Corinthians 6:2 (Isaiah 49:8 LXX)"}
