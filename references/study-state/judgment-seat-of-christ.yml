genre: ["epistle", "apocalyptic", "prophets", "topical"]

thesis: >-
  Every believer will stand before the judgment seat of Christ, clothed in a robe washed in His
  blood, to receive reward or loss for what was built on Him; that is a different judgment from the
  great white throne, and both the robe and the reward are His gift.

outline:
  - {section: "Key Takeaways", says: "Lessons about Jesus, memory verses, Be Transformed, prayer."}
  - {section: "Study outline", says: "Map."}
  - {section: "What the Old Testament already said", says: "God Himself the reward (Gen 15:1, sakar); Ps 62:12 love and repayment in one verse; Isa 40:10/62:11 'his reward is with him' which Jesus takes as His own in Rev 22:12; Dan 12:2-3 two outcomes and degrees among the righteous; Mal 3:16-18 book of remembrance."}
  - {section: "The judgment seat", says: "2 Cor 5:10 in context of 5:1-9 (aim to please Him); bēma in one paragraph + link; 'judgment seat of God' (Rom 14:10) and 'of Christ' are one seat because the Father gave all judgment to the Son (John 5:22); the vocabulary is appear/test/receive/wages/commendation (phaneroō, dokimazō, komizō, misthos, epainos)."}
  - {section: "Good or evil: what loss means", says: "phaulos is the word of John 5:29 and 3:20: Paul does not soften it. Loss, shame at His coming (1 John 2:28), forfeited reward (2 John 8; Rev 3:11), Col 3:25; never condemnation (John 5:24; Rom 8:1)."}
  - {section: "Reward without works-salvation", says: "misthos is the wages word of Rom 4:4; salvation is never called misthos (Rom 4:4-5; 11:6; Eph 2:8-9); reward is for the already-saved, for work God prepared and works in them (Eph 2:10; Phil 2:13; 1 Cor 15:10); even it is received (1 Cor 4:7); crowns cast before the throne (Rev 4:10-11); Luke 17:10."}
  - {section: "Two garments", says: "stolē leukē, the white robe: given (6:11), washed white in the blood of the Lamb (7:14), the right to the tree of life (22:14; KJV 'do his commandments' is the TR variant); Luke 15:22 best robe; Isa 61:10, Zech 3:4. byssinos, fine linen = dikaiōmata, righteous deeds, still 'granted' (19:8). The robe answers whether you may stand; the linen what you did with what you were given. Table."}
  - {section: "Two judgments", says: "Table: seat, judge, who, when, books, question, outcome. Why they differ: John 5:24 vs 5:29; first resurrection vs rest of dead (Rev 20:5-6; 1 Cor 15:23; Luke 14:14); Christ judges both (John 5:22, 27; Acts 17:31)."}
  - {section: "Where the reading is contested", says: "One general judgment view: Matt 25:31-46, Rev 11:18, Rom 2:6-7, the book of life opened at 20:12; ESV Study Bible note. The dispensational case: Rev 20:5 thousand-year gap, John 5:24. Honest: who stands at the throne beyond the unbelieving dead is the reading's inference."}
  - {section: "Discussion questions", says: "Five facets."}
  - {section: "References", says: "Sources."}
