note: >
  Requested 2026-10-14 by the author to back the statement of faith's "Reward for the believer",
  which had grown into a long explanation. Brief: say what the OT and NT teach about the believer's
  reward, keep it from reading as salvation by works, keep it distinct from the white robes given
  (Revelation 6:11; 7:14), and differentiate it from the great white throne and say why. The
  statement-of-faith section shrinks to a short confession linking here; its Resources list moves
  to resources/recommended.md. Author approved the scope in-session (no separate thesis stop).

