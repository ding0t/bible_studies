slug: at-home-with-the-lord
title: "At Home with the Lord"
status: drafted
target_path: docs/content/last-things/at-home-with-the-lord.md
primary_passage: "2 Corinthians 5:1-10"
supporting_passages: ["Philippians 1:21-24", "1 Thessalonians 4:13-18", "1 Corinthians 15:20-23", "1 Corinthians 15:51-53", "Revelation 6:9-11", "Luke 16:19-31", "Luke 23:43", "Ephesians 4:8-10"]
genre: [epistle]
origin: >
  Forked 2026-09-26 by the simplify-bible-study pass (readability sweep) from
  docs/content/jesus/three-days-and-three-nights.md at commit 950ec59.
point: >
  Since the ascension the believing dead are with Christ, conscious and without the body, waiting
  for the bodily resurrection at His coming.
thesis: >-
  Since the ascension, a believer who dies goes at once to be at home with the Lord Jesus, conscious
  and without the body, and waits there for the resurrection of the body at His coming; God keeps the
  whole person, the soul with His Son now and the body for the day He raises it.
outline:
  - {section: "The passage in its letter", says: "Paul wrote 5:1-8 after despairing of life in Asia (1:8-9); the unit runs 4:16-5:10 and answers how a wasting body faces death with courage."}
  - {section: "Two verbs for home", says: "endēmeō/ekdēmeō swap between 5:6 and 5:8 -- death moves the believer's home from the body to the Lord; the Spirit is God's arrabōn that it will happen."}
  - {section: "Away from the body, at home with the Lord", says: "At death the believer is with Christ, conscious and waiting (Phil 1:23; Rev 6:9-11; Luke 23:43); 'naked' in 5:3 is contested, both readings given."}
  - {section: "The body, still owed", says: "The resurrection is a separate, future, bodily event at His coming; three states side by side; Christ the firstfruits."}
  - {section: "Where were they before?", says: "The two-compartment reading of Hades (held in the parent) and Ephesians 4:8-10, marked contested."}
  - {section: "The whole arrangement in one view", says: "Mermaid diagram: before / now / at His coming, two tracks."}
  - {section: "Larkin's own chart", says: "Historical witness to the classic dispensational picture, with the points this study does not follow named."}
word_budget: 4000
word_budget_reason: ""
