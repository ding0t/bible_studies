genre_notes: >
  Epistle. Occasion: Paul's near-death in Asia (2 Cor 1:8-9) and opponents who said his suffering
  disqualified him (ESV SB intro). Paul marks the at-home/away pair as the believer's general
  condition ("we"), not local practice.
