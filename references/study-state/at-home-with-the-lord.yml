open_questions:
  - Parent three-days-and-three-nights.md carries a plain-text pointer to this study ("a separate
    study in preparation"); turn it into a link when this is published.
  - The word "naked" (2 Cor 5:3) is marked contested; the study takes the ESV SB intermediate-state reading
    and rests the thesis on 5:8 instead. Author may want to weigh this.
  - The two-compartment reading of Hades is the parent's position (historic dispensational); the
    commentaries mostly read Abraham's side as heaven. Statement-of-faith is silent on the
    intermediate state -- no conflict found.
  - Placement -- last-things/ kept (personal eschatology, category prophecy). salvation/ now exists
    and its taxonomy blurb lists "death"; author may prefer it there.
  - Ephesians 4:8-10 is marked contested and not relied on; the Larkin chart is framed as
    historical witness.
