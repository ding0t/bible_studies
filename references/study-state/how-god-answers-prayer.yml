slug: how-god-answers-prayer
title: "How God Answers Prayer"
status: published
target_path: docs/content/christian-life/how-god-answers-prayer.md
primary_passage: "Daniel 10:12-13"
point: >
  God hears every prayer at once, answers by varied routes and on His own timetable -- sometimes
  unrecognised while it happens -- and keeps His people's prayers.
