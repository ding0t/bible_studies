    - "Minor: John 12:29 'Some said' paraphrase misattributed the crowd's words; now 'The crowd said'. Antitheses ('not ... dismissing one as weather', 'not spent on delivery', 'kept rather than declined', 'Not at the end ... At the beginning') rewritten affirmatively."
