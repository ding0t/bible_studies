    done: true
    notes: >
      Forked verbatim on 2026-09-26 (simplify-bible-study, readability-sweep-2026-09) from
      docs/content/last-things/olivet-discourse.md at commit dda393c: ## "Heaven and Earth Will Pass Away" (all subsections). Word studies and
