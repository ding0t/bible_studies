  scope:
    done: true
    notes: "Primary passage Matthew 24:35 with 2 Peter 3:1-14 and 1 Thessalonians 5:1-11 as its two apostolic echoes. 2 Peter 3:3-9's own argument (scoffers, flood, 3:8 ratio) deliberately left to day-is-a-thousand-years.md and linked."
  historical_context:
    done: true
    notes: "Mark 13:3 (Peter among the four hearers); 2 Peter as second letter (3:1), eyewitness claim (1:16); 1 Thessalonians AD 49-51 from Corinth per ESV Study Bible introduction."
  literary_context:
    done: true
    notes: "24:35 closes the fig-tree paragraph (24:32-35) and hinges to 24:36; identical in Mark 13:31 and Luke 21:33. 1 Thess 5:1-11 follows 4:13-18 and answers 'times and seasons'."
  content_words:
    done: true
    notes: "parerchomai (moved, re-checked in 2 Peter count); ou me + aorist subjunctive at 24:34 and 24:35 (NA28); chronon kai kairon (1 Thess 5:1) = Acts 1:7 pair; heurethesetai variant at 2 Pet 3:10 (SBLGNT vs NA28 vs CSB/LSB footnotes)."
  hermeneutics:
    done: true
    notes: "Principle: Jesus' words carry God's own permanence (Isa 51:6; 40:8; Matt 5:18), so the promised return is certain and the right response is watchful holiness (2 Pet 3:11-14; 1 Thess 5:6-11). Consistent with statement-of-faith End times: pretrib (1 Thess 5:9 read with 4:13-18), literal millennium, new heaven and earth after Rev 20:11-15."
  cross_reference:
    done: true
    notes: "passage_brief on Matt 24:35 (leads: Isa 40:8, Isa 51:6, Matt 5:18, 2 Pet 3:7). cross_study_claims '2 Peter 3': no contradiction with day-is-a-thousand-years, day-is-near, immediately-after, olivet-discourse."
  draft:
    done: true
    notes: "Drafted 2026-09-27 without the thesis/outline stop (author-approved for fork jobs). Hook, In one sentence, Key Takeaways (standard opening line), Study outline, four new sections around the moved text, discussion questions, References."
