slug: "heaven-and-earth-will-pass-away"
title: "Heaven and Earth Will Pass Away"
status: drafted
target_path: "docs/content/last-things/heaven-and-earth-will-pass-away.md"
primary_passage: "Matthew 24:35"
forked_from: "docs/content/last-things/olivet-discourse.md"
genre: "Gospel (prophetic discourse), with epistle (2 Peter 3; 1 Thessalonians 5)"
word_budget: 4000
point: "Peter and Paul carried the discourse's verbs and images (parousia, the flood, the thief, labour pains) into 2 Peter 3 and 1 Thessalonians 5 for the same command to stay awake."
thesis: >
  Jesus staked His words against heaven and earth, and Peter and Paul built their teaching on the
  day of the Lord out of those words, so God's promise that His Son is coming is the most certain
  thing in creation, and you are to meet it awake.
outline:
  - "One sentence on the Mount of Olives: 24:34-35 as one sentence; parerchomai in two senses; ou me."
  - "Words that outlast creation: Isaiah 51:6 and Matthew 5:18 show Jesus claiming God's permanence for His own words (deity of Christ)."
  - "Peter's echo: 2 Peter's setting in one paragraph (3:3-9 left to day-is-a-thousand-years), the moved borrowing table, and 3:11-14's call to holiness."
  - "What passes, and what comes: the 3:10 'will be found' variant, renewal vs replacement (contested, both sides), and the dispensational placement after the millennium (Rev 20-21)."
  - "Paul's thief: 1 Thess 5:1-11 -- times and seasons (Acts 1:7), thief and labour pains, children of the day, 5:9-10 grounded in the cross; pretrib reading marked as this site's, with the alternative."
  - "The thief image, traced: moved mermaid and Revelation 16:15 close."
