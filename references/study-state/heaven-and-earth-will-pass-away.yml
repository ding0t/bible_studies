  applied: "C1 hook: Paul received the teaching (1 Thess 4:15), not a hearer. C2 thief: seven occurrences incl. Luke 12:39; Rev 3:3 conditional; the rest one day of the Lord in stages (author decision), sourced to BKC Gangel on 2 Pet 3:10; rapture.md table cell corrected to match. C3 'single sentence' -> 'one saying'. M5 labour pains: Isa 13:8, Matt 24:8 'beginning'; Luke 21:34-36 parallel (aiphnidios G160 only Luke 21:34 and 1 Thess 5:3; ephistemi; ekpheugo). M6 Renewal or replacement rewritten from new research (author asked): words of ending vs words of change (Rom 8:21; Heb 1:11-12 allasso G236 = 1 Cor 15:51; 2 Pet 3:6; Matt 19:28; Acts 3:21; Rev 21:5), NA28 'will not be found', Walvoord replacement, NIV BTSB both, Irenaeus; leans renewal through judgment, marked. M7 Heb 1:10-12 / Ps 102 and 1 Pet 1:24-25 added. Minors: Synoptic plural verb, Luke 16:17, 'at' the throne, Acts 1:7 inference softened."

