revision_2026-10-17:
  author_direction: "Drop the hotline (no external services named). Investigate 1 Timothy 2:12 and Malachi 2:16 / weaker vessel from the text. Discuss Ephesians 5:31-32. Keep secular positions out; do not overclaim. Simplify subagent to follow."
  changed:
    - "Thesis: no longer claims every submission text sits inside mutual submission (1 Peter 3, Colossians 3, Titus 2 do not); restated as addressed to the wife, as to the Lord, beside the husband's call to love and honour."
    - "Ephesians 5:21 ἀλλήλοις marked contested: reciprocal in Ephesians 4:2, 25, 32 (G240, 4 uses in Ephesians) vs ESVSB 'according to the authority and order established by God' from 5:22-6:9. 5:24 'in everything' now quoted, limited by 'as to the Lord'. 'Paul gives the head no right of command' removed."
    - "New subsection 'The mystery of one flesh' (Ephesians 5:31-33; Genesis 2:24; Matthew 19:8)."
    - "1 Peter 3:7: Greek set out; comparative ἀσθενεστέρῳ implies both are vessels (σκεῦος, 2 Corinthians 4:7); two ὡς clauses (weakness -> live with according to knowledge; co-heirs -> honour), CSB/NASB/LSB vs ESV attachment; 1 Corinthians 12:22-23 same comparative -> greater honour; kind of weakness unspecified (ἀσθενής of body Matthew 26:41, of standing 1 Corinthians 1:27), study notes reported, mental/spiritual weakness excluded by co-heirship."
    - "1 Corinthians 14: σιγάω 3x in 1 Corinthians, all 14:28, 30, 34 (G4601); ὑποτάσσω 14:32/14:34 supports reading 1; μαθεῖν 14:35 / μανθάνωσιν 14:31 supports reading 2. CBSB cultural claims removed."
    - "1 Timothy 2: settled points listed (μανθανέτω command; ἡσυχία G2271 4x incl. Acts 22:2, 2 Thessalonians 3:12; αὐθεντέω G831 once in NT, verb absent from Brenton LXX by text search -- only the noun αὐθέντης Wisdom 12:6 and αὐθεντία 3 Maccabees 2:29; γάρ reasons). KJV/NLT 'usurp' no longer carries reading 2; reading 2 now rests on 1:3-7, 4:3 (forbid marriage) with 2:15, 5:13-15, 2 Timothy 3:6-7. Each reading's open question stated."
    - "Malachi 2:16: translation fork shown (NASB/LSB 'I hate divorce' vs ESV/CSB/NIV husband as subject; LXX 'if, having hated, you send away'; 4Q76 has אם, 15 extant words). Explicitly not used as a text about physical abuse; removed from the divorce-grounds sentence."
    - "Pastoral section: helplines and secular counselling claim removed. Fleeing danger grounded in 1 Samuel 19:12, Acts 9:25, Luke 4:30, Proverbs 22:3, 1 Corinthians 7:11. 'Believe her' (Luke 24:11 misapplied) replaced by Psalm 82:3, Proverbs 31:8 with Deuteronomy 19:15, 18, Matthew 18:16, Proverbs 18:17. Reconciliation: Luke 3:8."
    - "Removed unsourced cultural claims ('in a world where...', 1 Peter 'husband's gods') and the σύμφωνος/symphony etymology."
    - "Plate one-verb-for-everyone: wives card now includes 5:24."
  open: "4,483 words against 4,000 (Check 23); over-target sections: The mystery of one flesh, 1 Peter 3:1-7, 1 Timothy 2:11-15. Run simplify-bible-study, then read-bible-study."
