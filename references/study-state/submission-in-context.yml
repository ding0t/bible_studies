review_2026-10-16:
  scope: "review-bible-study, all eight phases; draft stays draft: true"
  verified: "Every ESV quotation re-queried in study-notes.db (26 passages); NA28 Greek of Eph 5:18-22, 1 Cor 7:4-5, 1 Pet 3:6-7, 1 Tim 2:2, 11-12; footnotes CSB Eph 5:22, LSB Eph 5:21, NLT Gen 3:16 / 1 Cor 14:35 / 1 Tim 2:12; counts G1850 x4, G4859 x1, G4423 x1, G831 x1, G1625 (Eph 5:29; 6:4), G2282 (1 Thess 2:7; Eph 5:29), G4789 (incl. Rom 8:17), G2271/G2272 (1 Tim 2:2, 11-12); H8669 and H4910 in Gen 3:16 and 4:7; H2555 in Gen 6:11, Mal 2:16, Ps 11:5; LXX Prov 3:25 πτόησιν; KJV 1 Tim 2:12 'usurp authority'; study notes ESVSB/NIVBT/NIVCB on 1 Cor 14:34-35 and 1 Tim 2:11-12; ESVSB Gen 3:16."
  fixed:
    - "Eph 5:19-21 has FIVE participles (λαλοῦντες, ᾄδοντες, ψάλλοντες, εὐχαριστοῦντες, ὑποτασσόμενοι), not four. (The drafting note above saying 'fourth participle' is also wrong.)"
    - "Gen 4:7 is fifteen verses after 3:16, not eleven: now 'in the next chapter'."
    - "Gen 3:16 called 'a curse' and answered with Gal 3:13 (the curse of the law): the woman's sentence is not termed a curse. Reworded; Gal 3:13 replaced with 2 Cor 5:17; added the ESVSB pre-fall-order reading of Gen 3:16 for fairness."
    - "1 Cor 14:34-35 recast as two labelled readings; corrected attribution of 'as the Law also says' (ESVSB/NIVBT: Gen 2; NIVCB: Torah depicts submission chiefly at the fall); added the 14:34-35 placement variant (NLT footnote)."
    - "1 Pet 3:1 misquote 'that they may be won' -> 'they may be won'; Luke 24:11 'called' -> 'seemed to them'; Ps 11:5 quotation started at 'His soul' (capital looked like house style) -> full verse; ἐγκόπτω 'literally cut into, blocked on their way to God' (etymology) -> 1 Thess 2:18 usage; 1 Cor 7:4 'broken twice over' synthetic claim tightened; μανθανέτω given G3129."
    - "bible_references: added Matthew 19:8-9, Luke 24:11, 1 Cor 7:15, 1 Cor 14:29-35, 2 Cor 5:17, 1 Thess 2:18, 1 John 1:9."
  for_author:
    - "Word count ~4,870 incl. references against a 4,000 budget; review fixes added ~150 words. Consider simplify-bible-study."
    - "Eph 5:31-32 (quoting Gen 2:24) is inside the primary passage and never mentioned (review_gaps quotation gap)."
    - "'Husbands' nine verses' (5:25-33) includes 5:30-32 on Christ and the church and 5:33b to the wife; prose and plate both carry it."
    - "1 Tim 2:12 second reading's lexical case rests on KJV/NLT 'usurp'; the ESVSB explicitly argues against that sense. Author may want the second reading's own lexical argument or to drop the KJV point."
    - "'weaker vessel describes her physical vulnerability' stated as settled; it is a common but not uncontested reading."
    - "Mal 2:16 is a notoriously difficult text (CSB/NLT footnotes: 'he hates divorce'); the ESV rendering is used without noting this."
    - "000 and 1800RESPECT (1800 737 732) look correct but could not be checked online; verify before publishing."
