slug: "submission-in-context"
title: "Submission in Context"
status: review # drafted 2026-10-16 as draft: true; awaiting human review
target_path: "docs/content/christian-life/submission-in-context.md"
companion: "references/study-state/jesus-and-women.yml (research and decisions recorded there)"
primary_passage: "Ephesians 5:21-33"
genre: [epistle, topical]
thesis: "Every New Testament call to wives to submit sits inside a call to mutual submission and a husband's Christ-like self-giving, so no text licenses control, coercion or abuse; husband and wife hold authority over each other's bodies equally, and where a text's reach is contested the study gives both cases."
word_budget: 4100 # raised 2026-10-17 by the author: the pastoral section and both readings of the contested texts carry the length
outline:
  - {section: "How these verses get used", says: "The test this study applies: each verse read in its paragraph, its audience and its reason."}
  - {section: "Genesis 3:16: a consequence", says: "'He shall rule over you' is spoken after the fall, beside thorns and pain; tᵉšûqâ pairs with Genesis 4:7. The curse describes what sin does; redemption works against it."}
  - {section: "Ephesians 5:21-33: one verb for everyone", says: "5:22 has no verb of its own and borrows 'submitting to one another' (5:21); the husband's charge is the cross (5:25-29); headship defined by Christ who gave Himself. Compare the Bride of Christ."}
  - {section: "1 Corinthians 7:3-5: neither body is your own", says: "ἐξουσιάζει in both directions with ὁμοίως; 'by agreement'. Gives each spouse to the other; licenses neither to take."}
  - {section: "1 Peter 3:1-7 and Colossians 3:18-19", says: "A believing wife with an unbelieving husband; 'do not fear anything that is frightening' (3:6); co-heirs, prayers hindered (3:7); 'do not be harsh' (Colossians 3:19)."}
  - {section: "The contested texts", says: "1 Corinthians 14:34-35 beside 11:5; 1 Timothy 2:11-15 (αὐθεντέω once in the NT). Both cases, no ruling (author's decision 2026-10-16)."}
  - {section: "Where submission ends: pastoral guidance", says: "Acts 5:29; abuse named as sin (Colossians 3:19; Malachi 2:14; 1 Peter 3:7); safety and the civil authorities first (Romans 13:3-4); church discipline (1 Corinthians 5:11); separation (1 Corinthians 7:10-11). Plain guidance for a pastor and for a wife."}
open_questions: []
