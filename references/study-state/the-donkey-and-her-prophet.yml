genre: [ot-narrative, prophets]

thesis: "The donkey saw the angel before the seer did, and the same LORD who opened her mouth and then Balaam's eyes put His own words in the hired prophet's mouth, so the curse Balak paid for became Abraham's blessing and the promise of a Star out of Jacob, and no power can curse those God has blessed."
outline:
  - {section: "Why a curse was worth buying", says: "Balak's fee, Balaam's reputation (Num 22:5-7), the ANE belief that a diviner could move the gods (NIV Cultural Backgrounds note), and Deir Alla's 'seer of the gods'; Balak says 'he whom you curse is cursed' (22:6) and that is his belief, not the narrator's"}
  - {section: "Whose word binds: God's sovereignty", says: "God answers before the curse is spoken: 'you shall not curse the people, for they are blessed' (22:12); Balaam's repeated 'only what the LORD says' (22:18, 38; 23:12, 26; 24:13); Gen 12:3 is the ground; 'no spell against Jacob' (23:23)"}
  - {section: "The donkey", says: "She sees the sword (22:23-27), God opens her mouth (22:28), then uncovers the seer's eyes (22:31, galah), the same verb the seer uses of himself in 24:4, 16; 2 Pet 2:16 names the rebuke"}
  - {section: "The ground he stood on", says: "Pethor (disputed), Bamoth-baal, Pisgah/Nebo, Peor opposite Shittim; Kramer's walk: the three viewpoints, the camp at Shittim with the tent at its centre (Num 2), the same ridge where Moses later stood (Deut 34:1)"}
  - {section: "A name on a wall", says: "Deir Alla inscription: Balaam son of Beor, a seer of the gods, in a Jordan Valley text; what it confirms and where it differs from Numbers; Kramer's use of it"}
  - {section: "Three oracles turn the curse", says: "Num 23:7-10, 18-24; 24:3-9 speak Gen 12:3 over Israel; Balak's 'you have only blessed them' (23:11)"}
  - {section: "The Star and the Scepter", says: "Num 24:15-19: not now, not near; star/scepter as king (Gen 49:10); Kramer's god-king reading weighed (what the text supports, what it does not); Matthew 2, Rev 22:16, Bar Kokhba"}
  - {section: "What the curse could not do, the counsel did", says: "Num 25, 31:16, Rev 2:14, 2 Pet 2:15, Jude 11: Balaam's loss of the wages and his death; the warning"}
  - {section: "Be transformed", says: "Think / Attitude / Do"}
