kramer:
  source: "Joel P. Kramer, Expedition Bible, 'Archaeology for \"the Star who will come from Jacob\"', YouTube Qrv1_C-I3Es, 6 Jan 2023, 22:14. Auto-captions read 2026-11-07 (transcript in session scratchpad, not committed)."
  claims_to_engage:
    - "Deir Alla inscription (Jordan National Museum, found 1967 in the Jordan Valley, dated by him to the 9th century BC; opening 'the sayings of Balaam son of Beor, the man who was a seer of the gods') names the same Balaam as the Bible."
    - "Shittim (Abel-shittim) = Tell el-Hammam, opposite Jericho; Beth-peor on the ridge opposite it; Num 25:1 'Israel staying at Shittim'; Tabernacle at the centre of the camp (Num 2), so Shittim was the camp's headquarters; Joshua sent spies from there."
    - "Balak's three viewpoints from south to north: Bamoth-baal (sees only the outskirts, 22:41; 23:13), Pisgah/Mt Nebo (23:14), Peor (23:28), the only one with a view of the whole camp 'tribe by tribe' (24:2). At Pisgah Balaam sees the glory cloud over the tabernacle: 'the shout of the King is among them' (23:21) is the LORD, not a human king."
    - "Star/scepter: star = deity symbol (cites Amos 5:26), scepter = king; so 24:17 says the God-King will come out of Jacob. Israel had only one star besides their God, so the Star is Yahweh become an Israelite."
    - "Magi (Matt 2:1-2) would have come by the Roman road past Beth-peor; Eusebius's Onomasticon names Beth-peor six miles above Livias; Roman milestones now at Mt Nebo."
    - "Oldest copy of the star prophecy: Dead Sea Scrolls cave 4, 125 BC, 'not a direct quote' but Jews writing their expectation (probably 4Q175 Testimonia; NOT verified, bible_variants for Num 24:17 returned no DSS reading). Medieval Jewish reading: David; Kramer treats a Messianic reading as the oldest."
  assessment_so_far:
    - "LOCATION (author decision 2026-11-07): the study HOLDS Kramer's assessment and says it is Kramer's (Shittim = Tall el-Hammam; Beth-peor opposite it; Bamoth-baal, Pisgah/Nebo, Peor as the three viewpoints south to north). The argument is the text's own order: Num 22:1 (camp in the plains of Moab by the Jordan at Jericho), 25:1 (Israel staying at Shittim), 33:48-49, Deut 3:29 (valley opposite Beth-peor), Deut 34:1,6; Peor is the only viewpoint with the whole camp 'tribe by tribe' (24:2). Do NOT hedge it with mainstream or recalled rival sites, and do not take a site identification from memory; the check is text and logic. Do not write 'the consensus holds otherwise'. See memory feedback-archaeology-scripture-first."
    - "STRONG: scepter = king (ESV Study note, Gen 49:10). Star as king is supported by Num 24:17's own parallelism, Rev 22:16 and Matt 2:2."
    - "STAR (author correction 2026-11-07): do not weigh the NIV Cultural Backgrounds note ('hard to document a star as kingship symbol') against Kramer; Scripture first. Done below in stars_in_scripture. Result: Scripture does use 'star' for heavenly beings and for a divine claim, so Kramer's conclusion is not an import; the support is Job 38:7, Isa 14:13, Rev 1:20/9:1/12:4, Rev 22:16, not an ANE symbol table."
    - "FLAG: Magi route is inference; Matt 2 names no road. 'about 1400 years earlier' is Kramer's chronology; use this site's own (chronology/) rather than copy it."
    - "FLAG: 4Q175 attribution and 125 BC date unverified; do not repeat as fact."
    - "Deir Alla date: Kramer 9th c. BC; Wikipedia c. 825 BC with range 880-770 / 750-700; ESV note 8th c. Give a range."

stars_in_scripture:
  method: "bible_word H3556 kokab (all OT hits, 37 verses incl. Num 24:17) and G792 aster, G4407 proinos (Rev 2:28; 22:16 only), G5459 phosphoros (2 Pet 1:19 only), read 2026-11-07. BSB wording."
  findings:
    created_and_counted: "Gen 1:16 (made); Ps 8:3-4; 136:9; 147:4 (God counts and names them); Jer 31:35 (ordinance); Job 9:7 (seals up). Creatures under God, so not for worship: Deut 4:19 forbids bowing to the sun, moon, stars. Isa 47:13 star-gazers cannot save."
    the_covenant_seed: "Gen 15:5; 22:17; 26:4; Exod 32:13; Deut 1:10; 10:22; 28:62; 1 Chr 27:23; Neh 9:23: Abraham's offspring are the stars, and Jacob's line is the star-line."
    persons_of_jacobs_house: "Gen 37:9-10: Joseph's eleven stars are his brothers, Jacob's sons. So 'a star out of Jacob' (Num 24:17) is by Scripture's own usage a person of Jacob's house. Dan 12:3: those who lead many to righteousness 'shine like the stars'."
    heavenly_beings: "Job 38:7 (morning stars sang together = all the sons of God shouted, a parallel pair); Judg 5:20 (stars fought against Sisera); Rev 1:20 (seven stars = angels of the churches; in Christ's right hand, 1:16); Rev 9:1 (a star fallen from heaven, given a key); Rev 12:4 (the dragon's tail sweeps a third of the stars). Isa 14:12-13: the day star (heylel, BSB 'day star, son of the dawn') who would raise his throne 'above the stars of God' and 'make myself like the Most High'; referent contested (king of Babylon, and behind him Satan); say contested and give the text's case, per style rule."
    false_stars: "Amos 5:26 (Sakkuth your king, Kaiwan your star god, idols you made; kokab is the word): a star made a god is the idol Israel carried. Jude 13 'wandering stars'. Scripture's own use of a star as a deity is therefore the counterfeit, and Isa 14 is the counterfeit's claim to equal the Most High by climbing."
    morning_star: "Rev 22:16 Jesus: 'the Root and the Offspring of David, the bright Morning Star' (aster ho proinos: bright is lampros). Rev 2:26-28: to the overcomer 'authority over the nations ... rule them with an iron scepter ... I will give him the morning star' (Ps 2:8-9 behind it). The scepter and the star ride together in one promise, as in Num 24:17; the Lord who holds both (22:16) shares the star with His overcomers (2:28), so 'morning star' there is rule and dawn shared, a title the Son holds and gives. 2 Pet 1:19: the morning star (phosphoros, light-bearer) rises in your hearts. Matt 2:2: the Magi saw 'his star' at its rising and ask for the one born King of the Jews."
  synthesis_to_test: "Scripture uses a star for (1) a created thing under God, (2) a person from Jacob's line, (3) a heavenly being, (4) the counterfeit god. Num 24:17 sets a Star 'out of Jacob' beside a Scepter 'out of Israel' and 24:19 'one from Jacob shall exercise dominion'. The pair fits (2)+(3): a ruler of Jacob's house who is also heavenly, which is Rev 22:16's Root AND Offspring of David (Matt 22:42-45 shows the same riddle). It is not (4): the true Star is not a climber like Isa 14 but the one who came down. That supports Kramer's conclusion from Scripture's own usage. The deity of the Star then stands on Rev 22:16 together with Isa 9:6 and Mic 5:2, which TODO: read in context before writing. Keep Ps 2:9 / Rev 2:27 'rule with an iron scepter' as a lead (no quotation-tier link from bible_trace)."
  still_to_check:
    - "Acts 7:43 (Stephen quoting Amos 5:25-27, 'the star of your god Rephan'): Greek astron G798, not in the G792 list; read it before citing."
    - "Ps 2:9 vs Rev 2:27 and Rev 19:15 wording; Mic 5:2 'from of old'; Isa 9:6 'Mighty God'; Matt 22:42-45 (David's Son and Lord)."
    - "Heylel H1966 is a different word from kokab; keep them apart in the prose."
    - "shevet H7626 (scepter / staff / tribe) in Gen 49:10 and Num 24:17; Gen 49:9 lion and Num 24:9 lion."

open_questions:
  - "Excavator of Deir Alla (H. J. Franken? unverified) and a translator for Combination I (Hoftijzer & van der Kooij 1976; Hackett 1984; Context of Scripture 2.27) not verified. Wikipedia fetch was truncated and biblearchaeology.org returned 403. The ESV note quotes the opening ('Inscription of Balaam the son of Beor, the man who was a seer of the gods') and calls it 'certainly the same person' -- that is the ESV's claim; the text says only 'same name and title'. Mark confidence accordingly."
  - "Pethor identification is disputed (Til Barsip 408); 'the River' + Amaw (22:5). Some witnesses read the land of 'his people' for Amaw: check before stating 'Euphrates' flat."
  - "Num 22:20 'go with them' then 22:22 'God's anger was kindled because he went': settle in exegesis, do not smooth. ESV Study note blames fees/greed; text check needed."
  - "Does the Deir Alla text confirm that Balaam's curses were thought effective (Combination I: the gods' council, darkness)? Needs a verified translation before claiming anything beyond the name and title."
  - "Fork candidates: Balaam's counsel at Peor (Num 25, 31:16) as its own study; the talking donkey/miracles in Scripture."
  - "Add Tell Deir Alla to docs/content/scripture/archaeological-sites.md (author said we will add it). Separate change."
