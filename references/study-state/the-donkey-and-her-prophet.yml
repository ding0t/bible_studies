review_2026-11-07:
  reviewer: "self (the drafting agent, at the author's request; an independent session is still recommended)"
  checked: "81 BSB quotations re-queried from berean-bsb by script; ESV Num 24:4 re-queried; Strong's ids; nakah/galah/kokab counts; footnotes Num 22-24 (LSB, CSB-AF, NLT); NIV BT notes on 22:22 and 24:17 as the independent commentary; review_gaps; strongs_suggest; alignment_ranking; sibling passages (names-of-jesus, sorcery, test-the-spirits, cities-of-the-plain); validate; mkdocs --strict."
  critical:
    - "'Balaam's last oracle' (Key Takeaways; Star section): Num 24:20-24 has three more oracles (Amalek, Kenites, Cyprus/Kittim)."
    - "'Balaam says five times': also Num 22:8 and 23:3, so at least seven."
    - "'In 24:9 Israel is the subject': Israel is the 'you', the object; in 22:6 the 'you' was the seer. Discussion question 1 builds on it."
    - "'The only star in Scripture that is a god is the idol' contradicts the study's own Rev 22:16 conclusion."
    - "Misquotes: Num 24:13 ('LORD.' for 'LORD?'); Num 23:10 (truncated with an added '?'); Num 24:4 ESV (added comma)."
    - "'The next time Numbers names him, Moses is blaming him': Num 31:8 names him first."
  moderate:
    - "Num 24:9 'repeats Genesis 12:3': its words are Gen 27:29 (Isaac on Jacob) with the halves reversed; Gen 12:3 uses qalal for one curse."
    - "4Q175 date sentence: 125 BC is placed 'inside' a range stated as around the first century BC; Kramer's copy is not shown to be 4Q175."
    - "'the text agrees with the order' (south to north): the text gives a widening view; Deut 3:29 does not name Shittim. Attribute the inference to Kramer."
    - "nakah H5221: BSB renders 'defeat' (22:6) and 'beat' (22:23...), so the BSB quotation hides the link the study argues; say the study follows 'strike' (ULT) and why."
    - "About 15 short quotations carry no translation label."
    - "About 35 references omit the book (incl. discussion questions)."
    - "Gaps: Ps 110:1 (quoted in Matt 22:44) unnamed; 1 Cor 10:6-11 (Peor as warning) unnamed; Rev 5:5 (Lion of Judah, Root of David) unnamed."
    - "Context coverage partial: author/date, genre lens and the cultural/transcultural line are implicit."
  minor: "Balak builds the altars at Balaam's word; perverse/'Lit reckless' footnote; galah identity stated flat; 'neighbours'; 'clearest prophecy' superlative; Rev 22:16 cited for the scepter; Job 38:7 parallelism flat; 'Gentile seers'; cities-of-the-plain link wording; patach tag shape; undisclosed footnotes 22:5, 23:28, 24:17; ESV note quote drops '[v. 5]'; Wikipedia Deir Alla source not listed; bible_references missing Josh 24:9-10, Gen 27:29 and others; provenance unfilled; Kramer named 13 times in report register; Attitude stands on Rom 8:31 where Num 23:23 is available; 'Hasmonean' unglossed; cite Num 22:2 for Sihon/Og."
  commentary_check: "NIV Biblical Theology Study Bible (not cited): 22:22 confirms the permission/anger reading and the greed motive (v. 35; 2 Pet 2:15); 24:17 confirms the Christological reading with a Davidic first stage, which the study already marks contested. CSB Ancient Faith: silent."
  statement_of_faith: "No conflict. The Scepter-at-His-return reading is consistent with the End times section."
  status: "findings presented to the author; nothing fixed yet"

