decisions_2026-11-15:
  # The author delegated the open recommendations ("investigate deeper and apply as you see fit").
  ezekiel_40_48: "Resolved to the site's existing position: Tabernacles, True Worship and The New Jerusalem already read Ezekiel 40-48 of the thousand years, and the study now says so. The offerings' meaning stays open between memorial and ceremonial cleansing; the study leans, marked as a lean, to ceremonial cleansing because kaphar is said of the altar (Ezekiel 43:20) and the house for unintentional sin (Ezekiel 45:20)."
  acts_3_21_matthew_19_28: "Begin at the return, in the thousand years, completed in the new creation (Acts 3:20's sending; Matthew 19:28's throne and tribes; Revelation 21:5). Consistent with Your Kingdom Come and New Heaven and New Earth, which date the age to come from the return, and with Heaven and Earth Will Pass Away, which follows the words to their completion. No sibling edit needed."
  amillennial_interim_argument: "Added to the amillennial case, with Paul's order (1 Corinthians 15:23-25) as the premillennial reply in Where this study stands."
  your_kingdom_come_link: "Linked in the prose of Where this study stands."
  renderings: "H5521 (booths) and H2603 (be gracious) decided in docs/data/word-renderings.toml. H7489 is not on the ULT/BSB disagreement list; the break/shepherd difference is the Septuagint's and the prose covers it."

