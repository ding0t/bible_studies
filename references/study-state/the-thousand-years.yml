open_questions:
  - "Romans 15:12 quotes Isaiah 11:10 of the present Gentile mission; the study gives it one sentence (already/not yet). A reviewer may want more."
  - "Statement-of-faith nuance (not a conflict): the statement says 'a literal thousand years'. The exegesis establishes the order (return, reign, release, judgment) firmly; the exact length is held as the site's reading, by analogy with Revelation's other periods. The study says so in 'Where this study stands'."
  - "1 Enoch verse numbers follow the open-data file, which folds some of Charles's verses together (no 10:7, 14, 16, 22; Charles's 10:22 text sits in its 10:21). The study cites 10:12, 10:18-19, 10:21 as the file numbers them."
  - "AUTHOR DECISION (shared with backlog 2.5): Ezekiel 40-48's temple and sacrifices. The study names the question and four answers and takes no position. NB two published pages already take one: feasts/tabernacles.md ('Ezekiel's temple vision, which this site also reads of the kingdom') and christian-life/true-worship.md ('dispensational readers, this site among them, place it in the thousand years'). Once decided, either this study's section or those two sentences need to change."
  - "Who reigns: the resurrected saints of Revelation 20:4-6 (church, OT saints, tribulation martyrs on the dispensational reading) versus mortal survivors who populate the kingdom (Zechariah 14:16; Matthew 25:31-34). The study states this as the dispensational reading, marked; Walvoord (BKC on 20:4) holds the throne-sitters unidentified."
  - "Fork candidate: the nations' Feast of Booths and the eighth day are already covered (tabernacles.md, new-heaven-and-new-earth.md); no fork needed. Fork candidate: a full exegesis of Gog and Magog (Ezekiel 38-39 vs Revelation 20:8) -- left out."
  - "Drawn plate of the reign's sequence (backlog 5.10 last bullet) -- not drawn in this pass by instruction."
  - "1 Enoch translator: the open-data file carries no translator metadata; its text and Charles's transposition of 91:12-17 after 93 match R. H. Charles (1917). Attributed as Charles; confirm against a Charles edition when convenient."

