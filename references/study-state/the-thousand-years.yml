genre: [apocalyptic, prophets, psalm, topical]

thesis: "When Jesus returns He will reign on this earth for a thousand years, with Satan bound and His people raised to reign beside Him, so that every promise God made about this world is kept on this world; the faithfulness He asks of you now is the first part of the work He will give you then."
outline:
  - {section: "Revelation 20, in its order", says: "The chapter follows the return of Revelation 19: Satan bound, thrones, the first resurrection, a reign, a release and a last rebellion. Word studies on ezesan and anastasis."}
  - {section: "Three readings of the thousand years", says: "Amillennial, postmillennial and premillennial readings each with their textual case; where the study lands and how firmly."}
  - {section: "What the prophets saw", says: "Psalm 2 and 72, Isaiah 2/Micah 4, Isaiah 11, Isaiah 24, Isaiah 65 and Zechariah 14 picture a King reigning over an earth not yet made new."}
  - {section: "What the saints do", says: "Reign and judge, govern, serve as priests, worship, teach, build and plant -- each marked stated or inferred, and who it is stated of."}
  - {section: "The temple Ezekiel saw", says: "Names the open question and four answers; takes no position."}
  - {section: "What the reign shows about God", says: "God keeps His word to the earth, to His Son and to His people; so you may be faithful in little."}
  - {section: "Annex: what Jews and early Christians expected", says: "1 Enoch, 2 Enoch, 2 Baruch, Papias via Irenaeus behind the warning; they show expectation, carry no claim."}
word_budget: 5300
word_budget_reason: "Raised 2026-11-15 at the author's request to add the section After the tribulation: clearing and rebuilding (Ezekiel 39, Daniel 12:11-12, Isaiah 61:4, Amos 9, Acts 3:21), about 1,030 words. Raised again to 5,300 the same day for the author-delegated decisions: the site's Ezekiel 40-48 position, the Acts 3:21 / Matthew 19:28 reading, and the amillennial interim argument with 1 Corinthians 15:23-25 (about 200 words)."

stages:
  scoping:
    done: true
    notes: "Backlog 5.10 is the brief. No primary sibling on Revelation 20:1-10 (judgment-seat-of-christ is primary on 20:11-15; new-heaven-and-new-earth on 20:7-21:8), so a new study rather than a revision."
  exegesis:
    historical_context:
      done: true
      notes: "Revelation: John on Patmos to seven churches of Asia (Revelation 1:4, 9), under pressure; apocalyptic, steeped in Daniel 7 and Ezekiel 38-39. Psalm 72 is titled 'Of Solomon', a royal prayer whose scope (72:8, 11, 17) exceeds Solomon's reign. Isaiah 2:2-4 / Micah 4:1-5 are shared oracles of 'the latter days'. Zechariah 14 is post-exilic, set on the day the LORD returns."
    literary_context:
      done: true
      notes: "BSB sections: 20:1-6 'Satan Bound', 20:7-10 'Satan Cast into the Lake of Fire' (editorial). Unit 19:11-20:15: rider on the white horse; beast and false prophet into the lake (19:20); dragon bound (20:1-3); thrones and reign (20:4-6); release and Gog/Magog (20:7-9); devil into the lake 'where the beast and the false prophet were' (20:10); great white throne (20:11-15). Amillennial recapitulation case: 'the battle' (eis ton polemon) in 16:14, 19:19 and 20:8, and Ezekiel 38-39 imagery in both 19:17-21 and 20:8."
    content_word_studies:
      done: true
      notes: "See terms."
      terms:
        - {word: "ἔζησαν", language: greek, transliteration: "ezēsan", strongs_id: "G2198", gloss: "they came to life / lived", notes: "Aorist indicative of zaō in both 20:4 and 20:5. Aorist of zaō in Revelation: 2:8 (Christ, 'died and came to life'), 13:14 (the beast, 'yet lived'), 20:4, 20:5. ULT 'they lived', BSB 'they came to life'. John 5:25 uses future zēsousin of spiritual life -- the amillennial parallel."}
        - {word: "ἀνάστασις", language: greek, transliteration: "anastasis", strongs_id: "G386", gloss: "resurrection", notes: "42x NT (MACULA SBLGNT); Revelation only 20:5-6. Of the other 40, all but Luke 2:34 ('fall and rising of many') name a rising from death."}
        - {word: "χίλια ἔτη", language: greek, transliteration: "chilia etē", strongs_id: "G5507", gloss: "a thousand years", notes: "chilioi in Revelation 20:2,3,4,5,6,7 -- six times; covered by day-is-a-thousand-years."}
        - {word: "κρίμα", language: greek, transliteration: "krima", strongs_id: "G2917", gloss: "judgment / authority to judge", notes: "krima edothē autois (20:4), echoing Daniel 7:22; ULT 'judgment', BSB 'authority to judge'. Covered by first-take-the-log-out."}
        - {word: "ποιμαίνω", language: greek, transliteration: "poimainō", strongs_id: "G4165", gloss: "shepherd, rule", notes: "Rev 2:27; 12:5; 19:15 quote Psalm 2:9 with LXX Poimaneis; 7:17 'will shepherd'. MT tero'em from ra'a' (H7489, TWOT 2192 'break'); same consonants can be read from ra'ah (H7462, TWOT 2185 'pasture'), which is how the LXX read them."}
        - {word: "תּוֹרָה", language: hebrew, transliteration: "torah", strongs_id: "H8451", gloss: "instruction, law", notes: "Isaiah 2:3 / Micah 4:2: 'that he may teach us' is yorenu, Hiphil of yarah (H3384), and torah is TWOT 910d under the same root 910. The LORD is the teacher."}
        - {word: "סֻכּוֹת", language: hebrew, transliteration: "sukkot", strongs_id: "H5521", gloss: "booths", notes: "Zechariah 14:16, 18, 19."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Revelation's numbers: the site reads Revelation's time-spans as real lengths (tribulation.md). The sequence (return, then reign, then release) is the firmer exegetical ground; the exact length is held as the site's reading."
    theological_principle:
      done: true
      notes: "God keeps His promises about this earth on this earth: to His Son (Psalm 2:8), to Israel and the nations (Isaiah 2; Zechariah 14), and to His servants, whose faithfulness now is rewarded with a share in the reign (Luke 19:17; 2 Timothy 2:12)."
    application_draft:
      done: true
      notes: "Faithfulness in little (Luke 19:17); pray 'your kingdom come' as a request for His return; endure (2 Timothy 2:12)."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Daniel 7:9, 22", relation: "thrones; judgment given for the saints (allusion, Revelation 20:4)"}
      - {ref: "Isaiah 24:21-23", relation: "rulers shut in a pit and punished 'after many days' -- OT pattern of an imprisonment and a later judgment"}
      - {ref: "Matthew 12:29", relation: "binding the strong man -- amillennial reading of 20:2"}
      - {ref: "Revelation 12:9; 1 Peter 5:8; 2 Corinthians 4:4", relation: "Satan active and deceiving now -- premillennial reply"}
      - {ref: "John 5:25-29", relation: "spiritual life then bodily resurrection -- amillennial parallel; anastasis used only of the bodily (5:29)"}
      - {ref: "1 Corinthians 15:23-24", relation: "each in his own order -- premillennial support, contested"}
      - {ref: "Psalm 110:1-2; Matthew 13:33; Luke 18:8", relation: "postmillennial case and reply"}
    translations_compared: ["ESV", "BSB", "ULT", "NA28", "SBLGNT", "LXX (Brenton)"]
    divergences_noted: "Revelation 5:10: NA28 basileusousin 'they shall reign' (ESV); SBLGNT/WH basileuousin 'they reign'; TR 'we will reign' (BSB/MSB footnotes). Revelation 20:4 ezesan: ULT 'they lived', BSB/ESV 'came to life'."
  drafting:
    done: true
    file: "docs/content/last-things/the-thousand-years.md"
  review:
    done: false
    validated: true # 2026-11-15: npm run validate clean on this file except Check 17's provenance warning (ai_provider_models: [] -- written by a provenance run while the file is uncommitted; resolves when refresh_frontmatter_provenance.py runs before the commit). 3,989 readable words against 4,000. mkdocs build --strict passes (the draft is excluded from the build, so the eight cross-page anchors were checked against the built sibling pages by hand: all resolve). verify_claims --evidence: 81/81 ok.
    notes: "Self-check only. Before draft: false, run review-bible-study in an independent session, then read-bible-study in another."

