review_2026-11-15:
  reviewer: "review-bible-study, independent session (did not draft the study)"
  scope: "All eight phases. ESV quotations scripted against study-notes.db verses (every inline '(Ref, ESV)' and every ESV block); Greek/Hebrew counts and tags re-run (G12, G386, G2198 aorists in Revelation = 2:8, 13:14, 20:4, 20:5 only; G605 x1; G3824 x2; G600 at Acts 1:6; H2891 at Ezek 39:12, 14; H8451 at Mal 2:7; Rev 5:10 NA28 future vs SBLGNT present). 1 Enoch 10:12, 18-19, 21; 91:12-13, 15-16 and 2 Baruch 29:3, 5; 30:1 checked against open-data/scrollmapper .../1-enoch.json and 2-baruch.json; 2 Enoch 33:1 against 2-enoch.json. Irenaeus AH 5.33.3-4 and Justin Dial. 80 against anf01.txt (lines ~54016-54065, ~21786-21791); Lactantius DI 7.24 against anf07.txt (~21342, ~21364). All patristic and pseudepigraphal quotations verbatim. Every extra-biblical source sits inside the background section behind the warning; no claim about the reign rests on them. All 27 internal links and anchors resolve; none points to a draft."
  findings_fixed:
    - "CRITICAL (synthetic claim, arithmetic): Ezekiel 39 dating paragraph said placing Gog 'before or early in the tribulation' carries the seven years of burning into the kingdom. Backwards: a war before the tribulation finishes the burning before the return; only a mid- or end-tribulation placement carries it into the kingdom. Rewritten; 'The text fixes what the clean-up is; it does not fix the date' (antithesis) dropped."
    - "CRITICAL (misquote): Revelation 21:22 quoted as 'saw no temple, for its temple' -- the ESV has 'in the city' between. Restored ('I saw no temple in the city, ...')."
    - "MODERATE (unmarked contested claim, sibling conflict): Acts 3:21 apokatastasis and Matthew 19:28 palingenesia were identified flat as 'the same era' and read of the reign. heaven-and-earth-will-pass-away.md (published) reads the same two words of the renewed creation. Now marked: dispensational readers take both of the thousand years; the sibling reads them of the renewed creation; open. Added Acts 1:6 (G600, the cognate verb, 'restore the kingdom to Israel'), which is the dispensational reading's strongest textual support."
    - "MODERATE (open author decision pre-empted): Ezekiel 47:9's river was used as millennial repair while the study's own temple section says Ezekiel 40-48 is unsettled. Now says the river flows from Ezekiel's temple, so its timing belongs to that open question."
    - "MODERATE (unmarked contested claim): Amos 9:11 / Acts 15:16 listed as a rebuilding promise for the reign without saying James applies it to the Gentiles now being called (Acts 15:14). Now marked contested with a link to israels-regathering-and-refining.md#after-this-james-at-the-jerusalem-council (published)."
    - "MODERATE (context): Joel 2:25 used as an after-the-tribulation rebuilding promise; in context it restores the years of the locust plague of Joel's own day (Joel 1:4; 'my great army, which I sent among you'). Now says so."
    - "MODERATE (inference stated as fact): Daniel 12's 1,290/1,335 were said to lie 'past' the 1,260 without saying why. Now counts from Daniel 12:11's abomination and says the 1,335 is assumed to share that start (Daniel 12:12 does not name one), matching tribulation.md#one-span-counted-three-ways."
    - "MINOR (misattribution): Discussion question 1 called poimanei 'the Septuagint's'; LXX Psalm 2:9 has 2nd-person Poimaneis, Revelation 2:27 3rd-person poimanei. Reworded."
    - "MINOR (quotation splice): Isaiah 24:21-23 joined 'they will be punished' to 'the LORD of hosts reigns' with 'for', which in Isaiah 24:23 explains the moon's shame. Changed to 'and'."
    - "MINOR (connective): Ezekiel 36:33, 35 'until people say' -- ESV 'And they will say'. Fixed."
    - "MINOR (source slip): warning box said 1 Enoch's righteous 'build houses'; 91:13 has 'acquire houses' (the house built is the Great King's). Fixed."
    - "MINOR (style, grading evidence): 'The order of events is the firmest ground, and on it this study is premillennial with the site' -- style-guide's own diagnostic phrase. Rewritten to state the order and the site's position, and the literal length in the statement of faith's terms."
    - "MINOR (style, narrated argument / signposts / restatement): 'The premillennial reading has its own question to answer'; 'The parable's point is that'; 'Scripture says a good deal about that work, and it fits the faithful-servant pattern the parables set'; 'The prophets promise rebuilding again and again'; 'The reign begins on an earth that has been judged'; 'Justin leaned on...; Lactantius on...' (restated the quotes). Cut or recast; 'The King rewards faithfulness with responsibility' now bold as the section's point."
    - "MINOR (labels): ESV label added to unlabelled quotations (Revelation 7:9-10; 20:6 'has no power'; discussion questions 3, 4, 5)."
    - "MINOR (outline drift): Study outline's background line omitted Justin and Lactantius (added with the new section). Fixed."
    - "MINOR (frontmatter): added 'ezekiel' tag (a whole section plus Ezekiel 36, 39, 47); bible_references gained Acts 4:25-27, Acts 13:33, Romans 15:12 (argued from in prose), and Acts 1:6, Joel 1:4, Acts 15:14 (added by fixes)."
  checked_clean:
    - "Every other ESV quotation verbatim (initial-capital and dropped leading 'Or' at Matthew 12:29 are the only deviations, both conventional)."
    - "Five verbs of 20:2-3; abyssos 7x Revelation; anastasis 42x NT, Luke 2:34 the one non-death use; 'the battle' with article at 16:14, 19:19, 20:8; Rev 5:10 NA28/WH/SBLGNT split and BSB/MSB footnotes; TWOT 910/910d, 2185, 2192; Psalm 2:9 MT/LXX; Isaiah 61:2 split at Luke 4:19; tribulation-saint 1,260 arithmetic."
    - "Revelation 20:1-10 footnotes (study-notes.db note_type='footnote'): only LSB 'Lit' notes, NLT 'abyss/underworld', CSB 'Other mss add' at 20:2 and 20:9 -- none bears on the argument."
  commentary_cross_check: "NIV Cultural Backgrounds Study Bible article 'The Millennium' and NLT Life Application notes on Revelation 20 (neither cited by the study). Three-view framing: confirms. Premillennial 'logic of the narrative': confirms. Isaiah 24:22 as an interim period: confirms. NIV CBSB's 'one of the strongest' amillennial arguments -- no interim period appears elsewhere in the NT (1 Corinthians 15:23-24 disputed) -- is absent from the amillennial bullets: complicates (fairness of the case), left for the author."
  context_coverage: {genre: covered, historical_occasion: "partial (Revelation and Psalm 72 given; the new section's OT texts had none -- Joel now supplied)", literary_context: covered, original_language: covered, cultural_vs_transcultural: "partial (numbers-as-lengths explicit; stated/inferred table does the rest)", taught_elsewhere: covered, statement_of_faith: "consistent: premillennial, dispensational, literal thousand years (now stated in those terms). Ezekiel 40-48 is not in the statement."}
  left_for_author:
    - "AUTHOR DECISION (unchanged): Ezekiel 40-48. A third published page also takes a side: last-things/new-jerusalem.md, 'On the dispensational reading this site holds, Ezekiel 40-48 describes the same city and its temple'. With tabernacles.md and true-worship.md that is three."
    - "AUTHOR DECISION: Acts 3:21 / Matthew 19:28 -- this study (millennial, dispensational) and heaven-and-earth-will-pass-away.md (renewed creation) now each say what they hold; settle which, then align the other."
    - "Amillennial case omits 'no interim period elsewhere in the NT'; premillennial reply would be 1 Corinthians 15:23-24 (already in frontmatter, unused in prose). About 40 words; budget is tight."
    - "your-kingdom-come.md is marked build-on in sibling_studies but linked only from References; a prose link (e.g. in 'A King on Zion') is the author's call."
    - "Register in 'Three readings' and 'What the saints do': the bullets and table are exegesis and read analytically, which style-guide.md assigns to exegesis. 'Where this study stands' and the minas paragraph were recast; the rest is a human read."
    - "word-renderings.toml has no decision for H5521 (ULT 'huts' / BSB 'tabernacles'; study follows ESV 'Booths') or H7489 (Psalm 2:9 'break'). Proposed entries for the author; not edited (outside this review's files)."
    - "Isaiah 24:21-23 'Revelation gives the many days their number' and 1 Enoch 10:18-19 / Irenaeus quotations ending mid-sentence without an ellipsis: left as is (conventional)."
  size: "5,016 readable words before the review; 5,090 after, against a 5,100 budget (+74 net: marking contested readings added ~110, style cuts removed ~45)."
  validate: "npm run validate: no warning or error on this file (95 corpus-wide warnings, unchanged). verify_claims --only-evidence: 127/127 ok, 0 unverified."

