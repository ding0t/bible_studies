slug: learn-hebrew-section
title: "Learn Hebrew: a top-level section with a path, printables and card decks"
status: in-progress
started: 2026-10-17

why: >
  The author asked (2026-10-17) for help starting Hebrew, biblical and modern: A4 printables for
  the ancient, biblical and modern scripts and for writing them; flashcards with the word in
  biblical and modern Hebrew, its pronunciation and meaning, starting with the names of God; and a
  note on how pronunciation differs between communities (Israeli vs American Jews). Backlog 1.3
  ("Learning Hebrew") asked for the alphabet basics too.

decisions:
  section: >
    Top-level /hebrew/ ("Learn Hebrew"), beside Sermons and Resources outside the theology loci:
    it is a course taken in order, not a source catalogue. The two Hebrew pages move there from
    /resources/ with redirects. The Names of God *study* is Theology Proper and belongs in /god/;
    /hebrew/ owns the card deck and links to the study.
  pronunciation: >
    The site standard is modern Israeli pronunciation -- what every study's respelling already
    uses (bereshit, ha'arets), what TAHOT's syllabified transliteration gives, and what a learner
    hears from Israeli speakers. Academic transliteration (SBL: ḥ, ṭ, ʿ) stays as a column for
    reading commentaries. Ashkenazi, Yemenite and the academic reconstruction get an awareness
    page, not a second standard.
  divine-name: >
    Cards print יְהוָה as the Masoretic text does, say it is read "Adonai", and never give a
    stressed respelling of "Yahweh" (no source records its stress -- see export_memory_verses.py
    _DIVINE_NAME). Any future audio must speak "Adonai" for it.
  names-as-written: >
    A card prints the verse's own words, with the popular label beneath: Exodus 15:26 is
    יְהוָה רֹפְאֶךָ "the LORD your healer" (popularly "YHWH Rapha"); Genesis 22:14 is
    יְהוָה יִרְאֶה "the LORD will see" ("Jehovah Jireh").
  spelling-source: >
    Every Hebrew word on a card is checked by the exporter against TAHOT at the card's source
    verse; a mismatch fails the export. Nothing typed from memory ships.
  letter-order: >
    The names deck is ordered so each card adds a few new letters; the exporter computes and prints
    "new letters" per card, so the claim cannot drift from the data.

done:
  - 2026-10-17 scaffold /hebrew/ (index as the learning path, .pages, nav, redirects from
    resources/ and the older hebrew-studies/ URLs, inbound links, taxonomy row, section_index blurb)
  - 2026-10-17 alphabet page rewritten (22 letters, finals, vowels, Israeli standard, biblical
    column, academic column, Paleo column, dagesh corrected)
  - 2026-10-17 pronunciation page (traditions table, Shabbat/Shabbos comparisons, the divine name)
  - 2026-10-17 names-of-God deck -- 21 cards, all 22 letters by card 20, finals ך ם ן (not ף ץ).
    The exporter's checks caught two of my own source choices: 1 Samuel 1:3 has the name as
    לַיהוָה (prefixed, so pointed differently) and was swapped for Isaiah 6:3; and TAHOT's
    paragraph marks had to be stripped before matching.
  - 2026-10-17 three unlinked third-party PDFs removed from assets/img/
  - 2026-10-17 writing sheets (hooks/hebrew_writing.py): square, cursive (Gveret Levin, SIL OFL,
    on Google Fonts -- checked to be genuine Israeli cursive with niqqud), Paleo-Hebrew, and the
    names of God in all three. No stroke-order arrows: none drawn rather than guessed.
  - 2026-10-17 Three Scripts page. Evidence: the DSS Text-Fabric data (restricted-data/dss,
    tf/2.0, feature `script`=paleohebrew, mapped to scrolls through oslots) gives יהוה in
    Paleo-Hebrew 286 of 4,843 times in 15 scrolls: 11Q5 164/165, 4Q57 82/83, 1QpHab 8/8,
    11Q2 7/7 (book Lev). Sanhedrin 21b quoted from Sefaria's William Davidson edition (API v3).
  - 2026-10-17 The Shema page, letter by letter, with the verbless-clause translation question
    marked open (footnote alternatives from CSB/NLT/LSB) and 1 Corinthians 8:6.

