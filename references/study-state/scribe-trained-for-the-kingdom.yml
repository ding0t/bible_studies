    validate clean; mkdocs build --strict clean. 5,100 words, median sentence 17, 10% over 35.
    Remaining ', not'/'rather than' hits are the section heading (narrow exception — the reader
    genuinely arrives holding the wrong version), a Scripture quotation, and the named contrast
    between two scholarly positions.
  still_open:
    - "Moderate 6 — cultural-vs-transcultural line still not drawn explicitly."
    - "Moderate 7 — oikodespotes: 20:1 and 21:33 still stated as flatly as 10:25 and 13:27->13:37."
    - "Remaining Minor findings from review_2026-09-15."
