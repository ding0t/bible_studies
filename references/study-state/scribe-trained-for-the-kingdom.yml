additions_2026-09-16:
  requested_by: user
  new_section_a:
    heading: "A trade, not a school of thought (inside 'What a scribe was')"
    question: >
      Author asked whether γραμματεύς names a Jewish school of thought, as "scribes and Pharisees"
      can suggest, or a diligent-student sense.
    answer: >
      Neither exactly — it names a TRADE. Evidence, all re-queried:
      (1) Mark 2:16 reads οἱ γραμματεῖς τῶν Φαρισαίων, "the scribes OF the Pharisees" — a genitive
      of affiliation, incoherent if scribe were itself a party.
      (2) Acts 23:9 reads τοῦ μέρους τῶν Φαρισαίων, "of the PARTY of the Pharisees"; μέρος (G3313)
      carries Louw-Nida domain 11.8, a faction. The NT's own technical word for a school is applied
      to Pharisee, never to scribe.
      (3) Acts 19:35 calls the pagan chief administrator of Ephesus ὁ γραμματεύς — ESV "the town
      clerk" — with domain 37.94 (civil official) against the Jewish scribes' 53.94. The trade
      existed outside Judaism and Luke used the same noun for it.
      (4) Whole-NT distribution, re-derived: 62 occurrences — 58 at 53.94, 3 at 27.22
      (Matt 13:52, Matt 23:34, 1 Cor 1:20), 1 at 37.94 (Acts 19:35).
      Nor is it the "diligent student" sense: that word is μαθητής, and it is precisely what Jesus
      ADDS at 13:52. γραμματεὺς μαθητευθείς fuses the credentialed professional and the apprentice.
  new_section_b:
    heading: "Why the new was new: reading this dispensationally"
    settled_part: >
      μυστήριον occurs 26x in the Greek NT and exactly 3x in the Gospels — Matt 13:11 // Mark 4:11
      // Luke 8:10, one saying in three accounts. Every other use is Paul (19) or Revelation (4).
      Jesus says the word once, here. Sense (withheld, then disclosed) is taken from the site's
      existing treatment in israel-and-church/israel-and-the-church.md rather than re-derived, and
      linked rather than repeated. Matthew's own 13:35 (Psalm 78:2, "hidden since the foundation of
      the world") says it in his voice.
    systematic_part: >
      The Matthew 12 -> 13 hinge is laid out from the text (12:14 conspiracy; 12:23-24 Beelzebul;
      12:31 blasphemy; 12:39 sign of Jonah refused; 12:50 family redefined; 13:1 "that same day"),
      and the deferred-kingdom conclusion is drawn — then explicitly MARKED as a systematic reading
      with the covenant-theology alternative (kingdom inaugurated rather than deferred) named, per
      AGENTS.md's confidence rule. The exegesis was not coerced to fit; the marking is the point.
    resonance_noted_as_such: >
      οἰκονομία (Eph 3:9, the word behind "dispensation") and οἰκοδεσπότης (Matt 13:52) are both
      built on οἶκος. Recorded in the study as a resonance, explicitly not as an argument.
  also_done:
    - "Discussion question added on the mystery/hinge material, so the set does not go stale after the restructure (discussion-questions.md failure mode)."
    - "bible_references extended with the 11 passages the new sections cite."
    - "References section now links israel-and-the-church.md and the glossary entry."
    - "Two antithesis constructions cut from the new prose ('a storeroom rather than a shelf'; 'offered as such rather than as an argument')."
  verified: >
