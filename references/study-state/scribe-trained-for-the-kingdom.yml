slug: "scribe-trained-for-the-kingdom"
title: "The Scribe Trained for the Kingdom"
status: review
target_path: "docs/content/scripture/scribe-trained-for-the-kingdom.md"

primary_passage: "Matthew 13:51-52"
supporting_passages:
  - "Matthew 13:10-17"
  - "Matthew 13:44-50"
  - "Matthew 9:16-17"
  - "Matthew 12:35"
  - "Matthew 23:34"
  - "Matthew 28:19-20"
  - "Ezra 7:6-11"
genre: [gospel, parable]

stages:
  scoping:
    done: true
    notes: >
      One-verse similitude closing Matthew's third discourse (13:1-53). Genre is Gospel +
      a one-line parable/similitude, so Phase 4's parable lens applies: find the single
      point the first hearers would have grasped, resist allegorising the household.
      Filed in scripture/ rather than christian-life/ because the subject is how a
      trained disciple handles the whole of revelation, old and new.
  exegesis:
    historical_context:
      done: true
      notes: >
        Matthew, written by the former tax collector (unanimous early tradition — Papias
        c. AD 135, Irenaeus c. 175, per ESV Study Bible introduction to Matthew), to a
        largely Jewish-Christian readership. The γραμματεύς in first-century Judaism:
        NIV/NKJV Cultural Backgrounds Study Bible at Matthew 5:20 — the term "can refer
        even to executors of legal documents in villages, but in the Gospels it normally
        refers to those who were literate and formally trained in the Law of Moses, often
        teaching others the law." CBSB at 7:29: "Most teachers did not want to speak on
        their own authority; when possible, they cited earlier authorities." That is the
        cultural datum the verse plays against — the scribe's stock-in-trade was old.
        OT archetype: Ezra 7:6 סֹפֵר מָהִיר (sofer mahir), which the LXX renders
        γραμματεὺς ταχύς (Brenton, Ezra 7:6); 7:11 τῷ γραμματεῖ. So γραμματεύς is the
        Greek Bible's own title for Ezra. Ezra 7:10 has three infinitives —
        לִדְרוֹשׁ / וְלַעֲשֹׂת / וּלְלַמֵּד (lidrosh / vela'asot / ulelammed), study,
        do, teach.
    literary_context:
      done: true
      notes: >
        13:52 closes the parable discourse. The chapter's own frame: 13:11 μυστήρια —
        "to you it has been given to know the secrets of the kingdom of heaven, but to
        them it has not been given" (ESV); 13:16-17 the disciples see what prophets
        longed to see; 13:35 Matthew's fulfilment citation of Psalm 78:2. 13:51 is the
        immediate trigger: "Have you understood all these things?" — "Yes." Διὰ τοῦτο
        ("therefore") ties 13:52 to that Yes. 13:53 closes the discourse; 13:54-58 the
        Nazareth rejection follows, so the verse sits at the hinge between understanding
        granted and understanding refused.
    content_word_studies:
      done: true
      notes: >
        Counts verified against macula-greek-sblgnt via bible_word/bible_concordance,
        2026-09-15. Domain codes are Louw-Nida assignments in the Macula annotation —
        scholarly judgement, not raw textual fact; flagged as such in the draft.
      terms:
        - word: "γραμματεύς"
          language: greek
          transliteration: "grammateus"
          strongs_id: "G1122"
          gloss: "scribe, teacher of the law"
          notes: >
            22 occurrences in Matthew. 20 carry Louw-Nida domain 53.94 (Jewish religious
            official); only 13:52 and 23:34 carry 27.22 (teacher/scholar) — and 23:34 is
            the other verse where the scribes in view are Jesus's own ("I send you
            prophets and wise men and scribes", ESV). 8:19 is the one scribe who
            volunteers to follow.
        - word: "μαθητεύω"
          language: greek
          transliteration: "mathēteuō"
          strongs_id: "G3100"
          gloss: "to make a disciple; passive, to be made a disciple"
          notes: >
            Only 4 NT occurrences: Matthew 13:52, 27:57 (Joseph of Arimathea,
            ἐμαθητεύθη), 28:19 (μαθητεύσατε, imperative), Acts 14:21. At 13:52
            μαθητευθείς is an AORIST PASSIVE participle — the scribe is discipled, he
            does not disciple himself.
        - word: "τῇ βασιλείᾳ"
          language: greek
          transliteration: "tē basileia"
          strongs_id: "G932"
          gloss: "to/for/in the kingdom (bare dative, no preposition)"
          notes: >
            NA28 and SBLGNT both print the bare dative; SBLGNT marks the two words
            ⸂ ⸃ as a point where printed editions diverge. The interpretive weight is on
            the unmarked dative itself: English requires a preposition the Greek does not
            supply, and the versions supply nine different ones (see translations_compared).
        - word: "θησαυρός"
          language: greek
          transliteration: "thēsauros"
          strongs_id: "G2344"
          gloss: "treasure; treasury, storeroom"
          notes: >
            9 occurrences in Matthew. 8 carry Louw-Nida 65.10 (valuables), INCLUDING
            13:44's hidden treasure. 13:52 alone carries 7.32 — a domain that contains
            only θησαυρός and ταμεῖον, "storehouse" (the word in Matthew 6:6, "go into
            your room"). So the annotators read 13:52's θησαυρός as the storeroom, and
            NIV/CSB/NLT/BSB independently translate it "storeroom".
        - word: "ἐκβάλλω"
          language: greek
          transliteration: "ekballō"
          strongs_id: "G1544"
          gloss: "to cast out; to bring out"
          notes: >
            28 occurrences in Matthew, overwhelmingly violent expulsion or exorcism
            (domains 15.44 / 53.102). Only 12:35 (x2) and 13:52 are the gentle
            "bring/put forth" sense. 13:52 sits in domain 15.174, alongside ἐξάγω and
            ἐκφέρω, "to lead/bring out".
        - word: "καινός / παλαιός"
          language: greek
          transliteration: "kainos / palaios"
          strongs_id: "G2537 / G3820"
          gloss: "new / old"
          notes: >
            παλαιός occurs exactly 3x in Matthew: 9:16, 9:17, 13:52. καινός 4x: 9:17,
            13:52, 26:29, 27:60. At 9:16-17 both carry the "worn out / unused" domains
            (58.75, 58.71); at 13:52 both carry the TEMPORAL domains (67.97, 67.115).
            Same word pair, different sense — which is how the apparent tension with the
            wineskins resolves lexically.
        - word: "οἰκοδεσπότης"
          language: greek
          transliteration: "oikodespotēs"
          strongs_id: "G3617"
          gloss: "master of a house, householder"
          notes: >
            7 occurrences in Matthew (10:25; 13:27; 13:52; 20:1; 20:11; 21:33; 24:43).
            In 10:25 the master of the house is Jesus; in 13:27 he is the sower whom
            13:37 identifies as the Son of Man; in 20:1 and 21:33 the vineyard owner
            stands for God. 24:43 is the watching disciple. So 13:52 puts the discipled
            scribe into a role Matthew mostly reserves for God or Christ.
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: >
        Culture-bound: the household storeroom, the scribal profession, the convention
        of citing predecessors. Transcultural: that the one who teaches God's people is
        first taught, by God; that the old revelation is kept and the new is added;
        that a store is filled before it is drawn on.
    theological_principle:
      done: true
      notes: >
        God trains the people who will teach His people, and He gives them everything He
        has ever said — the promises made to Israel and the kingdom Jesus has now
        revealed — as one stocked store to be spent on others. The passive
        μαθητευθείς makes the training God's act; ἐκβάλλει (present, habitual) makes
        the spending the disciple's ongoing work.
    application_draft:
      done: true
      notes: >
        Land on: you are not the source of your storeroom; nothing God has said is
        surplus; the store exists to be brought out, not kept.
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Matthew 12:35", relation: "closest intratextual parallel — ἐκβάλλει ἐκ τοῦ θησαυροῦ, same verb, same noun, same construction. bible_trace returns NO connection for it; found by lemma search, reported in the study in my own words."}
      - {ref: "Matthew 9:16-17", relation: "the other Matthean new/old pairing; different Louw-Nida sense"}
      - {ref: "Matthew 23:34", relation: "the only other γραμματεύς in Matthew tagged 27.22; Jesus sends scribes"}
      - {ref: "Matthew 5:17-20", relation: "not abolishing the Law; righteousness exceeding the scribes'"}
      - {ref: "Matthew 28:19-20", relation: "μαθητεύω imperative — the discipled become disciplers"}
      - {ref: "Ezra 7:6-11", relation: "the archetypal sofer/γραμματεύς; LXX uses the same Greek word"}
      - {ref: "2 Timothy 3:16-17", relation: "openbible leads tier, 9 votes"}
      - {ref: "1 John 2:7-8", relation: "openbible leads tier, 15 votes — old commandment and new"}
      - {ref: "Isaiah 6:9-10", relation: "quoted verbatim at Matthew 13:14-15; surfaced by study_gaps.py as the largest uncited link"}
    translations_compared:
      ["ESV", "NIV", "CSB", "NKJV", "NASB 1995/2020", "LSB", "NLT", "WEB", "ASV", "YLT", "BSB", "KJV", "Tyndale", "Rotherham"]
    divergences_noted: >
      Three forks, all verified against study-notes.db `verses` and bible-text.db.
      (1) γραμματεύς: "scribe" (ESV, NKJV, NASB, LSB, WEB, ASV, KJV, BSB) vs "teacher of
      the law" (NIV, CSB) vs "teacher of religious law" (NLT). The CSB's own footnote at
      13:52 records the fork: "Or every scribe".
      (2) the bare dative τῇ βασιλείᾳ: "for the kingdom" (ESV), "of the kingdom" (NASB,
      LSB), "in the kingdom" (NIV, CSB, BSB, WEB), "to the kingdom" (ASV, Rotherham),
      "unto the kingdom" (KJV, Tyndale), "concerning the kingdom" (NKJV), "in regard to
      the reign" (YLT). Nine relations supplied for a Greek that supplies none.
      (3) θησαυρός: "treasure" (ESV, NKJV, NASB, LSB, WEB, ASV, KJV, YLT) vs "storeroom"
      (NIV, CSB, NLT, BSB). The second group agrees with Louw-Nida 7.32.
      bible_trace returns an empty `connections` block — no quotation or lemma-level
      allusion. The Matthew 12:35 parallel is mine, stated as such.

  drafting:
    done: true
    file: "docs/content/scripture/scribe-trained-for-the-kingdom.md"
  review:
    done: false
    validated: true  # npm run validate clean; mkdocs build --strict clean (2026-09-15)

open_questions:
  - >
    Whether καινὰ καὶ παλαιά specifies the CONTENT of the store (new revelation and old
    promise, as the ESV Study Bible, both Cultural Backgrounds Study Bibles and the NIV
    Biblical Theology Study Bible all take it) or simply signals ABUNDANCE — a
    well-stocked householder with stock of every vintage. The study states the first as
    the reading the commentaries converge on and marks the second as a live alternative
    that costs nothing in the application either way.
  - >
    The order "new and old" rather than "old and new". Noted in the draft as a feature of
    the Greek; no source consulted here comments on it, so the draft records it without
    resting an argument on it.
  - >
    SBLGNT's ⸂τῇ βασιλείᾳ⸃ siglum marks divergence among printed critical editions. I did
    not have an apparatus to identify which editions read what, so the draft rests on the
    bare dative's ambiguity (a fact of every printed text) rather than on the variant.

resources_consulted:
  - {type: other, title: "bible-text.db via bible-references MCP", author: "this repo", note: "SBLGNT + Macula morphology/Louw-Nida; WEB, ASV, YLT, BSB, KJV, Tyndale, Rotherham; Brenton LXX; unfoldingWord UHB/ULT/UGNT. All counts re-derived here, not recalled."}
  - {type: commentary, title: "ESV Study Bible", author: "Crossway, 2016", note: "CONFIRMED the new/old = new revelation from Jesus and its fulfilment of OT promise reading, and supplied the link to 28:20 I had not made. Also the Matthew introduction on authorship."}
  - {type: commentary, title: "NIV / NKJV Cultural Backgrounds Study Bible", author: "Walton & Keener, Zondervan", note: "CONTRIBUTED the whole cultural-context section — what a first-century γραμματεύς was (note on 5:20) and the convention of citing earlier authorities rather than speaking on one's own (note on 7:29). Their 13:52 note is one line and only confirms."}
  - {type: commentary, title: "NIV Biblical Theology Study Bible", author: "Zondervan", note: "CONTRIBUTED the framing of continuity between the old and new eras as the verse's point, against reading it as replacement."}
  - {type: commentary, title: "NLT Life Application Study Bible", author: "Tyndale House, 2019", note: "CONTRIBUTED the observation that the professional scribes were 'trapped in the old and blind to the new' — the contrast the verse's first hearers would have felt. Also CONFIRMED the double-benefit reading."}
  - {type: other, title: "CSB Ancient Faith Study Bible footnote at Matthew 13:52", author: "Holman", note: "'Or every scribe' — the translation committee's own record that γραμματεύς/'teacher of the law' is a judgement call."}
  - {type: other, title: "Fee & Stuart, How to Read the Bible for All Its Worth", author: "Gordon D. Fee and Douglas Stuart", note: "Parable lens — one main point, resist allegorising incidental details. Applied to keep the household from being decoded."}

