    - "Framing: nothing gives Satan a bride; timing paragraph and the Israel-wife / church-Bride position are both stated as this site's reading."
  fixed:
    - "Revelation 17:1 / 21:9: 'identical up to the woman' was false -- 17:1 has τὸ κρίμα before τῆς πόρνης. Now 'identical up to what is shown', with the judgment of the prostitute."
    - "'The prophets call cities harlots' introduced a list in which Jezebel is a queen named by Jehu and Babylon is never called a harlot in the Hebrew prophets. Intro rewritten to say who calls whom what."
    - "Echoes overclaimed as identity: the golden cup 'is Jeremiah's' (in Jeremiah Babylon is the cup in the LORD's hand) and the boast 'is Isaiah 47:8's' (shared: sit, widow). Both now worded as echoes with the shared words named. Key Takeaways 'harlot cities ... reappear' (Jeremiah 25:10 is against Judah) now 'Old Testament words ... have echoes'. 'The words are the prophets'' -> 'echo the prophets''. Jeremiah 25:10 'same sentence over Judah' -> 'same words over Judah and its neighbours' (25:9)."
    - "'Proverbs 7 shows the same woman' (the adulteress of Proverbs 7 is not Folly of Proverbs 9) -> 'a woman like her'."
    - "Finery 'on loan from the beast' / 'stripped by the beast that gave it' had no text behind it -> the beast that carries her strips her (17:16). 'Given by the Lamb' -> 'granted by God' (19:8 divine passive)."
    - "Revelation 17:16 sentence: subject is the ten horns and the beast; μισήσουσιν parenthesised."
    - "Contested Babylon identity now gives a textual reason on the other side: the mountains are also seven kings (17:10)."
    - "Citation: 'forgotten prostitute' is Isaiah 23:16 -> (Isaiah 23:16-17). Bookless references given their book: Proverbs 9:6, 9:17-18, 7:22, 7:27; Isaiah 47:5; Revelation 17:1, 21:9, 17:9, 18:4. Added G4205 for πόρνοι."
  left_for_author:
    - "Isaiah 47:9, 12 give OT Babylon 'many sorceries' (LXX 47:9 ἐν τῇ φαρμακείᾳ σου, Revelation 18:23's exact phrase; LXX 47:10 adds ἡ πορνεία σου where MT differs). The strongest harlotry+sorcery link for Babylon itself; worth a sentence in Harlot cities (about 40 words)."
    - "'She belongs to no one' / 'never anyone's wife': her own boast 'I am no widow' (Revelation 18:7; Isaiah 47:8-9 'widowhood') claims a spouse-like status. Consider naming it as her claim the text refutes."
    - "Revelation 9:21's unrepentant are 'the rest of mankind' (9:20), not named as the harlot's people; the table row is an inference."
    - "Jeremiah's bridegroom/bride formula recurs (Jeremiah 7:34; 16:9; 33:11); 25:10 is the one with millstones and lamp, which justifies picking it -- could say so."
    - "Discussion question 5 is labelled The language but asks a pattern question; consider The text in its context."
