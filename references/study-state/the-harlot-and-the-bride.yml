research:
  - "Revelation 17:1 and 21:9 identical up to the object: δεῦρο, δείξω σοι (NA28)."
  - "πόρνη G4204 in Revelation 5x, all Babylon (17:1, 5, 15, 16; 19:2). νύμφη G3565 in Revelation 4x: 18:23 (silenced in Babylon), 21:2, 21:9, 22:17 (macula-greek-sblgnt)."
  - "Revelation 17:16 μισήσουσιν; contrast Ephesians 5:29."
  - "Harlotry + sorcery: LXX 2 Kings 9:22 πορνεῖαι ... φάρμακα (Jezebel); LXX Nahum 3:4 πόρνη ... πορνείᾳ ... φαρμάκοις (Nineveh); Revelation 18:23 φαρμακείᾳ (G5331); Revelation 9:21; 21:8; 22:15 φάρμακοι (G5333) and πόρνοι."
  - "Revelation 17:4 ποτήριον χρυσοῦν = LXX Jeremiah 28:7 (MT 51:7) ποτήριον χρυσοῦν. Revelation 18:7 χήρα οὐκ εἰμί ~ LXX Isaiah 47:8 οὐ καθιῶ χήρα. Revelation 18:23 ~ Jeremiah 25:10 (bridegroom/bride, millstones, lamp). Revelation 18:4 ἐξέλθατε ... ἐξ αὐτῆς ~ LXX Isaiah 52:11 ἐξέλθατε ἐκ μέσου αὐτῆς; MT Jeremiah 51:45 (absent from LXX). bible_trace found no derived link for these verses; the echoes are stated from the shared words, and the study does not claim quotation."
  - "בָּבֶל H894 = Babel (Genesis 10:10; 11:9) and Babylon."
  - "ESVSB note on Revelation 17:1-19:10: futurist readings (religious entity, rebuilt Babylon, revived Roman empire)."

decisions:
  - "2026-10-17, author: last-things placement; two-women framing."
  - "Draft links out to published studies only. Inbound links (sexual-immorality.md bride section, bride-of-christ.md, new-jerusalem.md) are added in the commit that publishes this study."

