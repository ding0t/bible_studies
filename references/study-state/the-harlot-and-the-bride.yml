  - {slug: "israel-and-church/bride-of-christ.md", role: cited, use: link, note: "Israel the wife restored (Hosea 2), church the Bride; 2 Corinthians 11:2."}
  - {slug: "israel-and-church/wife-of-the-lamb.md", role: cited, use: link, note: "Revelation 19 and 21."}
