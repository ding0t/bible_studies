# Brief (author, 2026-10-17): from the Sexual Immorality bride section -- "a pattern of those who
# follow Satan as the bride anti-pattern"; new study, link to the sin study and the bride study.
# Framing agreed with the author: Scripture's two women (the harlot and the Bride); Satan is the
# deceiver and the power behind the harlot, never her bridegroom. Placement: last-things.

genre: [apocalyptic, prophets, wisdom, epistle]
statement_of_faith: "End times: dispensational, pretribulational. Babylon falls in the seventh bowl (Revelation 16:19); the church is caught up before; Revelation 18:4 addressed to God's people then, the call already the church's via 2 Corinthians 6:17. Bride of Christ study: Israel the LORD's wife (restored), church the Bride -- kept consistent."
thesis: "Scripture sets two women before every person, the harlot, who seduces with luxury and sorcery and is devoured by the beast she rides, and the Bride, whom the Lamb washes, clothes and marries, and God calls His people to come out of the one and make ready for the other."

