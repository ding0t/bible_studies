genre: [topical]

thesis: "Scripture calls the stars God's creatures, the measure of Abraham's children, Jacob's sons and heaven's servants, and it names the star made into a god an idol; out of them all it promises one Star from Jacob, and Jesus takes that title, the bright Morning Star, who rises in His people's hearts, shares His dawn with those who overcome and still shines when every other star has fallen."
thesis_draft: "Scripture calls the stars God's creatures, Abraham's countless children, Jacob's sons and heaven's servants, and it names the star made into a god an idol; out of all of them it gives one Star to a person, the King out of Jacob, and Jesus takes that title, the bright Morning Star, and shares His dawn with those who overcome."
outline_draft:
  - {section: "Stars God made, counts and names", says: "Creatures under God (Gen 1:16; Ps 147:4), so never to be worshipped (Deut 4:19) or read for fate (Isa 47:13)"}
  - {section: "As many as the stars", says: "Abraham's offspring (Gen 15:5 onward; Heb 11:12): the stars are the promise's measure"}
  - {section: "Stars that are persons", says: "Jacob's sons in Joseph's dream (Gen 37:9-10), the woman's crown (Rev 12:1, link Tribulation), the wise who shine (Dan 12:3)"}
  - {section: "Heaven's servants", says: "Morning stars and sons of God (Job 38:7, check Nephilim), the stars that fought (Judg 5:20), the seven stars in Christ's hand (Rev 1:20), fallen stars (Rev 9:1; 12:4)"}
  - {section: "The counterfeit", says: "The star made a god (Amos 5:26; Acts 7:43); the day star who climbs (Isa 14:12-15, link Pride); wandering stars (Jude 13)"}
  - {section: "The Star out of Jacob", says: "Num 24:17 (link Balaam study); the Magi's star (Matt 2:2, 9-10), what the text says it did; the Morning Star given and held (Rev 2:28; 22:16; 2 Pet 1:19)"}
  - {section: "When the stars fall", says: "The end-time signs (Isa 13:10; Matt 24:29; Rev 6:13), and the Star that does not"}
