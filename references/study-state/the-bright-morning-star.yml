open_questions:
  - "Job 38:7: are the 'morning stars' the 'sons of God' (parallelism) or stars alongside them? Check Nephilim's reading first; mark confidence."
  - "Matthew 2:9-10: the star 'went before them and stood over the place'. Say what the text says it did; any natural explanation (conjunction, comet) is outside the text and goes, at most, in an annex."
  - "Isaiah 14:12 heylel: the LXX heosphoros and the Vulgate lucifer; how 'Lucifer' entered English. Keep consistent with Pride."
  - "Rev 2:28 'I will give him the morning star': what is given? Christ Himself (22:16), or a share in His rule (2:26-27)? Contested; give both cases."
  - "Rev 12:1 twelve stars: Tribulation holds Israel; keep consistent."
