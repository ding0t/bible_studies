  research_2026-11-08:
    counts: "morphhb-wlc kokab H3556: 37 verses (Hebrew numbering Neh 4:15, Ps 8:4, Joel 4:15 = English Neh 4:21, Ps 8:3, Joel 3:15). macula-greek-sblgnt aster G792: 21 verses; astron G798: 4 (Luke 21:25; Acts 7:43; 27:20; Heb 11:12); phosphoros G5459: 2 Pet 1:19; proinos G4407: Rev 2:28; 22:16."
    findings:
      - "LXX (Brenton) Num 24:17: 'anatelei astron ex Iakob, anastesetai anthropos ex Israel' (a star will rise from Jacob, a MAN will rise up from Israel): the Greek reads the scepter line as a person."
      - "Matt 2:2, 9 'en te anatole' (G395; BSB 'in the east', fn 'Or as it rose'); same root as LXX Num 24:17 anatelei (G393), Luke 1:78 anatole 'Dawn', 2 Pet 1:19 anateile. Marked as an echo; no quotation."
      - "Isa 14:12 heilel H1966 (BSB fn 'Or morning star or shining one or Lucifer'); LXX Heosphoros. Kept apart from Rev 22:16 aster ho lampros ho proinos. Consistent with sin/pride (contested; links there)."
      - "Job 38:7: parallel with 'sons of God' (heaven's court, Job 1:6; 2:1, per Nephilim); LXX reads two events ('when the stars were made, all my angels praised me'). Marked likely."
      - "Rev 2:28: both readings given (share in rule / Christ Himself); ESVSB note on 2:26-28 'The morning star is Christ himself'; the study holds both together."
      - "Rev 1:20 angels: contested (ESVSB, NIV BTSB list heavenly angels, messengers, personifications)."
      - "Dan 8:10 stars = 'the holy people' (8:24). Rev 12:4 stars likely = his angels (12:7-9)."
      - "Matt 2:9 the star went ahead and stood over the place: the study says what the text says it did, and nothing of natural explanations (ESVSB 2:2 also judges it not a natural phenomenon)."
      - "No Latin Vulgate in bible-text.db, so the Vulgate 'lucifer' at 2 Pet 1:19 was not verified and is not used."
  balaam_fork: "The Balaam study's five-use list became sections 1-5 here (expanded). At publish: replace that list in biblical-figures/the-donkey-and-her-prophet.md with two sentences and a link, in the same commit."
