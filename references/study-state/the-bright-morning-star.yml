  siblings_fixed: "spiritual-beings/nephilim.md: bene ha-elohim is in two other places (Job 1:6; 2:1), Job 38:7 has bene elohim without the article; LXX Job 38:7 is 'my angels'. last-things/prophecy-events-times.md: the Bethlehem star now says what Matthew 2:9 says it did, with the conjunction proposals marked as one view, linking here. jesus/names-of-jesus.md: kokhav -> kokab, and a back-link. biblical-figures/the-donkey-and-her-prophet.md: star list cut to a summary and link."
