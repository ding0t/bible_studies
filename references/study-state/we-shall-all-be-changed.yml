slug: we-shall-all-be-changed
title: "We Shall All Be Changed"
status: published # 2026-09-28, author approved
target_path: docs/content/last-things/we-shall-all-be-changed.md
origin: >
  Backlog item "We will all be changed, raised imperishable" (docs/content/about/backlog.md),
  started 2026-09-28. Asks: the new body promised to believers; link to the last-things studies;
  check the tie-in with backlog 5.6 (white robes); use/link 4.2 (at-home-with-the-lord.md), which
  should in turn point here once this is published.

primary_passage: "1 Corinthians 15:35-58"
supporting_passages: ["1 Corinthians 15:12", "1 Corinthians 15:20-26", "Genesis 2:7", "Isaiah 25:8", "Isaiah 26:19", "Hosea 13:14", "Philippians 3:20-21", "Romans 8:11", "Romans 8:23", "Romans 8:29", "1 John 3:2", "1 Thessalonians 4:16-17", "2 Corinthians 5:1-4", "Luke 24:36-43", "John 20:19-27", "1 Timothy 6:16", "Hebrews 1:12", "Revelation 6:11"]
genre: [epistle]

thesis: >-
  At the last trumpet God raises the body that was buried and changes it, and changes the living
  with it, into a body like the risen Jesus' own -- imperishable, glorious, strong and filled with
  the Holy Spirit -- so that death, swallowed up, never touches you again.
outline:
  - {section: "The question Corinth asked", says: "Greek disdain for bodily resurrection vs Jewish hope; 15:35's two questions set the plan of 15:36-58."}
  - {section: "The seed: the same body, changed", says: "Continuity -- the body raised is the body sown ('this' x2 in 15:53); Jesus' touchable, wounded, yet changed body (Luke 24, John 20)."}
  - {section: "Four contrasts", says: "15:42-44 table; phthora/aphtharsia; psychikos/pneumatikos describe what animates the body, not its substance (1 Cor 2:14-15, Rom 8:11)."}
  - {section: "Two Adams", says: "Gen 2:7 quoted from the LXX; last Adam gives life; symmorphos (Rom 8:29, Phil 3:21) -- glorification completes the image."}
  - {section: "The mystery: changed in a moment", says: "The living changed with the dead; allasso, atomos, rhipe; last trumpet = 1 Thess 4 (rapture, contested timing marked); endyo + athanasia (God alone has it, 1 Tim 6:16); 2 Cor 5:4 link; white robes distinct."}
  - {section: "Death swallowed up", says: "Isa 25:8 (lanetsach vs eis nikos), Hos 13:14 (LXX dike vs nikos); sting is sin -- atonement named; victory given."}
  - {section: "Therefore", says: "15:58 -- labour in the body is not in vain; hope at the graveside."}
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: "last-things/ beside at-home-with-the-lord.md; slug from ESV 'we shall all be changed'."
  exegesis:
    historical_context:
      done: true
      notes: >
        Ephesus, spring AD 53-55 (ESV SB intro; 1 Cor 16:8). Resurrection denied by some (15:12),
        likely raised in their letter (7:1; ESV SB note on 15:1-58). Greco-Roman ridicule of bodily
        afterlife (ESV SB); Jewish hope = restored body (CBSB on Phil 3:21; Dan 12:2; Job 19:26).
    literary_context:
      done: true
      notes: "15:1-34 that; 15:35-58 how. 36-41 how raised; 42-49 what kind; 50-57 when/victory; 58 therefore."
    content_word_studies:
      done: true
      terms:
        - {word: "σπείρω", language: greek, transliteration: speirō, strongs_id: G4687, gloss: "sow", notes: "4x in 15:42-44"}
        - {word: "φθορά / ἀφθαρσία", language: greek, transliteration: "phthora / aphtharsia", strongs_id: "G5356 / G861", gloss: "decay / incorruption", notes: "aphtharsia 7x NT, 4 in 1 Cor 15"}
        - {word: "ψυχικός / πνευματικός", language: greek, transliteration: "psychikos / pneumatikos", strongs_id: "G5591 / G4152", gloss: "natural / spiritual", notes: "psychikos 6x NT incl. 1 Cor 2:14; ESV SB: body animated by the Holy Spirit"}
        - {word: "σύμμορφος", language: greek, transliteration: symmorphos, strongs_id: G4832, gloss: "conformed", notes: "2x NT: Rom 8:29, Phil 3:21"}
        - {word: "ἀλλάσσω", language: greek, transliteration: allassō, strongs_id: G236, gloss: "change", notes: "6x NT; of believers only 1 Cor 15:51-52; Heb 1:12 of heavens like a garment"}
        - {word: "ἄτομος / ῥιπή", language: greek, transliteration: "atomos / rhipē", strongs_id: "G823 / G4493", gloss: "instant / twinkling", notes: "each once in SBLGNT, 1 Cor 15:52"}
        - {word: "ἐνδύω", language: greek, transliteration: endyō, strongs_id: G1746, gloss: "put on (clothing)", notes: "4x in 1 Cor 15:53-54"}
        - {word: "ἀθανασία", language: greek, transliteration: athanasia, strongs_id: G110, gloss: "immortality", notes: "3x NT: 1 Cor 15:53, 54; 1 Tim 6:16"}
        - {word: "לָנֶצַח", language: hebrew, transliteration: lanetsach, strongs_id: H5331, gloss: "forever", notes: "Isa 25:8 MT; Paul eis nikos; LXX makes death the subject (katapinō, thanatos, ischyō)"}
        - {word: "δίκη", language: greek, transliteration: dikē, strongs_id: G1349, gloss: "punishment", notes: "LXX Hos 13:14 where Paul has nikos (CBSB on 15:55)"}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Corinthian Greek objection is local; the promise is Paul's universal 'we' (15:51)."
    theological_principle:
      done: true
      notes: "Glorification of the body: same body, changed, conformed to the risen Christ, by the Spirit, at His coming."
    application_draft:
      done: true
      notes: "15:58 is Paul's own application; graveside hope; weakness belongs to the body sown."
    statement_of_faith:
      done: true
      notes: "Consistent with 'A body like His' (statement-of-faith.md) and its End times pretrib position; no conflict."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "1 Thessalonians 4:16-17", relation: "same event, trumpet, dead raised and living caught up"}
      - {ref: "Philippians 3:21", relation: "same promise, Christ's glorious body the model"}
      - {ref: "2 Corinthians 5:4", relation: "same clothing picture; at-home-with-the-lord.md"}
    translations_compared: ["ESV", "LSB", "WEB", "ULT"]
    divergences_noted: "LSB footnotes 15:42 'Lit in corruption / in incorruption'. 15:49 variant 'let us bear' (LSB, NLT footnotes) not used in the draft."
    sibling_check: >
      cross_study_claims.py "1 Corinthians 15": rapture.md, trumpet.md, taken-before-judgment.md,
      immediately-after.md all read 15:51-53 as the rapture; trumpet.md separates the trumpet texts.
      heaven-and-earth-will-pass-away.md uses allassō the same way. No contradiction found.
  drafting:
    done: true
    file: docs/content/last-things/we-shall-all-be-changed.md
    notes: >
      Drafted 2026-09-28 without the thesis/outline stop (author asked for the study to be developed
      in the same request). Not yet read-bible-study'd or reviewed.
  review:
    done: true
    validated: true
    notes: "review-bible-study pass 2026-09-28; see review_2026-09-28. npm run validate clean for this file except the provenance warning (ai_provider_models: [] until refresh_frontmatter_provenance.py runs)."

job_addition_2026-09-28: >
  Author asked for Job parallels. Added "### Job asked first" under Death swallowed up: Job 14:14
  chalipah (clothing-change noun; verb chalaph = Ps 102:26, LXX allasso), Job 19:25-27 goel (19:26
  marked contested; LXX anastesai), Job 33:24-28 padah/kopher (LXX diaphthora), LXX Job 42:17
  addition as historical witness (Brenton Greek, our translation).
open_questions:
  - >
    at-home-with-the-lord.md "The body, still owed" should link here -- deferred until this page is
    published, since a published page linking a draft fails mkdocs build --strict.
  - >
    Backlog 5.6 (white robes): Revelation 6:11's robes are given to souls not yet raised, so they are
    not the resurrection body. The study says so in one paragraph and leaves the robes' meaning to 5.6.
  - "15:49 textual variant (phoresomen vs phoresōmen, 'we shall' vs 'let us') -- now disclosed in one sentence (review 2026-09-28); not argued further."
  - "Fork candidate: the resurrection of the unjust (Dan 12:2; John 5:29) -- out of scope."

