review_2026-09-28:
  reviewer: "review-bible-study skill (separate agent from the drafter)"
  checked:
    - "Phase 1: every ESV quotation re-queried with study_verse (1 Cor 15:3, 12, 20-26, 35-58; 1 Cor 2:14-15; Gen 2:7; Isa 25:6-8; 26:19; Hos 13:14; Dan 12:2-3; Job 19:26; Luke 24:16, 39-43; John 20:19, 27; Rom 5:14; 8:11, 29; Phil 3:21; 1 John 3:2; 1 Thess 4:16-17; 1 Tim 6:16; 2 Cor 5:4; Heb 1:12; Rev 6:11). All verbatim."
    - "Phase 2/3: counts re-run on macula-greek-sblgnt (speiro 4x in 15:42-44; aphtharsia 7; psychikos 6; symmorphos 2; allasso 6; atomos 1; rhipe 1; endyo 4x in 15:53-54; athanasia 3). LXX Gen 2:7, Isa 25:8, Hos 13:14 (ebible-grcbrent + lxx-lemmas); MT Isa 25:8, Hos 13:14 (macula-hebrew-wlc)."
    - "Commentary: every ESV SB, NIV CBSB and NIV BTSB attribution checked against study_note; each within a sentence or two."
    - "Siblings: cross_study_claims.py '1 Corinthians 15' -- rapture.md, trumpet.md, at-home-with-the-lord.md, heaven-and-earth-will-pass-away.md, immediately-after.md, taken-before-judgment.md consistent. Link anchors to rapture.md, trumpet.md, at-home-with-the-lord.md resolve."
    - "Statement of faith: consistent with 'A body like His' and End times (pretrib stated as this site's reading, contest marked)."
    - "Phase 5 independent check: BTSB notes on 15:44 and 15:49 (not the notes the study cites) confirm 'spiritual body' = Spirit-created, physical body."
  fixed:
    - "Synthetic claim: 'differs from the Hebrew at one word' was false -- Paul's verb is also passive (katepothe); rewritten, and LXX sentence clarified (death is the one that swallows)."
    - "allasso 'used of believers only in 1 Cor 15:51-52' -- Gal 4:20 has Paul as subject; narrowed to 'of believers being changed', count (6) stated; Heb 1:12 noted as quoting Ps 102:26."
    - "touto Strong's G3778 -> G5124 (the id the data and pop-up match on)."
    - "CBSB paraphrases tightened: 'later Greek version' (CBSB says 'one Greek version ... not the Septuagint'); 'flesh and blood' = expression for mere humans, applied by Paul to mortal humanity. BTSB Phil 3:21 now quoted ('not limited by being material')."
    - "Context gap: Hos 13:14 promise-or-threat reading undisclosed while ESV/NIV/CSB and NASB/LSB/NLT divide on it; one paragraph added marking it contested."
    - "Undisclosed fork: 15:49 'let us bear' variant (LSB, NLT footnotes) under 'You will bear His image'; one sentence added."
    - "Bare '15:35' named its book; '(ESV, emphasis added)' on italicised 15:53; John 20:19 grammar; cut 'and it reads well aloud'; Romans 5:14 added to the 'Adam, a type' takeaway."
    - "Frontmatter: bible_references += Isaiah 26:19, 1 Corinthians 2:14-15, Romans 5:14."
  left_for_author:
    - "ai_provider_models: [] -- run utils/refresh_frontmatter_provenance.py before commit."
    - "Word count 4,436 -> ~4,660 raw (Check 23 does not fire: References/outline excluded). Near budget; simplify-bible-study if it grows."
    - "Human-judgment tells (essay register in Key Takeaways/prayer) not assessed by the reviewer."

