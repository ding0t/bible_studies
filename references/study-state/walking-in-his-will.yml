genre: [epistle, gospel, topical]

thesis: "God has made His will known in His word and in His Son, and as you hand Him your will, He renews your mind to test and approve it and works in you to walk in it (Romans 12:1-2; Hebrews 13:21)."
outline:
  - {section: "Key Takeaways / Study outline", says: "the five movements and the one sentence"}
  - {section: "Romans 12:1-2 in its place", says: "'therefore' after Romans 1-11: the will of God is walked in by people who have received mercy; the dokimazo arc 1:28 -> 2:18 -> 12:2"}
  - {section: "1. Knowing His will", says: "what God has revealed belongs to us (Deut 29:29); He has told you (Micah 6:8); Scripture names His will outright (1 Thess 4:3; 5:18); the sovereign purpose (Eph 1:11) is His, the revealed will is ours to do; Col 1:9 prays for the knowledge (epignosis) of it"}
  - {section: "2. Submitting our will", says: "paristemi: present your bodies (Rom 12:1, echoing 6:13-19); Jesus in Gethsemane prays the Lord's Prayer's own words (Matt 26:42 = Matt 6:10); 'If the Lord wills' (James 4:15)"}
  - {section: "3. Seeking His will", says: "Jesus sought the Father's will (John 5:30) and it was His food (John 4:34); ask for wisdom (James 1:5); pray it for others (Col 1:9; 4:12); 'Teach me to do your will' (Ps 143:10); Acts 16:6-10 as illustration (guided while moving), marked narrative"}
  - {section: "4. Testing and approving His will", says: "dokimazo = test and then approve; a renewed mind (Rom 12:2) reverses the mind that refused to approve God (1:28); knowing and approving without doing (2:18-23) is the warning; Eph 5:10, Phil 1:9-10; contested: whether God has an individual 'blueprint' will for each choice -- give both sides"}
  - {section: "5. Following His will", says: "walk (peripateo; Hebrew halak): Col 1:10, Eph 5:15-17, Micah 6:8; willing the will leads to knowing (John 7:17); God equips and works in you (Heb 13:21; Phil 2:13); whoever does the will of God abides forever (1 John 2:17)"}
  - {section: "Discussion questions", says: "facet-labelled set"}
  - {section: "References & Recommended Reading", says: ""}
word_budget: 4000
word_budget_reason: ""

stages:
  scoping:
    done: true
    notes: "Topical study from the author's five headings. Spine: Romans 12:1-2, which itself contains submitting (present), testing/approving (dokimazo) and the will of God; Colossians 1:9-10 and Ephesians 5:10-17 tie knowing to walking. No backlog entry for this topic (grepped about/backlog.md)."
  exegesis:
    historical_context:
      done: true
      notes: "Romans: Paul from Corinth c. AD 57 to the churches in Rome (ESV SB intro). 12:1 'therefore' turns from chs 1-11 to 12:1-15:13. Colossians: Paul writing to a church he had not met, where teachers offered knowledge/wisdom (Col 2:4, 8) -- Paul prays for knowledge of God's will that issues in a walk."
    literary_context:
      done: true
      notes: "Romans 12:1-2 heads the exhortation section; 12:3-15:13 spells out the will of God concretely (humility, gifts, love, enemies, authorities, the weak). dokimazo occurs four times in Romans: 1:28 (did not approve to have God in knowledge -> adokimos mind), 2:18 (know the will and approve the excellent, yet steal/commit adultery 2:21-23), 12:2, 14:22. paristemi in Romans 6:13, 16, 19 (x2 in 13 and 19) and 12:1: 12:1 picks up chapter 6's 'present yourselves'."
    content_word_studies:
      done: true
      notes: "Counts from macula-greek-sblgnt via bible_concordance."
      terms:
        - {word: "θέλημα", language: greek, transliteration: "thelēma", strongs_id: "G2307", gloss: "will, what is willed", notes: "62 occurrences in SBLGNT (count_only). Matt 6:10 and 26:42 identical: γενηθήτω τὸ θέλημά σου. John 7:17 ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν."}
        - {word: "δοκιμάζω", language: greek, transliteration: "dokimazō", strongs_id: "G1381", gloss: "test, prove; approve after testing", notes: "23 occurrences SBLGNT; Romans 1:28, 2:18, 12:2, 14:22; Eph 5:10; Phil 1:10; 1 Thess 5:21; 1 John 4:1; 1 Cor 3:13. ESV SB: 'finding out the worth of something by putting it to use'. NIV/BSB 'test and approve'; ESV 'by testing you may discern'; LSB footnote on Eph 5:10 'Lit proving what'."}
        - {word: "παρίστημι", language: greek, transliteration: "paristēmi", strongs_id: "G3936", gloss: "present, place at someone's disposal", notes: "Romans 6:13 (x2), 6:16, 6:19 (x2), 12:1, 14:10, 16:2."}
        - {word: "συσχηματίζω", language: greek, transliteration: "syschēmatizō", strongs_id: "G4964", gloss: "be conformed, shaped to a pattern", notes: "Only Rom 12:2 and 1 Pet 1:14 in the NT (concordance: 2 rows)."}
        - {word: "μεταμορφόω", language: greek, transliteration: "metamorphoō", strongs_id: "G3339", gloss: "be transformed", notes: "Four NT uses: Matt 17:2, Mark 9:2 (transfiguration), 2 Cor 3:18, Rom 12:2. Present imperative passive in Rom 12:2: an ongoing change done to you."}
        - {word: "ἀνακαίνωσις / νοῦς", language: greek, transliteration: "anakainōsis / nous", strongs_id: "G342 / G3563", gloss: "renewal / mind", notes: "Rom 12:2 renewed nous answers Rom 1:28 adokimos nous."}
        - {word: "ἐπίγνωσις", language: greek, transliteration: "epignōsis", strongs_id: "G1922", gloss: "knowledge, full knowledge", notes: "Col 1:9 τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ; LSB footnote 'Or true knowledge'. Also Rom 1:28 ἐν ἐπιγνώσει."}
        - {word: "περιπατέω", language: greek, transliteration: "peripateō", strongs_id: "G4043", gloss: "walk, conduct one's life", notes: "Col 1:10 περιπατῆσαι ἀξίως; Eph 5:8, 15; Eph 2:10."}
        - {word: "רָצוֹן", language: hebrew, transliteration: "ratson", strongs_id: "H7522", gloss: "will, delight, favour", notes: "Ps 143:10 לַמְּדֵנִי לַעֲשׂוֹת רְצוֹנֶךָ; Ps 40:9 (Eng 40:8) לַעֲשׂוֹת רְצוֹנְךָ, quoted Heb 10:7. TODO: verify full pointed forms and pronunciation before drafting."}
        - {word: "הָלַךְ", language: hebrew, transliteration: "halakh", strongs_id: "H1980", gloss: "walk", notes: "Micah 6:8 הַצְנֵעַ לֶכֶת; TODO verify pointed text."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Sacrificial language (Rom 12:1) presumes temple offering; transcends as whole-life offering. Acts 16:6-10 is narrative: illustrates guidance while moving, does not establish a method (Spirit-forbidding, visions) as norm."
    theological_principle:
      done: true
      notes: "God's will is revealed (word, Son) before it is discerned; discernment is the work of a mind God renews in a person who has presented himself to Him; it ends in walking, and God Himself equips the walk."
    application_draft:
      done: false
      notes: ""
  cross_reference:
    done: false
    cross_refs: []
    translations_compared: ["ESV", "NIV", "BSB", "LSB footnotes"]
    divergences_noted: "Rom 12:2 dokimazo: ESV 'by testing you may discern' (splits it into two English verbs), NIV/BSB 'test and approve' (keeps both senses). aion: ESV/NIV/BSB 'world'; LSB footnote 'Or age'. teleios: LSB footnote 'Or complete'."
  drafting:
    done: true
    notes: "Order changed to Submitting -> Knowing -> Seeking -> Testing -> Following (John 7:17; Romans 12:1-2 runs present -> renew -> approve). Knowing split into three circles at the author's direction: will for every person (1 Tim 2:4; 2 Pet 3:9; Matt 18:14; John 6:40), for His people (1 Thess 4:3; 5:18), for each person (Eph 2:10; Jer 1:5; Ps 139:16; Gal 1:15; 1 Cor 1:1; Rom 12:6; 1 Cor 12:11; 2 Tim 2:20-21). Romans 9:21 marked contested (ESV SB: saved/unsaved; corporate reading from Rom 9:24 and Jer 18:6-10). Individual-guidance debate given both sides with Friesen named. 1 Thess 3:1 'it seemed best' dropped: ESV reads 'we were willing'; used Acts 15:28 instead."
    file: "docs/content/christian-life/walking-in-his-will.md"
  review:
    done: false
    validated: true # npm run validate: provenance warnings only (pre-commit); link targets and anchors confirmed in built site

open_questions:
  - "Contested: is there an individual, specific will of God for each decision (traditional view) or the moral will plus freedom and wisdom within it (Garry Friesen, Decision Making and the Will of God)? Present both sides with textual reasons; Rom 12:2's will is defined by 12:3-15:13 (moral), but Acts 16 and James 4:15 show God directing particulars."
  - "Run bible_trace on Rom 12:2 and Col 1:9 in Phase 6."
