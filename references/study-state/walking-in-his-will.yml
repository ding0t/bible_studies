slug: "walking-in-his-will"
title: "Walking in His Will"
status: review # draft written 2026-11-03; author approved thesis, asked for both universal and individual will, order left to agent
target_path: "docs/content/christian-life/walking-in-his-will.md"

primary_passage: "Romans 12:1-2"
supporting_passages:
  - "Colossians 1:9-10"      # knowledge of His will -> walk worthy
  - "Ephesians 5:8-17"       # walk, test what pleases the Lord, understand His will
  - "Deuteronomy 29:29"      # secret vs revealed things
  - "Micah 6:8"              # He has told you what is good; walk humbly
  - "1 Thessalonians 4:3; 5:18" # "this is the will of God"
  - "Romans 6:13, 16, 19"    # paristemi: present yourselves
  - "Luke 22:42; Matthew 26:39, 42" # Gethsemane
  - "Matthew 6:10"           # same Greek as Matthew 26:42
  - "John 4:34; 5:30; 6:38"  # Jesus seeks/does the Father's will
  - "John 7:17"              # willing the will -> knowing
  - "Psalm 143:10; Psalm 40:8; Hebrews 10:7-10"
  - "Romans 1:28; 2:17-23"   # dokimazo arc in Romans
  - "Philippians 1:9-10"     # approve what is excellent
  - "James 1:5; 4:13-15"     # ask for wisdom; "if the Lord wills"
  - "Acts 16:6-10"           # narrative illustration of guidance while moving
  - "Hebrews 13:20-21; Philippians 2:13" # God works in us to do His will
  - "1 John 2:17"            # whoever does the will of God abides forever
  - "Ephesians 1:9-11"       # His sovereign purpose (the will that cannot fail)
