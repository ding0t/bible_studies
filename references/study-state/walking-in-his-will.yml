review_2026-11-03:
  skill: review-bible-study (phases 1-8)
  reviewer: anthropic/claude-opus-5.5 (subagent; author not in session)
  status_at_review: "draft: true"
  checked: >
    All 47 ESV quotations re-pulled from study-notes.db (esv-study-bible) and compared: all match,
    references and labels correct. NIV/BSB "test and approve" (Rom 12:2), LSB footnotes (Rom 12:1-2,
    Eph 5:10, Col 1:9), ESVSB notes on Rom 12:2 and 9:20-21 confirmed. Counts re-run on
    macula-greek-sblgnt: dokimazo 23 (Romans 4), syschematizo 2, metamorphoo 4, thelema 62,
    paristemi 5 in Rom 6. Greek of Matt 6:10/26:42, John 7:17, Col 1:9, Eph 2:10, 2 Tim 2:21,
    Acts 16:10 and Hebrew of Ps 143:10, Mic 6:8, Deut 29:28 checked against SBLGNT/OSHB.
    review_gaps, bible_trace (Rom 12:2, Col 1:9), cross_study_claims "Romans 12", strongs_suggest,
    npm run validate. Independent commentary: NLT Life Application (Rom 12:2, 9:21), NIVBTSB 9:22.
  fixes_applied:
    - "'Some of God's will is written in a sentence with \"this is the will of God\" in it' -> 'named in so many words' (1 John 2:17 has no such sentence)."
    - "Mic 6:8 hatsnea lekhet: added H6800, H3212 and that Strong's files lekhet under H3212 (OSHB tags it 3212, not H1980)."
  open_recommendations:
    - "Rom 9:21 paragraph: individual reading given only as an ESVSB position, corporate reading given textual reasons in the study's voice. Give the individual reading its text (Rom 9:13-18, 22-23; 9:24 'us whom he has called'). Rom 9:23 uses proetoimazo, the same verb as Eph 2:10 -- its only other NT use -- unmentioned."
    - "'When Scripture names no choice': 'Both views ... God has a will for each life' misstates Friesen, who denies an individual will to be found; he affirms the sovereign will. 'Neither will lead you wrong' is an unmarked pastoral claim. Romans 12:6 used for individual will while the Friesen bullet assigns 12:3-15:13 to moral will; line 106 states the moral-will reading in the study's voice. Traditional view omits Prov 3:5-6, its most-cited text. Friesen citation (with J. Robin Maxson, Multnomah, rev. 2004) consistent with known publication data; not checkable against repo sources."
    - "Rom 12:2 imperatives: RP reads infinitives (SBLGNT apparatus); syschematizesthe is middle-or-passive (MACULA V-PEM). Spirit as agent better grounded by Titus 3:5 (anakainosis, only other NT use)."
    - "John 7:17 widened from knowing the teaching's origin to 'God shows His will to a person who has already decided to do it'."
    - "Discussion Q5 label 'Seeking.' is not a facet label; test-the-spirits.md (state file: link) is not linked; several glossed words lack pronunciation."
  cross_reference_gaps: "No missed quotations or parallels. Leads that bear on the argument: Titus 3:5, Eph 4:22-24 and Col 3:10 (renewal), Rom 8:29 (conformed to the image), 1 Pet 2:15 and 4:2 (will of God named), Prov 3:5-6, Rom 9:23. Col 1:9 -> Dan 1:4 'quotation' is a 4-word shared phrase, noise."

