  - {slug: "christian-life/prayer-as-communion.md", role: cited, use: link, note: "has 'Your will be done: you seek His will first' (Luke 22:42, 1 John 5:14); link from Submitting/Seeking rather than re-argue"}
  - {slug: "christian-life/lords-prayer.md", role: cited, use: link, note: "'Your kingdom come, your will be done' section; link from Matthew 6:10 / 26:42 sentence"}
  - {slug: "christian-life/true-worship.md", role: cited, use: link, note: "covers Romans 12:1 latreia as whole-life worship; one sentence + link"}
  - {slug: "last-things/end-of-the-age.md", role: cited, use: link, note: "covers 'this age' (aion) in Romans 12:2; one sentence + link"}
  - {slug: "christian-life/take-up-your-cross.md", role: cited, use: link, note: "deny/take up/follow; the mind set on things of man (phroneo); link from Following"}
  - {slug: "jesus/the-cups-jesus-drank.md", role: cited, use: link, note: "Gethsemane cup; author has uncommitted edits to it -- do not touch"}
