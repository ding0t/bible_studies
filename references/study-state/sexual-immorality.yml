genre: [epistle, topical]

thesis: "Scripture calls every sexual union outside the one-flesh marriage of a man and a woman sexual immorality, and Paul gives the reason it is sin: your body belongs to the Lord who bought it and will raise it, and it is joined to Him, so flee immorality and glorify God in your body."
outline:
  - {section: "What Scripture calls sexual immorality", says: "πορνεία covers every sexual union outside marriage (1 Corinthians 5:1; Acts 15:20 with Leviticus 18; Matthew 15:19), the boundary Jesus draws from Genesis 2:24 (Matthew 19:4-6), reaching to the heart (Matthew 5:28; Hebrews 13:4)."}
  - {section: "Corinth's slogans", says: "Some believers used prostitutes on the slogans 'All things are lawful' and 'Food is meant for the stomach'; Paul quotes and answers them (1 Corinthians 6:12-13)."}
  - {section: "The body is for the Lord", says: "God will raise the body as He raised Jesus, so what you do with it matters to Him (1 Corinthians 6:13-14)."}
  - {section: "Joined to Christ", says: "Paul uses Genesis 2:24's verb for both unions: one body with a prostitute, one spirit with the Lord (1 Corinthians 6:15-17); marriage pictures Christ and the church (Ephesians 5:31-32; 2 Corinthians 11:2), so immorality tells a lie about that union. The 'bride' step is marked as the study's reading."}
  - {section: "A sin against your own body", says: "1 Corinthians 6:18, with the textual fork marked: 'other' is not in the Greek, so 'every sin... is outside the body' may be a Corinthian slogan Paul refutes. Either way Paul says sexual sin is against one's own body (Proverbs 6:32)."}
  - {section: "A temple bought with a price", says: "The body is the Spirit's ναός, and you are not your own: you were bought; so glorify God in your body (1 Corinthians 6:19-20)."}
  - {section: "Flee, and you were washed", says: "The command is flight (Genesis 39:12; 1 Corinthians 10:13; 1 Thessalonians 4:3-8), and the ground under it is grace: 'such were some of you. But you were washed' (1 Corinthians 6:11; 1 John 1:9)."}
