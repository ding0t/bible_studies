    notes: "Backlog 9.2 is the brief: what Scripture calls sexual sin; why it is sin; the impact on the individual (sin against one's own body); 'defiling the image of the bride of Christ?'. Existing page is a 28-word stub; rewrite in place at the same URL."
  exegesis:
    historical_context:
      done: true
      notes: "Paul from Ephesus, spring AD 53-55 (ESV Study Bible intro). Corinth a port city at the isthmus. ESVSB note on 6:12-20: some Corinthian believers were using prostitutes, treating bodily appetite as indifferent. Avoid the '1,000 temple prostitutes' claim (Strabo, about old Corinth before 146 BC) -- not needed and contested."
    literary_context:
      done: true
      notes: "Chapters 5-7 are one block: incest tolerated (5:1), lawsuits (6:1-8), the vice list and 'such were some of you' (6:9-11), prostitutes (6:12-20), then marriage 'because of the temptation to sexual immorality' (7:2). Paul's slogans 'All things are lawful' recur at 10:23."
    content_word_studies:
      done: true
      notes: "Counts are SBLGNT (macula-greek-sblgnt)."
      terms:
        - {word: "πορνεία", language: greek, transliteration: "porneia", strongs_id: "G4202", gloss: "sexual immorality", notes: "25 NT occurrences. Incest at 1 Corinthians 5:1; listed beside adultery (μοιχεία) in Matthew 15:19 and Mark 7:21, so the wider term. In LXX Hosea it names Israel's idolatry (Hosea 1:2; 2:4; 4:11-12)."}
        - {word: "πορνεύω", language: greek, transliteration: "porneuō", strongs_id: "G4203", gloss: "commit sexual immorality", notes: "8 NT occurrences; 1 Corinthians 6:18."}
        - {word: "πόρνη", language: greek, transliteration: "pornē", strongs_id: "G4204", gloss: "prostitute", notes: "12 NT occurrences; 1 Corinthians 6:15-16."}
        - {word: "πόρνος", language: greek, transliteration: "pornos", strongs_id: "G4205", gloss: "sexually immoral person", notes: "10 NT occurrences; 1 Corinthians 6:9; Hebrews 13:4."}
        - {word: "κολλάω", language: greek, transliteration: "kollaō", strongs_id: "G2853", gloss: "join, cling", notes: "12 NT occurrences. Matthew 19:5's quotation of Genesis 2:24 and 1 Corinthians 6:16-17 (both unions). The echo is the hinge of 6:15-17."}
        - {word: "ναός", language: greek, transliteration: "naos", strongs_id: "G3485", gloss: "temple, sanctuary", notes: "LSB footnote on 1 Corinthians 6:19: 'The inner part of the temple'."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Acts 15:20: the ESV Study Bible holds the πορνεία requirement apart from the three food rules -- not contextual. Its ground in 1 Corinthians 6 is creation (Genesis 2:24) and redemption (bought, raised, indwelt), none tied to Corinth."
