  - {type: commentary, title: "NIV Biblical Theology Study Bible", author: "Zondervan", note: "21:2 'represents God's redeemed people'; 21:9 'a place that also represents God's people'; chart Rev 21-22 / Ezek 40-48; 22:1-5 Eden restored."}
  - {type: commentary, title: "NIV Cultural Backgrounds Study Bible", author: "Keener", note: "21:2 Babylon as people of Rome, city includes the people; 21:9 Babylon parallels; 21:12 patrons' names on gates; dimensions article; 21:22 Revelation does not repudiate Ezekiel; 22:3 LXX Zech 14:11."}
  - {type: commentary, title: "NLT Life Application Study Bible", author: "Tyndale", note: "21:12-14 tribes = OT faithful, apostles = church; 21:15-17 measurements symbolic."}
