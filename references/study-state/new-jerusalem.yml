open_questions:
  - "Where the city is during the millennium: Pentecost (Things to Come) and others via Walvoord (BKC 21:2) suggest a 'satellite city' over the earth; Walvoord calls it 'an inference rather than a direct revelation'. Tertullian (Marc. 3.24) put the city in the thousand years. Mention as speculation, marked."
  - "Cube or pyramid: Walvoord leans pyramid; ESV SB, NIV BTSB, NIV CBSB say cube (Most Holy Place). Text says length, width, height equal (21:16)."
  - "Walvoord reads the bride simile as the city compared to a bride and nothing more; wife-of-the-lamb reads the city as the bride's home. Reconcile in prose; flag to author if the tension matters."

