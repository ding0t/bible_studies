  - {type: other, title: "Irenaeus, Against Heresies 5.35.2; 5.36.1-2", author: "ANF vol. 1", note: "Former Jerusalem an image of the new; 'nothing is capable of being allegorized, but all things are stedfast, and true, and substantial'; presbyters' gradation (heaven/paradise/city) -- not used."}
