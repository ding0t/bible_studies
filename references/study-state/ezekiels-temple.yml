sibling_studies:
  - {slug: "last-things/the-thousand-years", role: cited, use: build-on, note: "Its 'The temple Ezekiel saw' section is the site's settled position (backlog, 2026-11-15): Ezekiel 40-48 in the thousand years, lean to ceremonial cleansing. This study does the full working and the section can then point here."}
  - {slug: "last-things/new-jerusalem", role: cited, use: link, note: "Ezekiel's city vs John's city; no temple (Revelation 21:22)."}
