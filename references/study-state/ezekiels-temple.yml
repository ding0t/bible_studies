genre: [prophets, apocalyptic]

thesis: "Ezekiel's temple is God's promise that the glory which left Jerusalem will come back to stay: no building yet raised matches it, and its own details (death, marriage, a sea with fishermen, twelve tribes on the land, a prince with sons) place it in the kingdom Christ will reign over on this earth, where its offerings cleanse the place He dwells, before the city whose temple is God and the Lamb."
outline:
  - {section: "Key Takeaways", says: "Types & Prophecy kept apart; Lessons about Jesus (the voice of many waters, the glory in person); memory verses Ezekiel 43:7, 48:35, Revelation 21:3; Be Transformed from 43:10-11 and 2 Corinthians 6:16-7:1; prayer."}
  - {section: "Study outline", says: "Mind map."}
  - {section: "A vision for people with no temple", says: "573 BC, 25th year of exile, 14 years after the fall (Ezekiel 40:1); 'a sanctuary for a little while' (Ezekiel 11:16)."}
  - {section: "The glory leaves, the glory returns", says: "The book's frame: 8-11 against 43:1-9, east gate both ways; then 33-39 build to 37:26-28 and 39:29, and 40-48 shows that sanctuary. Graphic: the route of the glory."}
  - {section: "The tour, chapter by chapter", says: "40-42 measured house; 43 glory and altar; 44 shut gate, prince, Zadokites; 45-46 land, offerings, feasts; 47 river; 47:13-48:35 land and city, YHWH shammah. Graphic: the river ankle to swimming."}
  - {section: "Has it been fulfilled? The ledger", says: "Particulars against second temple, Christ and the church, the thousand years, the new Jerusalem. Ezra 6:18; Haggai 2:3; Yoma 21b; Ezekiel 39:28."}
  - {section: "How the New Testament reads it", says: "Uses classified: Revelation 21-22 reuses and changes; 2 Corinthians 6:16 applies 37:27; Revelation 11:1-2 measures; Revelation 1:15 voice; John 7:38 contested. Revelation 20-22 follows Ezekiel 37-48."}
  - {section: "Near, far and the join", says: "Luke 4:19 (link Two mountain peaks); the conditional offer of 43:10-11 to the exiles beside the unconditional 'I will' of 36-37; Tobit 14:5 expected two temples; the tribulation temple (2 Thessalonians 2:4; Revelation 11:1-2) is a different house."}
  - {section: "The offerings", says: "Six kaphar in Ezekiel, the first God's own (16:63); what Ezekiel omits (high priest, ark, mercy seat, veil, Day of Atonement); what Hebrews closes (10:18) and grants (9:13); Acts 21:26 purification; the cleansing lean with the memorial meaning; Luke 22:16 Passover fulfilled in the kingdom. Build on The Thousand Years, don't restate."}
  - {section: "The LORD is there", says: "The presence from tabernacle to city: Exodus 40:34; 2 Chronicles 7:1; Ezekiel 10-11; John 1:14; Matthew 23:38; 1 Corinthians 3:16; Ezekiel 43:7; 48:35; Revelation 21:3, 22; 22:4."}
  - {section: "What this shows about God", says: "Faithful to His word and His name (36:22); He atones (16:63); He comes back."}
  - {section: "Discussion questions", says: "Facets mirroring Key Takeaways."}
  - {section: "Annex: Ezekiel's ordinances beside Moses', and the older readers", says: "Table of differences (Menachot 45a's two); Justin Dialogue 80, Irenaeus 5.34-35, Barnabas 16, Shabbat 13b."}
  - {section: "References & Recommended Reading", says: ""}
word_budget: 6000
word_budget_reason: "Nine chapters, the site's one open question on the offerings, the ledger that answers the author's 'fulfilled or yet to be', and the prince section the author asked for on 2026-11-25. The older-reader material is in the annex."

stages:
  scoping:
    done: true
    notes: "Filed in last-things/. Backlog 2026-11-15 settled the millennial reading; the offerings question is open with a lean to cleansing."
  exegesis:
    historical_context:
      done: true
      notes: "Ezekiel 40:1: 25th year of the exile (Jehoiachin's, 597 BC), beginning of the year, 10th day, 14th year after the city fell: 573 BC (chronology-anchors anchor 13; ESV SB note). 'Rosh hashanah' occurs only here (feasts/trumpets.md); Arakhin 12a-b reads it as a jubilee (contested, chronology-anchors). The exiles had no temple; God 'a sanctuary for a little while' (Ezekiel 11:16). The second temple was ordered by Cyrus's dimensions (Ezra 6:3) and 'as it is written in the Book of Moses' (Ezra 6:18); old men wept (Ezra 3:12); 'as nothing in your eyes' (Haggai 2:3). No record of the glory filling it (contrast Exodus 40:34-35; 2 Chronicles 7:1-2)."
    literary_context:
      done: true
      notes: "Frame: glory at the north gate (8:3-4), to the threshold (9:3; 10:4), east gate (10:18-19), mountain east of the city (11:22-23). Return from the east (43:1-5), 'the place of my throne... I will dwell in the midst of the people of Israel forever' (43:7, 9); east gate shut because the LORD entered (44:1-2). Lead-in: 34:23-24 David prince; 36:22-28 gathered then cleansed; 37:24-28 sanctuary in their midst forevermore; 38-39 Gog; 39:28 'none of them remaining among the nations'; 39:29 'I will not hide my face anymore'. 20:40-41 offerings accepted on the holy mountain after the gathering. Ends 48:35 YHWH shammah. Revelation 19:17-18 draws Ezekiel 39:17-20; Revelation 20:8 names Gog and Magog after the thousand years; Revelation 21-22 reuses 40-48. Treat Gog placement by linking the-thousand-years, not re-arguing."
    content_word_studies:
      done: true
      notes: "Concordance (morphhb-wlc): H3722 kaphar 6x in Ezekiel: 16:63 (God atones for you), 43:20, 43:26 (the altar), 45:15, 45:17 (for them / on behalf of the house of Israel), 45:20 (the house). H5387 nasi 37x in Ezekiel; in 40-48 at 44:3; 45:7-9, 16-17, 22; 46:2-18; 48:21-22. H727 ark, H4501 lampstand, H6532 veil, H3727 mercy seat: 0 in Ezekiel. H3725 kippurim: 0. No 'ha-kohen ha-gadol' in Ezekiel. H7620 shavuot only at 45:21, where 'weeks of days' is the MT reading of the Passover week (ESV 'seven days'); no Feast of Weeks prescribed. LXX Ezekiel 43:2 reads 'voice of the camp, as the voice of many doubling', so Revelation 1:15's 'voice of many waters' matches the Hebrew of 43:2 and LXX Ezekiel 1:24."
      terms:
        - {word: "כָּפַר", language: hebrew, transliteration: "kaphar", strongs_id: "H3722", gloss: "make atonement, purge", notes: "Object is a place at 43:20, 26 and 45:20; people at 45:15, 17; God the subject at 16:63."}
        - {word: "חִטֵּא", language: hebrew, transliteration: "chitte", strongs_id: "H2398", gloss: "purify (de-sin), piel", notes: "43:20, 22, 23; 45:18. Menachot 45a puzzles over 'vechitteita' at 45:18."}
        - {word: "נָשִׂיא", language: hebrew, transliteration: "nasi", strongs_id: "H5387", gloss: "prince, leader", notes: "Offers a sin offering for himself (45:22), has sons (46:16-18): not Christ. Identity contested: David raised (34:24; 37:25; Jeremiah 30:9; Hosea 3:5) or a Davidic regent."}
        - {word: "מִקְדָּשׁ מְעַט", language: hebrew, transliteration: "miqdash me'at", strongs_id: "H4720", gloss: "a sanctuary for a little while / a little sanctuary", notes: "11:16; ambiguous between time and size."}
        - {word: "יְהוָה שָׁמָּה", language: hebrew, transliteration: "YHWH shammah", strongs_id: "H3068 H8033", gloss: "the LORD is there", notes: "48:35."}
        - {word: "מִשְׁכָּן", language: hebrew, transliteration: "mishkan", strongs_id: "H4908", gloss: "dwelling place, tabernacle", notes: "37:27; quoted at 2 Corinthians 6:16 (corroborated quotation-greek); behind Revelation 21:3."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Tied to its setting: the specific ordinances given to Israel in the land under the prince. Transcends it: God's presence demands holiness and separation of holy and common (42:20; 44:23), applied by Paul from Ezekiel 37:27 to the church (2 Corinthians 6:16-7:1)."
    theological_principle:
      done: true
      notes: "God keeps His word to Israel for His name's sake (36:22); the forgiveness is His own act (16:63); His presence is the goal of every temple and reaches its final form when God and the Lamb are the temple (Revelation 21:22). Statement of faith: silent on the temple; consistent with its literal thousand years (Revelation 20:1-6). No conflict."
    application_draft:
      done: false
      notes: "Think: 43:7 the point is the presence. Attitude: shame that grace produces (43:10-11; 16:63). Do: cleanse ourselves (2 Corinthians 7:1 from Ezekiel 37:27)."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Revelation 21:10; 21:12; 21:15; 22:1-2", relation: "imagery reused from Ezekiel 40:2-3; 48:31; 47:1-12 (step-lists ot-quotations 459, 460, 462), with changes: no temple 21:22, no sea 21:1, no death 21:4"}
      - {ref: "Revelation 11:1-2", relation: "measuring the temple, Ezekiel 40:3 (step-lists 418); a tribulation-period temple"}
      - {ref: "2 Corinthians 6:16", relation: "applies Ezekiel 37:27 to the church (quotation-greek, corroborated)"}
      - {ref: "Revelation 1:15", relation: "'voice like many waters', Ezekiel 43:2 Hebrew (lead, 17 votes) and Daniel 10:6 (quotation-greek)"}
      - {ref: "John 7:38-39", relation: "'as the Scripture has said'; Ezekiel 47:1 a lead (47 votes) among Isaiah 58:11, 44:3, Zechariah 14:8: source contested"}
      - {ref: "Revelation 3:12", relation: "name of the city of my God; Ezekiel 48:35 (quotation-greek, corroborated)"}
      - {ref: "Hebrews 9:3-7, 13; 10:1-4, 11-14, 18; 8:13", relation: "the objection, read in context"}
      - {ref: "Acts 21:23-26; Numbers 6:13-14", relation: "post-cross purification offerings, with a sin offering if a Nazirite vow (shaving, 21:24; Numbers 6:18)"}
      - {ref: "Isaiah 56:6-7 / Mark 11:17; Isaiah 60:7; 66:20-23; Jeremiah 33:17-18; Zechariah 14:16-21; Malachi 3:1-4", relation: "other prophets' offerings in the coming kingdom"}
      - {ref: "Matthew 23:38-24:3; Acts 1:11-12; Zechariah 14:4", relation: "pattern only: Jesus leaves the temple for Olivet, ascends from it, returns to it. No NT writer links it to Ezekiel 11:23 / 43:2."}
      - {ref: "Luke 22:15-18", relation: "Passover 'fulfilled in the kingdom of God'; Ezekiel 45:21 keeps Passover"}
    translations_compared: ["ESV", "MT", "LXX (Brenton)"]
    divergences_noted: "LXX Ezekiel 43:2 lacks 'many waters'. MT 45:21 'feast of weeks of days'."
