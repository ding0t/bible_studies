open_questions:
  - "SETTLED by author 2026-11-25 (investigate more): the prince. nasi 37x in Ezekiel (MACULA): Zedekiah 12:10, Gog 38:2, David 34:24; 37:25, and 20x in 44-48. In 44-48 never named David, never king; melek in 40-48 only 43:7, 9 (dead kings); the only throne is the LORD's (43:7). 45:22 ba'ado (for himself), 46:16-18 sons, 45:8-9 'my princes' warned, 46:2 threshold. Christ is called prince with other words: sar shalom Isaiah 9:6; mashiach nagid Daniel 9:25; sar sarim Daniel 8:25; archegos Acts 3:15; 5:31 (KJV Prince); archon Revelation 1:5 (KJV prince). Never nasi outside Ezekiel 34/37. Ezekiel 34 two shepherds (34:15 LORD, 34:23 David) -> John 10:11, 16; Luke 19:10 / Ezekiel 34:16 (lead tier, 123 votes); ESV SB note on 34:23-24 confirms. BKC (Dyer) holds resurrected David as prince; against: Luke 20:35-36 (sons), Jeremiah 30:9 aqim = appoint (Deuteronomy 18:15; Judges 2:16). Study marks identity contested, leans to a mortal ruler under Christ; Zechariah 6:12-13 Branch builds the temple, priest on his throne."
  - "SETTLED by author 2026-11-25: Ezekiel 40-48 = the millennial temple; the new Jerusalem = the new creation. 'Forever': olam 18x in Ezekiel incl. 26:20 'people of old', 36:2 'ancient heights', 46:14 'perpetual statute' of the daily offering; Leviticus 16:34; Hebrews 8:13. TWOT 1631a 'long duration'. Dwelling outlasts building: Ezekiel 37:27 -> Revelation 21:3 (leads tier, 32 votes); 43:7 throne -> Revelation 22:3. Irenaeus 5.35.2 holds the two stages."
  - "SETTLED by author 2026-11-25 (agree, follow through): the glory's route. Ezekiel 11:23 and Zechariah 14:4 share amad, al ha-har, miqqedem (WLC); bible_trace Zechariah 14:4 lists Ezekiel 11:23 as a lead (10 votes). Jesus: Luke 19:37, 41-44; Matthew 23:38-24:3; Acts 1:9-12; Hosea 5:15 'until' with Matthew 23:39. Rosh Hashanah 31a (Davidson, CC-BY-NC) has the ten journeys to the mountain of 11:23 (the 'i.e., the Mount of Olives' there is the translator's gloss, not the Gemara); Lamentations Rabbah Petichta 25 (Sefaria Midrash Rabbah 2022, CC-BY; compiled c. AD 500 per Sefaria index) has the Presence on the Mount of Olives 3.5 years waiting for repentance. Marked as a pattern in the study and dashed on the plate."
  - "SETTLED by author 2026-11-25: graphics agreed, drawn."
  - "Ezekiel 46:17 'year of liberty' (deror, H1865) = Isaiah 61:1's word read in Luke 4:18; used in the near/far section."
  - "Enrich back (offer at publish): lampstand.md 'Ezekiel's temple' promises the series will take up the lampstand's absence; this study does (43:2; Revelation 21:23). the-thousand-years 'The temple Ezekiel saw' can point here."
  - "Whether the memorial and cleansing readings combine. The text's function words are cleansing (kaphar of places; Acts 21:26 hagnismos); a meaning that looks back to the cross is compatible. Plan: keep the site's lean, show they need not compete."
  - "Fork candidates: Ezekiel's ordinances compared with Moses' in full (annex only); the Golden Gate legend (leave out)."
  - "Enrich back: the-thousand-years 'The temple Ezekiel saw' to link here; heavenly-pattern altar/house pages (backlog) can cite the ledger."
