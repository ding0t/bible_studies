stages:
  scoping:
    done: true
    notes: |
      2026-11-26: language/structure pass, then a deepening pass at the author's request ("or deeper
      insight"). No state file existed before; this one records the 2026-11-26 work only.
  exegesis:
    literary_context:
      done: true
      notes: |
        Matthew 12:43-45 read inside 12:22-45: the house divided (12:25), the strong man bound and
        his house plundered (12:29), the empty house (12:44), applied to "this evil generation"
        (12:45). Gives the house three states; resolves backlog decision "what the empty-house
        danger is to a believer the Spirit indwells" (danger falls on the unbeliever swept and not
        filled; for the believer, the self-emptying itself, against 1 Peter 5:8, Romans 12:2,
        2 Corinthians 11:3).
    content_word_studies:
      done: true
      notes: |
        daimonizomai 13x, all Gospels; Luke's one use (8:36) pairs it with esothe (sozo).
        rhyomai: 15 NT verses, none an exorcism; aorist Col 1:13, present ptc 1 Thess 1:10, future
        2 Tim 4:18, all three in 2 Cor 1:10. Resolves backlog decision "at conversion or at the
        cross": won at the cross (Col 2:14-15), received at conversion (Col 1:13), prayed (Matt
        6:13), completed (2 Tim 4:18).
        anthistemi: James 4:7, 1 Peter 5:9, Ephesians 6:13 (three apostles, one verb); Gal 2:11.
        topos idiom: Eph 4:27 = Rom 12:19 (dote topon), Acts 25:16, Heb 12:17.
        pleroo + kardia: Acts 5:3 and John 16:6.
        1 John 5:18: variant auton/heauton noted (CSB footnote); promise stands on either.
  hermeneutics:
    notes: |
      Objection texts given the case on both sides: Eph 4:27, Acts 5:3 (Ananias's status marked
      contested), Luke 13:16 (pre-Pentecost, John 7:39), Matt 16:23, 2 Cor 11:4. Consistent with
      statement-of-faith (indwelling Spirit; dispensational reading of pre-Pentecost Luke 13).

