thesis: >-
  Once a year the high priest carried blood to the mercy seat and sent Israel's sins away on a goat so
  the holy God could keep dwelling among His people; Jesus has done this once for all with His own
  blood in heaven; Israel's national day of mourning and cleansing still waits for His return.
