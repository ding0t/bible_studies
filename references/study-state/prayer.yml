    8,000 words. Hebrews was cited once, for 5:7, and the two texts that state the basis of prayer
    access were absent entirely.
    Sharpest form of it: the study used the phrase "the way is open", which is Hebrews 10:20's own
    image ("the new and living way that he opened for us through the curtain"), without the text.
    It had borrowed the metaphor and dropped the doctrine.
  fixed:
