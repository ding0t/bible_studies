      what: 'Acts 2:42 quoted as devoted "to the prayers"; ESV reads "to the breaking of bread and the prayers", so those three words are not contiguous.'
      fix: 'Quotation re-cut to "the breaking of bread and the prayers".'
    - severity: minor
      what: '"which is worth knowing before building a practice on it" -- a worth___ filler that npm run validate did not catch. See tooling finding below.'
      fix: "Cut, and the surrounding sentence rewritten to hedge the exhaustiveness claim at the same time."
    - severity: minor
      what: >
        Three unchecked quantifiers in the study's own voice: "most prayers in the Epistles are
        addressed to the Father"; intercession as "the step most often skipped"; "the one Paul
        spends most of his own recorded praying on".
      fix: >
        First replaced with a checkable statement about Paul's own recorded prayers; second cut as
        an unverifiable assertion about readers; third replaced with the four references it rests on
