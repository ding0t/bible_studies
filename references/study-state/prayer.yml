revision_2026-09-07f:
  what: >
    User asked to expand on how God answers prayer -- Jesus and Paul always having answers, the mode
    usually unrecorded, the answer often already present but unrecognised, Abraham's servant
    answered before he finished, and the prayers of the saints as incense in Revelation.
  section_added: '"## How God answers", placed between "What prayer permits God to do" and "A pattern to pray by" -- both are about God''s side of the exchange.'
  four_patterns_the_texts_show:
    - >
      ALREADY ON THE WAY BEFORE THE PRAYER ENDS. Isa 65:24 states it; Gen 24:15 shows it, and the
      user was right that it is an excellent example -- Genesis reports the timing TWICE, once by
      the narrator and once in the servant's own retelling at 24:45, where he adds "in my heart",
      so the prayer was silent and already being answered. Dan 9:23 is sharper still: "At the
      BEGINNING of your pleas for mercy a word went out" -- not at the end.
    - >
      HEARD IS NOT THE SAME AS DELIVERED. Dan 10:12-13 is the guard that stops the above becoming a
      promise of speed: heard "from the first day", messenger withstood twenty-one days. Daniel
      spent three weeks with no evidence, and something had happened immediately. Included
      deliberately -- without it the section would read as a guarantee of quick results.
    - >
      THE MODE IS RARELY SPECIFIED. Where Scripture does say, the routes differ wildly: an angel
      dispatched (Dan 9:21), a person arriving at the right moment (Gen 24:15), an audible voice
      (John 12:28), a refusal with a reason (2 Cor 12:9), a door closed and another opened
      (Acts 16:6-10). Gethsemane was answered no and Heb 5:7 still says he "was heard".
    - >
      THE ANSWER CAN BE MISSED WHILE IT IS HAPPENING, and there are two memorable cases. John
      12:28-29: God answers AUDIBLY and the crowd says it thundered -- an answer in words, taken for
      weather. Acts 12:14-16: the church praying through the night for Peter tells Rhoda she is out
      of her mind while Peter keeps knocking. They had prayed for exactly this (12:5). Both directly
      serve the user's point that the answer is often right there unrecognised.
  jesus_and_paul: >
    John 11:41-42 is the anchor -- "I knew that you ALWAYS hear me", said BEFORE Lazarus comes out,
    so it is not confidence produced by the result. Paul's case is the counterweight: 2 Cor 12:8-9,
    where the answer is a clear no with a reason, which is still an answer.
  incense_arc: >
    Ps 141:2 asks that prayer be "counted as incense"; Rev 5:8 shows it granted -- golden bowls of
    incense "WHICH ARE the prayers of the saints", so prayers are collected rather than spent on
    delivery. Then Rev 8:3-5: the same censer that carried them up is filled with fire from the
    altar and thrown to earth, and the trumpets follow.
    CHECKED BEFORE CLAIMING IT, given the review a few hours earlier. The ESV Study Bible titles the
    passage "The Saints' Prayers, and Fire Flung to Earth" and states outright that "fiery
    devastation descends from God's altar in response to his people's pleas"; both Cultural
    Backgrounds volumes link 8:3 to Ps 141:2 and to the martyrs' vindication at 6:9-11. So the arc
    is the commentators' reading too, not an inference of this study's own.
    The pastoral payoff, and the reason the section closes there: on this picture no prayer is lost,
    and some are being KEPT rather than declined -- answered on a timetable that runs past the end
    of the life that prayed them.
  caught_by_the_widened_check: >
    The Check 10 regex widened during the same session immediately flagged "it is worth setting out
    what the texts actually show" in this new section, written within the hour. Cut. (That
    particular instance would have matched the old regex too, so it is not evidence the widening
    works -- it is evidence the check earns its place at all.)
  frontmatter: 'bible_references +14; tags gained "revelation" and "daniel".'
  size: "~6,000 words to ~7,400."
