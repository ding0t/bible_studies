    than re-read; every word claim re-derived from macula-greek-sblgnt; synthetic claims extracted
    into a list away from the prose before checking; study_gaps; cross_study_claims on Matthew 6;
    internal links resolved on disk; diagram re-measured.
  critical_found: 0
  moderate_found: 2
  moderate_fixed: 2
  minor_found: 8
  minor_fixed: 8
  findings:
    - severity: moderate
      what: >
        THE ALIGNMENT TABLE'S HEADERS MISDESCRIBED TWO OF ITS EIGHT ROWS. Columns read "The
        alignment | Then the acting". Proverbs 28:9 put "turns away his ear from hearing the law"
        under ALIGNMENT -- that is misalignment -- and "even his prayer is an abomination" under
        THE ACTING, which is God rejecting rather than acting. Psalm 66:18-19 quoted the
        counterfactual in the left cell, so the actual alignment was never stated.
      why_it_matters: >
        Textbook Phase 4: every verse correctly quoted, the relation asserted between them false.
        Both rows read as confirming evidence while pointing the other way.
      fix: >
        Headers changed to "The condition | What follows", which fits all eight. The two negative
        rows split into a second table under a lead-in saying they state the same thing from the
        other side, and the Psalm 66 row re-cut so the condition and consequence line up.
    - severity: moderate
      what: >
        ACTS 4:24 IS ITSELF A SCRIPTURE QUOTATION AND THE STUDY NEVER SAID SO. study_gaps surfaced
