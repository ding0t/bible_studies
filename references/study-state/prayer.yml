revision_2026-09-07g:
  what: >
    User: "do we discuss prayer is an attitude first, then habit? ... it is how we view communion and
    relationship with God, as daily bread. not a chore a joy. then the habit is easy."
  the_drift_they_caught: >
    A real structural problem, and one this session introduced. The file is named
    prayer-as-communion.md and its pre-rewrite description was "prayer as communion with God and our
    identity as His children". The 2026-09-07 rewrite retitled it "The Continual Discipline", opened
    on προσκαρτερέω, and originally said "that is the vocabulary of a practice kept, NOT A MOOD
    CAUGHT" -- setting discipline against affection in a way the New Testament does not. The user had
    already softened that line by hand before raising it. The Attitude section, the only place
    disposition was treated, sat near the END, after the pattern.
    So the study had drifted from communion-first to discipline-first, and the slug was left
    pointing at the older, better centre.
  section_added: >
    "## Communion before discipline", placed FIRST among the body sections -- immediately after Key
    Takeaways, before "Who am I praying to?" -- because on the user's reading it is the foundation
    the rest stands on.
  the_theological_anchor: >
    Rom 8:15-16 and Gal 4:6-7. The "Abba! Father!" cry is PRODUCED by the Spirit of adoption -- "by
    whom we cry" -- not manufactured by effort. And Galatians draws the conclusion in exactly the
    user's terms: "no longer a SLAVE, but a SON". Slave and son is the difference between prayer as
    chore and prayer as relationship; a slave prays because he must and stops when he can.
  supporting: >
    The Psalms as appetite rather than obligation (42:1-2; 63:1; 27:4; 73:25 -- "there is nothing on
    earth that I desire besides you"); Matt 11:28-30, where Jesus offers REST rather than another
    load, so prayer that feels like one more thing being failed at is filed under the wrong yoke;
    Luke 10:41-42, where the correction to anxious Martha is not to serve harder but that "one thing
    is necessary"; and Ps 16:11 as the motive Scripture actually supplies.
    DAILY BREAD REFRAMED, per the user's own phrasing: not a ration grudgingly issued but a child
    asking a father for today's food -- the most ordinary thing in a household, and the reason
    Jesus put it in the model prayer at all.
  the_honest_counterweight: >
    The section does not end on "get the attitude right and the habit is easy", because the study's
    own προσκαρτερέω evidence and its solitude section both cut the other way. It closes: appetite
    makes a habit sustainable, and the habit is what carries you across the stretches where appetite
    fails. Jesus got up before dawn and walked out of town -- "that is not what a feeling does. It is
    what a love does when it is inconvenient, which is also the point at which love and discipline
    stop being distinguishable." Both directions are true and Scripture holds both.
  also: 'Key Takeaways "Think" bullet extended to carry the given-not-manufactured point with Rom 8:15.'
  title_changed: >
    Raised with the user and approved: "Prayer: The Continual Discipline" -> "Prayer: Communion and
    the Habit It Sustains", which states the study's actual order rather than only its second half.
    Description rewritten to match, leading on relationship rather than practice.
    NO RENAME NEEDED, and this is the neat part: the slug prayer-as-communion.md was left over from
    the original 2024 notes and had been at odds with the retitle. The new title agrees with it, so
    the URL stays stable and no mkdocs-redirects entry is required.
    commentary_index.py and section_index.py both re-run -- the old title was embedded in 10+
    generated cross-reference pages and the christian-life section card.
  frontmatter: 'bible_references +10; tags gained "galatians" and "psalms".'
  size: "~7,100 words to ~7,800."
  last_updated: "2026-09-07"

review_2026-09-07b:
  reviewer: "review-bible-study, second pass, after the file grew ~1,700 words in two new sections and was retitled."
  major_found: 1
  moderate_found: 1
  minor_found: 3
  all_fixed: true
  findings:
    - severity: major
      what: >
        Exodus 20:11 and Psalm 146:6 were cited in prose -- added when fixing the first review's
        Acts 4:24 finding -- and never added to bible_references, so commentary_index.py
        under-reported the study on both chapters and study_gaps still listed them as gaps.
      fix: "Added, with Psalm 2, which the prose also names."
      note: "Exactly the Phase 7 failure mode: invisible from the page, wrong on someone else's."
    - severity: moderate
      what: >
        DISCUSSION QUESTIONS WENT STALE AGAIN, one day after the staleness rule was codified, and in
        the sharper form the rule predicts. All five facets were still covered so nothing looked
        wrong, but three substantial sections had no question -- How God answers, Communion before
        discipline, and deliberate solitude -- and Q1 had begun ARGUING WITH THE STUDY: it asked
        what changes if prayer is "a thing you persist in rather than a thing you feel moved to",
        which is precisely the either/or the new opening section exists to correct.
      fix: >
        Q1 recast to hold both (given affection and stubborn habit, "which one have you been trying
        to manufacture?"); Q3 moved from Gethsemane to the solitude material; Q4 moved from Ps 37:4
        to the answered-before-he-finished pair (Gen 24:15 against Dan 10:12-13, "how should either
        change the way you read a silence?"). Six questions kept.
    - severity: minor
      what: "Pronoun inconsistency for God -- 8 lowercase against 3 capitalised, the capitals from the user's hand edits."
      fix: "Lowercased to match the file's prevailing ESV-style convention."
    - severity: minor
      what: "Four prose lines over 105 chars where the file wraps at ~100 (the rest were tables, mermaid, or Greek inflating awk's byte count)."
      fix: "Rewrapped."
    - severity: minor
      what: 'Typo in a hand edit: "He prayed the Fathers will be done" -- missing apostrophe.'
      fix: '"the Father''s will".'
  structural_pass_requested_by_user: >
    "read end to end for structure and make sure the communion aspect comes out appropriately."
    IT DID NOT, and the measurement is what showed it. Counting communion/relationship language by
    section found it concentrated in its own section (16 hits) and ABSENT from "How Jesus prayed"
    and "What to pray about" -- so communion was a section, not a thread, in a study now titled
    "Communion and the Habit It Sustains".
    Worse, THE HOOK CONTRADICTED THE SECTION 550 WORDS LATER. It opened "the New Testament's usual
    word for how the church prayed is NOT A WORD ABOUT FEELING", and the communion section then
    established that Scripture's own register for prayer is thirst, appetite and joy. The title
    promised communion first and the opening delivered stubbornness.
  structural_fixes:
    - >
      Hook rewritten to lead with the relationship -- "Prayer in the New Testament is a child
      speaking to a father... the Spirit PRODUCES that cry rather than the believer working it up"
      -- and to introduce προσκαρτερέω as what the relationship produces rather than as its
      correction. The user's own sentence ("the vocabulary of a healthy habit, not something done as
      a side thought or option") is preserved. The stale contents list, which predated two sections,
      now names them and states the order: "Communion first, then the habit it sustains".
    - >
      "How Jesus prayed" gained the missing half: the solitude sections described what it COST and
      never said what he went FOR. Added -- he was not withdrawing because he found people tiring,
      he went to be with his Father, and John 17 is the one long record of what that sounded like.
    - '"What to pray about" gained one sentence: Phil 4:6''s "in everything" is a permission granted on the strength of the relationship, not a subject list.'
    - >
      Attitude bullet 1 had become a thin restatement of a whole section written after it. Recast to
      cross-link the communion section and add a practical test instead ("whether you pray
      differently after a bad week -- a suppliant would; a child would not").
  measured_after: "Communion language now appears in every section but none is a token; the two that had zero now have two each."
  em_dashes_fixed_2026_09_07: >
    Reported twice and then actioned on the user's instruction. 88 -> 46, of which 12 are inside
    Scripture quotations and 3 are table cells, so PROSE went from ~73 to ~31 in 8,000 words --
    roughly one per 260 words, from one per 90.
    Done as 41 explicit hand-checked replacements rather than a regex sweep, because the dashes were
    not uniformly wrong: PAIRED dashes acting as parentheses are legitimate and were left alone. The
    tic was the SINGLE dash used as a general-purpose joint, and overwhelmingly one construction --
    "X — and Y", which reads better as a comma, a colon or a full stop. Three lines had to be
    rewrapped afterwards where joins pushed them over the file's ~100-char wrap, and one item in a
    semicolon-separated list was re-cut to parentheses to match its neighbours.
  agent_note: >
    The widened Check 10 caught the reviewer's own "worth ___" filler THREE times in this session,
    each within an hour of writing it. That is a habit of this model rather than a one-off, and it
    is the argument for the check existing at all.
  last_updated: "2026-09-07"
