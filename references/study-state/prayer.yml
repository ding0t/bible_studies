  measured_after: 'blood 3, curtain 2, high priest 1, mediator 1, ransom 1, intercession 8, adoption 2 -- from zero on the first five.'
  note_on_method: >
    This is the pass that justifies rule 6 being a drafting rule. Nothing here was findable by
