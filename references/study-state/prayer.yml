  tooling_finding: >
    CHECK 10 IN validate-content.js WAS EFFECTIVELY DEAD. Its generic arm was anchored to
    "it('s| is) worth <verb>ing", so it saw nothing whose subject was not the word "it", and
    "knowing" was absent from its fixed word list -- which is how "which is worth knowing" sat in a
    published file unflagged. Baseline across the whole corpus was ZERO hits.
    Widened the subject slot to it/this/that/which/there plus a bare "is/are/was/were worth
    <verb>ing". Corpus now reports 24 hits across a dozen files, inspected and all genuine
    instances of the template rather than false positives -- e.g. "which is worth holding",
    "this is worth correcting", "is worth pausing", "are worth following". Left as warnings for the
    author to decide per hit, which is what the check's own comment says it is for; the other 24 are
    NOT fixed here, since they belong to other studies.
