# Backlog 4.3 "Faith" (docs/content/about/backlog.md). Author's notes: faith is not a work of our own
# strength; mustard-seed faith is enough because what matters is who the faith is in; oligopistos 5x
# on Jesus' lips; aman / emunah / pistis / pisteuo; Gen 15:6, Hab 2:4 (quoted 3x), Heb 11; Rom 4 beside
# James 2; whether faith is a gift (Eph 2:8-9); faith as trust in a Person.
# Author, 2026-09-29: tie to humility and pride. Humility = faith as reliance on God's all-sufficient,
# complete work. Pride = trying to add to that sufficiency by works, "earn a better salvation", or work
# toward a salvation we don't deserve, not understanding grace freely given. Tie to "I stand at the
# door" (backlog 10.4, not yet written): Jesus waiting for us to say "I cannot do this on my own,
# please help me, I trust you", daily, always. Work on unique insights.

