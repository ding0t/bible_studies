genre: [prophets, ot-narrative, epistle, gospel, apocalyptic, topical]

thesis: >-
  Faith is leaning your whole weight on God and on what He has finished in Jesus; pride is the same
  trust pointed at yourself, and it shows two faces, refusing God's promise and then trying to earn
  it, so the humble answer, every day, is to open the door to Jesus and say, "I believe; help my
  unbelief."
outline:
  - section: "Opening"
    says: "Kadesh: one day Israel would not go up, the next day they went up without God (Num 14)."
  - section: "What the words mean"
    says: "aman = firm, leaned on; first 'believe' in the Bible is Gen 15:6 (in the LORD); first emunah is Moses' hands held steady by others (Exod 17:12); Isa 7:9 pun; God is the God of emunah (Deut 32:4) and Jesus is 'the Amen' (Rev 3:14). Faith says amen to God."
  - section: "The proud and the righteous (Hab 2:4)"
    says: "The verse the NT quotes three times for faith opens with the puffed-up soul. Context: Babylon, and a prophet told to wait. Text of 2:4a difficult (CSB 'Hb obscure'); LXX 'my faith(fulness)'."
  - section: "Kadesh: pride's two faces"
    says: "'uppal' occurs twice: Hab 2:4 and Num 14:44. Unbelief (14:11) then presumption (14:40-44, 'we have sinned... we will go up'). Hebrews reads it as unbelief and calls faith entering God's rest, resting from our works (Heb 3:19; 4:10)."
  - section: "Trusting in yourself"
    says: "Luke 18:9 and 2 Cor 1:9 use the same Greek, trust in ourselves. Paul's list (Phil 3:4-9). Wages vs gift (Rom 4:4-5; 11:6). Adding works: Gal 3:3, 5:4. John 6:28-29 works -> the work of believing. Luke 17:5-10 faith and unworthy servants side by side."
  - section: "Small faith in a great God"
    says: "Mustard seed: the object carries the weight. Peter: 'little faith' = looking at the wind; distazo 2x. Jesus' hand. Mark 9:24. Jesus founder and perfecter of faith (Heb 12:2); Eph 2:8 debate marked, pointer to Assurance."
  - section: "Faith that works (James 2)"
    says: "Both quote Gen 15:6. Paul: how God counts righteous (Gen 15); James: the faith that is alive shows (Gen 22). Created for good works (Eph 2:10)."
  - section: "The door at Laodicea"
    says: "The Amen speaks to a church that said 'I need nothing' (Rev 3:17; Hos 12:8; refused earthquake aid). Buy without money (Isa 55:1). hestēka perfect, krouō present. Opening the door = hearing and admitting need. Church first, then any one. Daily: mercies new every morning, great is your emunah (Lam 3:23)."
