review_2026-09-29:
  by: "review-bible-study (agent pass)"
  checked: >-
    All ESV quotations re-queried from study-notes.db (esv-study-bible): every one verbatim. Counts
    re-run against MACULA: H6075 2 (Hab 2:4, Num 14:44); H530 49 in macula-hebrew-wlc (stored as
    '0530' -- bible_concordance with strongs=H530 + work_id=macula-hebrew-wlc returns 0, a tool
    zero-padding quirk), first Exod 17:12; H539 first Gen 15:6; G4102 242, G4100 241; G3640 5;
    G1365 2. Rev 3:20 ἕστηκα V-RAI / κρούω V-PAI confirmed. Hab 2:4 footnotes (CSB 'Hb obscure',
    'Or faithfulness'; LSB 'Or faithfulness') and LXX ἐκ πίστεώς μου confirmed. ESV SB, NIV BTSB and
    NIV CBSB notes checked against what the study attributes to them.
  fixed:
    - "2 Cor 1:9 Greek given as πεποιθότες ἐφ᾽ ἑαυτοῖς; SBLGNT has πεποιθότες ὦμεν ἐφ᾽ ἑαυτοῖς -- restored ὦμεν."
    - "Key Takeaways said the Hebrew word for believing 'is the word amen'; changed to 'comes from the same root as amen' (hiphil of אָמַן H539 vs adverb אָמֵן H543)."
  open:
    - "Heb 12:2 'our faith' -- Greek has τῆς πίστεως, 'our' is ESV-supplied; the study's 'Jesus begins and completes your faith' leans on it."
    - "Eph 2:8 marked 'debated' here while assurance-of-salvation.md treats touto as settled (whole transaction incl. faith) -- author to reconcile."
    - "Psalm 95 (quoted by Heb 3-4) never named; review_gaps quotation hit."
    - "Tacitus, Annals 14.27 not in the repo; cited via study Bibles only (ESV SB does not name Tacitus)."

revision_2026-10-06:
  by: "develop-bible-study (agent), at the author's direction"
  brief: >-
    Author: "Faith study needs to shine on examples of faith. That we may imitate those who are good
    examples. Where faith is not a work of your own strength. The greatness is who we trust in." Also:
    remove duplication with sin/pride.md and stop defining faith by what it is not.
  moved_to_pride: "Kadesh two faces + ʿaphal link (was 'Kadesh: pride's two faces'); Galatians 3:3/5:4 and Phil 3 (was 'Adding to grace'); Laodicea's self-sufficiency, Tacitus, Hos 12:8 (was 'A church that needed nothing')."
  cut: "'Pride is faith aimed at yourself'; Pharisee half of Luke 18 (pride keeps it); Luke 17:5-10 paragraph (budget); mustard-seed foil sentence; 'what Kadesh never said'."
  added: "Jehoshaphat opening; 'Imitate their faith' section (Heb 6:12, 13:7, 11:34; Abraham/Sarah, David/Jehoshaphat, Daniel 3 and 6, centurion); 2 Chr 20:20 pun closed the old fork candidate."
  commentaries: >-
    ESV SB 2 Chr 20:1-30 (God alone acts; Judah prays, trusts, worships) and 20:20-23 (based on Isa
    7:9); ESV SB Dan 3:18 (power certain, plan uncertain); ESV SB + NIV BTSB Heb 11:34 (fire = Dan 3);
    ESV SB Heb 11:34 (weakness, cf. 4:15); NIV BTSB Rom 4:20 -- CONTRIBUTED Abraham's laughter (Gen
    17:17), so the study now marks his faith as uneven; ESV SB Matt 8:10 (Messiah, marked 'suggests').
  added_2: "At the author's question, 'Two outsiders Jesus praised' (Matt 8:5-13 / Luke 7:1-10; Matt 15:21-28 / Mark 7:24-30) and 'What Jesus praised' (five attributes). kynarion: author asked to note the different word and that the woman took it as the household dog. Now argued from kynarion vs kyon (G2965, 5x, all outside/unclean dogs), her reply (masters' table; Mark 'under the table'), and Jesus' acceptance (Mark 7:29); NIV BTSB/CBSB insult reading kept as the minority view."
