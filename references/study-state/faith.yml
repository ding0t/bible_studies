# Backlog 4.3 "Faith" (docs/content/about/backlog.md). Author's notes: faith is not a work of our own
# strength; mustard-seed faith is enough because what matters is who the faith is in; oligopistos 5x
# on Jesus' lips; aman / emunah / pistis / pisteuo; Gen 15:6, Hab 2:4 (quoted 3x), Heb 11; Rom 4 beside
# James 2; whether faith is a gift (Eph 2:8-9); faith as trust in a Person.
# Author, 2026-09-29: tie to humility and pride. Humility = faith as reliance on God's all-sufficient,
# complete work. Pride = trying to add to that sufficiency by works, "earn a better salvation", or work
# toward a salvation we don't deserve, not understanding grace freely given. Tie to "I stand at the
# door" (backlog 10.4, not yet written): Jesus waiting for us to say "I cannot do this on my own,
# please help me, I trust you", daily, always. Work on unique insights.

slug: "faith"
title: "Faith"
status: published
target_path: "docs/content/salvation/faith.md"

primary_passage: "Habakkuk 2:4"
supporting_passages: ["Numbers 14:11", "Numbers 14:39-45", "Deuteronomy 1:32", "Deuteronomy 1:41-43",
  "Hebrews 3:19", "Hebrews 4:1-10", "Genesis 15:6", "Exodus 17:12", "Isaiah 7:9", "Deuteronomy 32:4",
  "Luke 18:9-14", "2 Corinthians 1:9", "Philippians 3:3-9", "Romans 4:4-5", "Romans 4:16", "Romans 11:6",
  "Galatians 3:2-3", "Galatians 5:4", "John 6:28-29", "Luke 17:5-10", "Matthew 17:20", "Matthew 14:28-31",
  "Mark 9:22-24", "James 2:21-24", "Ephesians 2:8-10", "Revelation 3:14-22", "Hosea 12:8", "Isaiah 55:1",
  "Lamentations 3:22-23", "Hebrews 12:2", "Romans 1:17", "Galatians 3:11", "Hebrews 10:38-39"]
genre: [prophets, ot-narrative, epistle, gospel, apocalyptic, topical]

thesis: >-
  Faith is leaning your whole weight on God and on what He has finished in Jesus; Scripture surrounds
  you with people who did it, weak in themselves and made strong by the One they trusted, so imitate
  their faith, and every morning say to Jesus, "I believe; help my unbelief."
outline:
  - section: "Opening"
    says: "Jehoshaphat: 'we are powerless... our eyes are on you' (2 Chr 20:12); the battle is God's; 'Believe... and you will be established' (20:20)."
  - section: "What the words mean"
    says: "aman = firm, leaned on; Gen 15:6; emunah first at Exod 17:12; Isa 7:9 pun, repeated at 2 Chr 20:20."
  - section: "The righteous shall live by faith (Hab 2:4)"
    says: "Context: Babylon, and a prophet told to wait. NT quotes it 3x; Hebrews quotes it then writes ch. 11. Contested readings marked."
  - section: "Imitate their faith"
    says: "Heb 6:12, 13:7 (mimetai/mimeisthe); 11:34 made strong out of weakness (passive). Abraham and Sarah (Rom 4:17-21 enedynamothe passive; Heb 11:11, 19); David and Jehoshaphat (1 Sam 17:45-47; 2 Chr 20:15); Daniel 3:17-18 and 6:23 (Aramaic heymin); the centurion (Matt 8:8-10). What they share: weak where they trusted, looking at God."
  - section: "Small faith in a great God"
    says: "Mustard seed; Peter; Mark 9:24; Eph 2:8 and Heb 12:2."
  - section: "Resting on a finished work"
    says: "Heb 3-4 rest; Rom 4:4-5, 4:16, 11:6; 2 Cor 1:9 (God who raises the dead); tax collector; John 6:29."
  - section: "The door, every morning"
    says: "The Amen (Rev 3:14); buy without money (Isa 55:1); Rev 3:20; Lam 3:23."
word_budget: 4600
word_budget_reason: "Raised 2026-10-06 at the author's direction: the four pairs of examples, the centurion and Canaanite woman with the kynarion word study, and the little-faith / 1 Peter 5:7 paragraph were all requested additions; James 2 was cut to make room."

stages:
  scoping:
    done: true
    notes: "Topical study anchored on Hab 2:4 (the one verse that sets pride and faith side by side) with Num 14 as its only lexical partner. Section: salvation/ (exists, has assurance-of-salvation.md)."
  exegesis:
    historical_context:
      done: true
      notes: >-
        Habakkuk: late 7th c. BC, Babylon rising (1:6); the prophet told to write the vision and wait
        (2:2-3); 2:4's puffed-up soul is Babylon/its king primarily (ESV SB). Numbers 14: Kadesh, after
        the spies' report. Laodicea: banking, textiles, eye salve; rebuilt without imperial aid after
        the AD 60 earthquake (Tacitus, Annals 14.27; ESV SB, NIV BTSB).
    literary_context:
      done: true
      notes: >-
        Hab 2:4 is the heart of God's answer (2:2-20), followed by five woes on the proud. Num 14:39-45
        follows the sentence of 40 years (14:26-35). Heb 3:7-4:11 expounds Ps 95 on the Kadesh
        generation. Rev 3:20 closes the seventh letter, to a church, before the throne vision.
    content_word_studies:
      done: true
      notes: "Verified against MACULA/morphhb and study-notes.db 2026-09-29."
      terms:
        - {word: "אָמַן", language: hebrew, transliteration: "ʾaman", strongs_id: "H539", gloss: "be firm; hiphil believe", notes: "105 in MACULA WLC; first Gen 15:6 hiphil + be-YHWH; Isa 7:9 hiphil/niphal pun."}
        - {word: "אֱמוּנָה", language: hebrew, transliteration: "ʾemunah", strongs_id: "H530", gloss: "firmness, faithfulness", notes: "49 in MACULA WLC; first Exod 17:12 (Moses' hands, steady); Deut 32:4 of God; Hab 2:4; Lam 3:23."}
        - {word: "עָפַל", language: hebrew, transliteration: "ʿaphal", strongs_id: "H6075", gloss: "swell, be presumptuous", notes: "2 occurrences: Hab 2:4 (pual), Num 14:44 (hiphil). NIV BTSB note on Hab 2:4 makes the Num 14:44 link."}
        - {word: "πίστις / πιστεύω", language: greek, transliteration: "pistis / pisteuō", strongs_id: "G4102 / G4100", gloss: "faith / believe", notes: "242 / 241 in MACULA SBLGNT."}
        - {word: "πείθω (perfect)", language: greek, transliteration: "pepoitha", strongs_id: "G3982", gloss: "trust, be confident", notes: "Luke 18:9 πεποιθότας ἐφ᾽ ἑαυτοῖς; 2 Cor 1:9 πεποιθότες ... ἐφ᾽ ἑαυτοῖς; Phil 3:3-4."}
        - {word: "ὀλιγόπιστος", language: greek, transliteration: "oligopistos", strongs_id: "G3640", gloss: "of little faith", notes: "5x: Matt 6:30; 8:26; 14:31; 16:8; Luke 12:28."}
        - {word: "διστάζω", language: greek, transliteration: "distazō", strongs_id: "G1365", gloss: "doubt, waver", notes: "2x: Matt 14:31; 28:17."}
        - {word: "Ἀμήν", language: greek, transliteration: "Amēn", strongs_id: "G281", gloss: "amen, truly", notes: "Title of Jesus at Rev 3:14; cf. Isa 65:16 'God of amen' (ESV 'God of truth')."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Laodicea's wealth/aid refusal is local; 'I need nothing' is the transcultural posture. Kadesh is narrative: Hebrews supplies the evaluation, so the principle is taught explicitly, not invented from the story."
    theological_principle:
      done: true
      notes: "Justification is by grace through faith apart from works (Rom 3:28; 4:4-5; Eph 2:8-9); pride is self-trust (Luke 18:9); unbelief and self-effort share that root (Num 14 read by Heb 3-4). Consistent with statement-of-faith.md Salvation (grace alone, faith alone, Christ alone)."
    application_draft:
      done: true
      notes: "Daily prayer of Mark 9:24; open the door (Rev 3:20); rest from works (Heb 4:10)."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Num 14:44", relation: "only other occurrence of ʿaphal (Hab 2:4)"}
      - {ref: "2 Cor 1:9", relation: "same phrase as Luke 18:9, trust in ourselves"}
      - {ref: "Isa 55:1", relation: "buy without money behind Rev 3:18 (ESV SB, NIV BTSB)"}
      - {ref: "Hos 12:8", relation: "'I am rich' behind Rev 3:17 (NIV BTSB, NIV CBSB)"}
    translations_compared: ["ESV", "CSB", "LSB", "NLT", "LXX"]
    divergences_noted: "Hab 2:4: 'faith' vs 'faithfulness' (CSB/LSB footnotes 'Or faithfulness'); CSB footnote 'Hb obscure' on 2:4a; LXX 'by my faith', Heb 10:38 'my righteous one'."
  drafting:
    done: true
    file: "docs/content/salvation/faith.md"
  review:
    done: false
    validated: false

