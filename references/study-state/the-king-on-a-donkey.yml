genre: [topical, prophets, gospel]

thesis: "In Scripture the donkey is the beast of house and road, Abraham's wealth, the mount of judges' sons and of a woman hurrying to the prophet, an animal the law protected even for an enemy and redeemed with a lamb; so when Zechariah's King comes 'humble and riding on a donkey' with the war horse cut off, He comes as the King of peace on the animal of everyday life, and Jesus rode it into Jerusalem to give Himself as the Lamb who redeems you."
thesis_draft: "Scripture's donkey is the beast of the household and the road, Abraham's wealth and Job's, the mount of judges' sons and of a woman going to the prophet, and the law guarded it even for an enemy; so when Zechariah's King comes 'humble and riding on a donkey', with the war horse cut off, He comes as the King of peace on the animal of ordinary life, and Jesus rode into Jerusalem on a she-donkey's colt to show you that King."
outline_draft:
  - {section: "The words", says: "chamor, aton, ayir; onos, polos, hypozygion, onarion: what each names"}
  - {section: "The beast of house and road", says: "Wealth (Gen 12:16; Job 1:3; 42:12), burden (Gen 42:26), and Abraham saddling his donkey for Moriah (Gen 22:3), echoed by Balaam (Num 22:21)"}
  - {section: "The mount of peace and standing", says: "Deborah's leaders (Judg 5:10), judges' sons (Judg 10:4; 12:14), Abigail (1 Sam 25:20), the Shunammite (2 Kgs 4:24); horses and chariots are war's animals (Zech 9:10)"}
  - {section: "The law's care", says: "Help an enemy's donkey (Exod 23:4-5), its Sabbath rest (Deut 5:14), the firstborn redeemed by a lamb (Exod 13:13), and Jesus on untying a donkey on the Sabbath (Luke 13:15)"}
  - {section: "Donkeys that teach", says: "Balaam's she-donkey (Num 22; 2 Pet 2:16, link the Balaam study), 'the donkey its master's manger' (Isa 1:3), the bridle and the rod (Prov 26:3)"}
  - {section: "The King's mount", says: "Judah's colt (Gen 49:11), Zechariah's King (Zech 9:9-10), and the entry in all four Gospels (Matt 21; Mark 11; Luke 19; John 12): the she-donkey and her colt in Matthew; hypozygion only in Matt 21:5 and 2 Pet 2:16"}
  - {section: "What the text does not say", says: "No donkey at the manger (Luke 2) or on the flight to Egypt (Matt 2:13-15): tradition, marked"}
