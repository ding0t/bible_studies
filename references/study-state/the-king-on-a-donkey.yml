  research_2026-11-08:
    counts: "morphhb-wlc: chamor H2543 93 verses; aton H860 28; ayir H5895 8; pered H6505 12 (1 Kgs 1:33 is pirdah H6506). macula-greek-sblgnt: onos G3688 5 (Matt 21:2, 5, 7; Luke 13:15; John 12:15); polos G4454 11, all at the entry; hypozygion G5268 2 (Matt 21:5; 2 Pet 2:16); onarion G3678 1 (John 12:14); phatne G5336 4 (Luke 2:7, 12, 16; 13:15)."
    findings:
      - "Zech 9:9 ani H6041 (humble/poor/afflicted); LXX and Matt 21:5 praus G4239, also Matt 11:29. 'on a donkey, and on a colt the son of she-donkeys' (chamor ... ayir ben atonot): parallelism, one animal."
      - "ayir + aton together in three verses: Gen 32:16 (Eng 32:15), Gen 49:11 (iroh ... beni atono), Zech 9:9."
      - "Matt 21:5's Greek ('on a donkey and on a colt, son of a beast of burden') follows the Hebrew more closely than LXX Zech 9:9 ('on a beast of burden and a young colt')."
      - "Matt 21:2 onon dedemenen: feminine. Matt 21:7 epekathisen epano auton: nearest plural antecedent ta himatia (cloaks); ESVSB note on 21:6-7 reads 'them' as the cloaks; NIV BTSB 'probably sat only on the colt'. MSB fn: Scrivener TR 'and they set Jesus'."
      - "Judg 10:4 ayarim used for both the donkeys and the towns (pun)."
      - "Luke 14:5 BSB fn 'TR donkey' (critical text 'son'): not used."
      - "Gen 22:3 / Num 22:21: both 'in the morning' + vayyachavosh H2280 + 'his donkey' + two servants; held as an echo."
      - "Luke 2 names no animal; Matt 2:13-15 no donkey; LXX Isa 1:3 uses phatne; held as an echo the reader may hear."
      - "NIV CBSB Zech 9:9: mule (pered) the preferred royal mount, evidence for a royal donkey meagre: the study keeps the mule apart (1 Kgs 1:33). NIV BTSB Zech 9:9 links 2 Sam 16:2 (David's household on donkeys in his flight)."
  review: {done: false, validated: false}

open_questions:
  - "Matthew 21:7 'Jesus sat on them': one animal or two? The charge that Matthew misread Zechariah's parallelism, and the answers (the colt with its mother; 'them' = the cloaks). Give both readings from the text."
  - "Zechariah 9:9 parallelism: one animal described twice, or two? Compare Mark 11, Luke 19 and John 12, which name the colt only."
  - "Gen 22:3 / Num 22:21 echo: shared wording verified; mark as an echo, not a type."
  - "Sabbath and the donkey: Luke 13:15 and 14:5 (ox; some mss son). Check the variant at 14:5 before using it."
  - "Tradition check: no donkey in Luke 2 or Matt 2. Confirm the texts are silent before saying so."
