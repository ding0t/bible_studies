thesis: >-
  God alone is the Judge, and He measures you with the measure you use; so Jesus, with a carpenter's
  joke about a beam in the eye, tells you to let God take the log out of your own eye first, by
  confession and His mercy, and then you will see clearly enough to take the speck out of your
  brother's, gently, as one who has been forgiven.
outline:
  - {section: "Hook + In one sentence + comic", says: "Jesus told a joke you can draw; the joke is the lesson."}
  - {section: "Key Takeaways", says: "Lessons about Jesus, memory verses, Be Transformed, prayer."}
  - {section: "Study outline", says: "Mind map, descriptive only."}
  - {section: "Judge not, in its sermon", says: "Matthew 5:1 audience; after Matthew 6's eye, hypocrites and forgiveness; κρίνω here is condemning, and 7:6, 7:15-20 and John 7:24 keep discernment. Luke's setting: forgive, give, the blind guide, the teacher."}
  - {section: "The measure you use", says: "Divine passive: God judges. Luke's overflowing measure makes it a promise as well as a warning. What it means for a believer (Romans 8:1; 1 Corinthians 11:31-32; the judgment seat), marked."}
  - {section: "A carpenter's joke", says: "κάρφος (a dry twig, Genesis 8:11 LXX) and δοκός (a roof beam, 2 Kings 6:2-5 LXX); hyperbole by size, like the gnat and camel (Matthew 23:24). Later rabbis used the same image (b. Arakhin 16b)."}
  - {section: "Why you cannot see your own log", says: "βλέπω vs κατανοέω; the same verb in James 1:23-24's mirror; hidden faults (Psalm 19:12); 'hypocrite' turns from 'them' (Matthew 6) to 'you' (7:5, the only singular in Matthew)."}
  - {section: "You are the man", says: "Nathan and David: a perfect eye for a stolen lamb, blind to Bathsheba and Uriah. Judah and Tamar. Romans 2:1: 'the very same things'. Inference marked: the speck you see best is often cut from your own beam."}
  - {section: "First, then", says: "Order, not prohibition: πρῶτον ... τότε (5:24; 7:5). Psalm 51:10-13 is the sequence lived. διαβλέπω: clear sight is what Jesus' touch gives (Mark 8:25). Eye surgery needs gentle hands (Galatians 6:1); the goal is to gain your brother (Matthew 18:15)."}
  - {section: "When God hands you the gavel", says: "Added at the author's request 2026-11-15. What Scripture gives believers to judge now: sin inside the church (1 Corinthians 5:12; Matthew 18:15-17), disputes between brothers (1 Corinthians 6:1-5), teachers and spirits (1 John 4:1; 1 Thessalonians 5:21), fruit (Matthew 7:16; John 7:24). What it keeps for God: outsiders (1 Corinthians 5:13), the heart's purposes before the time (1 Corinthians 4:5), another master's servant (Romans 14:4). And later: the saints judge the world and angels (1 Corinthians 6:2-3; Daniel 7:22; Matthew 19:28; Revelation 20:4). Links: where-two-or-three-are-gathered, hurt-by-the-church, test-the-spirits, your-kingdom-come, judgment-seat-of-christ."}
  - {section: "Authority, a lowly heart, and wisdom from above", says: "What makes the difference. Authority is given, never taken: Deuteronomy 1:17 'the judgment is God's'; 2 Chronicles 19:6; even the Son judges by given authority and seeking the Father's will (John 5:22, 27, 30); Revelation 20:4 κρίμα ἐδόθη. Heart: Corinth 'puffed up' (φυσιόω) when it should have mourned (1 Corinthians 5:2); gentleness and self-watch (Galatians 6:1; 2 Timothy 2:24-25); stricter judgment for teachers (James 3:1). Wisdom: Solomon 'a little child' asks for a discerning heart (1 Kings 3:7-9, 28); the Messiah judges not by sight, with the Spirit of wisdom (Isaiah 11:2-4); 1 Corinthians 6:5 'wise enough'; James 3:13-17, wisdom from above is ἀδιάκριτος (impartial, from the κρίνω family) and ἀνυπόκριτος (without hypocrisy), the word that answers 'You hypocrite' (Matthew 7:5)."}
  - {section: "What this shows about God", says: "God is Judge and Surgeon; Jesus bore the judgment; so you measure with mercy."}
  - {section: "Discussion questions", says: "Facet-labelled set."}
  - {section: "References & Recommended Reading", says: ""}
word_budget: 5000
word_budget_reason: "Author asked (2026-11-15) for two added sections on when believers are told to judge and what makes that judging different (authority, heart, wisdom). Raised 4,000 -> 5,000 to hold them without cutting the exegesis of Matthew 7:1-5."

stages:
  scoping:
    done: true
    notes: "No existing study treats Matthew 7:1-5 or Luke 6:37-42 (cross_study_claims.py 2026-11-14). No backlog entry. Placement christian-life/ (practical theology: how a disciple judges)."
  exegesis:
    historical_context:
      done: true
      notes: >-
        Sermon on the Mount, addressed to disciples with the crowds listening (Matthew 5:1-2; 7:28).
        Luke's Sermon on the Plain (6:20-49) to a large group of disciples. Jesus is called "the
        carpenter" (Mark 6:3) and "the carpenter's son" (Matthew 13:55): τέκτων, a builder in wood or
        stone, so "carpenter's joke" is marked as a likely background, not a claim of the text.
        Mishnah Sotah 1:7 "With the measure that a person measures, he is measured with it" and
        b. Arakhin 16b (R. Tarfon: "Remove the splinter from between your eyes" / "Remove the beam
        from between your eyes", קֵיסָם / קוֹרָה) verified on Sefaria 2026-11-14 (William Davidson
        Edition, CC-BY-NC; Mishnah Hebrew Torat Emet, public domain). Both later than Jesus: they show
        the idiom in Jewish speech, not a source for Him.
    literary_context:
      done: true
      notes: >-
        BSB section "Judging Others" Matthew 7:1-6, parallels Luke 6:37-42 and Romans 14:1-12 (editorial).
        STEP harmony: Matthew 7:1-5 // Luke 6:39-42. Matthew: after 6:22-23 (the eye as lamp), the three
        'hypocrites' of 6:2, 5, 16, and the forgiveness clause 6:12, 14-15. Followed by 7:6 (dogs and
        pigs: discernment required) and 7:15-20 (fruit inspection). Luke: 6:37-38 (judge not, condemn
        not, forgive, give; good measure running over), 6:39 blind leading blind, 6:40 disciple like
        his teacher, then the speck. Luke adds "Brother," (ἀδελφέ) and "when you yourself do not see".
    content_word_studies:
      done: true
      notes: ""
      terms:
        - {word: "κάρφος", language: greek, transliteration: "karphos", strongs_id: "G2595", gloss: "a dry twig, chip, splinter", notes: "NT only Matthew 7:3, 4, 5; Luke 6:41, 42 (twice). LXX once: Genesis 8:11, the dove's olive leaf, 'φύλλον ἐλαίας κάρφος' (Brenton text)."}
        - {word: "δοκός", language: greek, transliteration: "dokos", strongs_id: "G1385", gloss: "a beam, a roof timber", notes: "NT only the same six places. LXX: Genesis 19:8 (roof), 1 Kings 6:15-16 (temple), 2 Kings 6:2, 5 (the sons of the prophets felling beams; the axe head falls), 2 Chronicles 34:11, Song 1:17 (beams of our house), Sirach 29:22, EpJer 19, 54."}
        - {word: "κατανοέω", language: greek, transliteration: "katanoeō", strongs_id: "G2657", gloss: "notice, consider closely", notes: "14x SBLGNT. Matthew 7:3; Luke 6:41; James 1:23-24 (the man who looks at his face in a mirror). Matthew 7:3 sets βλέπω (see) against κατανοέω (consider)."}
        - {word: "ὑποκριτής", language: greek, transliteration: "hypokritēs", strongs_id: "G5273", gloss: "actor, pretender", notes: "Matthew 13x (SBLGNT): 6:2, 5, 16; 7:5; 15:7; 22:18; 23:13, 15, 23, 25, 27, 29; 24:51. Only 7:5 is singular (vocative ὑποκριτά). Luke 6:42 also singular."}
        - {word: "διαβλέπω", language: greek, transliteration: "diablepō", strongs_id: "G1227", gloss: "see clearly, see through", notes: "NT 3x: Matthew 7:5; Luke 6:42; Mark 8:25 (the blind man at Bethsaida after the second touch)."}
        - {word: "κρίνω", language: greek, transliteration: "krinō", strongs_id: "G2919", gloss: "judge, condemn, decide", notes: "115x SBLGNT. Luke 6:37 pairs it with καταδικάζω (condemn), which fixes the sense here."}
        - {word: "μέτρον", language: greek, transliteration: "metron", strongs_id: "G3358", gloss: "measure", notes: "Matthew 7:2; Luke 6:38 (μέτρον καλὸν ... ὑπερεκχυννόμενον, ἀντιμετρηθήσεται)."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "The image (beam/eye surgery) is cultural; the principle (God judges, self-examination before correction, correction as love) is taught explicitly elsewhere: Romans 2:1-3; 14:10-13; Galatians 6:1-4; James 4:11-12; 1 Corinthians 11:31."
    theological_principle:
      done: true
      notes: "God alone is the Judge (James 4:12) and deals with you by the standard you apply (Matthew 7:2; James 2:13). The cure for blindness to your own sin is God's searching and mercy (Psalm 51; 139:23-24). The forgiven sinner is the one equipped to help (Psalm 51:13; Galatians 6:1)."
    application_draft:
      done: false
      notes: ""
  cross_reference:
    done: true
    cross_refs:
      - {ref: "2 Samuel 12:5-7", relation: "narrative illustration: David condemns the rich man; 'You are the man!'"}
      - {ref: "Psalm 51:13", relation: "'Then I will teach transgressors your ways' after cleansing (51:10-12): the order of Matthew 7:5"}
      - {ref: "Genesis 38:24-26", relation: "Judah condemns Tamar, then 'She is more righteous than I'"}
      - {ref: "Romans 2:1-3, 21", relation: "Paul's exposition: the judge practises the same things"}
      - {ref: "James 1:23-24", relation: "same verb κατανοέω; the word as a mirror"}
      - {ref: "Matthew 5:23-24", relation: "πρῶτον ... τότε, brother"}
      - {ref: "Matthew 23:24-26", relation: "gnat/camel; πρῶτον; 'blind Pharisee' singular"}
      - {ref: "Mark 8:25", relation: "διαβλέπω"}
      - {ref: "Galatians 6:1", relation: "restore gently; keep watch on yourself"}
      - {ref: "1 Corinthians 4:3-5", relation: "Paul does not even judge himself: self-examination is not the final verdict"}
    translations_compared: ["ESV", "BSB", "NA28", "SBLGNT"]
    divergences_noted: "ESV 'log', BSB 'beam', NIV 'plank', KJV 'mote/beam'. δοκός is a roof beam: BSB's 'beam' is closest. No textual variant of substance in 7:1-5 (NA28 and SBLGNT differ only in word order at 7:4-5)."
  drafting:
    done: true
    file: "docs/content/christian-life/first-take-the-log-out.md"
  review:
    done: false
    validated: false

open_questions:
