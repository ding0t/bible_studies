# Patristic verifications (raw files on $BIBLE_MEDIA_ROOT/reference/patristics -- not dispatchable
# by research_batch, so recorded here as locations to re-read, not replayable evidence):
patristic_checks:
  - "Irenaeus AH 5.29.1 English: anf01.txt ~line 53562 ('when in the end the Church shall be suddenly caught up from this' ... 'last contest of the righteous'). Latin: irenaeus-harvey-vol2-latin-greek.txt ~34455 'cum in fine repente hinc Ecclesia assumetur' (OCR 'hine')."
  - "Irenaeus AH 5.26.1 'put the Church to flight' (anf01 ~53252); 5.28.4 'tribulation is necessary for those who are saved' (~53512); 5.30.4 Antichrist 3.5 years then Lord comes, 'times of the kingdom' (~53716); 3.3.4 Polycarp 'instructed by apostles' (~39135)."
  - "Justin, Dialogue 80: 'right-minded Christians on all points' and 'many who belong to the pure and pious faith ... think otherwise' (anf01 ~21768-21790)."
  - "Tertullian, Against Marcion 3.24: 'a kingdom is promised to us upon the earth' (anf03 ~32157)."
  - "Eusebius HE 3.39.12-13, Papias's thousand years and 'very limited understanding' (eusebius-npnf2-01 ~18466)."
  - "Hermas Vision 4.2 (anf02 ~1480-1495): 'escaped from great tribulation', 'type of the great tribulation that is coming', 'possible for you to escape it'."
  - "Victorinus (CSEL 49): Rev 6:14 'caelum inuolui: ecclesia de medio fit' is Recensio Hieronymi p.77; Haussleiter's note: section from Tyconius, added by Jerome's and later recensions; Beatus/Tyconius fuller text p.76 ('omnem de loco suo recessisse ... bona pars mouebitur de loco suo fugiens'). Rev 15:1 'cum ecclesia de medio exierit' Recensio Hieronymi cap. XV p.137; p.136 'Etiam capituli XV explicatio apud Victorinum desideratur'. ANF07 ~33549 and ~34148 for the English."
  - "Pseudo-Ephraem: NOT on the media volume. Verified from C. P. Caspari 1890 fetched to session scratchpad from Internet Archive (identifier briefeabhandlun00caspgoog, _djvu.txt; cross-checked with 11889914bsb). §2 p.211 'Omnes enim sancti et electi Dei ante tribulationem, quae uentura est, colliguntur et ad Dominum adsumuntur, ne quando uideant confusionem, quae uniuersum propter peccata nostra obruet mundum'; preceding 'nosmet ipsos praeparamus in occursum domini Christi, ut nos eruat a confusione'; §9 'iustos et impios, iustos ut domino suo probentur'; §10 (p.220) 'Surgite, dormientes, surgite, occurrite Christo'. Caspari's summary (p. ~XIII of the contents): MSS saec. VIII (Barberini, St Gall); 'um 373' from Valentinian/Valens, judged doubtful; prefers 5th-6th c. or early 7th, not after 627-628; author neither Ephraem nor Isidore, used Ephraem, original Greek."

