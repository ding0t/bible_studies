slug: "rapture-in-the-early-church"
title: "The Rapture in the Early Church"
status: drafting
target_path: "docs/content/last-things/rapture-in-the-early-church.md"
primary_passage: "1 Thessalonians 4:13-18"
supporting_passages: ["1 Thessalonians 1:10", "1 Thessalonians 5:9", "Acts 17:5-11", "Titus 2:13", "Matthew 24:21", "Revelation 6:14", "Revelation 7:14", "Revelation 15:1"]
genre: [topical, epistle]
thesis: >
  The early church waited for Jesus to come and reign on earth, and a few of its writers spoke of the
  Church "caught up" or "gathered before the tribulation"; that witness is real, it is contested at
  every point, and it stands under the word of God it was reading, which is where your hope rests.
outline:
  - {section: "What Paul told the Thessalonians", says: "1 Thess 4:13-18 in its setting: a church driven apart from Paul, grieving its dead; harpazo passive, apantesis; the point is comfort (4:18); God binds believers' resurrection to Jesus'."}
  - {section: "A kingdom on earth", says: "Papias, Justin, Irenaeus, Tertullian were premillennial; Justin admits dissent, Eusebius opposes it; the same fathers put the Church in conflict with Antichrist."}
  - {section: "Irenaeus: the Church suddenly caught up", says: "AH 5.29.1 (Latin assumetur, repente) read both ways; 5.28.4 and 5.26.1 on the other side."}
  - {section: "The Shepherd of Hermas", says: "Vision 4.2 promises escape from the coming great tribulation; the vision pictures preservation in its presence."}
  - {section: "Pseudo-Ephraem", says: "Caspari's Latin of the ante tribulationem line and its exhortation to the living; date contested (c. 373 vs 5th-7th c.); §9 and §10 cut the other way."}
  - {section: "Victorinus and Jerome's revision", says: "The two 'church out of the midst' lines are in Jerome's recension only; Rev 6:14 gloss is Tyconian and describes flight."}
  - {section: "What the evidence adds up to", says: "Early roots real, developed doctrine 19th-century, antiquity does not settle truth; the fathers answer to Scripture (Acts 17:11); hope rests on 1 Thess 5:9 / Titus 2:13."}
word_budget: 4000
word_budget_reason: ""
stages:
  scoping: {done: true, notes: "Historical-theology study; primary passage widened from 4:17 to 4:13-18 (the unit of thought). Fathers treated as reception-history witnesses per source_profile('patristics')."}
  exegesis:
    historical_context: {done: true, notes: "1 Thess from Corinth AD 49-51 (ESV SB intro); Paul expelled from Thessalonica (Acts 17:5-10); occasion = believers' deaths (ESV SB note on 4:13-18)."}
    literary_context: {done: true, notes: "4:13-18 opens the second-coming unit 4:13-5:11 (ESV SB note on 4:1-5:28); point is v.18 comfort. Timing vs tribulation not addressed in this paragraph -- deferred to rapture.md / the-restrainer.md."}
    content_word_studies:
      done: true
      notes: "Routine terms only; the load-bearing lexical work lives in rapture.md."
      terms:
        - {word: "ἁρπαγησόμεθα / ἁρπάζω", language: greek, transliteration: "harpagēsometha / harpazō", strongs_id: "G726", gloss: "will be caught up (fut. pass.)", notes: "morph IFP1 per interlinear"}
        - {word: "ἀπάντησις", language: greek, transliteration: "apantēsis", strongs_id: "G529", gloss: "meeting", notes: "ESV SB: civic reception of a dignitary -- flagged as the posttrib argument, weighed in rapture.md"}
  hermeneutics:
    cultural_vs_transcultural: {done: true, notes: "Fathers = witnesses to reading, subordinate to Scripture (Acts 17:11)."}
    theological_principle: {done: true, notes: "God binds believers' resurrection to Jesus' (4:14); God keeps His promise by His word and a waiting people in every century."}
    application_draft: {done: true, notes: "Encourage the grieving with 4:13-18; test claims about the fathers; wait with expectancy."}
  cross_reference:
    done: true
    cross_refs:
      - {ref: "1 Thessalonians 1:10; 5:9", relation: "deliverance from wrath"}
      - {ref: "Titus 2:13", relation: "blessed hope"}
      - {ref: "Revelation 7:14", relation: "pretrib answer to Pseudo-Ephraem §9"}
      - {ref: "Matthew 24:21", relation: "quoted by Irenaeus AH 5.29.1"}
    translations_compared: ["ESV"]
    divergences_noted: ""
  drafting: {done: true, file: "docs/content/last-things/rapture-in-the-early-church.md", notes: "Moved text kept and tightened. Pseudo-Ephraem critic reading changed: the moved text said critics read the line as about saints 'already dead' -- no source for that reading was found, and Caspari's Latin context (the preceding exhortation to the living to prepare 'in occursum domini Christi') runs against it; replaced with the §9/§10 argument verified in Caspari."}
  review: {done: false, validated: true, notes: "npm run validate: only Check 17 provenance warnings (fields deliberately omitted). mkdocs build --strict passes (draft dropped). In-page anchors checked against markdown toc slugify."}

