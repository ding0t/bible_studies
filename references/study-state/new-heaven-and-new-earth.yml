open_questions:
  - "Whether John 7:37's 'last day, the great day' is the seventh day (Hoshana Rabbah) or the eighth (Shemini Atzeret) is contested; NIV CBSB says eighth, ESV SB does not say. Mark it."
  - "Rev 17:11 calls the beast 'an eighth'. Numerology caution: the number is not always the new beginning. Mention once."
  - "Renewal vs replacement: Walvoord (BKC) 'totally new'; Irenaeus AH 5.36.1 'neither the substance nor the essence of the creation annihilated'; ESV SB undecided. Sibling heaven-and-earth-will-pass-away already holds it open; stay consistent and link."
  - "Isa 65:20 death in the 'new heavens' passage: telescoping (BKC) vs other readings (ESV SB note lists three). Mark contested."

