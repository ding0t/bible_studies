# Paired study with new-jerusalem.yml. Author asked (2026-09-28) for Rev 21-22 set after the
# millennium, the great white throne and the Sabbath rest, read as the eighth day, tied to the
# age to come, with OT and NT roots; two studies if needed (one New Jerusalem, one new heaven
# and new earth). Fulfils backlog 5.5 (the age to come) and 5.7 (heaven and earth by fire).

slug: "new-heaven-and-new-earth"
title: "A New Heaven and a New Earth"
status: review
target_path: "docs/content/last-things/new-heaven-and-new-earth.md"

primary_passage: "Revelation 20:7-21:8"
supporting_passages:
  - "Isaiah 65:17-25; 66:22-23; 43:18-19; 25:8"
  - "2 Peter 3:7-13; Romans 8:19-23; Hebrews 12:26-28; Psalm 102:25-27"
  - "Leviticus 23:36, 39; Leviticus 9:1, 23; Genesis 17:12; 2 Peter 2:5; 1 Peter 3:20; John 7:37"
  - "Matthew 12:32; 19:28; Mark 10:30; Luke 20:34-36; Ephesians 1:21; 2:7; Hebrews 2:5; 6:5; 1 Corinthians 15:24-28"
genre: [apocalyptic, prophets, topical]

thesis: >-
  When the thousand-year Sabbath is over and the last judgment is done, God does what He
  promised through Isaiah: He makes a new heaven and a new earth and comes to live in it with
  His people, and the Law's eighth days point to it as the first day of a week that is never
  counted again.
outline:
  - section: "Opening"
    says: "Where the reader is standing: after the millennium, after Gog and Magog, after the great white throne."
  - section: "Key Takeaways / Study outline"
    says: "Types & Prophecy (Isa 65:17; the eighth day), Lessons about Jesus, memory verses, Be Transformed, Prayer."
  - section: "Setting the scene: the last page of the old creation"
    says: "Rev 20:7-15 in order: Satan released, fire, earth and sky flee, the dead judged, death thrown into the lake; only then 21:1. How 2 Pet 3's fire relates (the day of the Lord as a period). Links heaven-and-earth-will-pass-away for renewal/replacement."
  - section: "What Isaiah promised"
    says: "Isa 65:17 bara, chadash; Isa 66:22 'remain'; 65:20's death as the telescoping problem, marked contested (Walvoord 17-19 eternal / 20-25 millennium vs ESV SB three views)."
  - section: "What John saw (21:1-8)"
    says: "kainos (and LXX Isa 65:17 same word; Louw-Nida puts neos in the same domain, so the word cannot settle renewal vs replacement); no more sea; skene/skenoo (John 1:14); 'I am making all things new' = LXX Isa 43:19; 'It is done'; heritage and sonship (2 Sam 7:14); 21:8 outside."
  - section: "The eighth day"
    says: "Seven, then an eighth that begins again: circumcision, priests' eighth day and the glory (Lev 9:1, 23), the cleansed leper, Shemini Atzeret (itself a shabbaton, Lev 23:39), Noah 'the eighth' (2 Pet 2:5), resurrection on the first day (Barnabas 15; Justin Dial. 138), 2 Enoch 33 'not counting'. John 7:37 invitation on the last/great day -> Rev 21:6; 22:17. Marked as typology; Rev 17:11's beast as 'an eighth' noted as the counterfeit."
  - section: "The age to come"
    says: "aion mellon texts; Jewish olam ha-ba (m. Sanh 10:1 citing Isa 60:21); Eph 2:7 and Rev 22:5 plural 'ages'; palingenesia at Matt 19:28 under the Son of Man's throne; 1 Cor 15:24-28 the Son hands over the kingdom yet the throne is 'of God and of the Lamb'. Dispensational synthesis: the age to come opens at His return, the millennium its first stage, the new creation its unending one; marked as synthesis, amillennial alternative given."
  - section: "Discussion questions / References"
    says: "Facets per discussion-questions.md."
word_budget: 4600
word_budget_reason: "Author asked (2026-09-28) for the water-then-fire section with 1 Enoch and Josephus; ~450 words added to a study at ~3,850."

