  exegesis:
    historical_context:
      done: true
      notes: >-
        Revelation to seven churches of Asia under Roman pressure; the new-creation vision is
        consolation and warning (21:7-8). Jewish two-age frame current (m. Sanh 10:1; olam
        ha-ba). Isaiah 65-66 addressed to returning exiles, new heavens/new earth + new Jerusalem
        together (NIV CBSB 21:1).
    literary_context:
      done: true
      notes: >-
        21:1-8 is the transition summary; 21:9-22:5 expands the city (NIV BTSB). Sequence
        19:11 return -> 20:1-6 thousand years -> 20:7-10 release and fire -> 20:11-15 throne ->
        21:1 new creation. 20:11 'earth and sky fled away, and no place was found for them'
        is the hinge.
