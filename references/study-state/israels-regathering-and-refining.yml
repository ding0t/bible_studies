  scoping:
    done: true
    notes: >
      Genre: prophets (Ezekiel 36-37, Zechariah 10-13, Hosea, Jeremiah, Amos, Isaiah) read forward
      through Romans 11:26-27; topical in scope. Placement kept at israel-and-church/ (the
      Israel/church distinction is the locus; tribulation tagged).
  exegesis:
    historical_context:
      done: true
      notes: >
        Ezekiel: priest among Judean exiles in Babylon; dated oracles summer 593 BC to April 571 BC;
        book pivots on Jerusalem's fall in 586 BC (chs 1-25 before, 33-48 after); news arrives 33:21
        (ESV Study Bible intro). Zechariah: priest, returned with Zerubbabel c. 538 BC, ministry from
        520 BC (1:1 "second year of Darius"); chs 9-14 possibly later, 5th c. (ESV SB intro). Key
        consequence: Zechariah promises a gathering (10:8-10) AFTER the return from Babylon, so that
        return does not exhaust the promise.
    literary_context:
      done: true
      notes: >
        Ezekiel 36:22-32 is framed by "not for your sake" (vv. 22, 32) with the new heart and Spirit
        at its centre (ESV SB note on 36:22-32); order gathering (v. 24) then cleansing (v. 25)
        confirmed by ESV SB note on 36:24-25. Zechariah 12:10-13:9 sits in the "on that day" oracle
        (12:1-14:21): grace poured out and the pierced one mourned (12:10-14), a fountain for
        cleansing (13:1), the shepherd struck (13:7, quoted by Jesus at Matt 26:31), the remnant
        refined (13:8-9).
    content_word_studies:
      done: true
      notes: "Two routine glosses, no fuller method needed."
      terms:
        - {word: "צָרַף", language: hebrew, transliteration: tsaraph, strongs_id: H6884, gloss: "smelt, refine (TWOT 1972)"}
        - {word: "דָּקַר", language: hebrew, transliteration: daqar, strongs_id: H1856, gloss: "pierce, thrust through (TWOT 449); Num 25:8, 1 Sam 31:4, Zech 13:3"}
  hermeneutics:
    theological_principle:
      done: true
      notes: >
        God restores Israel by grace for His name's sake; keeps covenant with the nation He chose;
        refines a remnant through distress and turns it by His Spirit to Jesus, the pierced one;
        finishes what He starts (Rom 11:29). Consistent with statement-of-faith End times
        (pretribulational, literal seven-year tribulation, Daniel 9:27).
    application_draft:
      done: true
      notes: "Be Transformed: grace for His name; promises firm, dates loose; pray for a named Jewish friend."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Matthew 26:31", relation: "Jesus quotes Zech 13:7 of Himself"}
      - {ref: "John 19:37", relation: "quotes Zech 12:10 as fulfilled at the cross"}
      - {ref: "Revelation 1:7", relation: "places the looking on the pierced one at the return"}
    divergences_noted: >
      cross_study_claims.py for Zechariah 12, Zechariah 13, Ezekiel 36: consistent with
      israel-and-the-church.md, wife-of-the-lamb.md and lords-prayer.md.
  drafting:
    done: true
    file: docs/content/israel-and-church/israels-regathering-and-refining.md
  review:
    done: false
    validated: true

thesis: >
  For the sake of His holy name, God gathers Israel to her land and then cleanses her, refines a
  remnant through the time of distress for Jacob, and turns the nation to mourn for Jesus, the one
  they pierced, so that all Israel will be saved; and the God who keeps His word to Israel is the God
  you can trust with yours.
outline:
  - {section: "Where these promises were spoken", says: "Ezekiel after Jerusalem fell; Zechariah after the first return, still promising a gathering"}
  - {section: "The prophets, and the order they give", says: "gathered first, cleansed after, one nation in the land; Hosea and Acts 15 read the same sequence"}
  - {section: "The tribulation, and what it is for", says: "distress that brings Israel to her Messiah; the shepherd struck, the remnant refined, the pierced one mourned"}
  - {section: "About 1948", says: "what the prophets require, what no text supplies, how the views divide, and the site's judgement"}
  - {section: "All Israel will be saved", says: "Romans 11:26-27 as the prophets' conclusion, the contested referent, and Paul's blended quotation"}
word_budget: 4000
word_budget_reason: ""

