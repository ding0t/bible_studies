review_2026_08_22:
  reviewer: "review-bible-study skill, full 8-phase pass"
  trigger: "User read the draft and flagged two things: time periods felt grouped forward-and-back, and residual hedging/wordiness."
  phase_1_scripture: >
    All 9 block quotes and 15 inline quotations re-queried from study-notes.db (esv-study-bible)
    and diffed character-for-character after the rewrite. Zero mismatches. References and
    translation labels all correct.
  phase_2_citations: >
    TWOT roots re-checked via twot_strongs: parah 1809, ravah 2103, sharats 2467 -- all correct.
    All internal markdown links resolve. Han census verified at 57,671,400 (AD 2). Naked-eye star
    count corrected against source. ESV quotation volume well inside Crossway's 50% cap.
  phase_3_word_study: >
    sharats (H8317) re-derived from MACULA, not re-read: 14 occurrences, 12 animal, 2 human
    (Gen 9:7, Exod 1:7). Printed reference list matches the query exactly.
  phase_4_synthetic_claims: >
    THREE CRITICAL ARITHMETIC ERRORS FOUND AND FIXED, all three stale figures from earlier drafts
    that survived because the surrounding prose had been rewritten around them:
    (1) "a constant 0.48% gives 334,000 at the birth of Christ" -- 334,000 was computed at 0.465%;
        at the stated rate it is 480,000. Argument unaffected (Han census still 120x higher).
    (2) headroom table "30 million by David | 1.14%/yr" -- actual 1.19%.
    (3) antediluvian births "27 million to 2.1 billion" attributed to 1.0-1.2%/yr -- those rates
        give 78 million to 1.8 billion; the 27m end belonged to a 0.93% scenario.
    Also fixed: flat-middle doubling stated as "near three thousand years", actual 2,240;
    "roughly 5%" front-end rate is 5.6% and "ten times" the average is twelve.
    All other arithmetic recomputed clean -- 4 Flood-date reconstructions, 10 benchmark rates,
    Genesis 10 counts (16 grandsons; 14/30/26 = 70), the Genesis 11 patriarch table against repo
    source data, every PRB figure, and the deep-time reductio.
    LESSON: the rate was written as "0.48%" in prose and 0.481% in tables; every derived figure
    that used the rounded value drifted. The study now states 0.481% throughout.
  phase_5_commentary: >
    NIV Cultural Backgrounds Study Bible (not previously cited) checked on Gen 9-11. No
    contradiction of a central claim. It CONTRIBUTED a sharper assessment of Enmerkar and the Lord
    of Aratta than the study had -- now cited in the weaknesses section.
  phase_6_context: >
    Two gaps found and filled. (a) No historical occasion anywhere -- no author, audience, date or
    circumstance for Genesis or Exodus. New section "Who wrote this, and to whom" uses ESVSB's
    introductions, and turns up a real exegetical point: the Pentateuch's first audience was the
    wilderness generation, i.e. the 603,550 of Numbers 1 were themselves the demonstration of the
    Genesis 9:1 command being read to them. (b) Cultural-vs-transcultural line never drawn. New
    section "What carries over" separates Genesis 9:1 (universal, image-grounded, never rescinded)
    from Numbers 1 (Israel-specific covenant bookkeeping under a land promise).
  phase_7_placement: >
    god/ placement correct per placement-and-tags.md. Tags clean; "babel" is net-new vocabulary.
    Frontmatter fixed: removed 5 refs cited nowhere in the body (Gen 47:9, Deut 1:10-11,
    1 Kgs 4:20 -- research leftovers), added 8 substantively cited and missing, including
    Romans 1:20 which opens the conclusion.
  phase_8_style_and_structure: >
    STRUCTURE was the user's main complaint and it measured out: the reader's chronological pointer
    changed direction EIGHT times. Cause was two organizing principles braided together -- a
    canonical sweep (Gen 1:28 -> 9 -> 22 -> Exod 1) and a demographic sweep (creation -> now) --
    each internally forward-moving. Fixed by separating them into three explicit parts and moving
    Exodus 1:7 out of the context section (where it previewed the Egypt material) into the Egypt
    section (where its arithmetic already lived). Direction changes now 1, the deliberate part-two
    pivot. This also dissolved the "Four Hebrew verbs / all five" contradiction: the mandate section
    now carries the four mandate verbs, and atsom arrives with Exodus 1:7 as the fifth.
    STYLE: the negative-definition rhythm ("X is not A; it is B") ran to 7 instances plus ~15 bare
    negations -- pervasive, not local, and the main thing making the prose read machine-made. Now 0
    of the "not A; it is B" form. Em-dash density 0.41 -> 0.29 per sentence; interrupting dash-pairs
    7 -> 1. Eight signposts cut.
    MATH WORKING now shown at every load-bearing point (user request): a "Two formulas, once" section
    defines r = ln(N/N0)/t, T2 = ln2/r, and B = b(N1-N0)/r, and every headline figure shows its
    substitution.
