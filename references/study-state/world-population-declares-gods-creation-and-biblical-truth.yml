revision_2026_08_22b:
  trigger: "User asked for a critical review of the claim that Egyptian and Mesopotamian king lists run before the Flood."
  what_changed: >
    Expanded the one-paragraph archaeology bullet in "Where this argument is weak" into a six-part
    treatment: a table of the actual conflicts under MT/Ussher (Great Pyramid 210 years before the
    Flood, Dynasty 1 750 years before); the source-reliability problem (Manetho lost and known only
    via Josephus/Africanus/Eusebius/Syncellus who disagree; Turin Canon c. 1245 BC, 160+ fragments,
    ~50% missing, reassembled by papyrus-fibre matching before hieratic was fully understood,
    Redford doubting it pre-Ramesses II; Abydos list censoring five reigns and a whole period);
    the successive-vs-parallel question, noting Egyptology ALREADY applies it to dynasties 9/10-11,
    15-17 and 22-25; the Sumerian King List as the clearest case (serialises attested contemporaries,
    omits Lagash, 241,200 antediluvian years, handbooks advise against pre-Sargonic use) together
    with its own flood formula as an independent witness; the honest limit (parallelism helps the
    Intermediate Periods, not the Old Kingdom, and Bronk Ramsey 2010 radiocarbon puts Djoser at
    2691-2625 BC independently); and the LXX observation.
  main_finding: >
    The archaeological conflict is largely a MASORETIC problem, not a biblical one. Anchoring
    Abraham conventionally and working back from this repo's own generated genealogy data:
    MT Flood c. 2290-2400 BC (Dynasty 1 falls 750 years BEFORE it); SP c. 2940-3060 BC;
    LXX c. 3170-3290 BC (Dynasty 1, the pyramids and Early Dynastic Sumer all fall AFTER it,
    in the right order, with no compression of Egypt required).
    Supporting evidence that the divergence is editorial: LXX age-at-heir's-birth is exactly +100
    over MT for Adam, Seth, Enosh, Cainan, Mahalalel, Enoch and Arpachshad. The pattern breaks at
    Jared, Methuselah and Lamech -- precisely where a 100-year shift would push Methuselah's death
    past the Flood -- and at Noah, whose 500 the narrative fixes.
    HONEST LIMIT recorded in the study: the LXX clears the king lists but not Egyptian predynastic
    (Naqada c. 4000 BC) or Jericho PPNA, which rest on stratigraphy and radiocarbon.
  open_item_raised_not_resolved: >
    SUSPECTED BUG, flagged in the study and queued for investigation, NOT fixed here.
    references/build/genealogy_chronology.py pins zadok year 0 = 4004 BC for every timeline variant.
    That holds creation fixed and lets the Flood slide later under LXX (giving this study's table
    "Septuagint 1762 BC"), when the LXX's longer genealogies should push CREATION earlier -- toward
    the c. 5500 BC Byzantine Anno Mundi epoch -- and the Flood to c. 3200 BC. The convention appears
    to invert the LXX's actual effect. Required-rate figures in the study's table are unaffected
    (each computed from its own stated span). Next session: audit
    docs/content/last-things/genealogy-times.md and docs/content/feasts/zadok-calendar.md, plus
    references/build/genealogy_chronology.py and app/src/utils/calendarConvert.js, before changing
    any published number.
  verification: "npm run validate 0 findings; mkdocs build --strict passes; em-dash density 0.28/sentence; negative-definition rhythm still 0."
