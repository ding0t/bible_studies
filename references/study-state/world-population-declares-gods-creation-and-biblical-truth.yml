stages:
  scoping:
    done: true
    notes: >
      Companion piece to god/creation-reveals-the-creator.md ("What Creation Declares"),
      but arguing from a different body of evidence: demography rather than design.
      User's brief — tie the "descendants as numerous as" promises and the Bible's own
      population figures to exponential growth modelling, anchored on creation / Flood /
      Babel / Christ, dated in BC/AD and Zadok years, to show 6,000 years is demographically
      comfortable where deep time is not. User later added: show CUMULATIVE births ever,
      not only population alive at a moment, and use mermaid diagrams.
      Filed in god/ per placement-and-tags.md: "one [apologetics study] arguing from
      creation is god/".
  exegesis:
    historical_context:
      done: true
      notes: >
        Genesis 9:1-7 is the post-Flood re-issue of the creation mandate to the only
        eight humans alive; Genesis 9:19 states the whole earth's population descends
        from Shem/Ham/Japheth. Genesis 10 (Table of Nations) is dated c. 2200 BC by the
        ESV Study Bible's own map caption. Exodus 1:1-7 is the narrative bridge from
        Genesis 50 to the oppression, and its function is to report that the mandate had
        been fulfilled. Numbers 1's census has, per ESVSB's note on 1:1-46, an explicitly
        stated purpose of demonstrating the Genesis 22:17 promise fulfilled.
    literary_context:
      done: true
      notes: >
        Three-step chain across the Pentateuch, each step re-using the previous step's
        vocabulary: Gen 1:28 (mandate to Adam) -> Gen 9:1,7 (re-issued to Noah) ->
        Exod 1:7 (reported fulfilled in Israel). ESVSB on Exod 1:7 and NIV Biblical
        Theology SB on Exod 1:7 both independently note the Gen 1:28 parallel; NIVBTSB
        adds the Gen 9:1,7 link and the Abrahamic promises (13:16; 15:5; 17:2,6; 22:17).
        Genesis 11:1-9 (Babel) is the counter-movement: humanity refusing to fill the
        earth ("lest we be dispersed", 11:4) and being dispersed anyway (11:8-9).
    content_word_studies:
      done: true
      notes: >
        MAIN FINDING (re-derived from MACULA, not recalled): the verb sharats occurs 14x
        in the Hebrew Bible and only TWICE of human beings -- Gen 9:7 (the command) and
        Exod 1:7 (the fulfilment). Every other occurrence is of animals: Gen 1:20,21 (sea
        creatures), Gen 7:21, Gen 8:17, Exod 7:28 [Eng 8:3] and Ps 105:30 (frogs),
        Lev 11:29,41,42,43,46 (swarming things), Ezek 47:9 (fish). VERIFY BY RE-QUERY,
        never from this note.
        Exod 1:7 stacks five verbs, four of which come from the two mandate texts:
        parah + sharats + ravah + atsam + male' ha'arets.
      terms:
        - {word: "פָּרָה", language: hebrew, transliteration: "parah", strongs_id: "H6509", gloss: "bear fruit, be fruitful", notes: "TWOT root 1809. Gen 1:28; 9:1,7; Exod 1:7."}
        - {word: "רָבָה", language: hebrew, transliteration: "ravah", strongs_id: "H7235", gloss: "become many, multiply", notes: "TWOT root 2103 (a second root 2104 'shoot' shares the Strong's number)."}
        - {word: "שָׁרַץ", language: hebrew, transliteration: "sharats", strongs_id: "H8317", gloss: "swarm, teem", notes: "TWOT root 2467. 14 occurrences; only Gen 9:7 and Exod 1:7 are of humans."}
        - {word: "עָצֹם", language: hebrew, transliteration: "atsom/atsam", strongs_id: "H6105", gloss: "be mighty, be numerous", notes: "Exod 1:7 'grew exceedingly strong'; MACULA glosses 'they.became.mighty'."}
        - {word: "מָלֵא", language: hebrew, transliteration: "male'", strongs_id: "H4390", gloss: "be full, fill", notes: "Gen 1:28 imperative; Exod 1:7 niphal 'the land was filled with them'."}
        - {word: "חוֹל", language: hebrew, transliteration: "chol", strongs_id: "H2344", gloss: "sand", notes: "TWOT root 623a. Gen 22:17; 32:12; 1 Kgs 4:20; Jer 33:22."}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: >
        The similes (dust, stars, sand) are claims of innumerability, not head-counts --
        Gen 13:16 and 15:5 both state the point as an inability to count. Reading them as
        a target population number is the error to avoid. Jer 33:22 makes the
        uncountability explicit and applies it to David's line and the Levites.
    theological_principle:
      done: true
      notes: >
        God's first command to humanity was to multiply, and the world's population is the
        visible residue of it. The census that finally answers Gen 22:17 is not Numbers 1
        but Revelation 7:9 -- "a great multitude that no one could number."
    application_draft:
      done: true
      notes: "Gratitude for existence; children as the mandate not a burden; Gal 3:29 -- the promise's heirs are those in Christ."
  cross_reference:
    done: true
    cross_refs:
      - {ref: "Genesis 1:28", relation: "original mandate, vocabulary source"}
      - {ref: "Genesis 9:1,7", relation: "mandate re-issued post-Flood"}
      - {ref: "Exodus 1:7", relation: "mandate reported fulfilled, five-verb echo"}
      - {ref: "Numbers 1:46", relation: "census stated by ESVSB as fulfilment of Gen 22:17"}
      - {ref: "Galatians 3:16,29", relation: "the 'offspring' resolved in Christ and those in him"}
      - {ref: "Revelation 7:9", relation: "the innumerable multitude the similes pointed at"}
    translations_compared: ["ESV", "WEB", "NASB 2020", "NIV", "CSB"]
    divergences_noted: >
      Exod 12:40: MT reads 430 years in Egypt; LXX and Samaritan Pentateuch add "and in
      Canaan" (confirmed in CSB Ancient Faith SB and NLT textual notes), halving the Egypt
      sojourn to ~215 years and doubling the implied growth rate. Gal 3:17's 430-years-
      from-the-promise supports the LXX/SP reading. Both figures are given in the study.
      Gen 46:27 / Exod 1:5 read 70; Acts 7:14 (following LXX) reads 75 -- a 7% difference
      that moves the modelled rate by under 0.02 percentage points.
  drafting:
    done: true
    file: "docs/content/god/world-population-declares-gods-creation-and-biblical-truth.md"
  review:
    done: true
    validated: true # npm run validate clean (0 findings on this file); mkdocs build --strict passes
    notes: >
      Diagrams: 1 timeline, 1 flowchart, 2 xychart-beta. xychart-beta is NEW to this site
      (only flowchart and timeline were in use) -- mkdocs-material loads mermaid@11 from
      unpkg, which supports it, but it has not been eyeballed in a browser: no browser
      tooling was available in the drafting session. Check both charts render before
      draft: false.
      One parser bug found and fixed during drafting: the first timeline draft contained
      "Flood (Gen 7:11, ...)" -- mermaid's timeline grammar splits on ':', so the verse
      reference would have been parsed as a second event. No colons inside timeline event
      text. Flowchart node labels and xychart titles are quoted, so colons are safe there.
      Still to do before publishing: an independent review-bible-study pass, then flip
      draft: false and re-run commentary_index.py and section_index.py.

open_questions:
  - >
    PENDING LINK (2026-09-26 simplify): the "Archaeology and the king lists" pointer in "Where this
    argument is weak" names the fork *The Flood and the King Lists* in plain text. When
    god/flood-and-the-king-lists.md is published, turn it into a link.
  - >
    Two arithmetic claims in the user's supplied working summary were re-derived and found
    WRONG; the study uses the corrected figures. (1) "Halving founders costs ~16 years" --
    ln(8/6)/0.00465 = 62 years, not 16. (2) "A 0.2-0.47% constant curve gives ~60 million
    worldwide at AD 2" -- a constant 0.465% from 6 at 2348 BC gives 334,000 at AD 2, three
    orders of magnitude short. The constant-rate model does not fit history at all; only a
    staged model does, which is why the study argues from required-average-rate headroom
    rather than from a fitted single-rate curve.
  - >
    Flood date is not settled even within this repo. MT/Ussher 2348 BC (the site's
    zadok_year convention and generated mt.json); harmonized_v1 in genealogy-times.md
    gives 2468 BC; SP 2697 BC; LXX 1762 BC. Required average growth rate across all four:
    0.445%-0.555%/yr. The argument is insensitive to the choice, and the study says so
    rather than picking one silently.
  - >
    The repo's generated mt.json puts Arphaxad's birth at AM 1656, equal to the Flood year
    from Gen 7:11, because it chains Shem's birth from Noah's 500th year (Gen 5:32) rather
    than from Gen 11:10's "two years after the flood". The two data give a 2-year
    discrepancy (Noah was 502, not 500, when Shem was born). Study uses "about 100 years
    after the Flood" for Peleg's birth and notes the 2-year slack.
  - >
    Antediluvian population at the Flood is not stated in Scripture and the model is
    therefore a sensitivity band (10 million to 1 billion at 1.0-1.2%/yr), not a figure.
  - >
    Census-number dispute (600,000 men / ~2 million) is live; ESV Study Bible's Numbers
    introduction lists four proposed solutions and concludes there is no obvious one. The
    study gives both the face-value rate (2.39%/yr) and the low-reading rate (1.32%/yr)
    and notes both clear the required 0.48%.
  - >
    NOT ARGUED, deliberately: that population math disproves an old earth. Conventional
    demography answers the extrapolation objection with a Malthusian carrying-capacity
    ceiling, which is a real answer. The study states that answer and argues the narrower
    claim -- that the short chronology needs no demographic special pleading.
  - >
    Babel's absolute date left as a range (2247-2008 BC, Peleg's lifetime), with the ESV
    Study Bible's own "Table of Nations c. 2200 B.C." caption as the external anchor.

