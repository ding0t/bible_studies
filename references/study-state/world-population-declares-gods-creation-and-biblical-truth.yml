  - {type: lexicon, title: "Theological Wordbook of the Old Testament (TWOT)", author: "Harris, Archer & Waltke", note: "Root numbers and glosses: parah 1809, ravah 2103, sharats 2467, chol 623a."}
  - {type: other, title: "This repo's own genealogy chronology", note: "docs/data/genealogy/generated/{mt,lxx}.json and docs/content/last-things/genealogy-times.md -- Zadok-year dates for Adam through Terah in MT and LXX, and the four timeline variants (MT 2348 BC, harmonized_v1 2468 BC, SP 2697 BC, LXX 1762 BC) used for the Flood-date sensitivity table."}
