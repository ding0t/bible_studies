  added_verbatim:
    - "**In one sentence:** God blessed the human race with a command to fill the earth, re-issued it to the eight who survived the Flood, and kept His word to Abraham in a people too many to count, and the Bible's own chronology reaches today's 8.2 billion at a growth rate humanity has repeatedly exceeded."
