    - "This shows that God renewed His creation blessing after the judgment of the Flood, in the words He first spoke in Eden, to the only people left alive. Every person you meet lives downstream of that renewed blessing, and so do you."
    - "This shows that God wants His image-bearers in abundance. He commands it with the verb of teeming life, and He records Himself answered in the same word. You are part of that abundance."
    - "This shows that God keeps His covenant promises inside dated, countable history. He swore to Abraham, and four centuries later Moses could point at the crowd in front of him. So you can trust a promise of His whose fulfilment you have not yet seen."
