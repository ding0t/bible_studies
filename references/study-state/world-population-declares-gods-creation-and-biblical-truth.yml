  - {type: other, title: "Estimates of historical world population (Wikipedia)", note: "Benchmark world-population ranges at 10,000 BC, 8000 BC, 2000 BC, 1000 BC, AD 1, 1000, 1500, 1800, 1900, 1950, 2000. Used only to bound the benchmarks; PRB's own table is the primary."}
  - {type: commentary, title: "ESV Study Bible", author: "Crossway", note: "CONTRIBUTED: (a) note on Exod 1:7 identifying the Gen 1:28 vocabulary parallel independently of this study; (b) note on Num 1:1-46 stating the census's purpose as demonstrating Gen 22:17 fulfilled, and the ~2 million total; (c) 'The Large Numbers in the Pentateuch' in the Introduction to Numbers -- three objections, four proposed solutions, no settled answer, which this study reports rather than resolving; (d) the map caption dating the Table of Nations c. 2200 BC, used as the external anchor for Babel; (e) note on Gen 10:21-32 on Peleg/'divided' as probably alluding to Babel."}
  - {type: commentary, title: "NIV Biblical Theology Study Bible", author: "Zondervan", note: "CONFIRMED the Gen 1:28 -> Gen 9:1,7 -> Exod 1:7 chain and added the Abrahamic promise links (13:16; 15:5; 17:2,6; 22:17). CONTRIBUTED the dissenting note on Exod 12:37 -- 600,000 'seems excessively large', with no consensus -- which is the counterweight to ESVSB's face-value reading."}
  - {type: commentary, title: "CSB Ancient Faith Study Bible", author: "Holman", note: "Textual note at Exod 12:40: LXX and Samaritan add 'and in Canaan'."}
  - {type: commentary, title: "NLT Life Application Study Bible", author: "Tyndale", note: "Same Exod 12:40 textual note; and a note on Num 1:20-48 doing exactly the 70-to-2-million growth arithmetic this study formalizes."}
