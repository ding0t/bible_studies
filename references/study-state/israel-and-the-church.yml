primary_passage: "Romans 11:1-29; Ephesians 2:11-22"
supporting_passages:
  - "Romans 9:1-6"
  - "1 Corinthians 10:18, 32"
  - "Ephesians 3:4-6"
  - "Acts 15:13-18"
  - "Revelation 7:1-9"
  - "Ezekiel 36:22-28"
