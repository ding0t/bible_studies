  - "Galatians 6:16"
genre: [epistle, prophets, acts, apocalyptic, topical]

rebuild_note: >
  This is a FULL REBUILD of a live page, not a revision. The previous version (72 lines,
  draft: false) summarised Eddie Chumney's Hebrew Roots argument that "church" and "Israel" are
  synonymous, then added one paragraph of "Cautions" noting tension with the site's own
  dispensationalism and declining to resolve it. The author does not hold that position. At his
  direction Chumney is dropped entirely and the study is rebuilt from Scripture. The prior
  review (see review_2026-08-12 below) is retained as the record of why.

stages:
  scoping:
    done: true
    notes: >
      Position to argue: one Church of Messianic Jews and Gentiles, and a still-distinct Israel not
      replaced by it — recognised by Paul in Romans 9-11 and John in Revelation 7, restored to the
      land per the prophets, with a Jewish remnant saved through the tribulation. Counter-texts
      (Gal 6:16, Rom 2:28-29, Gal 3:29, 1 Pet 2:9) to be engaged, not routed around.
  exegesis:
    historical_context:
      done: true
      notes: >
        Romans has a concrete occasion and it is exactly this question. Claudius expelled Jews from
        Rome c. AD 49 (Suetonius' "Chrestus" riots; corroborated by Acts 18:2), so the Roman
        congregations developed for years as Gentile bodies before Jewish believers filtered back.
        The ESV Study Bible's introduction lists among the letter's driving questions: "What does
        the salvation of Gentiles indicate about the future of Israel as God's people (9:1-11:36)?"
        Romans 9-11 is therefore not an excursus — it is one of the five issues the letter exists
        to settle, addressed to a mainly Gentile readership (1:5-6, 13; 11:13; 15:15-16) at risk of
        concluding that they had displaced the Jews. That is the same conclusion the study is
        arguing against, which makes 11:18's "do not be arrogant toward the branches" the letter's
        own application of its own argument.
    literary_context:
      done: true
      notes: >
        Romans 9-11 is a single unit with a stated question at each hinge: 9:6 "it is not as though
        the word of God has failed"; 11:1 "has God rejected his people?"; 11:11 "did they stumble in
        order that they might fall?" Each is answered μὴ γένοιτο / "By no means". The olive tree
        (11:17-24) sits inside that argument as illustration, not as a definition of the church.
        Ephesians 2:11-22 is likewise one unit (ESV SB divides 11-15 / 16-18 / 19-22), moving from
        what Gentiles WERE (2:11-12) to what Christ MADE (2:14-18) to what they now ARE (2:19-22) —
        and the terminus at 2:19 is "fellow citizens with the saints", not "Israel".
    content_word_studies:
      done: true
      notes: >
        MAIN COUNT, re-derived not recalled: Ἰσραήλ (G2474) occurs 68 times in the SBLGNT —
        Acts 15, Matt 12, Luke 12, Rom 11, John 4, Rev 3, Heb 3, Mark 2, 2Cor 2, and one each in
        1Cor, Gal, Eph, Phil. Every occurrence carries an ethnic or national referent except the
        contested Galatians 6:16. Rom 9:6's inner "Israel" is a subset OF ethnic Israel (the
        argument runs on to Isaac/Ishmael and Jacob/Esau, all inside Abraham's physical line), not
        a category including Gentiles.
        CHECKABLE ABSENCE: Paul writes Ἰσραὴλ κατὰ σάρκα (1 Cor 10:18) and never once supplies the
        counterpart "Israel according to the Spirit" — verified by querying every verse containing
        both Ἰσραήλ and πνεῦμα (only Luke 1:80 and 2:25, neither the phrase).
      terms:
        - word: "Ἰσραήλ"
          language: greek
          transliteration: "Israēl"
          strongs_id: "G2474"
          gloss: "Israel"
          notes: "68 NT occurrences, distribution above. Gal 6:16 the sole contested case."
        - word: "κτίζω / καινός"
          language: greek
          transliteration: "ktizō / kainos"
          strongs_id: "G2936 / G2537"
          gloss: "to create / new in kind"
          notes: >
            Eph 2:15 ἵνα τοὺς δύο κτίσῃ… εἰς ἕνα καινὸν ἄνθρωπον. Creation language, and kainos
            (new in kind) rather than neos (new in time). If the church were Israel continuing
            under another name there would be nothing to create.
        - word: "συγκληρονόμος / σύσσωμος / συμμέτοχος"
          language: greek
          transliteration: "synklēronomos / syssōmos / symmetochos"
          strongs_id: "G4789 / G4954 / G4830"
          gloss: "joint-heirs / joint-body / joint-partakers"
          notes: >
            Eph 3:6, three σύν- compounds in one clause. Occurrence counts verified: G4789 four
            times (Rom 8:17; Eph 3:6; Heb 11:9; 1 Pet 3:7), G4954 ONLY here — a New Testament
            hapax — and G4830 only here and Eph 5:7. "Joint" language presupposes two parties that
            remain distinguishable; it is not the vocabulary of absorption.
        - word: "ἀμεταμέλητος"
          language: greek
          transliteration: "ametamelētos"
          strongs_id: "G278"
          gloss: "not to be repented of, irrevocable"
          notes: "Rom 11:29, of the gifts and calling of God toward Israel."
        - word: "οὕτως"
          language: greek
          transliteration: "houtōs"
          strongs_id: "G3779"
          gloss: "in this manner, so"
          notes: >
            Rom 11:26 καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται — a manner adverb, not a temporal one. "And
            in this way", not "and then". Do not let a later edit turn this into a sequence claim.
        - word: "εἰμί (present indicative)"
          language: greek
          transliteration: "eisin"
          strongs_id: "G1526"
          gloss: "they are"
          notes: >
            Rom 9:4 οἵτινές εἰσιν Ἰσραηλῖται, ὧν… — present tense, written c. AD 57 of unbelieving
            kinsmen: the adoption, glory, covenants, law, worship and promises still BELONG to them.
        - word: "קָהָל / ἐκκλησία"
          language: hebrew
          transliteration: "qahal / ekklēsia"
          strongs_id: "H6951 / G1577"
          gloss: "assembly"
          notes: >
            Checked because the previous version rested on it. qahal does NOT occur in Exodus
            19-20; the Sinai assembly is called "the day of the qahal" retrospectively in
            Deuteronomy (5:22; 9:10; 10:4; 18:16), and LXX Deut 9:10 and 18:16 do render it
            ἐκκλησία. Acts 7:38 calls Israel in the wilderness ἡ ἐκκλησία ἐν τῇ ἐρήμῳ. The
            vocabulary overlap is real and the study concedes it plainly rather than disputing it —
            the argument turns on what Paul builds, not on denying that ekklesia can render qahal.
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: >
        Culture-bound: the specific first-century tension the letter addresses (returning Jewish
        believers, Gentile congregations formed in their absence). Transcultural: the warning
        against Gentile arrogance (11:18-21), which Paul grounds in the permanence of God's calling
        rather than in first-century manners. The identification of any modern state with prophetic
        fulfilment is a further step again, and is marked as such.
    theological_principle:
      done: true
      notes: >
        God's election is irrevocable, so the calling of Israel survives Israel's unbelief; the
        Church is a new thing created in Christ from believing Jews and Gentiles, not Israel
        renamed nor Israel replaced. Both stand at once because both rest on the same
        unconditioned promise.
    application_draft:
      done: true
      notes: >
        Paul's own application is the one the study takes: "do not be arrogant toward the
        branches" (11:18). Anti-supersessionism as humility rather than as a party position.
  cross_reference:
    done: true
    translations_compared: ["ESV", "WEB", "ASV", "BSB", "YLT", "CSB", "NIV(BTSB)"]
    divergences_noted: >
      READER-ACTIONABLE FINDING at 1 Corinthians 10:18. Paul writes τὸν Ἰσραὴλ κατὰ σάρκα. ESV,
      CSB, BSB and the NIV all render it "the people of Israel" and drop κατὰ σάρκα entirely; WEB
      ("Israel according to the flesh"), ASV ("Israel after the flesh") and YLT preserve it. The
      phrase is load-bearing for BOTH sides of this debate — supersessionists read it as implying
      a spiritual Israel, and the distinction reads it as Paul marking ethnic Israel as such — so
      an English reader of the site's default translation cannot see the word the argument is
      conducted over. Verified by direct query, not assumed.
  drafting:
    done: true
    file: "docs/content/israel-and-church/israel-and-the-church.md"
  review:
    done: false
    validated: true
    notes: >
      Self-check only; an independent review-bible-study pass is still outstanding before
      draft: false. 36 block-quoted verses and 24 inline fragments matched against
      esv-study-bible by exact string comparison — 1 failure found and fixed (Romans 11:2 was
      truncated mid-verse inside a block quote; the block was extended to 11:1-5, which also
      supplies the remnant verse the surrounding prose asserts but had not quoted).
      npm run validate found a CRITICAL error I had introduced: Hebrew קָהָל wrapped in markdown
      bold, which breaks niqqud rendering. Fixed by unbolding and wrapping in a dir="rtl" span.
      That is the exact defect Check 9 exists for and it is invisible on re-reading the source.
      Precision fixes after verification: Romans 11:26's citation of Isaiah 59:20 now notes that
      Paul's form reads "from Zion" where the ESV's Isaiah reads "to Zion" (Rom 11:26 has ἥξει ἐκ
      Σιὼν; LXX Isa 59:20 has ἕνεκεν Σιὼν; MT/ESV "to Zion" — Paul matches neither exactly, and
      the second clause ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ matches the LXX verbatim). Genesis 17:5
      reworded to the ESV's "father of a multitude of nations".
      ESV block quotation is 982 of 4,678 body words (21.0%) across 16 blocks — inside the 50%
      ceiling. mkdocs build --strict passes.

open_questions:
  - >
    1948 is deliberately NOT claimed as dated fulfilment. What the texts require is a regathering
    to the land preceding national repentance — Ezekiel 36:24-26 puts gathering (v. 24) before
    cleansing and the new heart (vv. 25-26), which is what makes a return in unbelief coherent
    rather than embarrassing. Scripture names no year. The draft states 1948 as a candidate stage
    held with less confidence than the exegesis, and must not be edited into a fulfilment claim.
  - >
    Galatians 6:16 is genuinely contested and the ESV Study Bible is against this study's reading:
    it glosses "the Israel of God" as the believing children of Abraham and says those in the new
    creation "comprise the true Israel". The καί before τὸν Ἰσραὴλ is the crux and can be read
    ascensively ("even"). The draft concedes the verse cannot carry the argument either way and
    rests nothing on it.
  - >
    Revelation 7's 144,000: the ESV SB heads the section "The Sealing of God's International
    Israel" and its note on 7:4-8 leans symbolic (Dan omitted, Levi included, Joseph for Ephraim,
    12x12x1000). That is a real argument and is stated in the draft rather than suppressed; the
    reply rests on 7:9's "after this" introducing an explicitly different and uncountable group
    "from every nation", which a symbolic reading has to account for.

