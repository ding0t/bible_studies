# Budget record only. The study's full state file is prayer.yml (slug "prayer", which predates the
# page keeping its old filename). validate-content.js Check 23 looks up <filename>.yml, so the budget
# has to live here.
slug: prayer-as-communion
state_file: references/study-state/prayer.yml
target_path: docs/content/christian-life/prayer-as-communion.md
word_budget: 4700
word_budget_reason: >
  Set 2026-09-26 by the readability-sweep simplify pass, after forking two tangents
  (how-god-answers-prayer.md, supplication.md), merging duplicated material into lords-prayer.md
  and within the study, and tightening: 7,260 -> 4,404 counted words. The study answers the nine
  outcomes the author specified in prayer.yml `origin` (personal vs corporate, how and what to pray,
  the Lord's Prayer as pattern, Jesus's prayer life, the apostles, whom to pray to, what prayer
  permits God to do, attitude, teaching a family); each remaining ## section carries one of them.
  Raised 4450 -> 5050 on 2026-09-29 when the author asked for the persistence gap to be filled
  ('Keep asking, and keep talking': 1 Thessalonians 5:17, Luke 11:5-13, Luke 18:1-8), about 700
  words, partly offset by tightening elsewhere. Then simplify_2026-09-29 brought it to 4,681 and the
  budget was set to 4700: the persistence section is the reason it sits above 4450.
  Reaching 4,000 would mean deleting one of those outcomes (the likeliest candidates were Moses and
  Daniel, or the Paul-circumstances test), which is the author's call rather than a sweep's.

