  checked:
    - "Scripture: all 27 ESV quotations re-queried from study-notes.db (esv-study-bible); every one verbatim, references and labels correct."
    - "Word counts (macula): H4150 223x OT / 49x Lev (morphhb-wlc gives 204/45 -- tokenisation differs; page states no count); first occurrence Gen 1:14 confirmed. H4744 11x in Lev, all ch. 23 (vv. 2,3,4,7,8,21,24,27,35,36,37). G4637 5x SBLGNT (John 1:14; Rev 7:15; 12:12; 13:6; 21:3). G4639 7x SBLGNT. G4633 at Rev 21:3 confirmed."
