    - "No ESV footnotes on Lev 23 in study-notes.db."
    - "Consistency: statement-of-faith End times, trumpets.md (Trumpets typology inferred), firstfruits.md (date left open; AD 33 collapse), hebrew-roots.md, jesus/three-days-and-three-nights.md."
  fixed:
    - "Critical (Phase 4): 'These are stated, not inferred ... rose ... as the firstfruits' claimed the NT dates the resurrection to Firstfruits. It names Christ the firstfruits; the day is a reconstruction (firstfruits.md, chronology-anchors AD 33). Rewritten to mark it."
    - "Discussion Q3 said the NT ties Firstfruits to the day Jesus rose; narrowed to Passover and Pentecost."
    - "Be Transformed Think: 'The four spring feasts were fulfilled on their days' -> 'Passover and Pentecost'."
  for_author:
    - "Prayer still says died/rose/poured out 'each on the day you had set' -- defensible on the AD 33 reconstruction but the prayer is the author's call."
    - "Unleavened Bread listed under 'names the fulfilment of each spring feast' though 1 Cor 5:8 applies it ethically; three-days-and-three-nights.md shows it as not named of Christ. In-one-sentence says Jesus fulfilled 'the four spring feasts'."
    - "Lessons about Jesus line 'The spring feasts were fulfilled on their days' gives only Passover and Pentecost as examples."
    - "Rev 21:3 'He will dwell' is also skēnoō (G4637), the John 1:14 verb; page mentions only skēnē."
    - "Barley/wheat named in the table are not in Lev 23 (Exod 9:31; 34:22; Ruth 2:23); NIV BTSB chart supports barley."
    - "hebrew-roots.md links feasts.md with the stale title 'Jewish Feasts and Prophecy' (not edited; out of scope)."
    - "review_gaps: Numbers 28-29 (the offerings for each feast, quoted by Lev 23) never cited -- fair for an overview; a lead for the per-feast studies."
