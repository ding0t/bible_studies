open_questions:
  - "Which half of the week the witnesses occupy: contested. Victorinus (ANF 7) puts their 3.5 years first and Antichrist's 'as much again'. Hippolytus says 'the half' without, in the section read, saying which."
  - "Do the survivors of 11:13 repent or only fear? NIVBT gives both; CBSB leans repentance."
  - "CBSB attributes the Enoch-Elijah view also to Jerome; Jerome is not in the repo's patristics corpus -- cite through CBSB, not directly."

