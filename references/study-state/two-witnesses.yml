review_2026-09-29:
  by: "review-bible-study (subagent), applied by the drafting session on the author's instruction"
  fixed:
    - "Malachi: only Elijah is sent; Moses named for his law. Deuteronomy 18:15 and Acts 3:22 added as the source of a Moses-like expectation (applied to Jesus)."
    - "'When the beast has authority' removed from the closing section (it settled the first/second-half question the body leaves open)."
    - "Fifth reason credited to NIVBT on Luke 9:30 with its 'figures modeled upon them' hedge; study Bibles' readings of 11:6 attributed individually (ESVSB reads the powers for the church)."
    - "Hippolytus cited as 43-47 (forerunners in 46; 'the half of the week whereof Daniel spake' in 47)."
    - "Hedges restored: NIVBT 'possibly' on sackcloth; CBSB on 11:13 'can carry' repentance and the 7,000 inversion; celebrants (earth-dwellers) separated from the city that gives glory."
    - "4 Ezra 6:26 marked as naming no one; ESV 'And' restored at 11:7 and 11:13; Jeremiah 1:5 marked as Victorinus's wording."
    - "Other readings given their best evidence: Jeremiah (no recorded death; Jer 5:14 via CBSB; Jer 15:19), Enoch (Jude 14-15), the church (ESVSB king-and-priest; CBSB deviations). 'Spirit and power' made a fifth reading (Luke 1:17; NIVBT; CBSB)."
    - "Moses-and-Elijah case now says which reasons separate Moses (plagues, transfiguration); Hebrews 9:27 answered from 1 Corinthians 15:51, which also weakens the Enoch reading's 'owed a death'."
    - "1 Kings 18:1 'third year' noted against Luke 4:25/James 5:17; NIVBT on 11:8 (nature, not location) added; exodos gloss cut; 'legally complete' marked as a reading; person/jeremiah tag."
    - "Moses and Elijah section split with sub-headings (validator Check 21)."
  kept:
    - "Line 24's closing quotation mark after 'sackcloth.' is in the ESV (the speech opens at 11:1); not a stray."
