thesis: >
  During Daniel's seventieth week, while the nations trample Jerusalem, God sends two prophets whom
  Revelation draws from Zechariah's two anointed olive trees and clothes in the powers of Moses and
  Elijah; they testify for 1,260 days, are killed in the city where their Lord was crucified, and are
  raised and taken up in a cloud before their enemies' eyes, so God keeps a witness in the world's
  darkest hour, and the witnesses' story follows their Lord's.
outline:
  - section: "Hook + In one sentence + Key Takeaways + Study outline"
    says: "Revelation 11:3-4: two witnesses, 1,260 days, sackcloth, the olive trees and lampstands."
  - section: "Where the passage sits"
    says: "John recommissioned to 'prophesy again' (10:11); interlude between the sixth and seventh trumpets; the second woe (11:14) gives way to the kingdom (11:15)."
  - section: "The measured temple and the trampled city (11:1-2)"
    says: "Measuring = protection and ownership (Ezek 40:3; Zech 2:1-2); temple read by dispensationalists as a rebuilt tribulation temple (ESVSB, NIVBT), consistent with 2 Thess 2:4, Matt 24:15 and the-restrainer.md; symbolic reading given; trampling 42 months and Luke 21:24."
  - section: "One period counted three ways"
    says: "42 months / 1,260 days / time, times and half a time (Rev 11:2-3; 12:6, 14; 13:5; Dan 7:25; 12:7; 9:27); 360-day year (prophecy-events-times.md). Which half the witnesses occupy: case for each, contested; Victorinus puts them first."
  - section: "Two witnesses in sackcloth, Zechariah's olive trees (11:3-4)"
    says: "martys in Revelation (Jesus 1:5; 3:14; Antipas 2:13; 11:3; 17:6); the law's two witnesses (Deut 19:15); sackcloth; Zechariah 4 allusion in brief, linking lampstand.md."
  - section: "Fire, drought and plagues (11:5-6)"
    says: "Jer 5:14 and 2 Kgs 1:10; Elijah's three-and-a-half-year drought (Luke 4:25; Jas 5:17); Moses' waters to blood (Exod 7:17-20)."
  - section: "Who the two are"
    says: "Four readings: the witnessing church; Enoch and Elijah (4 Ezra 6:26; Tertullian, Hippolytus); Elijah and Jeremiah (Victorinus: 'all our ancients'); Moses and Elijah (Victorinus reports 'many think'). The case for Moses and Elijah: powers, drought length, Malachi 4:4-5 and Matthew 17:11, the Transfiguration (Luke 9:30-32), Horeb, unusual departures; the Hebrews 9:27 objection and answer."
  - section: "Killed, left unburied, raised, taken up (11:7-13)"
    says: "The beast from the abyss (first mention; Dan 7:21); the great city 'spiritually' Sodom and Egypt where their Lord was crucified; Purim inverted (Esth 9:22); breath of life and stood on their feet (Ezek 37:5, 10); 'Come up here' and the cloud; earthquake, 7,000 (1 Kgs 19:18), the rest give glory to God (contested: fear or repentance). Their story follows their Lord's."
  - section: "What the two witnesses show about God"
    says: "Tier table; God keeps a witness; faithful unto death; vindication. Application for the church now through Antipas (2:13) and Jesus the faithful witness."
  - section: "Discussion questions; References"
    says: ""
