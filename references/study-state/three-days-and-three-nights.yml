slug: three-days-and-three-nights
title: "Three Days and Three Nights"
status: published
target_path: docs/content/jesus/three-days-and-three-nights.md

primary_passage: "Matthew 12:40"
supporting_passages: ["Luke 24:21", "Mark 15:42", "Mark 8:31", "Matthew 16:21", "John 19:31"]
genre: [gospel]

origin: >
  User challenge, after a FAQ entry was added dating the crucifixion to Friday 3 April AD 33: "keep
  in mind jesus was 3 days and 3 nights before resurrection. why assume friday if that does not
  allow 3/3". A fair objection, and the site had no answer to it anywhere -- the phrase appeared
  only in a passing row of numerology.md's number table, and prophecy-events-times.md reached a
  Friday without engaging it.

stages:
  scoping:
    done: true
    notes: >
      Filed in jesus/ rather than last-things/ on the precedent of the-day-no-one-knows.md: a short,
      focused study on one contested sentence of Jesus about time. Written as its own study rather
      than a subsection of prophecy-events-times.md, which now carries a pointer instead, mirroring
      how day-is-near.md points at the-day-no-one-knows.md.
  exegesis:
    content_word_studies:
      done: true
      notes: >
        Every count below queried from sblgnt / macula-greek-sblgnt, not recalled.
        "three days and three nights" (treis hemeras kai treis nuktas): ONE occurrence in the NT,
        Matt 12:40, and it is Jesus quoting Jonah 1:17 (Hebrew 2:1).
        "on the third day" (te trite hemera): EIGHT -- Matt 16:21, 17:23, 20:19; Luke 9:22, 24:7,
        24:46; Acts 10:40; 1 Cor 15:4 (the last as te hemera te trite, which a naive LIKE misses).
        "after three days" (meta treis hemeras): THREE, all Mark -- 8:31, 9:31, 10:34. Acts 25:1 is
        Festus and unrelated.
        prosabbaton: ONE occurrence in the NT, Mark 15:42, glossed "the day before Sabbath". This is
        the strongest single datum for a Friday -- Mark defines the crucifixion day as the day
        before the weekly Sabbath.
        paraskeue: six, all of that day (Matt 27:62; Mark 15:42; Luke 23:54; John 19:14, 31, 42).
      terms:
        - {word: "προσάββατον", language: greek, transliteration: "prosabbaton", strongs_id: "G4315", gloss: "the day before the Sabbath", notes: "hapax in the NT, Mark 15:42"}
        - {word: "παρασκευή", language: greek, transliteration: "paraskeuē", strongs_id: "G3904", gloss: "preparation", notes: "6x, all of the crucifixion day"}
        - {word: "μεγάλη", language: greek, transliteration: "megalē", strongs_id: "G3173", gloss: "great", notes: "John 19:31 'a high day' -- the ambiguity the Wednesday case rests on"}
  hermeneutics:
    theological_principle:
      done: true
      notes: >
        The load-bearing observation is not any single verse but the SYNOPTIC PAIRING: Mark 8:31
        ("after three days") and Matt 16:21 ("on the third day") report the same prediction on the
        same occasion. The Gospels therefore treat the two phrasings as equivalent, which is only
        possible on inclusive reckoning. That makes inclusive reckoning an observation about the
        text rather than a device imported to rescue a Friday.
        Luke 24:21 is the second pillar and the more interesting one evidentially: two disciples
        counting incidentally, on the day itself, call that Sunday "the third day since". Not a
        prediction being interpreted.
  cross_reference:
    done: true
    translations_compared: ["ESV"]
    divergences_noted: "None material; the argument runs on Greek counts rather than on English renderings."
  drafting:
    done: true
    file: docs/content/jesus/three-days-and-three-nights.md
  review:
    done: false
    validated: true

open_questions:
  - >
    The study reaches Friday but explicitly does not retire the objection. It says so: the Friday
    reading "buys Matthew 12:40 on credit", needing inclusive reckoning to absorb the missing night,
    and inclusive reckoning is invoked at exactly the point where it is convenient. Deliberate --
    the alternative was to assert a resolution the evidence does not quite deliver.
  - >
    John 19:31's megale ("a high day") is left genuinely open between "a festival Sabbath distinct
    from the weekly one" and "the weekly Sabbath made great by a feast falling on it". The first
    reading is the whole Wednesday/Thursday case and it is not foolish; what it must additionally
    absorb is prosabbaton and Luke 24:21.
  - >
    review-bible-study has NOT been run on this study. It was published anyway, and the reason is
    worth recording: the user asked for the site to be made consistent with it, which required the
    FAQ and prophecy-events-times.md to link to it, and mkdocs --strict fails when a published page
    links to a draft. Publishing was therefore implied by the request, not a decision to skip the
    gate quietly. An adversarial pass is still outstanding.
  - >
    CORRECTION MADE AFTER DRAFTING. The FAQ entry written alongside this study said the AD 33 date
    rested on "two lines that converge", the second being the Humphreys-Waddington lunar eclipse. It
    was built from prophecy-events-times.md without checking chronology-anchors.md, which is the
    page that actually settles the year -- and that page DECLINES the eclipse argument outright, on
    two grounds: Schaefer's visibility objection, and, more importantly, that Peter quotes Joel 2:31
    about what WILL happen before the day of the LORD, so reading it as a report of the previous
    Friday's sky asks the sermon for something it is not doing. The FAQ was rebuilt on
    chronology-anchors.md's actual basis (Luke 3:1 primary, with Sejanus, Daniel 9 and Paul), the
    eclipse claim removed, and prophecy-events-times.md cross-linked to the stronger rejection since
    it calls the eclipse "a third, independent line".
  - >
    ai_provider_models was seeded by hand, unusually. refresh_frontmatter_provenance.py derives it
    from Co-Authored-By trailers on commits touching the file, and a brand-new file has none, so it
    wrote an empty list which validate check 17 then flagged. The script unions rather than
    overwrites, so the seeded value survives and will be confirmed by the first commit.

resources_consulted:
  - {type: other, title: "SBL Greek New Testament", author: "ed. Michael W. Holmes", note: "every occurrence count"}
  - {type: other, title: "MACULA Greek Linguistic Datasets", author: "Clear Bible", note: "lemma/morphology for prosabbaton, paraskeue"}
  - {type: commentary, title: "ESV Study Bible", author: "Crossway", note: "note on Matt 12:40 states the inclusive-reckoning convention outright, and worked the Friday/Saturday/Sunday count -- the one commentary citation the study needs"}
revision_2026-09-06b:
  what: >
    User asked whether the study accounts for the Hebrew day beginning at sundown. It did not, and
    the omission had produced a real imprecision.
  the_imprecision: >
    The draft said a Friday crucifixion "gives two nights -- Friday and Saturday". On sunset
    reckoning each night belongs to the day it BEGINS, so those two are the Sabbath's night and the
    first day's night. Same count, wrong labels -- and sloppy in a study whose whole argument turns
    on Jewish reckoning. Reworded to "two periods of darkness" and the table now names them
    correctly.
  finding: >
    Sunset reckoning does NOT add a third night to the Friday view. Worked out against Gen 1:5 and
    Lev 23:32: Friday contributes only its last daylight hours (he was alive through its night), the
    Sabbath contributes a complete night and day, and the first day contributes its night. Three
    days touched, two nights -- the same total the modern count gives.
    What it DOES do is make the inclusive count read less like special pleading, since the burial
    touches three named days and fills the middle one, and it explains Mark 16:1-2 without strain:
    the women could not buy spices until the Sabbath was past, which is Saturday EVENING, then came
    at dawn on the same Hebrew day.
  concession_added: >
    Sunset reckoning strengthens the WEDNESDAY case, and the study now says so. On that reckoning a
    Wednesday crucifixion with the resurrection at the end of the Sabbath gives a literal three
    nights and three days -- Thursday, Friday and the Sabbath each complete -- and the Gospels never
    narrate the moment of resurrection, only the discovery of an empty tomb at dawn, so that
    placement is not excluded by the texts. This is the Wednesday position at its most coherent and
    the earlier draft did not represent it that strongly.
    What sunset reckoning does not do is rescue it from Luke 24:21: from a Wednesday that Sunday is
    the fifth day whatever hour days are held to begin.
  conclusion_rebalanced: >
    "Where that leaves it" now states the choice as a straight trade rather than a verdict with a
    footnote. Wednesday takes Matt 12:40 at face value and carries prosabbaton, the eight "third
    day" statements and a Sunday its own count makes the fifth. Friday takes those and carries one
    missing night. The study holds Friday because what it must explain away is fewer and weaker --
    stated that way, rather than as the other view being foolish.
  last_updated: "2026-09-06"

revision_2026-09-06c:
  what: "User asked what else the burial sequence yields. Three things, one of which strengthens the opposing case."
  found:
    - >
      THE DEADLINE. Death at about the ninth hour, and before sunset Joseph had to reach Pilate,
      wait while Pilate summoned the centurion to confirm the death (Mark 15:44), buy a shroud, take
      the body down, wrap it and entomb it. All four writers frame it that way, and John gives the
      reason for the tomb chosen: "because of the Jewish day of Preparation, since the tomb was
      close at hand" (19:42) -- a NEARBY tomb, for want of time. This establishes that the
      crucifixion fell immediately before a Sabbath, which is common ground rather than evidence for
      either day, and the study says so rather than claiming it for Friday.
    - >
      MATTHEW 27:63-64, the sharpest single datum in the question. The chief priests quote Jesus as
      saying "after three days I will rise" (meta treis hemeras) and then, in the next sentence, ask
      for a guard "until the third day" (heos tes trites hemeras). If "after three days" meant
      seventy-two hours, a guard expiring on the third day would lapse before the moment they were
      guarding against. One speaker, one occasion, one author, both phrasings, one span -- and from
      hostile witnesses with no stake in the convention. Tighter than the Mark 8:31 / Matt 16:21
      pairing, because it needs no comparison across Gospels.
    - >
      THE SPICES, which cut AGAINST this study's conclusion and are now stated as the strongest form
      of the two-Sabbath case. Luke 23:56 has the women return, PREPARE spices, then rest on the
      Sabbath. Mark 16:1 has them BUY spices when the Sabbath was past. On one Sabbath that is
      awkward: why buy on Saturday evening what was already prepared on Friday evening, in a burial
      window measured in minutes? Two Sabbaths dissolve it -- Wednesday death, Thursday festival
      Sabbath, Friday to buy and prepare, Saturday weekly Sabbath to rest. Materially stronger than
      the "high day" phrase carrying it alone, which is all the study had before.
  effect_on_conclusion: >
    Verdict unchanged, but the cost column grew from one entry to two, and the conclusion now
    itemises both sides in a table rather than conceding a single cost. Friday still holds because
    prosabbaton and Luke 24:21 are explicit statements about WHICH DAY while both Friday costs are
    about HOW TO COUNT, and because Matthew 27:63-64 shows the convention in use by people with no
    stake in it. The study says outright that its own cost column grew while it was being written.
  also_answered: >
    The weekly Sabbath does run Friday sunset to Saturday sunset, on the same evening-to-evening rule
    the study already sets out from Gen 1:5 and Lev 23:32. No change needed; the table encoded it.
  last_updated: "2026-09-06"

revision_2026-09-06d:
  what: "User asked whether a diagram existed for the AD 33 / three-days reconstruction. None did, anywhere on the site."
  added: >
    A flowchart TD in the study, laying the Passion Week out on sunset-to-sunset days with each day
    carrying its night at the front -- three subgraphs (the Preparation, the Sabbath, the first day),
    each split into its night and its daylight, with the tomb status and the running tally marked on
    each half, and a closing node stating the result: three days touched, two nights.
  why_it_earns_its_place: >
    The argument is temporal and the prose was labouring at it. Two things the picture settles at a
    glance that paragraphs do not. The night of the Preparation is the one he was ALIVE for, so it
    never counts on any reconstruction -- which is the thing most readers have to be told twice. And
    the Sabbath is the only COMPLETE day in the tomb, which is why every reckoning of this has to
    lean on the two partial days at either end, Friday or Wednesday alike.
  measured: "464.98px, renders at 100% in the ~563px column. flowchart TD with three direction TB subgraphs linked stage-to-stage, per diagrams.md."
  note: >
    The diagram uses Nisan 14 running Thursday sunset to Friday sunset -- the ESV Study Bible
    article's reckoning, and the one that produces a Friday Passover in AD 33 and so makes the year
    a candidate. That article and the ESVSB's own note on Matt 26:17 disagree on whether the
    crucifixion falls on Nisan 14 or 15; the study already records that the question does not decide
    the year, so the diagram follows the article rather than adjudicating.
  last_updated: "2026-09-06"

revision_2026-09-06e:
  what: >
    User: add depth on types, patterns and prophecies, on what Jesus said about where he was and
    what it achieved, and draw on the cross-reference materials -- "the timing is just a small part
    of this study". Correct. The study was an arithmetic paper with a Jonah reference in it.
  new_material:
    - >
      THE SIGN, AND WHAT JONAH SAID IT WAS. bible_trace on Matt 12:40 returns Jonah 2:1 LXX as a
      quotation-greek link at strength 24, corroborated, sharing a whole clause -- so Jesus is
      quoting, not comparing. Jonah's own prayer then interprets his three days and never mentions a
      fish: "the belly of Sheol" (2:2), "the pit" (2:6), and God does not release him but BRINGS HIM
      UP. Jonah's three days are a burial.
    - >
      THE KARDIA LINK, which is the find of this pass. Jonah 2:3 English (2:4 Hebrew) has him "in
      the heart of the seas" -- bilvav yammim, lemma levav -- and the LXX renders it kardias
      thalasses. Matt 12:40 has kardia tes ges, "the heart of the earth". Jesus takes the noun out
      of the passage he is quoting and moves it from the sea to the ground. Verified in both the
      Hebrew morphology and the lxx-lemmas table, not assumed.
    - >
      THREE DAYS, THREE APPOINTED TIMES. The span is bounded by consecutive festivals in Lev 23 and
      the NT names Christ as the fulfilment of the outer two: Passover (23:5) with 1 Cor 5:7, and
      Firstfruits (23:10-11) with 1 Cor 15:20, 23. Lev 23:11 dates the sheaf "on the day after the
      Sabbath" -- so the resurrection falls on the appointed day for the offering it fulfils, which
      answers "why Sunday" from the calendar rather than only from the Gospels. This is a better
      answer to "why three days" than any arithmetic, and the site had NO Firstfruits material at
      all; it is an open backlog item, so the point is made in this study rather than cross-linked.
    - >
      1 SAMUEL 30:12-13, an uncorroborated quotation-greek link the same trace turned up. v12 has a
      man who had not eaten "three days and three nights"; v13 has him say "I fell sick three days
      ago". Same speaker, same episode, adjacent verses. The idiom demonstrated in the OT, in the
      exact phrase Jesus uses, by someone with no stake in the question. Nothing in the inherited
      cross-reference lists carries it.
    - >
      WHERE HE WAS. Ps 16:10 as the stated prophecy, applied by Peter at Acts 2:31 with the argument
      from David's tomb still being in Jerusalem; Luke 23:43 "today... in paradise"; Eph 4:8-10 the
      descent and the host of captives; 1 Pet 3:19 flagged as genuinely contested rather than quietly
      omitted; Rev 1:18 the keys. Stated plainly that the NT never narrates the interval -- only its
      boundaries and outcome.
    - "WHAT IT ACHIEVED. Heb 2:14-15 (death's holder destroyed, its hostages freed, and the mechanism is THROUGH death); Rev 1:18 (authority transferred); 1 Cor 15:23 (firstfruits means a field is coming)."
  reframed: >
    Hook rewritten so the sign leads and the arithmetic follows, "## The problem" became "## The
    counting problem", and the counting section now says outright why it occupies so much room:
    Scripture states the span twelve times and explains it none, while saying a great deal about
    what the days accomplished. Types & Prophecy in Key Takeaways rebuilt around Jonah's own words,
    the feast sequence and Ps 16:10.
  frontmatter: "description rewritten; bible_references +17; tags gained jonah, leviticus, psalms, method/typology, lang/hebrew -- all already in the site vocabulary."
  size: "2,489 words to 4,897."
  last_updated: "2026-09-06"

review_2026-09-06:
  reviewer: "review-bible-study skill, full adversarial pass on a live file"
  scope: >
    Phases 1-8. Every count re-derived from sblgnt rather than re-read; translator footnotes pulled
    for Matt 12:38-41 and Jonah 1:17-2:6; commentary cross-check against NLT Life Application, which
    the study does not cite; study_gaps; internal links; diagram measured; style pass.
  critical_found: 1
  critical_fixed: 1
  moderate_found: 2
  moderate_fixed: 2
  minor_found: 3
  minor_fixed: 3
  findings:
    - severity: critical
      what: >
        The occurrence count was wrong. "On the third day" is NINE, not eight -- Luke 18:33 ("and on
        the third day he will rise") was missed. John 2:1 is the Cana wedding and is correctly
        excluded. The single miss propagated to six places: the table, "eight times against one" in
        Key Takeaways, "the eight-to-one ratio" in the conclusion, "the eleven others", and "stated
        twelve times" twice.
      why_it_survived: >
        Written from a LIKE query whose pattern I had already had to widen once, and never re-run
        after. Exactly the Phase 4 failure the skill describes -- a quantity claim in the study's own
        voice with nothing external for a reader to check it against.
      fix: "All six corrected: 9 / 3 / 1, totalling 13, with Luke 18:33 added to the reference list. Re-derived twice more after fixing."
    - severity: moderate
      what: >
        Root-fallacy overclaim. The study said God "brings him up -- watta'al, THE VERB USED OF
        RAISING FROM DEATH". Form and gloss check out (alah, H5927), but the verb occurs 889 times
        meaning go up, come up, offer up -- mist in Gen 2:6, a burnt offering in Gen 8:20, Abram
        travelling in Gen 13:1. Not a resurrection term.
      fix: "Rewritten to say what is true: the ordinary verb for going or bringing up, with the burial carried by everything around it rather than by the word."
    - severity: moderate
      what: >
        The study's two Old Testament anchors were never connected, and one noun connects them.
        Jonah 2:6's "pit" and Psalm 16:10's "corruption" are both shachath (H7845); the LXX carries
        the pair as phthora and diaphthora, and diaphthora is what Peter quotes at Acts 2:27, 31. The
        relation is exact: Jonah is brought up FROM the shachath, the Holy One is not left to SEE it.
      how_found: >
        Phase 3's standing footnote pull. The Legacy Standard Bible footnotes Jonah 2:6 "Or
        corruption", which the study had never consulted. Reading alone would not have produced it.
      fix: "Added to the Psalm 16:10 discussion, where it joins the two halves of the study."
    - severity: minor
      what: "Three bare 'genuinely' (the phrase is genuinely open / genuinely difficult / it genuinely delivers)."
      fix: "All three cut; one reworded to 'does deliver' where the emphasis was doing real contrastive work."
    - severity: minor
      what: >
        Discussion question 4 asked the reader to evaluate the study's own method -- "This study
        reaches a conclusion and then names what that conclusion costs." style-guide.md names this
        exactly: questions are for thinking about the subject, never about the study's handling of
        itself, and it solicits credit for the caveats.
      fix: "Replaced with a question about the sign of Jonah itself."
    - severity: minor
      what: "The Jonah 1:17 / 2:1 numbering was used correctly but inconsistently across frontmatter and prose; three translations footnote the discrepancy."
      fix: "One parenthesis added where the quotation is first discussed."
  clean:
    - "Phase 1: all ESV quotations verbatim."
    - "Counts that were right: 'after three days' 3 (Acts 25:1 correctly excluded as Festus), paraskeue 6, prosabbaton a NT hapax."
    - >
      Phase 4 correspondence claims all held. Mark 8:31 / Matt 16:21 confirmed as one occasion --
      both follow Peter's confession and the charge to tell no one. Lev 23:5, 6, 10-11 accurate. The
      kardia link re-verified in the Hebrew morphology AND the lxx-lemmas table. Jonah 2:1 quotation
      at strength 24 corroborated, 1 Sam 30:12 uncorroborated, both as stated.
    - >
      Phase 5: NLT Life Application, uncited by the study, CONFIRMS the central reading -- "Jesus was
      clearly saying that his resurrection would prove his identity as the Messiah" -- and is silent
      on the arithmetic. No contradiction.
    - "Phase 6: study_gaps returns only festival-calendar parallels (Num 28-29, Lev 25) that do not bear on the argument. No statement-of-faith intersection."
    - "Phase 7: placement, tags and provenance all clean. Phase 8: diagram 465px at 100%; no Hebrew in markdown bold."
  last_updated: "2026-09-06"

# Countable claims this study makes in its own voice, as SQL with the answer the prose states.
# Re-run with: cd references/build && uv run python verify_claims.py three-days-and-three-nights
# The exclusions are inside the SQL so `expect` is literally the number printed in the study.
claims:
  - id: third-day-count
    what: '"on the third day", resurrection contexts'
    sql: |
      SELECT COUNT(*) FROM verses WHERE work_id='sblgnt'
        AND (text LIKE '%τρίτῃ ἡμέρᾳ%' OR text LIKE '%ἡμέρᾳ τῇ τρίτῃ%')
        AND NOT (book='John' AND chapter=2 AND verse=1)
    expect: 9
    note: >
      John 2:1 excluded as the Cana wedding. This is the claim that was published as EIGHT --
      Luke 18:33 was missed -- and propagated to six sentences before review caught it.
  - id: after-three-days-count
    what: '"after three days", resurrection contexts'
    sql: |
      SELECT COUNT(*) FROM verses WHERE work_id='sblgnt'
        AND text LIKE '%μετὰ τρεῖς ἡμέρας%'
        AND NOT (book='Acts' AND chapter=25 AND verse=1)
    expect: 3
    note: Acts 25:1 excluded -- Festus, unrelated to the resurrection.
  - id: three-days-three-nights-count
    what: '"three days and three nights" in the NT'
    sql: "SELECT COUNT(*) FROM verses WHERE work_id='sblgnt' AND text LIKE '%τρεῖς νύκτας%'"
    expect: 1
  - id: total-statements
    what: the span stated across all three phrasings
    sql: |
      SELECT (SELECT COUNT(*) FROM verses WHERE work_id='sblgnt'
                AND (text LIKE '%τρίτῃ ἡμέρᾳ%' OR text LIKE '%ἡμέρᾳ τῇ τρίτῃ%')
                AND NOT (book='John' AND chapter=2 AND verse=1))
           + (SELECT COUNT(*) FROM verses WHERE work_id='sblgnt'
                AND text LIKE '%μετὰ τρεῖς ἡμέρας%'
                AND NOT (book='Acts' AND chapter=25 AND verse=1))
           + (SELECT COUNT(*) FROM verses WHERE work_id='sblgnt' AND text LIKE '%τρεῖς νύκτας%')
    expect: 13
    note: the study says "stated thirteen times and explains it none" in two places.
  - id: hades-count
    what: ᾅδης occurrences in the NT
    sql: "SELECT COUNT(*) FROM morphology WHERE work_id='macula-greek-sblgnt' AND lemma='ᾅδης'"
    expect: 10
    note: >
      The study lists all ten inline (Matt 11:23; 16:18; Luke 10:15; 16:23; Acts 2:27, 31;
      Rev 1:18; 6:8; 20:13, 14), so a change here breaks a printed list, not just a number.
  - id: paradeisos-count
    what: παράδεισος occurrences in the NT
    sql: "SELECT COUNT(*) FROM morphology WHERE work_id='macula-greek-sblgnt' AND lemma='παράδεισος'"
    expect: 3
    note: >
      Load-bearing. The whole "which paradise" argument is that there are exactly three, one
      before the ascension (Luke 23:43) and two after (2 Cor 12:4; Rev 2:7). A fourth occurrence
      would not break the argument but would need addressing.
  - id: prosabbaton-hapax
    what: prosabbaton is a New Testament hapax
    sql: "SELECT COUNT(*) FROM morphology WHERE work_id='macula-greek-sblgnt' AND lemma='προσάββατον'"
    expect: 1
  - id: paraskeue-count
    what: paraskeue, all six of the crucifixion day
    sql: "SELECT COUNT(*) FROM morphology WHERE work_id='macula-greek-sblgnt' AND lemma='παρασκευή'"
    expect: 6
  - id: ego-eimi-in-john
    what: ego eimi occurrences in John, of which 4:26 is the first
    sql: |
      SELECT COUNT(*) FROM verses WHERE work_id='sblgnt' AND book='John'
        AND (text LIKE '%Ἐγώ εἰμι%' OR text LIKE '%ἐγώ εἰμι%')
    expect: 23

