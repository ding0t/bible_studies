insight_2026-09-26:
  pass: insight (write the theology as the subject)
  thesis_rewritten:
    old: "The sign Jesus gave was his own burial and return — Sheol's hold on him broken, the keys of Death and Hades changing hands, a firstfruits harvest guaranteed — and the weekday evidence favors a Friday crucifixion three days before a Sunday resurrection."
    new: "In the sign of Jonah God shows that He raises His Son: Jesus went down into Sheol as Jonah did, and God brought Him up holding the keys of Death and Hades, the firstfruits of a harvest that includes you who belong to Him — and the weekday evidence favors a Friday crucifixion three days before a Sunday resurrection."
  added_sentences:
    - "(Lessons about Jesus) God raised Him as He brought Jonah up from the pit. The resurrection is the Father's own answer to the demand for a sign, and He has given it to you."
    - "(The sign) This shows that God answers for His Son: the One who brought Jonah up from the pit raised Jesus from the dead, and the resurrection is His vindication of Jesus as the Christ. So you have the sign the scribes were given, and it is the empty tomb."
    - "(Three appointed times) This shows that God wrote the death and resurrection of His Son into Israel's calendar: Jesus is the Passover lamb sacrificed and the firstfruits raised. A sheaf is waved because a harvest is coming, so you who belong to Christ will be raised after Him (1 Corinthians 15:23)."
    - "(Which paradise) Whichever reading holds, the promise to the thief shows that God receives a dying man who trusts Jesus into His Son's company that same day. That promise is made to you on the same terms."
    - "(What those days achieved) This shows that God overcame death through the death of His Son: Jesus, our Passover lamb, went into death and came out holding its keys. So you need not live in the fear of death that Hebrews 2:15 calls slavery; the One who holds the keys of Death and Hades is the One who died for you."
  not_changed: >
    The prayer is addressed to Jesus in lowercase "you" throughout (existing text); no sentence was
    added there to avoid mixing capitalisation within one prayer. Author may want to recast it and
    close "In Jesus' name. Amen."

