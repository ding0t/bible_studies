stages_2026_11_27:
  scoping: >-
    Topical, built on the ledger; the Scripture spine is how the New Testament grades its own claims.
    No study on the site treats Hosea 11:1 / Matthew 2:15 (cross_study_claims "Hosea 11": only
    Hosea 11:8 in cities-of-the-plain). Acts 17 and Deuteronomy 18 are owned by Foretold Long Ago:
    not used as the frame here.
  exegesis: >-
    Re-queried 2026-11-27 (bible-text.db via query.py; ESV via study_verse):
    Hosea 11:1 is history (Israel the son, Exodus 4:22 'Israel is My firstborn son'), and 11:2-5 at
    once turns to Israel's idolatry and exile: the near referent is the nation. MT לִבְנִי 'my son';
    Brenton LXX τὰ τέκνα αὐτοῦ 'his children'; Matthew 2:15 SBLGNT τὸν υἱόν μου follows the Hebrew,
    with ἵνα πληρωθῇ. Matthew uses πληρόω (G4137) 16 times (SBLGNT, count_only).
    παραβολή (G3850): 50 NT uses, twice in Hebrews: 9:9 (BSB 'illustration', ESV 'symbolic') of the
    tabernacle, 11:19 (BSB 'in a sense', ESV 'figuratively speaking') of Isaac's return. Same word,
    two grades: 9:8 adds τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, the Spirit's intent; 11:19 adds
    none. δηλόω (G1213) is used of the Spirit at Hebrews 9:8 and 1 Peter 1:11 (ἐδήλου τὸ ἐν αὐτοῖς
    πνεῦμα Χριστοῦ), the one verb for a type and for a verbal prediction.
    τύπος (G5179): 1 Corinthians 10:6, Romans 5:14 ('a pattern of the One to come'), Hebrews 8:5
    (of the tabernacle's pattern, quoting Exodus 25:40), Acts 7:44; τυπικῶς at 1 Corinthians 10:11
    with ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν. Acts 2:30-31 προϊδὼν ἐλάλησεν: David as prophet.
    Hebrews 10:5 εἰσερχόμενος εἰς τὸν κόσμον λέγει and Hebrews 2:12 put Psalm 40 and Psalm 22 in
    Christ's mouth.
  ledger_counts_2026_11_27: >-
    Recounted from docs/data/prophecies-of-christ.toml (scratchpad counts.py): 118 entries, tier
    59/31/28; 12 types; 241 uses: fulfilment 87, allusion 82, application 35, split 15, type 12,
    imagery 10. Uses by OT book: Psalms 78, Isaiah 65 (fulfilment+split: Psalms 38, Isaiah 27).
    Speaker messiah: 16 entries, 14 of them Psalms. Passion 26 (widest), 14 of them from the Psalms.
    Control: divine 58, opponents 19, chosen 18, unfulfilled 17, unwitting 4, followers 2.
    Passion week: 38 hung on the chronology's days, 25 on 14 Nisan, 9 on 16 Nisan.
    Text of quoting uses: lxx 51, both 29, neither 24, mt 17; Matthew renders the Hebrew afresh 6
    times, Acts never (lxx 12). Data oddity: david-my-servant-shepherd has control 'unfulfilled'
    with status 'partly'.

thesis: >-
  The New Testament grades its own claims on the Old (fulfilled, a type, applied, echoed), and
  weighed by those grades and by measures anyone can check, the prophecies of Christ show God writing
  His Son into every part of Scripture, speaking in His voice in the Psalms, and bringing it about
  through hands that could not have arranged it. (Approved by the author 2026-11-27.)
outline:
  - {section: "How the apostles grade their claims", says: "six kinds of use; παραβολή twice in Hebrews (9:9 with the Spirit's intent, 11:19 'in a sense'); δηλόω at Hebrews 9:8 and 1 Peter 1:11; the three tiers"}
  - {section: "Out of Egypt: one prophecy weighed", says: "Hosea 11:1 in Hosea (the nation, 11:2 failure, 11:11 new exodus), in Matthew (Hebrew 'My son' against LXX 'his children'; Matthew 2-4 in Israel's order), and the contested further sight (Numbers 23:22 plural / 24:8 singular)"}
  - {section: "What each measure weighs", says: "the card checks, shortened; no odds; links to Known Before and the floor"}
  - {section: "What the whole ledger shows", says: "the Psalms as His voice; Passion Week (plate); Hebrew or Greek (plate); two comings; the LORD's words (link only)"}
  - {section: "The ledger in numbers", says: "build-time markers: dated, measures"}
  - {section: "What the weighing shows of God", says: "inspiration; adoption (Galatians 4:4-7); John 5:39-40"}
