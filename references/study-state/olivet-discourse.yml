insight_2026-09-26:
  pass: "style-guide rule 6 / AGENTS.md 'write the theology as the subject' -- additions only, each derived from the study's existing exegesis"
  thesis_rewrite:
    old: "**The discourse is not a code to be broken. It is a warning against the people who will tell you they have broken it, and a command to be awake when the answer arrives on its own.**"
    new: "**In one sentence: the Father has fixed the day by His own authority, and Jesus, whose word about the temple came true stone for stone, will come as the one sign nobody needs to point out — so you stay awake at the work He gave you, and believe no one who claims to know the hour.**"
    why: "old thesis was contrastive and about the discourse's genre; new one is about God (Acts 1:7, 24:2 + Josephus, 24:27/30, 24:23, 24:45-46, Mark 13:37)"
  added_sentences:
    - section: "The three questions"
      text: "This shows that God orders history on His own timetable and that Jesus answers His disciples truthfully: you are told what you need in order to obey, and the Father keeps the rest."
    - section: "To the disciples, in the second person"
      text: "It was the grace of God, and the endurance Jesus commands of you is the endurance He supplies."
    - section: "Wilderness and inner rooms"
      text: "This shows that God has made His Son's return public by design: Jesus will come the way lightning comes, so no movement, teacher or private revelation stands between you and Him, and none of them is owed your belief."
    - section: "The gathering Jerusalem refused"
      text: "This shows the heart of God in Jesus: the Son of Man who comes with power and great glory is the same Jesus who wept over Jerusalem, and His return is an act of gathering. You can long for the One who is coming, because He has longed to gather His people all along."
    - section: "\"Concerning that day and hour\""
      text: "This is the sovereignty of God over history: the Father has fixed the day and kept it for Himself, so you can leave it with Him and give your attention to what He has given you to do."
    - section: "What \"ready\" actually means"
      text: "So you get ready for Jesus' return the way the faithful servant did, by feeding the household He has put in your care."
    - section: "The same command, tested that same night"
      text: "Jesus kept the men He found asleep, and the endurance they later showed came from Him. That is grace, and it is yours on the same terms: stay awake, and when you find you have slept, return to your Lord and keep watching."
    - section: "Prayer"
      text: "'your Son' -> 'your Son Jesus'; closing 'Amen.' -> 'In Jesus' name. Amen.'"
  confidence_notes: >
    The gathering landing is kept general ("His people") because the study reads 24:31's elect within a
    post-tribulation gathering while placing the church's removal earlier (rapture.md); it does not
    tell the church reader "He will gather you" at 24:31. "Jesus kept the men He found asleep" and
    "the endurance ... came from Him" rest on the study's own "Whatever endurance they later showed was
    not native to them" -- the author may want to check the wording.
  not_landed: "AD 70 and the flight sections were left without an added landing to stay inside budget; the thesis and prayer carry the 'He kept His word' point."

