correction_2026-09-01:
  raised_by: user
  issue: >
    The "Lessons about Jesus" takeaway framed Mark 13:32 as Jesus lacking knowledge -- "he declines
    to know what he could, by his own account, have claimed", "the limit he accepted on his own
    knowledge of it", and later "he knew what would happen and declined to know when". That is
    Christologically careless (declining to know is incoherent, and it reads as a bare denial of the
    Son's omniscience) and it misplaces the verse's own emphasis. User also asked whether the saying
    belongs to the Jewish wedding custom, where the father alone announces the time.
  resolution: >
    Rewrote the takeaway and added a new H2 section, "The Day No One Knows", placed between "This
    Generation"/the far-horizon material and "One Taken, One Left" so it follows Matthew's own order
    (24:36 -> 24:37). Restored the method/textual-criticism tag.
  findings:
    - >
      TEXTUAL: some mss omit "nor the Son" at Matt 24:36 (footnoted by CSB Ancient Faith and NLT).
      Verified directly: SBLGNT and Tischendorf both print oude ho huios, and Mark 13:32 is
      undisputed. Harder reading retained; a scribe softening a hard saying is likelier than one
      inventing it.
    - >
      CHRISTOLOGY: two things, and the second carries the emphasis. (1) The incarnation is real --
      ESV Study Bible on Matt 24:36 takes the two-natures line (Luke 2:52, Heb 5:8 vs John 2:25,
      16:30, 21:17; "apparently speaking in terms of his human nature"), with Chalcedon AD 451 and
      Phil 2:7. (2) The date is the Father's -- NLT Life Application on Mark 13:32: "the emphasis of
      this verse is not on Jesus' lack of knowledge but rather on the fact that no one but God has
      this knowledge."
    - >
      DECISIVE INTERNAL EVIDENCE: Acts 1:7. Same question asked again AFTER the resurrection, when
      incarnational limitation is not in view, and Jesus answers the same way while naming the
      reason -- "times or seasons that the Father has fixed by his own authority" (exousia).
      Authority, not information. Zech 14:7 ("a unique day, which is known to the LORD") is cited at
      this point by NIV Cultural Backgrounds on Matt 24:36.
    - >
      CULTURAL SETTING (supports the study's existing thesis): NIV Cultural Backgrounds on Matt
      24:36 -- "Jewish teachers disagreed among themselves as to whether God had immutably fixed the
      day of redemption... Some tried to calculate dates; others regarded such calculations as
      impossible." Jesus lands hard on the second side, the same move as the birth-pangs checklist.
  jewish_wedding_claim:
    verdict: >
      Conclusion right, evidence too thin to carry it. Included in the study as a weighed claim, NOT
      as the argument's basis -- Acts 1:7 carries it instead. Same discipline rapture.md already
      applies to the wedding pattern generally.
    reasons:
      - >
        Sourcing is devotional, not documentary: the father-approval gate on the groom's departure
        circulates through Messianic/dispensational teaching materials citing each other; no
        Mishnah, Talmud or Josephus passage produced. One source making the case concedes the idiom
        is "not categorically proven."
      - >
        The scholarly cultural commentary explains the same delay differently: NIV Cultural
        Backgrounds on Matt 25:1 attributes the ten virgins' unpredictable timing to "the many
        preparations (and the bride's relatives haggling over the value of the gifts given them)",
        with the ceremony at the groom's parents' home (25:10). No father-approval gate appears.
      - >
        The "idiom" as usually quoted ("I don't know, the angels don't know, only my father knows")
        reproduces Matt 24:36's own three-part structure -- no one / nor the angels / nor the Son /
        but the Father. A saying tracking the verse that closely was more likely shaped BY the verse
        than the verse by it.
    rosh_hashanah_variant: >
      Fares slightly better, still short. The underlying procedure IS primary-source attested and
      was verified for this correction: m. Rosh Hashanah 2:7, via Sefaria -- "after the witnesses
      have been examined and their testimony accepted, the head of the court says: It is sanctified."
      What is NOT attested is the step the argument needs: that "no one knows the day or hour" was a
      recognised idiom MEANING Rosh Hashanah. Jesus also says day *or hour*, where the new-moon
      uncertainty concerns only the day.
  verification: >
    All new ESV quotations re-queried from study-notes.db (Matt 24:36, Acts 1:7, John 2:24-25,
    21:17, Phil 2:7, Zech 14:7, Luke 2:52, Heb 5:8). Greek checked against SBLGNT and Tischendorf
    via query.py. npm run validate clean. mkdocs build --strict run with draft flipped to false to
    exercise the page (the hook otherwise excludes it) -- confirmed the new #the-day-no-one-knows
    anchor and its three subsections render, then reverted to draft: true.
  note_for_publication: >
    The strict build surfaced a real coupling: olivet-discourse.md links olivet-discourse-parables.md,
    so publishing one while the other is still draft: true fails mkdocs build --strict. The two must
    be flipped to draft: false together, or the cross-link removed first.

review_2026-09-04:
  skill: review-bible-study
  reviewer: anthropic/claude-opus-5
  scope: >-
    Phases 1-4 and 6-7 run. Phase 5 (independent commentary cross-check) and a full Phase 8
    reading pass were NOT run -- the review was cut short deliberately, so those remain open.
  checked:
    - All 10 scripture blocks are ESV; 8 sampled and verified verbatim against study-notes.db.
    - "planao (G4105) in Matthew: 8 occurrences confirmed, and 24:4/5/11/24 confirmed as the only
       uses at Louw-Nida 31.8."
    - "blepete in Mark 13 (13:5, 9, 23, 33) confirmed, correctly distinguished from the singular
       blepeis at 13:2."
    - "episynago (G1996) confirmed twice in Matthew 23:37, with the 24:31 recurrence the argument
       leans on."
    - Every internal markdown link resolves; npm run validate clean; provenance current.
  findings:
    - severity: moderate
      status: fixed
      detail: >-
        The planao paragraph claimed "the other four are the wandering sheep of chapter 18
        (domain 15.24)". Three are; the fourth is Matthew 22:29, domain 31.67 -- Jesus telling
        the Sadducees they are mistaken, which is being deceived rather than deceiving anyone.
        The load-bearing claim (24:4/5/11/24 are the only Matthean uses at 31.8) held, so the
        conclusion stands; the supporting sentence now names 22:29 and its distinct sense.
  not_verified:
    - >-
      The claim at the three-Gospel comparison table that the accounts give "the same illustrations
      in the same order" is an ordering claim of exactly the shape Phase 4 warns about, and was not
      checked. It needs the three sequences laid side by side.
    - Phase 5 commentary cross-check.
    - Phase 8 full reading pass for style register.
  tooling_defects_found:
    - >-
      query.py lookup_concordance/lookup_word returned nothing whenever `book` was passed -- the
      Strong's language filter bound its parameters out of order. This review would have reported
      three TRUE claims as unsupported. Fixed, with the failing case now a test.
    - >-
      study_gaps.py selected source links by chapter, so a study citing Matthew 21:18-22 was
      credited with all of Matthew 21 and flagged what 21:5 and 21:42 quote as its omissions. All
      four quotation-tier hits on this study were false positives. Selection is now by verse;
      suppression stays by chapter.

