genre: [psalm, gospel, topical]

thesis: >
  God called Israel's judges אֱלֹהִים because He had lent them His authority to judge, and the same
  psalm sentences them by their own works; when Jerusalem's authorities judged Jesus, He answered
  from that psalm that He, whom the Father consecrated and sent, holds by right the authority they
  only borrowed, and the Father's works He does prove it.
outline:
  - section: "The charge at the Feast of Dedication"
    says: >
      John 10:22-33 in its setting: a feast remembering Antiochus, the king who called himself god;
      the charge "you, being a man, make yourself God" (John 10:33); the accusers are the
      authorities of John 9:22 who had just cast out the healed beggar.
  - section: "One word, two uses: אֱלֹהִים"
    says: >
      Elohim is God (2,601 occurrences) and is also used of judges (Exodus 22:9), of Moses "as God"
      (Exodus 4:16; 7:1), of heavenly beings (Psalm 8:5) and of idols. The grammar usually marks the
      difference: a singular verb when the subject is God (Genesis 1:1), a plural verb when it is
      plural judges (Exodus 22:9). The rule is general and has exceptions (Genesis 20:13; 35:7).
      The name YHWH and the title "Most High" are never given to the judges: they are "sons of the
      Most High" (Psalm 82:6), and the LORD gives His glory to no other (Isaiah 42:8).
  - section: "Psalm 82: judges God appointed, and judged"
    says: >
      Walk-through: God stands in the assembly (82:1, singular verbs); the indictment (82:2); the job
      they were given (82:3-4); their failure (82:5); "I said, you are gods... nevertheless, like men
      you shall die" (82:6-7); the prayer for God Himself to judge (82:8).
  - section: "Who are the gods? A contested reading"
    says: >
      Marked contested. Human judges: they judge among men, die like men, Exodus 22 usage, John
      10:35. Heavenly council: "divine council" (ESV), Psalm 89:5-7, Deuteronomy 32:8 (4Q37, two
      words extant), "die like men" implies they are not. The NIV Cultural Backgrounds Study Bible
      holds both together (heavenly beings with human rulers as their agents). John's use favours
      the human reading; either way God lends the title and God revokes it.
  - section: "\"To whom the word of God came\""
    says: >
      Jesus's argument, John 10:34-36: "your Law"; θεοί quoted exactly as the Septuagint; "Scripture
      cannot be broken"; the lesser-to-greater step from men who received God's word to the One the
      Father consecrated and sent (ἡγίασεν, at the feast of the temple's consecration).
  - section: "The rebuke inside the quotation"
    says: >
      Marked as a reading the text supports and does not state. The men Jesus addressed held God's
      authority to teach and judge (Matthew 23:2-3) and had just cast out the weak man Psalm 82:3-4
      told judges to rescue (John 9:34); Jesus had named them false shepherds (John 10:1; Ezekiel
      34:2-4); their works showed whose children they were (John 8:39-41). Quoting Psalm 82:6 to
      such men set them in the psalm's dock.
  - section: "The works of the Father"
    says: >
      Jesus's answer rests on the works (John 10:25, 37-38; 5:36): the Father is in Him and He in the
      Father. The Father has given all judgment to the Son (John 5:22-23); Psalm 82 closes asking God
      to arise and judge the earth (82:8) -- an echo the New Testament does not draw, marked as such.
      So you may trust Him as the Judge the psalm prayed for, and honour Him as you honour the Father.
  - section: "Not \"little gods\""
    says: >
      Brief: the psalm lends a title for an office and then strips it (82:7); 1 Corinthians 8:5-6;
      point to Pride's treatment of the "little gods" verses rather than repeat it.
