slug: you-are-gods
title: "\"You Are Gods\": Psalm 82, John 10 and the Authority God Gives"
status: drafting
target_path: docs/content/jesus/you-are-gods.md

primary_passage: "John 10:22-39; Psalm 82:1-8"
