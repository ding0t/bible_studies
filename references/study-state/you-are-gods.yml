stages:
  scoping:
    done: true
    notes: >
      User asked for "Psalm 82 and Mt 10"; Jesus quotes Psalm 82:6 in John 10:34-36 (nothing in
      Matthew 10 does), so the study works on John 10 and the user was told. User's hypotheses:
      (1) the term is elohim, used of those given authority by God Almighty, with a distinction
      when it means God / YHWH; (2) John 10 rebukes the Pharisees, teachers given authority like the
      judges of Psalm 82, whose works condemn them; (3) Jesus says He is God and His works show He
      has God's full authority.
  exegesis:
    historical_context:
      done: true
      notes: >
        John 10:22 Feast of Dedication (rededication 164 BC after Antiochus IV, 1 Macc 1:59; ESV
        Study Bible note). NIV/NKJV Cultural Backgrounds note on 10:31: the festival remembered
        Antiochus, "a man who claimed to be divine". 2 Maccabees 9:12 (Brenton Greek): μὴ θνητὸν
        ὄντα ἰσόθεα φρονεῖν ὑπερηφανῶς -- a mortal should not arrogantly think himself equal to God.
        Psalm 82 an Asaph psalm; genre prophetic hymn / community lament (ESV Study Bible).
    literary_context:
      done: true
      notes: >
        John 9 (healing, beggar cast out 9:34, Pharisees 9:40) runs straight into the shepherd
        discourse (10:1-18) and the division (10:19-21); 10:22-39 is at Dedication but 10:26-27
        ("you are not my sheep") continues the shepherd theme, so the opponents are the same in
        substance. "The Jews" in 10:24, 31, 33 are the authorities of 9:22 (they had agreed to
        expel confessors). Psalm 82 frame: psalmist (1, 8), God's speech (2-7) (NIV BTSB).
    content_word_studies:
      done: true
      notes: >
        Psalm 82:1 morphology: אֱלֹהִים subject with נִצָּב (Niphal ptc ms) and יִשְׁפֹּט (Qal impf
        3ms) -- singular; בַּעֲדַת אֵל "in the assembly of El" singular; בְּקֶרֶב אֱלֹהִים "in the midst of
        gods". 82:6 אַתֶּם אֱלֹהִים "you (pl) are gods" + וּבְנֵי עֶלְיוֹן. 82:7 כְּאָדָם "like man",
        כְּאַחַד הַשָּׂרִים "like one of the princes". Exodus 22:9 (Eng) / 22:8 (Heb): אֱלֹהִים with
        יַרְשִׁיעֻן Hiphil impf 3mp -- plural verb, judges. Genesis 1:1 בָּרָא 3ms. Exceptions:
        Genesis 20:13 הִתְעוּ Hiphil perf 3cp; Genesis 35:7 נִגְלוּ Niphal perf 3cp, both with God as
        subject. LXX Psalm 81:1 Ὁ Θεὸς ἔστη ἐν συναγωγῇ θεῶν, ἐν μέσῳ δὲ θεοὺς διακρινεῖ (LXX reads
        "assembly of gods" where MT has "of El"); 81:6 Ἐγὼ εἶπα, θεοί ἐστε, καὶ υἱοὶ ὑψίστου πάντες.
        John 10:34 Ἐγὼ εἶπα· Θεοί ἐστε matches LXX exactly. John 10:35 οὐ δύναται λυθῆναι ἡ γραφή.
        John 10:36 ἡγίασεν. John 10:38 τοῖς ἔργοις πιστεύετε.
      terms:
        - {word: "אֱלֹהִים", language: hebrew, transliteration: "ʾĕlōhîm", strongs_id: H430, gloss: "God; gods; judges; heavenly beings", range_of_meanings: ["God (singular sense, singular verbs)", "gods of the nations", "heavenly beings (Ps 8:5)", "judges acting for God (Ex 22:8-9)", "Moses 'as God' (Ex 4:16; 7:1)", "Samuel's spirit (1 Sam 28:13)"], notes: "2,601 occurrences in macula-hebrew-wlc"}
        - {word: "אֵל", language: hebrew, transliteration: "ʾēl", strongs_id: H410, gloss: "God, god"}
        - {word: "עֶלְיוֹן", language: hebrew, transliteration: "ʿelyôn", strongs_id: H5945, gloss: "Most High"}
        - {word: "יְהוָה", language: hebrew, transliteration: "YHWH", strongs_id: H3068, gloss: "the LORD", notes: "6,513 occurrences; absent from Psalm 82 (an Elohistic psalm)"}
        - {word: "θεοί", language: greek, transliteration: "theoi", strongs_id: G2316, gloss: "gods"}
        - {word: "ἁγιάζω", language: greek, transliteration: "hagiazō", strongs_id: G37, gloss: "consecrate, set apart"}
  hermeneutics:
    cultural_vs_transcultural:
      done: true
      notes: "Office-holders hold delegated authority and answer to God for its use (Romans 13:1-4); the title is lent, not a nature."
    theological_principle:
      done: true
      notes: >
        God shares the work of judging with men and calls them by His name for the office; He never
        shares His name YHWH or His glory. Jesus claims the Father's own works and the Father's own
        judgment, which no lent title covers. Consistent with statement-of-faith.md (Jesus fully God
        and fully man; one God in three persons).
    application_draft:
      done: true
      notes: "Be Transformed and the closing of 'A title lent for an office': authority you hold is lent; you answer for the weak under it."
