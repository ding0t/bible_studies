slug: "taken-before-judgment"
status: draft
target_path: "docs/content/last-things/taken-before-judgment.md"
last_updated: 2026-09-27
genre: "topical typology spanning OT narrative (Genesis 5, 7, 19; 2 Kings 2) and NT epistle/Gospel use (Hebrews 11, 2 Peter 2, Jude, Luke 17)"
word_budget: 4000
thesis: >-
  Enoch, Lot and Elijah were taken out before God's judgment reached them and Noah was kept through
  it, which shows that God distinguishes His own in the day of wrath and knows how to rescue them;
  read as types, they illustrate the promise Jesus and Paul give directly, that the church will be
  caught up before the tribulation.
outline:
  - "Key Takeaways: the types, how much weight typology carries, Jesus as deliverer (rhyomai)."
  - "Reading a type: Romans 5:14; no NT writer pairs Enoch with the rapture; the direct texts carry the doctrine."
  - "Enoch: Genesis 5's broken refrain; hithallekh / LXX euaresteo -> Heb 11:5; laqach thread; Jude 14-15 prophet of judgment; chronology (flood 669 years after Enoch was taken)."
  - "Noah: preserved (phylasso) through; Jesus' picture of His coming after the tribulation; Noah pictures the remnant who enter the kingdom (consistent with one-taken-one-left.md)."
  - "Lot: seized by the hand, 'the LORD being merciful'; Gen 19:22 judgment waits for the rescue; Luke 17:27-30 same-day order; Peter's two verbs, rhyomai = 1 Thess 1:10."
  - "Elijah: taken up alive in view of Elisha; manner of the rapture (1 Cor 15:51-52)."
  - "Where the pattern stops: posttrib objection from Noah and Rev 3:10 stated fairly; answer from Matthew's placement, Luke's order, Gen 19:22; direct texts settle it; what God is like; second-person landing."
stages:
  scoping: {done: true, notes: "Primary passage Genesis 5:21-24; typology marked as illustrative, direct texts in rapture.md carry the doctrine."}
  historical_context: {done: true, notes: "Genesis 5 genealogy refrain (ESVSB note); ANE 'taken' parallels and Genesis silent on Enoch's destination (NIVCBSB); 2 Peter 2:4-10a is a lesser-to-greater argument against false teachers (ESVSB), so 2:9 is a general principle."}
  literary_context: {done: true, notes: "Enoch breaks the 'and he died' refrain twice; Luke 17:26-30 pairs Noah and Lot; Matthew 24:37 sits after 24:29."}
  word_studies: {done: true, notes: "laqach (moved, verified in parent); LXX euaresteo/metatithemi at Gen 5:24 -> Heb 11:5; phylasso (2 Pet 2:5) vs rhyomai (2 Pet 2:7, 9; 1 Thess 1:10); luqqach 2 Kings 2:10."}
  hermeneutics: {done: true, notes: "Enoch = church removed before; Noah = remnant preserved through (dispensational); consistent with statement-of-faith End times and with one-taken-one-left.md."}
  drafting: {done: true, notes: "2026-09-27: opening, thesis, Key Takeaways (with key-takeaways.md format line), outline, Reading a type, Enoch chronology + LXX, Noah remnant reading, Lot Gen 19:22 + Peter's verbs, objection section, discussion questions, references. Moved text tightened; 'Peter draws the comparison Jesus himself draws' garble fixed; divine pronouns recased."}
  validation: {done: true, notes: "npm run validate: only Check 17 provenance warnings (fields deliberately omitted). mkdocs build --strict passes (draft dropped from build)."}
resources_consulted:
  - "ESV Study Bible (Crossway): notes on Gen 5:1-32, 5:22-24; 2 Pet 2:4-10a, 2:9-10a. Confirmed the 'walked' form and Enoch not dying; contributed the lesser-to-greater framing of 2 Pet 2."
  - "NIV Cultural Backgrounds Study Bible: note on Gen 5:24. Contributed: Genesis does not say where Enoch was taken; ANE parallels (Utuabzu, Utnapishtim)."
  - "NIV Biblical Theology Study Bible: notes on Gen 5:24 (seventh from Adam) and 2 Pet 2:9."
  - "bible-text.db: WLC morphology Gen 5:24, 2 Kgs 2:10; LXX lemmas Gen 5:24; WEB Gen 5:25-29, 7:6; unfoldingWord interlinear Heb 11:5, 2 Pet 2:5, 7, 9, 1 Thess 1:10."
