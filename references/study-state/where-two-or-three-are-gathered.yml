  exegesis:
    historical_context:
      done: true
      notes: >
        Reproof before witnesses was established Jewish practice: Lev 19:17 (yakach, LXX elenchō);
        1QS 5:24-6:1 (Community Rule) requires reproof 'in truth, humility and loving-kindness' and
        forbids bringing a matter before the Many without prior reproof before witnesses (Abegg
        transcription, ETCBC Text-Fabric 2.0, extracted 2026-10-01; 5:26 partly reconstructed).
        NIV CBSB: synagogues doubled as courts; exclusion attested in DSS and later rabbis.
    literary_context:
      done: true
      notes: >
        Fourth discourse (ESV SB: 18:1-35 life in the kingdom community). 18:1-5 child; 6-9
        stumbling; 10-14 lost sheep, 'not the will of my Father ... that one of these little ones
        should perish' (ESV omits v11); 15-20 brother who sins; 21-35 forgiveness, unforgiving
        servant, 18:35.
    content_word_studies:
      done: true
      terms:
        - {word: "ἐλέγχω", language: greek, transliteration: elenchō, strongs_id: G1651, gloss: "reprove, show the fault", notes: "Matt 18:15 aorist imperative; LXX Lev 19:17 ἐλεγμῷ ἐλέγξεις renders הוֹכֵחַ תּוֹכִיחַ (yakach H3198); 1QS להוכיח same root."}
        - {word: "κερδαίνω", language: greek, transliteration: kerdainō, strongs_id: G2770, gloss: "gain"}
        - {word: "ἐκκλησία", language: greek, transliteration: ekklēsia, strongs_id: G1577, gloss: "assembly, church", notes: "Gospels: Matt 16:18; 18:17 (2x) only; Mark/Luke/John 0 (SBLGNT, bible_concordance)."}
        - {word: "ἐθνικός / τελώνης", language: greek, transliteration: "ethnikos / telōnēs", strongs_id: "G1482 / G5057", gloss: "Gentile / tax collector"}
        - {word: "δέω / λύω", language: greek, transliteration: "deō / lyō", strongs_id: "G1210 / G3089", gloss: "bind / loose", notes: "ἔσται δεδεμένα: LSB fn 'Gr fut. pft. pass.'; NASB/LSB/CSB 'shall/will have been bound'; ESV/NIV 'shall/will be bound'; CSB fn offers 'will be bound'."}
        - {word: "πρᾶγμα", language: greek, transliteration: pragma, strongs_id: G4229, gloss: "matter, case"}
        - {word: "συμφωνέω", language: greek, transliteration: symphōneō, strongs_id: G4856, gloss: "agree"}
        - {word: "συνάγω", language: greek, transliteration: synagō, strongs_id: G4863, gloss: "gather", notes: "24x in Matthew (SBLGNT); of opponents at 22:34, 26:3, 26:57, 27:62, 28:12. εἰς τὸ ἐμὸν ὄνομα = construction of 28:19 εἰς τὸ ὄνομα."}
