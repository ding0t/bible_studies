genre: [gospel]

thesis: >
  In Matthew 18:15-20 Jesus gives His church a way to go after a brother who has sinned -- alone,
  then with witnesses, then together -- and promises that when it gathers in His name to do it, He,
  God with us, stands among them; so you can confront sin as love, and pray alone knowing He is with
  you, because His presence never waited for a second person.
