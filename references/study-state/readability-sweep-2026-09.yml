slug: readability-sweep-2026-09
title: "Bring the older studies up to the 2026-09-25/26 benchmark: simpler, readable, theology landed"
status: complete
completed: 2026-09-26
started: 2026-09-26

benchmark: >
  The four studies published 2026-09-25/26 (know-the-truth, the-restrainer, kinsman-redeemer,
  wife-of-the-lamb) read markedly better than the rest of the corpus. What they share: under
  word budget (3,200-4,400 words), an "In one sentence:" thesis, a `## Study outline`, and the
  theology landed on the reader (8-25 second-person uses per 1,000 words, "this shows that God ___"
  answered in the prose). Selection scorecard: validator warnings + words/budget + you-per-1k +
  thesis/landing counts, run 2026-09-26.

passes:
  simplify: >
    simplify-bible-study, rule "add nothing". Author gave blanket approval ("fix them all") on
    2026-09-26, so Phase 3 recommendations are applied without a per-study stop -- except Phase 1:
    if a study's point cannot be stated, or disagrees with its own thesis, record it under
    open_questions and leave that study for the author.
  insight: >
    Style-guide "Write toward this" rule 6 plus AGENTS.md "write the theology as the subject". The
    only pass that ADDS prose, so its additions are constrained: no new fact, citation, word study
    or argument -- each added sentence names what the study's existing exegesis already shows about
    God, names the doctrine, and lands it in the second person. Every added sentence is listed in
    the study's state file so the author can read them in one place. Contrastive theses
    ("X, not Y") are rewritten affirmatively.
  read: >
    read-bible-study, rule "change no sentence". Run by a different agent from the one that
    simplified, per that skill's "not the author's own pass". Adds the Study outline.

order_per_study: [simplify, insight, commit, read, commit]
commits: one per study per pass, so study_structure.py --verify-against HEAD stays per-file.

excluded:
  christian-life/be-prepared.md: "uncommitted edits in the working tree at sweep start -- not ours to touch"
  reference_pages: >
    translations, genealogy-times, prophecy-events-times, chronology-anchors,
    ancient-texts-manuscripts, archaeological-sites -- data pages; the budget check fires but the
    fix (split by division) is a separate decision.

