review_2026-10-15: >-
  Independent review-bible-study pass (agent, same day as drafting; draft: true kept). Checked: all 37
  ESV quotations against study-notes.db (all verbatim, right verse, right label); every Strong's
  number, gloss and count (arete 5/4 verses, theios 3, epichoregeo 5 with 4 God/Christ-supplied,
  choregeo 2, spoude 12, argos 8, akarpos 7, enkrateia 4/3 verses, en x7 in 1:5-7) against MACULA
  SBLGNT; all six ESV SB attributions. Brief judgment fair both ways: "natural", "no burden", "joy"
  are carried by Scripture (joy explicitly from outside Peter's list); "no work" is answered by
  1:5 and 1:10 without softening, and the draft does not overclaim effort as merit. Fixes: (1)
  undisclosed fork at 1:3 -- NASB/LSB/NIV/CSB read "by his own glory", now disclosed (argument holds
  either way); (2) "Jesus called us" in Lessons about Jesus now marked "most likely" (ESV SB reads God);
  (3) "first paragraph" -> after the greeting (1:1-2 is the greeting); (4) "the passages around it"
  name joy -> 2 Pet 1 does not; reworded; (5) Neh 8:10 speaker not named in the verse -> 8:9's
  three; (6) "make that calling 'sure'" -> ESV's "confirm", Greek gloss kept; (7) false teachers
  "do not enter" (no such statement in ch. 2) -> "swift destruction" (2 Pet 2:1); (8) two antithesis
  foils rewritten affirmatively (God gives before He asks; Gal 5:23); Matt 23:4 tail trimmed;
  (9) four bare chapter:verse refs given their book; (10) ἔργα tagged G2041; (11) new-birth claim
  grounded in 1 Pet 1:23. Gaps: crossref leads only (Col 3, Rom 8), no unmentioned quotation.
  Siblings (cross_study_claims 2 Peter 1) agree; five sibling edits accurate. Statement of faith
  (Sanctification; Reward for the believer): consistent. Validator: no findings on this file;
  Check 24 errors on the five siblings expected until publish.

