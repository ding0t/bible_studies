  - {word: "ἀργός", strongs: G692, note: "2 Pet 1:8; Jas 2:20; Matt 20:3, 6; also Matt 12:36; 1 Tim 5:13 (x2); Titus 1:12."}
  - {word: "ἄκαρπος", strongs: G175, count: "7: Matt 13:22; Mark 4:19; 1 Cor 14:14; Eph 5:11; Titus 3:14; 2 Pet 1:8; Jude 12."}
  - {word: "ἐγκράτεια", strongs: G1466, count: "4 in 3 verses: Acts 24:25; Gal 5:23; 2 Pet 1:6 (x2)."}
  - {word: "βαρύς", strongs: G926, note: "1 John 5:3 'not burdensome'; Matt 23:4 'heavy burdens'."}
  - {word: "πίστις", strongs: G4102, note: "Gal 5:22 domain 31.88 'faithfulness'; 2 Pet 1:5 domain 31.102 'faith'."}
  - {word: "ἐν", strongs: G1722, note: "Seven times in 1:5-7 joining each quality to the last."}

