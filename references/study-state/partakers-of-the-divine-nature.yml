slug: "partakers-of-the-divine-nature"
title: "Partakers of the Divine Nature"
status: published # scoping | exegesis | hermeneutics | cross-reference | drafting | review | published
target_path: "docs/content/christian-life/partakers-of-the-divine-nature.md"
brief: >
  Author asked on 2026-10-15: "investigate the virtues of sanctification in 2 Peter 1. The christian
  living by the spirit naturally bears fruit. It is no burden. It is no work. It is natural. And joy.
  Work that into recent studies if accurate and appropriate... Spin off a new study if needed or
  extend a relevant one. And link as needed." No backlog entry covers 2 Peter 1.

accuracy_check_of_brief: >-
  Natural fruit: supported (2 Pet 1:4 physis, divine nature; Gal 5:22 karpos against erga of the
  flesh 5:19; John 15:4-5; Matt 7:17-18; Ps 1:3). No burden: supported (1 John 5:3 barys; Matt
  11:30; contrast Matt 23:4 barys of the scribes' burdens; Gal 5:23 no law). Joy: supported but NOT
  in Peter's list itself; drawn from Gal 5:22, John 15:11, 1 Pet 1:8, Neh 8:10, Heb 12:2, Rom 14:17,
  Matt 25:21. "No work": NOT accurate as stated. 2 Pet 1:5 "make every effort" (spoudēn pasan) and
  1:10 "be all the more diligent" (spoudasate); Gal 5:16, 25; Phil 2:12-13; 1 Cor 15:10; Col 1:29.
  The study holds the true part of it: the effort never earns standing (Eph 2:8-9), is drawn from
  God's supply (epichorēgeō, 4 of 5 NT uses God/Christ supplying; 1 Pet 4:11 chorēgeō), and is the
  effort of a living branch. Surfaced to the author rather than softened.

primary_passage: "2 Peter 1:3-11"
genre: ["epistle", "topical"]
