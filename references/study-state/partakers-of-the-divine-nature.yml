  - {word: "ἀρετή", strongs: G703, count: "5 occurrences in 4 verses: 1 Pet 2:9; 2 Pet 1:3; 1:5 (x2); Phil 4:8. God's at 1 Pet 2:9 and 2 Pet 1:3."}
  - {word: "θεῖος", strongs: G2304, count: "3: Acts 17:29; 2 Pet 1:3, 4."}
  - {word: "ἐπιχορηγέω", strongs: G2023, count: "5: Gal 3:5; 2 Cor 9:10; Col 2:19; 2 Pet 1:5, 11."}
  - {word: "χορηγέω", strongs: G5524, count: "2: 2 Cor 9:10; 1 Pet 4:11."}
