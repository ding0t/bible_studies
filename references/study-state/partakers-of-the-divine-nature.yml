thesis: >-
  God has already given you everything a godly life needs and a share in His own nature, so the
  virtues of 2 Peter 1 grow as that nature's fruit: you give them real effort, the effort of a living
  branch, they carry no burden of earning, they come with joy, and they end in a rich welcome into the
  kingdom of your Lord Jesus.

terms:
