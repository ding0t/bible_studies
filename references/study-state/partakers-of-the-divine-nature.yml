  a burden" -> "His burden is light" (affirmative heading, Matt 11:30), outline link updated; (3)
  "Richly provided" split into "What richly measures" (the contested reading, now findable) and
  "The joy of your master". 31 sections, median 106, none over 400; outline anchors verified.
